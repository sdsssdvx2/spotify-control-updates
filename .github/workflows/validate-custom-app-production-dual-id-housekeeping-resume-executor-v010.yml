name: Validate Custom App Production Dual-ID Housekeeping Resume Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-housekeeping-resume-executor-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-housekeeping-resume-executor-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage PS5.1 zero-authority and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='c2b6616fed32b902ab223820e3a439726de61a19';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact #198 cleanup head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0';$core="$d/custom-app-production-dual-id-housekeeping-resume-executor.ps1";$test="$d/test_custom_app_production_dual_id_housekeeping_resume_executor.ps1";$prep="$d/prepare_custom_app_production_dual_id_housekeeping_resume_executor.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-housekeeping-resume-executor-v010.yml'
          $allowed=@($core,$test,$prep,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p -notin $changed){throw "missing changed surface $p"}}
          $pins=@(
            @($core,'6cf870e37b2ad4afc6b4d7eec0538afda595ddb1'),
            @($test,'5a2084201bcd8a3d78475449de8b0bd9e07ea35c'),
            @($prep,'801976ffd45ae9e99c383d6af291992110a4716f'),
            @('validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('validation/custom-app-production-recovery-preflight-v0.1.0/custom-app-production-recovery-preflight.ps1','b1816a24849a559b4da2537aa1b2436124fbee50'),
            @('validation/custom-app-production-recovery-execution-admission-v0.1.0/custom-app-production-recovery-execution-admission.ps1','e8804a7c53ad0d3e5420e037d468d9c397e52529'),
            @('validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$test,$prep)){$tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"};$badCommands=@($ast.FindAll({param($node)if($node-isnot[Management.Automation.Language.CommandAst]){return $false};$name=$node.GetCommandName();return(-not[string]::IsNullOrWhiteSpace($name)-and$name-match'^(?i:return|throw).+')},$true));if($badCommands.Count){$badCommands|ForEach-Object{Write-Error ("ambiguous keyword command in $p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)>")};throw "PS5.1 keyword lexical boundary failed $p"}}
          $raw=Get-Content $core -Raw;foreach($m in @('permit_transaction_id','journal_transaction_id','apply-verified','cleanup-starting','committed-clean','housekeeping-resume-envelope-missing-after-cleanup-starting','Initialize-CustomAppProductionRecoveryHousekeepingResumeV010','Resolve-CustomAppProductionRecoveryHousekeepingResumeGateV010','Read-CustomAppProductionDurableDualTransactionIdBridgeIntegrationPrecommitV010','Read-CustomAppProductionDurableDualTransactionIdBridgeIntegrationReceiptV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010','spicetify_apply_executed=$false','recovery_evidence_retained=$true','requires_new_permit_for_future_update=$true','production_mutation_authorized=$false')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Object Diagnostics.Process','Diagnostics.ProcessStartInfo','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','CreateShortcut','TargetPath','WorkingDirectory =')){if($raw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "forbidden resume executor surface $badToken"}}
          if($raw-match'result_is_authority\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|execution_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped in resume core'}
          $testRaw=Get-Content $test -Raw;foreach($m in @('precleanup_resume_barrier=true','missing_envelope_fail_closed=true','after-cleanup-starting-barrier','after-stage-cleanup','after-app-backup-cleanup','after-persistence-backup-cleanup','before-committed-clean','wrong journal ID','cases=$count','custom-app-production-recovery-plan.ps1','custom-app-production-recovery-preflight.ps1','custom-app-production-recovery-execution-admission.ps1','custom-app-production-recovery-evidence-admission-integration.ps1')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "test marker missing $m"}}
          foreach($p in @($core,$test,$prep)){foreach($badToken in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "managed/domainvpn boundary escaped in $p via $badToken"}}}
          $prepRaw=Get-Content $prep -Raw;foreach($m in @('525c198bd1f15f26464b7f966ab7b2013f946d9a','408e24ce7f66d1f5f23025a196b19cd8a42fcda7','67458cbb96b5d1ed92e26c2b81debd6894044749')){if($prepRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "preparer exact dependency marker missing $m"}}
          'DUAL_ID_HOUSEKEEPING_RESUME_SCOPE_AST_AUTHORITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 75
        run: |
          $prep='validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0/prepare_custom_app_production_dual_id_housekeeping_resume_executor.ps1';& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP;if($LASTEXITCODE){throw 'dependency preparation failed'}
          $pins=@(
            @('validation/custom-app-production-recovery-housekeeping-resume-v0.1.0/custom-app-production-recovery-housekeeping-resume-contract.ps1','7d9f6d8543d944f5141b3282536903af98cbed6a'),
            @('validation/custom-app-production-recovery-housekeeping-resume-v0.1.0/custom-app-production-recovery-housekeeping-resume-store.ps1','c60b80138c8cd4189949a34795fb75a44e8e321e'),
            @('validation/custom-app-production-recovery-housekeeping-resume-v0.1.0/custom-app-production-recovery-housekeeping-resume-writer.ps1','9ebed8dff0d8b1208103411f40192db2946a29f7'),
            @('validation/custom-app-production-recovery-housekeeping-resume-v0.1.0/custom-app-production-recovery-housekeeping-resume-gate.ps1','f238267779564a61b3f45e2060ecb02f63366b60'),
            @('validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/custom-app-production-durable-dual-transaction-id-bridge-integration.ps1','c9a58a181d3c5f5a230fa895785c3a42a928c8cd'),
            @('validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1','3b14280d727287252f71611e4424d78e5705c2f1'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "materialized dependency drift $($p[0])"}}
          'DUAL_ID_HOUSEKEEPING_RESUME_DEPENDENCY_CHAIN_PASS'

      - name: Run inherited normal cleanup plus durable housekeeping resume matrix twice
        shell: powershell
        timeout-minutes: 360
        run: |
          $outer=$env:RUNNER_TEMP;$test='validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0/test_custom_app_production_dual_id_housekeeping_resume_executor.ps1'
          1..2|ForEach-Object{$pass=[int]$_;$runtime=Join-Path $outer ('dihr-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0;try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DIHR_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outer;$env:TMP=$outer};if($exit){throw "dual-ID housekeeping resume matrix failed pass $pass"}}
          'DUAL_ID_HOUSEKEEPING_RESUME_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'};if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dihr-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_HOUSEKEEPING_RESUME_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='c2b6616fed32b902ab223820e3a439726de61a19';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dihr-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-housekeeping-resume-executor-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='6cf870e37b2ad4afc6b4d7eec0538afda595ddb1';test_blob='5a2084201bcd8a3d78475449de8b0bd9e07ea35c';preparer_blob='801976ffd45ae9e99c383d6af291992110a4716f';recovery_plan_blob='ae49409973164052d5830b981d804707f9d62b6c';recovery_preflight_blob='b1816a24849a559b4da2537aa1b2436124fbee50';recovery_execution_admission_blob='e8804a7c53ad0d3e5420e037d468d9c397e52529';recovery_evidence_admission_integration_blob='c92c727b5a2217f5b84a1072608bfc4662e68926';normal_cleanup_head='c2b6616fed32b902ab223820e3a439726de61a19';housekeeping_resume_head='525c198bd1f15f26464b7f966ab7b2013f946d9a';durable_bridge_head='408e24ce7f66d1f5f23025a196b19cd8a42fcda7';precleanup_resume_envelope_barrier=$true;cleanup_starting_missing_envelope_fail_closed=$true;partial_cleanup_restart_resume=$true;permit_id_forward_continuity_only=$true;journal_id_recovery_continuity_only=$true;spicetify_reapply_on_resume=$false;recovery_evidence_retained=$true;resume_matrix_cases=9;matrix_repetitions=2;hard_disabled_candidate_unchanged=$true;managed_payload_changed=$false;launcher_or_shortcut_changed=$false;domainvpn_wrapper_changed=$false;production_main_changed=$false;production_mutation_authority=$false;validated_at=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out 'dual-id-housekeeping-resume-executor-validation.json') -Encoding UTF8
          'DUAL_ID_HOUSEKEEPING_RESUME_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-housekeeping-resume-executor-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dihr-v010-evidence/dual-id-housekeeping-resume-executor-validation.json
          if-no-files-found: error
          retention-days: 14
