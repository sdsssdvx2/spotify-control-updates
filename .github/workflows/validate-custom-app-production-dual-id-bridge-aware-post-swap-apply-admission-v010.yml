name: Validate Custom App Production Dual-ID Bridge-Aware Post-Swap Apply Admission v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage pins parse zero-authority and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='50ea2a4b17c2cfa9441823b9f19d58f96a841e88';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact dual-id bridge-aware finalization head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0'
          $core="$d/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission.ps1";$test="$d/test_custom_app_production_dual_id_bridge_aware_post_swap_apply_admission.ps1";$prep="$d/prepare_custom_app_production_dual_id_bridge_aware_post_swap_apply_admission.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v010.yml'
          $allowed=@($core,$test,$prep,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p-notin$changed){throw "missing changed surface $p"}}
          $pins=@(@($core,'07157511442a6f39d994e8e18163bd53787c527f'),@($test,'c5239033c8e8b017d921b864ad8dc1f5131f7e4b'),@($prep,'e8789ef6fa6540a17e8cdb4d68b4a752a9063e19'),@('validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/custom-app-production-dual-id-bridge-aware-finalization.ps1','9a8133d8cda610efd696fdfa8aff07d785113b54'),@('validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/test_custom_app_production_dual_id_bridge_aware_finalization.ps1','d51a61d7bacbcbea7277bfeb2918a9644e940b30'),@('validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_finalization.ps1','48726179e68eda7f16bbf8de0626ccd8613bc612'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$test,$prep)){$tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"};$text=[IO.File]::ReadAllText((Resolve-Path $p));if($text-match'\breturn[\[\$&\(]' -or $text-match'\bthrow[\[\$\(]'){throw "PowerShell keyword lexical boundary regression $p"}}
          $raw=Get-Content $core -Raw
          foreach($m in @('permit_transaction_id','journal_transaction_id','forward_continuity_uses_permit_id','crash_recovery_uses_journal_id','transaction-finalized','Test-CustomAppProductionPostSwapPermitIntegrityV010','Test-CustomAppProductionPostSwapPermitStageContinuityV010','Test-CustomAppProductionPostSwapConsumptionContinuityV010','Read-CustomAppProductionRecoveryEvidenceV010','consumption_reverified_before_state_checks','consumption_reverified_after_state_checks','session_key_persisted=$false','session_key_exposed=$false')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','System.Diagnostics.Process','spicetify.exe','Invoke-CustomAppProductionSpicetifyApply','launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){if($raw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "forbidden core surface $badToken"}}
          if($raw-match'result_is_authority\s*=\s*\$true|admission_is_authority\s*=\s*\$true|apply_execution_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|additional_mutation_authorized\s*=\s*\$true|live_destination_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped in dual-ID post-swap admission core'}
          $testRaw=Get-Content $test -Raw;foreach($m in @('New-DBAFFixtureV010','Invoke-DBAFFinalizeV010','DBAPSessionKey','DBAPOriginalNewFixturePermit','AddMinutes(-10)','q.x.permit','q.x.store.store','q.x.f.lifecycle','q.x.f.provenance','q.x.f.binding','wrong session key','journal-phase-drift','ledger-corrupt','transaction-reappeared')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "byte-real test marker missing $m"}}
          foreach($badToken in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){foreach($p in @($core,$test,$prep)){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "managed/domainvpn boundary escaped in $p via $badToken"}}}
          $prepRaw=Get-Content $prep -Raw;foreach($m in @('prepare_custom_app_production_dual_id_bridge_aware_finalization.ps1','a4f6d4772afb895dd253a4c82a21643711ac0829','190382903e23d7abc59b525829c5ecd5c76f7ff1')){if($prepRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "preparer exact dependency marker missing $m"}}
          'DUAL_ID_BRIDGE_AWARE_POST_SWAP_APPLY_ADMISSION_SCOPE_PARSE_AUTHORITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 60
        run: |
          $prep='validation/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_post_swap_apply_admission.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
          if($LASTEXITCODE){throw 'dependency preparation failed'}
          $generic='validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1';if((git hash-object $generic).Trim()-cne'190382903e23d7abc59b525829c5ecd5c76f7ff1'){throw 'generic post-swap admission materialization drift'}
          'DUAL_ID_BRIDGE_AWARE_POST_SWAP_APPLY_ADMISSION_DEPENDENCY_CHAIN_PASS'

      - name: Run byte-real dual-ID post-swap admission matrix twice
        shell: powershell
        timeout-minutes: 300
        run: |
          $outer=$env:RUNNER_TEMP;$test='validation/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0/test_custom_app_production_dual_id_bridge_aware_post_swap_apply_admission.ps1'
          1..2|ForEach-Object{
            $pass=[int]$_;$runtime=Join-Path $outer ('dbap-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0
            try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DBAP_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}
            finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outer;$env:TMP=$outer}
            if($exit){throw "dual-ID post-swap admission matrix failed pass $pass"}
          }
          'DUAL_ID_BRIDGE_AWARE_POST_SWAP_APPLY_ADMISSION_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'}
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'}
          if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dbap-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_BRIDGE_AWARE_POST_SWAP_APPLY_ADMISSION_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='50ea2a4b17c2cfa9441823b9f19d58f96a841e88';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dbap-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='07157511442a6f39d994e8e18163bd53787c527f';test_blob='c5239033c8e8b017d921b864ad8dc1f5131f7e4b';preparer_blob='e8789ef6fa6540a17e8cdb4d68b4a752a9063e19';finalization_head='50ea2a4b17c2cfa9441823b9f19d58f96a841e88';durable_bridge_head='408e24ce7f66d1f5f23025a196b19cd8a42fcda7';evidence_bound_atomic_head='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';generic_post_swap_head='a4f6d4772afb895dd253a4c82a21643711ac0829';permit_id_forward_only=$true;journal_id_recovery_only=$true;transaction_finalized_journal_reverified=$true;recovery_evidence_reverified=$true;fresh_remote_observation_fixture=$true;explicit_ephemeral_session_key_fixture=$true;real_permit_hmac=$true;durable_consumption_double_read=$true;byte_real_live_stage_backup_persistence_checks=$true;matrix_cases=10;matrix_repetitions=2;hard_disabled_candidate_unchanged=$true;managed_payload_changed=$false;launcher_or_shortcut_changed=$false;domainvpn_wrapper_changed=$false;production_main_changed=$false;production_mutation_authority=$false;validated_at=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out 'dual-id-bridge-aware-post-swap-apply-admission-validation.json') -Encoding UTF8
          'DUAL_ID_BRIDGE_AWARE_POST_SWAP_APPLY_ADMISSION_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dbap-v010-evidence/dual-id-bridge-aware-post-swap-apply-admission-validation.json
          if-no-files-found: error
          retention-days: 14
