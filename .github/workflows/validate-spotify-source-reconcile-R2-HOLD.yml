name: HOLD exact historic-source reconcile single targeted Windows parse
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - '.github/workflows/validate-spotify-source-reconcile-R2-HOLD.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  focused-readonly-parser-and-historic-catalog:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Parse exact source and verify catalog identity from stable manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $mainHash='af1582ec335807f8f5daa9b3a65b13d567264f326d3c608c082ae02ff0a4cfc0'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/reconcile-current-install-R2.ps1'
          $m=Get-Content 'manifest.json' -Raw|ConvertFrom-Json
          if($m.latest_version -cne '0.6.28' -or $m.latest_files[0].sha256 -cne $mainHash){
            throw 'CURRENT_OFFICIAL_SOURCE_CATALOG_DRIFTED'
          }
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('RECONCILE_R2_PS51_PARSE_FAILED '+[string]$errors[0].Message)}
          $source=[IO.File]::ReadAllText((Resolve-Path $p).Path)
          foreach($mark in @(
            '6ecb2eb6f25a71c4fdb410f227124126d6c3b91e8f3f4591713aaa40a4afe297',
            'e9f0181756cfb84c505c30f54b6061f6d178d3a1936489714b8f4441ba18',
            '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86',
            'af1582ec335807f8f5daa9b3a65b13d567264f326d3c608c082ae02ff0a4cfc0',
            '5ab556c1d90b9f8e6d5784e238ffd1798c5363a0f7cd7b8313d1f106b5b6a285'
          )){if(-not $source.Contains($mark)){throw ('RECONCILE_R2_HISTORIC_IDENTITY_MISSING '+$mark)}}
          Write-Host 'EXACT_OFFICIAL_HISTORICAL_MAIN_ADDON_CATALOG_AND_PS51_PARSE_PASS'
      - name: Execute no-change read-only command under hosted isolated Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/reconcile-current-install-R2.ps1'
          $rows=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p 2>&1)
          if($LASTEXITCODE -ne 0){throw 'RECONCILE_R2_ABORTED_UNEXPECTEDLY'}
          if($rows -cnotcontains 'SPOTIFY_UPDATE_AUTHORIZED=NO;BOOTSTRAP_UPDATE_AUTHORIZED=NO;ORIGINALS_DELETE=NO'){
            throw 'RECONCILE_R2_UNSAFE_TERMINAL_ABSENT'
          }
          if($rows -cnotcontains 'PRIVATE_PATHS_KEYS_LOG_TEXT_EXPORTED=NO'){
            throw 'RECONCILE_R2_OUTPUT_SCOPE_INVALID'
          }
          Write-Host 'RECONCILE_R2_PROCESS_RUNS_READONLY_WITH_NO_INSTALL_GATE_PASS'
