name: Diagnose Custom App Live-Attested v0.1.0

on:
  push:
    branches: [validate/custom-app-live-attested-fixture-canary-v0.1.0]
    paths:
      - '.github/workflows/diagnose-custom-app-live-attested-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact commit executor and receipt result without weakening assertions
        shell: powershell
        run: |
          $src=Resolve-Path 'validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1'
          $diag=Join-Path (Split-Path -Parent $src) 'diagnostic-live-attested-fixture-canary.ps1'
          $text=Get-Content -LiteralPath $src -Raw
          $needle=@'
              Assert-True ([string]$commitAttested.outcome_classification -ceq 'committed-preserved') 'Committed live attestation classification drifted.';Assert-True ([string]$commitAfter.baseline.tree_sha256 -ceq [string]$new.tree_sha256) 'Committed live runtime did not reach exact remote tree.';Assert-True ([string]$commitBefore.persistence.fingerprint -ceq [string]$commitAfter.persistence.fingerprint) 'Committed live persistence changed.';Assert-True ([string]$commitBefore.provenance.git.file_sha256 -ceq [string]$commitAfter.provenance.git.file_sha256) 'Committed live git provenance bytes changed.'
          '@.Trim()
          $replacement=@'
              Write-Host ('DIAG_COMMIT_RESULT status='+[string]$commitResult.status+' reason='+[string]$commitResult.reason+' committed='+[string]$commitResult.committed+' rolled_back='+[string]$commitResult.rolled_back+' fixture_authorized='+[string]$commitResult.fixture_canary_execution_authorized)
              Write-Host ('DIAG_COMMIT_RECEIPT class='+[string]$commitAttested.outcome_classification+' receipt_reason='+[string]$commitAttested.receipt.outcome_reason+' safe='+[string]$commitAttested.outcome_safe+' qualified='+[string]$commitAttested.outcome_evidence_qualified+' before_tree='+[string]$commitAttested.receipt.before_runtime_tree_sha256+' after_tree='+[string]$commitAttested.receipt.after_runtime_tree_sha256+' permit_remote='+[string]$commitAttested.receipt.remote_tree_sha256)
              Assert-True ([string]$commitAttested.outcome_classification -ceq 'committed-preserved') 'Committed live attestation classification drifted.';Assert-True ([string]$commitAfter.baseline.tree_sha256 -ceq [string]$new.tree_sha256) 'Committed live runtime did not reach exact remote tree.';Assert-True ([string]$commitBefore.persistence.fingerprint -ceq [string]$commitAfter.persistence.fingerprint) 'Committed live persistence changed.';Assert-True ([string]$commitBefore.provenance.git.file_sha256 -ceq [string]$commitAfter.provenance.git.file_sha256) 'Committed live git provenance bytes changed.'
          '@.Trim()
          $count=([regex]::Matches($text,[regex]::Escape($needle))).Count
          if($count -ne 1){throw "Diagnostic injection anchor drift: $count"}
          $text=$text.Replace($needle,$replacement)
          [IO.File]::WriteAllText($diag,$text,[Text.UTF8Encoding]::new($false))
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $diag
          exit $LASTEXITCODE
