name: Diagnose Custom App Live-Attested v0.1.0

on:
  push:
    branches: [validate/custom-app-live-attested-fixture-canary-v0.1.0]
    paths:
      - '.github/workflows/diagnose-custom-app-live-attested-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture and compact exact live-attested trace
        shell: powershell
        run: |
          $trace=Join-Path $env:RUNNER_TEMP 'live-attested-trace.txt'
          $runner=Join-Path $env:RUNNER_TEMP 'run-live-attested-trace.ps1'
          @'
          $ErrorActionPreference='Continue'
          Set-PSDebug -Trace 2
          . (Resolve-Path 'validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1')
          Set-PSDebug -Off
          '@ | Set-Content -LiteralPath $runner -Encoding UTF8
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner *> $trace
          $code=$LASTEXITCODE
          Write-Host '=== COMPACT LIVE-ATTESTED TRACE ==='
          $matches=@(Select-String -LiteralPath $trace -Pattern 'commitResult|commitAttested|outcome_classification|outcome_reason|executor_status|status =|reason =|denied-|rolled-back|committed-fixture-canary|fixture-canary' -CaseSensitive:$false)
          if($matches.Count -gt 240){$matches=$matches[($matches.Count-240)..($matches.Count-1)]}
          $matches|ForEach-Object{Write-Host $_.Line}
          Write-Host ('TRACE_EXIT_CODE='+$code)
          exit $code
