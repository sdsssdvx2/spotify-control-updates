name: Validate v0.6.22 Bootstrap 1.0.6 E2E

on:
  push:
    branches:
      - release/v0.6.22-addon-source-registry-r11
    paths:
      - 'manifest.json'
      - 'packages/v0.6.22/**'
      - 'validation/v0.6.22-bootstrap-e2e/**'
      - '.github/workflows/validate-v0.6.22-bootstrap-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'packages/v0.6.22/**'
      - 'validation/v0.6.22-bootstrap-e2e/**'
      - '.github/workflows/validate-v0.6.22-bootstrap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap-e2e-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact v0.6.22 manifest and Bootstrap identity
        shell: powershell
        run: |
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.22'){throw "Expected v0.6.22 manifest, got $($m.latest_version)"}
          if($m.source_commit -ne 'db4dd0e4357cbf03ea95dd8773c0be173b2c91fc'){throw 'v0.6.22 immutable source commit mismatch.'}
          if($m.payload_set_sha256 -ne 'cb396442ac874504a04d4acb0034d3cb9fa11acce290da18e639c2dbe8e5a091'){throw 'v0.6.22 payload set mismatch.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 identity changed.'}
          $edge=@($m.updates|Where-Object{$_.from_version -eq '0.6.21' -and $_.to_version -eq '0.6.22'})
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'Exact v0.6.21 -> v0.6.22 edge missing or ambiguous.'}
          Write-Host 'V0622_BOOTSTRAP_E2E_MANIFEST_PASS'

      - name: Parse Bootstrap E2E sources
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.22-bootstrap-e2e/prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 Bootstrap fixture builder failed compile.'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'validation/v0.6.22-bootstrap-e2e/run_bootstrap_cycle.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'v0.6.22 Bootstrap E2E PowerShell parse failed.'}
          Write-Host 'V0622_BOOTSTRAP_E2E_SOURCE_PARSE_PASS'

      - name: Prepare exact v0.6.21 installed fixture
        shell: powershell
        run: |
          python validation/v0.6.22-bootstrap-e2e/prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 Bootstrap fixture preparation failed.'}

      - name: Exact Bootstrap 1.0.6 v0.6.21 to v0.6.22 cycle
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22-bootstrap-e2e/run_bootstrap_cycle.ps1 -Fixture ci-bootstrap-fixture-v0621-to-v0622
          if($LASTEXITCODE -ne 0){throw "Bootstrap v0.6.21 -> v0.6.22 E2E failed: $LASTEXITCODE"}

      - name: Cleanup fixture tree
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath ci-bootstrap-fixture-v0621-to-v0622 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ci-bootstrap-fixture -Recurse -Force -ErrorAction SilentlyContinue
