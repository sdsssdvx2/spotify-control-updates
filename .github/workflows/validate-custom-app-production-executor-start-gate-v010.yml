name: Validate Custom App Production Executor Start Gate v0.1.0

on:
  push:
    branches: [validate/custom-app-production-executor-start-gate-v0.1.0]
    paths: ['validation/custom-app-production-executor-start-gate-v0.1.0/**','.github/workflows/validate-custom-app-production-executor-start-gate-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-consumption-persistence-v0.1.0]
    paths: ['validation/custom-app-production-executor-start-gate-v0.1.0/**','.github/workflows/validate-custom-app-production-executor-start-gate-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='1b680f0fc637b393aa7571690c8aa40adda59800';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated persistence head'}
          $a=@('.github/workflows/validate-custom-app-production-executor-start-gate-v010.yml','validation/custom-app-production-executor-start-gate-v0.1.0/custom-app-production-executor-start-gate.ps1','validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $a});if($b.Count){throw "scope escaped: $($b -join ', ')"};foreach($x in $a){if($x -notin $c){throw "missing $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_SCOPE_PASS'

      - name: Prove exact immutable dependency pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-executor-start-gate-v0.1.0/custom-app-production-executor-start-gate.ps1','1fa3ca9e77b4c8a48ef56afd656fd102e1636676'),
            @($h,'validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1','f63b309beacd2a8f822f6f8c2801c7bb68409c35'),
            @('1b680f0fc637b393aa7571690c8aa40adda59800','validation/custom-app-production-consumption-persistence-v0.1.0/custom-app-production-consumption-persistence.ps1','d5b70c943d0880e98ee907ae52d4c02ad8720f73'),
            @('1b680f0fc637b393aa7571690c8aa40adda59800','validation/custom-app-production-consumption-persistence-v0.1.0/custom-app-production-consumption-persistence-contract-v011.ps1','07de3a6d3aec00636d8b1c7bd20dcbc72d1b7ada'),
            @('1b680f0fc637b393aa7571690c8aa40adda59800','validation/custom-app-production-consumption-persistence-v0.1.0/test_custom_app_production_consumption_persistence_v011.ps1','85f347144c5a5c5a323b61c0179d7da2aab6e1da'),
            @('ed7fa27fc9bfaa78858e130743a2de508a3c0bf9','validation/custom-app-production-executor-consumption-v0.1.0/custom-app-production-executor-consumption.ps1','ac1459254ce060806a338a443c755bbc9f65c9a2'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_PINS_PASS'

      - name: Parse and audit read-only eligibility separation
        shell: powershell
        run: |
          $d='validation/custom-app-production-executor-start-gate-v0.1.0';foreach($f in @("$d/custom-app-production-executor-start-gate.ps1","$d/test_custom_app_production_executor_start_gate.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-executor-start-gate.ps1" -Raw;foreach($m in @('Read-CustomAppProductionConsumptionStoreV010','Test-CustomAppProductionConsumptionEnvelopeV010','Test-CustomAppProductionExecutorConsumptionStateV010','Test-CustomAppProductionPermitV010','consumption-permit-continuity-valid','persisted-consumption-superseded-by-newer-same-app','staging_eligible=$true','eligibility_is_authority=$false','requires_fresh_revalidation_before_stage_acquisition=$true','requires_fresh_revalidation_after_stage=$true','requires_fresh_revalidation_before_apply=$true','stage_acquisition_authorized=$false','executor_may_stage=$false','executor_may_apply=$false','production_execution_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "start-gate marker missing $m"}}
          foreach($x in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Item','Remove-Item','Copy-Item','Move-Item','Set-Content','Add-Content','Out-File','[IO.File]::Write','[IO.File]::Replace','Save-CustomAppProductionConsumptionStateV010','Initialize-CustomAppProductionConsumptionStoreV010','Save-AddonState','spicetify apply','spicetify config')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "start gate gained side effect primitive $x"}}
          if($core -match 'eligibility_is_authority\s*=\s*\$true|stage_acquisition_authorized\s*=\s*\$true|executor_may_stage\s*=\s*\$true|executor_may_apply\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'start gate authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_executor_start_gate.ps1" -Raw;foreach($m in @('wrong-consumption-id','wrong-key','expired-permit','user-removed','runtime-drift','source-drift','binding-drift','tampered-hmac','store-lock-contention','store-tamper','future-consumption-time','multi-different','superseded-same-app',"-Name 'future-app'",'authority-tampered eligibility','eligibility fingerprint tamper')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "start-gate coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_PARSE_AUDIT_PASS'

      - name: Run executor-start gate matrix twice
        shell: powershell
        run: |
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1';if($LASTEXITCODE){throw "executor-start gate matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_MATRIX_REPEAT_PASS'

      - name: Replay exact parent persistence and Addon Manager SelfTest
        shell: powershell
        run: |
          $reload=Join-Path $env:RUNNER_TEMP 'executor-start-parent-persistence';$env:CUSTOM_APP_CONSUMPTION_RELOAD_ROOT=$reload;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-consumption-persistence-v0.1.0/test_custom_app_production_consumption_persistence_v011.ps1';if($LASTEXITCODE){throw 'persistence parent matrix regression'}
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build;if($LASTEXITCODE){throw 'build failed'};$a='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$m='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne 523216 -or $ah-cne'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw 'addon drift'};if($mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main drift'}
          $s=Join-Path $env:RUNNER_TEMP 'executor-start-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_PARENT_SELFTEST_PASS'

      - name: Prove protected-surface immutability and write evidence
        shell: powershell
        run: |
          $p='1b680f0fc637b393aa7571690c8aa40adda59800';$e=@('.github/workflows/validate-custom-app-production-executor-start-gate-v010.yml','validation/custom-app-production-executor-start-gate-v0.1.0/custom-app-production-executor-start-gate.ps1','validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $e});if($b.Count){throw "unexpected surface $($b -join ', ')"};foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-consumption-persistence-v0.1.0/custom-app-production-consumption-persistence.ps1','validation/custom-app-production-consumption-persistence-v0.1.0/custom-app-production-consumption-persistence-contract-v011.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'};$d='validation/custom-app-production-executor-start-gate-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_persistence_parent=$p;fresh_persistent_reload_required=$true;exact_consumption_id_lookup=$true;different_app_parallel_pending_allowed=$true;same_app_older_consumption_superseded=$true;fresh_permit_and_admission_revalidation=$true;staging_eligibility_only=$true;stage_acquisition_authority=$false;executor_stage_authority=$false;executor_apply_authority=$false;production_execution_authority=$false;production_mutation_authority=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_EXECUTOR_START_GATE_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-executor-start-gate-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-executor-start-gate-v0.1.0/custom-app-production-executor-start-gate.ps1
            validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1
            validation/custom-app-production-executor-start-gate-v0.1.0/ci-evidence.json
          if-no-files-found: error
