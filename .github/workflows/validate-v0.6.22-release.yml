name: Validate Spotify Control v0.6.22 Release

on:
  push:
    branches:
      - release/v0.6.22-addon-source-registry-r11
    paths:
      - 'manifest.json'
      - 'packages/v0.6.22/**'
      - 'validation/v0.6.22/**'
      - '.github/workflows/prepare-v0.6.22-release.yml'
      - '.github/workflows/validate-v0.6.22-release.yml'
      - '.github/workflows/validate-v0.6.22-bootstrap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact release base and allowed scope
        shell: powershell
        run: |
          $base='dacd4faf6a632b6b33571acf16ed4b6e73a865d7'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'v0.6.22 release is not based on exact stable v0.6.21 main.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{
            $_ -notlike 'validation/v0.6.22/*' -and
            $_ -notlike 'packages/v0.6.22/*' -and
            $_ -ne 'manifest.json' -and
            $_ -ne '.github/workflows/prepare-v0.6.22-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.22-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.22-bootstrap-e2e.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.14-r4.yml'
          })
          if($bad.Count){throw "Unexpected v0.6.22 release files: $($bad -join ', ')"}
          $raw=@(git ls-files 'validation/v0.6.22/out/**')
          if($raw.Count){throw "Raw generated candidates must not be tracked: $($raw -join ', ')"}
          Write-Host "V0622_RELEASE_SCOPE_PASS head=$actual files=$($changed.Count)"

      - name: Parse release sources and generated candidate
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.22/build_v0622.py validation/v0.6.22/audit_r11.py validation/v0.6.22/release_transport.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 Python source failed compile.'}
          python validation/v0.6.22/build_v0622.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 candidate build failed.'}
          foreach($file in @('validation/v0.6.22/test_r11_source_adapter.ps1','validation/v0.6.22/out/bin/spotify-control.ps1','validation/v0.6.22/out/bin/addon-manager.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}:{1}: {2}" -f $file,$_.Extent.StartLineNumber,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          $engine=Get-Content validation/v0.6.22/addon_source_adapter_engine.ps1.inc -Raw
          $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseInput($engine,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Source adapter engine PowerShell parse failed.'}
          Write-Host 'V0622_PS51_PARSE_PASS'

      - name: Verify exact candidate, manifest and immutable transports
        shell: powershell
        run: |
          $main='validation/v0.6.22/out/bin/spotify-control.ps1';$addon='validation/v0.6.22/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 281586 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b5ba4dc98b10ea922ce30401b5cddf5a1ab01171366e09b3546ce3cc6fcd80fe'){throw 'v0.6.22 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 268670 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0ee8d30bf7c2fda9d0d8d112b7191b0d0439a1071d284d0cc04a87fe8937c7bc'){throw 'r11 identity mismatch.'}
          if((Get-FileHash validation/v0.6.22/candidate-validation.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ffa767a7bedbe097c314a5cae1b362f8e31cf866e60167d925760bd502606297'){throw 'Validated candidate report drift.'}
          python validation/v0.6.22/release_transport.py --validate-published
          if($LASTEXITCODE -ne 0){throw 'Published v0.6.22 transport validation failed.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.22'){throw 'Unexpected latest_version.'}
          if($m.source_commit -ne 'db4dd0e4357cbf03ea95dd8773c0be173b2c91fc'){throw "Unexpected immutable source commit: $($m.source_commit)"}
          if($m.payload_set_sha256 -ne 'cb396442ac874504a04d4acb0034d3cb9fa11acce290da18e639c2dbe8e5a091'){throw 'Unexpected v0.6.22 payload set.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 contract changed.'}
          Write-Host 'V0622_IMMUTABLE_RELEASE_IDENTITY_PASS'

      - name: Require deterministic transport rebuild
        shell: powershell
        run: |
          python validation/v0.6.22/release_transport.py --build-packages
          if($LASTEXITCODE -ne 0){throw 'Deterministic v0.6.22 transport rebuild failed.'}
          git diff --exit-code -- packages/v0.6.22 validation/v0.6.22/release-metadata.json
          if($LASTEXITCODE -ne 0){throw 'Committed v0.6.22 transports differ from deterministic rebuild.'}
          Write-Host 'V0622_TRANSPORT_DETERMINISM_PASS'

      - name: Structural regression and source-adapter transaction tests
        shell: powershell
        run: |
          python validation/v0.6.22/audit_r11.py
          if($LASTEXITCODE -ne 0){throw 'r11 structural audit failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22/test_r11_source_adapter.ps1
          if($LASTEXITCODE -ne 0){throw 'r11 source adapter fixtures failed.'}
          Write-Host 'V0622_R11_STRUCTURAL_AND_TRANSACTION_PASS'

      - name: Candidate Addon Manager comprehensive SelfTest
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22/out/bin/addon-manager.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'r11 Addon Manager SelfTest failed.'}
          Write-Host 'V0622_R11_SELFTEST_PASS'

      - name: Existing overlay and Star Ratings regressions remain green
        shell: powershell
        run: |
          node --check performance/overlay/lazy-custom-app-loader.js
          node performance/overlay/tests/test-loader.js
          if($LASTEXITCODE -ne 0){throw 'Existing overlay loader regression failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1
          if($LASTEXITCODE -ne 0){throw 'Existing overlay PowerShell regression failed.'}
          $fixture=Join-Path $env:RUNNER_TEMP 'star-ratings.js'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/brimell/spicetify-star-ratings/33aa3d293f9fbb58d7a749a8cea10c318351e6c6/dist/star-ratings.js' -OutFile $fixture
          if((Get-Item $fixture).Length -ne 43396 -or (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne '198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1'){throw 'Star Ratings immutable fixture drift.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/tests/test-star-ratings-patch.ps1 -FixturePath $fixture
          if($LASTEXITCODE -ne 0){throw 'Star Ratings regression failed.'}
          Write-Host 'V0622_EXISTING_PERFORMANCE_REGRESSIONS_PASS'

      - name: Final authority and protected-surface invariants
        shell: powershell
        run: |
          $meta=Get-Content validation/v0.6.22/release-metadata.json -Raw|ConvertFrom-Json
          $expected=@('better-local-files','eternal-jukebox','ivLyrics','playlist-maker')
          $actual=@($meta.auto_authority|Sort-Object)
          if(($actual -join '|') -ne (($expected|Sort-Object) -join '|')){throw "Automatic authority changed: $($actual -join ', ')"}
          if($meta.authority_expanded -ne $false -or $meta.new_auto_install_authority -ne $false){throw 'r11 expanded automatic mutation/install authority.'}
          if($meta.adapter_fingerprint -ne 'c0611a7b96f6ff09d1e235119efce2f2def6eb6d0a4e8e93e276cfa622c3c42d'){throw 'Source-adapter fingerprint changed.'}
          if($meta.registry_fingerprint -ne '05c40a5339fe59b001ca0f4c4929643fd59e33a3002bae7067425845c85e2f6e'){throw 'r10 registry fingerprint changed.'}
          $engine=Get-Content validation/v0.6.22/addon_source_adapter_engine.ps1.inc -Raw
          foreach($bad in @('Invoke-WebRequest','Invoke-RestMethod','Expand-Archive','Remove-Item','Move-Item','Copy-Item','Start-Process','spicetify apply','spicetify backup','spicetify restore')){if($engine.IndexOf($bad,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Generic source adapter gained forbidden side effect: $bad"}}
          $addon=Get-Content validation/v0.6.22/out/bin/addon-manager.ps1 -Raw
          $rbStart=$addon.IndexOf('function Rollback-LastTransaction {',[StringComparison]::Ordinal);$next=$addon.IndexOf("`nfunction ",$rbStart+1);if($next -lt 0){$next=$addon.Length};$rb=$addon.Substring($rbStart,$next-$rbStart)
          if($rb.IndexOf('Assert-AddonSourceAdapterTransactionAuthorization',[StringComparison]::Ordinal) -ge 0 -or $rb.IndexOf('source_adapter_sha256',[StringComparison]::Ordinal) -ge 0){throw 'RollbackLast became source-adapter dependent.'}
          Write-Host 'V0622_FINAL_AUTHORITY_AND_RECOVERY_PASS'
