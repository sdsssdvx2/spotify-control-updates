name: Fix Performance Phase 2 v0.5.4 SelfTest
on:
  push:
    branches:
      - validate/performance-phase2-v0.5.4-overlay
    paths:
      - 'validation/performance-phase2-v0.5.4/fix_selftest_spacing.py'
      - '.github/workflows/fix-performance-phase2-v054-selftest.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact SelfTest token spacing fix
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.4/fix_selftest_spacing.py
          if($LASTEXITCODE -ne 0){throw "Spacing fixer failed: $LASTEXITCODE"}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/performance-phase2-v0.5.4/runtime_overlay_v054.ps1.inc
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'Spacing fixer produced no runtime helper change.'}
          git commit -m 'Normalize v0.5.4 SelfTest comparison operators'
          git push origin HEAD:validate/performance-phase2-v0.5.4-overlay
