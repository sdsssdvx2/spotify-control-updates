name: Diagnostic Extract Stable Test-PathSafe

on:
  push:
    branches: [validate/custom-app-production-recovery-completion-retirement-admission-integration-v0.1.0]
    paths: ['.github/workflows/diag-extract-stable-test-pathsafe.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  extract:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - name: Rebuild exact stable v0.6.28 and extract Test-PathSafe
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          python validation/v0.6.28/build_v0628.py --build
          if($LASTEXITCODE){throw 'v0.6.28 rebuild failed'}
          $p='validation/v0.6.28/out/bin/addon-manager.ps1'
          $item=Get-Item -LiteralPath $p
          $sha=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if($item.Length -ne 323385 -or $sha -cne '5ab556c1d90b9f8e6d5784e238ffd1798c5363a0f7cd7b8313d1f106b5b6a285'){throw "stable addon drift size=$($item.Length) sha=$sha"}
          $text=[IO.File]::ReadAllText((Resolve-Path $p),[Text.UTF8Encoding]::new($false))
          $start=$text.IndexOf('function Test-PathSafe {',[StringComparison]::Ordinal)
          if($start-lt0){throw 'Test-PathSafe definition missing'}
          $next=$text.IndexOf("`nfunction ",$start+1,[StringComparison]::Ordinal)
          if($next-lt0){$next=$text.Length}
          $block=$text.Substring($start,$next-$start).TrimEnd("`r","`n")
          $bytes=[Text.UTF8Encoding]::new($false).GetBytes($block)
          $h=[Security.Cryptography.SHA256]::Create();try{$blockSha=([BitConverter]::ToString($h.ComputeHash($bytes))).Replace('-','').ToLowerInvariant()}finally{$h.Dispose()}
          Write-Host "STABLE_ADDON_SIZE=$($item.Length)"
          Write-Host "STABLE_ADDON_SHA256=$sha"
          Write-Host "TEST_PATHSAFE_BLOCK_SHA256=$blockSha"
          Write-Host 'TEST_PATHSAFE_BEGIN'
          Write-Host $block
          Write-Host 'TEST_PATHSAFE_END'
