name: Validate Custom App Production Dual-ID New Permit Reservation Persistence v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-new-permit-reservation-persistence-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-new-permit-reservation-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-new-permit-reservation-persistence-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

# The temporary one-shot hardener is intentionally retired; only the bounded validation surface remains.
jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope PS5.1 durable-store security and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='bdc4b8d3d6137ba09deb7cc3684fbd763a966efb';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact dual-ID reservation head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0';$core="$d/custom-app-production-dual-id-new-permit-reservation-persistence.ps1";$fix="$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1";$test="$d/test_custom_app_production_dual_id_new_permit_reservation_persistence.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-new-permit-reservation-persistence-v010.yml'
          $allowed=@($core,$fix,$test,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p -notin $changed){throw "missing changed surface $p"}}
          $pins=@(@($core,'629c09384ac13d2fe148566deffcc413f91cdc5d'),@($fix,'3350cd974bb9f9ae7345e490449c4875d571bf95'),@($test,'4574c3fc0774b03923673454a2b06d8674d7cf4c'),@('validation/custom-app-production-dual-id-new-permit-reservation-v0.1.0/custom-app-production-dual-id-new-permit-reservation.ps1','32af654e5cb3e70293824fa8ca8920114cc3f865'),@('validation/custom-app-production-dual-id-new-permit-reservation-v0.1.0/test_custom_app_production_dual_id_new_permit_reservation.ps1','4dff66c6aeab38f0e5952ea48007f723b8bfba2a'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$fix,$test)){$tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"};$lex=@($ast.FindAll({param($node)if($node-isnot[Management.Automation.Language.CommandAst]){return $false};$n=$node.GetCommandName();return(-not[string]::IsNullOrWhiteSpace($n)-and$n-match'^(?i:return|throw).+')},$true));if($lex.Count){$lex|ForEach-Object{Write-Error ("lexical command $p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)>")};throw "PS5.1 lexical boundary failed $p"}}
          $raw=Get-Content $core -Raw
          foreach($m in @('Flush($true)','[IO.File]::Replace','[IO.FileShare]::None','previous_envelope_sha256','historical_permit_transaction_id','historical_journal_transaction_id','new_permit_transaction_id','transaction_binding_hmac_sha256','reservation_receipt_sha256','after-history-before-current','current-lags-one-recoverable','repaired_current_pointer','reservation_persisted=$true','nonce_durably_reserved=$true','permit_durably_reserved=$true','permit_consumed=$false','requires_persisted_consumption_before_executor=$true','executor_may_start=$false','production_mutation_authorized=$false')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','Diagnostics.ProcessStartInfo','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','spicetify apply','CreateShortcut','TargetPath','WorkingDirectory =','launch-managed.vbs','Spotify-Managed-DomainVPN.vbs')){if($raw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "persistence core escaped network/process/launcher boundary via $badToken"}}
          if($raw-match'session_key_persisted\s*=\s*\$true|session_key_exposed\s*=\s*\$true|permit_consumed\s*=\s*\$true|persistence_is_authority\s*=\s*\$true|executor_may_start\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'persistence authority/session-key contract escaped'}
          $fixRaw=Get-Content $fix -Raw;foreach($m in @('QualifiedHead = ''a0644906a954dd0f487d1177a3ab0fe4b01d3f9a''','QualifiedCoreBlob = ''629c09384ac13d2fe148566deffcc413f91cdc5d''','function Save-CustomAppProductionDualIdNewPermitReservationStateV010','-Persisted $true -Envelope $current.envelope','-Persisted $true -Envelope $e','simulated-crash-after-history-before-current')){if($fixRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "deny-binding fix marker missing $m"}}
          if($fixRaw-match'\)\s*\$true\s+\$|''\s*\$true\s+\$'){throw 'deny-binding fix reintroduced ambiguous adjacent positional boolean binding'}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','Diagnostics.ProcessStartInfo','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','spicetify apply','CreateShortcut','TargetPath','WorkingDirectory =','launch-managed.vbs','Spotify-Managed-DomainVPN.vbs')){if($fixRaw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "deny-binding fix escaped process/launcher boundary via $badToken"}}
          $testRaw=Get-Content $test -Raw;foreach($m in @('if($count -ne 12)','durable_history=true','crash_pointer_repair=true','triple_id_evidence=true','transaction_hmac_durable=true','session_key_persisted=false','permit_consumed=false','simulated history/current crash','lock contention','path escape','wrong HMAC key','reservation transplant','pre-write live drift','post-write drift','same revision different state conflict','envelope tamper','qualified reservation seed fixtures were not retained by parent test','same-root second reservation setup denied','same-root second reservation did not produce distinct evidence')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "test marker missing $m"}}
          'DUAL_ID_NEW_PERMIT_RESERVATION_PERSISTENCE_SCOPE_AST_DURABILITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 90
        run: |
          $prep='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/prepare_custom_app_production_dual_id_new_permit_readiness.ps1';& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP;if($LASTEXITCODE){throw 'parent dependency preparation failed'}
          $pins=@(@('validation/custom-app-production-dual-id-new-permit-reservation-v0.1.0/custom-app-production-dual-id-new-permit-reservation.ps1','32af654e5cb3e70293824fa8ca8920114cc3f865'),@('validation/custom-app-production-dual-id-new-permit-reservation-v0.1.0/test_custom_app_production_dual_id_new_permit_reservation.ps1','4dff66c6aeab38f0e5952ea48007f723b8bfba2a'),@('validation/custom-app-production-dual-id-new-permit-issuer-v0.1.0/custom-app-production-dual-id-new-permit-issuer.ps1','c3a79490d569798775696626d10f73485275c4bc'),@('validation/custom-app-production-dual-id-new-permit-issuance-admission-v0.1.0/custom-app-production-dual-id-new-permit-issuance-admission.ps1','731c6d096298199b784d3da8b3a9610ff880cd98'),@('validation/custom-app-production-permit-reservation-v0.1.0/custom-app-production-permit-reservation.ps1','54c1c6a3be4b8646d87a06cef9903ebb01479fd6'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "qualified dependency drift $($p[0]) $actual != $($p[1])"}}
          'DUAL_ID_NEW_PERMIT_RESERVATION_PERSISTENCE_DEPENDENCY_CHAIN_PASS'

      - name: Compose exact PS5.1 deny-binding fix and run inherited reservation plus durable persistence matrix twice
        shell: powershell
        timeout-minutes: 420
        run: |
          $core='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/custom-app-production-dual-id-new-permit-reservation-persistence.ps1';$fix='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1'
          if((git hash-object $core).Trim()-cne'629c09384ac13d2fe148566deffcc413f91cdc5d'){throw 'base persistence core drift before composition'};if((git hash-object $fix).Trim()-cne'3350cd974bb9f9ae7345e490449c4875d571bf95'){throw 'deny-binding fix drift before composition'}
          $baseText=[IO.File]::ReadAllText((Resolve-Path $core));$fixText=[IO.File]::ReadAllText((Resolve-Path $fix));[IO.File]::WriteAllText((Resolve-Path $core),($baseText+"`r`n"+$fixText),[Text.UTF8Encoding]::new($false))
          $tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $core),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'composed persistence core PS5.1 parse failed'}
          $outer=$env:RUNNER_TEMP;$outerTemp=$env:TEMP;$outerTmp=$env:TMP;$test='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/test_custom_app_production_dual_id_new_permit_reservation_persistence.ps1'
          1..2|ForEach-Object{$pass=[int]$_;$runtime=Join-Path $outer ('dinpp-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0;try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DINPP_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outerTemp;$env:TMP=$outerTmp};if($exit){throw "dual-ID reservation persistence matrix failed pass $pass"}}
          'DUAL_ID_NEW_PERMIT_RESERVATION_PERSISTENCE_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'};if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dinpp-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_NEW_PERMIT_RESERVATION_PERSISTENCE_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='bdc4b8d3d6137ba09deb7cc3684fbd763a966efb';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dinpp-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-new-permit-reservation-persistence-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='629c09384ac13d2fe148566deffcc413f91cdc5d';deny_binding_fix_blob='3350cd974bb9f9ae7345e490449c4875d571bf95';test_blob='4574c3fc0774b03923673454a2b06d8674d7cf4c';reservation_head=$base;durable_history=$true;crash_pointer_repair=$true;ps51_named_deny_binding=$true;triple_id_evidence=$true;transaction_hmac_durable=$true;session_key_persisted=$false;permit_consumed=$false;zero_authority=$true;managed_entrypoint_unchanged=$true;domainvpn_wrapper_boundary_unchanged=$true}|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $out 'validation-evidence.json') -Encoding UTF8
          Copy-Item 'validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/custom-app-production-dual-id-new-permit-reservation-persistence.ps1' $out
          Copy-Item 'validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1' $out
          Copy-Item 'validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0/test_custom_app_production_dual_id_new_permit_reservation_persistence.ps1' $out
          'DUAL_ID_NEW_PERMIT_RESERVATION_PERSISTENCE_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-new-permit-reservation-persistence-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dinpp-v010-evidence
          if-no-files-found: error
