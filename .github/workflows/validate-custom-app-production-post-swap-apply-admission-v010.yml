name: Validate Custom App Production Post-Swap Apply Admission v0.1.0

on:
  push:
    branches: [validate/custom-app-production-post-swap-apply-admission-v0.1.0]
    paths: ['validation/custom-app-production-post-swap-apply-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-post-swap-apply-admission-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-transaction-finalization-v0.1.0]
    paths: ['validation/custom-app-production-post-swap-apply-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-post-swap-apply-admission-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='75a39eea7b0ef7d35d193962607752ef1a873ae0';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated transaction-finalization head'}
          $a=@('.github/workflows/validate-custom-app-production-post-swap-apply-admission-v010.yml','validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1','validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $a});if($b.Count){throw "scope escaped: $($b -join ', ')"};foreach($x in $a){if($x -notin $c){throw "missing $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_SCOPE_PASS'

      - name: Prove exact immutable dependency pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1','190382903e23d7abc59b525829c5ecd5c76f7ff1'),
            @($h,'validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1','37c31c50e3bcb395a10b1ca19ef855dfc6898262'),
            @('75a39eea7b0ef7d35d193962607752ef1a873ae0','validation/custom-app-production-transaction-finalization-v0.1.0/custom-app-production-transaction-finalization.ps1','2958ae3f92173215d32ef8bf284a9433c52caa61'),
            @('75a39eea7b0ef7d35d193962607752ef1a873ae0','validation/custom-app-production-transaction-finalization-v0.1.0/test_custom_app_production_transaction_finalization.ps1','5918c6e97a17a487affdf5bddaed2e5a8b037cee'),
            @('75a39eea7b0ef7d35d193962607752ef1a873ae0','validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1','bd19cbb3da2087e68b2452fe62471d4eca2cd990'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_PINS_PASS'

      - name: Parse and audit read-only zero-authority contract
        shell: powershell
        run: |
          $d='validation/custom-app-production-post-swap-apply-admission-v0.1.0';foreach($f in @("$d/custom-app-production-post-swap-apply-admission.ps1","$d/test_custom_app_production_post_swap_apply_admission.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-post-swap-apply-admission.ps1" -Raw
          foreach($m in @('Test-CustomAppProductionPostSwapPermitIntegrityV010','Test-CustomAppProductionPostSwapPermitStageContinuityV010','permit-stage-identity-continuity-valid','Read-CustomAppProductionConsumptionStoreV010','newer-same-app-consumption-exists','Test-CustomAppRemoteBindingEligibilityV040','Test-CustomAppStageBindingRowV010','post-swap-live-runtime-not-exact-remote-stage','retained-stage-runtime-drift','app-rollback-backup-drift','protected-persistence-drift-before-apply-admission','requires_immediate_rerun_by_apply_executor=$true','requires_exact_spicetify_apply_executor=$true','requires_exact_rollback_on_apply_failure=$true','spicetify_apply_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "post-swap admission marker missing $m"}}
          foreach($x in @('[IO.File]::Write','[IO.File]::Append','[IO.Directory]::Create','[IO.Directory]::Delete','[IO.Directory]::Move','Copy-Item','Move-Item','Remove-Item','Invoke-WebRequest','Invoke-RestMethod','Start-Process','spicetify apply','spicetify config','Restore-SpotifyPersistenceBackup','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppStageAcquisitionV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "post-swap admission gained forbidden side effect $x"}}
          if($core -match 'apply_execution_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|additional_mutation_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true|admission_is_authority\s*=\s*\$true'){throw 'post-swap admission authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_post_swap_apply_admission.ps1" -Raw;foreach($m in @('future-app','finalization-fingerprint-tamper','finalization-authority-tamper','finalized-transaction-workspace-reappeared','wrong-session-key','permit-expired','persisted-store-tamper','wrong-consumption-id','user-removed','binding-drift','stale-binding','live-runtime-drift','git-drift','retained-stage-drift','app-backup-drift','persistence-backup-drift','protected-persistence-drift','prepared-result-tamper','stage-result-tamper','authority-tampered post-swap admission','fingerprint-tampered post-swap admission')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "post-swap admission coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_PARSE_AUDIT_PASS'

      - name: Materialize exact sibling validation dependencies
        shell: powershell
        run: |
          $deps=@(
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($d in $deps){$path=$d[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:POSTSWAP_GIT_SPEC="$($d[0])`:$path";$env:POSTSWAP_GIT_OUT=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['POSTSWAP_GIT_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['POSTSWAP_GIT_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual -cne $d[2]){throw "materialized blob drift $path $actual != $($d[2])"}}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_MATERIALIZATION_PASS'

      - name: Run post-swap apply-admission matrix twice
        shell: powershell
        run: |
          $cmd=". 'validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1'; . 'validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1'"
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd;if($LASTEXITCODE){throw "post-swap apply admission matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_MATRIX_REPEAT_PASS'

      - name: Replay exact transaction-finalization parent contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-transaction-finalization-v0.1.0/test_custom_app_production_transaction_finalization.ps1';if($LASTEXITCODE){throw 'transaction finalization parent regression'}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_PARENT_PASS'

      - name: Rebuild exact candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build;if($LASTEXITCODE){throw 'build failed'};$a='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$m='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne 523216 -or $ah-cne'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw 'addon drift'};if($mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main drift'}
          $s=Join-Path $env:RUNNER_TEMP 'post-swap-apply-admission-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_SELFTEST_PASS'

      - name: Prove protected-surface immutability and write evidence
        shell: powershell
        run: |
          $p='75a39eea7b0ef7d35d193962607752ef1a873ae0';$e=@('.github/workflows/validate-custom-app-production-post-swap-apply-admission-v010.yml','validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1','validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $e});if($b.Count){throw "unexpected surface $($b -join ', ')"};foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-transaction-finalization-v0.1.0/custom-app-production-transaction-finalization.ps1','validation/custom-app-production-atomic-live-swap-v0.1.0/custom-app-production-atomic-live-swap.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'};$d='validation/custom-app-production-post-swap-apply-admission-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_finalization_parent=$p;read_only=$true;permit_crypto_reverified=$true;permit_stage_identity_continuity=$true;persisted_consumption_reloaded=$true;post_swap_live_equals_remote_stage=$true;binding_and_provenance_fresh=$true;retained_stage_and_backups_verified=$true;protected_persistence_verified=$true;apply_execution_authority=$false;spicetify_apply_authority=$false;production_mutation_authority=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_POST_SWAP_APPLY_ADMISSION_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-post-swap-apply-admission-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1
            validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1
            validation/custom-app-production-post-swap-apply-admission-v0.1.0/ci-evidence.json
          if-no-files-found: error
