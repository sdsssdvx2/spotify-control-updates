name: Validate Custom App Production Recovery Routing Dispatch Hard Disabled Integration v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact validated routing fixture dispatch head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v010.yml','validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/build_candidate.py');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_SCOPE_PASS'

      - name: Prove exact immutable source pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/build_candidate.py','c21290958ad5e9ddeebb08b2edfe9a53081a49e1'),
            @('165f820dff82a8c4e5edada443db595f545ddc03','validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py','977ee4a599952877a2eac316fa78ca406326b396'),
            @('93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','0cfb42759a3284dd70b2a8395304f48588ccd1b8')
          );foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b-cne$p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_PINS_PASS'

      - name: Audit builder hard-disabled topology contract
        shell: powershell
        run: |
          $b=Get-Content 'validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/build_candidate.py' -Raw
          foreach($m in @("PARENT_HEAD = '165f820dff82a8c4e5edada443db595f545ddc03'","DISPATCH_HEAD = '93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1'","DISPATCH_BLOB = '0cfb42759a3284dd70b2a8395304f48588ccd1b8'",'preexisting_parent_functions_changed','dispatch_preexisting_callers','dispatch_selftest_executes_dispatch','candidate_reduces_exactly_to_parent','pipeline_true_assignment_inherited_selftest_only','dispatch_normal_path_wiring_added','dispatch_execution_added','generic_auto_authority_expanded','production_main_changed')){if($b.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "builder contract marker missing $m"}}
          if($b.IndexOf("'dispatch_normal_path_wiring_added': False",[StringComparison]::Ordinal)-lt0-or$b.IndexOf("'dispatch_execution_added': False",[StringComparison]::Ordinal)-lt0){throw 'builder hard-disabled report flags missing'}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_BUILDER_AUDIT_PASS'

      - name: Build exact candidate deterministically twice and pin outputs
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'first candidate build failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json"
          $a1=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$m1=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$r1=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();$as1=(Get-Item $a).Length;$ms1=(Get-Item $m).Length
          if($as1-ne1344160-or$a1-cne'8ca2b97ec9460d5d95d695d8205b1186e654ebcd5c8de6e3085b15b78b734644'){throw "candidate addon pin drift $as1 $a1"}
          if($r1-cne'43ccc50fd4aeb0ba3e7a9cbf0ba222c2e25c4bc22b3eb84c78cf7dadffa89949'){throw "candidate report pin drift $r1"}
          if($ms1-ne284327-or$m1-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control parent drift $ms1 $m1"}
          Copy-Item $a "$a.first";Copy-Item $m "$m.first";Copy-Item $r "$r.first"
          python "$d/build_candidate.py";if($LASTEXITCODE){throw 'second candidate build failed'}
          $a2=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$m2=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$r2=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if($a1-cne$a2-or$m1-cne$m2-or$r1-cne$r2){throw 'candidate rebuild nondeterministic'}
          if(-not([IO.File]::ReadAllBytes("$a.first") -ceq [IO.File]::ReadAllBytes($a))){if((Get-FileHash "$a.first" -Algorithm SHA256).Hash.ToLowerInvariant()-cne$a2){throw 'candidate byte rebuild mismatch'}}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_DETERMINISTIC_PIN_PASS'

      - name: Audit exact candidate report zero-authority topology
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0';$r=Get-Content "$d/candidate-validation.json" -Raw|ConvertFrom-Json
          if([string]$r.production_main-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'report production main drift'}
          if([string]$r.parent_head-cne'165f820dff82a8c4e5edada443db595f545ddc03'-or[string]$r.dispatch_head-cne'93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1'-or[string]$r.dispatch_blob-cne'0cfb42759a3284dd70b2a8395304f48588ccd1b8'){throw 'report lineage drift'}
          if([string]$r.dispatch_router_head-cne'2f2f596bb8a86c0b074543992f7634be858821a4'-or[string]$r.dispatch_bounded_executor_head-cne'5a2840d824f1e28e2920657d0e3a8e139d7e8b71'){throw 'report dispatch parent drift'}
          foreach($f in @('pipeline_enabled','pipeline_enablement_implemented','recovery_normal_path_wiring_added','bounded_recovery_normal_path_wiring_added','routing_normal_path_wiring_added','dispatch_normal_path_wiring_added','dispatch_execution_added','generic_auto_authority_expanded','production_main_changed')){if([bool]$r.$f){throw "candidate authority escaped $f"}}
          if(-not[bool]$r.full_chain_function_unchanged-or-not[bool]$r.candidate_reduces_exactly_to_parent){throw 'candidate reduction/full-chain proof missing'}
          if(@($r.preexisting_parent_functions_changed).Count-ne0){throw 'pre-existing parent function changed'}
          if(@($r.dispatch_preexisting_callers).Count-ne0){throw 'dispatch gained pre-existing caller'}
          if([bool]$r.dispatch_selftest_executes_dispatch){throw 'dispatch SelfTest executes dispatcher'}
          if([int]$r.pipeline_true_assignment_count-ne1-or-not[bool]$r.pipeline_true_assignment_inherited_selftest_only){throw 'pipeline force-enable topology drift'}
          if([int]$r.parent_addon_size-ne1325619-or[string]$r.parent_addon_sha256-cne'e7f3ba6bc03cc4ff118f098778fe5ac7f308f1a99ecdc4149131ed2a8156579a'){throw 'report parent candidate drift'}
          if([int]$r.candidate_addon_size-ne1344160-or[string]$r.candidate_addon_sha256-cne'8ca2b97ec9460d5d95d695d8205b1186e654ebcd5c8de6e3085b15b78b734644'){throw 'report candidate identity drift'}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_REPORT_PASS'

      - name: Parse and statically prove dispatch loaded but unreachable
        shell: powershell
        run: |
          $a='validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/out/bin/addon-manager.ps1';$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $a),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("candidate line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw 'candidate PS5.1 parse failed'}
          $text=Get-Content $a -Raw
          foreach($name in @('Get-CustomAppProductionRecoveryRoutingFixtureDispatchSha256V010','Test-CustomAppProductionRecoveryRoutingFixtureDispatchSha256V010','Get-CustomAppProductionRecoveryRoutingFixtureDispatchCanonicalPathV010','Test-CustomAppProductionRecoveryRoutingFixtureDispatchPathWithinV010','Test-CustomAppProductionRecoveryRoutingFixtureDispatchEnvironmentV010','Get-CustomAppProductionRecoveryRoutingFixtureDispatchResultMaterialV010','Test-CustomAppProductionRecoveryRoutingFixtureDispatchResultV010','Invoke-CustomAppProductionRecoveryRoutingFixtureDispatchV010','Invoke-CustomAppProductionRecoveryRoutingDispatchHardDisabledSelfTestV010')){$pat='(?im)^\s*function\s+'+[regex]::Escape($name)+'\s*\{';if(([regex]::Matches($text,$pat)).Count-ne1){throw "candidate function declaration count drift $name"}}
          foreach($m in @("custom-app-production-recovery-routing-fixture-dispatch-v1","2f2f596bb8a86c0b074543992f7634be858821a4","5a2840d824f1e28e2920657d0e3a8e139d7e8b71","CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_SELFTEST_V010_PASS loaded-but-unreachable")){if(([regex]::Matches($text,[regex]::Escape($m))).Count-lt1){throw "candidate marker missing $m"}}
          if(([regex]::Matches($text,'(?im)^\s*\$script:CustomAppProductionPipelineEnabled\s*=\s*\$true\s*$')).Count-ne1){throw 'candidate pipeline true topology drift'}
          if(([regex]::Matches($text,'(?im)^\s*\$script:CustomAppProductionPipelineEnabled\s*=\s*\$false\s*$')).Count-lt1){throw 'candidate pipeline hard-disable missing'}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_STATIC_UNREACHABLE_PASS'

      - name: Run candidate Addon Manager SelfTest in isolated profile
        shell: powershell
        run: |
          $a='validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/out/bin/addon-manager.ps1';$s=Join-Path $env:RUNNER_TEMP 'routing-dispatch-hard-disabled-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'candidate SelfTest failed'}
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1';$expected=@('.github/workflows/validate-custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v010.yml','validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/build_candidate.py');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$expected});if($bad.Count){throw "unexpected changed surface $($bad-join', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/addon-manager.ps1','bin/spotify-control.ps1','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_dispatch_parent='93d4bdb0dfde63e5a643e5ab44023a8b0e5652c1';routing_hard_disabled_parent='165f820dff82a8c4e5edada443db595f545ddc03';dispatch_core_blob='0cfb42759a3284dd70b2a8395304f48588ccd1b8';builder_blob='c21290958ad5e9ddeebb08b2edfe9a53081a49e1';candidate_addon_size=1344160;candidate_addon_sha256='8ca2b97ec9460d5d95d695d8205b1186e654ebcd5c8de6e3085b15b78b734644';candidate_report_sha256='43ccc50fd4aeb0ba3e7a9cbf0ba222c2e25c4bc22b3eb84c78cf7dadffa89949';spotify_control_sha256='69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99';dispatch_loaded=$true;dispatch_preexisting_callers=0;dispatch_selftest_executes_dispatch=$false;full_chain_function_unchanged=$true;candidate_reduces_exactly_to_parent=$true;pipeline_enabled=$false;dispatch_normal_path_wiring_added=$false;dispatch_execution_added=$false;generic_auto_authority_expanded=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'RECOVERY_ROUTING_DISPATCH_HARD_DISABLED_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-routing-dispatch-hard-disabled-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/build_candidate.py
            validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/candidate-validation.json
            validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/ci-evidence.json
            validation/custom-app-production-recovery-routing-dispatch-hard-disabled-integration-v0.1.0/out/bin/addon-manager.ps1
          if-no-files-found: error
