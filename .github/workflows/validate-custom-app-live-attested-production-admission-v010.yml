name: Validate Live-Attested Production Admission v0.1.0

on:
  push:
    branches: [validate/custom-app-live-attested-production-admission-v0.1.0]
    paths:
      - 'validation/custom-app-live-attested-production-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-live-attested-production-admission-v010.yml'
  pull_request:
    branches: [validate/custom-app-live-attested-fixture-canary-v0.1.0]
    paths:
      - 'validation/custom-app-live-attested-production-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-live-attested-production-admission-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact admission-only scope, live-attested lineage, and frozen production
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='c3ce2311268a078ec6f2b4e512e56110aa347d58'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Admission validation is not descended from exact live-attested head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-live-attested-production-admission-v010.yml',
            'validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1',
            'validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Admission validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected admission file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during admission validation.'}
          Write-Host "CUSTOM_APP_LIVE_ADMISSION_SCOPE_PASS head=$actual"

      - name: Prove exact immutable implementation and parent evidence pins
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim()
          $pins=@(
            @($head,'validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1','9bdcbf0a928539e5f3c4e28b7de1d68589e18525'),
            @($head,'validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1','3b2694e4786f470289ea0a64ad8d95da8810ebd2'),
            @('c3ce2311268a078ec6f2b4e512e56110aa347d58','validation/custom-app-live-attested-fixture-canary-v0.1.0/custom-app-live-attested-fixture-canary.ps1','329eb4c7310d5a7ef57df0ac6bc07bbe5c0269c4'),
            @('c3ce2311268a078ec6f2b4e512e56110aa347d58','validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1','09fb6a48149d115ede6fd89fa291c464774a7c54'),
            @('979e9d6362ead31016b9532f98629d6bcc2bbb56','validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1','94c1b0ba8f2454078252a723f89ccc0327cbc181'),
            @('979e9d6362ead31016b9532f98629d6bcc2bbb56','validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1','4644a2bd0fa2c3a047d532df898200ce950274e3')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned admission dependency drift: $($p[1]) $blob != $($p[2])"}}
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_PINS_PASS'

      - name: Parse admission core and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @('validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1','validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1')){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_PS51_PARSE_PASS'

      - name: Audit admission as read-only qualification and zero authority
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1' -Raw
          foreach($m in @('c3ce2311268a078ec6f2b4e512e56110aa347d58','40694858363','40695079070','12819520599','12818612777','Resolve-CustomAppPromotionEligibilityV010','qualification_is_authority=$false','production_permit_issued=$false','admission_is_authority=$false','requires_fresh_revalidation_before_any_future_action=$true',"mutation_mode='deny'",'production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Admission safety marker missing: $m"}}
          foreach($forbidden in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Item','Remove-Item','Copy-Item','Move-Item','Set-Content','Add-Content','Out-File','[IO.File]::','[IO.Directory]::','Save-AddonState','spicetify apply','spicetify config','New-CustomAppFixtureCanaryPermit','Invoke-CustomAppFixtureCanaryExecutor')){if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Admission core gained forbidden action primitive: $forbidden"}}
          if($core -match 'production_permit_issued\s*=\s*\$true' -or $core -match 'production_mutation_authorized\s*=\s*\$true' -or $core -match 'admission_is_authority\s*=\s*\$true'){throw 'Admission core can grant authority.'}
          $test=Get-Content 'validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1' -Raw
          foreach($m in @("New-AdmissionFixture -Name 'future-app' -Source 'owner/future-app'",'user-removed','source-change','remote-stale','runtime-drift','live-authority-corruption')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Admission matrix coverage marker missing: $m"}}
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_ZERO_AUTHORITY_AUDIT_PASS'

      - name: Run admission fail-closed matrix twice
        shell: powershell
        run: |
          1..2|ForEach-Object{
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1'
            if($LASTEXITCODE -ne 0){throw "Admission matrix failed on pass $_."}
          }
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_MATRIX_REPEAT_PASS'

      - name: Replay promotion eligibility parent matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          if($LASTEXITCODE -ne 0){throw 'Promotion eligibility parent matrix regressed.'}
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_ELIGIBILITY_PARENT_REPLAY_PASS'

      - name: Replay exact live-attested commit deny rollback proof
        shell: powershell
        run: |
          function Copy-TreeSafe {
            param([Parameter(Mandatory=$true)][string]$Source,[Parameter(Mandatory=$true)][string]$Destination)
            if(-not(Test-PathSafe $Source 'Container')){throw 'Copy-TreeSafe source is missing.'}
            $src=[IO.Path]::GetFullPath($Source).TrimEnd([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar);$rootItem=Get-Item -LiteralPath $src -Force -ErrorAction Stop
            if(($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'Copy-TreeSafe source root is a reparse point.'};if(Test-Path -LiteralPath $Destination){throw 'Copy-TreeSafe destination already exists.'};[IO.Directory]::CreateDirectory([IO.Path]::GetFullPath($Destination))|Out-Null
            foreach($entry in @(Get-ChildItem -LiteralPath $src -Recurse -Force -ErrorAction Stop)){if(($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw "Copy-TreeSafe source contains reparse point: $($entry.FullName)"};$rel=$entry.FullName.Substring($src.Length).TrimStart([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar);$target=Join-Path $Destination $rel;if($entry.PSIsContainer){[IO.Directory]::CreateDirectory($target)|Out-Null}else{$parent=Split-Path -Parent $target;if(-not(Test-Path $parent)){[IO.Directory]::CreateDirectory($parent)|Out-Null};[IO.File]::Copy($entry.FullName,$target,$false)}}
            return [IO.Path]::GetFullPath($Destination)
          }
          $Version='0.6.5-r17'
          . (Resolve-Path 'validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1')
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_PARENT_LIVE_REPLAY_PASS'

      - name: Rebuild exact v0.4.1 candidate and run full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build
          if($LASTEXITCODE -ne 0){throw 'Exact v0.4.1 candidate rebuild failed.'}
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $addon).Length -ne 523216 -or $ah -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $((Get-Item $addon).Length)/$ah"}
          $mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if($mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control parent drift: $mh"}
          $sandbox=Join-Path $env:RUNNER_TEMP 'live-admission-parent-selftest';$env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData';$env:APPDATA=Join-Path $sandbox 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_PARENT_SELFTEST_PASS'

      - name: Prove production and live-attested parent remain immutable
        shell: powershell
        run: |
          $parent='c3ce2311268a078ec6f2b4e512e56110aa347d58';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@('.github/workflows/validate-custom-app-live-attested-production-admission-v010.yml','validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1','validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1')
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected admission changed surface: $($bad -join ', ')"}
          foreach($path in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-live-attested-fixture-canary-v0.1.0/custom-app-live-attested-fixture-canary.ps1','validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1')){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_IMMUTABILITY_PASS'

      - name: Write admission validation evidence
        shell: powershell
        run: |
          $dir='validation/custom-app-live-attested-production-admission-v0.1.0';$e=[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_live_parent='c3ce2311268a078ec6f2b4e512e56110aa347d58';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';generic_future_app_positive=$true;fresh_current_revalidation=$true;production_permit_issued=$false;production_mutation_authority=$false;live_push_run=[int64]40694858363;live_pr_run=[int64]40695079070;live_push_digest='sha256:e025e59499e1e1e5e7a3f7a260cac57f42d9326325fa434d45b39b677fba8a9c';live_pr_digest='sha256:0966b860f4011939248dab1e56a91eb5917c4f51701bbba9c85814a38fd8eda1'}
          $e|ConvertTo-Json -Depth 6|Set-Content "$dir/ci-evidence.json" -Encoding UTF8
          Write-Host 'CUSTOM_APP_LIVE_ADMISSION_EVIDENCE_PASS'

      - name: Upload admission validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-live-attested-production-admission-v010-${{ github.run_id }}
          path: |
            validation/custom-app-live-attested-production-admission-v0.1.0/custom-app-live-attested-production-admission.ps1
            validation/custom-app-live-attested-production-admission-v0.1.0/test_custom_app_live_attested_production_admission.ps1
            validation/custom-app-live-attested-production-admission-v0.1.0/ci-evidence.json
          if-no-files-found: error
