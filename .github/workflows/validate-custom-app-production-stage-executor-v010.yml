name: Validate Custom App Production Stage Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-stage-executor-v0.1.0]
    paths: ['validation/custom-app-production-stage-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-stage-executor-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-stage-acquisition-admission-v0.1.0]
    paths: ['validation/custom-app-production-stage-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-stage-executor-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='13f4314b81816b1b1c3bb3c2fb4280b6c015f8de';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated stage-admission head'}
          $a=@('.github/workflows/validate-custom-app-production-stage-executor-v010.yml','validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1','validation/custom-app-production-stage-executor-v0.1.0/test_custom_app_production_stage_executor.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $a});if($b.Count){throw "scope escaped: $($b -join ', ')"};foreach($x in $a){if($x -notin $c){throw "missing $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_SCOPE_PASS'

      - name: Prove exact immutable dependency pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1','349d4028997a9cc7a94540286c8b9ba6d6a5b050'),
            @($h,'validation/custom-app-production-stage-executor-v0.1.0/test_custom_app_production_stage_executor.ps1','4bb9d6d3ef7822809e75e28b3fb0cc03cb96861a'),
            @('13f4314b81816b1b1c3bb3c2fb4280b6c015f8de','validation/custom-app-production-stage-acquisition-admission-v0.1.0/custom-app-production-stage-acquisition-admission.ps1','df343c9da93444cdb86753ffa17db8b260baec0c'),
            @('13f4314b81816b1b1c3bb3c2fb4280b6c015f8de','validation/custom-app-production-stage-acquisition-admission-v0.1.0/test_custom_app_production_stage_acquisition_admission.ps1','4d63a76e7c667e41c9867d7a47f5d28568095c9e'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_PINS_PASS'

      - name: Parse and audit isolated staging confinement
        shell: powershell
        run: |
          $d='validation/custom-app-production-stage-executor-v0.1.0';foreach($f in @("$d/custom-app-production-stage-executor.ps1","$d/test_custom_app_production_stage_executor.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-stage-executor.ps1" -Raw
          foreach($m in @('Resolve-CustomAppProductionStageAdmissionV010','Invoke-CustomAppStageAcquisitionV010','Test-CustomAppProductionStageExecutorStageResultV010','Get-CustomAppLocalRuntimeBaseline','fresh-live-tree-changed-during-staging','post-stage-admission-denied','Remove-CustomAppStageWorkspaceV010','staged-verified-post-stage-revalidated','stage_workspace_retained_for_pre_apply=$true','requires_cleanup_if_not_promoted=$true','requires_fresh_revalidation_before_apply=$true','apply_authorized=$false','live_destination_authorized=$false','production_execution_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "stage-executor marker missing $m"}}
          $invokeCount=([regex]::Matches($core,'Invoke-CustomAppStageAcquisitionV010')).Count;if($invokeCount -ne 1){throw "exact stage acquisition call count drifted: $invokeCount"}
          foreach($x in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','Copy-Item','Move-Item','Set-Content','Add-Content','Out-File','spicetify apply','spicetify config','Save-AddonState')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "stage executor gained direct forbidden primitive $x"}}
          if($core -match 'apply_authorized\s*=\s*\$true|live_destination_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true|result_is_authority\s*=\s*\$true'){throw 'stage executor authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_stage_executor.ps1" -Raw;foreach($m in @('pre-stage-wrong-key','stage-acquisition-failed','stage-result-tree-drift','stage-result-authority','stage-directory-missing','live-drift-during-stage','binding-drift-during-stage','store-tamper-during-stage','permit-expired-after-stage','post-stage-time-backwards',"-Name 'future-app'",'apply authority tamper','result fingerprint tamper')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "stage-executor coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_PARSE_AUDIT_PASS'

      - name: Run isolated production stage-executor matrix twice
        shell: powershell
        run: |
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-stage-executor-v0.1.0/test_custom_app_production_stage_executor.ps1';if($LASTEXITCODE){throw "production stage executor matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_MATRIX_REPEAT_PASS'

      - name: Replay exact stage-admission and stage-acquisition contracts
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-stage-acquisition-admission-v0.1.0/test_custom_app_production_stage_acquisition_admission.ps1';if($LASTEXITCODE){throw 'stage-admission regression'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-stage-acquisition-contract-v0.1.0/test_custom_app_stage_acquisition.ps1';if($LASTEXITCODE){throw 'stage-acquisition contract regression'}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_PARENT_CONTRACTS_PASS'

      - name: Rebuild exact candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build;if($LASTEXITCODE){throw 'build failed'};$a='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$m='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne 523216 -or $ah-cne'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw 'addon drift'};if($mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main drift'}
          $s=Join-Path $env:RUNNER_TEMP 'production-stage-executor-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_SELFTEST_PASS'

      - name: Prove protected-surface immutability and write evidence
        shell: powershell
        run: |
          $p='13f4314b81816b1b1c3bb3c2fb4280b6c015f8de';$e=@('.github/workflows/validate-custom-app-production-stage-executor-v010.yml','validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1','validation/custom-app-production-stage-executor-v0.1.0/test_custom_app_production_stage_executor.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $e});if($b.Count){throw "unexpected surface $($b -join ', ')"};foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-stage-acquisition-admission-v0.1.0/custom-app-production-stage-acquisition-admission.ps1','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'};$d='validation/custom-app-production-stage-executor-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_stage_admission_parent=$p;validated_stage_contract='c420a1df6f306c7ba74772b91241cb14abd04738';pre_stage_admission_rerun=$true;isolated_temp_stage_only=$true;fresh_live_tree_post_stage=$true;post_stage_admission_rerun=$true;failed_stage_cleanup=$true;success_workspace_retained_only_for_pre_apply=$true;live_destination_authority=$false;apply_authority=$false;production_execution_authority=$false;production_mutation_authority=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_STAGE_EXECUTOR_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-stage-executor-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1
            validation/custom-app-production-stage-executor-v0.1.0/test_custom_app_production_stage_executor.ps1
            validation/custom-app-production-stage-executor-v0.1.0/ci-evidence.json
          if-no-files-found: error
