name: HOLD publish verified R135 one-approved v2.46.7 main
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/publish-pinned-R135-owner-candidate-HOLD.yml
permissions: {contents: write}
jobs:
  source-pinned-r135-only:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Independently reconstruct exact R135 from published immutable R134
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='validation/spotify-exit-immediate-maintenance-HOLD/'
          $parent=$root+'out/owner-postadoption-default-hold-R134/spotify-control.ps1'
          [void][IO.Directory]::CreateDirectory((Split-Path $parent -Parent))
          $url='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/d1e56745d75e5238e2fd374b3f9be3c31a3ab406/'+$root+'spotify-control-R134-Owner-DefaultHold-HOLD.ps1'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          $wc=New-Object Net.WebClient
          try {[byte[]]$bytes=$wc.DownloadData($url)}finally{$wc.Dispose()}
          $sha=[Security.Cryptography.SHA256]::Create()
          try {$hash=([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-','').ToLowerInvariant()}
          finally{$sha.Dispose()}
          if($bytes.Length -ne 317847 -or
             $hash -cne '99e1bc36667400fa8fc7a5464ec20d3b4e84ee648e979c746c18d9848b0f47fa'){
            throw 'PUBLISHED_R134_PARENT_NOT_PINNED'
          }
          [IO.File]::WriteAllBytes($parent,$bytes)
          & python ($root+'build-owner-v2467-once-R135-HOLD.py')
          if($LASTEXITCODE -ne 0){throw 'R135_PINNED_REBUILD_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ($root+'test-owner-v2467-once-R135-HOLD.ps1')
          if($LASTEXITCODE -ne 0){throw 'R135_GATE_NATIVE_POWERSHELL_FAILED'}
          $file=$root+'out/owner-v2467-one-approved-attempt-R135/spotify-control.ps1'
          $result=Get-Item -LiteralPath $file -Force
          if($result.PSIsContainer -or $result.Length -ne 326533 -or
             ($result.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
             (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne '07407f9dd566616395644a5c5bff8a1255701696dab2a074df062bab3ad279b4'){
            throw 'R135_FINAL_REBUILT_CANDIDATE_NOT_EXACT'
          }
          $null=$null
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R135_WINPS51_FULL_MAIN_PARSE_FAILED'}
          Write-Host 'R135_SOURCE_SHA_PIN_AND_REAL_MUTATION_BOUNDARIES=PASS'
      - name: Publish once to HOLD branch only without altering public main
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='sdsssdvx2/spotify-control-updates'
          if($env:GITHUB_REPOSITORY -cne $repo -or
             $env:GITHUB_REF -cne 'refs/heads/validate/spotify-exit-immediate-maintenance-HOLD'){
             throw 'R135_WRONG_REPO_OR_BRANCH'
          }
          $headers=@{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='SpotifyControl-R135-HOLD-Only'
          }
          $api='https://api.github.com/repos/'+$repo
          $h=Invoke-RestMethod -Method Get -Uri ($api+'/git/ref/heads/validate/spotify-exit-immediate-maintenance-HOLD') -Headers $headers
          if([string]$h.object.sha -cne $env:GITHUB_SHA){throw 'R135_DEV_BRANCH_DRIFT'}
          $m=Invoke-RestMethod -Method Get -Uri ($api+'/git/ref/heads/main') -Headers $headers
          if([string]$m.object.sha -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'R135_PUBLIC_MAIN_DRIFT'
          }
          $path='validation/spotify-exit-immediate-maintenance-HOLD/spotify-control-R135-Owner-OneShot-HOLD.ps1'
          $dest=$api+'/contents/'+$path
          try {
             $existing=Invoke-RestMethod -Method Get -Uri ($dest+'?ref=validate%2Fspotify-exit-immediate-maintenance-HOLD') -Headers $headers -ErrorAction Stop
             throw 'R135_NO_OVERWRITE'
          }catch {
             if($_.Exception.Message -ceq 'R135_NO_OVERWRITE'){throw}
             $response=$_.Exception.Response
             if($null -eq $response -or [int]$response.StatusCode -ne 404){
               throw 'R135_DESTINATION_EXISTENCE_UNCERTAIN'
             }
          }
          $file='validation/spotify-exit-immediate-maintenance-HOLD/out/owner-v2467-one-approved-attempt-R135/spotify-control.ps1'
          $body=@{
            message='build(HOLD): preserve byte-exact R135 owner-approved one-shot Spicetify product main'
            content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
            branch='validate/spotify-exit-immediate-maintenance-HOLD'
          }|ConvertTo-Json -Depth 5 -Compress
          try{
            $new=Invoke-RestMethod -Method Put -Uri $dest -Headers $headers -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ErrorAction Stop
          }catch{throw 'R135_SOURCE_CREATE_FAILED_NO_RETRY'}
          if([string]$new.content.path -cne $path -or
             [int64]$new.content.size -ne 326533 -or
             [string]::IsNullOrWhiteSpace([string]$new.commit.sha)){
             throw 'R135_SOURCE_PUBLICATION_NOT_READBACK_VERIFIED'
          }
          Write-Host 'R135_PUBLISHED_HOLD_ONLY=PASS'
          Write-Host ('R135_PUBLISHED_COMMIT='+[string]$new.commit.sha)
          Write-Host 'PUBLIC_MAIN=UNCHANGED;USER_WINDOWS=UNCHANGED;NATIVE_CLI_CALLS=0'
