name: Debug Star Ratings Runtime Topology v0.1.0

on:
  push:
    branches:
      - validate/star-ratings-runtime-topology-collector-v0.1.0
    paths:
      - '.github/workflows/debug-star-ratings-runtime-topology-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build dual fixture and print synthetic-only report
        shell: powershell
        run: |
          $fixtureRoot=Join-Path $env:RUNNER_TEMP 'star-ratings-topology-debug'
          python validation/star-ratings-runtime-topology-collector-v0.1.0/fixture_builder.py --out $fixtureRoot
          $root=Join-Path $fixtureRoot 'dual'
          $out=Join-Path $env:RUNNER_TEMP 'dual-report.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/star-ratings-runtime-topology-collector-v0.1.0/Collect-StarRatings-Topology.ps1 -AppDataRoot (Join-Path $root 'appdata') -LocalAppDataRoot (Join-Path $root 'localappdata') -OutputPath $out | Out-Host
          if($LASTEXITCODE -ne 0){throw 'Dual collector execution failed.'}
          $r=Get-Content $out -Raw|ConvertFrom-Json
          [pscustomobject]@{ marketplace=$r.marketplace; topology=$r.derived.topology }|ConvertTo-Json -Depth 20|Write-Host
