name: Validate Receipt-Bound Production Admission v0.1.0

on:
  push:
    branches: [validate/custom-app-receipt-bound-production-admission-v0.1.0]
    paths:
      - 'validation/custom-app-receipt-bound-production-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-receipt-bound-production-admission-v010.yml'
  pull_request:
    branches: [validate/custom-app-fixture-canary-execution-receipt-v0.1.1]
    paths:
      - 'validation/custom-app-receipt-bound-production-admission-v0.1.0/**'
      - '.github/workflows/validate-custom-app-receipt-bound-production-admission-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact admission-only scope, receipt lineage, and frozen production
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='635e25a4a06320cd103e07b1506f0ba8787e5c3a'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Receipt-bound admission is not descended from exact corrected receipt head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-receipt-bound-production-admission-v010.yml',
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/custom-app-receipt-bound-production-admission.ps1',
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/test_custom_app_receipt_bound_production_admission.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Receipt-bound admission scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected admission validation file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during receipt-bound admission validation.'}
          Write-Host "CUSTOM_APP_RECEIPT_BOUND_ADMISSION_SCOPE_PASS head=$actual"

      - name: Prove exact immutable receipt and eligibility dependencies
        shell: powershell
        run: |
          $pins=@(
            @('635e25a4a06320cd103e07b1506f0ba8787e5c3a','validation/custom-app-fixture-canary-execution-receipt-v0.1.1/custom-app-fixture-canary-execution-receipt-v013.ps1','6b1c318262d3000f27514aed23df5371950524d4'),
            @('635e25a4a06320cd103e07b1506f0ba8787e5c3a','validation/custom-app-fixture-canary-execution-receipt-v0.1.1/test_custom_app_fixture_canary_execution_receipt_v013.ps1','f915747a189be3313d8e19b964821d813d25d533'),
            @('979e9d6362ead31016b9532f98629d6bcc2bbb56','validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1','94c1b0ba8f2454078252a723f89ccc0327cbc181'),
            @('a5d5839a9d6c1dd01c1fced6e9e1f5f76d16b5ca','validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1','80e4319bee6c63d1eaf0cf12726a0fbf569642b9'),
            @('79c7ef064a216ee3ff34328be282d742f0f7abc0','validation/custom-app-fixture-canary-permit-v0.1.0/custom-app-fixture-canary-permit.ps1','fefd8ccbde5231a70f55f41576c172fba4fede14'),
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py','92eb87048eac882483bee1ed97bde598cff57e7b')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned admission dependency drift: $($p[1]) $blob != $($p[2])"}}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_DEPENDENCY_PINS_PASS'

      - name: Parse admission core and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/custom-app-receipt-bound-production-admission.ps1',
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/test_custom_app_receipt_bound_production_admission.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_PS51_PARSE_PASS'

      - name: Audit admission as receipt-bound read-only decision with zero authority
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-receipt-bound-production-admission-v0.1.0/custom-app-receipt-bound-production-admission.ps1' -Raw
          foreach($m in @(
            'Test-CustomAppFixtureCanaryExecutionReceiptV013','Resolve-CustomAppPromotionEligibilityV010','committed-preserved','receipt-stale-for-production-admission',
            'receipt-current-eligibility_fingerprint-mismatch','receipt-current-provenance-fingerprint-mismatch','production_admission_decision_only=$true','production_permit_issued=$false',
            'receipt_is_authority=$false','requires_fresh_revalidation_before_any_future_action=$true',"mutation_mode='deny'",'mutation_authorized=$false','auto_update_authorized=$false','auto_install_authorized=$false','canary_execution_authorized=$false','production_mutation_authorized=$false'
          )){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Receipt-bound admission safety marker missing: $m"}}
          foreach($forbidden in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Item','Remove-Item','Copy-Item','Move-Item','Set-Content','Add-Content','Out-File','[IO.File]::','[IO.Directory]::','Save-AddonState','spicetify apply','spicetify config')){if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Receipt-bound admission gained forbidden side effect primitive: $forbidden"}}
          if($core -match 'production_permit_issued\s*=\s*\$true'){throw 'Receipt-bound admission can issue a production permit.'}
          if($core -match 'production_mutation_authorized\s*=\s*\$true'){throw 'Receipt-bound admission grants production mutation authority.'}
          if($core -match 'canary_execution_authorized\s*=\s*\$true'){throw 'Receipt-bound admission grants canary authority.'}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_READ_ONLY_AUDIT_PASS'

      - name: Run receipt-bound admission fail-closed matrix twice
        shell: powershell
        run: |
          1..2|ForEach-Object{
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-receipt-bound-production-admission-v0.1.0/test_custom_app_receipt_bound_production_admission.ps1'
            if($LASTEXITCODE -ne 0){throw "Receipt-bound admission matrix failed on pass $_."}
          }
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_MATRIX_REPEAT_PASS'

      - name: Replay corrected receipt and current promotion eligibility matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-fixture-canary-execution-receipt-v0.1.1/test_custom_app_fixture_canary_execution_receipt_v013.ps1'
          if($LASTEXITCODE -ne 0){throw 'Corrected receipt parent matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          if($LASTEXITCODE -ne 0){throw 'Promotion eligibility parent matrix regressed.'}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_PARENT_EVIDENCE_REPLAY_PASS'

      - name: Replay fixture permit and permit-consumed canary executor matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-fixture-canary-permit-v0.1.0/test_custom_app_fixture_canary_permit.ps1'
          if($LASTEXITCODE -ne 0){throw 'Fixture canary permit matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Permit-consumed fixture canary executor matrix regressed.'}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_CANARY_CHAIN_REPLAY_PASS'

      - name: Rebuild exact v0.4.1 candidate and run full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build
          if($LASTEXITCODE -ne 0){throw 'Exact v0.4.1 candidate rebuild failed.'}
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $addon).Length -ne 523216 -or $ah -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $((Get-Item $addon).Length)/$ah"}
          $mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $main).Length -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control parent drift: $((Get-Item $main).Length)/$mh"}
          $sandbox=Join-Path $env:RUNNER_TEMP 'receipt-bound-admission-parent-selftest';$env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData';$env:APPDATA=Join-Path $sandbox 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_PARENT_SELFTEST_PASS'

      - name: Prove production and receipt-parent surfaces remain immutable
        shell: powershell
        run: |
          $parent='635e25a4a06320cd103e07b1506f0ba8787e5c3a'
          $expected=@(
            '.github/workflows/validate-custom-app-receipt-bound-production-admission-v010.yml',
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/custom-app-receipt-bound-production-admission.ps1',
            'validation/custom-app-receipt-bound-production-admission-v0.1.0/test_custom_app_receipt_bound_production_admission.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected receipt-bound admission surface: $($bad -join ', ')"}
          foreach($path in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-fixture-canary-execution-receipt-v0.1.1/custom-app-fixture-canary-execution-receipt-v013.ps1','validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1','validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1')){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected receipt/production surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_IMMUTABILITY_PASS'

      - name: Write receipt-bound admission validation evidence
        shell: powershell
        run: |
          $dir='validation/custom-app-receipt-bound-production-admission-v0.1.0'
          $e=[ordered]@{
            schema=1;head=(git rev-parse HEAD).Trim();receipt_parent='635e25a4a06320cd103e07b1506f0ba8787e5c3a';eligibility_parent='979e9d6362ead31016b9532f98629d6bcc2bbb56';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
            admission='custom-app-receipt-bound-production-admission-v1';receipt_required='committed-preserved';current_revalidation=$true;receipt_max_age_hours=24;remote_observation_max_age_hours=36;decision_only=$true;production_permit_issued=$false;receipt_is_authority=$false;production_mutation_authority=$false;generic_auto_authority_expanded=$false
            admission_core_sha256=(Get-FileHash "$dir/custom-app-receipt-bound-production-admission.ps1" -Algorithm SHA256).Hash.ToLowerInvariant();admission_test_sha256=(Get-FileHash "$dir/test_custom_app_receipt_bound_production_admission.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $e|ConvertTo-Json -Depth 8|Set-Content "$dir/ci-evidence.json" -Encoding UTF8
          Write-Host 'CUSTOM_APP_RECEIPT_BOUND_ADMISSION_EVIDENCE_PASS'

      - name: Upload receipt-bound admission validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-receipt-bound-production-admission-v010-${{ github.run_id }}
          path: |
            validation/custom-app-receipt-bound-production-admission-v0.1.0/custom-app-receipt-bound-production-admission.ps1
            validation/custom-app-receipt-bound-production-admission-v0.1.0/test_custom_app_receipt_bound_production_admission.ps1
            validation/custom-app-receipt-bound-production-admission-v0.1.0/ci-evidence.json
          if-no-files-found: error
