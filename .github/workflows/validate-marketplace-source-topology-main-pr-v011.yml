name: Validate Marketplace Source Topology Main PR v0.1.1

on:
  push:
    branches:
      - validate/marketplace-source-topology-main-pr-v0.1.1
    paths:
      - 'validation/marketplace-source-topology-main-pr-v0.1.1/**'
      - '.github/workflows/validate-marketplace-source-topology-main-pr-v011.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'validation/marketplace-source-topology-main-pr-v0.1.1/**'
      - '.github/workflows/validate-marketplace-source-topology-main-pr-v011.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Fetch validation branch histories needed by exact commit pins
        shell: powershell
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if($LASTEXITCODE -ne 0){throw 'Could not fetch validation branch histories for exact commit reproduction.'}
          foreach($commit in @(
            '36471b7193324d117c3c9b40c1cc27cc25dc2c86',
            '71ebf04ec6744383161bc16376a6a292dd3a5e33',
            '3178c335e82bdbf7ca5610f0fd618468b4e1c26a',
            '57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b',
            '1e70069457ceeffb15bdc711b3b6c29cb2d3639e',
            '957286ed0a9d06e469d09811286b93321af819a0',
            '14a2f9bfacc54e617aec024b44b7f367dec28bbe'
          )){git cat-file -e "$commit^{commit}";if($LASTEXITCODE -ne 0){throw "Pinned validation commit unavailable: $commit"}}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_PIN_HISTORY_PASS'

      - name: Prove exact main-based validation scope
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $base='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          if((git merge-base $base HEAD).Trim() -cne $base){throw 'Independent validation branch is not based on exact production main.'}
          $allowed=@(
            '.github/workflows/validate-marketplace-source-topology-main-pr-v011.yml',
            'validation/marketplace-source-topology-main-pr-v0.1.1/reproduce_exact.py'
          )
          $changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Independent validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected independent validation file: $required"}}
          if((git rev-parse origin/main).Trim() -cne $base){throw 'origin/main no longer equals the exact production base during validation.'}
          Write-Host "SOURCE_TOPOLOGY_MAIN_SCOPE_PASS head=$actual"

      - name: Reproduce exact validated candidate twice from pinned commits and blobs
        shell: powershell
        run: |
          $dir='validation/marketplace-source-topology-main-pr-v0.1.1';$builder=Join-Path $dir 'reproduce_exact.py'
          python -m py_compile $builder;if($LASTEXITCODE -ne 0){throw 'Independent reproduction wrapper failed Python compile.'}
          python $builder --build;if($LASTEXITCODE -ne 0){throw 'First independent exact reproduction failed.'}
          $out=Join-Path $dir 'out/bin';$paths=@('spotify-control.ps1','addon-manager.ps1','Collect-Marketplace-Records.ps1','LevelDbReadOnly.cs')|ForEach-Object{Join-Path $out $_}
          $ids1=@($paths|ForEach-Object{"$((Get-Item $_).Length)|$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())"})
          $expected=@(
            '284327|69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99',
            '398615|8ef832bde22bb147d17bd5c901da0706c8dc9f90e6db0eaf446e274c1df3c3ef',
            '16052|b261a13f7683d43a9bd79f58d7ada12b173201753bfcf2b5c95d892fbd0a6127',
            '30567|391e10c108c8316dd7422b02a45302e696bc1da20ea4f4303160b252c6624a5d'
          )
          if(($ids1 -join ';') -cne ($expected -join ';')){throw "First reproduction identity mismatch: $($ids1 -join ';')"}
          python $builder --build;if($LASTEXITCODE -ne 0){throw 'Second independent exact reproduction failed.'}
          $ids2=@($paths|ForEach-Object{"$((Get-Item $_).Length)|$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())"})
          if(($ids2 -join ';') -cne ($expected -join ';') -or ($ids1 -join ';') -cne ($ids2 -join ';')){throw "Independent reproduction is nondeterministic: $($ids2 -join ';')"}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_EXACT_REPRODUCTION_PASS'

      - name: Parse exact reproduction and run ownership plus full Addon Manager self-tests
        shell: powershell
        run: |
          $dir='validation/marketplace-source-topology-main-pr-v0.1.1'
          foreach($file in @((Join-Path $dir 'marketplace-source-topology.ps1'),(Join-Path $dir 'out/bin/spotify-control.ps1'),(Join-Path $dir 'out/bin/addon-manager.ps1'),(Join-Path $dir 'out/bin/Collect-Marketplace-Records.ps1'))){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){throw "PowerShell 5.1 parse failed: $file :: $($errors[0].Message)"}}
          Add-Type -Path (Resolve-Path (Join-Path $dir 'out/bin/LevelDbReadOnly.cs')) -ErrorAction Stop
          function Write-AddonLog { param([string]$Message,[string]$Level='INFO'); Write-Host "[$Level] $Message" }
          . (Resolve-Path (Join-Path $dir 'marketplace-source-topology.ps1'));Invoke-MarketplaceSourceTopologySelfTest
          $root=Join-Path $env:RUNNER_TEMP 'source-topology-main-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $dir 'out/bin/addon-manager.ps1') -Action SelfTest;if($LASTEXITCODE -ne 0){throw 'Independent reproduced Addon Manager SelfTest failed.'}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_SELFTEST_PASS'

      - name: Re-run pinned Tagify state-preserving transaction acceptance on exact reproduced bytes
        shell: powershell
        run: |
          $test=Join-Path $env:RUNNER_TEMP 'test_tagify_state_preserving.ps1';git show '750c5dca0087d9bc8dd69b75dcc301b5e83ad0ec:validation/marketplace-lifecycle-tagify-state-preserving-v0.1.0/test_tagify_state_preserving.ps1'|Set-Content -LiteralPath $test -Encoding UTF8
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test -CandidatePath (Resolve-Path 'validation/marketplace-source-topology-main-pr-v0.1.1/out/bin/addon-manager.ps1');if($LASTEXITCODE -ne 0){throw 'Independent Tagify transaction acceptance failed.'}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_TAGIFY_TRANSACTION_PASS'

      - name: Re-run six exact Marketplace fixtures on reproduced collector
        shell: powershell
        run: |
          $dir='validation/marketplace-source-topology-main-pr-v0.1.1';$fb=Join-Path $env:RUNNER_TEMP 'fixture_builder.py';git show '957286ed0a9d06e469d09811286b93321af819a0:validation/marketplace-record-discovery-v0.1.0/fixture_builder.py'|Set-Content -LiteralPath $fb -Encoding UTF8;python $fb --out (Join-Path $dir 'fixtures');if($LASTEXITCODE -ne 0){throw 'Marketplace fixture build failed.'}
          $collector=Resolve-Path (Join-Path $dir 'out/bin/Collect-Marketplace-Records.ps1');$reader=Resolve-Path (Join-Path $dir 'out/bin/LevelDbReadOnly.cs');$reports=Join-Path $dir 'reports';New-Item -ItemType Directory -Force -Path $reports|Out-Null
          foreach($kind in @('indexeddb','orphan','wal-tombstone','corrupt','localstorage','dual-profiles')){$local=Join-Path (Join-Path (Join-Path $dir 'fixtures') $kind) 'localappdata';$out=Join-Path $reports ($kind+'.json');& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $collector -LocalAppDataRoot $local -ReaderPath $reader -OutputPath $out;if($LASTEXITCODE -ne 0){throw "Collector failed fixture: $kind"}}
          $indexed=Get-Content (Join-Path $reports 'indexeddb.json') -Raw|ConvertFrom-Json;if($indexed.status -cne 'ok' -or [int]$indexed.record_count -ne 3 -or ((@($indexed.records|ForEach-Object{$_.kind}|Sort-Object)-join '|') -cne 'extension|snippet|theme')){throw 'Marketplace indexed fixture/type topology failed.'}
          $corrupt=Get-Content (Join-Path $reports 'corrupt.json') -Raw|ConvertFrom-Json;if($corrupt.status -cne 'inconclusive'){throw 'Corrupt Marketplace DB did not fail closed.'}
          foreach($name in @('indexeddb','orphan','wal-tombstone','localstorage','dual-profiles')){$x=Get-Content (Join-Path $reports ($name+'.json')) -Raw|ConvertFrom-Json;if($x.read_only -ne $true -or $x.mutation_performed -ne $false -or $x.derived.safe_to_expand_mutation_authority -ne $false){throw "Marketplace read-only/deny contract failed: $name"}}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_FIXTURES_PASS'

      - name: Audit reproduction report and production immutability
        shell: powershell
        run: |
          $report=Get-Content -LiteralPath 'validation/marketplace-source-topology-main-pr-v0.1.1/reproduction-report.json' -Raw|ConvertFrom-Json
          if([string]$report.source_head -cne '36471b7193324d117c3c9b40c1cc27cc25dc2c86'){throw 'Reproduction source head drift.'}
          if([string]$report.source_builder.blob -cne '1e32dd57c95f718f2aeaae6149da36762ca7f6fd'){throw 'Reproduction builder blob drift.'}
          if([string]$report.source_topology.blob -cne 'fff349f3fc765e2fc187b9ccdc249b48e09df6c8'){throw 'Topology contract blob drift.'}
          if([string]$report.validated_push_artifact.digest -cne 'sha256:879b827da7b0b4bb9f743e6f73d6232dbf543830d20d1cc83d5df55b4f02d55c'){throw 'Pinned push artifact digest drift.'}
          if($report.generic_marketplace_mutation_authority_expanded -ne $false -or $report.production_surface_changed -ne $false){throw 'Independent reproduction unexpectedly expands authority or production surface.'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production origin/main moved during independent validation.'}
          Write-Host 'SOURCE_TOPOLOGY_MAIN_REPORT_AND_IMMUTABILITY_PASS'

      - name: Upload independent exact reproduction artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-source-topology-main-pr-v011-${{ github.run_id }}
          path: |
            validation/marketplace-source-topology-main-pr-v0.1.1/reproduction-report.json
            validation/marketplace-source-topology-main-pr-v0.1.1/marketplace-source-topology.ps1
            validation/marketplace-source-topology-main-pr-v0.1.1/out/bin/spotify-control.ps1
            validation/marketplace-source-topology-main-pr-v0.1.1/out/bin/addon-manager.ps1
            validation/marketplace-source-topology-main-pr-v0.1.1/out/bin/Collect-Marketplace-Records.ps1
            validation/marketplace-source-topology-main-pr-v0.1.1/out/bin/LevelDbReadOnly.cs
            validation/marketplace-source-topology-main-pr-v0.1.1/reports/*.json
          if-no-files-found: error
          compression-level: 0
