name: Repair dual-ID finalization lexical boundaries

on:
  push:
    branches:
      - validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact validation ancestry scope and frozen production main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='98b5d1208b6463c8917bbddecd8e725d2828fa54'
          if((git merge-base $base HEAD).Trim() -cne $base){ throw 'repair branch no longer descends from exact v0.1.2 head' }
          $delta=@(git diff --name-only "$base...HEAD")
          $repair='.github/workflows/repair-dual-id-bridge-aware-finalization-lexical-boundaries.yml'
          foreach($p in $delta){ if($p -cne $repair){ throw "unexpected pre-repair delta from v0.1.2: $p" } }
          $main=(git ls-remote origin refs/heads/main).Split("`t")[0]
          if($main -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){ throw "production main moved: $main" }

      - name: Normalize keyword boundaries without semantic edits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/custom-app-production-dual-id-bridge-aware-finalization.ps1',
            'validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/test_custom_app_production_dual_id_bridge_aware_finalization.ps1',
            'validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_finalization.ps1'
          )
          $changed=@()
          $encoding=New-Object System.Text.UTF8Encoding($false)
          foreach($path in $paths){
            $raw=[IO.File]::ReadAllText((Resolve-Path $path))
            $fixed=[regex]::Replace($raw,'\breturn(?=[\[\$&\(])','return ')
            $fixed=[regex]::Replace($fixed,'\bthrow(?=[\[\$\(])','throw ')
            if(([regex]::Replace($raw,'\s','')) -cne ([regex]::Replace($fixed,'\s',''))){ throw "non-whitespace semantic drift in $path" }
            if($fixed -cne $raw){ [IO.File]::WriteAllText((Resolve-Path $path),$fixed,$encoding); $changed += $path }
          }
          if($changed.Count -lt 2){ throw "expected core and test lexical repairs; changed=$($changed.Count)" }
          foreach($path in $paths){
            $text=[IO.File]::ReadAllText((Resolve-Path $path))
            if($text -match '\breturn[\[\$&\(]' -or $text -match '\bthrow[\[\$\(]'){ throw "unrepaired keyword boundary remains in $path" }
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){ $errors|ForEach-Object{Write-Error $_}; throw "PS5.1 parse failed after lexical repair: $path" }
          }
          $diff=@(git diff --name-only)
          foreach($p in $diff){ if($p -notin $paths){ throw "repair escaped validation scripts: $p" } }
          "LEXICAL_REPAIR_PASS changed=$($changed.Count) paths=$($changed -join ',')"

      - name: Commit exact validation-only lexical repair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'spotify-control-validation-bot'
          git config user.email '98333820+sdsssdvx2@users.noreply.github.com'
          git add -- 'validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/*.ps1'
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ throw 'no lexical repair to commit' }
          git commit -m 'validation: normalize PowerShell return/throw keyword boundaries'
          if($LASTEXITCODE){ throw 'lexical repair commit failed' }
          git push origin HEAD:validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0
          if($LASTEXITCODE){ throw 'lexical repair push failed' }
