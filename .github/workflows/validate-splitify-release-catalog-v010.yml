name: Validate Splitify Official Release Catalog v0.1.0

on:
  push:
    branches:
      - validate/splitify-release-catalog-v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove validation-only scope
        shell: powershell
        run: |
          $base='c3dca564f70d4c85a84d5f895309d30d5a2d80c1'
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Catalog branch is not based on exact v0.6.24 stable main.'}
          $changed=@(git diff --name-only "$base...HEAD")
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/validate-splitify-release-catalog-v010.yml'){throw "Unexpected catalog scope: $($changed -join ', ')"}
          Write-Host "SPLITIFY_CATALOG_SCOPE_PASS head=$((git rev-parse HEAD).Trim())"

      - name: Build authenticated catalog for every stable official Splitify release
        shell: python
        run: |
          import hashlib,json,re,stat,urllib.request,zipfile
          from pathlib import Path
          API='https://api.github.com/repos/alexander-rebello/splitify/releases?per_page=100'
          UA='SpotifyControl-Splitify-Release-Catalog/0.1.0'
          root=Path('splitify-release-catalog-evidence');root.mkdir(exist_ok=True)
          def fetch_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def download(url,path):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=60) as r,open(path,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b:break
                      f.write(b)
          releases=fetch_json(API)
          stable=[]
          for rel in releases:
              tag=str(rel.get('tag_name') or '')
              if rel.get('draft') or rel.get('prerelease') or not re.fullmatch(r'v\d+\.\d+\.\d+',tag):continue
              assets=[a for a in rel.get('assets',[]) if a.get('name')=='splitify.zip']
              if len(assets)!=1:raise SystemExit(f'{tag}: expected exactly one splitify.zip, got {len(assets)}')
              a=assets[0];digest=str(a.get('digest') or '').lower()
              if not re.fullmatch(r'sha256:[0-9a-f]{64}',digest):raise SystemExit(f'{tag}: missing GitHub sha256 digest')
              stable.append((rel,a))
          if not stable:raise SystemExit('No stable Splitify releases found')
          def semver(tag):return tuple(map(int,tag[1:].split('.')))
          stable.sort(key=lambda x:semver(x[0]['tag_name']))
          catalog=[]
          for rel,a in stable:
              tag=rel['tag_name'];version=tag[1:];zip_path=root/f'{tag}.zip'
              download(a['browser_download_url'],zip_path)
              raw=zip_path.read_bytes();actual=hashlib.sha256(raw).hexdigest()
              if len(raw)!=int(a['size']) or actual!=a['digest'][7:].lower():raise SystemExit(f'{tag}: asset authentication mismatch')
              seen=set();files=[];expanded=0;entries=0
              with zipfile.ZipFile(zip_path) as z:
                  for info in z.infolist():
                      entries+=1
                      if entries>100:raise SystemExit(f'{tag}: too many entries')
                      name=info.filename.replace('\\','/')
                      if not name or name.startswith('/') or re.match(r'^[A-Za-z]:',name) or ':' in name:raise SystemExit(f'{tag}: unsafe path {name}')
                      trimmed=name.rstrip('/')
                      parts=trimmed.split('/') if trimmed else []
                      if not parts or any(p in ('','.','..') for p in parts):raise SystemExit(f'{tag}: unsafe component {name}')
                      key=trimmed.lower()
                      if key in seen:raise SystemExit(f'{tag}: duplicate/case collision {trimmed}')
                      seen.add(key)
                      mode=(info.external_attr>>16)&0o170000
                      if mode==stat.S_IFLNK:raise SystemExit(f'{tag}: symlink {name}')
                      if parts[0] != 'splitify-dist':raise SystemExit(f'{tag}: unexpected top level {parts[0]}')
                      if info.is_dir():continue
                      if info.file_size<0 or info.file_size>16*1024*1024:raise SystemExit(f'{tag}: oversized entry {name}')
                      expanded+=info.file_size
                      if expanded>32*1024*1024:raise SystemExit(f'{tag}: expanded cap exceeded')
                      relpath='/'.join(parts[1:])
                      if not relpath:raise SystemExit(f'{tag}: file at root directory marker')
                      data=z.read(info)
                      if len(data)!=info.file_size:raise SystemExit(f'{tag}: size mismatch {name}')
                      files.append({'path':relpath,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              if not files:raise SystemExit(f'{tag}: no files')
              files.sort(key=lambda x:(x['path'].lower(),x['path']))
              payload=''.join(f"{x['path']}|{x['size']}|{x['sha256']}\n" for x in files).encode()
              tree=hashlib.sha256(payload).hexdigest()
              manifest=[x for x in files if x['path']=='manifest.json']
              if len(manifest)!=1:raise SystemExit(f'{tag}: manifest count {len(manifest)}')
              with zipfile.ZipFile(zip_path) as z:m=json.loads(z.read('splitify-dist/manifest.json'))
              row={'version':version,'tag':tag,'published_at':rel.get('published_at'),'asset_size':len(raw),'asset_sha256':actual,'asset_digest':a['digest'].lower(),'tree_sha256':tree,'file_count':len(files),'expanded_bytes':sum(x['size'] for x in files),'manifest_name':m.get('name'),'manifest_version':m.get('version'),'files':files}
              catalog.append(row)
              print('SPLITIFY_RELEASE',tag,'asset',len(raw),actual,'tree',tree,'files',len(files),'manifest_version',repr(m.get('version')))
          by_tree={}
          for row in catalog:by_tree.setdefault(row['tree_sha256'],[]).append(row['version'])
          duplicates={k:v for k,v in by_tree.items() if len(v)>1}
          result={'schema':1,'repository':'alexander-rebello/splitify','release_count':len(catalog),'latest_version':catalog[-1]['version'],'catalog':catalog,'duplicate_tree_versions':duplicates}
          (root/'catalog.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('SPLITIFY_RELEASE_CATALOG_PASS releases=',len(catalog),'latest=',catalog[-1]['version'],'duplicate_trees=',json.dumps(duplicates,sort_keys=True))

      - name: Prove latest pinned identity remains present
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path('splitify-release-catalog-evidence/catalog.json').read_text())
          rows=[x for x in r['catalog'] if x['version']=='1.1.0']
          if len(rows)!=1:raise SystemExit('v1.1.0 missing or duplicated')
          x=rows[0]
          if x['asset_size']!=7822 or x['asset_sha256']!='5de51a885815f78067b8d6f7f3ebe40c93b5a7c7e3c8c841fcd26147a13010ca':raise SystemExit('v1.1.0 asset drift')
          if x['tree_sha256']!='a138d868d219028d7498a6a4138aef4900da9583c04e572e5505e2ce971a4440' or x['file_count']!=6:raise SystemExit('v1.1.0 tree drift')
          print('SPLITIFY_CATALOG_LATEST_PIN_PASS')

      - uses: actions/upload-artifact@v4
        with:
          name: splitify-release-catalog-v010
          path: splitify-release-catalog-evidence/catalog.json
          if-no-files-found: error
