name: Validate Current Spotify Updater v0.1.0

on:
  push:
    branches:
      - validate/spotify-updater-current-v0.1.0
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'
  pull_request:
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove validation-only exact-head scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Wrong production merge base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@('validation/spotify-updater-current-v0.1.0/audit.py','.github/workflows/validate-spotify-updater-current-v010.yml')
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 2){throw "Expected exactly 2 validation-only files; got $($changed.Count): $($changed -join ', ')"}
          Write-Host "SPOTIFY_UPDATER_SCOPE_PASS head=$actual"

      - name: Compile updater audit
        shell: powershell
        run: |
          python -m py_compile validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw 'Spotify updater audit failed Python compile.'}

      - name: Reconstruct exact production and audit updater path
        shell: powershell
        run: |
          python validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw "Spotify updater audit failed: $LASTEXITCODE"}

      - name: Prove exact production updater safety contracts
        shell: powershell
        run: |
          $r=Get-Content spotify-updater-current-audit.json -Raw|ConvertFrom-Json
          if($r.result -ne 'AUDIT_PASS'){throw "Unexpected report result: $($r.result)"}
          if($r.validation_head -ne (git rev-parse HEAD).Trim()){throw 'Report exact-head mismatch.'}
          if($r.production_main.sha256 -ne 'e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18'){throw 'Production main identity mismatch.'}
          if($r.production_addon.sha256 -ne '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86'){throw 'Production addon identity mismatch.'}
          foreach($n in @('Normalize-Etag','Get-SpotifyVersion','Get-SpotifyPublisherSignature','Test-SpotifyInstallerIdentity','Get-LatestSpotifyWindowsCandidate','Get-VerifiedSpotifyInstaller','Get-SmartUpdateGuardPlan','Set-SpotifyUpdateGuardState','Invoke-SmartUpdateGuard','Invoke-SpotifyPreflight','Invoke-SpotifyTransactionalMaintenance','Restore-SpotifyTransactionSnapshot','Rollback-SpotifyTransaction','Repair-PendingSpotifyTransaction')){
            if(-not $r.target_functions.PSObject.Properties[$n]){throw "Missing updater evidence for $n"}
          }
          $main=Get-Content validation/v0.6.20/out/bin/spotify-control.ps1 -Raw
          foreach($x in @(
            'https://download.scdn.co/SpotifyFullSetupX64.exe',
            'https://robyrew.github.io/spotify-versions-history/api/v1/windows-x64.json',
            'Spotify official installer HEAD did not return an ETag.',
            'No Windows x64 feed entry matched Spotify''s current official installer ETag.',
            'Matched feed record is missing a valid SHA-256:',
            'Matched feed record is missing a valid installer size:',
            '''If-Match''=[string]$Candidate.Etag',
            'Spotify installer SHA-256 mismatch.',
            'Spotify installer size mismatch.',
            'Spotify installer signature failed:',
            'Spotify installer ProductVersion mismatch.',
            'Signer is not Spotify AB:',
            'Spotify installer changed protected user data; rolling back.',
            'Spicetify configuration changed outside allowed Backup version fields.',
            'Spicetify extension/custom-app/theme source assets changed during Spotify repair.',
            'Smart Update Guard was not verified blocked after Spotify update.',
            'Automatic Spotify downgrade is refused:'
          )){if($main.IndexOf($x,[StringComparison]::Ordinal) -lt 0){throw "Production Spotify updater contract missing: $x"}}
          Write-Host ("SPOTIFY_UPDATER_STATIC_CONTRACT_PASS functions={0} urls={1}" -f @($r.target_functions.PSObject.Properties).Count,@($r.production_spotify_urls).Count)

      - name: Validate current official Spotify installer candidate in isolated staging
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Normalize-EtagLocal([string]$Value){
            if([string]::IsNullOrWhiteSpace($Value)){return $null}
            $v=$Value.Trim()
            if($v.StartsWith('W/')){$v=$v.Substring(2).Trim()}
            return $v.Trim('"').Trim()
          }
          function Compare3([string]$A,[string]$B){
            $aa=@($A.Split('.'));$bb=@($B.Split('.'))
            for($i=0;$i -lt 3;$i++){
              $av=0;$bv=0
              if($i -lt $aa.Count){if(-not [int]::TryParse(($aa[$i] -replace '[^0-9].*$',''),[ref]$av)){return $null}}
              if($i -lt $bb.Count){if(-not [int]::TryParse(($bb[$i] -replace '[^0-9].*$',''),[ref]$bv)){return $null}}
              if($av -lt $bv){return -1};if($av -gt $bv){return 1}
            }
            return 0
          }
          $official='https://download.scdn.co/SpotifyFullSetupX64.exe'
          $feedUrl='https://robyrew.github.io/spotify-versions-history/api/v1/windows-x64.json'
          $ua='SpotifyControl-validation/0.1.0'
          $head=Invoke-WebRequest -Uri $official -Method Head -UseBasicParsing -MaximumRedirection 5 -Headers @{'User-Agent'=$ua}
          $rawEtag=[string]$head.Headers['ETag'];$officialEtag=Normalize-EtagLocal $rawEtag
          if([string]::IsNullOrWhiteSpace($officialEtag)){throw 'Official Spotify installer HEAD returned no usable ETag.'}
          $feed=Invoke-RestMethod -Uri $feedUrl -Headers @{'User-Agent'=$ua}
          $matches=@()
          foreach($p in $feed.PSObject.Properties){
            $entry=$p.Value
            if($null -eq $entry -or $null -eq $entry.win -or $null -eq $entry.win.x64){continue}
            $a=$entry.win.x64;$feedEtag=Normalize-EtagLocal ([string]$a.etag)
            if($feedEtag -ne $officialEtag){continue}
            if(([string]$a.official -ne $official) -and ([string]$a.url -ne $official)){continue}
            $matches += [pscustomobject]@{Version=[string]$p.Name;FullVersion=[string]$entry.fullversion;Etag=$feedEtag;Sha256=([string]$a.sha256).Trim().ToLowerInvariant();Size=[int64]$a.size}
          }
          if($matches.Count -ne 1){throw "Expected exactly one feed record matching official ETag; got $($matches.Count)"}
          $c=$matches[0]
          if($c.Version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$'){throw "Invalid candidate version: $($c.Version)"}
          if($c.Sha256 -notmatch '^[0-9a-f]{64}$'){throw 'Candidate feed SHA-256 invalid.'}
          if($c.Size -le 0){throw 'Candidate feed size invalid.'}
          $work=Join-Path $env:RUNNER_TEMP ('spotify-current-'+[guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $work|Out-Null
          try{
            $installer=Join-Path $work 'SpotifyFullSetupX64.exe'
            $headers=@{'User-Agent'=$ua;'If-Match'=$officialEtag}
            try { Invoke-WebRequest -Uri $official -Headers $headers -UseBasicParsing -OutFile $installer -MaximumRedirection 5 }
            catch {
              # RFC form fallback uses the raw server ETag only if the normalized production-style value was rejected.
              if([string]::IsNullOrWhiteSpace($rawEtag)){throw}
              Invoke-WebRequest -Uri $official -Headers @{'User-Agent'=$ua;'If-Match'=$rawEtag} -UseBasicParsing -OutFile $installer -MaximumRedirection 5
            }
            $actualSha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant();$actualSize=(Get-Item $installer).Length
            if($actualSha -cne $c.Sha256){throw "Spotify candidate SHA mismatch: $actualSha != $($c.Sha256)"}
            if($actualSize -ne $c.Size){throw "Spotify candidate size mismatch: $actualSize != $($c.Size)"}
            $sig=Get-AuthenticodeSignature -LiteralPath $installer
            if([string]$sig.Status -ne 'Valid'){throw "Spotify candidate Authenticode status=$($sig.Status)"}
            $subject=[string]$sig.SignerCertificate.Subject
            if([string]::IsNullOrWhiteSpace($subject) -or $subject -notmatch '(?i)(^|,\s*)(O|CN)=Spotify AB(,|$)'){throw "Spotify candidate signer is not Spotify AB: $subject"}
            $product=[string](Get-Item $installer).VersionInfo.ProductVersion
            if($product -cne $c.Version){throw "Spotify candidate ProductVersion mismatch: $product != $($c.Version)"}
            $spice=Invoke-RestMethod -Uri 'https://api.github.com/repos/spicetify/cli/releases/latest' -Headers @{'User-Agent'=$ua;'Accept'='application/vnd.github+json'}
            if([bool]$spice.draft -or [bool]$spice.prerelease){throw 'Latest Spicetify release is not stable.'}
            $winLine=@(([string]$spice.body -split "`r?`n")|Where-Object{$_ -match 'Spotify\s+for\s+\*\*[^*]*Windows[^*]*\*\*'})|Select-Object -First 1
            if([string]::IsNullOrWhiteSpace([string]$winLine)){throw 'Latest Spicetify release has no Windows compatibility line.'}
            $vm=[regex]::Matches([string]$winLine,'(?<!\d)(\d+\.\d+\.\d+)(?!\d)');if($vm.Count -ne 2){throw "Could not parse latest Spicetify Windows range: $winLine"}
            $min=$vm[0].Groups[1].Value;$max=$vm[1].Groups[1].Value
            $lo=Compare3 $c.Version $min;$hi=Compare3 $c.Version $max
            if($null -eq $lo -or $null -eq $hi -or $lo -lt 0 -or $hi -gt 0){throw "Current Spotify candidate $($c.Version) is outside latest Spicetify $($spice.tag_name) Windows range $min -> $max"}
            $evidence=[ordered]@{schema=1;official_url=$official;official_etag=$officialEtag;candidate_version=$c.Version;candidate_fullversion=$c.FullVersion;candidate_sha256=$c.Sha256;candidate_size=$c.Size;actual_sha256=$actualSha;actual_size=$actualSize;authenticode_status=[string]$sig.Status;signer_subject=$subject;signer_thumbprint=[string]$sig.SignerCertificate.Thumbprint;product_version=$product;spicetify_tag=[string]$spice.tag_name;spicetify_min=$min;spicetify_max=$max;compatible_with_latest_spicetify=$true}
            $evidence|ConvertTo-Json -Depth 6|Set-Content -LiteralPath spotify-current-candidate-evidence.json -Encoding UTF8
            Write-Host "SPOTIFY_CURRENT_CANDIDATE_SANDBOX_PASS version=$($c.Version) size=$actualSize sha=$actualSha etag=$officialEtag spicetify=$($spice.tag_name) range=$min->$max"
          }finally{Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue}

      - name: Validate audit and current-candidate evidence
        shell: powershell
        run: |
          $r=Get-Content spotify-updater-current-audit.json -Raw|ConvertFrom-Json
          $e=Get-Content spotify-current-candidate-evidence.json -Raw|ConvertFrom-Json
          if($r.result -ne 'AUDIT_PASS'){throw 'Audit result is not PASS.'}
          if($r.validation_head -ne (git rev-parse HEAD).Trim()){throw 'Audit head mismatch.'}
          if(-not [bool]$e.compatible_with_latest_spicetify){throw 'Current candidate compatibility evidence is false.'}
          if($e.actual_sha256 -cne $e.candidate_sha256 -or [int64]$e.actual_size -ne [int64]$e.candidate_size){throw 'Candidate identity evidence is inconsistent.'}
          if([string]$e.authenticode_status -ne 'Valid' -or [string]$e.product_version -cne [string]$e.candidate_version){throw 'Candidate signature/version evidence is inconsistent.'}
          Write-Host ("SPOTIFY_UPDATER_REPORT_PASS candidate={0} spicetify={1} range={2}->{3} functions={4}" -f $e.candidate_version,$e.spicetify_tag,$e.spicetify_min,$e.spicetify_max,@($r.target_functions.PSObject.Properties).Count)

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Spotify-Updater-Current-v0.1.0
          path: |
            spotify-updater-current-audit.json
            spotify-current-candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
