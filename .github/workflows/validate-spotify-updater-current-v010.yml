name: Validate Current Spotify Updater Discovery v0.1.0

on:
  push:
    branches:
      - validate/spotify-updater-current-v0.1.0
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'
  pull_request:
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'

permissions:
  contents: read

jobs:
  discover-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove validation-only exact-head scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Wrong production merge base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@('validation/spotify-updater-current-v0.1.0/audit.py','.github/workflows/validate-spotify-updater-current-v010.yml')
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 2){throw "Expected exactly 2 validation-only files; got $($changed.Count): $($changed -join ', ')"}
          Write-Host "SPOTIFY_UPDATER_DISCOVERY_SCOPE_PASS head=$actual"

      - name: Compile discovery audit
        shell: powershell
        run: |
          python -m py_compile validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw 'Spotify updater discovery audit failed Python compile.'}

      - name: Reconstruct exact production and discover Spotify updater path
        shell: powershell
        run: |
          python validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw "Spotify updater discovery failed: $LASTEXITCODE"}

      - name: Validate discovery evidence
        shell: powershell
        run: |
          $r=Get-Content spotify-updater-current-audit.json -Raw|ConvertFrom-Json
          if($r.result -ne 'DISCOVERY_PASS'){throw "Unexpected report result: $($r.result)"}
          if($r.validation_head -ne (git rev-parse HEAD).Trim()){throw 'Report exact-head mismatch.'}
          if($r.production_main.sha256 -ne 'e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18'){throw 'Production main identity mismatch.'}
          if($r.production_addon.sha256 -ne '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86'){throw 'Production addon identity mismatch.'}
          foreach($n in @('Get-SpotifyVersion','Get-SpotifyPublisherSignature','Get-LatestSpotifyWindowsCandidate','Get-VerifiedSpotifyInstaller','Get-SmartUpdateGuardPlan','Set-SpotifyUpdateGuardState','Invoke-SmartUpdateGuard','Invoke-SpotifyPreflight','Invoke-SpotifyTransactionalMaintenance','Restore-SpotifyTransactionSnapshot','Rollback-SpotifyTransaction','Repair-PendingSpotifyTransaction')){
            if(-not $r.target_functions.PSObject.Properties[$n]){throw "Missing updater evidence for $n"}
          }
          Write-Host ("SPOTIFY_UPDATER_DISCOVERY_REPORT_PASS functions={0} urls={1} candidate_lines={2}" -f @($r.target_functions.PSObject.Properties).Count,@($r.production_spotify_urls).Count,@($r.candidate_related_lines).Count)

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Spotify-Updater-Discovery-v0.1.0
          path: spotify-updater-current-audit.json
          if-no-files-found: error
          retention-days: 14
