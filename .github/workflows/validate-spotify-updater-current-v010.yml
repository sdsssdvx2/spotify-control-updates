name: Validate Current Spotify Updater v0.1.0

on:
  push:
    branches:
      - validate/spotify-updater-current-v0.1.0
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'
  pull_request:
    paths:
      - 'validation/spotify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spotify-updater-current-v010.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove validation-only exact-head scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Wrong production merge base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@(
            'validation/spotify-updater-current-v0.1.0/audit.py',
            'validation/spotify-updater-current-v0.1.0/validate_current.ps1',
            '.github/workflows/validate-spotify-updater-current-v010.yml'
          )
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 3){throw "Expected exactly 3 validation-only files; got $($changed.Count): $($changed -join ', ')"}
          Write-Host "SPOTIFY_UPDATER_SCOPE_PASS head=$actual"

      - name: Parse validation sources
        shell: powershell
        run: |
          python -m py_compile validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw 'Spotify updater audit failed Python compile.'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'validation/spotify-updater-current-v0.1.0/validate_current.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message)};throw 'Current Spotify validator failed PowerShell 5.1 parse.'}
          Write-Host 'SPOTIFY_UPDATER_VALIDATION_PARSE_PASS'

      - name: Reconstruct exact production and audit updater path
        shell: powershell
        run: |
          python validation/spotify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw "Spotify updater audit failed: $LASTEXITCODE"}

      - name: Validate current official Spotify candidate in isolated staging
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/spotify-updater-current-v0.1.0/validate_current.ps1
          if($LASTEXITCODE -ne 0){throw "Current Spotify candidate trust-path validation failed: $LASTEXITCODE"}

      - name: Validate final evidence consistency
        shell: powershell
        run: |
          $r=Get-Content spotify-updater-current-audit.json -Raw|ConvertFrom-Json
          $e=Get-Content spotify-current-candidate-evidence.json -Raw|ConvertFrom-Json
          if($r.result -ne 'AUDIT_PASS'){throw 'Audit result is not PASS.'}
          if($r.validation_head -ne (git rev-parse HEAD).Trim()){throw 'Audit head mismatch.'}
          if($r.production_main.sha256 -ne 'e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18'){throw 'Production main identity mismatch.'}
          if($r.production_addon.sha256 -ne '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86'){throw 'Production addon identity mismatch.'}
          if($e.actual_sha256 -cne $e.candidate_sha256 -or [int64]$e.actual_size -ne [int64]$e.candidate_size){throw 'Candidate identity evidence inconsistent.'}
          if([string]$e.authenticode_status -ne 'Valid'){throw 'Candidate Authenticode evidence is not Valid.'}
          if(([string]$e.product_version).Trim() -cne ([string]$e.candidate_fullversion).Trim()){throw 'Candidate ProductVersion/fullversion evidence inconsistent.'}
          if([string]$e.if_match_mode -ne 'production-normalized-etag'){throw 'Conditional-download evidence did not use production-normalized ETag.'}
          if(-not [bool]$e.compatible_with_latest_spicetify){throw 'Latest Spicetify compatibility evidence is false.'}
          Write-Host ("SPOTIFY_UPDATER_REPORT_PASS candidate={0} full={1} spicetify={2} range={3}->{4} functions={5}" -f $e.candidate_version,$e.candidate_fullversion,$e.spicetify_tag,$e.spicetify_min,$e.spicetify_max,@($r.target_functions.PSObject.Properties).Count)

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Spotify-Updater-Current-v0.1.0
          path: |
            spotify-updater-current-audit.json
            spotify-current-candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
