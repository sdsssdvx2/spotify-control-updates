name: Validate Custom App Production Recovery Evidence Envelope v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-evidence-envelope-v0.1.0]
    paths: ['validation/custom-app-production-recovery-evidence-envelope-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-evidence-envelope-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-plan-contract-v0.1.0]
    paths: ['validation/custom-app-production-recovery-evidence-envelope-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-evidence-envelope-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='b266bad660d4b7bc87e7093c5b12f0cff1dc466f';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated recovery-plan head'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-evidence-envelope-v010.yml','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|?{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($x in $allowed){if($x -notin $changed){throw "missing $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_SCOPE_PASS'

      - name: Prove exact immutable pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','211029611decd8b14db43e153577c729cbd22f2b'),
            @($h,'validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','baf4a3909b7def1d136b1f5396e1dd35b7bbfe09'),
            @($h,'validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('b266bad660d4b7bc87e7093c5b12f0cff1dc466f','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('ddc84778ab4815d4174198727b8d1d052a02182e','validation/custom-app-production-pre-apply-preparation-v0.1.0/custom-app-production-pre-apply-preparation.ps1','9b039819e7b2278fe4cf15c8585336dd07a8e8e3'),
            @('ddc84778ab4815d4174198727b8d1d052a02182e','validation/custom-app-production-pre-apply-preparation-v0.1.0/test_custom_app_production_pre_apply_preparation.ps1','cc79e9879dd629956613cd8ecbe73971203f2d5e'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_PINS_PASS'

      - name: Parse and audit bounded durable-evidence-only mutation
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-evidence-envelope-v0.1.0';foreach($f in @("$d/custom-app-production-recovery-evidence.ps1","$d/test_custom_app_production_recovery_evidence.ps1","$d/probe_custom_app_production_recovery_evidence.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-evidence.ps1" -Raw
          foreach($m in @('preparation_fingerprint','prepared_result_material_sha256','app_backup_tree_sha256','persistence_fingerprint','immutable_create_new=$true','read_after_write_verified=$true','Open-CustomAppProductionCrashJournalLockV010','Read-CustomAppProductionCrashJournalUnlockedV010','Write-CustomAppProductionCrashJournalDurableFileV010','FileMode]::CreateNew','recovery-evidence-must-be-created-at-prepared-revision-zero','evidence_is_authority=$false','execution_authorized=$false','restore_authorized=$false','apply_authorized=$false','cleanup_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "recovery evidence marker missing $m"}}
          if(([regex]::Matches($core,'Write-CustomAppProductionCrashJournalDurableFileV010')).Count -ne 1){throw 'recovery evidence durable writer call count drifted'}
          foreach($x in @('[IO.Directory]::Move','[IO.Directory]::Delete','[IO.File]::Copy','Move-Item','Copy-Item','Remove-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Restore-SpotifyPersistenceBackup','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppProductionSpicetifyApplyExecutorV010','Invoke-CustomAppProductionPostApplyCommitCleanupV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "recovery evidence core gained forbidden mutation primitive $x"}}
          if($core -match 'evidence_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'recovery evidence authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_recovery_evidence.ps1" -Raw;foreach($m in @('future evidence','evidence replay accepted','late evidence creation accepted','evidence failed after phase advance','prepared rehash tamper','authority-polluted prepared result','prepared path mismatch','top-level evidence tamper + rehash','deep prepared+envelope tamper + rehash','corrupt evidence JSON','wrong transaction','corrupt journal','lock contention','oversize evidence','separate-process recovery evidence probe')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "recovery evidence coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_PARSE_AUDIT_PASS'

      - name: Materialize exact sibling validation dependencies
        shell: powershell
        run: |
          $deps=@(
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'))
          foreach($d in $deps){$path=$d[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:RE_SPEC="$($d[0])`:$path";$env:RE_OUT=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['RE_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['RE_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual -cne $d[2]){throw "materialized blob drift $path $actual != $($d[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_MATERIALIZATION_PASS'

      - name: Run durable recovery-evidence matrix twice
        shell: powershell
        run: |
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1';if($LASTEXITCODE){throw "recovery evidence matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_MATRIX_REPEAT_PASS'

      - name: Replay exact recovery-plan parent contract
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-plan-contract-v0.1.0/test_custom_app_production_recovery_plan.ps1';if($LASTEXITCODE){throw 'recovery-plan parent regression failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_PARENT_PASS'

      - name: Rebuild journal-integrated candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py';if($LASTEXITCODE){throw 'journal-integrated parent build failed'}
          $a='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/addon-manager.ps1';$m='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length -ne 973527 -or $ah -cne '3eac8cf4bfdcbbc38e7d4c01186a583fd13f96a27a98d8f6903147a4341da823'){throw "journal-integrated addon parent drift size=$((Get-Item $a).Length) sha=$ah"};if($mh -cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main candidate drift'}
          $s=Join-Path $env:RUNNER_TEMP 'recovery-evidence-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_SELFTEST_PASS'

      - name: Prove parent and production surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='b266bad660d4b7bc87e7093c5b12f0cff1dc466f';$expected=@('.github/workflows/validate-custom-app-production-recovery-evidence-envelope-v010.yml','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|?{$_ -notin $expected});if($bad.Count){throw "unexpected changed surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','validation/custom-app-production-journaled-orchestrator-fixture-v0.1.0/custom-app-production-journaled-orchestrator-fixture.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim() -cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-evidence-envelope-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_recovery_plan_parent=$p;durable_create_new=$true;shared_journal_lock=$true;prepared_phase_only_write=$true;journal_preparation_fingerprint_anchor=$true;read_after_write_verified=$true;separate_process_restart_read=$true;restore_executed=$false;spicetify_apply_executed=$false;cleanup_executed=$false;production_mutation_authority=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_EVIDENCE_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-evidence-envelope-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1
            validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1
            validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1
            validation/custom-app-production-recovery-evidence-envelope-v0.1.0/ci-evidence.json
          if-no-files-found: error
