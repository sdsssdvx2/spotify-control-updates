name: Validate Performance Phase 2 v0.5.6 Paused Guard
on:
  push:
    branches:
      - validate/performance-phase2-v0.5.6-paused-guard
    paths:
      - 'validation/performance-phase2-v0.5.6/**'
      - '.github/workflows/validate-performance-phase2-v056-paused-guard.yml'
  pull_request:
    paths:
      - 'validation/performance-phase2-v0.5.6/**'
      - '.github/workflows/validate-performance-phase2-v056-paused-guard.yml'
permissions:
  contents: read
jobs:
  validate-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove validation-only scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          git cat-file -e "$base^{commit}"
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{$_ -notlike 'validation/performance-phase2-v0.5.6/*' -and $_ -ne '.github/workflows/validate-performance-phase2-v056-paused-guard.yml'})
          if($bad.Count){throw "Validation branch touched production/out-of-scope files: $($bad -join ', ')"}
          Write-Host 'PHASE2_V056_SCOPE_PASS'
      - name: Build exact deterministic package
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.6/build_v056.py
          if($LASTEXITCODE -ne 0){throw "v0.5.6 build failed: $LASTEXITCODE"}
          $zip='SpotifyControl-Production-Lazy-Overlay-Paused-Guard-Revalidation-v0.5.6.zip'
          $unpack='phase2-v056-unpacked'
          $script=Join-Path $unpack 'track-transition-overlay-paused-guard-revalidation.ps1'
          if(Test-Path $unpack){Remove-Item $unpack -Recurse -Force}
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack
          $scriptSize=(Get-Item $script).Length
          $scriptHash=(Get-FileHash $script -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSize=(Get-Item $zip).Length
          $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($scriptSize -ne 132911 -or $scriptHash -ne '3f4f72363bfbedf2a0f04b2efbcc7433daf6e73db9ca14f14997df01afc32187'){throw "Generated script identity drifted: $scriptSize/$scriptHash"}
          if($zipSize -ne 166343 -or $zipHash -ne '0ac2c6e266fa9922891d24e03073638ddd1410ee7dac4b25b06fd3bb8de9adb0'){throw "Generated package identity drifted: $zipSize/$zipHash"}
          Write-Host "PHASE2_V056_IMMUTABLE_IDENTITY_PASS package_size=$zipSize package_sha=$zipHash script_size=$scriptSize script_sha=$scriptHash"
      - name: PowerShell 5.1 parse and no-audible-leak static contract
        shell: powershell
        run: |
          $p='phase2-v056-unpacked\track-transition-overlay-paused-guard-revalidation.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message)};throw 'Generated v0.5.6 failed PowerShell 5.1 parse.'}
          $s=Get-Content $p -Raw
          foreach($x in @('TrySkipNextAsync','SPOTIFY_NEXT_CONFIRMED','current-v0620-r9','williams-counterbalanced-4x4','verified_transitions_expected=48','WS_EX_NOACTIVATE','SetMasterVolume(0.0f','SpotifyControlProcessFreeze','SuspendAll()','spotify_play_command_used=$false','spotify_paused_transition_design=$true','production_overlay_state_unchanged_exact','extension_payloads_mutated=$false','global_media_keys_used=$false')){if($s.IndexOf($x,[StringComparison]::Ordinal) -lt 0){throw "Missing v0.5.6 safety/runtime contract: $x"}}
          foreach($x in @('TryPlayAsync','-Command Play',"ValidateSet('Play'",'keybd_event','SpotifyControlMediaKeys','Send-MediaKey','[byte]0xB0','[byte]0xB3')){if($s.IndexOf($x,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Forbidden audible/global media-control surface survived: $x"}}
          function Get-FunctionText([string]$name){
            $start=$s.IndexOf("function $name {")
            if($start -lt 0){throw "Function missing: $name"}
            $end=$s.IndexOf("`r`nfunction ",$start+20)
            if($end -lt 0){$end=$s.IndexOf("`nfunction ",$start+20)}
            if($end -lt 0){$end=$s.IndexOf("`r`ntry{",$start+20)}
            if($end -lt 0){$end=$s.IndexOf("`ntry{",$start+20)}
            if($end -lt 0){$end=$s.Length}
            return $s.Substring($start,$end-$start)
          }
          $prep=Get-FunctionText 'Prepare-Variant'
          $arm=$prep.IndexOf('Arm-SpotifySilentGuard',[StringComparison]::Ordinal)
          $launch=$prep.IndexOf('Start-SpotifyHiddenForVariant',[StringComparison]::Ordinal)
          if($arm -lt 0 -or $launch -lt 0 -or $arm -ge $launch){throw 'Audio guard is not armed before Spotify launch.'}
          $measure=Get-FunctionText 'Measure-TransitionCondition'
          if($measure.IndexOf('Restore-SpotifyAudioForTest',[StringComparison]::Ordinal) -ge 0){throw 'Per-condition measurement still restores Spotify audio before process shutdown.'}
          if($measure.IndexOf("playback_status -eq 'Playing'",[StringComparison]::Ordinal) -lt 0){throw 'Unexpected Playing-state rejection invariant is missing.'}
          $media=Get-FunctionText 'Invoke-SpotifyMediaCommand'
          if($media.IndexOf("ValidateSet('Pause','Next')",[StringComparison]::Ordinal) -lt 0){throw 'Spotify media command surface is not restricted to Pause/Next.'}
          Write-Host 'PHASE2_V056_PS51_NO_AUDIBLE_LEAK_STATIC_PASS'
      - name: Verify exact packaged production overlay sources
        shell: powershell
        run: |
          $expected=@{
            'phase2-v056-unpacked\overlay\apply-overlay.ps1'='053a597e834aab959a588350160ce81046ceda66e2a2ac233eeff8af78fea544'
            'phase2-v056-unpacked\overlay\lazy-custom-app-loader.js'='c38af0f6266747f50d2a0c05e9a49d5ffb34135738715fab6321ff4ae79623d9'
            'phase2-v056-unpacked\overlay\targets.json'='c255e53066abbd730467e0c1d92e81dd907e1ea2f245daf6f0d080d2239fea35'
          }
          foreach($p in $expected.Keys){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $expected[$p]){throw "Overlay source identity mismatch: $p $h"}}
          $t=Get-Content phase2-v056-unpacked\overlay\targets.json -Raw|ConvertFrom-Json
          if((@($t.targets|ForEach-Object{$_.id}|Sort-Object)-join ',') -ne 'better-local-files,playlist-maker'){throw 'Packaged production overlay target set drifted.'}
          Write-Host 'PHASE2_V056_OVERLAY_SOURCE_PASS'
      - name: Run generated Windows real-engine and guard SelfTest
        shell: powershell
        env:
          SPOTIFYCONTROL_TEST_RESIDUAL_CLEANUP: '0'
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File phase2-v056-unpacked\track-transition-overlay-paused-guard-revalidation.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "v0.5.6 SelfTest failed: $LASTEXITCODE"}
      - name: Verify internal checksums and deterministic rebuild
        shell: powershell
        run: |
          foreach($line in Get-Content phase2-v056-unpacked\SHA256SUMS.txt){if($line -notmatch '^([0-9a-f]{64})  (.+)$'){throw "Bad checksum row: $line"};$p=Join-Path phase2-v056-unpacked ($Matches[2]-replace '/','\');$h=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $Matches[1]){throw "Checksum mismatch: $($Matches[2])"}}
          $zip='SpotifyControl-Production-Lazy-Overlay-Paused-Guard-Revalidation-v0.5.6.zip';$size1=(Get-Item $zip).Length;$sha1=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          python validation/performance-phase2-v0.5.6/build_v056.py
          if($LASTEXITCODE -ne 0){throw 'Second deterministic build failed.'}
          $size2=(Get-Item $zip).Length;$sha2=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($size1 -ne $size2 -or $sha1 -ne $sha2){throw "Non-deterministic v0.5.6 package: $size1/$sha1 vs $size2/$sha2"}
          if($size2 -ne 166343 -or $sha2 -ne '0ac2c6e266fa9922891d24e03073638ddd1410ee7dac4b25b06fd3bb8de9adb0'){throw "Second build no longer matches immutable artifact identity: $size2/$sha2"}
          Write-Host "PHASE2_V056_DETERMINISTIC_IDENTITY_PASS size=$size2 sha=$sha2"
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Production-Lazy-Overlay-Paused-Guard-Revalidation-v0.5.6
          path: SpotifyControl-Production-Lazy-Overlay-Paused-Guard-Revalidation-v0.5.6.zip
          if-no-files-found: error
          retention-days: 14
