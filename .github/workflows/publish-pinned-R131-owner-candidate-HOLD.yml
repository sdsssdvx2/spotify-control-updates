name: HOLD publish SHA-pinned R131 Windows owner source
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/publish-pinned-R131-owner-candidate-HOLD.yml
permissions: {actions: read, contents: write}
jobs:
  guarded-single-publication:
    runs-on: windows-2025
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve previously validated exact Windows artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedRepo='sdsssdvx2/spotify-control-updates'
          $expectedBranch='refs/heads/validate/spotify-exit-immediate-maintenance-HOLD'
          if($env:GITHUB_REPOSITORY -cne $expectedRepo -or $env:GITHUB_REF -cne $expectedBranch){throw 'WRONG_REPO_OR_BRANCH'}
          $download=Join-Path $env:RUNNER_TEMP 'R131-FinalPinned'
          [void][IO.Directory]::CreateDirectory($download)
          & gh run download 43428231807 --repo $expectedRepo --name spotify-control-R131-pinned-owner-candidate-HOLD --dir $download
          if($LASTEXITCODE -ne 0){throw 'PREVIOUSLY_VALIDATED_ARTIFACT_NOT_AVAILABLE'}
          $file=Join-Path $download 'spotify-control.ps1'
          $info=Get-Item -LiteralPath $file -Force -ErrorAction Stop
          if($info.PSIsContainer -or $info.Length -ne 316638 -or
             ($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'PINNED_SOURCE_SIZE_INVALID'}
          $sha=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne '16db29223a50c9b2a504a543ab01fa898660642904e4be0414b959195bb113b1'){throw 'PINNED_SOURCE_SHA_INVALID'}
          $astErrors=$null;$astTokens=$null
          [void][Management.Automation.Language.Parser]::ParseFile($file,[ref]$astTokens,[ref]$astErrors)
          if(@($astErrors).Count -ne 0){throw 'PINNED_SOURCE_WINDOWS_SYNTAX_INVALID'}
          $src=[IO.File]::ReadAllText($file,[Text.Encoding]::UTF8)
          foreach($gate in @('owner-reviewed-preimage','Assert-SpicetifyOwnerPreimageAdoption',
              'R131_UNSETTLED_PRE_MIGRATION_LEDGER_OWNER_REVIEW_HOLD','R131_JOURNAL_PUBLISHED_READBACK_MISMATCH')){
             if(-not $src.Contains($gate)){throw 'PINNED_OWNER_GUARD_MISSING'}
          }
          $headers=@{
             Authorization=('Bearer '+$env:GH_TOKEN)
             Accept='application/vnd.github+json'
             'X-GitHub-Api-Version'='2022-11-28'
             'User-Agent'='SpotifyControl-HOLD-SourcePublisher'
          }
          $api='https://api.github.com/repos/'+$expectedRepo
          $ref=Invoke-RestMethod -Method Get -Uri ($api+'/git/ref/heads/validate/spotify-exit-immediate-maintenance-HOLD') -Headers $headers
          if([string]$ref.object.sha -cne $env:GITHUB_SHA){throw 'BRANCH_DRIFT_NO_PUBLISH'}
          $main=Invoke-RestMethod -Method Get -Uri ($api+'/git/ref/heads/main') -Headers $headers
          if([string]$main.object.sha -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'PUBLIC_STABLE_DRIFT_NO_PUBLISH'}
          $destination='validation/spotify-exit-immediate-maintenance-HOLD/spotify-control-R131-Owner-Candidate-HOLD.ps1'
          $url=$api+'/contents/'+$destination
          try {
             $exists=Invoke-RestMethod -Method Get -Uri ($url+'?ref=validate%2Fspotify-exit-immediate-maintenance-HOLD') -Headers $headers -ErrorAction Stop
             throw 'DESTINATION_ALREADY_EXISTS_NO_OVERWRITE'
          } catch {
             if($_.Exception.Message -ceq 'DESTINATION_ALREADY_EXISTS_NO_OVERWRITE'){throw}
             $response=$_.Exception.Response
             if($null -eq $response -or [int]$response.StatusCode -ne 404){throw 'DESTINATION_EXISTENCE_UNKNOWN'}
          }
          $body=@{
             message='build(HOLD): preserve byte-exact verified R131 owner candidate for one-pass deployment preparation'
             content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($file))
             branch='validate/spotify-exit-immediate-maintenance-HOLD'
          } | ConvertTo-Json -Depth 4 -Compress
          try {
             $response=Invoke-RestMethod -Method Put -Uri $url -Headers $headers -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ErrorAction Stop
          } catch {throw 'GITHUB_PINNED_SOURCE_CREATE_FAILED_NO_RETRY'}
          if([string]$response.content.path -cne $destination -or
             [int64]$response.content.size -ne 316638 -or
             [string]::IsNullOrWhiteSpace([string]$response.commit.sha)){throw 'SOURCE_PUBLICATION_READBACK_INVALID'}
          Write-Host 'R131_HOLD_ONLY_SOURCE_PUBLISHED_EXACT_SHA256=PASS'
          Write-Host ('R131_HOLD_SOURCE_COMMIT='+[string]$response.commit.sha)
          Write-Host 'USER_PC=UNCHANGED;PUBLIC_MAIN=UNCHANGED;SPICETIFY_CLI_RUNS=0'
