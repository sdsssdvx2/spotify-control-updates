name: HOLD R113 private-ahead exact two-function product candidate and authentic Spicetify 2464 to 2465 update
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-private-ahead-real-update-R113-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/build-private-stable-ahead-R112-HOLD.py
permissions: {contents: read, actions: read}
jobs:
  real-signed-spotify-and-spicetify-cli:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Rebuild exact R70 main and WScript, prepare R72 vendor app fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'R73_PUBLIC_MAIN_STABLE_SOURCE_CHANGED'
          }
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          foreach($py in @(
            'build-combined-exit-and-shortcut-R37-HOLD.py',
            'build-eventdriven-vbs-R45-HOLD.py',
            'build-single-discovery-maintenance-R49-HOLD.py',
            'build-shared-maintenance-lock-R54-HOLD.py',
            'build-rapid-restart-vbs-R58-HOLD.py',
            'build-wmi-selfheal-R63-HOLD.py',
            'build-wmi-rebind-R66-HOLD.py',
            'build-wmi-logon-recovery-R69-HOLD.py',
            'build-boot-wmi-release-R70-HOLD.py',
            'accept-real-signed-spotify-exit-R72-HOLD.py'
          )){
            & python ($base+$py)
            if($LASTEXITCODE -ne 0){throw ('R73_VERIFIED_PRODUCT_BUILD_OR_COMPOSITE_FAILED_'+$py)}
          }
          Write-Host 'R75_R70_SHA_PINNED_MAIN_AND_VENDOR_FIXTURE_BUILT=PASS'
      - name: Download and authenticate Spotify official current signed x64 full installer on disposable runner only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-CimInstance Win32_Process -Filter "Name='Spotify.exe'" -ErrorAction Stop).Count -ne 0){
            throw 'R72_FOREIGN_SPOTIFY_PROCESS_PRESENT_BEFORE_INSTALL'
          }
          $app=Join-Path $env:APPDATA 'Spotify\Spotify.exe'
          if(Test-Path -LiteralPath $app){throw 'R72_EXISTING_SPOTIFY_INSTALL_PRESENT'}
          $installer=Join-Path $env:RUNNER_TEMP 'R72-SpotifyFullSetupX64.exe'
          if(Test-Path -LiteralPath $installer){throw 'R72_INSTALLER_PREEXISTED'}
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --output $installer 'https://download.scdn.co/SpotifyFullSetupX64.exe'
          if($LASTEXITCODE -ne 0){throw 'R72_OFFICIAL_INSTALLER_TLS_FETCH_UNAVAILABLE'}
          $stat=Get-Item -LiteralPath $installer -ErrorAction Stop
          if($stat.Length -lt 20000000 -or $stat.Length -gt 250000000){
            throw 'R72_OFFICIAL_INSTALLER_UNEXPECTED_SIZE'
          }
          $signature=Get-AuthenticodeSignature -LiteralPath $installer -ErrorAction Stop
          if([string]$signature.Status -cne 'Valid' -or
             $null -eq $signature.SignerCertificate -or
             [string]$signature.SignerCertificate.Subject -cnotmatch '(?i)(^|,)\s*O=Spotify AB(,|$)'){
             throw 'R72_OFFICIAL_INSTALLER_AUTHENTICODE_NOT_VERIFIED'
          }
          Write-Host 'R72_SPOTIFY_VENDOR_AB_SIGNATURE_AND_TLS=PASS'
          Write-Host ('R72_OFFICIAL_CURRENT_INSTALLER_SHA256='+((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()))
          Write-Host ('R72_OFFICIAL_CURRENT_INSTALLER_BYTES='+$stat.Length)
          $proc=Start-Process -FilePath $installer -ArgumentList @('/silent','/skip-app-launch') -PassThru -ErrorAction Stop
          if(-not $proc.WaitForExit(140000)){
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'R72_OFFICIAL_CURRENT_INSTALLER_DEADLINE_EXCEEDED'
          }
          if($proc.ExitCode -ne 0){throw 'R72_OFFICIAL_CURRENT_INSTALLER_NONZERO_EXIT'}
          $appeared=$false
          for($i=0;$i -lt 160;$i++){
            if(Test-Path -LiteralPath $app -PathType Leaf){$appeared=$true;break}
            Start-Sleep -Milliseconds 500
          }
          if(-not $appeared){throw 'R72_SPOTIFY_EXE_NOT_PRODUCED_BY_OFFICIAL_INSTALLER'}
          $sig=Get-AuthenticodeSignature -LiteralPath $app -ErrorAction Stop
          if([string]$sig.Status -cne 'Valid' -or
             $null -eq $sig.SignerCertificate -or
             [string]$sig.SignerCertificate.Subject -cnotmatch '(?i)(^|,)\s*O=Spotify AB(,|$)'){
            throw 'R72_INSTALLED_REAL_SPOTIFY_EXE_NOT_SIGNED_BY_SPOTIFY_AB'
          }
          if(@(Get-CimInstance Win32_Process -Filter "Name='Spotify.exe'" -ErrorAction Stop).Count -ne 0){
            throw 'R72_SPOTIFY_AUTOSTARTED_DESPITE_SKIP_APP_LAUNCH'
          }
          Remove-Item -LiteralPath $installer -Force -ErrorAction Stop
          Write-Host 'R72_REAL_SIGNED_SPOTIFY_X64_INSTALLED_IN_EPHEMERAL_RUNNER=PASS'
          Write-Host 'R72_USER_ACCOUNT_SIGNIN=NO;OWNER_PC_MODIFIED=NO;RELEASE_PUBLISHED=NO'
      - name: Authenticate new official v2.46.5 archive and derive exact executable from pinned bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $asset=Join-Path $env:RUNNER_TEMP 'r109-spicetify-v2465-official.zip'
          if(Test-Path -LiteralPath $asset){throw 'R75_OFFICIAL_ARCHIVE_PREEXISTED'}
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 100 --output $asset 'https://github.com/spicetify/cli/releases/download/v2.46.5/spicetify-2.46.5-windows-x64.zip'
          if($LASTEXITCODE -ne 0){throw 'R75_CLI_UPSTREAM_RELEASE_FETCH_FAILED'}
          $sourceSha=(Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sourceSha -cne '34db1d8fbbdc0d130782891b7c530d4e69f0c426a9361e8a65925cf4f54e056e'){
            throw 'R75_UPSTREAM_OFFICIAL_RELEASE_ASSET_SHA_CHANGED'
          }
          $unpack=Join-Path $env:RUNNER_TEMP 'r75-extract'
          $dest=Join-Path $env:RUNNER_TEMP 'r75-official-spicetify'
          if((Test-Path -LiteralPath $unpack) -or (Test-Path -LiteralPath $dest)){
            throw 'R75_SPICETIFY_TEMP_PREEXISTED'
          }
          Expand-Archive -LiteralPath $asset -DestinationPath $unpack -ErrorAction Stop
          $cliItems=@(Get-ChildItem -LiteralPath $unpack -File -Filter 'spicetify.exe' -Recurse -ErrorAction Stop)
          if($cliItems.Count -ne 1){throw 'R75_REAL_CLI_ARCHIVE_EXE_CARDINALITY_INVALID'}
          $exactExeSha=(Get-FileHash -LiteralPath $cliItems[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($exactExeSha -notmatch '^[0-9a-f]{64}$'){
            throw 'R109_ARCHIVE_EXE_EXTRACTED_DIGEST_NOT_VALID'
          }
          $envLine='R109_OFFICIAL_EXE_SHA256='+$exactExeSha+[Environment]::NewLine
          [IO.File]::AppendAllText($env:GITHUB_ENV,$envLine,(New-Object Text.UTF8Encoding($false)))
          [void][IO.Directory]::CreateDirectory($dest)
          [IO.File]::Copy($cliItems[0].FullName,(Join-Path $dest 'spicetify.exe'),$false)
          Remove-Item -LiteralPath $asset -Force -ErrorAction Stop
          Write-Host 'R109_OFFICIAL_RELEASE_2465_ASSET_SHA256_PINNED_AND_EXE_EXTRACTED=PASS'
      - name: Unmodified v0.6.30 full main must positively admit signed Spotify 1.3.8 with official CLI 2.46.5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          # Reuse exact R75 source byte-for-byte. Only in-memory harness-side
          # release IDs, expected CLI digest, and positive compat assertions
          # change. No product source is edited or auto-mutation authorized.
          @'
          from pathlib import Path
          import os,subprocess
          file=Path("validation/spotify-exit-immediate-maintenance-HOLD/accept-real-cli-compatibility-R75-HOLD.py").resolve()
          orig=file.read_text("utf-8")
          expected=os.environ["R109_OFFICIAL_EXE_SHA256"]
          old="3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db"
          assert orig.count(old)>=2 and len(expected)==64, "R109_EXACT_HARNESS_DIGEST_BINDING_CHANGED"
          updated=orig.replace(old,expected)
          updated=updated.replace("2.46.4","2.46.5").replace(r"2\.46\.4",r"2\.46\.5")
          updated=updated.replace("1.3.7","1.3.9")
          assert updated!=orig and "3563f26acd" not in updated
          # Signed Spotify x64 is currently 1.3.8; no synthetic process.
          namespace={"__file__":str(file),"__name__":"__main__"}
          exec(compile(updated,str(file),"exec"),namespace)
          print("R109_ONLY_R75_TEST_HARNESS_EXPECTATIONS_ADAPTED=PASS")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R109_PINNED_NATIVE_FULL_MAIN_HARNESS_FAILED'}
          $native=Join-Path $env:RUNNER_TEMP 'spotify-r75-real-spicetify-compatibility.ps1'
          # Generated real Windows native harness: change only the truth-
          # expectation from R75 unsupported to R109 supported, not code.
          @'
          from pathlib import Path
          import os
          f=Path(os.environ["RUNNER_TEMP"])/"spotify-r75-real-spicetify-compatibility.ps1"
          s=f.read_text("utf-8")
          items=(
            ("$live.current_spotify_supported -ne $false",
             "$live.current_spotify_supported -ne $true"),
            ("R75_SPOTIFY_138_ABOVE_OFFICIAL_SPICETIFY_2464_MAX_137=TRUE",
             "R109_SPOTIFY_138_SUPPORTED_WITH_2465_MAX_139=TRUE"),
            ("R75_MAIN_COMPATIBILITY_CURRENT_SUPPORTED_FALSE=PASS",
             "R109_MAIN_COMPATIBILITY_CURRENT_SUPPORTED_TRUE=PASS")
          )
          for before,after in items:
            assert s.count(before)==1, "R109_REAL_HARNESS_SOURCE_DRIFT_"+before
            s=s.replace(before,after,1)
          # New official Spotify installers may already be 1.3.9.
          # Only officially supported 1.3.8 or 1.3.9 is admitted.
          old_version=r"^1\.3\.8(\.|$)"
          new_version=r"^1\.3\.(?:8|9)(\.|$)"
          assert s.count(old_version)==1, "R109_REAL_SIGNED_VENDOR_VERSION_GUARD_MOVED"
          s=s.replace(old_version,new_version,1)
          s=s.replace("R75_THIS_ACCEPTANCE_EXPECTS_THE_GENUINE_SPOTIFY_1_3_8",
                      "R109_EXPECTS_GENUINE_SIGNED_SPOTIFY_138_OR_139",1)
          f.write_text(s,encoding="utf-8",newline="\n")
          print("R109_REAL_R75_HARNESS_POSITIVE_ONLY=PASS")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R109_FULL_MAIN_POSITIVE_ASSERTION_PREPARATION_FAILED'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($native,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R75_NATIVE_REAL_VENDOR_STACK_PS51_PARSE_FAILED'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $native
          if($LASTEXITCODE -ne 0){throw 'R75_REAL_OFFICIAL_SPICETIFY_COMPATIBILITY_FAILCLOSED_UNPROVEN'}
          Write-Host 'R109_REAL_SIGNED_138_AND_OFFICIAL_2465_MAX_139_UNMODIFIED_V0630_GUARD=PASS'
          Write-Host 'R109_OWNER_PC_AND_PUBLIC_RELEASE=UNCHANGED_HOLD'
      - name: R113 retrieve genuine official Bootstrap v1.0.6 from preverified GitHub Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > "$RUNNER_TEMP/r110-bootstrap-archive.zip"
          python - <<'PY'
          import hashlib,io,os,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"r110-bootstrap-archive.zip") as outer:
              data=outer.read("SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip")
          with zipfile.ZipFile(io.BytesIO(data)) as inner:
              original=inner.read("bootstrap/spotify-control-self-updater.ps1")
          assert (len(original),hashlib.sha256(original).hexdigest())==(
              42963,"d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6")
          target=root/"R113-bootstrap-1.0.6-exact.ps1"
          with target.open("xb") as fp:fp.write(original)
          print("R113_EXACT_OFFICIAL_BOOTSTRAP_V106_PINNED=PASS")
          PY
          rm -f "$RUNNER_TEMP/r110-bootstrap-archive.zip"
      - name: R113 real discovery of older official 2.46.4 to 2.46.5 using R112 two-function candidate AgentTick, hosted scratch only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){
            throw 'R113_GITHUB_HOSTED_WINDOWS_ONLY'
          }
          if(@(Get-Process Spotify -ErrorAction SilentlyContinue).Count -ne 0){throw 'R113_SPOTIFY_RUNNING'}
          $root=Join-Path $env:LOCALAPPDATA 'SpotifyControl'
          $bin=Join-Path $root 'bin'
          $cliDir=Join-Path $env:LOCALAPPDATA 'spicetify'
          if((Test-Path $root) -or (Test-Path $cliDir)){throw 'R113_SCRATCH_DESTINATION_PREEXISTED'}
          # Reconstruct the exact R112 two-function-only review candidate
          # from the immutable real v0.6.30 source in hosted scratch.
          & python validation/spotify-exit-immediate-maintenance-HOLD/build-private-stable-ahead-R112-HOLD.py
          if($LASTEXITCODE -ne 0){throw 'R113_TWO_FUNCTION_CANDIDATE_BUILD_FAILED'}
          $candidate='validation/spotify-exit-immediate-maintenance-HOLD/out/private-stable-ahead-R112/spotify-control.ps1'
          if((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             'beb850064670c078a679585ace25f8071daa88c0b264185c03ef3364329b431b'){
            throw 'R113_TWO_FUNCTION_CANDIDATE_SHA_DRIFT'
          }
          Write-Host 'R113_EXACT_TWO_FUNCTION_CANDIDATE_SOURCE_PIN=PASS'
          $source='validation/spotify-exit-immediate-maintenance-HOLD/out/release-staging-boot-wmi-R70/bin'
          $pins=@{
            'spotify-control.ps1'='beb850064670c078a679585ace25f8071daa88c0b264185c03ef3364329b431b'
            'spotify-control-agent.vbs'='e56609ed8927512595f55c01ea50dbb9c8c59e4a2c86dcb3d16195a565c604d5'
            'addon-manager.ps1'='5ab556c1d90b9f8e6d5784e238ffd1798c5363a0f7cd7b8313d1f106b5b6a285'
          }
          [void][IO.Directory]::CreateDirectory($bin)
          foreach($name in $pins.Keys){
            $src=if($name -ceq 'spotify-control.ps1'){$candidate}else{Join-Path $source $name}
            if((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pins[$name]){
              throw 'R113_RECONSTRUCTED_SOURCE_PIN_FAILED'
            }
            [IO.File]::Copy((Resolve-Path $src).Path,(Join-Path $bin $name),$false)
          }
          # Original Bootstrap v1.0.6 is a REQUIRED fourth operating component.
          # Earlier R108/R113 synthetic installations lacked it.
          $sourceBoot=Join-Path $env:RUNNER_TEMP 'R113-bootstrap-1.0.6-exact.ps1'
          if((Get-Item -LiteralPath $sourceBoot -ErrorAction Stop).Length -ne 42963 -or
             (Get-FileHash $sourceBoot -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){
            throw 'R113_OFFICIAL_BOOTSTRAP_SOURCE_PIN_INVALID'
          }
          $bootDir=Join-Path $root 'bootstrap'
          [void][IO.Directory]::CreateDirectory($bootDir)
          $boot=Join-Path $bootDir 'spotify-control-self-updater.ps1'
          [IO.File]::Copy($sourceBoot,$boot,$false)
          if((Get-FileHash $boot -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){
            throw 'R113_BOOTSTRAP_READBACK_CHANGED'
          }
          Write-Host 'R113_FULL_V0630_PLUS_OFFICIAL_BOOTSTRAP=PINNED'
          $spotify=Join-Path $env:APPDATA 'Spotify'
          $xpui=Join-Path $spotify 'Apps\xpui.spa'
          $prefs=Join-Path $spotify 'prefs'
          if(-not(Test-Path $xpui -PathType Leaf) -or -not(Test-Path $prefs -PathType Leaf)){
            throw 'R113_SIGNED_SPOTIFY_FIXTURE_MISSING'
          }
          $baseline=(Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant()
          $copy=Join-Path $env:RUNNER_TEMP 'R113-stock-xpui.spa'
          if(Test-Path $copy){throw 'R113_BACKUP_EXISTS'}
          [IO.File]::Copy($xpui,$copy,$false)
          if((Get-FileHash $copy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $baseline){
            throw 'R113_STOCK_BACKUP_UNVERIFIED'
          }
          $asset=Join-Path $env:RUNNER_TEMP 'R113-official-2464.zip'
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 100 --output $asset 'https://github.com/spicetify/cli/releases/download/v2.46.4/spicetify-2.46.4-windows-x64.zip'
          if($LASTEXITCODE -ne 0 -or (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0490380bf59e00c94cf6cb12bfac5152791b91bb8009aceef53c49815b45a56f'){
            throw 'R113_OFFICIAL_2464_ASSET_PIN_FAILED'
          }
          $extract=Join-Path $env:RUNNER_TEMP 'R113-cli-extracted'
          Expand-Archive -LiteralPath $asset -DestinationPath $extract -ErrorAction Stop
          $items=@(Get-ChildItem -LiteralPath $extract -Filter 'spicetify.exe' -Recurse -File)
          if($items.Count -ne 1){throw 'R113_CLI_SOURCE_CARDINALITY'}
          if((Get-FileHash $items[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
            throw 'R113_OFFICIAL_2464_BINARY_PIN_FAILED'
          }
          [void][IO.Directory]::CreateDirectory($cliDir)
          $cli=Join-Path $cliDir 'spicetify.exe'
          [IO.File]::Copy($items[0].FullName,$cli,$false)
          $env:PATH=$cliDir+';'+$env:PATH
          & $cli --bypass-admin --no-restart config spotify_path $spotify prefs_path $prefs
          if($LASTEXITCODE -ne 0){throw 'R113_MANAGED_CLI_CONFIG_INVALID'}
          $new=Join-Path $env:RUNNER_TEMP 'r75-official-spicetify\spicetify.exe'
          $newSha='e2a0fd568d104ff3b7fa55ea7cefc90ad5d4def42258a2f56032164587b46d22'
          if((Get-FileHash $new -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newSha){throw 'R113_LATEST_2465_BIN_NOT_PINNED'}
          Write-Host 'R113_OLD_2464_AND_LATEST_2465_OFFICIAL_BYTES=PASS'
          # Only owner permission; pending work must be discovered independently.
          $state=[ordered]@{schema=20;agent_mutation_enabled=$true;last_agent_event=$null;last_agent_decision=$null;last_agent_tick_utc=$null}
          $statePath=Join-Path $root 'state.json'
          [IO.File]::WriteAllText($statePath,($state|ConvertTo-Json -Compress),[Text.Encoding]::UTF8)
          $stdout=Join-Path $env:RUNNER_TEMP 'R113-main-stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'R113-main-stderr.txt'
          $outcome='HOLD_NOT_PROVEN'
          try {
            $main=Join-Path $bin 'spotify-control.ps1'
            $args='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$main+'" -Action AgentTick -AgentEvent SpotifyExit'
            $proc=Start-Process -FilePath 'powershell.exe' -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if(-not $proc.WaitForExit(180000)){
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              $exit='TIMEOUT'
            }else{$exit=if($proc.ExitCode -eq 0){'ZERO'}else{'NONZERO'}}
            $result=$null
            try{$result=Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json}catch{}
            $decisions=@('maintenance-phase-entered','maintenance-deferred-or-lease-busy','mutation-blocked-unhealthy-or-auto-ambiguous','pending-observed-mutation-disarmed','observe-only-closed','check-only-closed-no-pending','closed-check-not-due','running-check-not-due','check-only-running','noop')
            $decision=if($null -ne $result -and [string]$result.last_agent_decision -cin $decisions){[string]$result.last_agent_decision}else{'OTHER_OR_UNAVAILABLE'}
            $healthy=($null -ne $result -and $result.maintenance_check_healthy -eq $true)
            $updatePending=($null -ne $result -and $result.pending_spicetify_upgrade -eq $true)
            $updated=((Get-FileHash $cli -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $newSha)
            Write-Host ('R113_AGENTTICK_EXIT='+$exit)
            Write-Host ('R113_DISCOVERY_DECISION='+$decision)
            Write-Host ('R113_DISCOVERY_HEALTH='+$(if($healthy){'TRUE'}else{'FALSE_OR_UNVERIFIED'}))
            Write-Host ('R113_AUTHENTIC_UPGRADE_PENDING='+$(if($updatePending){'TRUE'}else{'FALSE_OR_UNVERIFIED'}))
            Write-Host ('R113_OFFICIAL_2465_BINARY_INSTALLED='+$(if($updated){'EXACT'}else{'NO'}))
            $class='NO_CHECK_REPORT'
            foreach($file in @(Get-ChildItem -LiteralPath $root -Filter '*check*.json' -File -Recurse -ErrorAction SilentlyContinue)){
              if($file.Length -gt 2097152){continue}
              $doc=$null
              try{$doc=Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json}catch{}
              if($null -eq $doc -or [string]$doc.phase -cne 'check-only'){continue}
              $errs=@($doc.errors | Where-Object{$_})
              $class=if($errs.Count -eq 0){'NO_ERRORS'}
                elseif(@($errs|Where-Object{$_ -match 'self-update'}).Count -gt 0){'SELF_UPDATE_DISCOVERY'}
                elseif(@($errs|Where-Object{$_ -match 'Spicetify install'}).Count -gt 0){'MANAGED_CLI_LAYOUT'}
                elseif(@($errs|Where-Object{$_ -match 'Spicetify latest'}).Count -gt 0){'OFFICIAL_CLI_RELEASE_DISCOVERY'}
                elseif(@($errs|Where-Object{$_ -match 'compatibility metadata'}).Count -gt 0){'COMPATIBILITY_METADATA'}
                elseif(@($errs|Where-Object{$_ -match 'Addon'}).Count -gt 0){'ADDON_SOURCE_CHECK'}
                else{'OTHER_PRIVATE_CHECK_FAILURE'}
              break
            }
            Write-Host ('R113_CHECK_ERROR_FAMILY='+$class)
            if($exit -ceq 'ZERO' -and $updated -and $decision -ceq 'maintenance-phase-entered'){
              $outcome='REAL_PRODUCT_UPDATED_EXACT_CLI'
            }
            Write-Host ('R113_PRODUCT_OUTCOME='+$outcome)
          } finally {
            $isStock=(Test-Path $xpui -PathType Leaf) -and ((Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $baseline)
            if(-not $isStock){
              [IO.File]::Copy($copy,$xpui,$true)
              if((Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant() -cne $baseline){throw 'R113_HOSTED_SCRATCH_RESTORE_FAILED'}
              Write-Host 'R113_HOSTED_TEST_ONLY_VANILLA_COPY_RECOVERED=PASS_NOT_PRODUCT_PROOF'
            }else{Write-Host 'R113_ORIGINAL_VENDOR_XPUI_EXACT=PASS'}
          }
          if($outcome -cne 'REAL_PRODUCT_UPDATED_EXACT_CLI'){throw 'R113_AUTO_UPDATE_HOLD_NOT_VERIFIED'}
          Write-Host 'R113_REAL_PRIVATE_AHEAD_SPICETIFY_2465_AUTO_UPDATE=PASS'
          Write-Host 'R113_REVIEW_CANDIDATE_ONLY;OWNER_PC_PUBLIC_MAIN_AND_USER_SETTINGS=UNCHANGED'
