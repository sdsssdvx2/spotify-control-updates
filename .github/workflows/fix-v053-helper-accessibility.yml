name: Fix v0.5.3 helper accessibility

on:
  push:
    branches:
      - validate/performance-phase2-v0.5.3
    paths:
      - 'validation/performance-phase2-v0.5.3/runtime_background_v053.ps1.inc'
      - '.github/workflows/fix-v053-helper-accessibility.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/performance-phase2-v0.5.3
          fetch-depth: 0
      - name: Apply exact one-line C# accessibility correction
        shell: powershell
        run: |
          $p='validation/performance-phase2-v0.5.3/runtime_background_v053.ps1.inc'
          $s=Get-Content $p -Raw
          $old='internal static void TryMuteControl(IAudioSessionControl control)'
          $new='static void TryMuteControl(IAudioSessionControl control)'
          if($s.Contains($old)){
            $s=$s.Replace($old,$new)
            [IO.File]::WriteAllText((Resolve-Path $p),$s,(New-Object Text.UTF8Encoding($false)))
          }elseif(-not $s.Contains($new)){
            throw 'Expected helper accessibility anchor not found.'
          }else{
            Write-Host 'V053_HELPER_ALREADY_FIXED'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $p
          git commit -m 'Fix v0.5.3 audio guard callback accessibility'
          git push origin HEAD:validate/performance-phase2-v0.5.3
