name: Validate Custom App Production Spicetify Apply Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-spicetify-apply-executor-v0.1.0]
    paths: ['validation/custom-app-production-spicetify-apply-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-spicetify-apply-executor-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-post-swap-apply-admission-v0.1.0]
    paths: ['validation/custom-app-production-spicetify-apply-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-spicetify-apply-executor-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='a4f6d4772afb895dd253a4c82a21643711ac0829';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated post-swap apply-admission head'}
          $a=@('.github/workflows/validate-custom-app-production-spicetify-apply-executor-v010.yml','validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $a});if($b.Count){throw "scope escaped: $($b -join ', ')"};foreach($x in $a){if($x -notin $c){throw "missing $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_SCOPE_PASS'

      - name: Prove exact immutable dependency pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a'),
            @($h,'validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1','4b17793e8a151d16089897bdf7f3545453b1833d'),
            @('a4f6d4772afb895dd253a4c82a21643711ac0829','validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1','190382903e23d7abc59b525829c5ecd5c76f7ff1'),
            @('a4f6d4772afb895dd253a4c82a21643711ac0829','validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1','125d7a37b37a3b78c81bb2259cbe08738985875a'),
            @('75a39eea7b0ef7d35d193962607752ef1a873ae0','validation/custom-app-production-transaction-finalization-v0.1.0/custom-app-production-transaction-finalization.ps1','2958ae3f92173215d32ef8bf284a9433c52caa61'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_PINS_PASS'

      - name: Parse and audit exact-process rollback contract
        shell: powershell
        run: |
          $d='validation/custom-app-production-spicetify-apply-executor-v0.1.0';foreach($f in @("$d/custom-app-production-spicetify-apply-executor.ps1","$d/test_custom_app_production_spicetify_apply_executor.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-spicetify-apply-executor.ps1" -Raw
          foreach($m in @("Arguments='apply'",'UseShellExecute=$false','CreateNoWindow=$true',"Name -cne 'spicetify.exe'",'[IO.FileShare]::Read','spicetify-executable-sha256-mismatch','Resolve-CustomAppProductionPostSwapApplyAdmissionV010','Restore-CustomAppProductionAtomicLiveSwapV010','rollback-restored-and-old-state-reapplied','post-apply-protected-persistence-drift','Test-CustomAppProductionPostSwapConsumptionContinuityV010','requires_post_apply_commit_cleanup=$true','stage_workspace_preserved=$true','app_backup_preserved=$true','persistence_backup_preserved=$true','result_is_authority=$false','spicetify_apply_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "apply executor marker missing $m"}}
          if(([regex]::Matches($core,"Arguments='apply'",[Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count -ne 1){throw 'exact apply argument assignment count drifted'}
          if(([regex]::Matches($core,'New-Object Diagnostics\.ProcessStartInfo',[Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count -ne 1){throw 'process start primitive count drifted'}
          if(([regex]::Matches($core,'Restore-CustomAppProductionAtomicLiveSwapV010',[Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count -ne 1){throw 'exact rollback restore call count drifted'}
          foreach($x in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','cmd.exe','powershell.exe','spicetify config','spicetify restore','Remove-Item','Move-Item','Copy-Item','DownloadFile','DownloadString')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "apply executor gained forbidden primitive $x"}}
          if($core -match 'result_is_authority\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|additional_mutation_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'apply executor reusable authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_spicetify_apply_executor.ps1" -Raw;foreach($m in @('future-app','wrong-hash','wrong-name','pre-admission-drift','fail-first','timeout-first','mutate-live-first','mutate-git-first','mutate-persistence-first','throw-after-primary','corrupt-store-after-primary','fail-both','drift-after-recovery','authority-tampered apply receipt','fingerprint-tampered apply receipt','recovery apply did not target restored old state')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "apply executor coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_PARSE_AUDIT_PASS'

      - name: Materialize exact sibling validation dependencies
        shell: powershell
        run: |
          $deps=@(
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($d in $deps){$path=$d[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:APPLYEXEC_GIT_SPEC="$($d[0])`:$path";$env:APPLYEXEC_GIT_OUT=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['APPLYEXEC_GIT_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['APPLYEXEC_GIT_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual -cne $d[2]){throw "materialized blob drift $path $actual != $($d[2])"}}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_MATERIALIZATION_PASS'

      - name: Run bounded Spicetify apply executor matrix twice
        shell: powershell
        run: |
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1';if($LASTEXITCODE){throw "spicetify apply executor matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_MATRIX_REPEAT_PASS'

      - name: Replay exact post-swap apply-admission parent contract
        shell: powershell
        run: |
          $cmd=". 'validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1'; . 'validation/custom-app-production-post-swap-apply-admission-v0.1.0/test_custom_app_production_post_swap_apply_admission.ps1'"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd;if($LASTEXITCODE){throw 'post-swap apply-admission parent regression'}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_PARENT_PASS'

      - name: Rebuild exact candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build;if($LASTEXITCODE){throw 'build failed'};$a='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$m='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne 523216 -or $ah-cne'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw 'addon drift'};if($mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main drift'}
          $s=Join-Path $env:RUNNER_TEMP 'spicetify-apply-executor-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_SELFTEST_PASS'

      - name: Prove protected-surface immutability and write evidence
        shell: powershell
        run: |
          $p='a4f6d4772afb895dd253a4c82a21643711ac0829';$e=@('.github/workflows/validate-custom-app-production-spicetify-apply-executor-v010.yml','validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1');$c=@(git diff --name-only "$p...HEAD");$b=@($c|?{$_ -notin $e});if($b.Count){throw "unexpected surface $($b -join ', ')"};foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-post-swap-apply-admission-v0.1.0/custom-app-production-post-swap-apply-admission.ps1','validation/custom-app-production-transaction-finalization-v0.1.0/custom-app-production-transaction-finalization.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'};$d='validation/custom-app-production-spicetify-apply-executor-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_post_swap_admission_parent=$p;exact_process_argument='apply';spicetify_executable_name_and_sha_locked=$true;primary_apply_fixture_only=$true;failure_restores_app_and_persistence=$true;failure_reapplies_restored_old_state=$true;post_apply_live_git_persistence_stage_backup_reverified=$true;persisted_consumption_revalidated_after_apply=$true;success_backups_retained=$true;receipt_authority=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_SPICETIFY_APPLY_EXECUTOR_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-spicetify-apply-executor-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1
            validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1
            validation/custom-app-production-spicetify-apply-executor-v0.1.0/ci-evidence.json
          if-no-files-found: error
