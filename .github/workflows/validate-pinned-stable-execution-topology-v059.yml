name: V059 exact stable r17 and agent startup topology read-only audit (HOLD)
on:
  push:
    branches: [validate/pinned-stable-execution-topology-v059-HOLD]
    paths:
      - 'validation/normal-engine-shared-turnstile/audit-pinned-stable-entrypoints-v059.py'
      - 'validation/normal-engine-shared-turnstile/stable-maintenance-surfaces-v059.ps1'
      - 'validation/normal-engine-shared-turnstile/test-stable-maintenance-surfaces-v059.ps1'
      - '.github/workflows/validate-pinned-stable-execution-topology-v059.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-truth-before-real-scheduler-cutover:
    runs-on: windows-2025
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact V058 parent/main and only four new audit/observer files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parent='8baf196accaf4c80ba6f88041097e397a17ccbe5'
          $main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          $script='validation/normal-engine-shared-turnstile/audit-pinned-stable-entrypoints-v059.py'
          $observer='validation/normal-engine-shared-turnstile/stable-maintenance-surfaces-v059.ps1'
          $observerTest='validation/normal-engine-shared-turnstile/test-stable-maintenance-surfaces-v059.ps1'
          $flow='.github/workflows/validate-pinned-stable-execution-topology-v059.yml'
          if((git merge-base $parent HEAD).Trim() -cne $parent -or
             (git rev-parse origin/main).Trim() -cne $main -or
             (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
             throw 'V059_PARENT_OR_MAIN_DRIFT'
          }
          $changed=@(git diff --name-only "$parent...HEAD")
          if($changed.Count -ne 4 -or @($changed|Where-Object{$_ -notin @($script,$observer,$observerTest,$flow)}).Count -ne 0){
             throw 'V059_NON_AUDITOR_SCOPE_EDIT'
          }
          $src=Get-Content $script -Raw
          foreach($needle in @(
             'V059_EXACT_STABLE_SOURCE_SHA_OR_SIZE_MISMATCH',
             'V059_EXACT_WINDOWS_BUILDER_OUTPUT_ONLY',
             'V059_NO_SCRIPT_EXECUTION_NO_SCHEDULER_CHANGE_NO_PRODUCTION_AUTHORITY_PASS',
             '5ab556c1d90b9f8e6d5784e238ffd1798c5363a0f7cd7b8313d1f106b5b6a285',
             '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278')){
             if(-not$src.Contains($needle)){throw ('V059_AUDITOR_MISSING_SOURCE_PIN_'+$needle)}
          }
          foreach($p in @($observer,$observerTest)){
            $tokens=$null;$parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw ('V059_PS51_OBSERVER_PARSE_FAILED_'+$p+'_'+$parseErrors[0].Message)}
          }
          $obs=Get-Content $observer -Raw
          foreach($token in @(
             'Get-V059StartupFallbackReadOnly',
             'Get-V059ScheduledMaintenanceReadOnly',
             'Resolve-V059MaintenanceLaunchTopology',
             'SpotifyControl Maintenance.lnk',
             'SpotifyControl Maintenance',
             'DUAL_AUTO_LAUNCH_COLLISION',
             'manual_legacy_launch_excluded=$false',
             'live_cutover_go=$false',
             'production_mutation_authorized=$false')){
              if(-not$obs.Contains($token)){throw ('V059_OBSERVER_SOURCE_MISSING_'+$token)}
          }
          foreach($forbidden in @(
            'Stop-ScheduledTask','Disable-ScheduledTask','Register-ScheduledTask',
            'Start-Process','Remove-Item','Set-ScheduledTask','Start-ScheduledTask','Unregister-ScheduledTask',
            '.Save(','.Delete(','.Kill(','.Stop(','.RegisterTaskDefinition(')){
            if($obs.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){
              throw ('V059_READ_ONLY_OBSERVER_CONTAINS_MUTATION_'+$forbidden)
            }
          }
          & python -m py_compile $script
          if($LASTEXITCODE -ne 0){throw 'V059_PYTHON_COMPILE_ERROR'}
          Write-Host 'V059_EXACT_V058_PARENT_OPERATING_MAIN_FOUR_AUDIT_FILES_PASS'
      - name: Reconstruct exact hashed stable r17 from existing builders; DO NOT EXECUTE IT
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          & python validation/v0.6.28/build_v0628.py --build
          if($LASTEXITCODE -ne 0){throw 'V059_PINNED_R17_BUILDER_FAILED'}
          # Agent source is independently extracted from exact repository
          # v0.6.11 chunk archive by the read-only audit below. Historical
          # v0.6.14 bootstrap repair artifact is not in the checkout.
          Write-Host 'V059_EXACT_STABLE_R17_RECONSTRUCTED_WITHOUT_MISSING_REPAIR_ARTIFACT_PASS'
      - name: SHA match + classify 3 stable scripts and bootstrap metadata, without execution
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/normal-engine-shared-turnstile/audit-pinned-stable-entrypoints-v059.py'
          $log=Join-Path $env:RUNNER_TEMP 'v059-source-scan.txt'
          # Windows PowerShell 5.1 can promote native stderr into a
          # terminating error when ErrorActionPreference is Stop.
          $ErrorActionPreference='Continue'
          & python $script --audit 2>&1 | Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($rc -ne 0){
             Get-Content $log -Tail 50|ForEach-Object{Write-Host $_}
             throw ('V059_STABLE_SOURCE_TOPOLOGY_SCAN_FAILED_'+$rc)
          }
          $body=Get-Content $log -Raw
          foreach($marker in @(
             'V059_PINNED_SOURCE_CLASSIFICATION_STABLE_MAIN',
             'V059_PINNED_SOURCE_CLASSIFICATION_STABLE_ADDON_R17',
             'V059_PINNED_SOURCE_CLASSIFICATION_RESIDENT_AGENT',
             'V059_EXACT_STABLE_MAIN_ADDON_AGENT_3_OF_3_SHA_SIZE_MATCH_PASS',
             'V059_BOOTSTRAP_METADATA_ONLY_FULL_BYTES_UNAVAILABLE_NOT_AUDITED_PASS',
             'V059_EXECUTION_TOPOLOGY_SOURCE_ONLY_NO_REAL_TASK_OR_PROCESS_PROOF_PASS',
             'V059_NO_SCRIPT_EXECUTION_NO_SCHEDULER_CHANGE_NO_PRODUCTION_AUTHORITY_PASS')){
             if(-not $body.Contains($marker)){throw ('V059_REQUIRED_CLASSIFICATION_MISSING_'+$marker)}
          }
          Get-Content $log | ForEach-Object {Write-Host $_}
          Write-Host 'V059_ACTUAL_HASH_PINNED_STABLE_ENTRYPOINT_SOURCE_STATIC_SCAN_PASS'
      - name: Source-anchored Task Scheduler + Startup fallback exact read-only acceptance
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v059-maintenance-surfaces.txt'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/normal-engine-shared-turnstile/test-stable-maintenance-surfaces-v059.ps1' *>&1 |
             Tee-Object -FilePath $log | Out-Null
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){
             Get-Content $log -Tail 65|ForEach-Object{Write-Host $_}
             throw ('V059_TASK_STARTUP_SURFACES_FAILED_'+$code)
          }
          $proof=Get-Content $log -Raw
          foreach($marker in @(
            'V059_TASK_STARTUP_DUAL_PROCESS_OPAQUE_AND_NO_TASK_STATES_FAIL_CLOSED_PASS',
            'V059_INVALID_ENUM_AND_NEGATIVE_COUNT_REJECTED_PASS',
            'V059_FALSE_STRING_AND_UNTYPED_PROCESS_EVIDENCE_FAIL_CLOSED_PASS',
            'V059_ACTUAL_WSH_COM_STARTUP_SHORTCUT_READ_ONLY_AND_FIVE_MUTATION_SCOPES_PASS',
            'V059_STARTUP_SHORTCUT_DESCRIPTION_OWNER_PIN_FAIL_CLOSED_PASS',
            'V059_HOSTED_REAL_SCHEDULER_READ_ONLY_NO_LIVE_APPROVAL_PASS',
            'V059_NO_USER_TASK_STARTUP_PROFILE_OR_SPOTIFY_CHANGED_PASS')){
            if(-not$proof.Contains($marker)){throw ('V059_MISSING_SURFACE_PROOF_'+$marker)}
          }
          Write-Host 'V059_REAL_SOURCE_TASK_STARTUP_EXCLUSIVE_OR_DUAL_OWNERSHIP_READONLY_PASS'
      - name: Stable operating main unchanged
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'V059_STABLE_MAIN_CHANGED'
          }
          Write-Host 'V059_PRODUCTION_RELEASE_AND_USER_WINDOWS_UNTOUCHED_PASS'
