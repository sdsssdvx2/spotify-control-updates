name: Validate Spotify Control v0.6.23 Release

on:
  push:
    branches:
      - release/v0.6.23-splitify-source-monitor-r12
    paths:
      - 'manifest.json'
      - 'packages/v0.6.23/**'
      - 'validation/v0.6.23/**'
      - '.github/workflows/prepare-v0.6.23-release.yml'
      - '.github/workflows/validate-v0.6.23-release.yml'
      - '.github/workflows/validate-v0.6.23-bootstrap-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'packages/v0.6.23/**'
      - 'validation/v0.6.23/**'
      - '.github/workflows/prepare-v0.6.23-release.yml'
      - '.github/workflows/validate-v0.6.23-release.yml'
      - '.github/workflows/validate-v0.6.23-bootstrap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact release base and allowed scope
        shell: powershell
        run: |
          $base='0fd4a8aa5b8f8e97cf1dc9a1e8d3b7bb9b4d1f2f'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'v0.6.23 release is not based on exact stable v0.6.22 main.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{
            $_ -notlike 'validation/v0.6.23/*' -and
            $_ -notlike 'packages/v0.6.23/*' -and
            $_ -ne 'manifest.json' -and
            $_ -ne '.github/workflows/prepare-v0.6.23-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.23-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.23-bootstrap-e2e.yml'
          })
          if($bad.Count){throw "Unexpected v0.6.23 release files: $($bad -join ', ')"}
          $raw=@(git ls-files 'validation/v0.6.23/out/**')
          if($raw.Count){throw "Raw generated candidates must not be tracked: $($raw -join ', ')"}
          Write-Host "V0623_RELEASE_SCOPE_PASS head=$actual files=$($changed.Count)"

      - name: Parse release sources and generated candidate
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.23/build_v0623.py validation/v0.6.23/release_transport.py validation/v0.6.23/bootstrap_prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.23 Python source failed compile.'}
          python validation/v0.6.23/build_v0623.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.6.23 candidate build failed.'}
          foreach($file in @('validation/v0.6.23/test_prior_r11_transaction.ps1','validation/v0.6.23/bootstrap_run_cycle.ps1','validation/v0.6.23/out/bin/spotify-control.ps1','validation/v0.6.23/out/bin/addon-manager.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}:{1}: {2}" -f $file,$_.Extent.StartLineNumber,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'V0623_PS51_PARSE_PASS'

      - name: Verify exact candidate, manifest and immutable transports
        shell: powershell
        run: |
          $main='validation/v0.6.23/out/bin/spotify-control.ps1';$addon='validation/v0.6.23/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 281588 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc9861bdd64ff8af94f68f0f065739f82b235271dcd18ad6325b819205528a08'){throw 'v0.6.23 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 272494 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '23ad2210aea4352f535d1cf0b3ebb827a82200dcba2b70bf1ebae96499d82687'){throw 'r12 identity mismatch.'}
          if((Get-FileHash validation/v0.6.23/candidate-validation.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c97f1e6fb64f77dcfbdbd2b8e404b54863ce749815c30ffe218e8a6cfa54c05b'){throw 'Validated candidate report drift.'}
          python validation/v0.6.23/release_transport.py --validate-published
          if($LASTEXITCODE -ne 0){throw 'Published v0.6.23 transport validation failed.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.23'){throw 'Unexpected latest_version.'}
          if($m.source_commit -ne 'ac895090c6db586e16089f143e6d494f74cab124'){throw "Unexpected immutable source commit: $($m.source_commit)"}
          if($m.payload_set_sha256 -ne 'a0c61cec440b9a2143cf2b564f4d6907453f52acbcd2bc145010b32078e83326'){throw 'Unexpected v0.6.23 payload set.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 contract changed.'}
          $edge=@($m.updates|Where-Object{$_.from_version -eq '0.6.22' -and $_.to_version -eq '0.6.23'})
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'Exact v0.6.22 -> v0.6.23 edge missing or ambiguous.'}
          Write-Host 'V0623_IMMUTABLE_RELEASE_IDENTITY_PASS'

      - name: Require deterministic transport and evidence rebuild
        shell: powershell
        run: |
          python validation/v0.6.23/release_transport.py --build-packages
          if($LASTEXITCODE -ne 0){throw 'Deterministic v0.6.23 transport rebuild failed.'}
          git diff --exit-code -- packages/v0.6.23 validation/v0.6.23/candidate-validation.json validation/v0.6.23/release-metadata.json
          if($LASTEXITCODE -ne 0){throw 'Committed v0.6.23 transports/evidence differ from deterministic rebuild.'}
          Write-Host 'V0623_TRANSPORT_DETERMINISM_PASS'

      - name: Addon Manager comprehensive SelfTest and r11 compatibility fixture
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          $addon='validation/v0.6.23/out/bin/addon-manager.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'r12 Addon Manager SelfTest failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.23/test_prior_r11_transaction.ps1
          if($LASTEXITCODE -ne 0){throw 'Exact r11 source-adapter transaction compatibility fixture failed.'}
          Write-Host 'V0623_R12_SELFTEST_AND_COMPAT_PASS'

      - name: Splitify non-mutating monitor and pinned upstream audit
        shell: powershell
        run: |
          $addon=Get-Content validation/v0.6.23/out/bin/addon-manager.ps1 -Raw
          $i=$addon.IndexOf('function Get-AddonInventory {',[StringComparison]::Ordinal);$n=$addon.IndexOf("`nfunction ",$i+1,[StringComparison]::Ordinal);if($n -lt 0){$n=$addon.Length};$inv=$addon.Substring($i,$n-$i)
          foreach($must in @('source="alexander-rebello/splitify"','policy="monitor-only"','monitor-local-release-unproven','releases/latest','splitify.zip','automatic update/install remains denied')){if($inv.IndexOf($must,[StringComparison]::Ordinal) -lt 0){throw "Splitify monitor contract missing: $must"}}
          foreach($bad in @('Expand-Archive','Remove-Item','Move-Item','Copy-Item','Start-Process','spicetify apply','spicetify backup','spicetify restore')){if($inv.IndexOf($bad,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Splitify inventory gained forbidden side effect: $bad"}}
          $u=$addon.IndexOf('function Update-AutoApps {',[StringComparison]::Ordinal);$un=$addon.IndexOf("`nfunction ",$u+1,[StringComparison]::Ordinal);$update=$addon.Substring($u,$un-$u);if($update.IndexOf('splitify',[StringComparison]::OrdinalIgnoreCase) -ge 0){throw 'Splitify gained a direct Update-AutoApps route.'}
          $headers=@{'User-Agent'='spotify-control-v0623-release-validation'}
          $repo=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/alexander-rebello/splitify'
          $release=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/alexander-rebello/splitify/releases/tags/v1.1.0'
          $asset=@($release.assets|Where-Object{[string]$_.name -ceq 'splitify.zip'})
          if([string]$repo.full_name -cne 'alexander-rebello/splitify' -or [bool]$repo.archived -or [bool]$repo.disabled){throw 'Splitify repository identity/state mismatch.'}
          if([bool]$release.draft -or [bool]$release.prerelease -or [string]$release.tag_name -cne 'v1.1.0'){throw 'Pinned Splitify release mismatch.'}
          if($asset.Count -ne 1 -or [int64]$asset[0].size -ne 7822 -or [string]$asset[0].digest -cne 'sha256:5de51a885815f78067b8d6f7f3ebe40c93b5a7c7e3c8c841fcd26147a13010ca'){throw 'Pinned Splitify asset mismatch.'}
          Write-Host 'V0623_SPLITIFY_NON_MUTATING_UPSTREAM_PASS'

      - name: Existing overlay and Star Ratings regressions remain green
        shell: powershell
        run: |
          node --check performance/overlay/lazy-custom-app-loader.js
          node performance/overlay/tests/test-loader.js
          if($LASTEXITCODE -ne 0){throw 'Existing overlay loader regression failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1
          if($LASTEXITCODE -ne 0){throw 'Existing overlay PowerShell regression failed.'}
          $fixture=Join-Path $env:RUNNER_TEMP 'star-ratings.js'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/brimell/spicetify-star-ratings/33aa3d293f9fbb58d7a749a8cea10c318351e6c6/dist/star-ratings.js' -OutFile $fixture
          if((Get-Item $fixture).Length -ne 43396 -or (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne '198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1'){throw 'Star Ratings immutable fixture drift.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/tests/test-star-ratings-patch.ps1 -FixturePath $fixture
          if($LASTEXITCODE -ne 0){throw 'Star Ratings regression failed.'}
          Write-Host 'V0623_EXISTING_PERFORMANCE_REGRESSIONS_PASS'

      - name: Final authority and protected-surface invariants
        shell: powershell
        run: |
          $meta=Get-Content validation/v0.6.23/release-metadata.json -Raw|ConvertFrom-Json
          $expected=@('better-local-files','eternal-jukebox','ivLyrics','playlist-maker')
          $actual=@($meta.auto_authority|Sort-Object)
          if(($actual -join '|') -ne (($expected|Sort-Object) -join '|')){throw "Automatic authority changed: $($actual -join ', ')"}
          if($meta.authority_expanded -ne $false -or $meta.new_auto_install_authority -ne $false){throw 'r12 expanded automatic mutation/install authority.'}
          if($meta.adapter_fingerprint -ne 'c0611a7b96f6ff09d1e235119efce2f2def6eb6d0a4e8e93e276cfa622c3c42d'){throw 'Source-adapter fingerprint changed.'}
          if($meta.registry_fingerprint -ne '0f05406d7152de1d975f888cb8270be8249115211ba9f41e0157342cd42efbd8'){throw 'r12 registry fingerprint changed.'}
          if($meta.prior_registry_compatibility -ne '05c40a5339fe59b001ca0f4c4929643fd59e33a3002bae7067425845c85e2f6e'){throw 'Exact r11 compatibility pin changed.'}
          $addon=Get-Content validation/v0.6.23/out/bin/addon-manager.ps1 -Raw
          foreach($required in @("name='ivLyrics'","name='tagify'","data_policy='protect-ratings-tags-notes'","name='star-ratings'","data_policy='playlist-backed-ratings-preserve'","name='sc-cover-ambience.js'","data_policy='never-disable-or-optimize'")){if($addon.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Protected policy missing: $required"}}
          $rbStart=$addon.IndexOf('function Rollback-LastTransaction {',[StringComparison]::Ordinal);$next=$addon.IndexOf("`nfunction ",$rbStart+1);if($next -lt 0){$next=$addon.Length};$rb=$addon.Substring($rbStart,$next-$rbStart)
          if($rb.IndexOf('Assert-AddonSourceAdapterTransactionAuthorization',[StringComparison]::Ordinal) -ge 0 -or $rb.IndexOf('source_adapter_sha256',[StringComparison]::Ordinal) -ge 0){throw 'RollbackLast became source-adapter dependent.'}
          Write-Host 'V0623_FINAL_AUTHORITY_AND_RECOVERY_PASS'
