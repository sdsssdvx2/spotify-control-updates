name: Diagnose Recovery Evidence Admission Integration
on:
  push:
    branches: [validate/custom-app-production-recovery-evidence-admission-integration-v0.1.0]
    paths: ['.github/workflows/diag-recovery-evidence-admission-integration.yml']
permissions: {contents: read}
jobs:
  parse:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse PS5.1 files only
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0'
          foreach($f in @("$d/custom-app-production-recovery-evidence-admission-integration.ps1","$d/test_custom_app_production_recovery_evidence_admission_integration.ps1")){
            $t=$null;$er=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null
            if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}
          }
          'DIAG_PARSE_PASS'
  audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Audit markers and forbidden primitives only
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0';$core=Get-Content "$d/custom-app-production-recovery-evidence-admission-integration.ps1" -Raw
          foreach($m in @('Resolve-CustomAppProductionRecoveryExecutionAdmissionV010','Read-CustomAppProductionRecoveryEvidenceV010','Get-CustomAppUpdateTreeSnapshotV010','Test-CustomAppProductionPersistenceBackupV010','recovery-integration-app-backup-integrity-mismatch','backup_integrity_required','backup_integrity_verified','requires_future_executor_fresh_revalidation=$true','integration_is_authority=$false','execution_authorized=$false','restore_authorized=$false','apply_authorized=$false','cleanup_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "integration marker missing $m"}}
          foreach($x in @('[IO.Directory]::Move','[IO.Directory]::Delete','[IO.File]::Copy','[IO.File]::Write','Move-Item','Copy-Item','Remove-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Restore-SpotifyPersistenceBackup','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','Invoke-CustomAppProductionPostApplyCommitCleanupV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "integration gained forbidden side effect $x"}}
          if($core -match 'integration_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'integration authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_recovery_evidence_admission_integration.ps1" -Raw
          foreach($m in @('future app integration denied','app backup drift accepted','persistence backup drift accepted','housekeeping incorrectly required retired backups','evidence tamper+rehash accepted','phase drift accepted','wrong executable pin accepted','authority-tampered integration receipt accepted','expired integration receipt accepted')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "integration coverage missing $m"}}
          'DIAG_AUDIT_PASS'
