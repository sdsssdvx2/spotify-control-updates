name: Validate Performance Overlay Runtime v0.1.0

on:
  workflow_dispatch:
  push:
    branches: [perf-overlay-v0.1.0]
    paths:
      - 'performance/overlay/**'
      - 'validation/performance-overlay-runtime-v0.1.0/build_and_validate.py'
      - '.github/workflows/validate-performance-overlay-runtime-v010.yml'
  pull_request:
    paths:
      - 'performance/overlay/**'
      - 'validation/performance-overlay-runtime-v0.1.0/build_and_validate.py'
      - '.github/workflows/validate-performance-overlay-runtime-v010.yml'

permissions:
  contents: read

jobs:
  validate-windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen production payload is untouched
        shell: powershell
        run: |
          git fetch origin main --no-tags
          $protected = @('README.md','manifest.json','manifest.schema.json','packages','validation/v0.6.18')
          $changed = @(git diff --name-only origin/main...HEAD -- $protected)
          if($changed.Count -gt 0){ throw "Runtime validation branch changed frozen production paths: $($changed -join ', ')" }
          $main = (git rev-parse origin/main).Trim()
          if($main -ne '635358a620a9d28d99a52571085558906af967b6'){ throw "Frozen production main drifted: $main" }
          Write-Host 'PASS: frozen production main/payload unchanged.'

      - name: Re-run overlay synthetic safety suite
        shell: powershell
        run: |
          $psFiles = @(
            'performance/overlay/apply-overlay.ps1',
            'performance/overlay/collect-active-provenance.ps1',
            'performance/overlay/tests/test-overlay.ps1'
          )
          foreach($file in $psFiles){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};throw "PowerShell parser failed: $file"}
          }
          node --check performance/overlay/lazy-custom-app-loader.js
          node performance/overlay/tests/test-loader.js
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1

      - name: Build runtime package from exact validated v0.4.1 provenance
        shell: powershell
        run: python validation/performance-overlay-runtime-v0.1.0/build_and_validate.py

      - name: Validate packaged PowerShell 5.1 parser and SelfTest
        shell: powershell
        run: |
          $zip = Resolve-Path 'SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'runtime-package'
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          $psFiles = @(
            (Join-Path $dst 'runtime-validator.ps1'),
            (Join-Path $dst 'overlay\apply-overlay.ps1'),
            (Join-Path $dst 'overlay\collect-active-provenance.ps1')
          )
          foreach($file in $psFiles){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};throw "Packaged PowerShell parser failed: $file"}
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dst 'runtime-validator.ps1') -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Packaged runtime SelfTest failed.'}

      - name: Static mutation and native-call audit
        shell: powershell
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'runtime-package'
          $script = Get-Content (Join-Path $dst 'runtime-validator.ps1') -Raw
          $overlay = Get-Content (Join-Path $dst 'overlay\apply-overlay.ps1') -Raw
          $collector = Get-Content (Join-Path $dst 'overlay\collect-active-provenance.ps1') -Raw
          foreach($needle in @('spicetify apply','spicetify backup','spicetify restore')){
            if($script.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0 -or $overlay.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0 -or $collector.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0){
              throw "Forbidden Spicetify mutation phrase found: $needle"
            }
          }
          foreach($needle in @('Remove-Item -LiteralPath $ConfigPath','Set-Content -LiteralPath $ConfigPath')){
            if($script.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Forbidden config mutation found: $needle"}
          }
          if($script -notmatch "Invoke-Native -FilePath \(Get-SpicetifyExe\) -Arguments @\('--version'\)"){throw 'Expected read-only spicetify --version call missing.'}
          if($script -notmatch 'robocopy\.exe'){throw 'Expected persistence safety-backup robocopy path missing.'}
          Write-Host 'PASS: packaged mutation scope remains read-only outside owned active-xpui overlay.'

      - name: Verify deterministic package identity
        shell: powershell
        run: |
          $first=(Get-FileHash 'SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $firstSize=(Get-Item 'SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip').Length
          python validation/performance-overlay-runtime-v0.1.0/build_and_validate.py
          $second=(Get-FileHash 'SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $secondSize=(Get-Item 'SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip').Length
          if($first -ne $second -or $firstSize -ne $secondSize){throw "Package is not deterministic: $first/$firstSize vs $second/$secondSize"}
          Write-Host "RUNTIME_PACKAGE_IDENTITY size=$secondSize sha256=$second"

      - name: Verify package checksums and text controls
        shell: python
        run: |
          import hashlib, zipfile
          from pathlib import Path
          p=Path('SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              sums=z.read('SHA256SUMS.txt').decode('ascii').splitlines()
              for line in sums:
                  digest,name=line.split(' *',1)
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,(name,digest)
              for name in names:
                  if name.endswith(('.ps1','.cmd','.md','.json','.js','.txt')):
                      data=z.read(name)
                      assert b'\x00' not in data,name
                      if name.endswith(('.ps1','.md','.json','.js','.txt')):
                          data.decode('utf-8-sig')
          print('PACKAGE_CHECKSUMS_TEXT_CONTROLS_PASS')

      - name: Upload validated runtime package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0
          path: SpotifyControl-Performance-Overlay-Runtime-Validator-v0.1.0.zip
          if-no-files-found: error
          retention-days: 30
