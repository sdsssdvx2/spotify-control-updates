name: Validate user DPAPI terminal retirement against real signed ZIP rollback journal
on:
  push:
    branches: [validate/custom-app-user-transaction-terminal-journal]
    paths:
      - 'validation/custom-app-user-transaction-terminal-journal/**'
      - '.github/workflows/validate-custom-app-user-transaction-terminal-journal.yml'
  pull_request:
    branches: [validate/custom-app-user-transaction-transition-guard]
    paths:
      - 'validation/custom-app-user-transaction-terminal-journal/**'
      - '.github/workflows/validate-custom-app-user-transaction-terminal-journal.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-triple-id-terminal-rollback-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Pin qualified review source and freeze operating main
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $parent='22c31dc7e1a73d91a13f957a68706c4e8d698d2f'
          if((git rev-parse HEAD).Trim() -cne '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'){throw 'wrong review checkout SHA'}
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'not descended from qualified user transition guard'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'operating main changed'}
          $d='validation/custom-app-user-transaction-terminal-journal'
          $pins=@{
            "$d/verified-terminal-adapter.ps1"='8a18de8c49d1c32b1c53ca48518af07aa7a617ad'
            "$d/terminal-readback-child.ps1"='fd5465330d84e874a0b594a66ad1d5fa611273c4'
            "$d/derive_real_zip_terminal_e2e.py"='dccf4d656d74cb97ba6eb188ba06fc77057ef209'
            "$d/build_candidate.py"='20902d142ed5a2270ece4ab75671959dd178bd1e'
          }
          $allowed=@($pins.Keys)+@('.github/workflows/validate-custom-app-user-transaction-terminal-journal.yml')
          $changed=@(git diff --name-only "$parent...HEAD")
          if($changed.Count -ne 5 -or @($changed|Where-Object{$_ -notin $allowed}).Count){throw ('unexpected production or test scope '+($changed -join ','))}
          foreach($p in $pins.Keys){if((git hash-object $p).Trim() -cne $pins[$p]){throw ('unqualified source '+$p)}}
          foreach($p in @('bin/spotify-control.ps1','bin/addon-manager.ps1','manifest.json','stable-version.json','addon-policy-registry.json')){
            git diff --quiet $parent HEAD -- $p
            if($LASTEXITCODE -ne 0){throw ('operating source modified '+$p)}
          }
          Write-Host 'USER_TERMINAL_SOURCE_SCOPE_MAIN_FROZEN_PASS'
      - name: Generate exact old hard-disabled candidate plus terminal module
        shell: powershell
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-user-transaction-terminal-journal'
          python "$d/build_candidate.py"
          if($LASTEXITCODE -ne 0){throw 'real-addon terminal bundle build failed'}
          $report=Get-Content -LiteralPath "$d/candidate-validation.json" -Raw|ConvertFrom-Json
          $addon="$d/out/bin/addon-manager.ps1"
          $sha=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne [string]$report.candidate_addon_sha256 -or (Get-Item $addon).Length -ne [int64]$report.candidate_addon_size){throw 'bundle report mismatch'}
          if((Get-FileHash "$d/out/bin/spotify-control.ps1" -Algorithm SHA256).Hash.ToLowerInvariant() -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate changed'}
          if(-not[bool]$report.old_full_chain_unchanged -or -not[bool]$report.exact_parent_inverse -or
            -not[bool]$report.consumed_ledger_and_claim_one_atomic_replace){throw 'required exact inverse and terminal atomicity evidence missing'}
          foreach($flag in @('normal_auto_update_wired','actual_spicetify_invoked','operating_main_changed')){if([bool]$report.$flag){throw ('unexpected production authority '+$flag)}}
          foreach($f in @($addon,"$d/verified-terminal-adapter.ps1","$d/terminal-readback-child.ps1")){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Select-Object -First 8|ForEach-Object{Write-Host $_.Message};throw ('WinPS5.1 parser invalid '+$f)}
          }
          "CANDIDATE_HASH=$sha"|Out-File $env:GITHUB_ENV -Encoding UTF8 -Append
          "CANDIDATE_SIZE=$((Get-Item $addon).Length)"|Out-File $env:GITHUB_ENV -Encoding UTF8 -Append
          Write-Host "USER_TERMINAL_BUNDLED_REAL_ADDON_PS51_PASS sha256=$sha"
      - name: Real generated Addon Manager SelfTest, no production mutation
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-user-transaction-terminal-journal'
          $sandbox=Join-Path $env:RUNNER_TEMP ('addon-terminal-'+[Guid]::NewGuid().ToString('N'))
          $env:LOCALAPPDATA=Join-Path $sandbox 'Local'
          $env:APPDATA=Join-Path $sandbox 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/out/bin/addon-manager.ps1" -Action SelfTest *>&1|Tee-Object -FilePath "$d/addon-selftest.log"|Out-Null
          $exit=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($exit -ne 0){throw ('actual Addon Manager SelfTest returned '+$exit)}
          $log=Get-Content "$d/addon-selftest.log" -Raw
          foreach($marker in @('CUSTOM_USER_TXN_VERIFIED_TERMINAL_BUNDLE_SELFTEST_PASS','CUSTOM_USER_TXN_GUARD_BUNDLE_SELFTEST_PASS','CUSTOM_APP_USER_TRANSACTION_STORE_BUNDLED_SELFTEST_PASS','CUSTOM_APP_JOURNAL_LOCK_BUNDLED_SELFTEST_PASS')){
            if(-not $log.Contains($marker)){throw ('candidate missing previous or new selftest '+$marker)}
          }
          Write-Host 'USER_TERMINAL_REAL_ADDON_SELFTEST_PASS'
      - name: Restore qualified historical Windows fixture dependencies and overlays
        shell: powershell
        timeout-minutes: 50
        run: |
          $ErrorActionPreference='Stop'
          $prep='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/prepare_custom_app_production_dual_id_new_permit_readiness.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Qualified historical fixture dependency restoration failed'}
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $pins=@(
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1",'3350cd974bb9f9ae7345e490449c4875d571bf95'),
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1",'224b9df9d020b74bd4d99c85ca6d06e28999101b')
          )
          foreach($pin in $pins){if((git hash-object $pin[0]).Trim() -cne [string]$pin[1]){throw ('Qualified overlay SHA drift: '+$pin[0])}}
          # Pinned historical-only dependencies: materialize into ephemeral checkout.
          $historical=@(
            @('e2b80822835bf5d59dc179e345e098b5bd79759e','validation/custom-app-production-atomic-live-swap-mutation-v0.1.0/test_custom_app_production_atomic_live_swap_mutation.ps1','d15e0768162b0659c57602eaf0242b035b48b0c7'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-mutation.ps1','79580da78443a18bd281d4fce61c4a57d958a196'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-repair-v011.ps1','210c4dda2311eb5defcbcd74977e4f4148ea7c38'),
            @('b266bad660d4b7bc87e7093c5b12f0cff1dc466f','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-preflight-v0.1.0/custom-app-production-recovery-preflight.ps1','b1816a24849a559b4da2537aa1b2436124fbee50'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-execution-admission-v0.1.0/custom-app-production-recovery-execution-admission.ps1','e8804a7c53ad0d3e5420e037d468d9c397e52529'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'),
            @('d3969a746ed1736fe93586bd025116c2526fbff5','validation/custom-app-production-recovery-cleanup-resume-admission-v0.1.0/custom-app-production-recovery-cleanup-resume-admission.ps1','387d97b10d493b3794b24fba2bac67cf39491444'),
            @('d9a1face71511bdaeeef4e8c761415ef9ec95fc0','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63')
          )
          foreach($dep in $historical){
            $commit=[string]$dep[0];$p=[string]$dep[1];$blob=[string]$dep[2]
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){
              git cat-file -e ($commit+'^{commit}') 2>$null
              if($LASTEXITCODE){git fetch --no-tags origin $commit | Out-Null;if($LASTEXITCODE){throw ('historical fetch failed '+$commit)}}
              New-Item -ItemType Directory -Force -Path (Split-Path $p -Parent)|Out-Null
              $env:TJR_SPEC=($commit+':'+$p);$env:TJR_OUT=$p
              python -c "import os,subprocess,pathlib;pathlib.Path(os.environ['TJR_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['TJR_SPEC']]))"
              if($LASTEXITCODE){throw ('historical materialize failed '+$p)}
            }
            if((git hash-object $p).Trim() -cne $blob){throw ('historical recovery blob drift '+$p)}
          }
          # The parent preparer intentionally applies its separately qualified
          # monotonic restore-executor patch. Do not overwrite it with its old blob.
          if(-not(Test-Path -LiteralPath 'validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1' -PathType Leaf)){throw 'qualified monotonic restore executor absent'}
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_HISTORICAL_RECOVERY_MODULES_PINNED_PASS'
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_PINNED_FIXTURES_PASS'
      - name: Apply SHA-qualified old reservation compatibility overlays in temporary Windows checkout
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $core="$d/custom-app-production-dual-id-new-permit-reservation-persistence.ps1"
          $pieces=@($core,"$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1","$d/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1")
          $source=($pieces|ForEach-Object{[IO.File]::ReadAllText((Resolve-Path $_).Path)}) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Resolve-Path $core).Path,$source,[Text.UTF8Encoding]::new($false))
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $core).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'qualified historical reservation overlays PS5.1 invalid'}
          Write-Host 'USER_TERMINAL_QUALIFIED_OLD_PERMIT_RESERVATION_OVERLAYS_PASS'
      - name: Derive pre-existing real ZIP, fresh signed third permit, crash/rollback/retirement full E2E
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-user-transaction-terminal-journal'
          python "$d/derive_real_zip_terminal_e2e.py"
          if($LASTEXITCODE -ne 0){throw 'qualified signed real ZIP test derivation failed'}
          $script="$d/ci_derived_user_verified_terminal.ps1"
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){throw 'missing derived E2E'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Select-Object -First 12|ForEach-Object{Write-Host $_.Message};throw 'derived WinPS5.1 end-to-end parser invalid'}
          Write-Host 'USER_TERMINAL_REAL_SIGNED_ZIP_DERIVATION_PARSER_PASS'
      - name: Execute real third signed permit ZIP, independently restarted recovery, terminal and fresh DPAPI replay denial
        shell: powershell
        timeout-minutes: 60
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-user-transaction-terminal-journal'
          $oldRunner=$env:RUNNER_TEMP;$oldTemp=$env:TEMP;$oldTmp=$env:TMP
          $sandbox=Join-Path $oldRunner ('user-terminal-real-zip-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $sandbox|Out-Null
          $exit=1
          try{
            $env:RUNNER_TEMP=$sandbox;$env:TEMP=$sandbox;$env:TMP=$sandbox
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/ci_derived_user_verified_terminal.ps1" *>&1|Tee-Object -FilePath "$d/real-signed-zip-terminal-e2e.log"|Out-Null
            $exit=$LASTEXITCODE
          }finally{
            $env:RUNNER_TEMP=$oldRunner;$env:TEMP=$oldTemp;$env:TMP=$oldTmp
            $ErrorActionPreference='Stop'
          }
          if($exit -ne 0){
            Write-Host '=== USER TERMINAL E2E FAILURE LAST 16 SANDBOX LINES ==='
            Get-Content -LiteralPath "$d/real-signed-zip-terminal-e2e.log" -Tail 16 | ForEach-Object { Write-Host $_ }
            throw ('actual signed ZIP rollback terminal E2E failure exit='+$exit)
          }
          $log=Get-Content "$d/real-signed-zip-terminal-e2e.log" -Raw
          foreach($marker in @(
             'USER_TERMINAL_SIGNED_ID_RESERVED_BEFORE_REAL_ATOMIC_SWAP_PASS',
             'USER_TERMINAL_UNFINISHED_REAL_JOURNAL_DENIED_PASS',
             'TRIPLE_ID_EXCLUSIVE_REAL_ZIP_END_TO_END_PASS',
             'USER_TERMINAL_FRESH_PROCESS_REPLAY_DENIED_PASS',
             'USER_TERMINAL_REAL_ZIP_SIGNED_JOURNAL_ROLLBACK_RETIREMENT_PASS'
          )){if(-not $log.Contains($marker)){throw ('required signed ZIP journal recovery proof missing '+$marker)}}
          Write-Host 'USER_TERMINAL_REAL_ZIP_THIRD_PERMIT_INDEPENDENT_RESTART_E2E_PASS'
      - name: Deterministic rebuild and last main freeze proof
        shell: powershell
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-user-transaction-terminal-journal'
          python "$d/build_candidate.py"
          if($LASTEXITCODE -ne 0){throw 'repeat candidate build failed'}
          $addon="$d/out/bin/addon-manager.ps1"
          $hash=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne $env:CANDIDATE_HASH -or (Get-Item $addon).Length -ne [int64]$env:CANDIDATE_SIZE){throw 'candidate non-reproducible'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'operating main advanced'}
          [ordered]@{
            schema=1;status='PASS';source_sha=(git rev-parse HEAD).Trim()
            candidate_sha256=$hash;candidate_size=(Get-Item $addon).Length
            fresh_signed_third_permit='REAL_ZIP_E2E_PASS'
            pre_swap_dpapi_reservation='PASS'
            interrupted_terminal_write_recovered='PASS'
            independent_rollback_worker='PASS'
            fresh_process_retired_id_replay_denied='PASS'
            original_live_and_persistence_reverified='PASS'
            normal_update_wired=$false;real_installed_spotify_touched=$false;production_main_unchanged=$true
          }|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          Write-Host "USER_TERMINAL_TWO_BUILDS_SAME_MAIN_FROZEN_PASS sha256=$hash"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-real-zip-user-terminal-${{ github.run_id }}
          path: |
            validation/custom-app-user-transaction-terminal-journal/candidate-validation.json
            validation/custom-app-user-transaction-terminal-journal/ci-evidence.json
            validation/custom-app-user-transaction-terminal-journal/addon-selftest.log
            validation/custom-app-user-transaction-terminal-journal/real-signed-zip-terminal-e2e.log
          retention-days: 14
          if-no-files-found: warn
