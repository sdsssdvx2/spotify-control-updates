name: HOLD R140 guarded hotfix cutover
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - validation/spotify-exit-immediate-maintenance-HOLD/owner-r140-no-restart-hotfix-once-HOLD.ps1
      - validation/spotify-exit-immediate-maintenance-HOLD/spotify-control-R140-NoRestartAfterSpotifyUpdate-HOLD.ps1
      - .github/workflows/validate-r140-guarded-hotfix-cutover-HOLD.yml
permissions: {contents: read}
jobs:
  cutover:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: PS5.1 parse and static guard acceptance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cut='validation/spotify-exit-immediate-maintenance-HOLD/owner-r140-no-restart-hotfix-once-HOLD.ps1'
          $new='validation/spotify-exit-immediate-maintenance-HOLD/spotify-control-R140-NoRestartAfterSpotifyUpdate-HOLD.ps1'

          $tok=$null
          $err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($cut,[ref]$tok,[ref]$err)
          if(@($err).Count -ne 0){throw 'R140_CUTOVER_PS51_PARSE_FAIL'}

          $body=Get-Content -LiteralPath $cut -Raw
          foreach($required in @(
            "R140_CURRENT_MAIN_NOT_EXACT_R139",
            "R140_AGENT_NOT_ENABLED",
            "R140_CANDIDATE_PIN_MISMATCH",
            "R140_BASELINE_CHANGED_UNDER_MUTEX",
            "R140_NON_SOURCE_STATE_CHANGED",
            "R140_SOURCE_SWAP_READBACK_FAILED",
            "ROLLBACK_SOURCE=R139_RESTORED_SHA_VERIFIED",
            "APPROVE_R140_NO_RESTART_HOTFIX_ONCE"
          )){
            if($body -notmatch [regex]::Escape($required)){throw ('R140_CUTOVER_GUARD_MISSING '+$required)}
          }

          if($body -match 'Start-Process|Stop-Process|Invoke-Spice|SpotifyFullSetup|spicetify.exe\s+'){
            throw 'R140_CUTOVER_CONTAINS_RUNTIME_PRODUCT_MUTATION'
          }

          $newRaw=Get-Content -LiteralPath $new -Raw
          if($newRaw -notmatch [regex]::Escape("@('backup','apply','--no-restart')")){
            throw 'R140_PRODUCT_FIX_MISSING'
          }

          Write-Host 'R140_CUTOVER_PS51_PARSE=PASS'
          Write-Host 'R140_CUTOVER_PRODUCT_RUNTIME_MUTATION=NONE'
          Write-Host 'R140_CUTOVER_EXACT_SOURCE_AND_BASELINE_GUARDS=PASS'
          Write-Host 'RESULT=R140_GUARDED_HOTFIX_CUTOVER_PASS'
