name: Validate Spotify Control v0.6.18 Spicetify backup provenance

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/v0.6.18/**'
      - 'validation/v0.6.18/**'
      - 'manifest.json'
      - '.github/workflows/validate-v0.6.18.yml'

permissions:
  contents: write
  actions: read

jobs:
  windows-v0618-backup-provenance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct exact v0.6.18 candidate
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,hashlib
          def sha(b): return hashlib.sha256(b).hexdigest()
          meta=[
            ('chunk-000.txt',8192,'6b15659c13742ca5fc0d75c4bb4c578f2ccce5374b1b7c94063c7b77b3e9e5e8'),
            ('chunk-001.txt',64952,'a341d7ded6f7ad51fc9e5d17d4fea102947b87abf4c854658527be825a726ac0'),
          ]
          root=Path('packages/v0.6.18/main-v0617-to-v0618')
          parts=[]
          for name,size,digest in meta:
              b=(root/name).read_bytes(); assert len(b)==size,(name,len(b)); assert sha(b)==digest,(name,sha(b)); parts.append(b)
          enc=b''.join(parts)
          assert len(enc)==73144 and sha(enc)=='9f2fbad19cc3b9af2d1ec3b899a930706d26d91f1d12d3591f6b84062281cf8c'
          comp=base64.b64decode(enc,validate=True)
          assert len(comp)==54857 and sha(comp)=='8829b6d33b110b0837b2ea60a322d66cf39e0f0f1495219b6fa0065e990be780'
          raw=gzip.decompress(comp)
          assert len(raw)==283348 and sha(raw)=='1f279a46b4fe3b6ffed4aa5484b3bbe54b7f05cda0a6e8953e078378ac7abdbf'
          Path('candidate-main-v0.6.18.ps1').write_bytes(raw)
          print('V0618_CANDIDATE_RECONSTRUCT_PASS',len(raw),sha(raw))

      - name: Static fail-closed repair policy audit
        shell: python
        run: |
          from pathlib import Path
          s=Path('candidate-main-v0.6.18.ps1').read_text(encoding='utf-8-sig')
          required=[
            '$ScriptVersion = "0.6.18"','RepairSpicetifyBackup',
            'Test-ProvenStaleSpicetifyBackup','Invoke-ProvenSpicetifyBackupMetadataRepair',
            'Invoke-SpicetifyBackupApplyForVerifiedSpotifyUpdate','Test-SpicetifyBackupVersionRepairSandbox',
            'after_fullversion','apply_started_at','apply_finished_at','LastWriteTimeUtc',
          ]
          for x in required: assert x in s,x
          start=s.index('function Invoke-ProvenSpicetifyBackupMetadataRepair')
          end=s.index('function Invoke-SpicetifyBackupApplyForVerifiedSpotifyUpdate',start)
          repair=s[start:end]
          assert 'Invoke-SpiceCapture' not in repair
          assert 'Set-IniSectionKeyValueInText' in repair
          future=s[end:s.index('function Test-SpicetifyBackupVersionRepairSandbox',end)]
          assert 'backup","apply","--no-restart' in future.replace(' ','') or "'backup','apply','--no-restart'" in future.replace(' ','')
          assert 'Restore-Utf8TextSnapshot' in future
          print('V0618_STATIC_FAIL_CLOSED_POLICY_PASS')

      - name: Windows PowerShell 5.1 parser and provenance/prefs-pin synthetic tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Resolve-Path '.\candidate-main-v0.6.18.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($candidate,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'PowerShell 5.1 parser rejected v0.6.18.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\validation\v0.6.18\test-provenance.ps1' -Candidate $candidate 2>&1 | Tee-Object -FilePath '.\v0618-provenance-test.log'
          if($LASTEXITCODE -ne 0){throw "v0.6.18 provenance test failed with exit $LASTEXITCODE"}
          if(-not(Select-String -LiteralPath '.\v0618-provenance-test.log' -SimpleMatch 'V0618_PROVENANCE_AND_PREFS_PIN_PASS')){throw 'Synthetic provenance success marker missing.'}
          Write-Host 'V0618_WINDOWS_PS51_TARGETED_TEST_PASS'

      - name: Publish candidate manifest to validation branch if needed
        shell: powershell
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -Raw -LiteralPath '.\manifest.json' | ConvertFrom-Json
          if([string]$manifest.latest_version -eq '0.6.17'){
            $transportSha=(git rev-parse HEAD).Trim()
            if($transportSha -notmatch '^[0-9a-f]{40}$'){throw 'Invalid transport SHA.'}
            $env:TRANSPORT_SHA=$transportSha
            python '.\validation\v0.6.18\prepare_manifest.py'
            if($LASTEXITCODE -ne 0){throw 'Candidate manifest generation failed.'}
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- manifest.json
            git diff --cached --quiet
            if($LASTEXITCODE -eq 0){throw 'Candidate manifest produced no change.'}
            git commit -m 'Publish Spotify Control v0.6.18 candidate manifest'
            if($LASTEXITCODE -ne 0){throw 'Candidate manifest commit failed.'}
            git push origin ("HEAD:"+$env:HEAD_REF)
            if($LASTEXITCODE -ne 0){throw 'Candidate manifest push failed.'}
            Write-Host ('V0618_CANDIDATE_MANIFEST_PUSHED source_commit='+$transportSha)
          } elseif([string]$manifest.latest_version -eq '0.6.18'){
            Write-Host ('V0618_CANDIDATE_MANIFEST_ALREADY_PRESENT source_commit='+[string]$manifest.source_commit)
          } else { throw ('Unexpected manifest latest_version: '+[string]$manifest.latest_version) }
          $manifestCommit=(git rev-parse HEAD).Trim()
          "MANIFEST_COMMIT=$manifestCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate candidate manifest and transport source pin
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess,base64,gzip,os
          def sha(b): return hashlib.sha256(b).hexdigest()
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig'))
          assert m['latest_version']=='0.6.18'
          assert m['payload_set_sha256']=='d39de4ff47f60f6534fb4ff6fdf9a1b939a066e12bd5b3536af40e1f490b068a'
          assert m['bootstrap']['version']=='1.0.6'
          e=[x for x in m['updates'] if x['from_version']=='0.6.17']
          assert len(e)==1 and e[0]['to_version']=='0.6.18'
          p=e[0]['patches']; assert len(p)==1 and p[0]['path']=='bin/spotify-control.ps1'
          p=p[0]
          assert p['from_sha256']=='5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b'
          assert p['to_sha256']=='1f279a46b4fe3b6ffed4aa5484b3bbe54b7f05cda0a6e8953e078378ac7abdbf'
          parts=[]
          for i,c in enumerate(p['chunks']):
              assert c['path'].endswith(f'chunk-{i:03d}.txt')
              b=subprocess.check_output(['git','show',f"{m['source_commit']}:{c['path']}"])
              assert len(b)==int(c['size']) and sha(b)==c['sha256'];parts.append(b)
          enc=b''.join(parts);assert len(enc)==int(p['encoded_size']) and sha(enc)==p['encoded_sha256']
          comp=base64.b64decode(enc,validate=True);assert len(comp)==int(p['compressed_size']) and sha(comp)==p['compressed_sha256']
          raw=gzip.decompress(comp);assert len(raw)==int(p['target_size']) and sha(raw)==p['to_sha256']
          assert raw==Path('candidate-main-v0.6.18.ps1').read_bytes()
          print('V0618_MANIFEST_TRANSPORT_PASS',m['source_commit'],os.environ['MANIFEST_COMMIT'])

      - name: Download exact previously validated bootstrap 1.0.6 carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > validated-v0614-repair-artifact.zip
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib,zipfile
          outer=Path('validated-v0614-repair-artifact.zip').read_bytes()
          with zipfile.ZipFile(BytesIO(outer)) as z:
              assert z.testzip() is None
              inner=z.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          assert len(inner)==30856
          assert hashlib.sha256(inner).hexdigest()=='6b6d5d9e8ac44fc77bb95918164a3c862f14494c329fdfd267bd95f6c6ddcf06'
          print('VALIDATED_BOOTSTRAP_CARRIER_PASS',len(outer),len(inner))
          PY

      - name: Build exact v0.6.17/r7 installed fixture
        shell: python
        run: |
          import runpy
          runpy.run_path('validation/v0.6.18/upgrade_fixture_to_v0617.py',run_name='__main__')

      - name: Windows Bootstrap 1.0.6 Check RollbackTest Update cycle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path '.\ci-bootstrap-fixture\LocalAppData\SpotifyControl').Path
          $bin=Join-Path $root 'bin'
          $boot=Join-Path $root 'bootstrap\spotify-control-self-updater.ps1'
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $boot).Hash.ToLowerInvariant() -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){throw 'Exact bootstrap 1.0.6 hash mismatch.'}
          if((Get-Item -LiteralPath $boot).Length -ne 42963){throw 'Exact bootstrap size mismatch.'}
          $manifestUrl=('https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/'+$env:MANIFEST_COMMIT+'/manifest.json')
          $old='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/main/manifest.json'
          $selfLine='$selfHash = Get-Sha256 -Path $PSCommandPath'
          $selfPinned='$selfHash = ''d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'''
          $sizeLine='$bootstrapSize = [int64](Get-Item -LiteralPath $PSCommandPath).Length'
          $sizePinned='$bootstrapSize = [int64]42963'
          $text=[IO.File]::ReadAllText($boot)
          foreach($pair in @(@($old,$manifestUrl),@($selfLine,$selfPinned),@($sizeLine,$sizePinned))){
            $count=([regex]::Matches($text,[regex]::Escape([string]$pair[0]))).Count
            if($count -ne 1){throw ("Expected one bootstrap CI substitution source, found ${count}: "+[string]$pair[0])}
            $text=$text.Replace([string]$pair[0],[string]$pair[1])
          }
          [IO.File]::WriteAllText($boot,$text,[Text.UTF8Encoding]::new($false))
          $tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile($boot,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Bootstrap CI transport copy failed PS5.1 parse.'}
          $env:LOCALAPPDATA=(Resolve-Path '.\ci-bootstrap-fixture\LocalAppData').Path
          $env:APPDATA=Join-Path (Resolve-Path '.\ci-bootstrap-fixture').Path 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          function Run-Boot([string]$Action){
            $out=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $boot -Action $Action -Json 2>&1
            $code=$LASTEXITCODE
            $out | Set-Content -LiteralPath ('.\bootstrap-'+$Action+'.log')
            $out|ForEach-Object{Write-Host $_}
            if($code -ne 0){throw "Bootstrap $Action failed with exit $code"}
            $last=@($out|Where-Object{[string]$_ -match '^\s*\{'})|Select-Object -Last 1
            if(-not $last){throw "Bootstrap $Action emitted no JSON"}
            return ($last|ConvertFrom-Json)
          }
          $check=Run-Boot 'Check'
          if(-not $check.success -or [string]$check.installed_version -ne '0.6.17' -or [int]$check.result.edge_count -ne 1){throw 'Check did not resolve exact one-edge v0.6.17 -> v0.6.18 chain.'}
          $rb=Run-Boot 'RollbackTest'
          if(-not $rb.success -or [string]$rb.transaction_status -ne 'rolled-back'){throw 'RollbackTest did not finish rolled-back.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'spotify-control.ps1')).Hash.ToLowerInvariant() -ne '5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b'){throw 'Rollback main mismatch.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'addon-manager.ps1')).Hash.ToLowerInvariant() -ne 'b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977'){throw 'Rollback addon mismatch.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'spotify-control-agent.vbs')).Hash.ToLowerInvariant() -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278'){throw 'Rollback agent mismatch.'}
          $up=Run-Boot 'Update'
          if(-not $up.success -or [string]$up.transaction_status -ne 'committed'){throw 'Update did not commit.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'spotify-control.ps1')).Hash.ToLowerInvariant() -ne '1f279a46b4fe3b6ffed4aa5484b3bbe54b7f05cda0a6e8953e078378ac7abdbf'){throw 'v0.6.18 main target mismatch.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'addon-manager.ps1')).Hash.ToLowerInvariant() -ne 'b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977'){throw 'Addon changed unexpectedly.'}
          $post=Run-Boot 'Check'
          if(-not $post.success -or [string]$post.installed_version -ne '0.6.18' -or $post.result.already_current -ne $true -or [int]$post.result.edge_count -ne 0){throw 'Post-update Check is not exact already-current v0.6.18.'}
          Write-Host 'BOOTSTRAP_V106_V0617_TO_V0618_FULL_CYCLE_PASS'

      - name: Upload v0.6.18 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-control-v0.6.18-validation-evidence
          path: |
            candidate-main-v0.6.18.ps1
            manifest.json
            v0618-provenance-test.log
            bootstrap-Check.log
            bootstrap-RollbackTest.log
            bootstrap-Update.log
          if-no-files-found: warn
          compression-level: 6
