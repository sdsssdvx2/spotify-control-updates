name: Diagnose Custom App Live Provenance v0.1.0

on:
  push:
    branches: [validate/custom-app-live-attested-fixture-canary-v0.1.0]
    paths:
      - '.github/workflows/diagnose-custom-app-live-provenance-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace transaction git preservation and post-shadow provenance
        shell: powershell
        run: |
          $src=Resolve-Path 'validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1'
          $diag=Join-Path (Split-Path -Parent $src) 'diagnostic-live-provenance.ps1'
          $text=Get-Content -LiteralPath $src -Raw

          $provNeedle=@'
              Assert-True ([bool]$prov.source_proven -and ([string]$prov.source_candidate).Trim().ToLowerInvariant() -ceq 'alexk218/tagify') ($Scenario.id+' evidence provenance not strong/current')
          '@.Trim()
          $provReplacement=@'
              Write-Host ('DIAG_PROVENANCE scenario='+[string]$Scenario.id+' safe='+[string]$prov.safe+' proven='+[string]$prov.source_proven+' candidate='+[string]$prov.source_candidate+' status='+[string]$prov.source_status+' git_reason='+[string]$prov.git.reason+' git_identity='+[string]$prov.git.identity+' git_sha='+[string]$prov.git.file_sha256+' pkg_reason='+[string]$prov.package.reason+' pkg_identity='+[string]$prov.package.identity+' pkg_safe='+[string]$prov.package.safe)
              Assert-True ([bool]$prov.source_proven -and ([string]$prov.source_candidate).Trim().ToLowerInvariant() -ceq 'alexk218/tagify') ($Scenario.id+' evidence provenance not strong/current')
          '@.Trim()
          if(([regex]::Matches($text,[regex]::Escape($provNeedle))).Count -ne 1){throw 'Diagnostic provenance anchor drift.'}
          $text=$text.Replace($provNeedle,$provReplacement)

          $rootNeedle='$root=Get-CustomAppFixtureCanaryRootV010;$oldStage=$null'
          $rootReplacement=@'
          $script:DiagLiveAttestedOriginalTx=(Get-Item -LiteralPath 'Function:\Invoke-CustomAppUpdateFixtureTransactionV010' -ErrorAction Stop).ScriptBlock
          Set-Item -LiteralPath 'Function:\Invoke-CustomAppUpdateFixtureTransactionV010' -Value {
              param([Parameter(Mandatory=$true)]$Plan,[Parameter(Mandatory=$true)][string]$ValidationRoot,[Parameter(Mandatory=$true)]$PersistenceProof,[switch]$InjectPostApplyFailure,[switch]$InjectRollbackFailure)
              $gitBefore=Test-Path -LiteralPath (Join-Path ([string]$Plan.live_path) '.git') -PathType Container
              $rollbackGitBefore=Test-Path -LiteralPath (Join-Path ([string]$Plan.rollback_path) '.git') -PathType Container
              Write-Host ('DIAG_TX_BEFORE preserve_git='+[string]$Plan.preserve_git+' live_git='+$gitBefore+' rollback_git='+$rollbackGitBefore+' live='+[string]$Plan.live_path)
              $r=& $script:DiagLiveAttestedOriginalTx -Plan $Plan -ValidationRoot $ValidationRoot -PersistenceProof $PersistenceProof -InjectPostApplyFailure:$InjectPostApplyFailure -InjectRollbackFailure:$InjectRollbackFailure
              $gitAfter=Test-Path -LiteralPath (Join-Path ([string]$Plan.live_path) '.git') -PathType Container
              $backupGitAfter=Test-Path -LiteralPath (Join-Path ([string]$Plan.backup_path) '.git') -PathType Container
              $rollbackGitAfter=Test-Path -LiteralPath (Join-Path ([string]$Plan.rollback_path) '.git') -PathType Container
              Write-Host ('DIAG_TX_AFTER status='+[string]$r.status+' reason='+[string]$r.reason+' committed='+[string]$r.committed+' rolled_back='+[string]$r.rolled_back+' live_git='+$gitAfter+' backup_git='+$backupGitAfter+' rollback_git='+$rollbackGitAfter)
              return $r
          }
          $root=Get-CustomAppFixtureCanaryRootV010;$oldStage=$null
          '@.Trim()
          if(([regex]::Matches($text,[regex]::Escape($rootNeedle))).Count -ne 1){throw 'Diagnostic transaction anchor drift.'}
          $text=$text.Replace($rootNeedle,$rootReplacement)
          [IO.File]::WriteAllText($diag,$text,[Text.UTF8Encoding]::new($false))

          function Copy-TreeSafe {
            param([Parameter(Mandatory=$true)][string]$Source,[Parameter(Mandatory=$true)][string]$Destination)
            if(-not(Test-PathSafe $Source 'Container')){throw 'Copy-TreeSafe source is missing.'}
            $src=[IO.Path]::GetFullPath($Source).TrimEnd([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar)
            $rootItem=Get-Item -LiteralPath $src -Force -ErrorAction Stop
            if(($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'Copy-TreeSafe source root is a reparse point.'}
            if(Test-Path -LiteralPath $Destination){throw 'Copy-TreeSafe destination already exists.'}
            [IO.Directory]::CreateDirectory([IO.Path]::GetFullPath($Destination))|Out-Null
            foreach($entry in @(Get-ChildItem -LiteralPath $src -Recurse -Force -ErrorAction Stop)){
              if(($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw "Copy-TreeSafe source contains reparse point: $($entry.FullName)"}
              $rel=$entry.FullName.Substring($src.Length).TrimStart([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar)
              $target=Join-Path $Destination $rel
              if($entry.PSIsContainer){[IO.Directory]::CreateDirectory($target)|Out-Null}else{$parent=Split-Path -Parent $target;if(-not(Test-Path $parent)){[IO.Directory]::CreateDirectory($parent)|Out-Null};[IO.File]::Copy($entry.FullName,$target,$false)}
            }
            return [IO.Path]::GetFullPath($Destination)
          }
          . $diag
