name: Diagnose Custom App Live Provenance v0.1.0

on:
  push:
    branches: [validate/custom-app-live-attested-fixture-canary-v0.1.0]
    paths:
      - '.github/workflows/diagnose-custom-app-live-provenance-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Capture exact commit executor and shadow result
        shell: powershell
        continue-on-error: true
        run: |
          $src=Resolve-Path 'validation/custom-app-live-attested-fixture-canary-v0.1.0/test_live_attested_fixture_canary.ps1'
          $diagDir=Join-Path $PWD 'validation/custom-app-live-attested-fixture-canary-v0.1.0/diagnostic-output'
          New-Item -ItemType Directory -Force -Path $diagDir|Out-Null
          $diag=Join-Path $diagDir 'diagnostic-live-result.ps1'
          $full=Join-Path $diagDir 'diagnostic-full.txt'
          $compact=Join-Path $diagDir 'diagnostic-compact.txt'
          $text=Get-Content -LiteralPath $src -Raw

          $needle='$commitAfter=Get-AttestedEvidenceV010 -Scenario $commitScenario;'
          $replacement=@'
          $shadowStatus='<null>';$shadowReason='<null>';$shadowCommitted=$false;$shadowRolledBack=$false
          if($null -ne $commitResult.shadow_result){
              $shadowStatus=[string]$commitResult.shadow_result.status
              $shadowReason=[string]$commitResult.shadow_result.reason
              $shadowCommitted=[bool]$commitResult.shadow_result.committed
              $shadowRolledBack=[bool]$commitResult.shadow_result.rolled_back
          }
          Write-Host ('DIAG_COMMIT_RESULT status='+[string]$commitResult.status+' reason='+[string]$commitResult.reason+' committed='+[string]$commitResult.committed+' rolled_back='+[string]$commitResult.rolled_back+' shadow_status='+$shadowStatus+' shadow_reason='+$shadowReason+' shadow_committed='+$shadowCommitted+' shadow_rolled_back='+$shadowRolledBack)
          $commitAfter=Get-AttestedEvidenceV010 -Scenario $commitScenario;
          '@.Trim()
          if(([regex]::Matches($text,[regex]::Escape($needle))).Count -ne 1){throw 'Commit-result diagnostic anchor drift.'}
          $text=$text.Replace($needle,$replacement)
          [IO.File]::WriteAllText($diag,$text,[Text.UTF8Encoding]::new($false))

          $runner=@'
          function Copy-TreeSafe {
              param([Parameter(Mandatory=$true)][string]$Source,[Parameter(Mandatory=$true)][string]$Destination)
              if(-not(Test-PathSafe $Source 'Container')){throw 'Copy-TreeSafe source is missing.'}
              $src=[IO.Path]::GetFullPath($Source).TrimEnd([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar)
              $rootItem=Get-Item -LiteralPath $src -Force -ErrorAction Stop
              if(($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw 'Copy-TreeSafe source root is a reparse point.'}
              if(Test-Path -LiteralPath $Destination){throw 'Copy-TreeSafe destination already exists.'}
              [IO.Directory]::CreateDirectory([IO.Path]::GetFullPath($Destination))|Out-Null
              foreach($entry in @(Get-ChildItem -LiteralPath $src -Recurse -Force -ErrorAction Stop)){
                  if(($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){throw "Copy-TreeSafe source contains reparse point: $($entry.FullName)"}
                  $rel=$entry.FullName.Substring($src.Length).TrimStart([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar)
                  $target=Join-Path $Destination $rel
                  if($entry.PSIsContainer){[IO.Directory]::CreateDirectory($target)|Out-Null}else{$parent=Split-Path -Parent $target;if(-not(Test-Path $parent)){[IO.Directory]::CreateDirectory($parent)|Out-Null};[IO.File]::Copy($entry.FullName,$target,$false)}
              }
              return [IO.Path]::GetFullPath($Destination)
          }
          . '__DIAG__'
          '@
          $runner=$runner.Replace('__DIAG__',$diag.Replace("'","''"))
          $runnerPath=Join-Path $diagDir 'run-diagnostic.ps1'
          [IO.File]::WriteAllText($runnerPath,$runner,[Text.UTF8Encoding]::new($false))

          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runnerPath *> $full
          $exit=$LASTEXITCODE
          $lines=@(Select-String -LiteralPath $full -Pattern 'DIAG_COMMIT_RESULT|Committed live attestation classification drifted|live attestation verification failed|evidence provenance not strong/current' -CaseSensitive:$false | ForEach-Object{$_.Line})
          if($lines.Count -eq 0){$lines=@('NO_DIAGNOSTIC_MARKERS_FOUND')}
          $lines += ('PROCESS_EXIT='+$exit)
          $lines|Set-Content -LiteralPath $compact -Encoding UTF8
          Write-Host '=== COMPACT DIAGNOSTIC ==='
          Get-Content -LiteralPath $compact

      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-live-provenance-diagnostic-${{ github.run_id }}
          path: |
            validation/custom-app-live-attested-fixture-canary-v0.1.0/diagnostic-output/diagnostic-compact.txt
            validation/custom-app-live-attested-fixture-canary-v0.1.0/diagnostic-output/diagnostic-full.txt
          if-no-files-found: warn
