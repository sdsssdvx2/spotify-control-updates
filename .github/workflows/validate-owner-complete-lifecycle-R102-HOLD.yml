name: HOLD R102 one-approval private cutover and guarded logon precommit safety
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-owner-complete-lifecycle-R102-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-complete-lifecycle-R102-HOLD.ps1
permissions: {contents: read}
jobs:
  native-inert-and-source-pins:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: PowerShell 5.1 parse and immutable source identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          $p=$base+'owner-approved-complete-lifecycle-R102-HOLD.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){
            $errors|ForEach-Object {Write-Host $_.Message}
            throw 'R102_NATIVE_POWERSHELL_51_PARSE_FAILED'
          }
          $pins=@{
            'owner-unified-readonly-preflight-R101-HOLD.ps1'='f3e36f05979f8cd5987b5ca8c9de0774b07b3a8d'
            'owner-single-command-offline-R90-HOLD.ps1'='52d97d536fe60c3833022e1d3e88a6b26eacddb3'
            'owner-approved-guarded-logon-R99-HOLD.ps1'='7e78129d598bd11c273b5855f4059393767c5f85'
          }
          foreach($item in $pins.GetEnumerator()){
            $got=((& git hash-object -- ($base+$item.Key)) | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $got -cne $item.Value){
              throw 'R102_IMMUTABLE_PARENT_SOURCE_PIN_NOT_EXACT'
            }
          }
          $src=Get-Content -LiteralPath $p -Raw
          foreach($marker in @(
            'R102_UNVERIFIED_AUTOSTART_BEFORE_RELEASE_BLOCKED',
            'R102_COMMIT_UNVERIFIED_HOLD_REQUIRES_READONLY_R101_REVIEW',
            'R102_RELEASE_AND_GUARDED_LOGON_COMMITTED_REAL_REBOOT_UNTESTED',
            'R102_PARTIAL_POSTCOMMIT_HOLD_NO_AUTOROLLBACK',
            'R102_TASK_DIAGNOSTIC_ONLY_NOT_DEPLOY_AUTHORITY',
            "APPROVE_PRIVATE_V0630_AND_GUARDED_LOGON_ONCE")){
            if(-not $src.Contains($marker)){throw 'R102_REQUIRED_OWNER_SAFETY_CONTRACT_MISSING'}
          }
          Write-Host 'R102_ACTUAL_WINDOWS_POWERSHELL_51_SYNTAX=PASS'
          Write-Host 'R102_FROZEN_R101_R90_R99_REPOSITORY_BLOBS=PASS'
      - name: Exercise bounded native read-only task classification on Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-complete-lifecycle-R102-HOLD.ps1'
          $tokens=$null;$issues=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($source,[ref]$tokens,[ref]$issues)
          if(@($issues).Count -ne 0){throw 'R102_TASK_PROBE_SOURCE_PARSE_INVALID'}
          function ExtractFunction([string]$name) {
            $found=@($ast.FindAll({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -ceq $name
            },$true))
            if($found.Count -ne 1){throw 'R102_TASK_INSPECTOR_FUNCTION_NOT_UNIQUE'}
            return $found[0].Extent.Text
          }
          $twoFunctions=(ExtractFunction 'Deny')+[Environment]::NewLine+
                        (ExtractFunction 'RequireOnce')+[Environment]::NewLine+
                        (ExtractFunction 'R102OneValue')+[Environment]::NewLine+
                        (ExtractFunction 'R102ExistingTaskAdmission')+[Environment]::NewLine+
                        (ExtractFunction 'R102AgentActionClass')+[Environment]::NewLine+
                        (ExtractFunction 'R102PrincipalClass')+[Environment]::NewLine+
                        (ExtractFunction 'R102TaskProbe')
          $script=[ScriptBlock]::Create($twoFunctions)
          . $script
          $agent='C:\testowner\spotify-control-agent.vbs'
          $wscript=Join-Path $env:WINDIR 'System32\wscript.exe'
          $quote='"'+$agent+'"'
          if((R102AgentActionClass $wscript $quote $agent $wscript) -cne 'DIRECT_WSCRIPT_EXACT'){
            throw 'R102_EXACT_WSCRIPT_ACTION_NOT_RECOGNIZED'
          }
          if((R102AgentActionClass $wscript ('//B //NoLogo '+$quote) $agent $wscript) -cne 'DIRECT_WSCRIPT_EXACT'){
            throw 'R102_WSCRIPT_NOBANNER_ACTION_NOT_RECOGNIZED'
          }
          if((R102AgentActionClass $wscript ('"'+$agent+'.bak"') $agent $wscript) -cne 'NO_EXACT_AGENT_PATH_TOKEN'){
            throw 'R102_SUBSTRING_FALSE_POSITIVE'
          }
          if((R102AgentActionClass 'powershell.exe' ('-File '+$quote) $agent $wscript) -cne 'AGENT_REFERENCE_OTHER_LAUNCH_SHAPE'){
            throw 'R102_OTHER_SHAPE_MUST_NOT_COUNT_DIRECT'
          }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          if((R102PrincipalClass $identity.User.Value '' $identity) -cne 'CURRENT_OWNER_RESOLVED'){
            throw 'R102_CURRENT_USER_SID_NOT_RESOLVED'
          }
          if((R102PrincipalClass 'S-1-5-18' '' $identity) -cne 'BUILTIN_SERVICE'){
            throw 'R102_SYSTEM_SERVICE_PRINCIPAL_NOT_CLASSIFIED'
          }
          if((R102PrincipalClass $identity.User.Value 'S-1-5-32-545' $identity) -cne 'GROUP_SCOPED'){
            throw 'R102_GROUP_SCOPE_NOT_HELD'
          }
          $rows=@(R102TaskProbe 'C:\UNLIKELY-OWNER-AGENT-TEST\spotify-control-agent.vbs')
          foreach($field in @(
            'R102_TASK_NATIVE_CMDLET','R102_TASK_COM_ENUM',
            'R102_TASK_VISIBLE_AGENT_REFERENCE','R102_TASK_AGENT_TOKEN_MATCHES',
            'R102_TASK_DIRECT_OWNER_LOGON_ENABLED',
            'R102_TASK_DIRECT_OWNER_OTHER_TRIGGER_ENABLED',
            'R102_TASK_OTHER_LAUNCH_SHAPE',
            'R102_TASK_DISABLED_OR_NO_ENABLED_TRIGGER',
            'R102_TASK_UNKNOWN_MATCH_DETAILS',
            'R102_TASK_OTHER_OR_UNKNOWN_PRINCIPAL',
            'R102_SINGLE_MATCH_PRINCIPAL',
            'R102_SINGLE_MATCH_ACTION',
            'R102_SINGLE_MATCH_ENABLED',
            'R102_SINGLE_MATCH_TRIGGER',
            'R102_SINGLE_MATCH_LOGON_SCOPE',
            'R102_SINGLE_MATCH_INSTANCE_POLICY',
            'R102_SINGLE_MATCH_LOGON_TYPE',
            'R102_SINGLE_MATCH_REGISTRATION_PIN_SHA256')){
            if(@($rows|Where-Object{([string]$_).StartsWith($field+'=')}).Count -ne 1){
              throw 'R102_TASK_PROBE_BOUNDED_RESULT_MISSING'
            }
          }
          if($rows -cnotcontains 'R102_TASK_ADMINISTRATIVE_GLOBAL_COVERAGE=NOT_PROVEN'){
            throw 'R102_TASK_PROBE_UNSAFE_GLOBAL_COVERAGE_CLAIM'
          }
          if(@($rows|Where-Object{[string]$_ -cmatch '^[A-Z0-9_]+=[A-Z0-9_]+$'}).Count -ne 19){
            throw 'R102_TASK_PROBE_UNEXPECTED_DATA_EXPOSURE'
          }
          $fixture=@(
            'R102_TASK_COM_ENUM=ACCESSIBLE_SCOPE_ENUMERATED_NOT_GLOBAL_PROOF',
            'R102_TASK_AGENT_TOKEN_MATCHES=1',
            'R102_TASK_DIRECT_OWNER_LOGON_ENABLED=1',
            'R102_TASK_DIRECT_OWNER_OTHER_TRIGGER_ENABLED=0',
            'R102_TASK_OTHER_LAUNCH_SHAPE=0',
            'R102_TASK_DISABLED_OR_NO_ENABLED_TRIGGER=0',
            'R102_TASK_UNKNOWN_MATCH_DETAILS=0',
            'R102_TASK_OTHER_OR_UNKNOWN_PRINCIPAL=0',
            'R102_SINGLE_MATCH_PRINCIPAL=CURRENT_OWNER_RESOLVED',
            'R102_SINGLE_MATCH_ACTION=ONE_DIRECT_WSCRIPT_ACTION',
            'R102_SINGLE_MATCH_ENABLED=YES',
            'R102_SINGLE_MATCH_TRIGGER=LOGON_ENABLED',
            'R102_SINGLE_MATCH_LOGON_SCOPE=CURRENT_USER',
            'R102_SINGLE_MATCH_INSTANCE_POLICY=IGNORE_NEW',
            'R102_SINGLE_MATCH_LOGON_TYPE=INTERACTIVE_TOKEN',
            ('R102_SINGLE_MATCH_REGISTRATION_PIN_SHA256='+('a'*64)),
            'R102_TASK_ADMINISTRATIVE_GLOBAL_COVERAGE=NOT_PROVEN'
          )
          if((R102ExistingTaskAdmission $fixture) -cne ('a'*64)){
            throw 'R102_VALID_OWNER_TASK_NOT_ADMITTED'
          }
          $negative=@($fixture | Where-Object {
            $_ -cne 'R102_SINGLE_MATCH_PRINCIPAL=CURRENT_OWNER_RESOLVED'
          })+@('R102_SINGLE_MATCH_PRINCIPAL=GROUP_SCOPED')
          $rejected=$false
          try { [void](R102ExistingTaskAdmission $negative) } catch {$rejected=$true}
          if(-not $rejected){throw 'R102_GROUP_TASK_WRONGLY_ADMITTED'}
          $negative=@($fixture | Where-Object {
            $_ -cne 'R102_SINGLE_MATCH_LOGON_TYPE=INTERACTIVE_TOKEN'
          })+@('R102_SINGLE_MATCH_LOGON_TYPE=S4U')
          $rejected=$false
          try { [void](R102ExistingTaskAdmission $negative) } catch {$rejected=$true}
          if(-not $rejected){throw 'R102_S4U_TASK_WRONGLY_ADMITTED'}
          $negative=@($fixture | Where-Object {
            $_ -cne 'R102_TASK_AGENT_TOKEN_MATCHES=1'
          })+@('R102_TASK_AGENT_TOKEN_MATCHES=2')
          $rejected=$false
          try { [void](R102ExistingTaskAdmission $negative) } catch {$rejected=$true}
          if(-not $rejected){throw 'R102_MULTI_TASK_WRONGLY_ADMITTED'}
          Write-Host 'R102_REUSE_EXACT_OWNER_TASK_SYNTHETIC_ADMISSION_AND_DENIAL=PASS'
          Write-Host 'R102_ACTUAL_WINDOWS_ACTION_CLASSIFICATION=PASS'
          Write-Host 'R102_NATIVE_TASK_READONLY_BOUNDED_DIAGNOSTIC=PASS'
          Write-Host 'R102_NONADMIN_GLOBAL_COVERAGE_NOT_CLAIMED=PASS'
          Write-Host 'R102_OWNER_APPLICATION_AND_USER_TASK_CHANGES=NONE'
      - name: Native COM single-owner logon fixture proves actual R102 reuse admission
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){
            throw 'R102_NATIVE_COM_ONLY_GITHUB_HOSTED'
          }
          $source='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-complete-lifecycle-R102-HOLD.ps1'
          $tokens=$null;$issues=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($source,[ref]$tokens,[ref]$issues)
          if(@($issues).Count -ne 0){throw 'R102_NATIVE_COM_SOURCE_PARSE_INVALID'}
          function ExtractFunction([string]$name) {
            $found=@($ast.FindAll({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -ceq $name
            },$true))
            if($found.Count -ne 1){throw 'R102_NATIVE_COM_SOURCE_NOT_UNIQUE'}
            return $found[0].Extent.Text
          }
          $probe=ExtractFunction 'R102TaskProbe'
          $needle='$folders.Push($service.GetFolder('+[char]39+'\'+[char]39+'))'
          $sub='$folders.Push($service.GetFolder($global:R102HostedFolder))'
          if($probe.Split($needle).Count -ne 2){throw 'R102_PROBE_ROOT_ANCHOR_NOT_EXACT'}
          $probe=$probe.Replace($needle,$sub)
          $names=@('Deny','RequireOnce','R102OneValue','R102ExistingTaskAdmission',
                   'R102AgentActionClass','R102PrincipalClass')
          $defs=@($names|ForEach-Object{ExtractFunction $_}) -join [Environment]::NewLine
          . ([ScriptBlock]::Create($defs+[Environment]::NewLine+$probe))
          $service=New-Object -ComObject Schedule.Service
          $service.Connect()
          $root=$service.GetFolder('\')
          $name='SpotifyR102Scratch-'+[guid]::NewGuid().ToString('N')
          $global:R102HostedFolder='\'+$name
          $owner=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $agent=Join-Path $env:RUNNER_TEMP 'R102NeverExecutedSyntheticAgent.vbs'
          $wscript=Join-Path $env:WINDIR 'System32\wscript.exe'
          $created=$false
          $taskCreated=$false
          try{
            $folder=$root.CreateFolder($name,$null)
            $created=$true
            $definition=$service.NewTask(0)
            $definition.RegistrationInfo.Description='GitHub hosted R102 isolated COM admission; no task launch'
            $definition.Principal.UserId=$owner
            $definition.Principal.LogonType=3
            $definition.Principal.RunLevel=0
            $definition.Settings.Enabled=$true
            $definition.Settings.MultipleInstances=2
            $logon=$definition.Triggers.Create(9)
            $logon.UserId=$owner
            $logon.Enabled=$true
            $action=$definition.Actions.Create(0)
            $action.Path=$wscript
            $action.Arguments='//B //NoLogo "'+$agent+'"'
            $null=$folder.RegisterTaskDefinition('R102OwnerOnly',$definition,6,$owner,$null,3,$null)
            $taskCreated=$true
            # No launch or logon. The candidate agent target does not exist.
            if(Test-Path -LiteralPath $agent){throw 'R102_FIXTURE_AGENT_SHOULD_BE_ABSENT'}
            $rows=@(R102TaskProbe $agent)
            foreach($line in @(
              'R102_TASK_COM_ENUM=ACCESSIBLE_SCOPE_ENUMERATED_NOT_GLOBAL_PROOF',
              'R102_TASK_AGENT_TOKEN_MATCHES=1',
              'R102_TASK_DIRECT_OWNER_LOGON_ENABLED=1',
              'R102_TASK_UNKNOWN_MATCH_DETAILS=0',
              'R102_TASK_OTHER_OR_UNKNOWN_PRINCIPAL=0',
              'R102_SINGLE_MATCH_PRINCIPAL=CURRENT_OWNER_RESOLVED',
              'R102_SINGLE_MATCH_ACTION=ONE_DIRECT_WSCRIPT_ACTION',
              'R102_SINGLE_MATCH_ENABLED=YES',
              'R102_SINGLE_MATCH_TRIGGER=LOGON_ENABLED',
              'R102_SINGLE_MATCH_LOGON_SCOPE=CURRENT_USER',
              'R102_SINGLE_MATCH_INSTANCE_POLICY=IGNORE_NEW',
              'R102_SINGLE_MATCH_LOGON_TYPE=INTERACTIVE_TOKEN')){
              if($rows -cnotcontains $line){throw 'R102_NATIVE_COM_POSITIVE_OWNER_TASK_NOT_CLASSIFIED'}
            }
            $pin=R102ExistingTaskAdmission $rows
            if($pin -cnotmatch '^[0-9a-f]{64}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-complete-lifecycle-R102-HOLD.ps1'
          function Run([string[]]$arguments){
            $lines=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p @arguments 2>&1)
            if($LASTEXITCODE -ne 0){throw 'R102_NATIVE_PROCESS_EXIT_NONZERO'}
            if(@($lines|Where-Object{[string]$_ -cmatch '^RESULT='}).Count -ne 1){
              throw 'R102_BOUNDED_RESULT_MISSING_OR_DUPLICATE'
            }
            return $lines
          }
          $inert=Run @()
          if($inert -cnotcontains 'RESULT=R102_INERT_DEFAULT_REQUIRES_EXPLICIT_MODE' -or
             $inert -cnotcontains 'NETWORK=NO;FILE_WRITE=NO;PROCESS_CHANGE=NO;STARTUP_CHANGE=NO'){
            throw 'R102_DEFAULT_NOT_INERT'
          }
          $denied=Run @('-Commit')
          if($denied -cnotcontains 'HOLD_REASON=R102_EXPLICIT_DUAL_SCOPE_OWNER_APPROVAL_REQUIRED' -or
             $denied -cnotcontains 'RESULT=R102_HOLD_NO_AUTO_RETRY'){
            throw 'R102_UNAPPROVED_COMMIT_NOT_BLOCKED'
          }
          $conflict=Run @('-Prepare','-Preflight')
          if($conflict -cnotcontains 'HOLD_REASON=R102_MODES_MUTUALLY_EXCLUSIVE'){
            throw 'R102_CONFLICTING_MODE_NOT_BLOCKED'
          }
          $unauthorized=Run @('-Preflight','-ApprovalPhrase','APPROVE_PRIVATE_V0630_AND_GUARDED_LOGON_ONCE')
          if($unauthorized -cnotcontains 'HOLD_REASON=R102_APPROVAL_WITHOUT_COMMIT_FORBIDDEN'){
            throw 'R102_APPROVAL_LEAK_TO_READONLY_MODE'
          }
          $reuseWithoutApproval=Run @('-Commit','-ReuseExistingTask')
          if($reuseWithoutApproval -cnotcontains 'HOLD_REASON=R102_EXPLICIT_DUAL_SCOPE_OWNER_APPROVAL_REQUIRED'){
            throw 'R102_REUSE_COMMIT_WITHOUT_EXPLICIT_APPROVAL_NOT_BLOCKED'
          }
          $reuseInert=Run @('-ReuseExistingTask')
          if($reuseInert -cnotcontains 'HOLD_REASON=R102_REUSE_REQUIRES_EXPLICIT_MODE'){
            throw 'R102_REUSE_WITHOUT_MODE_NOT_INERT'
          }
          $taskConflict=Run @('-TaskOnly','-Commit')
          if($taskConflict -cnotcontains 'HOLD_REASON=R102_TASK_DIAG_CANNOT_COMBINE_MUTATION_OR_APPROVAL' -or
             $taskConflict -cnotcontains 'RESULT=R102_HOLD_NO_AUTO_RETRY'){
            throw 'R102_TASK_ONLY_MUTATION_COMBINATION_NOT_BLOCKED'
          }
          Write-Host 'R102_NATIVE_INERT_AND_EXPLICIT_DUAL_APPROVAL_DENIAL=PASS'
          Write-Host 'R102_OPERATING_RELEASE_AND_USER_LOGON_MUTATIONS=NONE'
          Write-Host 'R102_POSITIVE_OWNER_CUTOVER_AND_REAL_LOGON=NOT_RUN'
){throw 'R102_NATIVE_COM_REGISTRATION_PIN_MISSING'}
            $again=R102ExistingTaskAdmission @(R102TaskProbe $agent)
            if($pin -cne $again){throw 'R102_NATIVE_COM_TASK_PIN_CHANGED_WITHOUT_MUTATION'}
            Write-Host 'R102_REAL_COM_OWNER_LOGON_TASK_REUSE_ADMISSION=PASS'
            Write-Host 'R102_REAL_COM_TASK_REGISTRATION_PIN_STABLE=PASS'
            Write-Host 'R102_REAL_TASK_EXECUTION=NO'
          }finally{
            if($taskCreated){try{$folder.DeleteTask('R102OwnerOnly',0)}catch{}}
            if($created){try{$root.DeleteFolder($name,0)}catch{}}
            try{$null=$root.GetFolder($global:R102HostedFolder)
              throw 'R102_HOSTED_COM_TASK_FOLDER_NOT_REMOVED'
            }catch [System.Runtime.InteropServices.COMException] {}
            Remove-Variable -Name R102HostedFolder -Scope Global -ErrorAction SilentlyContinue
          }
          Write-Host 'R102_HOSTED_TEMP_TASK_AND_FOLDER_CLEANUP=PASS'
      - name: Verify inert and unapproved modes without network or user mutations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-complete-lifecycle-R102-HOLD.ps1'
          function Run([string[]]$arguments){
            $lines=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p @arguments 2>&1)
            if($LASTEXITCODE -ne 0){throw 'R102_NATIVE_PROCESS_EXIT_NONZERO'}
            if(@($lines|Where-Object{[string]$_ -cmatch '^RESULT='}).Count -ne 1){
              throw 'R102_BOUNDED_RESULT_MISSING_OR_DUPLICATE'
            }
            return $lines
          }
          $inert=Run @()
          if($inert -cnotcontains 'RESULT=R102_INERT_DEFAULT_REQUIRES_EXPLICIT_MODE' -or
             $inert -cnotcontains 'NETWORK=NO;FILE_WRITE=NO;PROCESS_CHANGE=NO;STARTUP_CHANGE=NO'){
            throw 'R102_DEFAULT_NOT_INERT'
          }
          $denied=Run @('-Commit')
          if($denied -cnotcontains 'HOLD_REASON=R102_EXPLICIT_DUAL_SCOPE_OWNER_APPROVAL_REQUIRED' -or
             $denied -cnotcontains 'RESULT=R102_HOLD_NO_AUTO_RETRY'){
            throw 'R102_UNAPPROVED_COMMIT_NOT_BLOCKED'
          }
          $conflict=Run @('-Prepare','-Preflight')
          if($conflict -cnotcontains 'HOLD_REASON=R102_MODES_MUTUALLY_EXCLUSIVE'){
            throw 'R102_CONFLICTING_MODE_NOT_BLOCKED'
          }
          $unauthorized=Run @('-Preflight','-ApprovalPhrase','APPROVE_PRIVATE_V0630_AND_GUARDED_LOGON_ONCE')
          if($unauthorized -cnotcontains 'HOLD_REASON=R102_APPROVAL_WITHOUT_COMMIT_FORBIDDEN'){
            throw 'R102_APPROVAL_LEAK_TO_READONLY_MODE'
          }
          $reuseWithoutApproval=Run @('-Commit','-ReuseExistingTask')
          if($reuseWithoutApproval -cnotcontains 'HOLD_REASON=R102_EXPLICIT_DUAL_SCOPE_OWNER_APPROVAL_REQUIRED'){
            throw 'R102_REUSE_COMMIT_WITHOUT_EXPLICIT_APPROVAL_NOT_BLOCKED'
          }
          $reuseInert=Run @('-ReuseExistingTask')
          if($reuseInert -cnotcontains 'HOLD_REASON=R102_REUSE_REQUIRES_EXPLICIT_MODE'){
            throw 'R102_REUSE_WITHOUT_MODE_NOT_INERT'
          }
          $taskConflict=Run @('-TaskOnly','-Commit')
          if($taskConflict -cnotcontains 'HOLD_REASON=R102_TASK_DIAG_CANNOT_COMBINE_MUTATION_OR_APPROVAL' -or
             $taskConflict -cnotcontains 'RESULT=R102_HOLD_NO_AUTO_RETRY'){
            throw 'R102_TASK_ONLY_MUTATION_COMBINATION_NOT_BLOCKED'
          }
          Write-Host 'R102_NATIVE_INERT_AND_EXPLICIT_DUAL_APPROVAL_DENIAL=PASS'
          Write-Host 'R102_OPERATING_RELEASE_AND_USER_LOGON_MUTATIONS=NONE'
          Write-Host 'R102_POSITIVE_OWNER_CUTOVER_AND_REAL_LOGON=NOT_RUN'
