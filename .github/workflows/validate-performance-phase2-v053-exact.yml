name: Validate Performance Phase 2 v0.5.3 Exact Identity

on:
  push:
    branches:
      - validate/performance-phase2-v0.5.3
    paths:
      - 'validation/performance-phase2-v0.5.3/**'
      - '.github/workflows/validate-performance-phase2-v053-exact.yml'
  pull_request:
    branches: [main]
    paths:
      - 'validation/performance-phase2-v0.5.3/**'
      - '.github/workflows/validate-performance-phase2-v053-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-identity-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove production main surface untouched
        shell: powershell
        run: |
          $base='6e2dd5cec54ca795457935d6bee83f63d39722bf'
          git cat-file -e "$base^{commit}"
          foreach($path in @(git diff --name-only "$base...HEAD")){
            if($path -eq 'manifest.json' -or $path.StartsWith('packages/') -or $path.StartsWith('bin/') -or $path.StartsWith('performance/overlay/')){throw "Production surface changed: $path"}
          }
          Write-Host 'V053_EXACT_PRODUCTION_ISOLATION_PASS'

      - name: Build and assert exact package identities
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.3/build_v053.py
          if($LASTEXITCODE-ne0){throw 'v0.5.3 exact builder failed.'}
          $zip='SpotifyControl-Track-Transition-Background-Guarded-Acceptance-v0.5.3.zip'
          $expectedZipSize=126853
          $expectedZipSha='b7aea344cd9a67c0b46886b41118bc3a33c76d2a2d7d6c8facdfa284b5baea43'
          if((Get-Item $zip).Length-ne$expectedZipSize){throw "v0.5.3 ZIP size drift: $((Get-Item $zip).Length)"}
          $zipSha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipSha-ne$expectedZipSha){throw "v0.5.3 ZIP SHA drift: $zipSha"}
          Expand-Archive -LiteralPath $zip -DestinationPath phase2-v053-exact -Force
          $ps1='phase2-v053-exact/track-transition-direct-patch-acceptance.ps1'
          $expectedPs1Size=108497
          $expectedPs1Sha='73793f14137b0eb8c2f008f5990e984f40650d4b566a974a30411cdfad94be84'
          if((Get-Item $ps1).Length-ne$expectedPs1Size){throw "v0.5.3 PS1 size drift: $((Get-Item $ps1).Length)"}
          $ps1Sha=(Get-FileHash $ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ps1Sha-ne$expectedPs1Sha){throw "v0.5.3 PS1 SHA drift: $ps1Sha"}
          foreach($line in Get-Content phase2-v053-exact/SHA256SUMS.txt){
            if($line-notmatch '^([0-9a-f]{64})  (.+)$'){throw "Bad checksum row: $line"}
            $actual=(Get-FileHash -LiteralPath (Join-Path phase2-v053-exact $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual-ne$Matches[1]){throw "Checksum mismatch: $($Matches[2])"}
          }
          Write-Host "V053_EXACT_IDENTITY_PASS package_size=$expectedZipSize package_sha=$expectedZipSha script_size=$expectedPs1Size script_sha=$expectedPs1Sha"

      - name: Parse and assert background guarded contract
        shell: powershell
        run: |
          $p='phase2-v053-exact/track-transition-direct-patch-acceptance.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Exact v0.5.3 failed PowerShell 5.1 parse.'}
          $s=Get-Content $p -Raw
          foreach($required in @('$Version = "0.5.3"','RegisterSessionNotification','WaitForSpotifyCapture(5000,5)','Start-Process -FilePath $SpotifyExe -WindowStyle Hidden','SW_SHOWNOACTIVATE','HWND_BOTTOM','spotify_minimized_during_measurement=$false','TrySkipNextAsync','SPOTIFY_NEXT_CONFIRMED')){
            if($s.IndexOf($required,[StringComparison]::Ordinal)-lt0){throw "Missing exact v0.5.3 contract: $required"}
          }
          foreach($forbidden in @('keybd_event','SpotifyControlMediaKeys','Send-MediaKey','Set-SpotifySilentForTest','SpotifyControlAudioSession','SW_MINIMIZE')){
            if($s.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "Forbidden exact v0.5.3 surface: $forbidden"}
          }
          Write-Host 'V053_EXACT_RUNTIME_CONTRACT_PASS'

      - name: Deterministic exact rebuild
        shell: powershell
        run: |
          $zip='SpotifyControl-Track-Transition-Background-Guarded-Acceptance-v0.5.3.zip'
          $before=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          python validation/performance-phase2-v0.5.3/build_v053.py
          if($LASTEXITCODE-ne0){throw 'Second exact v0.5.3 build failed.'}
          $after=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($before-ne$after -or $after-ne'b7aea344cd9a67c0b46886b41118bc3a33c76d2a2d7d6c8facdfa284b5baea43'){throw "v0.5.3 deterministic identity drift: $before / $after"}
          Write-Host 'V053_EXACT_DETERMINISTIC_PASS'

      - name: Upload exact v0.5.3 package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Track-Transition-Background-Guarded-Acceptance-v0.5.3-exact
          path: SpotifyControl-Track-Transition-Background-Guarded-Acceptance-v0.5.3.zip
          if-no-files-found: error
          retention-days: 14
