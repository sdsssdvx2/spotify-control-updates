name: HOLD R76 offline owner PC read-only prepublication admission
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-owner-readonly-admission-R76-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/owner-readonly-admission-R76-HOLD.ps1
permissions: {contents: read}
jobs:
  offline-win51-compatibility-admission:
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Verify no-download readonly owner admission is parseable and preserves an offline scratch profile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/owner-readonly-admission-R76-HOLD.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R76_NATIVE_PS51_PARSE_FAILED'}
          $root=Join-Path $env:RUNNER_TEMP 'Spotify R76 Readonly Fixture'
          $local=Join-Path $root 'LocalAppData'
          $roam=Join-Path $root 'Roaming'
          $stateDir=Join-Path $local 'SpotifyControl'
          foreach($dir in @($root,$local,$roam,$stateDir)){
            [void][IO.Directory]::CreateDirectory($dir)
          }
          $state=Join-Path $stateDir 'state.json'
          [IO.File]::WriteAllText($state,'{"agent_mutation_enabled":false,"guard_enforced":"blocked","unrelated":{"secret":"do-not-print"}}',[Text.Encoding]::UTF8)
          $prior=(Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash
          $env:LOCALAPPDATA=$local
          $env:APPDATA=$roam
          $output=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script 2>&1)
          if($LASTEXITCODE -ne 0){throw 'R76_NATIVE_READONLY_EXECUTION_RETURNED_FAILURE'}
          foreach($required in @(
            'RESULT=READONLY_SNAPSHOT_COMPLETE',
            'EXACT_INSTALLED_STACK=HOLD_NOT_EXACT',
            'SPOTIFY_VERSION=NOT_AT_STANDARD_PATH',
            'SPICETIFY_CLI_SOURCE_PIN=NOT_AT_STANDARD_PATH',
            'AGENT_MUTATION_SAVED=OFF_SAVED',
            'SPOTIFY_UPDATE_GUARD_SAVED=BLOCKED_REPORTED_ONLY',
            'OWNER_ROLLOUT_ADMISSION=HOLD_REVIEW_ONLY',
            'AUTHORIZE_DEPLOY=NO;AUTOMATIC_RETRY=NO;OWNER_SOURCE_CHANGE=NO',
            'NETWORK=NO;INSTALL=NO;UPDATE=NO;APPLY=NO;REGISTRY_WRITE=NO;ACL_WRITE=NO'
          )){
            if($output -cnotcontains $required){throw ('R76_MISSING_READONLY_RECEIPT_'+$required.Split('=')[0])}
          }
          if(($output -join [Environment]::NewLine) -match 'do-not-print' -or
             ($output -join [Environment]::NewLine).Contains($root) -or
             (Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash -cne $prior){
            throw 'R76_UNAUTHORIZED_DATA_EXPOSURE_OR_STATE_MUTATION'
          }
          if(@(Get-ChildItem -LiteralPath $stateDir -Force -ErrorAction Stop).Count -ne 1){
            throw 'R76_OWNER_PROFILE_SCRATCH_CONTENT_CHANGED'
          }
          Write-Host 'R76_NATIVE_PS51_PARSE_AND_ISOLATED_OFFLINE_READONLY_PROOF=PASS'
          Write-Host 'R76_UNKNOWN_VERSION_AND_MISSING_PIN_FAIL_CLOSED=PASS'
          Write-Host 'R76_USER_SOURCE_CONFIG_STATE_UNTOUCHED=PASS'
          Write-Host 'R76_NO_RELEASE_NO_OWNER_PC_NO_PAID_TOOLS=PASS'
