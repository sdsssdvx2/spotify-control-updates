name: Inspect validated v0.4.1 runtime structure

on:
  workflow_dispatch:
  push:
    branches: [perf-overlay-v0.1.0]
    paths:
      - 'validation/performance-overlay-runtime-v0.1.0/inspect_v041.py'
      - '.github/workflows/inspect-performance-overlay-runtime-v010.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate validated v0.4.1 and inspect reusable runtime boundaries
        shell: python
        run: |
          import runpy
          runpy.run_path('validation/performance-overlay-runtime-v0.1.0/inspect_v041.py',run_name='__main__')
