name: V060 stable Maintain AgentTick Addon source callgraph (HOLD)
on:
  push:
    branches: [validate/stable-maintain-agenttick-callgraph-v060-HOLD]
    paths:
      - 'validation/normal-engine-shared-turnstile/audit-stable-maintain-agenttick-v060.py'
      - 'validation/normal-engine-shared-turnstile/test-stable-mutex-interop-v060.ps1'
      - 'validation/normal-engine-shared-turnstile/reentrant-addon-turnstile-v060.ps1'
      - 'validation/normal-engine-shared-turnstile/test-reentrant-addon-turnstile-v060.ps1'
      - '.github/workflows/validate-stable-maintain-agenttick-v060.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-source-only-three-installed-entrypoints:
    runs-on: windows-2025
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact V059 parent, stable main and only 5 development files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='72ba786d67ef8d7db33d1d3988001b2b51018273'
          $main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          $script='validation/normal-engine-shared-turnstile/audit-stable-maintain-agenttick-v060.py'
          $test='validation/normal-engine-shared-turnstile/test-stable-mutex-interop-v060.ps1'
          $module='validation/normal-engine-shared-turnstile/reentrant-addon-turnstile-v060.ps1'
          $reentrant='validation/normal-engine-shared-turnstile/test-reentrant-addon-turnstile-v060.ps1'
          $workflow='.github/workflows/validate-stable-maintain-agenttick-v060.yml'
          if((git merge-base $base HEAD).Trim() -cne $base -or
             (git rev-parse origin/main).Trim() -cne $main -or
             (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'V060_PARENT_OR_PRODUCTION_MAIN_DRIFT'
          }
          $changed=@(git diff --name-only "$base...HEAD")
          if($changed.Count -ne 5 -or @($changed|Where-Object{$_ -notin @($script,$test,$module,$reentrant,$workflow)}).Count -ne 0){
            throw 'V060_SCOPE_EXCEEDS_FIVE_AUDIT_FILES'
          }
          $psTokens=$null;$psErrors=$null
          foreach($p in @($test,$module,$reentrant)){
            $psTokens=$null;$psErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$psTokens,[ref]$psErrors)
            if($psErrors.Count){throw ('V060_INTEROP_PS51_PARSE_ERROR_'+$p+'_'+$psErrors[0].Message)}
          }
          & python -m py_compile $script
          if($LASTEXITCODE -ne 0){throw 'V060_PYTHON_SYNTAX_ERROR'}
          $s=Get-Content $script -Raw
          foreach($token in @('v059.read_exact','V060_STABLE_TRIPLE_PIN_CHANGED',
            'V060_SOURCE_CALLSITE_ONLY_NOT_RUNTIME_CUTOVER_OR_LIVE_AUTHORITY_PASS',
            'AgentTick','Maintain','Update-AutoApps','resident_agent')){
             if(-not $s.Contains($token)){throw ('V060_GRAPH_PROOF_MISSING_'+$token)}
          }
          Write-Host 'V060_PINNED_V059_PARENT_STABLE_MAIN_TWO_FILES_PYTHON_SYNTAX_PASS'
      - name: Reconstruct exact pinned main v0.6.28 + addon r17 from known builders
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          & python validation/v0.6.28/build_v0628.py --build
          if($LASTEXITCODE -ne 0){throw 'V060_RECONSTRUCT_PINNED_PRODUCTION_FAILED'}
          Write-Host 'V060_EXACT_STABLE_MAIN_AND_ADDON_REBUILT_SHA_SIZE_PASS'
      - name: Read-only audited source graph, resident VBS from sha-pinned archive
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v060-source-callgraph.txt'
          $ErrorActionPreference='Continue'
          & python validation/normal-engine-shared-turnstile/audit-stable-maintain-agenttick-v060.py *>&1 |
            Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($rc -ne 0){
             Get-Content $log -Tail 90|ForEach-Object{Write-Host $_}
             throw ('V060_PINNED_GRAPH_AUDIT_FAILED_'+$rc)
          }
          $body=Get-Content $log -Raw
          foreach($needle in @(
            'V060_ACTUAL_STABLE_MAIN_ADDON_VBS_TRIPLE_PINNED_DISPATCH_SOURCE_AUDIT_PASS',
            'V060_SOURCE_CALLSITE_ONLY_NOT_RUNTIME_CUTOVER_OR_LIVE_AUTHORITY_PASS',
            'V060_PUBLIC_SOURCE_STABLE_MAIN',
            'V060_PUBLIC_SOURCE_STABLE_ADDON_R17',
            'V060_PUBLIC_SOURCE_RESIDENT_AGENT')){
             if(-not$body.Contains($needle)){throw ('V060_MISSING_SOURCE_EVIDENCE_'+$needle)}
          }
          Get-Content $log|ForEach-Object{Write-Host $_}
          Write-Host 'V060_PUBLIC_CODE_SOURCE_ONLY_NEVER_EXECUTED_OR_LIVE_MUTATED_PASS'
      - name: Real stable maintenance OS mutex cross-process interoperability, no Spotify execution
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v060-stable-mutex.txt'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/normal-engine-shared-turnstile/test-stable-mutex-interop-v060.ps1' *>&1 |
            Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($rc -ne 0){
            Get-Content $log -Tail 70|ForEach-Object{Write-Host $_}
            throw ('V060_STABLE_MUTEX_REAL_SOURCE_TEST_FAILED_'+$rc)
          }
          $proof=Get-Content $log -Raw
          foreach($marker in @(
             'V060_REAL_STABLE_MAINTENANCE_MUTEX_HELD_BLOCKS_OTHER_PROCESS_PASS',
             'V060_LEGACY_AGENTTICK_MUTEX_DISTINCT_AND_MAINTENANCE_REMAINS_BLOCKED_PASS',
             'V060_REAL_STABLE_MAINTENANCE_OS_MUTEX_RELEASES_FOR_CHILD_PROCESS_PASS',
             'V060_PINNED_R17_UPDATE_AUTOAPPS_SHARED_TURNSTILE=',
             'V060_PINNED_R17_ROLLBACK_LASTTRANSACTION_SHARED_TURNSTILE=',
             'V060_PINNED_R17_COMMIT_LASTTRANSACTION_SHARED_TURNSTILE=',
             'V060_PINNED_STABLE_MAIN_R17_FUNCTIONS_ONLY_NO_LIVE_PROGRAM_EXECUTION_PASS',
             'V060_NO_USER_TASK_PROFILE_STARTUP_OR_SPOTIFY_MUTATION_NO_PRODUCTION_AUTHORITY_PASS')){
            if(-not$proof.Contains($marker)){throw ('V060_MISSING_CROSS_PROCESS_OR_OLD_R17_EVIDENCE_'+$marker)}
          }
          Get-Content $log|ForEach-Object{Write-Host $_}
          Write-Host 'V060_STABLE_REAL_MUTEX_NONCOOPERATIVE_PARENT_BLOCK_WITHOUT_SIDE_EFFECTS_PASS'
      - name: V060 nested Update rollback LIFO reentrant FileShare.None lease, hosted-only
        shell: powershell
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v060-reentrant-regression.txt'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/normal-engine-shared-turnstile/test-reentrant-addon-turnstile-v060.ps1' *>&1 |
            Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($rc -ne 0){
             Get-Content $log -Tail 85 | ForEach-Object{Write-Host $_}
             throw ('V060_NESTED_REENTRANT_TEST_FAILED_'+$rc)
          }
          $proof=Get-Content $log -Raw
          foreach($marker in @(
            'V060_REAL_R17_UPDATE_CALLS_ROLLBACK_WHILE_V047_WRAPPED_BOTH_MUTATORS_PASS',
            'V060_SAME_RUNSPACE_NESTED_ROLLBACK_ONE_LOCK_OTHER_PROCESS_DENIED_PASS',
            'V060_NESTED_RETURN_KEEP_OUTER_FILESHARE_EXCLUSIVE_PASS',
            'V060_OUTER_EXIT_RELEASES_OS_LOCK_AND_DOUBLE_EXIT_FAIL_CLOSED_PASS',
            'V060_SYNTHETIC_UPDATE_ROLLBACK_NESTING_EXCEPTION_EXACT_RELEASE_PASS',
            'V060_NO_OLD_ADDON_EXECUTION_NO_REAL_SPOTIFY_NO_PRODUCTION_AUTHORITY_PASS')){
             if(-not$proof.Contains($marker)){throw ('V060_NESTED_LOCK_PROOF_MISSING_'+$marker)}
          }
          Write-Host 'V060_REENTRANT_NESTED_UPDATE_ROLLBACK_AND_CROSS_PROCESS_EXCLUSION_PASS'
      - name: Reconfirm operating main unchanged
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
             throw 'V060_PRODUCTION_MAIN_DRIFT'
          }
          Write-Host 'V060_OPERATING_SPOTIFY_ADDON_SCHEDULER_PROFILE_UNCHANGED_PASS'
