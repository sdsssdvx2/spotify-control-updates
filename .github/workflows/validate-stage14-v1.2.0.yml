name: Validate exact Spotify Control Stage14 v1.2.0 package
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/stage14-v1.2.0/**'
      - '.github/workflows/validate-stage14-v1.2.0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell51-stage14-v120:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct, repair, and verify exact Stage14 v1.2.0 ZIP
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import base64, hashlib, subprocess, sys, zipfile

          pieces = [
              ('validation/stage14-v1.2.0/segments/seg-00.txt', 3000, '035e6abe093db9ab445be4778dbb3d8e4df298b7c95c49c71c42e39a5e4a009d'),
              ('validation/stage14-v1.2.0/segments/seg-01.txt', 3000, '56751e85bcd925b2f3d88d3e3e6b3a2bf8961ae5b2215dbebbb06da168590560'),
              ('validation/stage14-v1.2.0/segments/seg-02.txt', 3000, '5302a0379055ab0190427ce6291f8979450143b5665678787154f3a9869cb528'),
              ('validation/stage14-v1.2.0/segments/seg-03.txt', 3000, '4c8b99d47ca7e89e5f22457908210cc0404426c638c21dd85ab5fe16dd9169ba'),
              ('validation/stage14-v1.2.0/segments/seg-04.txt', 3000, '4efe46f5d6829ac16401f44db3617e3d252d06b6f692c8b7f7cf5ce181713fe5'),
              ('validation/stage14-v1.2.0/segments/seg-05.txt', 3000, '891e8173e7f2ec4d25b3b6b81fed4fe1bdf80f1c2ad54b6e588fc016c71bfc9a'),
              ('validation/stage14-v1.2.0/segments/seg-06.txt', 3000, '548e26cbca4d12cc7f09f975581f100c12bfd04d5fd00131709a9fdf2625dafa'),
              ('validation/stage14-v1.2.0/segments/seg-07.txt', 3000, 'f6f80a220052179704ee0ab1e0e0c26f7675652f589d20c63cf0a7f2eb4c1d1d'),
              ('validation/stage14-v1.2.0/segments/seg-08.txt', 3000, '81413e9075130123b69728b1a72e38f6b3b58dd6d8e054e0c86eaea293d08a71'),
              ('validation/stage14-v1.2.0/segments/seg-09.txt', 3000, '2d15806169d13a0c322b9e114f32d084e350b638873c584697352ecd38f3a450'),
              ('validation/stage14-v1.2.0/segments/seg-10.txt', 3000, '80b330fae3daaad7348a4741feeec65b0d0c585bd0502e206c5f16237a8662b9'),
              ('validation/stage14-v1.2.0/segments/seg-11.txt', 3000, 'f61418e08e3868fa658f93ecf84b476579a54a30414bcb11a68ed035feebc454'),
              ('validation/stage14-v1.2.0/segments/seg-12.txt', 3000, '0f448c810d07b3a05b5fc158185866795e834897f013b95a9ab9611bda075ada'),
              ('validation/stage14-v1.2.0/segments/seg-13.txt', 3000, '1b42f405317104bbcc7f41a9bb70951637b54316b78a695131ec488fcf24bf11'),
              ('validation/stage14-v1.2.0/segments/seg-14.txt', 3000, '989c70515969d8f5d1d7cac8568d366348da333536090d2470bbcebf5279c791'),
              ('validation/stage14-v1.2.0/segments/seg-15.txt', 984, 'aa83e9749ef65b019896f5a320318e7523027d24f3f0b0319e73571a04e8b667'),
          ]
          parts=[]
          for rel,size,sha in pieces:
              data=Path(rel).read_bytes()
              assert len(data)==size, (rel,len(data),size)
              assert hashlib.sha256(data).hexdigest()==sha, rel
              parts.append(data)
          encoded=b''.join(parts)
          assert len(encoded)==45984
          assert hashlib.sha256(encoded).hexdigest()=='54ddc6a5f179cb9b108704dbc6fe92accf20113f2610acba74bd6bd7c4909fa8'
          raw=base64.b64decode(encoded, validate=True)
          assert len(raw)==34488
          assert hashlib.sha256(raw).hexdigest()=='cf66fd207cbcd7bf7996af3eb99009ce5ad2adcced3b7652b8343fc0bcfc2ce2'
          zpath=Path('SpotifyControl-Windows-Runtime-Acceptance-v1.2.0.zip')
          zpath.write_bytes(raw)

          out=Path('stage14-v120-unpacked')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              infos=z.infolist()
              names=z.namelist()
              assert len(names)==len(set(names))
              for name in names:
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
                  assert not (len(name)>=2 and name[1]==':')
              z.extractall(out)

          run_path=out/'RUN_RUNTIME_ACCEPTANCE.ps1'
          run=run_path.read_text(encoding='utf-8-sig')
          assert run.count("}`n        self_update=")==1
          assert run.count("$SelfUpdateEvidence`n        addon_schedule_gate=")==1
          run=run.replace("}`n        self_update=", "}\n        self_update=", 1)
          run=run.replace("$SelfUpdateEvidence`n        addon_schedule_gate=", "$SelfUpdateEvidence\n        addon_schedule_gate=", 1)
          run_path.write_text(run,encoding='utf-8-sig',newline='\n')

          validator=out/'evidence'/'validate_stage14.py'
          v=validator.read_text(encoding='utf-8')
          needle="st,state=strip_ps(s);ck('lexer-ended-code',state=='code',state)\n"
          extra="ck('no-bare-backtick-newline-escape', '`n' not in st and '`r' not in st, [(i,line) for i,line in enumerate(st.splitlines(),1) if '`n' in line or '`r' in line][:10])\n"
          assert needle in v and 'no-bare-backtick-newline-escape' not in v
          validator.write_text(v.replace(needle,needle+extra),encoding='utf-8',newline='\n')

          check=subprocess.run([sys.executable,'evidence/validate_stage14.py'],cwd=out,capture_output=True,text=True)
          print(check.stdout); print(check.stderr)
          assert check.returncode==0
          assert 'STAGE14 V1.2 SELF VALIDATION: 156/156 PASS' in check.stdout
          assert 'PASS: no-bare-backtick-newline-escape - []' in check.stdout

          rels=['PRECHECK_RUNTIME_ACCEPTANCE.ps1','README.txt','RUN_RUNTIME_ACCEPTANCE.cmd','RUN_RUNTIME_ACCEPTANCE.ps1','evidence/SELF_VALIDATION_REPORT.json','evidence/SELF_VALIDATION_REPORT.txt','evidence/VALIDATION_OUTPUT.txt','evidence/validate_stage14.py']
          (out/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256((out/r).read_bytes()).hexdigest()}  {r}" for r in rels)+'\n',encoding='ascii',newline='\n')

          fixed=Path('fixed.zip')
          with zipfile.ZipFile(fixed,'w') as zout:
              for info in infos:
                  data=(out/info.filename).read_bytes()
                  ni=zipfile.ZipInfo(info.filename,date_time=info.date_time)
                  ni.compress_type=info.compress_type; ni.comment=info.comment; ni.extra=info.extra
                  ni.create_system=info.create_system; ni.create_version=info.create_version; ni.extract_version=info.extract_version
                  ni.flag_bits=info.flag_bits; ni.external_attr=info.external_attr; ni.internal_attr=info.internal_attr; ni.volume=info.volume
                  zout.writestr(ni,data,compress_type=info.compress_type,compresslevel=6)
          fixed_raw=fixed.read_bytes()
          print('FIXED ZIP',len(fixed_raw),hashlib.sha256(fixed_raw).hexdigest())
          assert len(fixed_raw)==34730
          assert hashlib.sha256(fixed_raw).hexdigest()=='7d7022789a818818c1c4bd877cc3e052376e2b1dbc9bc7eb7ab70a0b8ac0ba2e'
          fixed.replace(zpath)

          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              for line in z.read('SHA256SUMS.txt').decode('ascii').splitlines():
                  digest,rel=line.split('  ',1)
                  assert hashlib.sha256(z.read(rel)).hexdigest()==digest, rel

          run=(out/'RUN_RUNTIME_ACCEPTANCE.ps1').read_text(encoding='utf-8-sig')
          for needle in ['0.6.15','0.6.5-r5','864e195ab08b3a3d37a181998d1ca59a3c0d7adf','86dbfea3b22c110a2a1425b0340bbf333329c51a5ae9253b0a45a955f0ae67dd','Fresh actionable addon pending bypasses the 168-hour schedule gate','Force/reinstall semantics remain disabled',"Invoke-Bootstrap 'Rollback' -Force:$SelfUpdateFreshCommitReached"]:
              assert needle in run
      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'SpotifyControl-Windows-Runtime-Acceptance-v1.2.0.zip' -DestinationPath 'stage14-v120-ps' -Force
          foreach($rel in @('PRECHECK_RUNTIME_ACCEPTANCE.ps1','RUN_RUNTIME_ACCEPTANCE.ps1')) {
            $path=(Resolve-Path (Join-Path 'stage14-v120-ps' $rel)).Path
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "Windows PowerShell 5.1 parser rejected $rel" }
          }
          Write-Host 'Stage14 v1.2.0 Windows PowerShell 5.1 parser PASS.'
      - name: Upload exact validated Stage14 v1.2.0 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.2.0
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.2.0.zip
          if-no-files-found: error
          compression-level: 6
