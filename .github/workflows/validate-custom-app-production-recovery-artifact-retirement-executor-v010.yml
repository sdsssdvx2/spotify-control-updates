name: Validate Custom App Production Recovery Artifact Retirement Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-artifact-retirement-executor-v0.1.0]
    paths: ['validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-artifact-retirement-executor-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-artifact-retirement-admission-v0.1.0]
    paths: ['validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-artifact-retirement-executor-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage pins frozen production and delegated delete contract
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='16cac85b7bde1b652be67e8d657136409ec7f8b9';if((git merge-base $p HEAD).Trim()-cne$p){throw 'lineage mismatch'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-artifact-retirement-executor-v010.yml','validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/custom-app-production-recovery-artifact-retirement-executor.ps1','validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/test_custom_app_production_recovery_artifact_retirement_executor.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|?{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          $pins=@(
            @($h,'validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/custom-app-production-recovery-artifact-retirement-executor.ps1','be4ae0b1d67339f80c71a47ecbff8cc9066fff61'),
            @($h,'validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/test_custom_app_production_recovery_artifact_retirement_executor.ps1','2733df3a6624041ecbb94eaf189c10df3eba2572'),
            @($p,'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/custom-app-production-recovery-artifact-retirement-admission.ps1','ec8aec5393f30923226f48df9850fded26ca11c6'),
            @($p,'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission_v011.ps1','c7c9ef72c2e8c4a0734081fca9ff556b9e9fa674'),
            @('67458cbb96b5d1ed92e26c2b81debd6894044749','validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1','3b14280d727287252f71611e4424d78e5705c2f1'),
            @('c3e1f960447ba84d2410af9c37a22a384f2a5436','validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','5fec613c460619da5dbfe88fca5c7334e9e93f76'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($q in $pins){$b=(git rev-parse "$($q[0])`:$($q[1])").Trim();if($b-cne$q[2]){throw "pin drift $($q[1]) $b != $($q[2])"}}
          $d='validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0';foreach($f in @("$d/custom-app-production-recovery-artifact-retirement-executor.ps1","$d/test_custom_app_production_recovery_artifact_retirement_executor.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-artifact-retirement-executor.ps1" -Raw
          foreach($m in @('Resolve-CustomAppProductionRecoveryArtifactRetirementAdmissionV010','Test-CustomAppProductionRecoveryArtifactRetirementAdmissionReceiptV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010','Open-CustomAppProductionRecoveryArtifactRetirementExecutorLockV010','requires_future_fresh_revalidation=$true','journal_retained=$true','recovery_evidence_retained=$true','requires_new_update_permit=$true','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "executor marker missing $m"}}
          foreach($x in @('[IO.Directory]::Delete','[IO.Directory]::Move','[IO.File]::Copy','[IO.File]::Write','Remove-Item','Move-Item','Copy-Item','Start-Process','ProcessStartInfo','Invoke-WebRequest','Invoke-RestMethod','Restore-SpotifyPersistenceBackup','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "executor gained forbidden direct side effect $x"}}
          $test=Get-Content "$d/test_custom_app_production_recovery_artifact_retirement_executor.ps1" -Raw
          foreach($m in @('executor-lock','executor-race-delete','executor-stage-race','crash-after-transaction','crash-after-stage','crash-after-app','crash-after-persistence','live-drift-after-stage','authority-tampered executor result accepted','repeat-complete')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "executor coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_SCOPE_STATIC_PASS'

      - name: Materialize exact durable sibling dependencies
        shell: powershell
        run: |
          $deps=@(
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'))
          foreach($q in $deps){$path=$q[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:S="$($q[0])`:$path";$env:O=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['O']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['S']]))";if($LASTEXITCODE){throw "materialize failed $path"};if((git hash-object $path).Trim()-cne$q[2]){throw "materialized blob drift $path"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_MATERIALIZATION_PASS'

      - name: Run executor restart race matrix twice
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP;$t='validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/test_custom_app_production_recovery_artifact_retirement_executor.ps1';1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $t;if($LASTEXITCODE){throw "retirement executor matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_MATRIX_REPEAT_PASS'

      - name: Replay exact retirement admission parent matrix in short isolated fixture root
        shell: powershell
        run: |
          $clean=Join-Path $env:RUNNER_TEMP ('r'+[Guid]::NewGuid().ToString('N').Substring(0,6));New-Item -ItemType Directory -Force -Path $clean|Out-Null
          if($clean.Length -gt 32){throw "isolated fixture root unexpectedly long: $clean"}
          $env:RUNNER_TEMP=$clean;$env:TEMP=$clean;$env:TMP=$clean
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission_v011.ps1';if($LASTEXITCODE){throw 'retirement admission parent regression failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_PARENT_PASS'

      - name: Rebuild journal-integrated candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py';if($LASTEXITCODE){throw 'candidate build failed'}
          $a='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/addon-manager.ps1';$m='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/spotify-control.ps1';if((Get-Item $a).Length-ne973527-or(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant()-cne'3eac8cf4bfdcbbc38e7d4c01186a583fd13f96a27a98d8f6903147a4341da823'){throw 'addon candidate drift'};if((Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant()-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main candidate drift'}
          $s=Join-Path $env:RUNNER_TEMP 'retirement-executor-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='16cac85b7bde1b652be67e8d657136409ec7f8b9';foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/custom-app-production-recovery-artifact-retirement-admission.ps1','validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          $d='validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();parent=$p;fixture_only=$true;exclusive_lock=$true;fresh_admission_before_each_artifact=$true;fresh_admission_after_each_artifact=$true;direct_delete_primitive=$false;delegated_bounded_delete_helper='67458cbb96b5d1ed92e26c2b81debd6894044749';restart_safe_partial_retirement=$true;live_and_persistence_reverified=$true;journal_retained=$true;recovery_evidence_retained=$true;new_update_permit_required=$true;all_authority_false=$true;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_EXECUTOR_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-artifact-retirement-executor-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/custom-app-production-recovery-artifact-retirement-executor.ps1
            validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/test_custom_app_production_recovery_artifact_retirement_executor.ps1
            validation/custom-app-production-recovery-artifact-retirement-executor-v0.1.0/ci-evidence.json
          if-no-files-found: error