name: Validate Marketplace Lifecycle Identity Ledger v0.1.0

on:
  push:
    branches:
      - validate/marketplace-lifecycle-identity-ledger-v0.1.0
    paths:
      - 'validation/marketplace-lifecycle-identity-ledger-v0.1.0/**'
      - '.github/workflows/validate-marketplace-lifecycle-identity-ledger-v010.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'validation/marketplace-lifecycle-identity-ledger-v0.1.0/**'
      - '.github/workflows/validate-marketplace-lifecycle-identity-ledger-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact validation scope
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $base='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          if((git merge-base $base HEAD).Trim() -cne $base){throw 'Validation branch base drifted from exact v0.6.28/r17 stable main.'}
          $allowed=@(
            '.github/workflows/validate-marketplace-lifecycle-identity-ledger-v010.yml',
            'validation/marketplace-lifecycle-identity-ledger-v0.1.0/marketplace-identity-ledger.ps1',
            'validation/marketplace-lifecycle-identity-ledger-v0.1.0/test-identity-ledger.ps1'
          )
          $changed=@(git diff --name-only "$base...HEAD");$unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count){throw "Validation scope escaped: $($unexpected -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected validation file: $required"}}
          Write-Host "MARKETPLACE_IDENTITY_LEDGER_SCOPE_PASS head=$actual"

      - name: PowerShell 5.1 parse all validation scripts
        shell: powershell
        run: |
          foreach($file in @(
            'validation/marketplace-lifecycle-identity-ledger-v0.1.0/marketplace-identity-ledger.ps1',
            'validation/marketplace-lifecycle-identity-ledger-v0.1.0/test-identity-ledger.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("$file :: "+$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'MARKETPLACE_IDENTITY_LEDGER_PS51_PARSE_PASS'

      - name: Assert fail-closed contract is structurally present
        shell: powershell
        run: |
          $p='validation/marketplace-lifecycle-identity-ledger-v0.1.0/marketplace-identity-ledger.ps1'
          $t=Get-Content -LiteralPath $p -Raw
          foreach($needle in @(
            "managed_by','marketplace-record-v1'",
            "mutation_mode','deny'",
            'safe_to_expand_mutation_authority',
            'TransactionOwnedAbsenceKeys',
            'profile_conflicts',
            'read_only',
            'mutation_performed',
            'user_removed',
            'reinstalled_at',
            'source_identity drift',
            'Duplicate Marketplace identity in report'
          )){if(-not $t.Contains($needle)){throw "Missing fail-closed contract marker: $needle"}}
          if($t -match "mutation_mode\s*=\s*'auto'"){throw 'Validation core must never grant auto mutation authority.'}
          Write-Host 'MARKETPLACE_IDENTITY_LEDGER_STATIC_CONTRACT_PASS'

      - name: Run 15-scenario identity and user-intent matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/marketplace-lifecycle-identity-ledger-v0.1.0/test-identity-ledger.ps1'
          if($LASTEXITCODE -ne 0){throw "Identity ledger matrix failed with exit code $LASTEXITCODE"}

      - name: Prove production and prior stable surfaces untouched
        shell: powershell
        run: |
          git diff --exit-code d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2...HEAD -- manifest.json manifest.schema.json packages README.md validation/v0.6.28 .github/workflows/validate-stable-main.yml
          if($LASTEXITCODE -ne 0){throw 'Validation branch changed production/stable surfaces.'}
          Write-Host 'MARKETPLACE_IDENTITY_LEDGER_PRODUCTION_UNCHANGED_PASS'
