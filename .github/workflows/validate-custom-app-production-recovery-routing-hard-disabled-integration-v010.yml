name: Validate Custom App Production Recovery Routing Hard-Disabled Integration v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-hard-disabled-integration-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-routing-admission-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-hard-disabled-integration-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='2f2f596bb8a86c0b074543992f7634be858821a4';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact recovery routing admission head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-routing-hard-disabled-integration-v010.yml','validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          $blob=(git rev-parse "HEAD:validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py").Trim();if($blob-cne'977ee4a599952877a2eac316fa78ca406326b396'){throw "builder pin drift $blob"}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_SCOPE_PASS'

      - name: Prove exact parent and router pins
        shell: powershell
        run: |
          $pins=@(
            @('92a3e8ac83c8bbbe9e5d4b6f3f00469701250acc','validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py','1440d16fd55b268efbf1fdd4efe714cd80c35e39'),
            @('2f2f596bb8a86c0b074543992f7634be858821a4','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','4225bb042aa8d240706e1f383e54f12894e74512')
          );foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b-cne$p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_PINS_PASS'

      - name: Build exact recovery routing hard-disabled candidate
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'recovery routing candidate build failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json"
          $ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();$as=(Get-Item $a).Length
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate changed'}
          if($as-ne1325619-or$ah-cne'e7f3ba6bc03cc4ff118f098778fe5ac7f308f1a99ecdc4149131ed2a8156579a'){throw "recovery routing candidate exact output drift size=$as sha256=$ah"}
          if($rh-cne'04f27f865c5bc47065fad13a3b343a66ee595a8cf48f732ce916374181e3f142'){throw "candidate report exact output drift sha256=$rh"}
          "ADDON_HASH=$ah"|Out-File $env:GITHUB_ENV -Append -Encoding utf8;"ADDON_SIZE=$as"|Out-File $env:GITHUB_ENV -Append -Encoding utf8;"REPORT_HASH=$rh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RECOVERY_ROUTING_EXACT_BUILD addon_size=$as addon_sha256=$ah report_sha256=$rh"

      - name: Parse candidate and audit loaded-but-unreachable routing
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0';$a="$d/out/bin/addon-manager.ps1";$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $a),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("candidate line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw 'recovery routing integrated candidate PS5.1 parse failed'}
          $raw=Get-Content $a -Raw
          foreach($m in @('$script:CustomAppProductionPipelineEnabled = $false','CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_SELFTEST_V010_PASS loaded-but-unreachable','CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_SELFTEST_V010_PASS loaded-but-unreachable','Resolve-CustomAppProductionRecoveryRoutingAdmissionV010','Custom App production full-chain execution is intentionally unavailable in integration-only candidate.')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "candidate marker missing $m"}}
          $trueAssignments=[regex]::Matches($raw,'(?im)^[ \t]*[$]script:CustomAppProductionPipelineEnabled[ \t]*=[ \t]*[$]true[ \t]*\r?$');if($trueAssignments.Count-ne1){throw "forced-enable assignment count drift $($trueAssignments.Count) != 1"}
          $report=Get-Content "$d/candidate-validation.json" -Raw|ConvertFrom-Json
          foreach($f in @('pipeline_enabled','pipeline_enablement_implemented','recovery_normal_path_wiring_added','bounded_recovery_normal_path_wiring_added','routing_normal_path_wiring_added','router_execution_added','generic_auto_authority_expanded','production_main_changed')){if([bool]$report.$f){throw "candidate report gained authority/reachability: $f"}}
          if(-not[bool]$report.full_chain_function_unchanged-or-not[bool]$report.candidate_reduces_exactly_to_parent){throw 'candidate parent reduction proof failed'}
          if(@($report.preexisting_parent_functions_changed).Count-ne0-or@($report.router_preexisting_callers).Count-ne0){throw 'router changed/became reachable from pre-existing parent function'}
          if([int]$report.pipeline_true_assignment_count-ne1-or-not[bool]$report.pipeline_true_assignment_inherited_selftest_only){throw 'forced-enable provenance contract drift'}
          if([string]$report.router_head-cne'2f2f596bb8a86c0b074543992f7634be858821a4'-or[string]$report.router_blob-cne'4225bb042aa8d240706e1f383e54f12894e74512'){throw 'router exact pin drift'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_PARSE_AUDIT_PASS'

      - name: Run Addon Manager SelfTest in isolated profile
        shell: powershell
        run: |
          $a='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/out/bin/addon-manager.ps1';$s=Join-Path $env:RUNNER_TEMP 'recovery-routing-hard-disabled-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_SELFTEST_PASS'

      - name: Rebuild deterministically and compare exact output
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'second deterministic build failed'};$a="$d/out/bin/addon-manager.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();$as=(Get-Item $a).Length;if($as-ne1325619-or$ah-cne'e7f3ba6bc03cc4ff118f098778fe5ac7f308f1a99ecdc4149131ed2a8156579a'){throw "candidate exact hard pin drift size=$as sha256=$ah"};if($rh-cne'04f27f865c5bc47065fad13a3b343a66ee595a8cf48f732ce916374181e3f142'){throw "candidate report hard pin drift sha256=$rh"};if($ah-cne$env:ADDON_HASH-or$as-ne[int64]$env:ADDON_SIZE-or$rh-cne$env:REPORT_HASH){throw 'candidate deterministic rebuild drift'}
          Write-Host "CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_DETERMINISTIC_PASS addon_size=$as addon_sha256=$ah report_sha256=$rh"

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='2f2f596bb8a86c0b074543992f7634be858821a4';foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/addon-manager.ps1','bin/spotify-control.ps1','validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}};if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_parent=$p;router_head='2f2f596bb8a86c0b074543992f7634be858821a4';router_blob='4225bb042aa8d240706e1f383e54f12894e74512';candidate_addon_size=1325619;candidate_addon_sha256='e7f3ba6bc03cc4ff118f098778fe5ac7f308f1a99ecdc4149131ed2a8156579a';candidate_report_sha256='04f27f865c5bc47065fad13a3b343a66ee595a8cf48f732ce916374181e3f142';preexisting_parent_functions_changed=0;router_preexisting_callers=0;candidate_reduces_exactly_to_parent=$true;pipeline_true_assignment_count=1;pipeline_true_assignment_inherited_selftest_only=$true;addon_selftest_passed=$true;pipeline_enabled=$false;pipeline_enablement_implemented=$false;routing_normal_path_wiring_added=$false;router_execution_added=$false;production_main_changed=$false;provisional_hash_discovery=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_HARD_DISABLED_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-routing-hard-disabled-integration-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py
            validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/candidate-validation.json
            validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/ci-evidence.json
          if-no-files-found: error
