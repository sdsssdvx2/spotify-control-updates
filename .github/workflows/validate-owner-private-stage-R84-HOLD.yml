name: HOLD R84 real Windows PS5.1 protected private staging, no install
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-owner-private-stage-R84-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/stage-immutable-review-native-R84-HOLD.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-owner-only-no-install:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify real 21 chunks, stage only owner-private release candidate, assert no install
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/stage-immutable-review-native-R84-HOLD.ps1'
          $blob=(git hash-object -- $script).Trim()
          if ($blob -cnotmatch '^[0-9a-f]{40}$') { throw 'R84_SOURCE_NOT_GIT_BLOB' }
          $results=@(& $script -StageOwnerCandidate)
          $results | ForEach-Object {Write-Output $_}
          if ($results -cnotcontains 'R84_RESULT=PRIVATE_CANDIDATE_STAGED_NOT_INSTALLED' -or
              $results -cnotcontains 'R84_OWNER_PRIVATE_STAGE=SHA256_READBACK_AND_PROTECTED_DACL_PASS' -or
              $results -cnotcontains 'R83_REMOTE_IMMUTABLE_21_OF_21_CHUNKS=PASS' -or
              $results -cnotcontains 'R84_OWNER_STAGED_IMMUTABLE_CHUNKS_21_OF_21=PASS' -or
              $results -cnotcontains 'OPERATING_SPOTIFY_SPICETIFY_USER_STATE=UNCHANGED'){
            throw 'R84_STAGE_NOT_SUCCESSFUL'
          }
          $ids=@($results | Where-Object {$_ -cmatch '^R84_OWNER_PRIVATE_STAGE_ID=[0-9a-f]{32}$'})
          if ($ids.Count -ne 1){throw 'R84_READY_ID_UNAVAILABLE'}
          $id=([string]$ids[0]).Substring('R84_OWNER_PRIVATE_STAGE_ID='.Length)
          $stage=Join-Path $env:LOCALAPPDATA ('SpotifyControlCanary-ready-'+$id)
          $folder=Get-Item -LiteralPath $stage -Force -ErrorAction Stop
          if (-not $folder.PSIsContainer -or ($folder.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){
            throw 'R84_READY_NOT_REAL_DIRECTORY'
          }
          $acl=Get-Acl -LiteralPath $stage
          if (-not $acl.AreAccessRulesProtected -or
              $acl.Owner -notmatch [regex]::Escape([Security.Principal.WindowsIdentity]::GetCurrent().Name)){
            throw 'R84_READY_ACL_OWNER_UNVERIFIED'
          }
          $expected=@{
            'manifest.json'='71395858fcce58500bb42070bf4b248e2ab14613e148e7d74e616c252d6c3332'
            'spotify-control.ps1'='b2b2fbf1afb60b58d501312160f7e2437c2452e90cb61ca8c2be0d877f92232d'
            'spotify-control-agent.vbs'='e56609ed8927512595f55c01ea50dbb9c8c59e4a2c86dcb3d16195a565c604d5'
          }
          foreach ($n in @($expected.Keys)) {
            $got=(Get-FileHash -LiteralPath (Join-Path $stage $n) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -cne $expected[$n]) {throw 'R84_STAGED_FILE_BYTES_NOT_PINNED'}
          }
          $receipt=Get-Content -LiteralPath (Join-Path $stage 'stage-attestation.json') -Raw | ConvertFrom-Json
          if ($receipt.schema -cne 'SPOTIFY_R84_OWNER_FIRST_STAGED_CANDIDATE_V1' -or
              $receipt.state -cne 'UNAPPROVED_UNINSTALLED_NO_DEPLOY_AUTHORITY' -or
              [int]$receipt.chunk_count -ne 21) {
            throw 'R84_STAGED_RECEIPT_NOT_HELD'
          }
          $names=@(Get-ChildItem -LiteralPath $stage -Force | Select-Object -ExpandProperty Name | Sort-Object)
          $must=@($expected.Keys)+@('stage-attestation.json','packages')
          $manifest=Get-Content -LiteralPath (Join-Path $stage 'manifest.json') -Raw | ConvertFrom-Json
          $edge=@($manifest.updates)[18]
          $count=0
          foreach($patch in @($edge.patches)){
            foreach($ch in @($patch.chunks)){
              $rel=[string]$ch.path
              if($rel -cnotmatch '^packages/v0[.]6[.]30/(main-v0628-to-v0630|resident-v011-to-v012)/chunk-[0-9]{3}[.]txt$') {
                throw 'R84_CHUNK_PATH_NOT_PINNED'
              }
              $p=Join-Path $stage ($rel.Replace('/','\'))
              $f=Get-Item -LiteralPath $p -Force -ErrorAction Stop
              if($f.PSIsContainer -or ($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  $f.Length -ne [long]$ch.size -or
                  (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$ch.sha256){
                throw 'R84_CHUNK_MIRROR_NOT_VERIFIED'
              }
              $count++
            }
          }
          if($count -ne 21 -or
              @(Get-ChildItem -LiteralPath (Join-Path $stage 'packages') -File -Recurse).Count -ne 21){
            throw 'R84_CHUNK_MIRROR_COUNT_UNEXPECTED'
          }
          if (@(Compare-Object $names $must).Count -ne 0){throw 'R84_STAGE_EXTRA_OR_MISSING_FILES'}
          Write-Output 'R84_REAL_WINDOWS_OWNER_PRIVATE_STAGING=PASS'
          Write-Output 'R84_USER_ORIGINAL_DATA_INSTALL_PROCESS_CHANGE=NO'
          Write-Output 'R84_ACTUAL_USER_MACHINE_ADMISSION=NOT_TESTED'
