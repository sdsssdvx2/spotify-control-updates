name: V054 real official Spicetify source-bound route candidate, rollback (HOLD)
on:
  push:
    branches: [validate/official-native-candidate-binding-v054-HOLD]
    paths:
      - 'validation/normal-engine-shared-turnstile/official-route-byte-binding-v054.ps1'
      - 'validation/normal-engine-shared-turnstile/hosted-cutover-rollback-v052.ps1'
      - 'validation/normal-engine-shared-turnstile/test-hosted-cutover-rollback-v052.ps1'
      - '.github/workflows/validate-official-vendor-candidate-v054.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pinned-vendor-exec-and-verified-old-source-recovery:
    runs-on: windows-2025
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Keep production main and V053 parent unchanged; validate exact four file scope and PS51
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='36a1ca2c4d5d7919b555c63b679c5cb3ce8c2b0a'
          $main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             (git merge-base $base HEAD).Trim() -cne $base){throw 'V054_PARENT_WRONG'}
          if((git rev-parse origin/main).Trim() -cne $main){throw 'V054_MAIN_DRIFT'}
          $allowed=@(
            'validation/normal-engine-shared-turnstile/official-route-byte-binding-v054.ps1',
            'validation/normal-engine-shared-turnstile/hosted-cutover-rollback-v052.ps1',
            'validation/normal-engine-shared-turnstile/test-hosted-cutover-rollback-v052.ps1',
            '.github/workflows/validate-official-vendor-candidate-v054.yml')
          $changes=@(git diff --name-only "$base...HEAD")
          if($changes.Count -ne $allowed.Count -or
             @($changes|Where-Object{$_ -notin $allowed}).Count -ne 0){
            throw ('V054_UNAPPROVED_SOURCE_DIFF '+($changes -join ','))
          }
          foreach($p in @($allowed|Where-Object{$_ -like '*.ps1'})){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('V054_PARSE_FAILED_'+$p+'_'+$errors[0].Message)}
          }
          $verifier=Get-Content $allowed[0] -Raw
          foreach($deny in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process',
            '[IO.File]::Write','[IO.File]::Delete','[IO.Directory]::Move','Remove-Item')){
            if($verifier.Contains($deny)){throw ('V054_BYTE_PROOF_NOT_READ_ONLY_'+$deny)}
          }
          foreach($s in @('Test-CustomAppV054OfficialSourceBoundRoutes',
            'V054_VENDOR_ROUTE_JS_NOT_SOURCE_DERIVED',
            'V054_VENDOR_ROUTE_CSS_NOT_SOURCE_DERIVED',
            'V054_VENDOR_ROUTE_MANIFEST_NOT_SOURCE_DERIVED')){
            if(-not$verifier.Contains($s)){throw ('V054_BYTE_COMPARATOR_INCOMPLETE_'+$s)}
          }
          if(@(Get-Process -Name Spotify -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'V054_UNEXPECTED_SPOTIFY_ON_RUNNER'
          }
          Write-Host 'V054_EXACT_PARENT_MAIN_STATIC_READONLY_VERIFIER_AND_PS51_PASS'
      - name: Acquire pinned official stable Spicetify 2.46.4 Windows executable, no install
        shell: powershell
        timeout-minutes: 7
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'v054-official-vendor'
          [IO.Directory]::CreateDirectory($root)|Out-Null
          $archive=Join-Path $root 'official.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/spicetify/cli/releases/download/v2.46.4/spicetify-2.46.4-windows-x64.zip' -OutFile $archive
          if((Get-Item $archive).Length -ne 7795758 -or
             (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                '0490380bf59e00c94cf6cb12bfac5152791b91bb8009aceef53c49815b45a56f'){
             throw 'V054_OFFICIAL_RELEASE_ZIP_HASH_OR_SIZE_CHANGED'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead($archive)
          try{
            $expanded=[int64]0
            foreach($entry in $zip.Entries){
              $rel=([string]$entry.FullName).Replace('/','\')
              if([string]::IsNullOrWhiteSpace($rel) -or
                 [IO.Path]::IsPathRooted($rel) -or $rel.StartsWith('\') -or
                 $rel.Contains(':') -or $rel.Contains('..\')){
                 throw 'V054_UNSAFE_OFFICIAL_ZIP_PATH'
              }
              $expanded+=[int64]$entry.Length
              if($expanded -gt 104857600){throw 'V054_OFFICIAL_ZIP_EXPANSION_CAP'}
            }
          }finally{$zip.Dispose()}
          $dest=Join-Path $root 'extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -ErrorAction Stop
          $exe=@(Get-ChildItem -LiteralPath $dest -Filter 'spicetify.exe' -File -Recurse)
          if($exe.Count -ne 1 -or
             (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
            throw 'V054_OFFICIAL_EXE_PIN_MISMATCH'
          }
          "V054_OFFICIAL_EXE=$($exe[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
          Write-Host 'V054_PINNED_OFFICIAL_VENDOR_ARTIFACT_VALID_PASS'
      - name: Execute official CLI against isolated latest candidate, prove source-byte match and V052/V053 crash recovery
        shell: powershell
        timeout-minutes: 9
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v054-targeted-native-source.log'
          $ErrorActionPreference='Continue'
          $env:V054_CI_DIAGNOSTIC='1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/normal-engine-shared-turnstile/test-hosted-cutover-rollback-v052.ps1' -OfficialExecutable $env:V054_OFFICIAL_EXE *>&1 |
             Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($rc -ne 0){
            Get-Content $log -Tail 75|ForEach-Object{Write-Host $_}
            throw ('V054_INTEGRATION_FAILED_'+$rc)
          }
          $text=Get-Content $log -Raw
          foreach($marker in @(
            'V054_REAL_PINNED_OFFICIAL_SPICETIFY_2464_RENDERED_NEW_APP_SOURCE_EXACT_PASS',
            'V054_ALLOWED_NAME_FORGED_JS_DENIED_BEFORE_SEALED_INTENT_PASS',
            'V053_V044_SIX_DECLARED_OUTPUTS_AND_610_FOREIGN_XPUI_MEMBERS_PRESERVED_PASS',
            'V053_FOREIGN_XPUI_AND_SOURCE_COPIED_EXTENSION_MODIFICATION_BLOCKED_BEFORE_SEAL_PASS',
            'V053_NATIVE_MANIFEST_SOURCE_AND_OUTPUT_SCOPE_PINNED_IN_DPAPI_INTENT_PASS',
            'V053_BEFORE_APPLY_PRIVATE_ESCROW_CIPHERTEXT_TAMPER_DENIED_PASS',
            'V053_POSTSEAL_STAGING_DRIFT_BLOCKED_WITH_SAME_OS_LEASE_PASS',
            'V052_SEALED_TRANSACTION_INTENT_TAMPER_REFUSED_PASS',
            'V052_SIMULATED_VENDOR_CHANGE_AND_V046_PRECHANGE_ADMISSION_REJECTED_PASS',
            'V052_UNEXPECTED_FOREIGN_XPUI_DRIFT_FAIL_CLOSED_NO_WRITES_PASS',
            'V052_AFTER_APP_QUARANTINE_CRASH_RETURNS_WITH_OLD_PREIMAGE_RETAINED_PASS',
            'V052_FRESH_PROCESS_LOCKED_ROLLBACK_BOTH_TREES_EXACT_AND_QUARANTINED_PASS',
            'V052_TERMINAL_FULL_CIPHERTEXT_TAMPER_REJECTED_PASS',
            'V052_RESTART_IDEMPOTENT_NO_PROTECTED_UNMANAGED_OR_BACKUP_CHANGES_PASS',
            'V052_HOSTED_ONLY_COMPOSITE_CUTOVER_RECOVERY_NO_REAL_SPOTIFY_MUTATION_PASS')){
            if(-not$text.Contains($marker)){throw ('V054_MISSING_ACCEPTANCE_PROOF_'+$marker)}
          }
          Write-Host 'V054_REAL_VENDOR_NEW_SOURCE_TO_EXACT_NATIVE_CANDIDATE_AND_610_FOREIGN_PRESERVED_PASS'
          Write-Host 'V054_INTEGRATED_SEALED_DPAPI_CRASH_ROLLBACK_VERIFIED_PASS'
      - name: Prove original main remains unchanged
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'V054_FINAL_MAIN_CHANGED'
          }
          Write-Host 'V054_NO_REAL_SPOTIFY_NO_MAIN_MERGE_NO_INSTALL_NO_NEW_PRODUCTION_AUTHORITY_PASS'
