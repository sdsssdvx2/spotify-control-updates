name: Validate Custom App Remote Source Contract v0.1.0

on:
  push:
    branches:
      - validate/custom-app-remote-source-contract-v0.1.0
    paths:
      - 'validation/custom-app-remote-source-contract-v0.1.0/**'
      - '.github/workflows/validate-custom-app-remote-source-contract-v010.yml'
  pull_request:
    branches:
      - validate/custom-app-provenance-integrated-observer-v0.3.0
    paths:
      - 'validation/custom-app-remote-source-contract-v0.1.0/**'
      - '.github/workflows/validate-custom-app-remote-source-contract-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact validation-only scope and observer-parent lineage
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='27aa2f2089e99d6354d5e724577cdd7687d36525'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Remote-source contract is not descended from exact validated observer head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-remote-source-contract-v010.yml',
            'validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1',
            'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Remote-source validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected validation file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during remote-source validation.'}
          if((git rev-parse '27aa2f2089e99d6354d5e724577cdd7687d36525:validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py').Trim() -cne 'ef94a51510de3f922659e633c86dbd44f3083a3d'){throw 'Validated observer builder blob drift.'}
          Write-Host "CUSTOM_APP_REMOTE_SOURCE_SCOPE_PASS head=$actual"

      - name: Pin official Spicetify Custom App runtime layout contract
        shell: powershell
        run: |
          $repo=Join-Path $env:RUNNER_TEMP 'spicetify-docs';git init -q $repo;git -C $repo remote add origin https://github.com/spicetify/docs.git
          git -C $repo fetch -q --depth=1 origin d38162a3de28a8c0042e9a6b85432647d63d5394
          if($LASTEXITCODE -ne 0){throw 'Could not fetch pinned Spicetify docs.'}
          git -C $repo checkout -q FETCH_HEAD
          if((git -C $repo rev-parse HEAD).Trim() -cne 'd38162a3de28a8c0042e9a6b85432647d63d5394'){throw 'Pinned Spicetify docs checkout drift.'}
          $blob=(git -C $repo rev-parse 'HEAD:docs/customization/custom-apps.md').Trim()
          if($blob -cne 'ae9629b0f81f0ed80593493f705037c3f64e60b6'){throw "Pinned Custom App docs blob drift: $blob"}
          $docs=Get-Content -LiteralPath (Join-Path $repo 'docs/customization/custom-apps.md') -Raw
          foreach($marker in @('must contain at minimum `index.js` and `manifest.json`','%appdata%\spicetify\CustomApps\','spicetify config custom_apps <folder-name>')){if($docs.IndexOf($marker,[StringComparison]::Ordinal) -lt 0){throw "Pinned Custom App runtime contract marker missing: $marker"}}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_SPICETIFY_LAYOUT_PIN_PASS'

      - name: Prove exact contract and acceptance-matrix blobs
        shell: powershell
        run: |
          $core=(git rev-parse 'HEAD:validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1').Trim()
          $test=(git rev-parse 'HEAD:validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1').Trim()
          if($core -cne 'f8c91f5a566b24c82257742942bdc6fecfe68eb2'){throw "Remote-source core blob drift: $core"}
          if($test -cne '346355bcbbba6066b70a965028bb11f946b4da99'){throw "Remote-source test blob drift: $test"}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_BLOB_PIN_PASS'

      - name: Parse contract and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1',
            'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file :: $($_.Message)"};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_PS51_PARSE_PASS'

      - name: Run 41-case remote-source acceptance matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1'
          if($LASTEXITCODE -ne 0){throw 'Remote-source contract acceptance matrix failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_MATRIX_PASS'

      - name: Audit contract as pure observer-only decision code
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1' -Raw
          foreach($forbidden in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','Copy-Item','Move-Item','Remove-Item','Set-Content','Out-File','Add-Content','New-Item','spicetify apply','spicetify config','git clone','git fetch','git checkout')){
            if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Remote-source contract gained forbidden side effect/network primitive: $forbidden"}
          }
          foreach($required in @(
            "managed_by='custom-app-provenance-v1'","managed_by='custom-app-remote-source-v1'","mutation_mode='deny'",'auto_update_authorized=$false','auto_install_authorized=$false',
            "'repo-commit-root','release-asset'",'github-numeric-repository-id-changed','initial-content-match-required','source-change-blocked',
            'path-backslash-denied','path-dot-or-empty-segment','path-ads-or-colon','path-windows-reserved-name','case-insensitive-duplicate-path',
            'root-index-js-missing','root-manifest-json-missing','remote-surface-requires-build','release-asset-continuity-drift','local-tree-drift'
          )){if($core.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Remote-source safety marker missing: $required"}}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_PURE_OBSERVER_AUDIT_PASS'

      - name: Rebuild exact validated observer parent and rerun full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py' --build
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent rebuild failed.'}
          $addon='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/addon-manager.ps1';$main='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/spotify-control.ps1'
          $as=(Get-Item $addon).Length;$ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();$ms=(Get-Item $main).Length;$mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant()
          if($as -ne 428643 -or $ah -cne '8de197a78e40faad6e934c0eef4bb123f6652fc6e35cf440733c813c6df86e52'){throw "Observer parent Addon Manager drift: $as/$ah"}
          if($ms -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Observer parent Spotify Control drift: $ms/$mh"}
          $root=Join-Path $env:RUNNER_TEMP 'remote-source-parent-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_PARENT_REBUILD_SELFTEST_PASS'

      - name: Prove production and observer parent remain immutable
        shell: powershell
        run: |
          $parent='27aa2f2089e99d6354d5e724577cdd7687d36525';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@('.github/workflows/validate-custom-app-remote-source-contract-v010.yml','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1')
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected committed changed surface: $($bad -join ', ')"}
          foreach($path in @('bin/spotify-control.ps1','bin/addon-manager.ps1','manifest.json','stable-version.json','validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py','.github/workflows/validate-custom-app-provenance-integrated-observer-v030.yml')){
            git diff --quiet $parent HEAD -- $path
            if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_IMMUTABILITY_PASS'

      - name: Upload remote-source contract validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-remote-source-contract-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1
            validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1
