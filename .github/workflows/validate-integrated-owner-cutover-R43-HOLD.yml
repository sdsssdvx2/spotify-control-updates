name: HOLD R43 actual Windows owner resident cutover for integrated exit and safe shortcuts
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-integrated-owner-cutover-R43-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/reuse-integrated-owner-cutover-R43-HOLD.py
permissions:
  contents: read
  actions: read
jobs:
  one-integrated-owner-cutover:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recreate exact combined R37 and R38 accepted payload, no publication
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'R43_PRODUCTION_MAIN_SOURCE_CHANGED'
          }
          python validation/spotify-exit-immediate-maintenance-HOLD/build-combined-exit-and-shortcut-R37-HOLD.py
          if($LASTEXITCODE -ne 0){throw 'R43_MERGED_SOURCE_REBUILD_FAILED'}
          python validation/spotify-exit-immediate-maintenance-HOLD/stage-combined-official-transport-R38-HOLD.py
          if($LASTEXITCODE -ne 0){throw 'R43_INTEGRATED_FULL_FILE_STAGE_FAILED'}
          $stage='validation/spotify-exit-immediate-maintenance-HOLD/out/release-staging-combined'
          $m=(Get-FileHash -LiteralPath (Join-Path $stage 'bin/spotify-control.ps1') -Algorithm SHA256).Hash.ToLowerInvariant()
          $a=(Get-FileHash -LiteralPath (Join-Path $stage 'bin/spotify-control-agent.vbs') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($m -cne '7caf4afe19c283aef3b5bebb30e0e598b10de147d3ab1ddd9724bf90594c59fe' -or
             $a -cne 'da054351cae6927504e735426d35f6d5e7edafcac7e06881f1adf1c20cecab9d'){
            throw 'R43_R38_COMBINED_SOURCE_SHA_UNEXPECTED'
          }
          Write-Host 'R43_EXACT_FUNCTIONAL_INTEGRATED_PAYLOAD_REPRODUCED_PASS'
      - name: Retrieve official Bootstrap 1.0.6 original bytes with SHA pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' \
            > "$RUNNER_TEMP/spotify-r43-bootstrap-carrier.zip"
          python - <<'PY'
          from pathlib import Path
          import hashlib,io,os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'spotify-r43-bootstrap-carrier.zip') as outer:
              inner=outer.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          with zipfile.ZipFile(io.BytesIO(inner)) as nested:
              raw=nested.read('bootstrap/spotify-control-self-updater.ps1')
          assert (len(raw),hashlib.sha256(raw).hexdigest()) == (
              42963,'d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6')
          (root/'spotify-verified-bootstrap-v106.ps1').write_bytes(raw)
          print('R43_RELEASED_OFFICIAL_BOOTSTRAP_SHA256_VERIFIED')
          PY
          rm -f "$RUNNER_TEMP/spotify-r43-bootstrap-carrier.zip"
      - name: Reuse pinned R28 owner lifecycle test against integrated R38 manifest only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python validation/spotify-exit-immediate-maintenance-HOLD/reuse-integrated-owner-cutover-R43-HOLD.py
          if($LASTEXITCODE -ne 0){throw 'R43_PINNED_R28_HOSTED_SCRIPT_REUSE_FAILED'}
          $script=Join-Path $env:RUNNER_TEMP 'spotify-r43-integrated-real-owner-cutover.ps1'
          $prep=Join-Path $env:RUNNER_TEMP 'spotify-r43-integrated-prepare.py'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            $script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R43_NATIVE_POWERSHELL_51_REUSED_SCENARIO_INVALID'}
          python -m py_compile $prep
          if($LASTEXITCODE -ne 0){throw 'R43_HOSTED_PREPARE_SCRIPT_INVALID'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script
          if($LASTEXITCODE -ne 0){throw 'R43_INTEGRATED_HOSTED_R28_REAL_OWNER_UPGRADE_FAILED'}
          $baseline=(git show 'origin/main:manifest.json' | Out-String)
          if($LASTEXITCODE -ne 0 -or
             (git diff --exit-code origin/main -- manifest.json) -or
             $LASTEXITCODE -ne 0){
            throw 'R43_PUBLIC_MAIN_MANIFEST_NOT_PRESERVED'
          }
          Write-Host 'R43_REAL_R28_OWNER_CUTOVER_AND_INTEGRATED_BOOTSTRAP_UPDATE_PASS'
          Write-Host 'R43_OPERATING_SPOTIFY_AND_PRODUCTION_MAIN_UNTOUCHED_PASS'
