name: Prepare Spotify Control v0.6.22 Release Candidate

on:
  push:
    branches:
      - release/v0.6.22-addon-source-registry-r11
    paths:
      - 'validation/v0.6.22/**'
      - '.github/workflows/prepare-v0.6.22-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v0.6.22-addon-source-registry-r11

      - name: Assert exact production base and release scope
        shell: powershell
        run: |
          $base='dacd4faf6a632b6b33571acf16ed4b6e73a865d7'
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'v0.6.22 release branch is not based on exact stable v0.6.21 main.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.21'){throw "Expected v0.6.21 stable base, got $($m.latest_version)"}
          $main=@($m.latest_files|Where-Object path -eq 'bin/spotify-control.ps1');$addon=@($m.latest_files|Where-Object path -eq 'bin/addon-manager.ps1');$agent=@($m.latest_files|Where-Object path -eq 'bin/spotify-control-agent.vbs')
          if($main.Count -ne 1 -or [int64]$main[0].size -ne 281579 -or $main[0].sha256 -ne 'f97c78c905b83e90e58a24035febcaccc27cb12113ae9cbc64acdc79f5853828'){throw 'v0.6.21 main base mismatch.'}
          if($addon.Count -ne 1 -or [int64]$addon[0].size -ne 250616 -or $addon[0].sha256 -ne '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2'){throw 'r10 base mismatch.'}
          if($agent.Count -ne 1 -or [int64]$agent[0].size -ne 4855 -or $agent[0].sha256 -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278'){throw 'Resident agent base mismatch.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 trust pin changed.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{
            $_ -notlike 'validation/v0.6.22/*' -and
            $_ -ne '.github/workflows/prepare-v0.6.22-release.yml'
          })
          if($bad.Count){throw "Unexpected pre-transport release files: $($bad -join ', ')"}
          Write-Host "V0622_BASE_AND_SCOPE_PASS head=$((git rev-parse HEAD).Trim())"

      - name: Parse release sources
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.22/build_v0622.py validation/v0.6.22/audit_r11.py validation/v0.6.22/release_transport.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 Python source failed compile.'}
          foreach($file in @('validation/v0.6.22/test_r11_source_adapter.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PowerShell parser failed: $file"}
          }
          $engine=Get-Content validation/v0.6.22/addon_source_adapter_engine.ps1.inc -Raw
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseInput($engine,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Source adapter engine PowerShell parse failed.'}
          Write-Host 'V0622_RELEASE_SOURCE_PARSE_PASS'

      - name: Rebuild exact validated r11 candidate
        shell: powershell
        run: |
          python validation/v0.6.22/build_v0622.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 candidate build failed.'}
          $main='validation/v0.6.22/out/bin/spotify-control.ps1';$addon='validation/v0.6.22/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 281586 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b5ba4dc98b10ea922ce30401b5cddf5a1ab01171366e09b3546ce3cc6fcd80fe'){throw 'Validated v0.6.22 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 268670 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0ee8d30bf7c2fda9d0d8d112b7191b0d0439a1071d284d0cc04a87fe8937c7bc'){throw 'Validated r11 identity mismatch.'}
          $report='validation/v0.6.22/candidate-validation.json'
          if((Get-FileHash $report -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ffa767a7bedbe097c314a5cae1b362f8e31cf866e60167d925760bd502606297'){throw 'Validated deterministic candidate report drift.'}
          foreach($file in @($main,$addon)){$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "Generated candidate parse failed: $file"}}
          Write-Host 'V0622_EXACT_VALIDATED_CANDIDATE_PASS'

      - name: Re-run r11 structural and source-adapter safety tests
        shell: powershell
        run: |
          python validation/v0.6.22/audit_r11.py
          if($LASTEXITCODE -ne 0){throw 'r11 structural audit failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22/test_r11_source_adapter.ps1
          if($LASTEXITCODE -ne 0){throw 'r11 source-adapter fixtures failed.'}
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22/out/bin/addon-manager.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'r11 candidate Addon Manager SelfTest failed.'}
          Write-Host 'V0622_R11_SAFETY_PASS'

      - name: Build deterministic v0.6.22 transports
        shell: powershell
        run: |
          python validation/v0.6.22/release_transport.py --build-packages
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 transport build failed.'}
          if(-not(Test-Path packages/v0.6.22/main-v0621-to-v0622/chunk-000.txt)){throw 'Main transport missing.'}
          if(-not(Test-Path packages/v0.6.22/addon-v065r10-to-v065r11/chunk-000.txt)){throw 'Addon transport missing.'}
          Write-Host 'V0622_TRANSPORT_BUILD_PASS'

      - name: Commit immutable v0.6.22 transport source
        id: source
        shell: powershell
        run: |
          if(git ls-files 'validation/v0.6.22/out/**'){throw 'Raw generated v0.6.22 candidates must not be tracked.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/v0.6.22 validation/v0.6.22/release-metadata.json
          if(git diff --cached --quiet){throw 'Expected new immutable v0.6.22 transport files.'}
          git commit -m 'Build v0.6.22 Addon Source Registry r11 transports'
          $source=(git rev-parse HEAD).Trim()
          if($source -notmatch '^[0-9a-f]{40}$'){throw "Invalid transport source commit: $source"}
          "source_commit=$source"|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "V0622_TRANSPORT_SOURCE=$source"

      - name: Publish and validate v0.6.22 manifest
        shell: powershell
        run: |
          $source='${{ steps.source.outputs.source_commit }}'
          python validation/v0.6.22/release_transport.py --write-manifest --source-commit $source
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 manifest write failed.'}
          python validation/v0.6.22/release_transport.py --validate-published
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 published transport validation failed.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.22'){throw 'Manifest latest version mismatch.'}
          if($m.source_commit -ne $source){throw 'Manifest source commit mismatch.'}
          Write-Host "V0622_PUBLISHED_MANIFEST_PASS payload=$($m.payload_set_sha256)"

      - name: Commit and push prepared release branch
        shell: powershell
        run: |
          git add manifest.json
          if(git diff --cached --quiet){throw 'Expected v0.6.22 manifest publication change.'}
          git commit -m 'Publish Spotify Control v0.6.22 Addon Source Registry r11'
          git push origin HEAD:release/v0.6.22-addon-source-registry-r11
          Write-Host "V0622_PREPARE_AND_PUSH_PASS head=$((git rev-parse HEAD).Trim())"
