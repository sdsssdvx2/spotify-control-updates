name: Validate Current Spicetify Updater Discovery v0.1.0

on:
  push:
    branches:
      - validate/spicetify-updater-current-v0.1.0
    paths:
      - 'validation/spicetify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spicetify-updater-current-v010.yml'
  pull_request:
    paths:
      - 'validation/spicetify-updater-current-v0.1.0/**'
      - '.github/workflows/validate-spicetify-updater-current-v010.yml'

permissions:
  contents: read

jobs:
  discover-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove validation-only exact-head scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Wrong production merge base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@('validation/spicetify-updater-current-v0.1.0/audit.py','.github/workflows/validate-spicetify-updater-current-v010.yml')
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 2){throw "Expected exactly 2 validation-only files; got $($changed.Count): $($changed -join ', ')"}
          Write-Host "SPICETIFY_UPDATER_DISCOVERY_SCOPE_PASS head=$actual"

      - name: Compile discovery audit
        shell: powershell
        run: |
          python -m py_compile validation/spicetify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw 'Discovery audit failed Python compile.'}

      - name: Reconstruct exact production and discover updater path
        shell: powershell
        run: |
          python validation/spicetify-updater-current-v0.1.0/audit.py
          if($LASTEXITCODE -ne 0){throw "Discovery audit failed: $LASTEXITCODE"}

      - name: Validate discovery report
        shell: powershell
        run: |
          $r=Get-Content spicetify-updater-current-audit.json -Raw | ConvertFrom-Json
          if($r.result -ne 'DISCOVERY_PASS'){throw "Unexpected report result $($r.result)"}
          if($r.validation_head -ne (git rev-parse HEAD).Trim()){throw 'Report head mismatch.'}
          if($r.production_main.sha256 -ne 'e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18'){throw 'Production main identity mismatch.'}
          if($r.production_addon.sha256 -ne '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86'){throw 'Production addon identity mismatch.'}
          if([string]::IsNullOrWhiteSpace([string]$r.current_latest_release.tag_name)){throw 'No current Spicetify latest release returned.'}
          $x64=@($r.current_latest_release.assets|Where-Object{$_.name -like '*windows-x64*'})
          if($x64.Count -ne 1){throw "Expected exactly one Windows x64 asset, got $($x64.Count)"}
          if([string]::IsNullOrWhiteSpace([string]$x64[0].digest)){throw 'Current Windows x64 asset has no release digest metadata.'}
          Write-Host ("SPICETIFY_UPDATER_DISCOVERY_REPORT_PASS latest={0} functions={1} lines={2} urls={3}" -f $r.current_latest_release.tag_name,@($r.candidate_updater_functions).Count,@($r.spicetify_related_lines).Count,@($r.production_spicetify_urls).Count)

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Spicetify-Updater-Discovery-v0.1.0
          path: spicetify-updater-current-audit.json
          if-no-files-found: error
          retention-days: 14
