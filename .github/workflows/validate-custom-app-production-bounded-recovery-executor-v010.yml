name: Validate Custom App Production Bounded Recovery Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-bounded-recovery-executor-v0.1.0]
    paths: ['validation/custom-app-production-bounded-recovery-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-bounded-recovery-executor-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-evidence-admission-integration-v0.1.0]
    paths: ['validation/custom-app-production-bounded-recovery-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-bounded-recovery-executor-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"}

      - name: Prove scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='5232e5adeb13e6942acb210b3cd13058e1eaaf05';if((git merge-base $p HEAD).Trim()-cne$p){throw 'wrong integration parent'}
          $a=@('.github/workflows/validate-custom-app-production-bounded-recovery-executor-v010.yml','validation/custom-app-production-bounded-recovery-executor-v0.1.0/custom-app-production-bounded-recovery-executor.ps1','validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1');$c=@(git diff --name-only "$p...HEAD");$bad=@($c|?{$_-notin$a});if($bad.Count){throw "scope escaped $($bad-join', ')"};foreach($x in $a){if($x-notin$c){throw "missing $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_SCOPE_PASS'

      - name: Prove exact immutable pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-bounded-recovery-executor-v0.1.0/custom-app-production-bounded-recovery-executor.ps1','e580daa3b2f1f506131bc59e0e8969a36bc30441'),
            @($h,'validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1','32e37e8b14c68af74daa36d5991661cf6e793fa6'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/test_custom_app_production_recovery_evidence_admission_integration.ps1','453be9908425716094172db98cd3ce9740999562'),
            @('574fe182168271fa3497d58e269e9af1f60d9033','validation/custom-app-production-atomic-live-swap-v0.1.0/custom-app-production-atomic-live-swap.ps1','e91fa6a125f77352907c1119f6d9f47be9682550'),
            @('fe07d410531ea13c8fca379b01405631a3763e84','validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a'),
            @('67458cbb96b5d1ed92e26c2b81debd6894044749','validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1','3b14280d727287252f71611e4424d78e5705c2f1'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('b266bad660d4b7bc87e7093c5b12f0cff1dc466f','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-preflight-v0.1.0/custom-app-production-recovery-preflight.ps1','b1816a24849a559b4da2537aa1b2436124fbee50'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-execution-admission-v0.1.0/custom-app-production-recovery-execution-admission.ps1','e8804a7c53ad0d3e5420e037d468d9c397e52529'))
          foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b-cne$p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_PINS_PASS'

      - name: Parse PS5.1 and audit bounded side-effect surface
        shell: powershell
        run: |
          $d='validation/custom-app-production-bounded-recovery-executor-v0.1.0';foreach($f in @("$d/custom-app-production-bounded-recovery-executor.ps1","$d/test_custom_app_production_bounded_recovery_executor.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-bounded-recovery-executor.ps1" -Raw
          foreach($m in @('Resolve-CustomAppProductionRecoveryEvidenceAdmissionIntegrationV010','Append-CustomAppProductionCrashJournalPhaseV010','Restore-CustomAppProductionAtomicLiveSwapV010','Open-CustomAppProductionSpicetifyExecutableV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010','Resolve-CustomAppProductionBoundedRecoveryCleanupResumeGateV010','rollback-required','cleanup-starting','fixture_only_contract=$true','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "marker missing $m"}}
          foreach($x in @('[IO.Directory]::Delete','[IO.Directory]::Move','[IO.File]::Copy','[IO.File]::Write','Remove-Item','Move-Item','Copy-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Invoke-CustomAppProductionPostApplyCommitCleanupV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "direct/unbounded side effect $x"}}
          if($core-match'result_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_bounded_recovery_executor.ps1" -Raw;foreach($m in @('candidate rollback','future app rollback','wrong executable hash accepted','tampered recovery evidence executed','rollback CAS race returned success','restore fault returned success','recovery apply failure returned success','apply-verified housekeeping','resume stage','resume app','resume persistence','unexpected stage child deleted','cleanup resume accepted live drift','cleanup resume accepted protected persistence drift','commit CAS race returned success','authority-tampered recovery result accepted')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_PARSE_AUDIT_PASS'

      - name: Materialize exact sibling validation dependencies
        shell: powershell
        run: |
          $deps=@(
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'))
          foreach($d in $deps){$p=$d[1];New-Item -ItemType Directory -Force -Path(Split-Path $p -Parent)|Out-Null;$env:S="$($d[0])`:$p";$env:O=$p;python -c "import os,subprocess,pathlib;pathlib.Path(os.environ['O']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['S']]))";if($LASTEXITCODE){throw "materialize failed $p"};if((git hash-object $p).Trim()-cne$d[2]){throw "materialized blob drift $p"}}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_MATERIALIZATION_PASS'

      - name: Run bounded recovery executor matrix twice
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1';if($LASTEXITCODE){throw "matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_MATRIX_REPEAT_PASS'

      - name: Replay exact parent and primitive matrices
        shell: powershell
        run: |
          foreach($f in @('validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/test_custom_app_production_recovery_evidence_admission_integration.ps1','validation/custom-app-production-spicetify-apply-executor-v0.1.0/test_custom_app_production_spicetify_apply_executor.ps1','validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/test_custom_app_production_post_apply_commit_cleanup.ps1')){& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $f;if($LASTEXITCODE){throw "parent regression failed $f"}}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_PARENT_REPLAY_PASS'

      - name: Rebuild journal-integrated candidate and run Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py';if($LASTEXITCODE){throw 'candidate build failed'}
          $a='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/addon-manager.ps1';$m='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/spotify-control.ps1';if((Get-Item $a).Length-ne973527-or(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant()-cne'3eac8cf4bfdcbbc38e7d4c01186a583fd13f96a27a98d8f6903147a4341da823'){throw 'addon candidate drift'};if((Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant()-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main candidate drift'}
          $s=Join-Path $env:RUNNER_TEMP 'bounded-recovery-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_SELFTEST_PASS'

      - name: Prove immutable production and write evidence
        shell: powershell
        run: |
          $p='5232e5adeb13e6942acb210b3cd13058e1eaaf05';foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}};if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-bounded-recovery-executor-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_integration_parent=$p;fixture_only=$true;fresh_integration_before_side_effect=$true;rollback_journal_before_restore=$true;cleanup_journal_before_delete=$true;cleanup_resume_only_at_cleanup_starting=$true;bounded_validated_primitives_only=$true;manual_and_no_action_refused=$true;future_app_generic=$true;production_wiring_added=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_EXECUTOR_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-bounded-recovery-executor-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-bounded-recovery-executor-v0.1.0/custom-app-production-bounded-recovery-executor.ps1
            validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1
            validation/custom-app-production-bounded-recovery-executor-v0.1.0/ci-evidence.json
          if-no-files-found: error
