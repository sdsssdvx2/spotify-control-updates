name: Official Spicetify manifest exact owned outputs (HOLD)
on:
  push:
    branches: [validate/official-manifest-owned-xpui]
    paths:
      - 'validation/approved-native-manifest-scope/**'
      - '.github/workflows/validate-official-manifest-owned-xpui-v044.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  official-manifest-extension-assets-scope:
    runs-on: windows-2025
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact V043 ancestry, protected main and bounded PowerShell 5.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='6942734faf513e49730f4f3d1182796b6e34f352'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
            (git merge-base $base HEAD).Trim() -cne $base){throw 'V044_PARENT_CHANGED'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'V044_MAIN_CHANGED'}
          $allow=@(
           'validation/approved-native-manifest-scope/manifest-owned-xpui-v044.ps1',
           'validation/approved-native-manifest-scope/test-manifest-owned-xpui-v044.ps1',
           '.github/workflows/validate-official-manifest-owned-xpui-v044.yml')
          $changes=@(git diff --name-only "$base...HEAD")
          if($changes.Count -ne $allow.Count -or @($changes|Where-Object{$_ -notin $allow}).Count){
             throw ('V044_UNEXPECTED_CHANGED_FILES '+($changes -join ','))
          }
          foreach($file in @($allow|Where-Object{$_ -like '*.ps1'})){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('V044_WINDOWS_PS51_PARSE_FAILURE '+$errors[0].Message)}
          }
          $src=Get-Content $allow[0] -Raw
          foreach($danger in @('Remove-Item','[IO.File]::Write','[IO.Directory]::Delete','Invoke-WebRequest','Invoke-RestMethod','Start-Process','spicetify apply','spicetify restore')){
            if($src.Contains($danger)){throw ('V044_SCOPING_MODULE_UNEXPECTED_SIDE_EFFECT '+$danger)}
          }
          Write-Host 'V044_EXACT_PARENT_MAIN_MINIMAL_READONLY_SOURCE_PS51_PARSE_PASS'
      - name: Fetch pinned free official Spicetify 2.46.4 one time
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'v044-vendor'
          [IO.Directory]::CreateDirectory($tmp)|Out-Null
          $zip=Join-Path $tmp 'official.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/spicetify/cli/releases/download/v2.46.4/spicetify-2.46.4-windows-x64.zip' -OutFile $zip
          if((Get-Item $zip).Length -ne 7795758 -or
             (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0490380bf59e00c94cf6cb12bfac5152791b91bb8009aceef53c49815b45a56f'){
            throw 'V044_OFFICIAL_ARCHIVE_PIN_FAIL'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $tmp 'extracted')
          $exes=@(Get-ChildItem (Join-Path $tmp 'extracted') -Recurse -File -Filter 'spicetify.exe')
          if($exes.Count -ne 1 -or
             (Get-FileHash $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
             throw 'V044_OFFICIAL_CLI_PIN_FAIL'
          }
          "V044_EXE=$($exes[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
      - name: One baseline + one manifest-rich real CLI refresh; adversarial output ownership
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v044-manifest.log'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/approved-native-manifest-scope/test-manifest-owned-xpui-v044.ps1' -OfficialExecutable $env:V044_EXE *>&1 | Tee-Object -FilePath $log | Out-Null
          $code=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($code -ne 0){Get-Content $log -Tail 95|ForEach-Object{Write-Host $_};throw ('V044_MANIFEST_TEST_FAILED '+$code)}
          $body=Get-Content $log -Raw
          foreach($marker in @(
            'V043_REAL_OFFICIAL_CLI_EXECUTABLE_ROOT_CUSTOMAPPS_FALLBACK_PASS',
            'V044_PINNED_OFFICIAL_CLI_MANIFEST_SUBFILES_EXTENSION_AND_ASSETS_PASS',
            'V044_NESTED_GLOB_ASSET_AND_EXTENSION_BYTES_EXACTLY_COPIED_PASS',
            'V044_UNMANAGED_APP_AND_OTHER_APPROVED_XPUI_UNCHANGED_PASS',
            'V044_V035_OLD_FIXED_OUTPUT_GUARD_NOT_SILENTLY_PROMOTED_PASS',
            'V044_TRAVERSAL_GLOB_COLLISION_SOURCE_RACE_AND_FOREIGN_OUTPUT_DENIED_PASS',
            'V044_MANIFEST_SCOPED_OUTPUT_FRESH_READBACK_IDEMPOTENT_PASS',
            'V044_NO_USER_SPOTIFY_NO_PRODUCTION_AUTHORITY_NO_BACKUP_DELETION_PASS')){
            if(-not$body.Contains($marker)){throw ('V044_MISSING_ACTUAL_TEST_PROOF '+$marker)}
          }
          Write-Host 'V044_REAL_OFFICIAL_MANIFEST_ASSET_SCOPE_AND_FAIL_CLOSED_TEST_PASS'
      - name: Confirm original main remains unchanged and no production release
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'V044_PRODUCTION_SHA_CHANGED'}
          Write-Host 'V044_HOSTED_ONLY_NO_REAL_PROFILE_NO_RELEASE_OR_INSTALL_PASS'
