name: Validate v0.6.28 Bootstrap 1.0.6 E2E

on:
  push:
    branches:
      - release/v0.6.28-sc-cover-ambience-commit-provenance-r17
    paths:
      - '.github/workflows/validate-v0.6.28-bootstrap-e2e.yml'
      - 'validation/v0.6.28/bootstrap_prepare_fixture.py'
      - 'validation/v0.6.28/bootstrap_run_cycle.ps1'
      - 'manifest.json'
      - 'packages/v0.6.28/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap-e2e-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert exact event head and published release inputs
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$eventHead='${{ github.sha }}'
          if($actual -cne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -cne '0.6.28' -or $m.source_commit -cne 'bb6d90146f20b73d36fbf8cb813f1b190f403c48' -or $m.payload_set_sha256 -cne '4be96c5d41c2160ed9ac96001b469998595629232929b82c8b0f34b11fda3b43'){throw 'v0.6.28 manifest identity drifted before Bootstrap E2E.'}
          if($m.bootstrap.version -cne '1.0.6' -or $m.bootstrap.sha256 -cne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 identity drifted.'}
          $edge=@($m.updates|Where-Object{$_.from_version -ceq '0.6.27' -and $_.to_version -ceq '0.6.28'});if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'Expected exact one-edge v0.6.27 -> v0.6.28 path.'}
          Write-Host "V0628_BOOTSTRAP_INPUT_CONTRACT_PASS head=$actual"

      - name: Parse Bootstrap E2E sources
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.28/bootstrap_prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.28 Bootstrap fixture source failed compile.'}
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'validation/v0.6.28/bootstrap_run_cycle.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'v0.6.28 Bootstrap E2E PowerShell parse failed.'}
          Write-Host 'V0628_BOOTSTRAP_E2E_SOURCE_PARSE_PASS'

      - name: Download exact previously validated Bootstrap 1.0.6 carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > validated-v0614-repair-artifact.zip
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib,zipfile
          outer=Path('validated-v0614-repair-artifact.zip').read_bytes()
          with zipfile.ZipFile(BytesIO(outer)) as z:
              assert z.testzip() is None
              inner=z.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          assert len(inner)==30856
          assert hashlib.sha256(inner).hexdigest()=='6b6d5d9e8ac44fc77bb95918164a3c862f14494c329fdfd267bd95f6c6ddcf06'
          with zipfile.ZipFile(BytesIO(inner)) as z:
              boot=z.read('bootstrap/spotify-control-self-updater.ps1')
          assert len(boot)==42963
          assert hashlib.sha256(boot).hexdigest()=='d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'
          print('VALIDATED_BOOTSTRAP_V106_CARRIER_PASS',len(outer),len(inner),len(boot))
          PY

      - name: Build exact local-manifest Bootstrap fixture
        shell: powershell
        run: |
          python validation/v0.6.28/bootstrap_prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.28 Bootstrap fixture preparation failed.'}

      - name: Run Check RollbackTest Update post-Check transaction cycle
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.28/bootstrap_run_cycle.ps1 -Fixture ci-bootstrap-fixture-v0627-to-v0628
          if($LASTEXITCODE -ne 0){throw "v0.6.28 Bootstrap transaction E2E failed: $LASTEXITCODE"}
          Write-Host 'V0628_BOOTSTRAP_E2E_PASS'

      - name: Prove fixture never changed released Bootstrap bytes
        shell: powershell
        run: |
          $exact='ci-bootstrap-fixture-v0627-to-v0628/LocalAppData/SpotifyControl/bootstrap/spotify-control-self-updater.ps1'
          if((Get-Item $exact).Length -ne 42963 -or (Get-FileHash $exact -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){throw 'Released Bootstrap bytes changed during E2E.'}
          Write-Host 'V0628_BOOTSTRAP_EXACT_BYTES_PRESERVED_PASS'

      - name: Cleanup fixture tree
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath ci-bootstrap-fixture-v0627-to-v0628 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ci-bootstrap-fixture -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath validated-v0614-repair-artifact.zip -Force -ErrorAction SilentlyContinue
