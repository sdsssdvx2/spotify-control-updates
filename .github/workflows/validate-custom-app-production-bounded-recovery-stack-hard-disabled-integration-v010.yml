name: Validate Custom App Production Bounded Recovery Stack Hard-Disabled Integration v0.1.0

on:
  push:
    branches: [validate/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-bounded-recovery-stack-hard-disabled-integration-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-stack-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/**','.github/workflows/validate-custom-app-production-bounded-recovery-stack-hard-disabled-integration-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='66a840510df64ed684e7547e4f3151d77a670971';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact hard-disabled recovery stack head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-bounded-recovery-stack-hard-disabled-integration-v010.yml','validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          $blob=(git rev-parse "HEAD:validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py").Trim();if($blob-cne'1440d16fd55b268efbf1fdd4efe714cd80c35e39'){throw "builder pin drift $blob"}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_SCOPE_PASS'

      - name: Build bounded recovery hard-disabled candidate first pass
        shell: powershell
        run: |
          $d='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'bounded recovery candidate build failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json"
          $ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();$as=(Get-Item $a).Length
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate changed'}
          if($as-ne1307828-or$ah-cne'd0bce3c8c4684838cd19cb2bd8bf70a44f8cbba323a853893e5497a854e96afc'){throw "bounded recovery candidate exact output drift size=$as sha256=$ah"}
          "ADDON_HASH=$ah"|Out-File $env:GITHUB_ENV -Append -Encoding utf8;"ADDON_SIZE=$as"|Out-File $env:GITHUB_ENV -Append -Encoding utf8;"REPORT_HASH=$rh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BOUNDED_RECOVERY_STACK_FIRST_BUILD addon_size=$as addon_sha256=$ah report_sha256=$rh"

      - name: Parse candidate with Windows PowerShell 5.1 and audit hard-disabled bounded wiring
        shell: powershell
        run: |
          $d='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0';$a="$d/out/bin/addon-manager.ps1";$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $a),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("candidate line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw 'bounded integrated candidate PS5.1 parse failed'}
          $raw=Get-Content $a -Raw
          foreach($m in @('$script:CustomAppProductionPipelineEnabled = $false','CUSTOM_APP_PRODUCTION_RECOVERY_STACK_HARD_DISABLED_SELFTEST_V010_PASS loaded-but-unreachable','CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_SELFTEST_V010_PASS loaded-but-unreachable','Invoke-CustomAppProductionBoundedRecoveryExecutorV010','fixture_only_contract=$true','Custom App production full-chain execution is intentionally unavailable in integration-only candidate.')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "candidate marker missing $m"}}
          $trueAssignments=[regex]::Matches($raw,'(?im)^[ \t]*[$]script:CustomAppProductionPipelineEnabled[ \t]*=[ \t]*[$]true[ \t]*\r?$');if($trueAssignments.Count-ne1){throw "forced-enable assignment count drift $($trueAssignments.Count) != 1"}
          $report=Get-Content "$d/candidate-validation.json" -Raw|ConvertFrom-Json
          foreach($f in @('pipeline_enabled','pipeline_enablement_implemented','recovery_normal_path_wiring_added','bounded_recovery_normal_path_wiring_added','generic_auto_authority_expanded','production_main_changed')){if([bool]$report.$f){throw "candidate report gained authority: $f"}}
          if(-not[bool]$report.full_chain_function_unchanged-or-not[bool]$report.candidate_reduces_exactly_to_parent){throw 'candidate parent reduction proof failed'}
          if(@($report.preexisting_parent_functions_changed).Count-ne0){throw 'preexisting parent function changed'}
          if([int]$report.pipeline_true_assignment_count-ne1-or-not[bool]$report.pipeline_true_assignment_inherited_selftest_only){throw 'forced-enable provenance contract drift'}
          if([string]$report.bounded_executor_head-cne'5a2840d824f1e28e2920657d0e3a8e139d7e8b71'-or[string]$report.bounded_executor_blob-cne'e580daa3b2f1f506131bc59e0e8969a36bc30441'){throw 'bounded executor exact pin drift'}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_PARSE_AUDIT_PASS'

      - name: Run Addon Manager SelfTest in isolated profile
        shell: powershell
        run: |
          $a='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/out/bin/addon-manager.ps1';$s=Join-Path $env:RUNNER_TEMP 'bounded-recovery-stack-hard-disabled-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_SELFTEST_PASS'

      - name: Rebuild deterministically and compare exact output
        shell: powershell
        run: |
          $d='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'second deterministic build failed'};$a="$d/out/bin/addon-manager.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();$as=(Get-Item $a).Length;if($ah-cne$env:ADDON_HASH-or$as-ne[int64]$env:ADDON_SIZE){throw 'candidate addon deterministic rebuild drift'};if($as-ne1307828-or$ah-cne'd0bce3c8c4684838cd19cb2bd8bf70a44f8cbba323a853893e5497a854e96afc'){throw "candidate exact hard pin drift size=$as sha256=$ah"};if($rh-cne$env:REPORT_HASH){throw 'candidate report deterministic rebuild drift'}
          Write-Host "CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_DETERMINISTIC_PASS addon_size=$env:ADDON_SIZE addon_sha256=$env:ADDON_HASH report_sha256=$env:REPORT_HASH"

      - name: Prove protected surfaces immutable and write CI evidence
        shell: powershell
        run: |
          $p='66a840510df64ed684e7547e4f3151d77a670971';foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/addon-manager.ps1','bin/spotify-control.ps1','validation/custom-app-production-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py','validation/custom-app-production-bounded-recovery-executor-v0.1.0/custom-app-production-bounded-recovery-executor.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}};if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_parent=$p;bounded_executor_head='5a2840d824f1e28e2920657d0e3a8e139d7e8b71';bounded_executor_blob='e580daa3b2f1f506131bc59e0e8969a36bc30441';candidate_addon_size=1307828;candidate_addon_sha256='d0bce3c8c4684838cd19cb2bd8bf70a44f8cbba323a853893e5497a854e96afc';candidate_report_sha256=$env:REPORT_HASH;preexisting_parent_functions_changed=0;candidate_reduces_exactly_to_parent=$true;pipeline_true_assignment_count=1;pipeline_true_assignment_inherited_selftest_only=$true;addon_selftest_passed=$true;pipeline_enabled=$false;pipeline_enablement_implemented=$false;normal_path_recovery_wiring_added=$false;bounded_recovery_normal_path_wiring_added=$false;production_main_changed=$false;provisional_hash_discovery=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_BOUNDED_RECOVERY_STACK_HARD_DISABLED_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-bounded-recovery-stack-hard-disabled-integration-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py
            validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/candidate-validation.json
            validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/ci-evidence.json
          if-no-files-found: error
