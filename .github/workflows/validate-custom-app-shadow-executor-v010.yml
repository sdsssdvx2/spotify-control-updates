name: Validate Custom App Shadow Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-shadow-executor-v0.1.0]
    paths:
      - 'validation/custom-app-shadow-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-shadow-executor-v010.yml'
  pull_request:
    branches: [validate/custom-app-stage-acquisition-contract-v0.1.0]
    paths:
      - 'validation/custom-app-shadow-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-shadow-executor-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact shadow-only scope, stage lineage, and frozen production
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='c420a1df6f306c7ba74772b91241cb14abd04738'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Shadow executor is not descended from exact validated stage-acquisition head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-shadow-executor-v010.yml',
            'validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Shadow validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected shadow file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during shadow validation.'}
          Write-Host "CUSTOM_APP_SHADOW_SCOPE_PASS head=$actual"

      - name: Prove immutable validated dependency objects
        shell: powershell
        run: |
          $pins=@(
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('b339f2b79a267c13cf3c5974aea2fff3786d3093','validation/custom-app-provenance-enrollment-v0.1.0/custom-app-provenance.ps1','4f0831fa2e5dc23c9a4ec98b6c7a9afbb3c9af55'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('7402ea5c77e58cd072f0166411d40e7726093f3c','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1','3a49ceebd13fa993b086eb2643130fb02c746bd1'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.1/release-id-fix-v011.ps1','e0ae3c494959c6b738bfd1be56183931119542cf')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned shadow dependency drift: $($p[1]) $blob != $($p[2])"}}
          Write-Host 'CUSTOM_APP_SHADOW_DEPENDENCY_PINS_PASS'

      - name: Parse shadow implementation and tests with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_SHADOW_PS51_PARSE_PASS'

      - name: Audit fixture confinement, fresh provenance, and production authority denial
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1' -Raw
          $overlay=Get-Content 'validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1' -Raw
          $live=Get-Content 'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1' -Raw
          foreach($m in @('shadow-live-path-outside-dedicated-fixture-root','fresh-provenance-fingerprint-drift','binding-source-does-not-match-provenance','Local provenance or binding changed during remote stage acquisition.','fresh-provenance-stage-transaction-persistence-all-verified','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Shadow core safety marker missing: $m"}}
          foreach($m in @('Shadow persistence roots must stay inside the dedicated fixture root.','post-provenance-git-config-byte-drift','post-provenance-strong-origin-continuity-proven','rolled-back-after-persistence-drift','rolled-back-after-provenance-drift','production_mutation_authorized=$false')){if($overlay.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Shadow overlay safety marker missing: $m"}}
          foreach($m in @('416245914','418974188','last_local_tree_sha256','last_local_manifest_name','Get-PinnedLiveDependencyFile','production_mutation_authorized')){if($live.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Live Tagify shadow marker missing: $m"}}
          foreach($text in @($core,$overlay,$live)){
            if($text.IndexOf('production_mutation_authorized=$true',[StringComparison]::OrdinalIgnoreCase) -ge 0){throw 'Shadow executor grants production mutation authority.'}
            foreach($forbidden in @('spicetify apply','spicetify config custom_apps')){if($text.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Shadow executor references production Spicetify mutation: $forbidden"}}
          }
          Write-Host 'CUSTOM_APP_SHADOW_STATIC_AUDIT_PASS'

      - name: Run offline fresh-provenance shadow executor matrix twice
        shell: powershell
        run: |
          1..2|ForEach-Object{
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1'
            if($LASTEXITCODE -ne 0){throw "Shadow executor matrix failed on pass $_."}
          }
          Write-Host 'CUSTOM_APP_SHADOW_MATRIX_REPEAT_PASS'

      - name: Live pinned Tagify v3.3.1 to v3.3.2 full shadow update
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Live pinned Tagify shadow executor test failed.'}
          Write-Host 'CUSTOM_APP_SHADOW_LIVE_TAGIFY_STEP_PASS'

      - name: Replay stage acquisition, transaction, and exact v0.4.1 parent SelfTest
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-stage-acquisition-contract-v0.1.0/test_custom_app_stage_acquisition.ps1';if($LASTEXITCODE -ne 0){throw 'Stage acquisition matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1';if($LASTEXITCODE -ne 0){throw 'Transaction matrix regressed.'}
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build;if($LASTEXITCODE -ne 0){throw 'Exact v0.4.1 candidate rebuild failed.'}
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $addon).Length -ne 523216 -or $ah -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $((Get-Item $addon).Length)/$ah"}
          if((Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control parent bytes drifted.'}
          $sandbox=Join-Path $env:RUNNER_TEMP 'shadow-parent-selftest';$env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData';$env:APPDATA=Join-Path $sandbox 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest;if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_SHADOW_PARENT_REPLAY_PASS'

      - name: Prove production and parent validation surfaces remain immutable
        shell: powershell
        run: |
          $parent='c420a1df6f306c7ba74772b91241cb14abd04738';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@(
            '.github/workflows/validate-custom-app-shadow-executor-v010.yml',
            'validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1',
            'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1'
          )
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected shadow changed surface: $($bad -join ', ')"}
          foreach($path in @('manifest.json','stable-version.json','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py')){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_SHADOW_IMMUTABILITY_PASS'

      - name: Write shadow validation evidence
        shell: powershell
        run: |
          $e=[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_stage_parent='c420a1df6f306c7ba74772b91241cb14abd04738';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';executor='custom-app-shadow-executor-v1';production_mutation_authority=$false;live_path_scope='dedicated-temp-fixture-only';persistence_scope='dedicated-temp-fixture-only';fresh_provenance_before_stage=$true;fresh_provenance_after_stage=$true;post_apply_git_origin_reproof=$true;offline_commit_and_rollbacks='pass';live_tagify_331_to_332='pass'}
          $e|ConvertTo-Json -Depth 5|Set-Content 'validation/custom-app-shadow-executor-v0.1.0/ci-evidence.json' -Encoding UTF8

      - name: Upload shadow executor validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-shadow-executor-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1
            validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1
            validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1
            validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1
            validation/custom-app-shadow-executor-v0.1.0/ci-evidence.json
