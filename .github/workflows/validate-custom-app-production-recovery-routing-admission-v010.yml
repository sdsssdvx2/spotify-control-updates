name: Validate Custom App Production Recovery Routing Admission v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-routing-admission-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-admission-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-admission-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='92a3e8ac83c8bbbe9e5d4b6f3f00469701250acc';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact bounded recovery hard-disabled integration head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-routing-admission-v010.yml','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','validation/custom-app-production-recovery-routing-admission-v0.1.0/test_custom_app_production_recovery_routing_admission.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_SCOPE_PASS'

      - name: Prove exact immutable pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','4225bb042aa8d240706e1f383e54f12894e74512'),
            @($h,'validation/custom-app-production-recovery-routing-admission-v0.1.0/test_custom_app_production_recovery_routing_admission.ps1','791b5df714509a42ab0ab53340f450d3f8fd7ca0'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/test_custom_app_production_crash_recovery_journal.ps1','6ff49f21d30511e4eb99300debb0bd0696f74204'),
            @('92a3e8ac83c8bbbe9e5d4b6f3f00469701250acc','validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py','1440d16fd55b268efbf1fdd4efe714cd80c35e39')
          );foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b-cne$p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_PINS_PASS'

      - name: Materialize exact crash-journal sibling dependency
        shell: powershell
        run: |
          $deps=@(
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/test_custom_app_production_crash_recovery_journal.ps1','6ff49f21d30511e4eb99300debb0bd0696f74204')
          );foreach($d in $deps){$path=$d[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:RR_SPEC="$($d[0])`:$path";$env:RR_OUT=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['RR_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['RR_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual-cne$d[2]){throw "materialized blob drift $path $actual != $($d[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_MATERIALIZATION_PASS'

      - name: Parse and audit zero-authority routing core
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-admission-v0.1.0';foreach($f in @("$d/custom-app-production-recovery-routing-admission.ps1","$d/test_custom_app_production_recovery_routing_admission.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-routing-admission.ps1" -Raw
          foreach($m in @('Read-CustomAppProductionCrashJournalV010','Resolve-CustomAppProductionCrashRecoveryClassificationV010','prepared-transaction-resolution-required','manual-filesystem-recovery-inspection-required','bounded-recovery-executor-candidate','bounded-recovery-housekeeping-candidate','recovery-artifact-retirement-required','terminal-new-update-permit-readiness-required','requires_future_fresh_revalidation=$true','routing_is_authority=$false','execution_authorized=$false','restore_authorized=$false','apply_authorized=$false','cleanup_authorized=$false','permit_issued=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "routing marker missing $m"}}
          foreach($x in @('[IO.Directory]::CreateDirectory','[IO.Directory]::Move','[IO.Directory]::Delete','[IO.File]::Copy','[IO.File]::Write','Move-Item','Copy-Item','Remove-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Invoke-CustomAppProductionBoundedRecoveryExecutorV010 -')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "routing core gained forbidden side effect $x"}}
          if($core-match'routing_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|permit_issued\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'routing authority escaped'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_PARSE_AUDIT_PASS'

      - name: Run recovery routing admission matrix twice
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP;1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-routing-admission-v0.1.0/test_custom_app_production_recovery_routing_admission.ps1';if($LASTEXITCODE){throw "routing matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_MATRIX_REPEAT_PASS'

      - name: Prepare exact parent PS5.1 nullable-time journal acceptance harness
        shell: powershell
        run: |
          $d='validation/custom-app-production-crash-recovery-journal-v0.1.0';$src=Join-Path $d 'test_custom_app_production_crash_recovery_journal.ps1';$runtime=Join-Path $d 'test_custom_app_production_crash_recovery_journal.runtime.ps1';$text=Get-Content -LiteralPath $src -Raw;$needle='[AllowNull()][DateTimeOffset]$At=$null';if(([regex]::Matches($text,[regex]::Escape($needle))).Count-ne1){throw 'parent nullable-time patch marker drifted'};$patched=$text.Replace($needle,'[AllowNull()]$At=$null');[IO.File]::WriteAllText($runtime,$patched,[Text.UTF8Encoding]::new($false));$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $runtime),[ref]$t,[ref]$er)|Out-Null;if($er.Count){throw 'runtime journal harness parse failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_PARENT_HARNESS_PASS'

      - name: Replay exact crash-journal parent matrix through validated runtime harness
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-crash-recovery-journal-v0.1.0/test_custom_app_production_crash_recovery_journal.runtime.ps1';if($LASTEXITCODE){throw 'crash-journal parent regression failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_PARENT_PASS'

      - name: Rebuild exact hard-disabled bounded candidate and SelfTest
        shell: powershell
        run: |
          $d='validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'bounded hard-disabled parent build failed'};$a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1307828-or$ah-cne'd0bce3c8c4684838cd19cb2bd8bf70a44f8cbba323a853893e5497a854e96afc'){throw 'bounded hard-disabled Addon Manager drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control parent drift'}
          $s=Join-Path $env:RUNNER_TEMP 'recovery-routing-parent-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'parent Addon Manager SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_PARENT_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='92a3e8ac83c8bbbe9e5d4b6f3f00469701250acc';$expected=@('.github/workflows/validate-custom-app-production-recovery-routing-admission-v010.yml','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','validation/custom-app-production-recovery-routing-admission-v0.1.0/test_custom_app_production_recovery_routing_admission.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$expected});if($bad.Count){throw "unexpected changed surface $($bad-join', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/addon-manager.ps1','bin/spotify-control.ps1','validation/custom-app-production-bounded-recovery-stack-hard-disabled-integration-v0.1.0/build_candidate.py')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}};if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-routing-admission-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_parent=$p;qualified_journal_head='7e26187e2360089024e9d72d0701be6f1577a1ef';qualified_bounded_executor_head='5a2840d824f1e28e2920657d0e3a8e139d7e8b71';router_zero_authority=$true;prepared_auto_execution_blocked=$true;atomic_manual_inspection_preserved=$true;committed_clean_new_permit_policy_still_unwired=$true;bounded_executor_invoked_by_router=$false;future_fresh_revalidation_required=$true;parent_nullable_time_harness_exactly_replayed=$true;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_ADMISSION_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-routing-admission-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1
            validation/custom-app-production-recovery-routing-admission-v0.1.0/test_custom_app_production_recovery_routing_admission.ps1
            validation/custom-app-production-recovery-routing-admission-v0.1.0/ci-evidence.json
          if-no-files-found: error
