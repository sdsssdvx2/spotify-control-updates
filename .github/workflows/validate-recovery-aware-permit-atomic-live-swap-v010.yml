          foreach($f in @($corePath,$testPath)){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|ForEach-Object{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content $corePath -Raw
          foreach($m in @('Test-CustomAppProductionRecoveryAwarePermitPreApplyPreparedResultV010','Test-CustomAppProductionRecoveryAwarePermitStageExecutorResultV010','Resolve-CustomAppProductionRecoveryAwarePermitStageAcquisitionAdmissionV010','ConvertTo-CustomAppProductionRecoveryAwarePermitGenericStageResultV010','ConvertTo-CustomAppProductionRecoveryAwarePermitGenericPreparedResultV010','Invoke-CustomAppProductionAtomicLiveSwapV010','Restore-CustomAppProductionAtomicLiveSwapV010','Read-CustomAppProductionConsumptionStoreV010','recovery-aware-atomic-consumption-ledger-mutated-by-live-swap','requires_transaction_finalization=$true','requires_fresh_post_swap_apply_admission=$true','spicetify_apply_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "core marker missing $m"}}
          if(([regex]::Matches($core,'Invoke-CustomAppProductionAtomicLiveSwapV010')).Count-ne1){throw 'qualified generic atomic invocation count drifted'}
          if(([regex]::Matches($core,'Restore-CustomAppProductionAtomicLiveSwapV010')).Count-ne1){throw 'wrapper rollback invocation count drifted'}
          foreach($x in @('[IO.Directory]::Move(','Invoke-CustomAppStageAcquisitionV010','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','spicetify apply','spicetify config','Save-AddonState','DownloadFile','DownloadString')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "wrapper gained forbidden direct primitive $x"}}
          if($core -match 'session_key_persisted\s*=\s*\$true|session_key_exposed\s*=\s*\$true|apply_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|live_destination_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority/session-key contract escaped'}
          $test=Get-Content $testPath -Raw;foreach($m in @('Recovery closure is durable evidence','future-app','wrong key accepted','stage drift accepted','throw-after-candidate-move','ledger-drift-after-atomic-verification','wrapper postcheck rollback missing','RAA matrix count mismatch','count=$raaCount')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "test coverage marker missing $m"}}
          if($test.IndexOf('Invoke-Expression',[StringComparison]::OrdinalIgnoreCase)-ge0){throw 'dynamic test execution reintroduced'}
          'RECOVERY_AWARE_PERMIT_ATOMIC_PARSE_AUDIT_PASS'

