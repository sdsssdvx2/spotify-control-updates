        shell: powershell
        run: |
          $p='43f9a433354f56e2db19f4edfa1ffa8f4a245088';$expected=@('.github/workflows/validate-recovery-aware-permit-atomic-live-swap-v010.yml','validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/custom-app-production-recovery-aware-permit-atomic-live-swap.ps1','validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/test_custom_app_production_recovery_aware_permit_atomic_live_swap.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "unexpected surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-aware-permit-pre-apply-preparation-v0.1.0/custom-app-production-recovery-aware-permit-pre-apply-preparation.ps1','validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/custom-app-production-recovery-aware-permit-stage-executor.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();parent=$p;generic_atomic_head='574fe182168271fa3497d58e269e9af1f60d9033';recovery_revalidated_immediately_before_mutation=$true;generic_atomic_invoked_exactly_once=$true;wrapper_owns_no_directory_move_primitive=$true;generic_atomic_rollback_reused=$true;wrapper_postcheck_failure_rolls_back_app_and_persistence=$true;consumption_ledger_must_remain_identical=$true;recovery_closed_fixture=$true;transaction_finalization_required=$true;fresh_post_swap_apply_admission_required=$true;session_key_persisted=$false;session_key_exposed=$false;spicetify_apply_authority=$false;production_mutation_authority=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'RECOVERY_AWARE_PERMIT_ATOMIC_IMMUTABILITY_PASS'

