name: HOLD R17 exact leftover root forensic inventory
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-leftover-roots-R17-HOLD.yml
permissions: {contents: read}
jobs:
  read-only:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build synthetic PREPARED fixture with mixed old, empty, and nonempty leftover roots
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,hashlib,json,shutil
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'spotify-r17-fixture'
          if base.exists():raise RuntimeError('SCRATCH_COLLISION')
          root=base/'LocalAppData'/'SpotifyControl'
          root.mkdir(parents=True)
          def populate(p,entries):
              p.mkdir(parents=True)
              for name,data in entries.items():(p/name).write_bytes(data)
          data={'spotify-control.ps1':b'canonical-before-file','empty.txt':b''}
          populate(root/'bin',data)
          txnid='20261108-131500-cafefeed'
          backup=root/'backups'/'self-update-transactions'/txnid/'bin'
          populate(backup,data)
          new=root/('bin.spotifycontrol-new-'+txnid);new.mkdir()
          restore=root/('bin.spotifycontrol-restore-'+txnid);populate(restore,data)
          failed=root/('bin.spotifycontrol-failed-'+txnid);populate(failed,{'failed.marker':b'opaque different data'})
          def tree(p):
              rows=[]
              for entry in p.rglob('*'):
                  rel=entry.relative_to(p).as_posix().lower()
                  if entry.is_dir():rows.append('D|'+rel)
                  else:
                      b=entry.read_bytes()
                      rows.append('F|'+rel+'|'+str(len(b))+'|'+hashlib.sha256(b).hexdigest())
              return hashlib.sha256(('\n'.join(sorted(rows))+'\n').encode()).hexdigest()
          before=tree(root/'bin')
          assert before==tree(backup)==tree(restore)
          record=dict(schema=1,id=txnid,status='prepared',
            before_version='0.6.20',after_version='0.6.28',
            source_commit='bb6d90146f20b73d36fbf8cb813f1b190f403c48',
            payload_set_sha256='4be96c5d41c2160ed9ac96001b469998595629232929b82c8b0f34b11fda3b43',
            before_tree_sha256=before,after_tree_sha256='f'*64,
            backup_bin=str(backup),
            same_dir_new=str(new),
            same_dir_old=str(root/('bin.spotifycontrol-old-'+txnid)))
          (root/'self-update-last-transaction.json').write_bytes(
            b'\xef\xbb\xbf'+json.dumps(record,separators=(',',':')).encode('utf-8'))
          reports=root/'reports'
          reports.mkdir()
          private_error='Self-update failed and rollback also failed. update_error=Live bin changed before self-update swap.; rollback_error=Candidate main SelfTest failed: PRIVATE_SCRATCH_PATH'
          (reports/'self-update-latest.json').write_text(json.dumps(dict(
              schema=1,action='Update',success=False,transaction_status='prepared',
              transaction_id=txnid,result=None,error=private_error),separators=(',',':')),encoding='utf-8')
          def snapshot():
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in root.rglob('*') if p.is_file()}
          (base/'before.json').write_text(json.dumps(snapshot(),sort_keys=True))
          print('R17_SYNTHETIC_ROOT_FIXTURE_READY')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R17_FIXTURE_SETUP_FAILED'}
      - name: Check actual R17 PowerShell 5.1 source and all read-only root classifications
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/inspect-leftover-roots-R17-READONLY.ps1'
          $ast=[Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script),[ref]$null,[ref]$null)
          $token=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script),[ref]$token,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R17_PS51_PARSE_FAILED'}
          $fixture=Join-Path $env:RUNNER_TEMP 'spotify-r17-fixture'
          $output=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -HostedFixtureRoot $fixture)
          foreach($line in @(
            'TRANSACTION_STATUS=PREPARED;LINEAGE=EXACT',
            'TRANSACTION_BOM=UTF8_PRESENT',
            'LIVE=EXACT_TRANSACTION_BEFORE_TREE',
            'BACKUP=EXACT_TRANSACTION_BEFORE_TREE',
            'NEW=EMPTY_PLAIN_DIRECTORY_PRESERVE',
            'OLD=ABSENT',
            'RESTORE=EXACT_TRANSACTION_BEFORE_TREE',
            'FAILED=NONEMPTY_UNMATCHED_TREE_PRESERVE',
            'TRANSACTION_STABLE_DURING_AUDIT=YES',
            'RESULT=READONLY_LEFTOVER_INVENTORY_COMPLETE',
            'RAW_PATHS_IDS_CONTENTS_AND_ERRORS_EXPORTED=NO'
          )){
            if($output -cnotcontains $line){throw ('R17_EXPECTED_CLASSIFICATION_MISSING: '+$line+' OUTPUT='+($output -join '|'))}
          }
          $privatePattern='20261108-131500-cafefeed|C:\\Users\\|RUNNER_TEMP|opaque different data'
          if(($output -join '|') -match $privatePattern){throw 'R17_PRIVATE_CONTENT_EXPORTED'}
          Write-Host 'R17_WINDOWS_PS51_ALL_FOUR_ROOTS_CORRECTLY_CLASSIFIED_PASS'
          Write-Host 'R17_BOM_TRANSACTION_AND_READONLY_POLICY_PASS'
      - name: Confirm R19 split error taxonomy and transaction root preservation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/inspect-bootstrap-update-failure-R19-READONLY.ps1'
          $tok=$null;$parse=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
             (Resolve-Path $script),[ref]$tok,[ref]$parse)
          if(@($parse).Count -ne 0){throw 'R19_PS51_PARSE_FAILED'}
          $fixture=Join-Path $env:RUNNER_TEMP 'spotify-r17-fixture'
          $output=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -HostedFixtureRoot $fixture)
          if($LASTEXITCODE -ne 0){throw 'R19_SCRIPT_PROCESS_FAILED'}
          foreach($expected in @(
            'TRANSACTION_STATUS=PREPARED;LINEAGE=EXACT',
            'REPORT_ACTION=UPDATE',
            'REPORT_SUCCESS=FALSE',
            'REPORT_TRANSACTION_STATUS=PREPARED',
            'REPORT_TRANSACTION_MATCH=YES',
            'REPORT_ERROR_TEMPLATE=UPDATE_AND_ROLLBACK_FAILED',
            'UPDATE_ERROR_CLASS=LIVE_BIN_CHANGED_PRE_SWAP',
            'ROLLBACK_ERROR_CLASS=CANDIDATE_MAIN_SELFTEST',
            'LIVE=EXACT_TRANSACTION_BEFORE_TREE',
            'BACKUP=EXACT_TRANSACTION_BEFORE_TREE',
            'NEW=EMPTY_PLAIN_DIRECTORY_PRESERVE',
            'OLD=ABSENT',
            'RESTORE=EXACT_TRANSACTION_BEFORE_TREE',
            'FAILED=NONEMPTY_UNMATCHED_TREE_PRESERVE',
            'TRANSACTION_STABLE_DURING_AUDIT=YES',
            'RESULT=READONLY_POST_FAILURE_CLASSIFICATION_COMPLETE'
          )){
            if($output -cnotcontains $expected){
              throw ('R19_EXPECTED_CLASSIFICATION_ABSENT '+$expected)
            }
          }
          if(($output -join '|') -match '(?i)PRIVATE_SCRATCH_PATH|20261108-131500-cafefeed|Self-update failed|C:\\\\Users\\'){
            throw 'R19_PRIVATE_ERROR_OR_PATH_EXPORTED'
          }
          Write-Host 'R19_WINDOWS_GENUINE_BOOTSTRAP_COMPOUND_ERROR_SPLIT_PASS'
          Write-Host 'R19_SIX_PROTECTED_TREES_AND_TRANSACTION_READONLY_PASS'
          # Verify the specific Windows Move-Item "in use" message missed by
          # the first R19, and Korean locale, without any raw text export.
          # Synthetic report mutation is rolled back byte-for-byte.
          $reportPath=Join-Path $fixture 'LocalAppData/SpotifyControl/reports/self-update-latest.json'
          [byte[]]$originalReport=[IO.File]::ReadAllBytes($reportPath)
          try{
            $doc=([IO.File]::ReadAllText($reportPath,[Text.Encoding]::UTF8)|ConvertFrom-Json)
            $en='Cannot move item because the item at PRIVATE_SCRATCH_PATH is in use.'
            $ko=('"\uC774\uB3D9\uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4. \uC0AC\uC6A9 \uC911\uC785\uB2C8\uB2E4."'|ConvertFrom-Json)
            $doc.error='Self-update failed and rollback also failed. update_error='+$en+'; rollback_error='+$ko
            [IO.File]::WriteAllText($reportPath,($doc|ConvertTo-Json -Depth 10 -Compress),(New-Object Text.UTF8Encoding($false)))
            $localized=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -HostedFixtureRoot $fixture)
            if($LASTEXITCODE -ne 0){throw 'R19_LOCALIZED_PROCESS_FAILED'}
            foreach($expect in @(
              'REPORT_ERROR_TEMPLATE=UPDATE_AND_ROLLBACK_FAILED',
              'UPDATE_ERROR_CLASS=MOVE_ITEM_IN_USE_OR_SHARING',
              'ROLLBACK_ERROR_CLASS=MOVE_ITEM_IN_USE_OR_SHARING',
              'UPDATE_ERROR_LOCALE=NO_HANGUL',
              'ROLLBACK_ERROR_LOCALE=HANGUL_PRESENT',
              'LIVE=EXACT_TRANSACTION_BEFORE_TREE',
              'BACKUP=EXACT_TRANSACTION_BEFORE_TREE',
              'TRANSACTION_STABLE_DURING_AUDIT=YES',
              'RESULT=READONLY_POST_FAILURE_CLASSIFICATION_COMPLETE'
            )){
              if($localized -cnotcontains $expect){throw ('R19_LOCALIZED_CLASSIFICATION_MISSING '+$expect)}
            }
            if(($localized -join '|') -match '(?i)PRIVATE_SCRATCH_PATH|20261108-131500-cafefeed|Self-update failed'){
              throw 'R19_LOCALIZED_PRIVATE_TEXT_EXPORTED'
            }
            Write-Host 'R19_ENGLISH_KOREAN_WINDOWS_MOVE_IN_USE_ERROR_CLASSIFICATION_PASS'
          }finally{
            [IO.File]::WriteAllBytes($reportPath,$originalReport)
          }
      - name: Prove no fixture mutation and clean disposable scratch
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:RUNNER_TEMP 'spotify-r17-fixture'
          @'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'spotify-r17-fixture'
          if base.exists():
              root=base/'LocalAppData'/'SpotifyControl'
              before=json.loads((base/'before.json').read_text())
              after={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in root.rglob('*') if p.is_file()}
              assert after==before,'R17_INSPECTION_MUTATED_FIXTURE'
              print('R17_FULL_ROOT_FILE_SET_BYTE_SHA_UNCHANGED_PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R17_ROOT_MUTATION_DETECTED'}
          if(Test-Path -LiteralPath $fixture){
            Remove-Item -LiteralPath $fixture -Force -Recurse -ErrorAction Stop
          }
