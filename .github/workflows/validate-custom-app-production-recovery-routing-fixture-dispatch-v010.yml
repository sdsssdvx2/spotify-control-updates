name: Validate Custom App Production Recovery Routing Fixture Dispatch v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-fixture-dispatch-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0]
    paths: ['validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-routing-fixture-dispatch-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='165f820dff82a8c4e5edada443db595f545ddc03';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact routing hard-disabled integration head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-routing-fixture-dispatch-v010.yml','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_SCOPE_PASS'

      - name: Prove exact immutable pins
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$pins=@(
            @($h,'validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','0cfb42759a3284dd70b2a8395304f48588ccd1b8'),
            @($h,'validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1','810d9ec1f3a4b9cce4d86aaef88cded828a3ca7f'),
            @('2f2f596bb8a86c0b074543992f7634be858821a4','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','4225bb042aa8d240706e1f383e54f12894e74512'),
            @('5a2840d824f1e28e2920657d0e3a8e139d7e8b71','validation/custom-app-production-bounded-recovery-executor-v0.1.0/custom-app-production-bounded-recovery-executor.ps1','e580daa3b2f1f506131bc59e0e8969a36bc30441'),
            @('5a2840d824f1e28e2920657d0e3a8e139d7e8b71','validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1','32e37e8b14c68af74daa36d5991661cf6e793fa6'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/test_custom_app_production_recovery_evidence_admission_integration.ps1','453be9908425716094172db98cd3ce9740999562'),
            @('574fe182168271fa3497d58e269e9af1f60d9033','validation/custom-app-production-atomic-live-swap-v0.1.0/custom-app-production-atomic-live-swap.ps1','e91fa6a125f77352907c1119f6d9f47be9682550'),
            @('fe07d410531ea13c8fca379b01405631a3763e84','validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a'),
            @('67458cbb96b5d1ed92e26c2b81debd6894044749','validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1','3b14280d727287252f71611e4424d78e5705c2f1'),
            @('165f820dff82a8c4e5edada443db595f545ddc03','validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py','977ee4a599952877a2eac316fa78ca406326b396')
          );foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b-cne$p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_PINS_PASS'

      - name: Parse and audit CI-only bounded dispatch wrapper
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0';foreach($f in @("$d/custom-app-production-recovery-routing-fixture-dispatch.ps1","$d/test_custom_app_production_recovery_routing_fixture_dispatch.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-routing-fixture-dispatch.ps1" -Raw
          foreach($m in @('GITHUB_ACTIONS','RUNNER_TEMP','Test-CustomAppProductionRecoveryRoutingAdmissionReceiptV010','Resolve-CustomAppProductionRecoveryRoutingAdmissionV010','Invoke-CustomAppProductionBoundedRecoveryExecutorV010','Test-CustomAppProductionBoundedRecoveryExecutorResultV010','fixture_environment_verified=$true','fixture_only_contract=$true','requires_future_fresh_revalidation=$true','dispatch_is_authority=$false','execution_authorized=$false','restore_authorized=$false','apply_authorized=$false','cleanup_authorized=$false','permit_issued=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "dispatch marker missing $m"}}
          foreach($x in @('[IO.Directory]::CreateDirectory','[IO.Directory]::Delete','[IO.Directory]::Move','[IO.File]::Copy','[IO.File]::Write','Remove-Item','Move-Item','Copy-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "dispatch wrapper gained direct side effect $x"}}
          if($core-match'dispatch_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|permit_issued\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'dispatch authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_recovery_routing_fixture_dispatch.ps1" -Raw;foreach($m in @('candidate dispatch','housekeeping dispatch','future dispatch','stale routing receipt executed','route tamper+rehash executed','authority tamper+rehash executed','non-GitHub environment accepted','missing RUNNER_TEMP accepted','GITHUB_WORKSPACE unexpectedly inside RUNNER_TEMP','outside AllowedRoot accepted','spicetify outside supplied root accepted','expired routing receipt executed','result route tamper+rehash accepted','result authority tamper+rehash accepted')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "dispatch coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_PARSE_AUDIT_PASS'

      - name: Prepare exact bounded-executor worktree and materialize validated siblings
        shell: powershell
        run: |
          $wt=Join-Path $env:RUNNER_TEMP 'recovery-routing-fixture-dispatch-worktree';if(Test-Path $wt){Remove-Item -LiteralPath $wt -Recurse -Force};git worktree add --detach $wt '5a2840d824f1e28e2920657d0e3a8e139d7e8b71';if($LASTEXITCODE){throw 'bounded executor worktree creation failed'}
          $deps=@(
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('2f2f596bb8a86c0b074543992f7634be858821a4','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1','4225bb042aa8d240706e1f383e54f12894e74512'),
            @('${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','0cfb42759a3284dd70b2a8395304f48588ccd1b8'),
            @('${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1','810d9ec1f3a4b9cce4d86aaef88cded828a3ca7f')
          );foreach($d in $deps){$rel=$d[1];$out=Join-Path $wt $rel;New-Item -ItemType Directory -Force -Path (Split-Path $out -Parent)|Out-Null;$env:FD_SPEC="$($d[0])`:$rel";$env:FD_OUT=$out;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['FD_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['FD_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $rel"};$actual=(git -C $wt hash-object $rel).Trim();if($actual-cne$d[2]){throw "materialized blob drift $rel $actual != $($d[2])"}}
          $parentTest=Join-Path $wt 'validation/custom-app-production-bounded-recovery-executor-v0.1.0/test_custom_app_production_bounded_recovery_executor.ps1';$text=Get-Content -LiteralPath $parentTest -Raw
          $old1="Assert-RXFalse (Test-Path -LiteralPath ([IO.Path]::GetDirectoryName([string]`$q.f.prepared.app_backup_path)) 'app backup container survived housekeeping'";$new1="Assert-RXFalse (Test-Path -LiteralPath ([IO.Path]::GetDirectoryName([string]`$q.f.prepared.app_backup_path))) 'app backup container survived housekeeping'"
          $old2="Assert-RXTrue (Test-Path -LiteralPath ([IO.Path]::GetDirectoryName([string]`$q.f.prepared.app_backup_path)) 'cleanup live drift removed backup'";$new2="Assert-RXTrue (Test-Path -LiteralPath ([IO.Path]::GetDirectoryName([string]`$q.f.prepared.app_backup_path))) 'cleanup live drift removed backup'"
          if(([regex]::Matches($text,[regex]::Escape($old1))).Count-ne1){throw 'bounded parent housekeeping repair anchor drifted'};if(([regex]::Matches($text,[regex]::Escape($old2))).Count-ne1){throw 'bounded parent live-drift repair anchor drifted'}
          $patched=$text.Replace($old1,$new1).Replace($old2,$new2);[IO.File]::WriteAllText($parentTest,$patched,[Text.UTF8Encoding]::new($false));$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $parentTest),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("bounded parent runtime test line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw 'bounded parent runtime repair PS5.1 parse failed'}
          "FD_WORKTREE=$wt"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_WORKTREE_PASS'

      - name: Run exact bounded recovery matrix plus routing dispatch matrix twice
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:FD_WORKTREE 'validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1');if($LASTEXITCODE){throw "fixture dispatch matrix failed pass $_"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_MATRIX_REPEAT_PASS'

      - name: Rebuild exact routing hard-disabled candidate and SelfTest
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'routing hard-disabled parent build failed'};$a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1325619-or$ah-cne'e7f3ba6bc03cc4ff118f098778fe5ac7f308f1a99ecdc4149131ed2a8156579a'){throw 'routing hard-disabled Addon Manager drift'};if($rh-cne'04f27f865c5bc47065fad13a3b343a66ee595a8cf48f732ce916374181e3f142'){throw 'routing hard-disabled report drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control parent drift'}
          $s=Join-Path $env:RUNNER_TEMP 'fixture-dispatch-parent-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'routing hard-disabled parent SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_PARENT_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='165f820dff82a8c4e5edada443db595f545ddc03';$expected=@('.github/workflows/validate-custom-app-production-recovery-routing-fixture-dispatch-v010.yml','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1','validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_-notin$expected});if($bad.Count){throw "unexpected changed surface $($bad-join', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/addon-manager.ps1','bin/spotify-control.ps1','validation/custom-app-production-recovery-routing-hard-disabled-integration-v0.1.0/build_candidate.py','validation/custom-app-production-recovery-routing-admission-v0.1.0/custom-app-production-recovery-routing-admission.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}};if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_parent=$p;router_head='2f2f596bb8a86c0b074543992f7634be858821a4';bounded_executor_head='5a2840d824f1e28e2920657d0e3a8e139d7e8b71';github_actions_only=$true;runner_temp_confined=$true;fresh_router_revalidation_before_executor=$true;exact_bounded_executor_result_revalidated=$true;fixture_only_contract=$true;production_normal_path_wiring_added=$false;production_candidate_changed=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ROUTING_FIXTURE_DISPATCH_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-routing-fixture-dispatch-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/custom-app-production-recovery-routing-fixture-dispatch.ps1
            validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/test_custom_app_production_recovery_routing_fixture_dispatch.ps1
            validation/custom-app-production-recovery-routing-fixture-dispatch-v0.1.0/ci-evidence.json
          if-no-files-found: error