name: Validate Custom App Update Transaction Protocol v0.1.0

on:
  push:
    branches: [validate/custom-app-update-transaction-protocol-v0.1.0]
    paths:
      - 'validation/custom-app-update-transaction-protocol-v0.1.0/**'
      - '.github/workflows/validate-custom-app-update-transaction-protocol-v010.yml'
  pull_request:
    branches: [validate/custom-app-remote-binding-observer-v0.4.1]
    paths:
      - 'validation/custom-app-update-transaction-protocol-v0.1.0/**'
      - '.github/workflows/validate-custom-app-update-transaction-protocol-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact validation-only scope and v0.4.1 lineage
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='d92daa3006093a7d966083193302965ee01905f6'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Transaction protocol is not descended from exact validated v0.4.1 head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-update-transaction-protocol-v010.yml',
            'validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1',
            'validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Transaction validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected transaction validation file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during transaction validation.'}
          Write-Host "CUSTOM_APP_UPDATE_TX_SCOPE_PASS head=$actual"

      - name: Prove immutable validated input contracts
        shell: powershell
        run: |
          $pins=@(
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py','92eb87048eac882483bee1ed97bde598cff57e7b'),
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1','bd19cbb3da2087e68b2452fe62471d4eca2cd990'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('7402ea5c77e58cd072f0166411d40e7726093f3c','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('HEAD','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('HEAD','validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1','a2f3c1feb507bf5933206e46d7e4b35b4731036f')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned blob drift: $($p[1]) $blob != $($p[2])"}}
          $guard=(git show '57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b:validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1') -join "`n"
          foreach($m in @('function New-RequiredSpotifyPersistenceBackup','function Restore-SpotifyPersistenceBackup','Browser','Default','IndexedDB','Local Storage','Session Storage','WebStorage','Local State','Preferences','config-xpui.ini')){if($guard.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Pinned persistence guard contract missing: $m"}}
          Write-Host 'CUSTOM_APP_UPDATE_TX_INPUT_PINS_PASS'

      - name: Parse transaction protocol and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @('validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){
              $errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)}
              throw "PS5.1 parse failed: $file"
            }
          }
          Write-Host 'CUSTOM_APP_UPDATE_TX_PS51_PARSE_PASS'

      - name: Audit transaction core as network-free and production-authority denied
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1' -Raw
          foreach($forbidden in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','System.Net.Http','spicetify apply','spicetify config','$env:APPDATA','$env:LOCALAPPDATA')){if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Forbidden transaction-core capability: $forbidden"}}
          foreach($required in @('custom-app-update-transaction-v1','production_mutation_authorized=$false','fixture_apply_authorized=$true','stage-vcs-metadata-forbidden','live-git-file-indirection-forbidden','Transaction plan is stale: live tree changed.','Persistence verification failed after apply','rollback-failed','replay/stale transaction denied')){if($core.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Transaction safety marker missing: $required"}}
          if($core.IndexOf('production_mutation_authorized=$true',[StringComparison]::OrdinalIgnoreCase) -ge 0){throw 'Production mutation authority escaped into transaction protocol.'}
          Write-Host 'CUSTOM_APP_UPDATE_TX_STATIC_AUDIT_PASS'

      - name: Run transaction acceptance matrix twice
        shell: powershell
        run: |
          1..2|ForEach-Object{
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1'
            if($LASTEXITCODE -ne 0){throw "Transaction acceptance matrix failed on pass $_."}
          }
          Write-Host 'CUSTOM_APP_UPDATE_TX_MATRIX_REPEAT_PASS'

      - name: Rebuild exact v0.4.1 parent candidate and replay full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build
          if($LASTEXITCODE -ne 0){throw 'Exact parent v0.4.1 candidate rebuild failed.'}
          $main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1'
          $mainHash=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if($mainHash -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Parent Spotify Control hash drift: $mainHash"}
          $addonHash=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();$addonSize=(Get-Item $addon).Length
          if($addonSize -ne 523216 -or $addonHash -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $addonSize/$addonHash"}
          $root=Join-Path $env:RUNNER_TEMP 'update-tx-parent-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          $addonText=Get-Content $addon -Raw
          foreach($m in @('function New-RequiredSpotifyPersistenceBackup','function Restore-SpotifyPersistenceBackup','Lifecycle/settings core self-test passed: user-removal tombstones, reinstalls, safe local discovery, persistence drift detection, and exact restore are verified.')){if($addonText.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Parent persistence self-test marker missing: $m"}}
          Write-Host 'CUSTOM_APP_UPDATE_TX_PARENT_PERSISTENCE_SELFTEST_PASS'

      - name: Replay validated source baseline and binding component matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1';if($LASTEXITCODE -ne 0){throw 'Remote-source matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1';if($LASTEXITCODE -ne 0){throw 'Release-continuity matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-local-runtime-baseline-v0.1.0/test_custom_app_local_runtime_baseline.ps1';if($LASTEXITCODE -ne 0){throw 'Local runtime baseline matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1';if($LASTEXITCODE -ne 0){throw 'Remote binding state matrix regressed.'}
          Write-Host 'CUSTOM_APP_UPDATE_TX_COMPONENT_REPLAY_PASS'

      - name: Prove parent production and authority surfaces remain immutable
        shell: powershell
        run: |
          $parent='d92daa3006093a7d966083193302965ee01905f6';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@('.github/workflows/validate-custom-app-update-transaction-protocol-v010.yml','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1')
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected transaction changed surface: $($bad -join ', ')"}
          foreach($path in @('manifest.json','stable-version.json','validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1')){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_UPDATE_TX_IMMUTABILITY_PASS'

      - name: Write validation evidence
        shell: powershell
        run: |
          $e=[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_parent='d92daa3006093a7d966083193302965ee01905f6';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';protocol='custom-app-update-transaction-v1';production_mutation_authority=$false;network_capability=$false;fixture_apply_only=$true;matrix='pass-twice';component_replay='pass';persistence_guard_contract='exact-v0.4.1-parent-addon-selftest-pass'}
          $e|ConvertTo-Json -Depth 5|Set-Content 'validation/custom-app-update-transaction-protocol-v0.1.0/ci-evidence.json' -Encoding UTF8

      - name: Upload transaction protocol validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-update-transaction-protocol-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1
            validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1
            validation/custom-app-update-transaction-protocol-v0.1.0/ci-evidence.json
