name: HOLD R77 inspect real v0.6.30 updater ACL guard semantics
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - validation/spotify-exit-immediate-maintenance-HOLD/inspect-real-guard-acl-R77-HOLD.py
      - .github/workflows/inspect-real-guard-acl-R77-HOLD.yml
permissions: {contents: read}
jobs:
  inspect-existing-real-source-compatibility:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Reconstruct existing exact v0.6.30 candidate and inspect current compatibility gate without running Spotify/Spicetify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'R77_PRODUCTION_BASE_DRIFT'}
          $d='validation/spotify-exit-immediate-maintenance-HOLD/'
          foreach($s in @('build-combined-exit-and-shortcut-R37-HOLD.py','build-eventdriven-vbs-R45-HOLD.py','build-single-discovery-maintenance-R49-HOLD.py','build-shared-maintenance-lock-R54-HOLD.py','build-rapid-restart-vbs-R58-HOLD.py','build-wmi-selfheal-R63-HOLD.py','build-wmi-rebind-R66-HOLD.py','build-wmi-logon-recovery-R69-HOLD.py','build-boot-wmi-release-R70-HOLD.py','inspect-real-guard-acl-R77-HOLD.py')){
            & python ($d+$s)
            if($LASTEXITCODE -ne 0){throw ('R77_REBUILD_OR_READONLY_SOURCE_SURVEY_FAILED_'+$s)}
          }
          Write-Host 'R77_UNMODIFIED_FULL_MAIN_COMPATIBILITY_AUDIT=COMPLETE'
          Write-Host 'R77_OWNER_PC_AND_RELEASE=UNTOUCHED'
