name: Validate Custom App Production Dual-ID Bridge-Aware Spicetify Apply Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-bridge-aware-post-swap-apply-admission-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage PS5.1 AST barriers zero-authority and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='f8ef821adb7c080ab71cc6d4d5d54a8c42e344a2';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact dual-ID post-swap admission head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0'
          $core="$d/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor.ps1";$test="$d/test_custom_app_production_dual_id_bridge_aware_spicetify_apply_executor.ps1";$prep="$d/prepare_custom_app_production_dual_id_bridge_aware_spicetify_apply_executor.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v010.yml'
          $allowed=@($core,$test,$prep,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p-notin$changed){throw "missing changed surface $p"}}
          $pins=@(@($core,'963bc3b250e4c496d5fc678e5656c454af2740b6'),@($test,'91494bc4ad38b0580527d7b1812e85f547e10bbe'),@($prep,'35dda8aba8757ca7fa6958311cae172eeeeeef9e'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$test,$prep)){
            $tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"}
            $badCommands=@($ast.FindAll({param($node) if($node -isnot [Management.Automation.Language.CommandAst]){return $false};$name=$node.GetCommandName();return(-not[string]::IsNullOrWhiteSpace($name)-and$name-match'^(?i:return|throw).+')},$true))
            if($badCommands.Count){$badCommands|ForEach-Object{Write-Error ("ambiguous keyword command in $p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)>")};throw "PS5.1 keyword lexical boundary failed $p"}
          }
          $raw=Get-Content $core -Raw
          foreach($m in @('permit_transaction_id','journal_transaction_id','apply-starting','apply-returned-success-pending-verification','apply-verified','rollback-required','rollback-complete','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','Invoke-CustomAppProductionSpicetifyApplyRollbackV010','ApplyResultFingerprint','Get-CustomAppProductionDualIdBridgeAwareSpicetifyApplyAppendTimeV010','Test-CustomAppProductionDualIdBridgeAwarePostSwapApplyAdmissionDecisionV010','Resolve-CustomAppProductionDualIdBridgeAwarePostSwapApplyAdmissionV010','result_is_authority=$false','production_mutation_authorized=$false')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Object Diagnostics.Process','Diagnostics.ProcessStartInfo','launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){if($raw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "forbidden core surface $badToken"}}
          if($raw-match'result_is_authority\s*=\s*\$true|apply_execution_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|additional_mutation_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped in dual-ID apply executor core'}
          $testRaw=Get-Content $test -Raw;foreach($m in @('DualIdApplyFake','fail-first','after-apply-starting-barrier-before-process','after-primary-success-before-pending-barrier','after-pending-barrier-before-verification','rollback-complete','wrong executable hash','prior-id-drift','cases=$count')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "byte-real test marker missing $m"}}
          foreach($badToken in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){foreach($p in @($core,$test,$prep)){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "managed/domainvpn boundary escaped in $p via $badToken"}}}
          $prepRaw=Get-Content $prep -Raw;foreach($m in @('prepare_custom_app_production_dual_id_bridge_aware_post_swap_apply_admission.ps1','fe07d410531ea13c8fca379b01405631a3763e84','f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a')){if($prepRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "preparer exact dependency marker missing $m"}}
          'DUAL_ID_BRIDGE_AWARE_SPICETIFY_APPLY_EXECUTOR_SCOPE_AST_AUTHORITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 60
        run: |
          $prep='validation/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_spicetify_apply_executor.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
          if($LASTEXITCODE){throw 'dependency preparation failed'}
          $generic='validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1';if((git hash-object $generic).Trim()-cne'f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a'){throw 'generic apply executor materialization drift'}
          'DUAL_ID_BRIDGE_AWARE_SPICETIFY_APPLY_EXECUTOR_DEPENDENCY_CHAIN_PASS'

      - name: Run byte-real dual-ID journal-aware apply matrix twice
        shell: powershell
        timeout-minutes: 320
        run: |
          $outer=$env:RUNNER_TEMP;$test='validation/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0/test_custom_app_production_dual_id_bridge_aware_spicetify_apply_executor.ps1'
          1..2|ForEach-Object{
            $pass=[int]$_;$runtime=Join-Path $outer ('dbax-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0
            try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DBAX_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}
            finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outer;$env:TMP=$outer}
            if($exit){throw "dual-ID journal-aware apply matrix failed pass $pass"}
          }
          'DUAL_ID_BRIDGE_AWARE_SPICETIFY_APPLY_EXECUTOR_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'}
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'}
          if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dbax-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_BRIDGE_AWARE_SPICETIFY_APPLY_EXECUTOR_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='f8ef821adb7c080ab71cc6d4d5d54a8c42e344a2';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dbax-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='963bc3b250e4c496d5fc678e5656c454af2740b6';test_blob='91494bc4ad38b0580527d7b1812e85f547e10bbe';preparer_blob='35dda8aba8757ca7fa6958311cae172eeeeeef9e';admission_head='f8ef821adb7c080ab71cc6d4d5d54a8c42e344a2';generic_apply_head='fe07d410531ea13c8fca379b01405631a3763e84';journal_head='7e26187e2360089024e9d72d0701be6f1577a1ef';permit_id_forward_only=$true;journal_id_recovery_only=$true;apply_starting_barrier=$true;apply_pending_barrier=$true;apply_verified_barrier=$true;rollback_required_before_restore=$true;rollback_complete_after_recovery_apply=$true;fake_apply_success_count=1;matrix_cases=7;matrix_repetitions=2;hard_disabled_candidate_unchanged=$true;managed_payload_changed=$false;launcher_or_shortcut_changed=$false;domainvpn_wrapper_changed=$false;production_main_changed=$false;production_mutation_authority=$false;validated_at=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out 'dual-id-bridge-aware-spicetify-apply-executor-validation.json') -Encoding UTF8
          'DUAL_ID_BRIDGE_AWARE_SPICETIFY_APPLY_EXECUTOR_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dbax-v010-evidence/dual-id-bridge-aware-spicetify-apply-executor-validation.json
          if-no-files-found: error
          retention-days: 14
