name: Fix CSS Provenance v0.1.0 PS5.1 INI parser

on:
  push:
    branches:
      - validate/performance-phase2-css-provenance-v0.1.0
    paths:
      - '.github/workflows/fix-css-provenance-v010-ps51.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact PowerShell 5.1 compatible split fix
        shell: powershell
        run: |
          $p='validation/css-provenance-v0.1.0/css-provenance-collector.ps1'
          $s=[IO.File]::ReadAllText((Resolve-Path $p))
          $pattern='(?m)^\s*\$parts = \$trim\.Split\(@\(''=''\), 2\)\r?\n\s*\$key = \$parts\[0\]\.Trim\(\); \$value = \$parts\[1\]\.Trim\(\)$'
          $rx=New-Object Text.RegularExpressions.Regex($pattern,[Text.RegularExpressions.RegexOptions]::Multiline)
          if($rx.Matches($s).Count -ne 1){throw 'Expected exact INI parser block not found once.'}
          $new="        `$eq = `$trim.IndexOf('=')`r`n        `$key = `$trim.Substring(0,`$eq).Trim(); `$value = `$trim.Substring(`$eq+1).Trim()"
          $s=$rx.Replace($s,$new,1)
          [IO.File]::WriteAllText((Resolve-Path $p),$s,(New-Object Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $p
          git commit -m 'Fix CSS collector INI parsing on PowerShell 5.1'
          git push origin HEAD:validate/performance-phase2-css-provenance-v0.1.0
