name: Fix CSS Provenance v0.1.0 PS5.1 INI parser

on:
  push:
    branches:
      - validate/performance-phase2-css-provenance-v0.1.0
    paths:
      - '.github/workflows/fix-css-provenance-v010-ps51.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact PowerShell 5.1 compatible split fix
        shell: powershell
        run: |
          @'
          from pathlib import Path
          p=Path('validation/css-provenance-v0.1.0/css-provenance-collector.ps1')
          s=p.read_text(encoding='utf-8')
          old1="        $parts = $trim.Split(@('='), 2)\n"
          old2="        $key = $parts[0].Trim(); $value = $parts[1].Trim()\n"
          new1="        $eq = $trim.IndexOf('=')\n"
          new2="        $key = $trim.Substring(0,$eq).Trim(); $value = $trim.Substring($eq+1).Trim()\n"
          assert s.count(old1)==1, f'expected old split line exactly once, got {s.count(old1)}'
          assert s.count(old2)==1, f'expected old key/value line exactly once, got {s.count(old2)}'
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          assert '$trim.Split(@(\'=\'), 2)' not in s
          assert s.count(new1)==1 and s.count(new2)==1
          p.write_text(s,encoding='utf-8',newline='\n')
          print('CSS_PROVENANCE_PS51_FIX_APPLIED')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Python PS5.1 collector fix failed.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/css-provenance-v0.1.0/css-provenance-collector.ps1
          if(git diff --cached --quiet){throw 'PS5.1 collector fix produced no change.'}
          git commit -m 'Fix CSS collector INI parsing on PowerShell 5.1'
          git push origin HEAD:validate/performance-phase2-css-provenance-v0.1.0
