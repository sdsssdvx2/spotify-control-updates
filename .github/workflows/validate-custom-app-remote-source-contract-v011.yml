name: Validate Custom App Remote Source Contract v0.1.1

on:
  push:
    branches:
      - validate/custom-app-remote-source-contract-v0.1.1
    paths:
      - 'validation/custom-app-remote-source-contract-v0.1.1/**'
      - '.github/workflows/validate-custom-app-remote-source-contract-v011.yml'
  pull_request:
    branches:
      - validate/custom-app-remote-source-contract-v0.1.0
    paths:
      - 'validation/custom-app-remote-source-contract-v0.1.1/**'
      - '.github/workflows/validate-custom-app-remote-source-contract-v011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact amendment-only scope and v0.1.0 lineage
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='b53bcf39f715f1c35c7d1f99e157cdecb0a2a572'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'v0.1.1 amendment is not descended from exact validated v0.1.0 contract head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-remote-source-contract-v011.yml',
            'validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1',
            'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "v0.1.1 amendment scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected v0.1.1 file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during v0.1.1 validation.'}
          Write-Host "CUSTOM_APP_REMOTE_SOURCE_V011_SCOPE_PASS head=$actual"

      - name: Prove validated v0.1.0 and amendment blob identities
        shell: powershell
        run: |
          $pins=@(
            @('b53bcf39f715f1c35c7d1f99e157cdecb0a2a572','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('b53bcf39f715f1c35c7d1f99e157cdecb0a2a572','validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1','346355bcbbba6066b70a965028bb11f946b4da99'),
            @('HEAD','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('HEAD','validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1','1bd80059ec8d06d72874692ec425b20663afbe9e')
          )
          foreach($pin in $pins){$blob=(git rev-parse "$($pin[0])`:$($pin[1])").Trim();if($blob -cne $pin[2]){throw "Pinned blob drift: $($pin[1]) $blob != $($pin[2])"}}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_BLOB_PIN_PASS'

      - name: Prove real versioned unique-ZIP release naming from pinned Tagify releases
        shell: powershell
        run: |
          $headers=@{'User-Agent'='Spotify-Control-Validation';'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $r331=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/alexk218/tagify/releases/416245914'
          $r332=Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/alexk218/tagify/releases/418974188'
          if([int64]$r331.id -ne 416245914 -or [string]$r331.tag_name -cne 'v3.3.1'){throw 'Pinned Tagify v3.3.1 release drift.'}
          if([int64]$r332.id -ne 418974188 -or [string]$r332.tag_name -cne 'v3.3.2'){throw 'Pinned Tagify v3.3.2 release drift.'}
          $z331=@($r331.assets|Where-Object{([string]$_.name).EndsWith('.zip',[StringComparison]::OrdinalIgnoreCase)})
          $z332=@($r332.assets|Where-Object{([string]$_.name).EndsWith('.zip',[StringComparison]::OrdinalIgnoreCase)})
          if($z331.Count -ne 1 -or $z332.Count -ne 1){throw 'Pinned Tagify releases no longer demonstrate unique-ZIP selection.'}
          if([string]$z331[0].name -cne 'tagify-v3.3.1.zip' -or [string]$z332[0].name -cne 'tagify-v3.3.2.zip'){throw 'Pinned Tagify versioned asset names drifted.'}
          if([string]$z331[0].digest -cne 'sha256:b7510e525297c297d6007305acef947c35bf2df34e0fae492c41a31f555db957'){throw 'Pinned Tagify v3.3.1 asset digest drift.'}
          if([string]$z332[0].digest -cne 'sha256:5261538c8f596cf179b1f6efd20e0a0a60c73b4cd765115fc6bc25c6a6b3b76b'){throw 'Pinned Tagify v3.3.2 asset digest drift.'}
          if([string]$z331[0].name -ceq [string]$z332[0].name){throw 'Fixture no longer proves versioned asset-name change.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_REAL_RELEASE_FIXTURE_PASS'

      - name: Parse base and amendment with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1',
            'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1',
            'validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1',
            'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file :: $($_.Message)"};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_PS51_PARSE_PASS'

      - name: Re-run exact validated v0.1.0 41-case matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1'
          if($LASTEXITCODE -ne 0){throw 'Validated v0.1.0 41-case matrix regressed.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V010_MATRIX_REPLAY_PASS'

      - name: Run v0.1.1 unique-ZIP continuity amendment matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1'
          if($LASTEXITCODE -ne 0){throw 'v0.1.1 release-continuity matrix failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_MATRIX_PASS'

      - name: Audit amendment as side-effect-free and authority-denied
        shell: powershell
        run: |
          $patch=Get-Content 'validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1' -Raw
          foreach($forbidden in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','Copy-Item','Move-Item','Remove-Item','Set-Content','Out-File','Add-Content','New-Item','spicetify apply','spicetify config','git clone','git fetch','git checkout')){
            if($patch.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "v0.1.1 amendment gained forbidden side effect/network primitive: $forbidden"}
          }
          foreach($marker in @('release_zip_asset_count','release-zip-asset-not-unique','unique-zip-asset','Resolve-CustomAppRemoteSourceContract -ProvenanceRow','Test-CustomAppRemoteSourceMutationAuthority -Decision')){
            if($patch.IndexOf($marker,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "v0.1.1 safety marker missing: $marker"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_PURE_AMENDMENT_AUDIT_PASS'

      - name: Rebuild exact validated observer parent and rerun full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py' --build
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent rebuild failed.'}
          $addon='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/addon-manager.ps1';$main='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/spotify-control.ps1'
          $as=(Get-Item $addon).Length;$ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();$ms=(Get-Item $main).Length;$mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant()
          if($as -ne 428643 -or $ah -cne '8de197a78e40faad6e934c0eef4bb123f6652fc6e35cf440733c813c6df86e52'){throw "Observer parent Addon Manager drift: $as/$ah"}
          if($ms -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Observer parent Spotify Control drift: $ms/$mh"}
          $root=Join-Path $env:RUNNER_TEMP 'remote-source-v011-parent-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_PARENT_REBUILD_SELFTEST_PASS'

      - name: Prove production and v0.1.0 parent remain immutable
        shell: powershell
        run: |
          $parent='b53bcf39f715f1c35c7d1f99e157cdecb0a2a572';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@('.github/workflows/validate-custom-app-remote-source-contract-v011.yml','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1')
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected v0.1.1 changed surface: $($bad -join ', ')"}
          foreach($path in @('bin/spotify-control.ps1','bin/addon-manager.ps1','manifest.json','stable-version.json','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1')){
            git diff --quiet $parent HEAD -- $path
            if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_SOURCE_V011_IMMUTABILITY_PASS'

      - name: Upload v0.1.1 amendment validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-remote-source-contract-v011-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1
            validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1
