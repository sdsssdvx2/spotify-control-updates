name: Validate v0.6.21 r10 Runtime Acceptance v2.0.3

on:
  push:
    branches:
      - validate/v0.6.21-runtime-acceptance-v2.0.3
    paths:
      - 'validation/v0.6.21-runtime-acceptance-v2.0.3/**'
      - '.github/workflows/validate-v0.6.21-runtime-acceptance-v203.yml'
  pull_request:
    paths:
      - 'validation/v0.6.21-runtime-acceptance-v2.0.3/**'
      - '.github/workflows/validate-v0.6.21-runtime-acceptance-v203.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact release-derived validation scope
        shell: powershell
        run: |
          $base='5eac4f39920b84f22e2a5ee07422f6080bfc7ef7'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Runtime acceptance v2.0.3 is not based on exact release head.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@(
            'validation/v0.6.21-runtime-acceptance-v2.0.3/build_acceptance.py',
            'validation/v0.6.21-runtime-acceptance-v2.0.3/source-b64/chunk-000.txt',
            'validation/v0.6.21-runtime-acceptance-v2.0.3/source-b64/chunk-001.txt',
            'validation/v0.6.21-runtime-acceptance-v2.0.3/source-b64/chunk-002.txt',
            'validation/v0.6.21-runtime-acceptance-v2.0.3/source-b64/chunk-003.txt',
            'validation/v0.6.21-runtime-acceptance-v2.0.3/source-b64/chunk-004.txt',
            '.github/workflows/validate-v0.6.21-runtime-acceptance-v203.yml'
          )
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 7){throw "Expected exactly 7 validation-only files; got $($changed.Count): $($changed -join ' , ')"}
          Write-Host "V0621_RUNTIME_ACCEPTANCE_V203_SCOPE_PASS head=$actual"

      - name: Compile and build exact deterministic acceptance package
        shell: powershell
        run: |
          $dir='validation/v0.6.21-runtime-acceptance-v2.0.3'
          python -m py_compile "$dir/build_acceptance.py"
          if($LASTEXITCODE -ne 0){throw 'Acceptance v2.0.3 builder Python compile failed.'}
          python "$dir/build_acceptance.py"
          if($LASTEXITCODE -ne 0){throw 'Initial acceptance v2.0.3 package build failed.'}
          $zip=Join-Path $dir 'out/SpotifyControl-v0.6.21-r10-Runtime-Acceptance-v2.0.3.zip'
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $zip).Length
          if($size -ne 56604 -or $hash -cne '651195ec07fb49c3bc96f5d1a26af77418d8709db1ce78986634410a472f48b4'){throw "Cross-platform deterministic package identity mismatch: size=$size sha=$hash"}
          "$hash|$size" | Set-Content $env:RUNNER_TEMP\acceptance-v203-first.txt -Encoding ASCII
          Write-Host "V0621_RUNTIME_ACCEPTANCE_V203_BUILD_IDENTITY_PASS $hash $size"

      - name: Reconstruct exact release candidate identities
        shell: powershell
        run: |
          python validation/v0.6.21/build_v0621.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.6.21 candidate rebuild failed.'}
          $main='validation/v0.6.21/out/bin/spotify-control.ps1'
          $addon='validation/v0.6.21/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 281579 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f97c78c905b83e90e58a24035febcaccc27cb12113ae9cbc64acdc79f5853828'){throw 'v0.6.21 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 250616 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2'){throw 'r10 addon identity mismatch.'}
          Write-Host 'V0621_RUNTIME_ACCEPTANCE_V203_RELEASE_IDENTITY_PASS'

      - name: Parse generated sources with Windows PowerShell 5.1
        shell: powershell
        run: |
          $gen='validation/v0.6.21-runtime-acceptance-v2.0.3/generated'
          foreach($name in @('RUN_RUNTIME_ACCEPTANCE.ps1','PRECHECK_RUNTIME_ACCEPTANCE.ps1','BOOTSTRAP_RUNNER.ps1')){
            $p=Join-Path $gen $name;$tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}:{1}: {2}" -f $name,$_.Extent.StartLineNumber,$_.Message)};throw "PowerShell 5.1 parse failed: $name"}
          }
          Write-Host 'V0621_RUNTIME_ACCEPTANCE_V203_PS51_PARSE_PASS'

      - name: Runtime helper and manifest-shim self-tests
        shell: powershell
        run: |
          $gen='validation/v0.6.21-runtime-acceptance-v2.0.3/generated'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $gen 'BOOTSTRAP_RUNNER.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Bootstrap manifest-shim runner self-test failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $gen 'RUN_RUNTIME_ACCEPTANCE.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Runtime acceptance helper self-test failed.'}
          Write-Host 'V0621_RUNTIME_ACCEPTANCE_V203_HELPER_SELFTEST_PASS'

      - name: Fetch exact immutable release-head manifest over GitHub HTTPS
        shell: powershell
        run: |
          $gen='validation/v0.6.21-runtime-acceptance-v2.0.3/generated'
          $runner=(Resolve-Path (Join-Path $gen 'BOOTSTRAP_RUNNER.ps1')).Path
          $url='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/5eac4f39920b84f22e2a5ee07422f6080bfc7ef7/manifest.json'
          $out=Join-Path $env:RUNNER_TEMP 'v203-release-head-manifest.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -FetchUrl $url -OutputPath $out -TimeoutSec 20
          if($LASTEXITCODE -ne 0){throw 'Exact release-head manifest HTTPS fetch failed.'}
          $remote=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant();$checkout=(Get-FileHash manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if($remote -cne $checkout){throw "Release-head raw manifest differs from checkout: remote=$remote checkout=$checkout"}
          $m=Get-Content $out -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.21' -or $m.source_commit -ne '9a90d5f13eb63023d8f965a004be14d309d99429' -or $m.payload_set_sha256 -ne '7bd1bd7559eee615f4e0aa049b3ec1574f6b215dbdf7417a0a57ea99b20b6c55'){throw 'Fetched release-head manifest identity mismatch.'}
          "{0}|{1}" -f $remote,(Get-Item $out).Length | Set-Content $env:RUNNER_TEMP\v203-manifest-identity.txt -Encoding ASCII
          Write-Host "V0621_RUNTIME_ACCEPTANCE_V203_HTTPS_MANIFEST_PASS sha=$remote size=$((Get-Item $out).Length)"

      - name: Download exact previously validated Bootstrap 1.0.6 carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > validated-v0614-repair-artifact.zip
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib,zipfile
          outer=Path('validated-v0614-repair-artifact.zip').read_bytes()
          with zipfile.ZipFile(BytesIO(outer)) as z:
              assert z.testzip() is None
              inner=z.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          assert len(inner)==30856 and hashlib.sha256(inner).hexdigest()=='6b6d5d9e8ac44fc77bb95918164a3c862f14494c329fdfd267bd95f6c6ddcf06'
          with zipfile.ZipFile(BytesIO(inner)) as z: boot=z.read('bootstrap/spotify-control-self-updater.ps1')
          assert len(boot)==42963 and hashlib.sha256(boot).hexdigest()=='d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'
          print('V203_VALIDATED_BOOTSTRAP_V106_CARRIER_PASS')
          PY

      - name: Exact Bootstrap 1.0.6 cycle through pinned-manifest shim and real patch HTTPS
        shell: powershell
        run: |
          python validation/v0.6.21-bootstrap-e2e/prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'Exact v0.6.20 fixture preparation failed.'}
          $fixture=(Resolve-Path 'ci-bootstrap-fixture-v0620-to-v0621').Path
          $root=Join-Path $fixture 'LocalAppData\SpotifyControl';$bin=Join-Path $root 'bin';$reports=Join-Path $root 'reports'
          $bootExact=Join-Path $root 'bootstrap\spotify-control-self-updater.ps1'
          $manifest=Join-Path $env:RUNNER_TEMP 'v203-release-head-manifest.json'
          $runner=(Resolve-Path 'validation/v0.6.21-runtime-acceptance-v2.0.3/generated/BOOTSTRAP_RUNNER.ps1').Path
          $mainUrl='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/main/manifest.json'
          $env:LOCALAPPDATA=Join-Path $fixture 'LocalAppData';$env:APPDATA=Join-Path $fixture 'Roaming';New-Item -ItemType Directory -Force -Path $env:APPDATA|Out-Null
          function AssertId($path,$size,$sha,$label){if((Get-Item $path).Length -ne $size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw "$label identity mismatch"}}
          AssertId $bootExact 42963 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' 'exact Bootstrap'
          $manifestSha=(Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          function RunBoot([string]$a){
            $rp=Join-Path $reports 'self-update-latest.json';$shim=Join-Path $env:RUNNER_TEMP ("v203-shim-$a.json")
            Remove-Item -LiteralPath $rp,$shim -Force -ErrorAction SilentlyContinue
            $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -BootstrapPath $bootExact -Action $a -ManifestPath $manifest -ExpectedManifestUrl $mainUrl -ShimEvidencePath $shim 2>&1;$ec=$LASTEXITCODE;$out|ForEach-Object{Write-Host $_}
            if($ec -ne 0){throw "Bootstrap $a via manifest shim failed exit=$ec"}
            if(-not(Test-Path $rp) -or -not(Test-Path $shim)){throw "Bootstrap $a report/shim evidence missing"}
            $rep=Get-Content $rp -Raw|ConvertFrom-Json;$se=Get-Content $shim -Raw|ConvertFrom-Json
            if(-not$rep.success -or $rep.action -ne $a -or $rep.bootstrap_version -ne '1.0.6' -or $rep.manifest_url -ne $mainUrl){throw "Bootstrap $a report invalid"}
            if([int]$se.hits -ne 1 -or $se.action -ne $a -or $se.uri -ne $mainUrl -or $se.manifest_sha256 -ne $manifestSha -or $se.bootstrap_sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){throw "Bootstrap $a shim evidence invalid"}
            return $rep
          }
          $c=RunBoot 'Check';if($c.installed_version -ne '0.6.20' -or [int]$c.result.edge_count -ne 1 -or $c.result.already_current){throw 'Exact manifest-shim Check evidence invalid.'}
          $rb=RunBoot 'RollbackTest';if($rb.transaction_status -ne 'rolled-back'){throw 'Exact manifest-shim RollbackTest evidence invalid.'}
          AssertId (Join-Path $bin 'spotify-control.ps1') 281585 'e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18' 'rollback main'
          AssertId (Join-Path $bin 'addon-manager.ps1') 225044 '3a20fcd552b363ebc05e26854a8fe010ffe50e5c756ebd3d7fca54011e8a8b86' 'rollback addon'
          $u=RunBoot 'Update';if($u.transaction_status -ne 'committed'){throw 'Exact manifest-shim Update evidence invalid.'}
          AssertId (Join-Path $bin 'spotify-control.ps1') 281579 'f97c78c905b83e90e58a24035febcaccc27cb12113ae9cbc64acdc79f5853828' 'updated main'
          AssertId (Join-Path $bin 'addon-manager.ps1') 250616 '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2' 'updated addon'
          $pc=RunBoot 'Check';if($pc.installed_version -ne '0.6.21' -or $pc.result.already_current -ne $true -or [int]$pc.result.edge_count -ne 0){throw 'Exact manifest-shim post-Check evidence invalid.'}
          AssertId $bootExact 42963 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' 'final exact Bootstrap'
          Write-Host 'V0621_RUNTIME_ACCEPTANCE_V203_EXACT_BOOTSTRAP_CYCLE_PASS'

      - name: Prove repeated package determinism and internal checksums
        shell: powershell
        run: |
          $dir='validation/v0.6.21-runtime-acceptance-v2.0.3';$first=(Get-Content $env:RUNNER_TEMP\acceptance-v203-first.txt -Raw).Trim()
          python "$dir/build_acceptance.py";if($LASTEXITCODE -ne 0){throw 'Second acceptance build failed.'}
          $zip=Join-Path $dir 'out/SpotifyControl-v0.6.21-r10-Runtime-Acceptance-v2.0.3.zip';$second="{0}|{1}" -f (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant(),(Get-Item $zip).Length
          if($first -cne $second){throw "Acceptance build nondeterministic: $first != $second"}
          if($second -cne '651195ec07fb49c3bc96f5d1a26af77418d8709db1ce78986634410a472f48b4|56604'){throw "Acceptance package identity drift: $second"}
          Add-Type -AssemblyName System.IO.Compression.FileSystem;$z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip));try{
            $names=@($z.Entries|ForEach-Object{$_.FullName});foreach($required in @('RUN_RUNTIME_ACCEPTANCE.ps1','RUN_RUNTIME_ACCEPTANCE.cmd','PRECHECK_RUNTIME_ACCEPTANCE.ps1','BOOTSTRAP_RUNNER.ps1','README.txt','SHA256SUMS.txt','evidence/SELF_VALIDATION_REPORT.json')){if($required -notin $names){throw "Package missing $required"}}
            if($names -contains 'LOCAL_MANIFEST_SERVER.ps1'){throw 'Retired localhost server leaked into v2.0.3 package.'}
            $entry=$z.GetEntry('evidence/SELF_VALIDATION_REPORT.json');$sr=New-Object IO.StreamReader($entry.Open());try{$report=$sr.ReadToEnd()|ConvertFrom-Json}finally{$sr.Dispose()};if([int]$report.passed -ne [int]$report.total -or [int]$report.total -ne 88){throw "Source validation not fully green: $($report.passed)/$($report.total)"}
          }finally{$z.Dispose()}
          Write-Host "V0621_RUNTIME_ACCEPTANCE_V203_PACKAGE_PASS $second"

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-v0.6.21-r10-Runtime-Acceptance-v2.0.3
          path: validation/v0.6.21-runtime-acceptance-v2.0.3/out/SpotifyControl-v0.6.21-r10-Runtime-Acceptance-v2.0.3.zip
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup fixture trees
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath ci-bootstrap-fixture-v0620-to-v0621 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ci-bootstrap-fixture -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath validated-v0614-repair-artifact.zip -Force -ErrorAction SilentlyContinue
