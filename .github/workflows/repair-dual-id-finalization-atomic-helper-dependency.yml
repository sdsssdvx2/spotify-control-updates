name: Repair dual-ID finalization atomic helper dependency

on:
  push:
    branches:
      - validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact repair scope and qualified atomic helper owner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='0aa3ab056c7ee70fc5ad92943d01dde5e5a536d3'
          $repair='.github/workflows/repair-dual-id-finalization-atomic-helper-dependency.yml'
          if((git merge-base $base HEAD).Trim() -cne $base){throw 'repair head not descended from exact failed-matrix head'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $delta=@(git diff --name-only "$base...HEAD");foreach($p in $delta){if($p -cne $repair){throw "repair scope escaped before patch: $p"}}
          $atomicHead='cb2e50b715a7d7f1bbc7b3b810104cefff7f7d50'
          $atomicPath='validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/custom-app-production-recovery-aware-permit-atomic-live-swap.ps1'
          $atomicBlob='e3506fd65de02978b4c79c1a367461b5496ae3b9'
          git cat-file -e "$atomicHead^{commit}" 2>$null;if($LASTEXITCODE){git fetch --no-tags origin $atomicHead|Out-Null;if($LASTEXITCODE){throw '#183 exact fetch failed'}}
          if((git rev-parse "$atomicHead`:$atomicPath").Trim() -cne $atomicBlob){throw '#183 atomic core pin drift'}
          $q=(git show "$atomicHead`:$atomicPath") -join "`n";if($LASTEXITCODE){throw '#183 atomic core read failed'}
          if($q.IndexOf('function Remove-CustomAppProductionRecoveryAwarePermitAtomicTransactionV010',[StringComparison]::Ordinal)-lt0){throw '#183 canonical transaction cleanup helper missing'}
          'DUAL_ID_FINALIZATION_ATOMIC_HELPER_DEPENDENCY_PREMISE_PASS'

      - name: Materialize and dot-source exact qualified atomic helper owner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prep='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_finalization.ps1'
          $test='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/test_custom_app_production_dual_id_bridge_aware_finalization.ps1'
          $prepRaw=[IO.File]::ReadAllText((Resolve-Path $prep));$testRaw=[IO.File]::ReadAllText((Resolve-Path $test))
          $finalDep="  @('0c32a30cf61dc9f3e61725d30d5df1df9a73ef56','validation/custom-app-production-recovery-aware-permit-transaction-finalization-v0.1.0/custom-app-production-recovery-aware-permit-transaction-finalization.ps1','9c725e47d432addac24fe4a6cd59e37af393b6c7')"
          $atomicDep="  @('cb2e50b715a7d7f1bbc7b3b810104cefff7f7d50','validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/custom-app-production-recovery-aware-permit-atomic-live-swap.ps1','e3506fd65de02978b4c79c1a367461b5496ae3b9'),`r`n"
          if(([regex]::Matches($prepRaw,[regex]::Escape($finalDep))).Count-ne1){throw 'finalization dependency anchor count mismatch'}
          if($prepRaw.IndexOf("'cb2e50b715a7d7f1bbc7b3b810104cefff7f7d50'",[StringComparison]::Ordinal)-ge0){throw '#183 dependency already present unexpectedly'}
          $prepFixed=$prepRaw.Replace($finalDep,$atomicDep+$finalDep)

          $finalSource=". (Join-Path `$root 'validation/custom-app-production-recovery-aware-permit-transaction-finalization-v0.1.0/custom-app-production-recovery-aware-permit-transaction-finalization.ps1')"
          $atomicSource=". (Join-Path `$root 'validation/custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/custom-app-production-recovery-aware-permit-atomic-live-swap.ps1')`r`n"
          if(([regex]::Matches($testRaw,[regex]::Escape($finalSource))).Count-ne1){throw 'finalization dot-source anchor count mismatch'}
          if($testRaw.IndexOf('custom-app-production-recovery-aware-permit-atomic-live-swap-v0.1.0/custom-app-production-recovery-aware-permit-atomic-live-swap.ps1',[StringComparison]::Ordinal)-ge0){throw '#183 dot-source already present unexpectedly'}
          $testFixed=$testRaw.Replace($finalSource,$atomicSource+$finalSource)

          [IO.File]::WriteAllText((Resolve-Path $prep),$prepFixed,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Resolve-Path $test),$testFixed,(New-Object Text.UTF8Encoding($false)))
          foreach($p in @($prep,$test)){$tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw "PS5.1 parse failed after dependency repair: $p"}}
          $diff=@(git diff --name-only);if($diff.Count-ne2-or$prep-notin$diff-or$test-notin$diff){throw "dependency repair escaped expected files: $($diff -join ', ')"}
          'DUAL_ID_FINALIZATION_ATOMIC_HELPER_DEPENDENCY_REPAIR_READY'

      - name: Commit validation-only dependency repair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prep='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_finalization.ps1'
          $test='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/test_custom_app_production_dual_id_bridge_aware_finalization.ps1'
          git config user.name 'spotify-control-validation-bot';git config user.email '98333820+sdsssdvx2@users.noreply.github.com'
          git add -- $prep $test;git commit -m 'validation: load qualified atomic finalization helper';if($LASTEXITCODE){throw 'dependency repair commit failed'}
          git push origin HEAD:validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0;if($LASTEXITCODE){throw 'dependency repair push failed'}
          'DUAL_ID_FINALIZATION_ATOMIC_HELPER_DEPENDENCY_REPAIR_PUSHED'
