name: Validate Custom App Promotion Eligibility Gate v0.1.0

on:
  push:
    branches: [validate/custom-app-promotion-eligibility-gate-v0.1.0]
    paths:
      - 'validation/custom-app-promotion-eligibility-gate-v0.1.0/**'
      - '.github/workflows/validate-custom-app-promotion-eligibility-v010.yml'
  pull_request:
    branches: [validate/custom-app-shadow-executor-v0.1.0]
    paths:
      - 'validation/custom-app-promotion-eligibility-gate-v0.1.0/**'
      - '.github/workflows/validate-custom-app-promotion-eligibility-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact eligibility-only scope, shadow lineage, and frozen production
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='22eb3561843fbe4016023d527186aa629512b67d'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Promotion eligibility gate is not descended from exact validated shadow head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-promotion-eligibility-v010.yml',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Promotion eligibility validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected promotion eligibility file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during promotion eligibility validation.'}
          Write-Host "CUSTOM_APP_PROMOTION_SCOPE_PASS head=$actual"

      - name: Prove immutable validated dependency objects
        shell: powershell
        run: |
          $pins=@(
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1','e0c39d0ffced966626ca5060346b8e6ed936589a'),
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1','250b7f17f6461b073b42f26319c2b229441f9421'),
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1','0045d04e9ddb3bb6564e9a8dcf7b147e2684bcbc'),
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1','20eb54baf6086131a03e27151cd53f5416fe3fae'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('b339f2b79a267c13cf3c5974aea2fff3786d3093','validation/custom-app-provenance-enrollment-v0.1.0/custom-app-provenance.ps1','4f0831fa2e5dc23c9a4ec98b6c7a9afbb3c9af55'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('7402ea5c77e58cd072f0166411d40e7726093f3c','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1','3a49ceebd13fa993b086eb2643130fb02c746bd1'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.1/release-id-fix-v011.ps1','e0ae3c494959c6b738bfd1be56183931119542cf'),
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1','bd19cbb3da2087e68b2452fe62471d4eca2cd990'),
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py','92eb87048eac882483bee1ed97bde598cff57e7b')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned promotion dependency drift: $($p[1]) $blob != $($p[2])"}}
          Write-Host 'CUSTOM_APP_PROMOTION_DEPENDENCY_PINS_PASS'

      - name: Parse eligibility core and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_PROMOTION_PS51_PARSE_PASS'

      - name: Audit promotion gate as pure read-only strict-deny decision logic
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1' -Raw
          foreach($m in @(
            "promotion_candidate_eligible=`$Eligible","requires_revalidation_before_any_mutation=`$true","mutation_mode='deny'",
            'mutation_authorized=$false','auto_update_authorized=$false','auto_install_authorized=$false','canary_execution_authorized=$false','production_mutation_authorized=$false',
            '22eb3561843fbe4016023d527186aa629512b67d','c420a1df6f306c7ba74772b91241cb14abd04738','d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2',
            '40673331603','40673541954','12808363735','12809940304',
            'sha256:ab1d0b651e89c19670d75fc07082cdadde81f5082a791554ed4861b02b8740dd','sha256:9ce022e987f6522b767aa330f2e1338210b13ceb5c34617377b548949dcc6c0c',
            'binding-remote-observation-stale','current-runtime-drifted-since-binding-observation','all-current-evidence-and-shadow-protocol-qualified'
          )){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Promotion gate safety marker missing: $m"}}
          foreach($forbidden in @(
            'Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Item','Remove-Item','Copy-Item','Move-Item','Set-Content','Out-File',
            'spicetify apply','spicetify config','[IO.File]::Write','[IO.File]::Append','[IO.Directory]::Create','[IO.Directory]::Delete'
          )){if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Promotion gate gained forbidden side effect primitive: $forbidden"}}
          if($core.IndexOf('production_mutation_authorized=$true',[StringComparison]::OrdinalIgnoreCase) -ge 0 -or $core.IndexOf('canary_execution_authorized=$true',[StringComparison]::OrdinalIgnoreCase) -ge 0){throw 'Promotion gate grants executable authority.'}
          Write-Host 'CUSTOM_APP_PROMOTION_PURE_DENY_AUDIT_PASS'

      - name: Run promotion eligibility fail-closed matrix twice
        shell: powershell
        run: |
          1..2|ForEach-Object{
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
            if($LASTEXITCODE -ne 0){throw "Promotion eligibility matrix failed on pass $_."}
          }
          Write-Host 'CUSTOM_APP_PROMOTION_MATRIX_REPEAT_PASS'

      - name: Replay exact shadow offline matrix and live pinned Tagify shadow update
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Exact parent shadow offline matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-shadow-executor-v0.1.0/test_live_tagify_shadow_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Exact parent live pinned Tagify shadow update regressed.'}
          Write-Host 'CUSTOM_APP_PROMOTION_SHADOW_PARENT_REPLAY_PASS'

      - name: Replay stage acquisition and transaction protocol matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-stage-acquisition-contract-v0.1.0/test_custom_app_stage_acquisition.ps1'
          if($LASTEXITCODE -ne 0){throw 'Stage acquisition matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1'
          if($LASTEXITCODE -ne 0){throw 'Transaction protocol matrix regressed.'}
          Write-Host 'CUSTOM_APP_PROMOTION_STAGE_TRANSACTION_REPLAY_PASS'

      - name: Rebuild exact v0.4.1 parent and run full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build
          if($LASTEXITCODE -ne 0){throw 'Exact v0.4.1 candidate rebuild failed.'}
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $addon).Length -ne 523216 -or $ah -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $((Get-Item $addon).Length)/$ah"}
          $mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if($mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control parent bytes drifted: $mh"}
          $sandbox=Join-Path $env:RUNNER_TEMP 'promotion-parent-selftest';$env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData';$env:APPDATA=Join-Path $sandbox 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_PROMOTION_PARENT_SELFTEST_PASS'

      - name: Prove production and validated parent surfaces remain immutable
        shell: powershell
        run: |
          $parent='22eb3561843fbe4016023d527186aa629512b67d';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@(
            '.github/workflows/validate-custom-app-promotion-eligibility-v010.yml',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          )
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected promotion changed surface: $($bad -join ', ')"}
          foreach($path in @(
            'manifest.json','stable-version.json','validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1',
            'validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1',
            'validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py'
          )){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_PROMOTION_IMMUTABILITY_PASS'

      - name: Write promotion eligibility validation evidence
        shell: powershell
        run: |
          $e=[ordered]@{
            schema=1;head=(git rev-parse HEAD).Trim();validated_shadow_parent='22eb3561843fbe4016023d527186aa629512b67d';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
            gate='custom-app-promotion-eligibility-v1';eligibility_only=$true;requires_revalidation_before_any_mutation=$true
            mutation_authority=$false;auto_update_authority=$false;auto_install_authority=$false;canary_execution_authority=$false;production_mutation_authority=$false
            qualified_shadow_push_run=40673331603;qualified_shadow_pr_run=40673541954;shadow_parent_replay='pass';live_tagify_shadow_replay='pass';parent_selftest='pass'
          }
          $e|ConvertTo-Json -Depth 5|Set-Content 'validation/custom-app-promotion-eligibility-gate-v0.1.0/ci-evidence.json' -Encoding UTF8

      - name: Upload promotion eligibility validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-promotion-eligibility-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1
            validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1
            validation/custom-app-promotion-eligibility-gate-v0.1.0/ci-evidence.json
