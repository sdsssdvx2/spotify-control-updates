name: Validate DPAPI journal locator from real signed ZIP and independent restart
on:
  push:
    branches: [validate/custom-app-journal-restart-locator]
    paths:
      - 'validation/custom-app-journal-restart-locator/**'
      - '.github/workflows/validate-custom-app-journal-restart-locator.yml'
  pull_request:
    branches: [validate/custom-app-normal-entrypoint-transaction-integration]
    paths:
      - 'validation/custom-app-journal-restart-locator/**'
      - '.github/workflows/validate-custom-app-journal-restart-locator.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  durable-journal-locator-windows:
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Verify exact five-file scope, immutable source pins and production freeze
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parent='68dcd4a3dea9602a89eb10f6411bd2d4fe2e5c23'
          if((git rev-parse HEAD).Trim() -cne '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'){throw 'wrong tested checkout SHA'}
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'qualified parent changed'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'operating main changed'}
          $d='validation/custom-app-journal-restart-locator'
          $pins=@{
            "$d/user-journal-locator.ps1"='bb29fe26a3d58f63eb70188bd24ad0782db07efc'
            "$d/test_user_journal_locator.ps1"='4a865eeac38dd26cada4144af8c7f4d0cdd6411e'
            "$d/derive_signed_real_zip_locator_e2e.py"='af4ddbe703c8c0408ea12f0fdd95aff5297d9a14'
            "$d/build_candidate.py"='f44fc4a08d5a9b9db94f90f5f0edbf27777a13fb'
          }
          $allowed=@($pins.Keys)+@('.github/workflows/validate-custom-app-journal-restart-locator.yml')
          $changed=@(git diff --name-only "$parent...HEAD")
          if($changed.Count -ne 5 -or @($changed|Where-Object{$_ -notin $allowed}).Count){throw ('unapproved source scope '+($changed -join ','))}
          foreach($p in $pins.Keys){if((git hash-object $p).Trim() -cne $pins[$p]){throw ('qualified source blob drift '+$p)}}
          foreach($p in @('bin/addon-manager.ps1','bin/spotify-control.ps1','manifest.json','stable-version.json','addon-policy-registry.json')){
            git diff --quiet $parent HEAD -- $p
            if($LASTEXITCODE -ne 0){throw ('protected operating file modified '+$p)}
          }
          Write-Host 'RESTART_LOCATOR_MAIN_FROZEN_PINNED_REVIEW_SCOPE_PASS'
      - name: Build real hard-disabled Addon Manager and exact inverse, parse PowerShell 5.1
        shell: powershell
        timeout-minutes: 45
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          python "$d/build_candidate.py"
          if($LASTEXITCODE -ne 0){throw 'journal locator bundle build failed'}
          $report=Get-Content "$d/candidate-validation.json" -Raw|ConvertFrom-Json
          $addon="$d/out/bin/addon-manager.ps1"
          $sha=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne [string]$report.candidate_addon_sha256 -or (Get-Item $addon).Length -ne [int64]$report.candidate_addon_size){throw 'Addon Manager bundle SHA does not match report'}
          if((Get-FileHash "$d/out/bin/spotify-control.ps1" -Algorithm SHA256).Hash.ToLowerInvariant() -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control changed'}
          if(-not[bool]$report.qualified_candidate_inverse_exact -or -not[bool]$report.original_update_autoapps_identical -or
             -not[bool]$report.original_fullchain_identical -or [bool]$report.normal_new_update_enabled){throw 'production routing was improperly changed'}
          foreach($p in @($addon,"$d/user-journal-locator.ps1","$d/test_user_journal_locator.ps1")){
            $tokens=$null;$errs=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errs)
            if($errs.Count){$errs|Select-Object -First 8|ForEach-Object{Write-Host ($_.Extent.StartLineNumber.ToString()+':'+$_.Message)};throw ('Windows PowerShell 5.1 parser rejected '+$p)}
          }
          "LOCATOR_ADDON_SHA=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOCATOR_ADDON_SIZE=$((Get-Item $addon).Length)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "USER_JOURNAL_LOCATOR_ACTUAL_ADDON_PS51_PARSE_PASS sha256=$sha"
      - name: Actual Addon Manager SelfTest, no installed software
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          $sandbox=Join-Path $env:RUNNER_TEMP ('addon-journal-locator-selftest-'+[Guid]::NewGuid().ToString('N'))
          $env:LOCALAPPDATA=Join-Path $sandbox 'Local'
          $env:APPDATA=Join-Path $sandbox 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/out/bin/addon-manager.ps1" -Action SelfTest *>&1|Tee-Object -FilePath "$d/addon-selftest.log"|Out-Null
          $status=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($status -ne 0){Get-Content "$d/addon-selftest.log" -Tail 15|ForEach-Object{Write-Host $_};throw ('actual Addon Manager SelfTest failed '+$status)}
          $s=Get-Content "$d/addon-selftest.log" -Raw
          foreach($m in @('CUSTOM_APP_USER_JOURNAL_LOCATOR_SELFTEST_PASS','CUSTOM_APP_NORMAL_UPDATE_ENGINE_EXCLUSIVITY_SELFTEST_PASS','CUSTOM_USER_TXN_VERIFIED_TERMINAL_BUNDLE_SELFTEST_PASS')){
            if(-not $s.Contains($m)){throw ('actual Addon Manager missing previous/new SelfTest '+$m)}
          }
          Write-Host 'USER_JOURNAL_LOCATOR_REAL_ADDON_SELFTEST_PASS'
      - name: First isolated Windows PowerShell 5.1 enrollment, signed Triple-ID reservation and immutable DPAPI binding
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/test_user_journal_locator.ps1" -Phase bootstrap *>&1|Tee-Object -FilePath "$d/bootstrap.log"|Out-Null
          $status=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($status -ne 0){Get-Content "$d/bootstrap.log" -Tail 20|ForEach-Object{Write-Host $_};throw ('locator bootstrap failed '+$status)}
          if(-not(Get-Content "$d/bootstrap.log" -Raw).Contains('USER_JOURNAL_LOCATOR_FRESH_BIND_PASS')){throw 'locator first binding proof missing'}
          Write-Host 'USER_JOURNAL_LOCATOR_FIRST_PROCESS_DPAPI_BIND_PASS'
      - name: Second independent PowerShell 5.1 process exact locator readback, missing and tamper fail closed
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/test_user_journal_locator.ps1" -Phase restart *>&1|Tee-Object -FilePath "$d/fresh-process.log"|Out-Null
          $status=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($status -ne 0){Get-Content "$d/fresh-process.log" -Tail 20|ForEach-Object{Write-Host $_};throw ('independent process locator replay test failed '+$status)}
          if(-not(Get-Content "$d/fresh-process.log" -Raw).Contains('USER_JOURNAL_LOCATOR_FRESH_PROCESS_PASS')){throw 'fresh process DPAPI proof missing'}
          Write-Host 'USER_JOURNAL_LOCATOR_FRESH_PROCESS_TAMPER_REPLAY_PASS'
      - name: Restore qualified historical Windows fixture dependencies and overlays
        shell: powershell
        timeout-minutes: 50
        run: |
          $ErrorActionPreference='Stop'
          $prep='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/prepare_custom_app_production_dual_id_new_permit_readiness.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Qualified historical fixture dependency restoration failed'}
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $pins=@(
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1",'3350cd974bb9f9ae7345e490449c4875d571bf95'),
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1",'224b9df9d020b74bd4d99c85ca6d06e28999101b')
          )
          foreach($pin in $pins){if((git hash-object $pin[0]).Trim() -cne [string]$pin[1]){throw ('Qualified overlay SHA drift: '+$pin[0])}}
          # Pinned historical-only dependencies: materialize into ephemeral checkout.
          $historical=@(
            @('e2b80822835bf5d59dc179e345e098b5bd79759e','validation/custom-app-production-atomic-live-swap-mutation-v0.1.0/test_custom_app_production_atomic_live_swap_mutation.ps1','d15e0768162b0659c57602eaf0242b035b48b0c7'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-mutation.ps1','79580da78443a18bd281d4fce61c4a57d958a196'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-repair-v011.ps1','210c4dda2311eb5defcbcd74977e4f4148ea7c38'),
            @('b266bad660d4b7bc87e7093c5b12f0cff1dc466f','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-preflight-v0.1.0/custom-app-production-recovery-preflight.ps1','b1816a24849a559b4da2537aa1b2436124fbee50'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-execution-admission-v0.1.0/custom-app-production-recovery-execution-admission.ps1','e8804a7c53ad0d3e5420e037d468d9c397e52529'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'),
            @('d3969a746ed1736fe93586bd025116c2526fbff5','validation/custom-app-production-recovery-cleanup-resume-admission-v0.1.0/custom-app-production-recovery-cleanup-resume-admission.ps1','387d97b10d493b3794b24fba2bac67cf39491444'),
            @('d9a1face71511bdaeeef4e8c761415ef9ec95fc0','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63')
          )
          foreach($dep in $historical){
            $commit=[string]$dep[0];$p=[string]$dep[1];$blob=[string]$dep[2]
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){
              git cat-file -e ($commit+'^{commit}') 2>$null
              if($LASTEXITCODE){git fetch --no-tags origin $commit | Out-Null;if($LASTEXITCODE){throw ('historical fetch failed '+$commit)}}
              New-Item -ItemType Directory -Force -Path (Split-Path $p -Parent)|Out-Null
              $env:TJR_SPEC=($commit+':'+$p);$env:TJR_OUT=$p
              python -c "import os,subprocess,pathlib;pathlib.Path(os.environ['TJR_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['TJR_SPEC']]))"
              if($LASTEXITCODE){throw ('historical materialize failed '+$p)}
            }
            if((git hash-object $p).Trim() -cne $blob){throw ('historical recovery blob drift '+$p)}
          }
          # The parent preparer intentionally applies its separately qualified
          # monotonic restore-executor patch. Do not overwrite it with its old blob.
          if(-not(Test-Path -LiteralPath 'validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1' -PathType Leaf)){throw 'qualified monotonic restore executor absent'}
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_HISTORICAL_RECOVERY_MODULES_PINNED_PASS'
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_PINNED_FIXTURES_PASS'
      - name: Apply SHA-qualified old reservation compatibility overlays in temporary Windows checkout
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $core="$d/custom-app-production-dual-id-new-permit-reservation-persistence.ps1"
          $pieces=@($core,"$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1","$d/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1")
          $source=($pieces|ForEach-Object{[IO.File]::ReadAllText((Resolve-Path $_).Path)}) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Resolve-Path $core).Path,$source,[Text.UTF8Encoding]::new($false))
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $core).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'qualified historical reservation overlays PS5.1 invalid'}
          Write-Host 'USER_TERMINAL_QUALIFIED_OLD_PERMIT_RESERVATION_OVERLAYS_PASS'
      - name: Rebuild the previously qualified signed real ZIP E2E and inject pre-swap encrypted locator
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          python "$d/derive_signed_real_zip_locator_e2e.py"
          if($LASTEXITCODE -ne 0){throw 'historical signed third-ID fixture derivation failed'}
          $script="$d/ci_derived_signed_zip_bound_locator.ps1"
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){throw 'actual signed third-ID ZIP runner missing'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Select-Object -First 10|ForEach-Object{Write-Host ($_.Message)};throw 'derived real ZIP PS5.1 syntax invalid'}
          Write-Host 'USER_JOURNAL_LOCATOR_REAL_ZIP_SIGNED_DERIVATION_PS51_PASS'
      - name: Actual signed ZIP, pre-swap locator, independently restarted rollback and bound terminal consumption
        shell: powershell
        timeout-minutes: 65
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          $oldRun=$env:RUNNER_TEMP;$oldTemp=$env:TEMP;$oldTmp=$env:TMP
          $sandbox=Join-Path $oldRun ('locator-real-zip-'+[Guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($sandbox)|Out-Null
          $exitCode=1
          try{
            $env:RUNNER_TEMP=$sandbox;$env:TEMP=$sandbox;$env:TMP=$sandbox
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/ci_derived_signed_zip_bound_locator.ps1" *>&1 | Tee-Object -FilePath "$d/signed-zip-bound-restart.log" | Out-Null
            $exitCode=$LASTEXITCODE
          }finally{
            $env:RUNNER_TEMP=$oldRun;$env:TEMP=$oldTemp;$env:TMP=$oldTmp
            $ErrorActionPreference='Stop'
          }
          if($exitCode -ne 0){
            Get-Content "$d/signed-zip-bound-restart.log" -Tail 30|ForEach-Object{Write-Host $_}
            throw ('real signed ZIP bound locator E2E failure exit='+$exitCode)
          }
          $s=Get-Content "$d/signed-zip-bound-restart.log" -Raw
          foreach($m in @(
            'USER_JOURNAL_REAL_SIGNED_THIRD_ID_PRE_SWAP_LOCATOR_BOUND_PASS',
            'USER_TERMINAL_UNFINISHED_REAL_JOURNAL_DENIED_PASS',
            'USER_JOURNAL_EARLY_BOUND_COMMIT_DENIED_PASS',
            'USER_JOURNAL_SIGNED_ZIP_BOUND_RESTART_TERMINAL_PASS',
            'USER_TERMINAL_FRESH_PROCESS_REPLAY_DENIED_PASS',
            'TRIPLE_ID_EXCLUSIVE_REAL_ZIP_END_TO_END_PASS'
          )){if(-not $s.Contains($m)){throw ('real signed ZIP terminal evidence missing '+$m)}}
          Write-Host 'USER_JOURNAL_LOCATOR_REAL_THIRD_ID_SIGNED_ZIP_RESTART_E2E_PASS'
      - name: Byte-reproducible second Addon Manager build and final frozen main verification
        shell: powershell
        timeout-minutes: 45
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-journal-restart-locator'
          python "$d/build_candidate.py"
          if($LASTEXITCODE -ne 0){throw 'repeated bundle builder failed'}
          $addon="$d/out/bin/addon-manager.ps1"
          $hash=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne $env:LOCATOR_ADDON_SHA -or (Get-Item $addon).Length -ne [int64]$env:LOCATOR_ADDON_SIZE){throw 'non-reproducible generated Addon Manager'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'operating main drift'}
          [ordered]@{
            schema=1;status='PASS';qualified_head=(git rev-parse HEAD).Trim()
            addon_sha256=$hash;addon_size=(Get-Item $addon).Length
            exact_previous_candidate_inverse='PASS'
            two_process_currentuser_dpapi_locator='PASS'
            missing_tampered_locator_denied='PASS'
            real_signed_zip_pre_swap_binding='PASS'
            real_independent_rollback_bound_terminal='PASS'
            fresh_process_consumed_id_replay_denied='PASS'
            normal_update_fullchain_enabled=$false
            installed_spotify_changed=$false
          }|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          Write-Host "USER_JOURNAL_LOCATOR_TWO_BUILDS_MAIN_FROZEN_PASS sha256=$hash"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-zip-restart-journal-locator-${{ github.run_id }}
          path: |
            validation/custom-app-journal-restart-locator/candidate-validation.json
            validation/custom-app-journal-restart-locator/ci-evidence.json
            validation/custom-app-journal-restart-locator/addon-selftest.log
            validation/custom-app-journal-restart-locator/bootstrap.log
            validation/custom-app-journal-restart-locator/fresh-process.log
            validation/custom-app-journal-restart-locator/signed-zip-bound-restart.log
          retention-days: 14
          if-no-files-found: warn
