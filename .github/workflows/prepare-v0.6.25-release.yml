name: Prepare Spotify Control v0.6.25 Release

on:
  push:
    branches:
      - release/v0.6.25-splitify-release-provenance-r14
    paths:
      - '.github/workflows/prepare-v0.6.25-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v0.6.25-splitify-release-provenance-r14

      - name: Verify exact stable base and seed-only release scope
        shell: powershell
        run: |
          $base='c3dca564f70d4c85a84d5f895309d30d5a2d80c1'
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Release branch no longer descends from exact v0.6.24 stable main.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.24'){throw "Expected base manifest v0.6.24, got $($m.latest_version)"}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 identity drifted.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@('validation/v0.6.25/build_v0625.py','validation/v0.6.25/release_transport.py','.github/workflows/prepare-v0.6.25-release.yml')
          foreach($p in $changed){if($allowed -cnotcontains $p){throw "Unexpected pre-publication path: $p"}}
          if($changed.Count -ne 3){throw "Expected exactly three release seed files, got $($changed.Count)."}
          Write-Host "V0625_RELEASE_SEED_SCOPE_PASS head=$((git rev-parse HEAD).Trim())"

      - name: Compile exact validated source and build deterministic packages
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.25/build_v0625.py validation/v0.6.25/release_transport.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.25 release source compile failed.'}
          python validation/v0.6.25/release_transport.py --build-packages
          if($LASTEXITCODE -ne 0){throw 'v0.6.25 package build failed.'}
          $main='validation/v0.6.25/out/bin/spotify-control.ps1';$addon='validation/v0.6.25/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 284313 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne '896bb74e71385b5b6ada118af41cbe9d398dc662ce3719234104028e6eed197f'){throw 'v0.6.25 main candidate identity mismatch.'}
          if((Get-Item $addon).Length -ne 282718 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '25ebd0a5d5158f7d3cb4b4ce2ecf89f05f4dad3ef6bc799599e7204ce103c29c'){throw 'r14 Addon Manager candidate identity mismatch.'}
          $r=Get-Content validation/v0.6.25/candidate-validation.json -Raw|ConvertFrom-Json
          if($r.validated_source.head -ne 'c08ce018a8424ce39c4e5692443b78a71e010b26' -or $r.validated_source.blob -ne '5cab5a8141a13bf7985570aeced3166d7b163c8e'){throw 'Validated v0.1.2 source pin drifted.'}
          if($r.catalog_evidence.catalog_json_sha256 -ne '60311e81ae11727528fd5e34879533e1cfacdaaf7b2b21dd1808fb20e3b32454'){throw 'Splitify release catalog evidence pin drifted.'}
          if($r.authority_expanded -ne $false -or $r.new_auto_install_authority -ne $false){throw 'Candidate unexpectedly expands authority.'}
          Write-Host 'V0625_RELEASE_PACKAGE_BUILD_PASS'

      - name: Commit immutable transport source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/v0.6.25 validation/v0.6.25/candidate-validation.json validation/v0.6.25/release-metadata.json
          $staged=@(git diff --cached --name-only)
          if(-not $staged.Count){throw 'No v0.6.25 immutable transport output was staged.'}
          foreach($p in $staged){if($p -notlike 'packages/v0.6.25/*' -and $p -cne 'validation/v0.6.25/candidate-validation.json' -and $p -cne 'validation/v0.6.25/release-metadata.json'){throw "Unexpected staged transport path: $p"}}
          git commit -m 'release: freeze v0.6.25 immutable transport'
          if($LASTEXITCODE -ne 0){throw 'Immutable transport commit failed.'}
          $source=(git rev-parse HEAD).Trim()
          if($source -notmatch '^[0-9a-f]{40}$'){throw 'Immutable source commit SHA is invalid.'}
          "SOURCE_COMMIT=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "V0625_IMMUTABLE_SOURCE_COMMIT=$source"

      - name: Write manifest against immutable transport commit
        shell: powershell
        run: |
          python validation/v0.6.25/release_transport.py --write-manifest --source-commit $env:SOURCE_COMMIT
          if($LASTEXITCODE -ne 0){throw 'v0.6.25 manifest generation failed.'}
          git diff --exit-code -- packages/v0.6.25 validation/v0.6.25/candidate-validation.json validation/v0.6.25/release-metadata.json
          if($LASTEXITCODE -ne 0){throw 'Manifest generation changed deterministic transport output after source commit.'}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.25'){throw "Prepared manifest latest version mismatch: $($m.latest_version)"}
          if($m.source_commit -ne $env:SOURCE_COMMIT){throw 'Prepared manifest does not pin immutable transport commit.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Prepared Bootstrap identity changed.'}
          $edge=@($m.updates|Where-Object{$_.from_version -eq '0.6.24' -and $_.to_version -eq '0.6.25'})
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'Prepared v0.6.24 -> v0.6.25 update edge is invalid.'}
          Write-Host "V0625_MANIFEST_PREP_PASS payload=$($m.payload_set_sha256) source=$($m.source_commit)"

      - name: Commit prepared manifest and push both release commits
        shell: powershell
        run: |
          git add manifest.json
          $staged=@(git diff --cached --name-only)
          if($staged.Count -ne 1 -or $staged[0] -cne 'manifest.json'){throw "Expected only manifest.json staged, got: $($staged -join ', ')"}
          git commit -m 'release: publish v0.6.25 stable manifest'
          if($LASTEXITCODE -ne 0){throw 'Prepared manifest commit failed.'}
          $final=(git rev-parse HEAD).Trim()
          git push origin HEAD:release/v0.6.25-splitify-release-provenance-r14
          if($LASTEXITCODE -ne 0){throw 'Prepared release push failed.'}
          Write-Host "V0625_PREPARED_RELEASE_HEAD=$final"
