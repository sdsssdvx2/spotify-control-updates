name: Export exact stable r5 Addon Manager

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-export-r5:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact stable r5 Addon Manager
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,hashlib,json,subprocess
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig'))
          source=m['source_commit']
          edge=next(e for e in m['updates'] if e['from_version']=='0.6.14' and e['to_version']=='0.6.15')
          ap=next(p for p in edge['patches'] if p['path']=='bin/addon-manager.ps1')
          parts=[]
          for c in ap['chunks']:
              data=subprocess.check_output(['git','show',f'{source}:{c["path"]}'])
              assert len(data)==c['size'] and hashlib.sha256(data).hexdigest()==c['sha256']
              parts.append(data)
          enc=b''.join(parts)
          assert len(enc)==ap['encoded_size'] and hashlib.sha256(enc).hexdigest()==ap['encoded_sha256']
          comp=base64.b64decode(enc,validate=True)
          assert len(comp)==ap['compressed_size'] and hashlib.sha256(comp).hexdigest()==ap['compressed_sha256']
          addon=gzip.decompress(comp)
          assert len(addon)==128714
          assert hashlib.sha256(addon).hexdigest()=='56185d3b23c4b0df455673ad3f601d67c7980b7428f1d15b3e0465d1a7859022'
          Path('spotify-control-addon-manager-v0.6.5-r5.ps1').write_bytes(addon)
          print('EXACT_R5',len(addon),hashlib.sha256(addon).hexdigest())
      - name: Windows PowerShell 5.1 parser verification
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\spotify-control-addon-manager-v0.6.5-r5.ps1').Path,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|%{Write-Error $_.Message};throw 'Exact r5 parser failure'}
          Write-Host 'Exact r5 PS5.1 parser PASS.'
      - name: Upload exact r5 source
        uses: actions/upload-artifact@v4
        with:
          name: spotify-control-addon-manager-v0.6.5-r5-exact
          path: spotify-control-addon-manager-v0.6.5-r5.ps1
          if-no-files-found: error
          compression-level: 6
