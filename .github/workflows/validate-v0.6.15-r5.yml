name: Validate exact Spotify Control Stage14 v1.4.0 package

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/stage14-v1.4.0/**'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-powershell51-stage14-v140:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact previously validated v1.2.1 Actions artifact byte-safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' '/repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12559818628/zip' > base-v121-outer.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          outer=Path('base-v121-outer.zip')
          with zipfile.ZipFile(outer) as z:
              assert z.testzip() is None
              names=z.namelist()
              target='SpotifyControl-Windows-Runtime-Acceptance-v1.2.1.zip'
              assert target in names, names
              data=z.read(target)
          assert len(data)==34841, len(data)
          assert hashlib.sha256(data).hexdigest()=='962a09cd5adbcb4dd49046dd672b44252238f43859f5b97a4ce70f8492068fd8'
          Path('base-v121.zip').write_bytes(data)
          print('EXACT_V121_ARTIFACT_PASS',len(data),hashlib.sha256(data).hexdigest())
          PY

      - name: Derive Stage14 v1.4.0 from exact validated artifact
        shell: python
        run: |
          import hashlib,runpy
          from pathlib import Path
          p=Path('validation/stage14-v1.4.0/build_from_validated_v121_artifact.py')
          b=p.read_bytes();print('V140_ARTIFACT_BUILDER',len(b),hashlib.sha256(b).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Verify live production v0.6.17 trust anchor and exact two-edge start chain
        shell: python
        run: |
          import json,subprocess
          m=json.loads(subprocess.check_output(['git','show','origin/main:manifest.json']).decode('utf-8-sig'))
          assert m['latest_version']=='0.6.17'
          assert m['source_commit']=='e51f73c90c50cb55e3e3dffe3b55a6f6b1af0b4c'
          assert m['payload_set_sha256']=='0f7fe384630e027466aa734ac669b410774b4569db231982212b7fa565b691a0'
          files={x['path']:(x['sha256'],int(x['size'])) for x in m['latest_files']}
          assert files['bin/spotify-control.ps1']==('5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b',266318)
          assert files['bin/addon-manager.ps1']==('b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977',154926)
          graph={(e['from_version'],e['to_version']) for e in m['updates']}
          assert ('0.6.15','0.6.16') in graph and ('0.6.16','0.6.17') in graph
          froms=[e['from_version'] for e in m['updates']];assert len(froms)==len(set(froms))
          print('LIVE_STABLE_V0617_TWO_EDGE_CHAIN_PASS')

      - name: Windows PowerShell 5.1 parser and package self-validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Resolve-Path '.\stage14-v120-unpacked'
          foreach($rel in @('RUN_RUNTIME_ACCEPTANCE.ps1','PRECHECK_RUNTIME_ACCEPTANCE.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $rel),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PS5.1 parser rejected $rel"}
          }
          python (Join-Path $root 'evidence\validate_stage14.py')
          if($LASTEXITCODE -ne 0){throw 'embedded Stage14 v1.4.0 validator failed'}
          $s=Get-Content -LiteralPath (Join-Path $root 'RUN_RUNTIME_ACCEPTANCE.ps1') -Raw
          foreach($must in @("[int]`$check.result.edge_count -ne 2",'Invoke-TrustedV0617SelfUpdateAcceptance','ivLyrics official-tag fallback gate self-test passed','ivLyrics unproven-current fallback self-test passed','Commit-cycle self-test passed','IvLyricsTagProofSelfTest','monitor-update-available-unproven','monitor-unproven-baseline')){if(-not $s.Contains($must)){throw "missing v1.4 requirement: $must"}}
          if($s.Contains('Invoke-TrustedV0616SelfUpdateAcceptance')){throw 'stale v1.3 self-update function remains'}
          Write-Host 'STAGE14_V140_WINDOWS_PS51_PASS'

      - name: ZIP CRC and internal SHA256SUMS
        shell: python
        run: |
          import zipfile,hashlib
          p='SpotifyControl-Windows-Runtime-Acceptance-v1.4.0.zip'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for line in z.read('SHA256SUMS.txt').decode('ascii').splitlines():
              h,rel=line.split('  ',1);assert hashlib.sha256(z.read(rel)).hexdigest()==h,(rel,h)
          b=open(p,'rb').read();print('V140_FINAL_ZIP',len(b),hashlib.sha256(b).hexdigest())

      - name: Upload exact validated Stage14 v1.4.0 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.4.0
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.4.0.zip
          if-no-files-found: error
          compression-level: 0
