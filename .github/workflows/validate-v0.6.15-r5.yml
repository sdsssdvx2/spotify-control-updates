name: Validate exact Spotify Control Stage14 v1.3.0 package

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/stage14-v1.3.0/**'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell51-stage14-v130:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild trusted v1.2.1 and derive exact Stage14 v1.3.0
        shell: python
        run: |
          import hashlib, runpy
          from pathlib import Path
          p=Path('validation/stage14-v1.3.0/build_stage14_v130.py')
          data=p.read_bytes()
          print('V130_BUILDER',len(data),hashlib.sha256(data).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Verify live stable v0.6.16 trust anchor matches Stage14 target
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,zipfile
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig'))
          assert m['latest_version']=='0.6.16'
          assert m['source_commit']=='c97b6bae845c46730120b08821f8515cfa9ad199'
          assert m['payload_set_sha256']=='fbeffb5f594c3feeb621f50e391246bb035dd0fffce5300a575aa74883a7acfb'
          latest={x['path']:(x['size'],x['sha256']) for x in m['latest_files']}
          assert latest=={
            'bin/spotify-control.ps1':(266321,'6d5e154f63dfb77d15e0541a87a653863e0ae9f95df59ffa9bb4b413f97766ad'),
            'bin/addon-manager.ps1':(152481,'fb2bd974ee795bb697a0e5b534e03477be77b655e60353d82064b1e751bdc686'),
            'bin/spotify-control-agent.vbs':(4855,'2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278')}
          z=Path('SpotifyControl-Windows-Runtime-Acceptance-v1.3.0.zip')
          print('V130_ZIP_FINAL',z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          with zipfile.ZipFile(z) as f:
            assert f.testzip() is None
            run=f.read('RUN_RUNTIME_ACCEPTANCE.ps1').decode('utf-8-sig')
            assert "$AcceptanceVersion = '1.3.0'" in run
            assert "@('-Action','IvLyricsTagProofSelfTest')" in run
            assert 'Commit-cycle self-test passed' in run
            assert 'ivLyrics official-tag fallback gate self-test passed' in run
            for line in f.read('SHA256SUMS.txt').decode('ascii').splitlines():
              digest,rel=line.split('  ',1)
              assert hashlib.sha256(f.read(rel)).hexdigest()==digest,rel

      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'SpotifyControl-Windows-Runtime-Acceptance-v1.3.0.zip' -DestinationPath 'stage14-v130-ps' -Force
          foreach($rel in @('PRECHECK_RUNTIME_ACCEPTANCE.ps1','RUN_RUNTIME_ACCEPTANCE.ps1')) {
            $path=(Resolve-Path (Join-Path 'stage14-v130-ps' $rel)).Path
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "Windows PowerShell 5.1 parser rejected $rel" }
          }
          Write-Host 'Stage14 v1.3.0 Windows PowerShell 5.1 parser PASS.'

      - name: Upload exact validated Stage14 v1.3.0 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.3.0
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.3.0.zip
          if-no-files-found: error
          compression-level: 6
