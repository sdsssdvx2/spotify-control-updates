name: Validate Spotify Control v0.6.15 r5

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v0.6.15-r5.yml'
      - '.github/workflows/validate-stage14-v1.2.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell51-stage14-v121:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute pinned Stage14 v1.2.1 builder and validator
        shell: python
        run: |
          from pathlib import Path
          text=Path('.github/workflows/validate-stage14-v1.2.1.yml').read_text(encoding='utf-8')
          marker='      - name: Rebuild trusted v1.2.0, derive v1.2.1, and validate stable manifest\n        shell: python\n        run: |\n'
          end='\n      - name: Windows PowerShell 5.1 parser validation\n'
          assert text.count(marker)==1 and text.count(end)==1
          block=text.split(marker,1)[1].split(end,1)[0]
          lines=block.splitlines()
          assert lines and all((not x) or x.startswith('          ') for x in lines)
          code='\n'.join(x[10:] if x else '' for x in lines)+'\n'
          exec(compile(code,'stage14-v1.2.1-builder.py','exec'),{'__name__':'__main__'})

      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'SpotifyControl-Windows-Runtime-Acceptance-v1.2.1.zip' -DestinationPath 'stage14-v121-ps' -Force
          foreach($rel in @('PRECHECK_RUNTIME_ACCEPTANCE.ps1','RUN_RUNTIME_ACCEPTANCE.ps1')) {
            $path=(Resolve-Path (Join-Path 'stage14-v121-ps' $rel)).Path
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){$errors|ForEach-Object{Write-Error $_.Message};throw "Windows PowerShell 5.1 parser rejected $rel"}
          }
          Write-Host 'Stage14 v1.2.1 Windows PowerShell 5.1 parser PASS.'

      - name: Upload exact validated Stage14 v1.2.1 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.2.1
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.2.1.zip
          if-no-files-found: error
          compression-level: 6
