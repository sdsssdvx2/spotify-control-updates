name: Validate Spotify Control Performance Phase 2 v0.3.0

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/performance-phase2-v0.3.0/**'
      - '.github/workflows/validate-v0.6.15-r5.yml'

permissions:
  contents: read

jobs:
  windows-powershell51-phase2-v030:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact Phase 2 package from pinned ASCII transport
        shell: python
        run: |
          from pathlib import Path
          import hashlib, runpy
          p=Path('validation/performance-phase2-v0.3.0/build_from_chunks.py')
          print('BUILDER',len(p.read_bytes()),hashlib.sha256(p.read_bytes()).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Static fail-closed safety policy audit
        shell: python
        run: |
          from pathlib import Path
          s=Path('phase2-package/track-transition-isolation.ps1').read_text(encoding='utf-8-sig')
          required=[
            '$Version = "0.3.0"',
            '5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b',
            'b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977',
            '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278',
            'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6',
            '$ExpectedSpotifyVersion = "1.3.6.1921"',
            '$ExpectedSpicetifyVersion = "2.46.2"',
            'BASELINE_A','DIRECT_EXTENSIONS_OFF','OPTIONAL_CUSTOM_APPS_OFF','MARKETPLACE_GROUP_OFF','ALL_ADDONS_OFF','NEAR_CORE','BASELINE_B',
            'ivLyrics','tagify','splitify',
            'Backup-ProtectedPersistence','Suspend-Resident','Restore-Resident','Restore-OriginalConfig',
            'workload_canary_pass','TransitionWindowSeconds = 6',
          ]
          for x in required: assert x in s,x
          forbidden=['spicetify restore','Unregister-ScheduledTask','Disable-ScheduledTask','Remove-AppxPackage','reg delete','Format-Volume','diskpart']
          low=s.lower()
          for x in forbidden: assert x.lower() not in low,x
          assert s.count('Remove-Item -LiteralPath $tmp -Recurse -Force')==1
          assert s.count('Stop-Process')==2
          assert s.index('$script:ConfigMutationStarted=$true') < s.index('foreach($item in @($Variant.disable_extensions))')
          assert 'if($Action -ne "SelfTest"){New-Item -ItemType Directory' in s
          assert 'if($Action -ne "SelfTest"){Add-Content' in s
          assert 'Run this profiler as the normal desktop user, not as Administrator.' in s
          print('PHASE2_STATIC_SAFETY_POLICY_PASS')

      - name: Windows PowerShell 5.1 parser and synthetic SelfTest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scriptPath=(Resolve-Path '.\phase2-package\track-transition-isolation.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'PowerShell 5.1 parser rejected Phase 2 profiler.'}
          $sandbox=Join-Path $env:RUNNER_TEMP 'phase2-selftest'
          Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData'
          $env:APPDATA=Join-Path $sandbox 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "Phase 2 SelfTest failed with exit $LASTEXITCODE"}
          if(Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'SpotifyControl')){throw 'SelfTest mutated its SpotifyControl production-shaped path.'}
          Write-Host 'PHASE2_WINDOWS_PS51_SELFTEST_PASS'

      - name: Verify exact final ZIP identity and internal checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib,zipfile
          p=Path('SpotifyControl-Track-Transition-Isolation-v0.3.0.zip')
          data=p.read_bytes()
          assert len(data)==15584,len(data)
          assert hashlib.sha256(data).hexdigest()=='b3a5789b7a476b951e3e6a5b52bb3979908e3c15647fcdb57c3c4ef81370a6ca'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert sorted(z.namelist())==sorted(['README.md','RUN_TRACK_TRANSITION_ISOLATION.cmd','SELFTEST.cmd','SHA256SUMS.txt','track-transition-isolation.ps1'])
              for line in z.read('SHA256SUMS.txt').decode('ascii').splitlines():
                  h,name=line.split('  ',1)
                  assert hashlib.sha256(z.read(name)).hexdigest()==h,(name,h)
          print('PHASE2_FINAL_ZIP_PASS',len(data),hashlib.sha256(data).hexdigest())

      - name: Upload exact validated Phase 2 package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Track-Transition-Isolation-v0.3.0
          path: SpotifyControl-Track-Transition-Isolation-v0.3.0.zip
          if-no-files-found: error
          compression-level: 0
