name: Debug r5 unattended pending path

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-r5-unattended-debug:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact stable r5 Addon Manager
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, json, subprocess
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig'))
          assert m['latest_version']=='0.6.15'
          source=m['source_commit']
          assert source=='2f8377829ab61dcb88d265bdbd484181f084aef9'
          edge=next(e for e in m['updates'] if e['from_version']=='0.6.14' and e['to_version']=='0.6.15')
          ap=next(p for p in edge['patches'] if p['path']=='bin/addon-manager.ps1')
          parts=[]
          for c in ap['chunks']:
              data=subprocess.check_output(['git','show',f'{source}:{c["path"]}'])
              assert len(data)==c['size'] and hashlib.sha256(data).hexdigest()==c['sha256']
              parts.append(data)
          enc=b''.join(parts)
          assert len(enc)==ap['encoded_size'] and hashlib.sha256(enc).hexdigest()==ap['encoded_sha256']
          comp=base64.b64decode(enc,validate=True)
          assert len(comp)==ap['compressed_size'] and hashlib.sha256(comp).hexdigest()==ap['compressed_sha256']
          addon=gzip.decompress(comp)
          assert len(addon)==ap['target_size'] and hashlib.sha256(addon).hexdigest()==ap['to_sha256']
          Path('candidate-addon.ps1').write_bytes(addon)
          print('R5_RECONSTRUCT',len(addon),hashlib.sha256(addon).hexdigest())

      - name: Inspect exact r5 dispatch, pending, discovery and update paths
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=(Resolve-Path '.\candidate-addon.ps1').Path
          $tokens=$null; $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors|%{Write-Error $_.Message};throw 'Parser rejected r5'}
          $funcs=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst]},$true))
          Write-Host '=== RELEVANT FUNCTION NAMES ==='
          $funcs | Where-Object {$_.Name -match 'Auto|Inventory|Discover|Update|Pithaya|ivLyrics|State|Due|Schedule|Pending'} | ForEach-Object {Write-Host $_.Name}
          Write-Host '=== SELECTED FUNCTION BODIES ==='
          foreach($name in @('Get-DiscoveredActionableAutoUpdateCount','Update-AutoApps','Get-Inventory','Get-AddonInventory','Discover-AutoApps','Get-AutoAppInventory','Get-PithayaInventory','Get-IvLyricsInventory')){
            $f=$funcs|Where-Object {$_.Name -ceq $name}|Select-Object -First 1
            if($f){Write-Host ('--- '+$name+' ---');Write-Host $f.Extent.Text}
          }
          Write-Host '=== DISPATCH/SCHEDULE CONTEXT ==='
          $lines=Get-Content -LiteralPath $path
          $patterns=@('last_update','Get-DiscoveredActionableAutoUpdateCount','Update-AutoApps','CheckOnly','Action -eq','switch ($Action','schedule gate','actionable pending','Update interval')
          foreach($pat in $patterns){
            Write-Host ('--- MATCH '+$pat+' ---')
            Select-String -LiteralPath $path -SimpleMatch -Pattern $pat -Context 5,10 | ForEach-Object {
              Write-Host ('LINE '+$_.LineNumber+': '+$_.Line)
              $_.Context.PreContext | ForEach-Object {Write-Host ('  PRE '+$_)}
              $_.Context.PostContext | ForEach-Object {Write-Host (' POST '+$_)}
            }
          }

      - name: Run existing r5 SelfTest on clean Windows fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControlTest-Local'
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControlTest-Roaming'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify') | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\candidate-addon.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "r5 SelfTest failed $LASTEXITCODE"}
