name: Validate exact Spotify Control Stage14 v1.4.1 package

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/stage14-v1.4.1/**'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-powershell51-stage14-v141:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact previously validated Stage14 v1.4.0 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12562419376/zip' > base-v140-outer.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          outer=Path('base-v140-outer.zip').read_bytes()
          assert hashlib.sha256(outer).hexdigest()=='28b41358b03c2f7a38a97075690143d6bbfb1bd0c3c9f6bc7d8b24cf3ec76388'
          with zipfile.ZipFile('base-v140-outer.zip') as z:
              assert z.testzip() is None
              target='SpotifyControl-Windows-Runtime-Acceptance-v1.4.0.zip'
              assert z.namelist()==[target],z.namelist()
              inner=z.read(target)
          assert len(inner)==23068,len(inner)
          assert hashlib.sha256(inner).hexdigest()=='65057fe1595a7f78a0fd3e138304c6044c42adbaed829541042f485a9e37655d'
          Path('base-v140.zip').write_bytes(inner)
          print('EXACT_STAGE14_V140_ARTIFACT_PASS',len(outer),len(inner),hashlib.sha256(inner).hexdigest())
          PY

      - name: Derive Stage14 v1.4.1 only from exact validated v1.4.0
        shell: python
        run: |
          import hashlib,runpy
          from pathlib import Path
          p=Path('validation/stage14-v1.4.1/build_stage14_v141.py')
          data=p.read_bytes()
          print('V141_BUILDER',len(data),hashlib.sha256(data).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Verify repaired live production trust anchor and patch contract
        shell: python
        run: |
          import base64,gzip,hashlib,json,subprocess
          def sha(b): return hashlib.sha256(b).hexdigest()
          def gb(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'])
          m=json.loads(gb('origin/main','manifest.json').decode('utf-8-sig'))
          assert m['latest_version']=='0.6.17'
          assert m['source_commit']=='36b15a2ed2f9a23fffbeaf91de78b7854f6108b2'
          assert m['payload_set_sha256']=='0f7fe384630e027466aa734ac669b410774b4569db231982212b7fa565b691a0'
          assert m['bootstrap']=={'version':'1.0.6','sha256':'d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6','size':42963}
          latest={x['path']:(x['sha256'],int(x['size'])) for x in m['latest_files']}
          assert latest=={
            'bin/spotify-control.ps1':('5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b',266318),
            'bin/addon-manager.ps1':('b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977',154926),
            'bin/spotify-control-agent.vbs':('2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278',4855),
          }
          froms=[e['from_version'] for e in m['updates']];assert len(froms)==len(set(froms))
          for a,b,folder in [
            ('0.6.15','0.6.16','packages/v0.6.16/main-v0615-to-v0616-compat'),
            ('0.6.16','0.6.17','packages/v0.6.17/main-v0616-to-v0617-compat')]:
              e=next(x for x in m['updates'] if x['from_version']==a and x['to_version']==b)
              p=next(x for x in e['patches'] if x['path']=='bin/spotify-control.ps1')
              parts=[]
              for i,c in enumerate(p['chunks']):
                  q=c['path'];assert q==f'{folder}/chunk-{i:03}.txt',q
                  data=gb(m['source_commit'],q);assert len(data)==int(c['size']) and sha(data)==c['sha256'];parts.append(data)
              enc=b''.join(parts);assert len(enc)==int(p['encoded_size']) and sha(enc)==p['encoded_sha256']
              comp=base64.b64decode(enc,validate=True);assert len(comp)==int(p['compressed_size']) and sha(comp)==p['compressed_sha256']
              raw=gzip.decompress(comp);assert len(raw)==int(p['json_size']) and sha(raw)==p['json_sha256']
              doc=json.loads(raw.decode('ascii'))
              assert doc['schema']==1 and doc['kind']=='ascii-line-patch'
              assert doc['bom']=='utf8-bom' and doc['line_ending']=='lf'
              assert doc['from_version']==a and doc['to_version']==b
              print('LIVE_REPAIRED_PATCH_CONTRACT_PASS',a,b,sha(raw),q)
          print('LIVE_STAGE14_V141_TRUST_ANCHOR_PASS')

      - name: Windows PowerShell 5.1 parser and embedded self-validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path '.\stage14-v141-unpacked').Path
          foreach($rel in @('RUN_RUNTIME_ACCEPTANCE.ps1','PRECHECK_RUNTIME_ACCEPTANCE.ps1')){
            $path=Join-Path $root $rel
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PS5.1 parser rejected $rel"}
          }
          python (Join-Path $root 'evidence\validate_stage14.py')
          if($LASTEXITCODE -ne 0){throw 'Stage14 v1.4.1 embedded validator failed.'}
          $s=Get-Content -LiteralPath (Join-Path $root 'RUN_RUNTIME_ACCEPTANCE.ps1') -Raw
          if(-not $s.Contains("`$AcceptanceVersion = '1.4.1'")){throw 'v1.4.1 acceptance version pin missing.'}
          if(-not $s.Contains("`$ExpectedSourceCommit = '36b15a2ed2f9a23fffbeaf91de78b7854f6108b2'")){throw 'repaired source commit pin missing.'}
          if($s.Contains('e51f73c90c50cb55e3e3dffe3b55a6f6b1af0b4c')){throw 'stale pre-repair source commit remains.'}
          Write-Host 'STAGE14_V141_WINDOWS_PS51_AND_SELF_VALIDATION_PASS'

      - name: ZIP CRC internal SHA256SUMS and final identity
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,zipfile
          p=Path('SpotifyControl-Windows-Runtime-Acceptance-v1.4.1.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for line in z.read('SHA256SUMS.txt').decode('ascii').splitlines():
                  h,rel=line.split('  ',1);assert hashlib.sha256(z.read(rel)).hexdigest()==h,(rel,h)
              report=json.loads(z.read('evidence/SELF_VALIDATION_REPORT.json').decode('utf-8'))
              assert report['passed']==report['total']==25
          data=p.read_bytes()
          print('V141_FINAL_ZIP',len(data),hashlib.sha256(data).hexdigest())
          print('V141_RUNTIME_SCRIPT',report['script_sha256'])

      - name: Upload exact validated Stage14 v1.4.1 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.4.1
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.4.1.zip
          if-no-files-found: error
          compression-level: 0
