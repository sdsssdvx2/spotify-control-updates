name: Validate Spotify Control r6 ivLyrics tag bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/v0.6.16/**'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell51-r6:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact stable r5 and derive exact r6 candidate
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib, json, subprocess

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['latest_version']=='0.6.15'
          assert manifest['source_commit']=='2f8377829ab61dcb88d265bdbd484181f084aef9'
          edge=next(e for e in manifest['updates'] if e['from_version']=='0.6.14' and e['to_version']=='0.6.15')
          ap=next(p for p in edge['patches'] if p['path']=='bin/addon-manager.ps1')
          parts=[]
          for c in ap['chunks']:
              data=subprocess.check_output(['git','show',f"{manifest['source_commit']}:{c['path']}"])
              assert len(data)==c['size'], c['path']
              assert hashlib.sha256(data).hexdigest()==c['sha256'], c['path']
              parts.append(data)
          encoded=b''.join(parts)
          assert len(encoded)==ap['encoded_size'] and hashlib.sha256(encoded).hexdigest()==ap['encoded_sha256']
          compressed=base64.b64decode(encoded,validate=True)
          assert len(compressed)==ap['compressed_size'] and hashlib.sha256(compressed).hexdigest()==ap['compressed_sha256']
          r5=gzip.decompress(compressed)
          assert len(r5)==128714
          assert hashlib.sha256(r5).hexdigest()=='56185d3b23c4b0df455673ad3f601d67c7980b7428f1d15b3e0465d1a7859022'

          patch_encoded=Path('validation/v0.6.16/r5-to-r6.patch.json.gz.b64').read_bytes()
          assert len(patch_encoded)==8768
          assert hashlib.sha256(patch_encoded).hexdigest()=='36b20a04c3bd425472dd1a616a042edcda81cbd0c20824803acc6c619536371c'
          patch_raw=gzip.decompress(base64.b64decode(patch_encoded,validate=True))
          assert len(patch_raw)==26823
          assert hashlib.sha256(patch_raw).hexdigest()=='372cf3d2b19e797cb63b3d6b65c38114f77be12b9a92474c9899692ac2729235'
          patch=json.loads(patch_raw)
          assert patch['schema']==1 and patch['kind']=='line-patch'
          assert patch['from_sha256']==hashlib.sha256(r5).hexdigest()
          assert patch['to_sha256']=='fb2bd974ee795bb697a0e5b534e03477be77b655e60353d82064b1e751bdc686'

          assert r5.startswith(b'\xef\xbb\xbf')
          lines=r5.decode('utf-8-sig').splitlines(keepends=True)
          for op in sorted(patch['operations'],key=lambda x:int(x['start_line']),reverse=True):
              start=int(op['start_line']); delete=int(op['delete_count'])
              insert=str(op.get('insert','')).splitlines(keepends=True)
              lines[start:start+delete]=insert
          r6=b'\xef\xbb\xbf'+''.join(lines).encode('utf-8')
          assert len(r6)==152481
          assert hashlib.sha256(r6).hexdigest()==patch['to_sha256']
          Path('candidate-addon-r6.ps1').write_bytes(r6)

          text=r6.decode('utf-8-sig')
          for needle in [
              '$Version = "0.6.5-r6"',
              'function Get-IvLyricsOfficialTagTree',
              'function Test-IvLyricsTreeAgainstOfficialTag',
              'function Test-IvLyricsOfficialTagFallbackEligible',
              'function Get-IvLyricsInstalledBaselineProof',
              'function Invoke-IvLyricsOfficialTagProofOnlineSelfTest',
              'function Invoke-CommitCycleSelfTest',
              '84a6fc5410d6e52867a573d498a5d724a8b2ccec',
              'Commit-cycle self-test passed: awaiting-apply -> CommitLast -> terminal ledger/state/report -> actionable pending zero.',
              'Fresh actionable addon pending bypasses the 168-hour schedule gate',
              'Force/reinstall semantics remain disabled'
          ]:
              assert needle in text, needle
          assert text.count('ivLyrics release must contain exactly one archive and checksum asset.') >= 3
          assert 'absent-no-auto-install' in text
          print('R6_DERIVATION_PASS',len(r6),hashlib.sha256(r6).hexdigest())

      - name: Windows PowerShell 5.1 parser and full offline SelfTest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-Local'
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-Roaming'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify') | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $path=(Resolve-Path '.\candidate-addon-r6.ps1').Path
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors|ForEach-Object{Write-Error $_.Message};throw 'Windows PowerShell 5.1 parser rejected r6.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "r6 offline SelfTest failed: $LASTEXITCODE"}
          Write-Host 'R6_PS51_OFFLINE_SELFTEST_PASS'

      - name: Real ivLyrics v6.1.18 historical-tag proof and latest strict-release proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-online-Local'
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-online-Roaming'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify') | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\candidate-addon-r6.ps1 -Action IvLyricsTagProofSelfTest
          if($LASTEXITCODE -ne 0){throw "r6 ivLyrics online proof SelfTest failed: $LASTEXITCODE"}
          Write-Host 'R6_IVLYRICS_ONLINE_PROOF_PASS'

      - name: Upload exact validated r6 candidate
        uses: actions/upload-artifact@v4
        with:
          name: spotify-control-addon-manager-v0.6.5-r6-validated
          path: candidate-addon-r6.ps1
          if-no-files-found: error
          compression-level: 6
