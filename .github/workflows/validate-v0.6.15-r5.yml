name: Validate Spotify Control v0.6.17 bootstrap patch contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/bootstrap-contract-repair/**'
      - 'packages/v0.6.17/bootstrap-contract-repair/**'
      - 'manifest.json'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  push:
    branches: [main]
    paths:
      - 'packages/v0.6.17/bootstrap-contract-repair/**'
      - 'manifest.json'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-bootstrap-v106-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Prepare or final-validate bootstrap-compatible transport
        shell: python
        run: |
          import hashlib,runpy
          from pathlib import Path
          p=Path('validation/bootstrap-contract-repair/repair_v0616_v0617_patch_contract.py')
          print('REPAIR_VALIDATOR',len(p.read_bytes()),hashlib.sha256(p.read_bytes()).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Publish repair transport and pin candidate manifest
        if: ${{ github.event_name == 'pull_request' && hashFiles('packages/v0.6.17/bootstrap-contract-repair/**') == '' }}
        shell: powershell
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference='Stop'
          $pub='.\publication-bootstrap-contract-repair'
          $src=Join-Path $pub 'packages\v0.6.17\bootstrap-contract-repair'
          if(-not(Test-Path -LiteralPath $src -PathType Container)){throw 'Prepared repair transport missing.'}
          New-Item -ItemType Directory -Force -Path '.\packages\v0.6.17\bootstrap-contract-repair' | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination '.\packages\v0.6.17\bootstrap-contract-repair' -Recurse -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'packages/v0.6.17/bootstrap-contract-repair'
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'No repair transport bytes staged.'}
          git commit -m 'Publish bootstrap-compatible v0.6.16-v0.6.17 patch transport'
          if($LASTEXITCODE -ne 0){throw 'Repair transport commit failed.'}
          $transportSha=(git rev-parse HEAD).Trim()
          if($transportSha -notmatch '^[0-9a-f]{40}$'){throw "Invalid transport SHA $transportSha"}
          git push origin ("HEAD:"+$env:HEAD_REF)
          if($LASTEXITCODE -ne 0){throw 'Repair transport push failed.'}
          $env:TRANSPORT_SHA=$transportSha
          python -c "import os;from pathlib import Path;p=Path('publication-bootstrap-contract-repair/manifest-template.json');s=p.read_text(encoding='utf-8');assert s.count('__SOURCE_COMMIT__')==1;Path('manifest.json').write_bytes(s.replace('__SOURCE_COMMIT__',os.environ['TRANSPORT_SHA']).encode('utf-8'))"
          if($LASTEXITCODE -ne 0){throw 'Candidate manifest generation failed.'}
          git add -- manifest.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'No candidate manifest change staged.'}
          git commit -m 'Repair stable v0.6.17 bootstrap patch document contract'
          if($LASTEXITCODE -ne 0){throw 'Candidate manifest commit failed.'}
          git push origin ("HEAD:"+$env:HEAD_REF)
          if($LASTEXITCODE -ne 0){throw 'Candidate manifest push failed.'}
          python validation/bootstrap-contract-repair/repair_v0616_v0617_patch_contract.py
          if($LASTEXITCODE -ne 0){throw 'Post-publication repair validation failed.'}
          Write-Host ("BOOTSTRAP_REPAIR_PUBLICATION_PUSHED source_commit="+$transportSha)

      - name: Reconstruct exact bootstrap 1.0.6 and v0.6.15 fixture
        shell: python
        run: |
          import hashlib,runpy
          from pathlib import Path
          p=Path('validation/bootstrap-contract-repair/build_bootstrap_fixture.py')
          print('FIXTURE_BUILDER',len(p.read_bytes()),hashlib.sha256(p.read_bytes()).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Windows PowerShell 5.1 exact Check RollbackTest Update cycle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path '.\ci-bootstrap-fixture\LocalAppData\SpotifyControl').Path
          $bin=Join-Path $root 'bin'
          $boot=Join-Path $bin 'spotify-control-bootstrap.ps1'
          $expectedBoot='d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $boot).Hash.ToLowerInvariant() -ne $expectedBoot){throw 'Exact bootstrap hash mismatch.'}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($boot,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Exact bootstrap 1.0.6 parser rejected source.'}
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($boot,[ref]$tokens,[ref]$errors)
          $paramNames=@($ast.ParamBlock.Parameters|ForEach-Object{$_.Name.VariablePath.UserPath})
          Write-Host ('BOOTSTRAP_PARAMS='+($paramNames -join ','))

          # On PRs only, point the exact parser code at the immutable candidate-manifest commit.
          # The only changed source text is the manifest URL literal; production push validation uses the exact unmodified file.
          if('${{ github.event_name }}' -eq 'pull_request'){
            $head=(git rev-parse HEAD).Trim()
            $old='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/main/manifest.json'
            $new=('https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/'+$head+'/manifest.json')
            $text=[IO.File]::ReadAllText($boot)
            $count=([regex]::Matches($text,[regex]::Escape($old))).Count
            if($count -ne 1){throw "Expected exactly one production manifest URL in bootstrap, found $count"}
            $text=$text.Replace($old,$new)
            [IO.File]::WriteAllText($boot,$text,[Text.UTF8Encoding]::new($true))
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($boot,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw 'Manifest-URL-only CI copy failed PS5.1 parse.'}
            Write-Host ('PR_MANIFEST_URL='+$new)
          } else {
            if((Get-FileHash -Algorithm SHA256 -LiteralPath $boot).Hash.ToLowerInvariant() -ne $expectedBoot){throw 'Push validation must use byte-exact bootstrap 1.0.6.'}
            Write-Host 'USING_BYTE_EXACT_BOOTSTRAP_V106_AGAINST_MAIN'
          }

          $env:LOCALAPPDATA=(Resolve-Path '.\ci-bootstrap-fixture\LocalAppData').Path
          $env:APPDATA=Join-Path (Resolve-Path '.\ci-bootstrap-fixture').Path 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          function Run-Boot([string]$Action){
            $out=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $boot -Action $Action 2>&1
            $code=$LASTEXITCODE
            Write-Host ("BOOTSTRAP_"+$Action+"_EXIT="+$code)
            $out|ForEach-Object{Write-Host $_}
            if($code -ne 0){throw "Bootstrap $Action failed with exit $code"}
            $last=@($out|Where-Object{[string]$_ -match '^\s*\{'})|Select-Object -Last 1
            if(-not $last){throw "Bootstrap $Action emitted no JSON result"}
            return ($last|ConvertFrom-Json)
          }
          $check=Run-Boot 'Check'
          if(-not $check.success -or [string]$check.installed_version -ne '0.6.15'){throw 'Check did not see exact v0.6.15 fixture.'}
          if([int]$check.result.edge_count -ne 2){throw ('Check edge_count expected 2, got '+$check.result.edge_count)}
          $rb=Run-Boot 'RollbackTest'
          if(-not $rb.success -or [string]$rb.transaction_status -ne 'rolled-back'){throw 'RollbackTest did not finish rolled-back.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'spotify-control.ps1')).Hash.ToLowerInvariant() -ne '4faef1e70be20efb551f595c02dad171a44abbe8a53af9a0576dc54fd0e2004f'){throw 'RollbackTest did not restore v0.6.15 main.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'addon-manager.ps1')).Hash.ToLowerInvariant() -ne '56185d3b23c4b0df455673ad3f601d67c7980b7428f1d15b3e0465d1a7859022'){throw 'RollbackTest did not restore r5 addon.'}
          $up=Run-Boot 'Update'
          if(-not $up.success -or [string]$up.transaction_status -ne 'committed'){throw 'Update did not commit.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'spotify-control.ps1')).Hash.ToLowerInvariant() -ne '5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b'){throw 'Update main target mismatch.'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $bin 'addon-manager.ps1')).Hash.ToLowerInvariant() -ne 'b7d1a4bc7707533400402fe42e60d724f88656c2477d4d4a5c0f47be60f47977'){throw 'Update addon target mismatch.'}
          $post=Run-Boot 'Check'
          if(-not $post.success -or [string]$post.result.status -ne 'already-current'){throw 'Post-update Check is not already-current.'}
          Write-Host 'BOOTSTRAP_V106_FULL_TWO_EDGE_CYCLE_PASS'

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v106-contract-evidence
          path: |
            publication-bootstrap-contract-repair
            ci-bootstrap-fixture/LocalAppData/SpotifyControl/bin/spotify-control-bootstrap.ps1
          if-no-files-found: warn
          compression-level: 6
