name: Validate and publish Spotify Control v0.6.16 r6

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/v0.6.16/**'
      - 'packages/v0.6.16/**'
      - 'manifest.json'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-powershell51-v0616:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Prepare or final-validate exact v0.6.16 publication
        shell: python
        run: |
          import hashlib, runpy
          from pathlib import Path
          p=Path('validation/v0.6.16/publish_v0616.py')
          data=p.read_bytes()
          print('PUBLISH_VALIDATOR',len(data),hashlib.sha256(data).hexdigest())
          runpy.run_path(str(p),run_name='__main__')

      - name: Windows PowerShell 5.1 parser, offline SelfTest and real ivLyrics proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($rel in @('publication-v0.6.16\candidate-main-v0.6.16.ps1','publication-v0.6.16\candidate-addon-v0.6.5-r6.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $rel).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PS5.1 parser rejected $rel"}
          }
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-Local'
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'SpotifyControl-r6-Roaming'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify') | Out-Null
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $addon=(Resolve-Path 'publication-v0.6.16\candidate-addon-v0.6.5-r6.ps1').Path
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "r6 offline SelfTest failed: $LASTEXITCODE"}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $addon -Action IvLyricsTagProofSelfTest
          if($LASTEXITCODE -ne 0){throw "r6 online ivLyrics proof failed: $LASTEXITCODE"}
          Write-Host 'V0616_R6_PS51_AND_SELFTESTS_PASS'

      - name: Publish immutable transport then pin its source commit
        if: ${{ hashFiles('packages/v0.6.16/**') == '' && github.event_name == 'pull_request' }}
        shell: powershell
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path -LiteralPath '.\packages\v0.6.16'){throw 'v0.6.16 package path unexpectedly exists before first publication.'}
          New-Item -ItemType Directory -Force -Path '.\packages\v0.6.16' | Out-Null
          Copy-Item -Path '.\publication-v0.6.16\packages\v0.6.16\*' -Destination '.\packages\v0.6.16' -Recurse -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'packages/v0.6.16'
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'No v0.6.16 transport bytes were staged.'}
          git commit -m 'Publish immutable v0.6.16 transport'
          if($LASTEXITCODE -ne 0){throw 'Transport commit failed.'}
          $transportSha=(git rev-parse HEAD).Trim()
          if($transportSha -notmatch '^[0-9a-f]{40}$'){throw "Invalid transport commit SHA: $transportSha"}
          git push origin ("HEAD:"+$env:HEAD_REF)
          if($LASTEXITCODE -ne 0){throw 'Transport push failed.'}
          $env:TRANSPORT_SHA=$transportSha
          python -c "import os; from pathlib import Path; p=Path('publication-v0.6.16/manifest-template.json'); s=p.read_text(encoding='utf-8'); assert s.count('__SOURCE_COMMIT__')==1; Path('manifest.json').write_bytes(s.replace('__SOURCE_COMMIT__',os.environ['TRANSPORT_SHA']).encode('utf-8'))"
          if($LASTEXITCODE -ne 0){throw 'Manifest source pin generation failed.'}
          git add -- manifest.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'No manifest change was staged.'}
          git commit -m 'Publish stable v0.6.16 manifest'
          if($LASTEXITCODE -ne 0){throw 'Manifest commit failed.'}
          git push origin ("HEAD:"+$env:HEAD_REF)
          if($LASTEXITCODE -ne 0){throw 'Manifest push failed.'}
          Write-Host ("V0616_PUBLICATION_PUSHED source_commit="+$transportSha)

      - name: Upload exact v0.6.16 validation output
        uses: actions/upload-artifact@v4
        with:
          name: spotify-control-v0.6.16-validation-output
          path: publication-v0.6.16
          if-no-files-found: error
          compression-level: 6
