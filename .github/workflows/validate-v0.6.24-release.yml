name: Validate Spotify Control v0.6.24 Release

on:
  push:
    branches:
      - release/v0.6.24-archive-resource-hardening-r13
    paths:
      - 'manifest.json'
      - 'packages/v0.6.24/**'
      - 'validation/v0.6.24/**'
      - '.github/workflows/validate-v0.6.24-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'packages/v0.6.24/**'
      - 'validation/v0.6.24/**'
      - '.github/workflows/prepare-v0.6.24-release.yml'
      - '.github/workflows/validate-v0.6.24-release.yml'
      - '.github/workflows/validate-v0.6.24-bootstrap-e2e.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact event head and release scope
        shell: powershell
        run: |
          $base='23e91427fd745227825d94eb48d804654ca54ee4'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Release no longer descends from exact v0.6.23 stable base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          foreach($p in $changed){
            $ok=($p -ceq 'manifest.json' -or $p -like 'packages/v0.6.24/*' -or $p -like 'validation/v0.6.24/*' -or $p -ceq '.github/workflows/prepare-v0.6.24-release.yml' -or $p -ceq '.github/workflows/validate-v0.6.24-release.yml' -or $p -ceq '.github/workflows/validate-v0.6.24-bootstrap-e2e.yml')
            if(-not $ok){throw "Unexpected v0.6.24 release path: $p"}
          }
          Write-Host "V0624_RELEASE_SCOPE_PASS head=$actual changed=$($changed.Count)"

      - name: Verify prepared manifest contract
        shell: powershell
        run: |
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.24'){throw "Expected v0.6.24 manifest, got $($m.latest_version)"}
          if($m.source_commit -ne '5597598026c788e32645f31232f40f487f10a2f2'){throw 'Immutable source commit mismatch.'}
          if($m.payload_set_sha256 -ne '07e8519a5e2b0ffd3888e6d9c119e70d5754a7adb81ebdc355ad20ae8260e659'){throw 'Payload set mismatch.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 identity changed.'}
          $latest=@{};foreach($x in @($m.latest_files)){$latest[[string]$x.path]=$x}
          if([int64]$latest['bin/spotify-control.ps1'].size -ne 284312 -or [string]$latest['bin/spotify-control.ps1'].sha256 -ne 'dc5d7ec17f18f7546786c81f3172c08f6fb1692842c2e6c0a69a86171e6b1151'){throw 'Latest main identity mismatch.'}
          if([int64]$latest['bin/addon-manager.ps1'].size -ne 275414 -or [string]$latest['bin/addon-manager.ps1'].sha256 -ne '81343687c475f7f48f1311b09c98205a021776f26e8d55082e0ec47f8ebfb470'){throw 'Latest addon identity mismatch.'}
          if([int64]$latest['bin/spotify-control-agent.vbs'].size -ne 4855 -or [string]$latest['bin/spotify-control-agent.vbs'].sha256 -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278'){throw 'Resident agent identity changed.'}
          $edge=@($m.updates|Where-Object{$_.from_version -eq '0.6.23' -and $_.to_version -eq '0.6.24'})
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'v0.6.23 -> v0.6.24 edge missing/ambiguous.'}
          Write-Host 'V0624_MANIFEST_CONTRACT_PASS'

      - name: Compile and validate immutable published transport
        shell: powershell
        run: |
          python -m py_compile validation/v0.6.24/build_v0624.py validation/v0.6.24/release_transport.py validation/v0.6.24/bootstrap_prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'v0.6.24 Python sources failed compile.'}
          python validation/v0.6.24/release_transport.py --validate-published
          if($LASTEXITCODE -ne 0){throw 'Immutable published transport validation failed.'}
          python validation/v0.6.24/release_transport.py --build-packages
          if($LASTEXITCODE -ne 0){throw 'Deterministic package rebuild failed.'}
          git diff --exit-code -- packages/v0.6.24 validation/v0.6.24/candidate-validation.json validation/v0.6.24/release-metadata.json manifest.json
          if($LASTEXITCODE -ne 0){throw 'Published release differs from deterministic rebuild.'}
          Write-Host 'V0624_IMMUTABLE_TRANSPORT_AND_REBUILD_PASS'

      - name: Parse exact candidate with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($path in @('validation/v0.6.24/out/bin/spotify-control.ps1','validation/v0.6.24/out/bin/addon-manager.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parse failed: $path"}
          }
          Write-Host 'V0624_POWERSHELL_51_PARSE_PASS'

      - name: Verify archive hardening placement and unchanged authority
        shell: python
        run: |
          from pathlib import Path
          import json,re
          main=Path('validation/v0.6.24/out/bin/spotify-control.ps1').read_text(encoding='utf-8-sig')
          addon=Path('validation/v0.6.24/out/bin/addon-manager.ps1').read_text(encoding='utf-8-sig')
          def fn(text,name):
              marker=f'function {name} {{';a=text.index(marker);b=text.find('\nfunction ',a+len(marker));return text[a:len(text) if b<0 else b]
          checks=[
              ('marketplace',fn(main,'Expand-AndValidateMarketplaceAsset'),'Test-SpotifyControlZipArchiveSafety','Expand-Archive'),
              ('ivlyrics',fn(addon,'Download-IvLyricsReleaseStage'),'Test-IvLyricsZipArchiveSafety','Expand-Archive'),
              ('pithaya',fn(addon,'Download-PithayaPinnedStage'),'Test-PithayaZipArchiveSafety','Expand-Archive'),
              ('ivlyrics-online',fn(addon,'Invoke-IvLyricsOfficialTagProofOnlineSelfTest'),'Test-IvLyricsZipArchiveSafety','Expand-Archive'),
          ]
          for label,block,guard,extract in checks:
              if block.count(guard)!=1 or block.count(extract)!=1 or block.index(guard)>block.index(extract): raise SystemExit(f'{label} pre-extraction gate invalid')
          spic=fn(main,'Expand-AndValidateSpicetifyAsset')
          for marker in ('ZipFile]::OpenRead','134217728','268435456','Unsafe path component','Symlink entry refused'):
              if marker.lower() not in spic.lower(): raise SystemExit(f'Spicetify hardening regressed: {marker}')
          registry=fn(addon,'Get-AddonPolicyRegistry')
          auto=re.findall(r"name='([^']+)'.*?mutation_mode='auto'",registry,re.I)
          expected=['better-local-files','eternal-jukebox','ivLyrics','playlist-maker']
          if sorted(x.lower() for x in auto)!=sorted(x.lower() for x in expected): raise SystemExit(f'auto authority drift: {auto}')
          for marker in ("name='sc-cover-ambience.js'","data_policy='never-disable-or-optimize'","protect-ratings-tags-notes","playlist-backed-ratings-preserve","preserve-installed-content"):
              if marker.lower() not in registry.lower(): raise SystemExit(f'protected policy missing: {marker}')
          report=json.loads(Path('validation/v0.6.24/candidate-validation.json').read_text())
          if report['authority_expanded'] is not False or report['protected_registry_unchanged'] is not True or report['source_adapter_catalog_unchanged'] is not True or report['spicetify_extractor_unchanged'] is not True: raise SystemExit('candidate preservation report failed')
          print('V0624_ARCHIVE_PLACEMENT_AND_AUTHORITY_PASS')

      - name: Generate and reject malicious ZIP fixtures
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root=Path('validation/v0.6.24/fixtures');root.mkdir(parents=True,exist_ok=True)
          def tiny(name,entries):
              with zipfile.ZipFile(root/name,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:
                  for path,data in entries:z.writestr(path,data)
          tiny('benign.zip',[('root/manifest.json','{}'),('root/index.js','ok')]);tiny('traversal.zip',[('../evil.txt','x')]);tiny('absolute.zip',[('/evil.txt','x')]);tiny('drive.zip',[('C:/evil.txt','x')]);tiny('duplicate-case.zip',[('Root/file.txt','a'),('root/FILE.txt','b')])
          with zipfile.ZipFile(root/'symlink.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              zi=zipfile.ZipInfo('root/link');zi.create_system=3;zi.external_attr=(0o120777<<16);z.writestr(zi,'target')
          def many(name,count):
              with zipfile.ZipFile(root/name,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:
                  for i in range(count):z.writestr(f'root/f{i:05d}.txt','x')
          many('too-many-ivlyrics.zip',4097);many('too-many-pithaya.zip',8193);many('too-many-marketplace.zip',16385)
          zero=b'\0'*(1024*1024)
          with zipfile.ZipFile(root/'oversized-entry.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              with z.open('root/big.bin','w') as f:
                  for _ in range(129):f.write(zero)
          with zipfile.ZipFile(root/'expanded-total.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for n in range(5):
                  with z.open(f'root/big-{n}.bin','w') as f:
                      for _ in range(110):f.write(zero)
          print('V0624_ZIP_FIXTURES_BUILT')

      - name: Execute exact archive safety helpers against fixtures
        shell: powershell
        run: |
          function Get-FunctionText([string]$Path,[string]$Name){$text=Get-Content -LiteralPath $Path -Raw;$marker="function $Name {";$start=$text.IndexOf($marker,[StringComparison]::Ordinal);if($start -lt 0){throw "Missing function $Name"};$next=$text.IndexOf("`nfunction ",$start+$marker.Length,[StringComparison]::Ordinal);if($next -lt 0){$next=$text.Length};return $text.Substring($start,$next-$start)}
          $main='validation/v0.6.24/out/bin/spotify-control.ps1';$addon='validation/v0.6.24/out/bin/addon-manager.ps1'
          Invoke-Expression (Get-FunctionText $main 'Test-SpotifyControlZipArchiveSafety');Invoke-Expression (Get-FunctionText $addon 'Test-IvLyricsZipArchiveSafety');Invoke-Expression (Get-FunctionText $addon 'Test-PithayaZipArchiveSafety')
          function Test-PathSafe([string]$Path,[string]$Type){if($Type -ceq 'Leaf'){return(Test-Path -LiteralPath $Path -PathType Leaf)};if($Type -ceq 'Container'){return(Test-Path -LiteralPath $Path -PathType Container)};return(Test-Path -LiteralPath $Path)}
          function Assert-Rejected([scriptblock]$Body,[string]$Label){$ok=$false;try{&$Body|Out-Null}catch{$ok=$true;Write-Host "REJECTED $Label :: $($_.Exception.Message)"};if(-not$ok){throw "Malicious fixture accepted: $Label"}}
          $fx=(Resolve-Path 'validation/v0.6.24/fixtures').Path;$benign=Join-Path $fx 'benign.zip'
          if((Test-SpotifyControlZipArchiveSafety -ZipPath $benign -Label 'Marketplace').EntryCount -ne 2){throw 'Marketplace benign fixture failed.'};if((Test-IvLyricsZipArchiveSafety -ZipPath $benign).EntryCount -ne 2){throw 'ivLyrics benign fixture failed.'};if((Test-PithayaZipArchiveSafety -ZipPath $benign -Name fixture).EntryCount -ne 2){throw 'Pithaya benign fixture failed.'}
          foreach($bad in @('traversal.zip','absolute.zip','drive.zip','duplicate-case.zip','symlink.zip','oversized-entry.zip','expanded-total.zip')){$p=Join-Path $fx $bad;Assert-Rejected {Test-SpotifyControlZipArchiveSafety -ZipPath $p -Label Marketplace} "marketplace/$bad";Assert-Rejected {Test-IvLyricsZipArchiveSafety -ZipPath $p} "ivlyrics/$bad";Assert-Rejected {Test-PithayaZipArchiveSafety -ZipPath $p -Name fixture} "pithaya/$bad"}
          Assert-Rejected {Test-IvLyricsZipArchiveSafety -ZipPath (Join-Path $fx 'too-many-ivlyrics.zip')} 'ivlyrics/too-many';Assert-Rejected {Test-PithayaZipArchiveSafety -ZipPath (Join-Path $fx 'too-many-pithaya.zip') -Name fixture} 'pithaya/too-many';Assert-Rejected {Test-SpotifyControlZipArchiveSafety -ZipPath (Join-Path $fx 'too-many-marketplace.zip') -Label Marketplace} 'marketplace/too-many'
          Write-Host 'V0624_MALICIOUS_ARCHIVE_FIXTURES_PASS'

      - name: Run Addon Manager read-only SelfTest
        shell: powershell
        run: |
          $spotifyRoot=Join-Path $env:LOCALAPPDATA 'Spotify';New-Item -ItemType Directory -Force -Path $spotifyRoot|Out-Null
          try{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.24/out/bin/addon-manager.ps1 -Action SelfTest;if($LASTEXITCODE -ne 0){throw "Addon Manager r13 SelfTest failed: $LASTEXITCODE"};Write-Host 'V0624_ADDON_SELFTEST_PASS'}finally{Remove-Item -LiteralPath $spotifyRoot -Recurse -Force -ErrorAction SilentlyContinue}

      - name: Prove immutable source commit excludes manifest publication
        shell: powershell
        run: |
          $source='5597598026c788e32645f31232f40f487f10a2f2'
          $mAtSource=(git show "$source`:manifest.json"|Out-String|ConvertFrom-Json)
          if($mAtSource.latest_version -ne '0.6.23'){throw 'Immutable transport source unexpectedly already published v0.6.24 manifest.'}
          foreach($p in @(git diff --name-only '23e91427fd745227825d94eb48d804654ca54ee4...'$source)){if($p -eq 'manifest.json'){throw 'Immutable source commit altered manifest.'}}
          Write-Host 'V0624_IMMUTABLE_SOURCE_SEPARATION_PASS'
