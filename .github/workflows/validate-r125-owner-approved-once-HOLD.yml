name: HOLD R125 exact two-function owner-candidate build-only
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-r125-owner-approved-once-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1
permissions: {contents: read}
jobs:
  r125-buildonly:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Reconstruct pinned R70 original source without owner-PC changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'R125_ORIGINAL_PUBLIC_MAIN_DRIFT'
          }
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          foreach($py in @(
            'build-combined-exit-and-shortcut-R37-HOLD.py',
            'build-eventdriven-vbs-R45-HOLD.py',
            'build-single-discovery-maintenance-R49-HOLD.py',
            'build-shared-maintenance-lock-R54-HOLD.py',
            'build-rapid-restart-vbs-R58-HOLD.py',
            'build-wmi-selfheal-R63-HOLD.py',
            'build-wmi-rebind-R66-HOLD.py',
            'build-wmi-logon-recovery-R69-HOLD.py',
            'build-boot-wmi-release-R70-HOLD.py'
          )){
            & python ($base+$py)
            if($LASTEXITCODE -ne 0){throw ('R125_EXACT_SOURCE_BUILD_FAILED_'+$py)}
          }
          Write-Host 'R125_R70_ORIGINAL_PREDECESSOR_BUILT=PASS'
      - name: Execute exact R125 PowerShell code against read-only original bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='validation/spotify-exit-immediate-maintenance-HOLD/out/release-staging-boot-wmi-R70/bin/spotify-control.ps1'
          $expected='b2b2fbf1afb60b58d501312160f7e2437c2452e90cb61ca8c2be0d877f92232d'
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){
            throw 'R125_PARENT_SOURCE_PIN_MISMATCH'
          }
          $script='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $bytes=[IO.File]::ReadAllBytes($script)
          $parseErrors=$null
          $tokens=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput(
            [Text.Encoding]::UTF8.GetString($bytes),[ref]$tokens,[ref]$parseErrors)
          if($null -eq $ast -or @($parseErrors).Count -ne 0){
            throw 'R125_POWERSHELL_PARSER_FAILED'
          }
          Write-Host 'R125_POWERSHELL_51_SYNTAX=PASS'
          $result=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode BuildOnly -SourcePath $source)
          if($LASTEXITCODE -ne 0 -or
             $result -cnotcontains 'R125_TWO_FUNCTION_PATCH=EXACT_SHA_PASS' -or
             $result -cnotcontains 'R125_SOURCE_WRITES=ZERO' -or
             $result -cnotcontains 'RESULT=BUILDONLY_PASS_NO_MUTATION'){
            $safe=@($result | Where-Object {$_ -match '^((HOLD_REASON|FAILED_PHASE|RESULT|R125_TWO_FUNCTION_PATCH|R125_SOURCE_WRITES)=[A-Z_0-9]+)$'})
            Write-Host ($safe -join [Environment]::NewLine)
            throw 'R125_R112_OWNER_BUILDER_NOT_BYTE_IDENTICAL'
          }
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){
            throw 'R125_BUILDONLY_SOURCE_CHANGED'
          }
          Write-Host 'R125_R112_TWO_FUNCTION_BYTE_IDENTICAL=PASS'
          Write-Host 'R125_NO_PRODUCTION_WINDOWS_OR_HOSTED_OWNER_MUTATIONS=PASS'
      - name: Reproduce user ScriptBlock.Create invocation with no approval and admin admission
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $data=[IO.File]::ReadAllText($script,[Text.Encoding]::UTF8)
          foreach($case in @(
            @{Label='NO_APPROVAL';Args=@('-Mode','Once');Expected='R125_EXPLICIT_APPROVAL_REQUIRED'},
            @{Label='ADMIN_REFUSAL';Args=@('-Mode','Once','-ApprovalPhrase','APPROVE_R125_ONCE_SPOTIFY_CONTROL_AND_SPICETIFY');Expected='R125_STANDARD_OWNER_REQUIRED'}
          )){
            $actual=@()
            $b=[ScriptBlock]::Create($data)
            if($case.Label -ceq 'NO_APPROVAL'){
              $actual=@(& $b -Mode Once)
            }else{
              $actual=@(& $b -Mode Once -ApprovalPhrase 'APPROVE_R125_ONCE_SPOTIFY_CONTROL_AND_SPICETIFY')
            }
            # R125 emits one newline-joined receipt, not one pipeline item
            # per key. Normalize it before asserting the exact allowlist.
            $receipt=@(($actual -join [Environment]::NewLine) -split '[\r\n]+' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if($receipt -cnotcontains ('HOLD_REASON='+$case.Expected) -or
               $receipt -cnotcontains 'RESULT=HOLD_NO_AUTOMATIC_RETRY' -or
               $receipt -cnotcontains 'SPOTIFY_CONTROL_PUBLIC_MAIN=UNCHANGED' -or
               $receipt -cnotcontains 'ORIGINAL_USER_FILES_DELETED=NO'){
              $safe=@($receipt | Where-Object {$_ -match '^(HOLD_REASON|FAILED_PHASE|RESULT|SPOTIFY_CONTROL_PUBLIC_MAIN|ORIGINAL_USER_FILES_DELETED)=[A-Z_0-9]+$'})
              Write-Host ('R125_SCOPE_RECEIPT_SAFE_DIAGNOSTIC='+($safe -join ';'))
              throw ('R125_DYNAMIC_INVOCATION_FAILURE_'+$case.Label)
            }
            Write-Host ('R125_USER_SCOPE_AND_RECEIPT_'+$case.Label+'=PASS')
          }
          Write-Host 'R125_REAL_OWNER_PC_MODIFICATIONS=ZERO_HOSTED_TEST_ONLY'
      - name: Validate live-status drift admission against exact R125 source helpers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $script='validation/spotify-exit-immediate-maintenance-HOLD/owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $errors=$null;$tokens=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R125_STATE_CONTRACT_SOURCE_SYNTAX'}
          $names=@('StateClass','StateFlag','StateDecisionClass')
          $defs=@($ast.FindAll({param($x) $x -is [Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -cin $names},$true))
          if($defs.Count -ne 3){throw 'R125_STATE_CONTRACT_NOT_EXACT_THREE_FUNCTIONS'}
          . ([ScriptBlock]::Create((@($defs | ForEach-Object{$_.Extent.Text}) -join [Environment]::NewLine)))
          $old=[pscustomobject]@{
            agent_mutation_enabled=$true;pending_addon_auto_ambiguous=0
            maintenance_check_healthy=$true;pending_maintenance=$false;pending_spicetify_upgrade=$false
            last_agent_decision='closed-check-not-due'
          }
          $drift=[pscustomobject]@{
            agent_mutation_enabled=$true;pending_addon_auto_ambiguous=0
            maintenance_check_healthy=$false;pending_maintenance=$true;pending_spicetify_upgrade=$true
            last_agent_decision='closed-idle-or-not-due'
          }
          $ambig=[pscustomobject]@{agent_mutation_enabled=$true;pending_addon_auto_ambiguous=2}
          $disarmed=[pscustomobject]@{agent_mutation_enabled=$false;pending_addon_auto_ambiguous=0}
          $unknown=[pscustomobject]@{agent_mutation_enabled=$true}
          foreach($entry in @(
            @{name='BASELINE';state=$old;expected='ARMED_FRESH_DISCOVERY_REQUIRED'},
            @{name='DYNAMIC_STALE_FLAGS';state=$drift;expected='ARMED_FRESH_DISCOVERY_REQUIRED'},
            @{name='AUTO_AMBIGUITY';state=$ambig;expected='AUTO_AMBIGUITY_PRESENT'},
            @{name='OWNER_DISARM';state=$disarmed;expected='MUTATION_DISARMED'},
            @{name='MISSING_AMBIGUITY';state=$unknown;expected='AUTO_AMBIGUITY_UNVERIFIED'}
          )){
            $r=StateClass $entry.state
            if($r -cne $entry.expected){throw ('R125_STATE_CONTRACT_'+$entry.name)}
            Write-Host ('R125_STATE_'+$entry.name+'=PASS')
          }
          if((StateFlag $drift 'maintenance_check_healthy') -cne 'FALSE' -or
             (StateFlag $drift 'pending_maintenance') -cne 'TRUE' -or
             (StateDecisionClass $drift) -cne 'closed-idle-or-not-due'){
            throw 'R125_STATE_CLASSIFICATION_INCORRECT'
          }
          Write-Host 'R125_STATE_CLASSIFICATION_ONLY_NOT_UPDATE_AUTHORIZATION=PASS'
      - name: Native Windows scratch atomic R112 swap and exact original recovery
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          & python ($base+'build-private-stable-ahead-R112-HOLD.py')
          if($LASTEXITCODE -ne 0){throw 'R125_R112_CANDIDATE_REBUILD_FAILED'}
          $original=$base+'out/release-staging-boot-wmi-R70/bin/spotify-control.ps1'
          $candidate=$base+'out/private-stable-ahead-R112/spotify-control.ps1'
          $oldSHA='b2b2fbf1afb60b58d501312160f7e2437c2452e90cb61ca8c2be0d877f92232d'
          $newSHA='beb850064670c078a679585ace25f8071daa88c0b264185c03ef3364329b431b'
          if((Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant() -cne $oldSHA -or
             (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newSHA){
            throw 'R125_OFFICIAL_R112_SOURCE_PINS_CHANGED'
          }
          $script=$base+'owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $parseErrors=$null;$tokens=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors)
          if(@($parseErrors).Count -ne 0){throw 'R125_SOURCE_PARSE_ERROR'}
          $names=@('HashBytes','HashFile','Regular','Fail','Acquire','Release','ReplaceMain')
          $defs=@($ast.FindAll({param($x) $x -is [Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -cin $names},$true))
          if($defs.Count -ne $names.Count){throw 'R125_SCRATCH_SWAP_SOURCE_EXTRACTION_DRIFT'}
          . ([ScriptBlock]::Create((@($defs | ForEach-Object {$_.Extent.Text}) -join [Environment]::NewLine)))
          $script:StageRoot=Join-Path $env:RUNNER_TEMP ('R125-Atomic-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $script:StageRoot -ErrorAction Stop | Out-Null
          $bin=Join-Path $script:StageRoot 'bin'
          New-Item -ItemType Directory -Path $bin -ErrorAction Stop | Out-Null
          $script:OriginalMain=Join-Path $bin 'spotify-control.ps1'
          Copy-Item -LiteralPath $original -Destination $script:OriginalMain -ErrorAction Stop
          $script:SourceSwapped=$false
          if(@(Get-Process -Name Spotify -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'R125_HOSTED_SCRATCH_SPOTIFY_PROCESS_PRESENT'
          }
          ReplaceMain $oldSHA ([IO.File]::ReadAllBytes($candidate)) 'before-swap.ps1'
          if(-not $script:SourceSwapped -or
             (HashFile $script:OriginalMain) -cne $newSHA -or
             (HashFile (Join-Path $script:StageRoot 'before-swap.ps1')) -cne $oldSHA){
            throw 'R125_SCRATCH_SWAP_CONTENT_NOT_PROVEN'
          }
          Write-Host 'R125_WINDOWS_NATIVE_ATOMIC_R112_SWAP=PASS'
          ReplaceMain $newSHA ([IO.File]::ReadAllBytes($original)) 'failed-r112.ps1'
          if((HashFile $script:OriginalMain) -cne $oldSHA -or
             (HashFile (Join-Path $script:StageRoot 'failed-r112.ps1')) -cne $newSHA){
            throw 'R125_SCRATCH_ROLLBACK_CONTENT_NOT_PROVEN'
          }
          Write-Host 'R125_WINDOWS_NATIVE_ATOMIC_ORIGINAL_RECOVERY=PASS'
          Write-Host 'R125_OWNER_PC_AND_SPOTIFY_CONFIGURATION_UNCHANGED=PASS'
      - name: Confirm exact already-installed R112 identity and no redundant source swap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          # The earlier native scratch swap step already built R112 in this
          # checkout; reuse those exact bytes instead of rebuilding over them.
          $candidate=$base+'out/private-stable-ahead-R112/spotify-control.ps1'
          if(-not (Test-Path -LiteralPath $candidate -PathType Leaf)){
            throw 'R125_R112_CANDIDATE_FIXTURE_MISSING'
          }
          $source=$base+'owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $old=$base+'out/release-staging-boot-wmi-R70/bin/spotify-control.ps1'
          $candidate=$base+'out/private-stable-ahead-R112/spotify-control.ps1'
          $inputText=[IO.File]::ReadAllText($source,[Text.Encoding]::UTF8)
          $errors=$null;$tokens=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput($inputText,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R125_REVISED_SOURCE_PARSER_ERROR'}
          $fn=@($ast.FindAll({
            param($x) $x -is [Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -ceq 'MainIdentityClass'
          },$true))
          if($fn.Count -ne 1){throw 'R125_IDENTITY_HELPER_NOT_UNIQUE'}
          $OriginalSHA='b2b2fbf1afb60b58d501312160f7e2437c2452e90cb61ca8c2be0d877f92232d'
          $CandidateSHA='beb850064670c078a679585ace25f8071daa88c0b264185c03ef3364329b431b'
          . ([ScriptBlock]::Create($fn[0].Extent.Text))
          $oldHash=(Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant()
          $candidateHash=(Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if((MainIdentityClass $oldHash) -cne 'ORIGINAL_V0630' -or
             (MainIdentityClass $candidateHash) -cne 'R112_ALREADY_INSTALLED' -or
             (MainIdentityClass ('0'*64)) -cne 'OTHER_OR_UNTRUSTED'){
            throw 'R125_PINNED_IDENTITY_WRONG'
          }
          if($inputText -cnotmatch "Emit 'R125_TWO_FUNCTION_PUBLICATION' 'ALREADY_INSTALLED_NO_SOURCE_WRITE'" -or
             -not $inputText.Contains("if(`$mainMode -ceq 'ORIGINAL_V0630'){") -or
             $inputText -cnotmatch "Fail 'R125_EXISTING_R112_CHANGED_BEFORE_AGENT'"){
            throw 'R125_ALREADY_INSTALLED_BRANCH_UNVERIFIED'
          }
          Write-Host 'R125_ORIGINAL_AND_ALREADY_INSTALLED_R112_IDENTITY=PASS'
          Write-Host 'R125_EXACT_R112_NO_SECOND_MAIN_SWAP_BRANCH=PASS'
          Write-Host 'R125_UNKNOWN_MAIN_REJECTED=PASS'
          Write-Host 'R125_REAL_OWNER_PC_UNTOUCHED=PASS'
      - name: Inspect actual R112 update and agent contract without executing it
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/out/private-stable-ahead-R112/spotify-control.ps1'
          $src=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8)
          $err=$null;$tok=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput($src,[ref]$tok,[ref]$err)
          if(@($err).Count -gt 0){throw 'R125_INTROSPECTION_SOURCE_PARSE_HOLD'}
          $fns=@($ast.FindAll({param($x) $x -is [Management.Automation.Language.FunctionDefinitionAst]},$true))
          $names=@($fns | Where-Object {$_.Name -match 'Agent|Spicetify|Maintenance|Upgrade|Restore|Update|State|Guard' } | ForEach-Object {$_.Name})
          Write-Host ('R125_REAL_PRODUCT_FUNCTION_NAMES='+($names -join ','))
          $targets=@($fns | Where-Object {$_.Name -in @(
            'Invoke-ResidentAgentTick','Invoke-MaintenanceCheckPhase',
            'Invoke-MaintenanceMutationPhase','Get-SpicetifyUpdateCheckResult','Maintain'
          )})
          foreach($fn in $targets){
            $lines=@($fn.Extent.Text -split '\r?\n')
            Write-Host ('R125_REAL_FUNCTION='+$fn.Name+';LINES='+$lines.Count)
            $selected=@($lines | Where-Object {
              $_ -match 'AgentEvent|Test-Due|DueHours|pending_maintenance|spicetify|upgrade|backup|apply|Invoke-|transaction|return|_utc|health|check|Stop|Guard|mutex|Report|success|ExitCode|failed'
            })
            foreach($line in @($selected | Select-Object -First 80)){
              $safe=$line.Trim()
              if($safe.Length -gt 200){$safe=$safe.Substring(0,200)}
              Write-Host ('R125_ACTUAL_LINE='+$safe)
            }
          }
          $contractNames=@('Get-SpicetifyTransaction','Save-SpicetifyTransaction',
            'Commit-SpicetifyCliTransaction','Invoke-SpicetifyTransactionalMaintenance',
            'Invoke-SpicetifyBackupApplyPinnedPrefs','Start-SpicetifyCliTransaction',
            'Invoke-SpicetifyPreflight')
          foreach($fn in @($fns | Where-Object {$_.Name -in $contractNames})){
            Write-Host ('R125_TRANSACTION_FUNCTION='+$fn.Name)
            $lines=@($fn.Extent.Text -split '\r?\n')
            $n=0
            foreach($line in $lines){
              $n++
              if($line -match 'transaction|[Ss]tatus|[Ss]uccess|[Cc]ommit|[Bb]ackup|[Aa]pply|[Rr]estore|[Pp]ath|[Cc]onfig|[Pp]reserved|[Pp]ending|[Ss]ha|[Tt]ag|[Vv]ersion|[Mm]etadata|[Ss]pice|[Rr]eturn|[Ee]rror' -and $n -lt 180){
                Write-Host ('R125_TRANSACTION_LINE='+$fn.Name+'#'+$n+':'+$line.Trim())
              }
            }
          }
          foreach($line in @($src -split '\r?\n' | Where-Object {
            $_ -match '^\s*\$SpicetifyTransaction(Path|Report)\s*='
          })){
            Write-Host ('R125_LEDGER_PATH_DECLARATION='+$line.Trim())
          }
          foreach($fn in @($fns | Where-Object {$_.Name -in @('Ensure-SpicetifyTransactionShape','Repair-PendingSpicetifyTransaction','Get-MaintenanceMode')})){
            $idx=0
            Write-Host ('R125_LEDGER_SHAPE_FUNCTION='+$fn.Name)
            foreach($line in @($fn.Extent.Text -split '\r?\n')){
              $idx++
              if($idx -le 110 -and $line -match 'status|root_transaction|after_sha256|apply|committed_at|extras|rolled_back|transaction|return|mode|[Pp]ath'){
                Write-Host ('R125_LEDGER_SHAPE_LINE='+$fn.Name+'#'+$idx+':'+$line.Trim())
              }
            }
          }
          Write-Host 'R125_PRODUCT_FUNCTIONS_INSPECTED_WITHOUT_INVOCATION=PASS'
      - name: Verify R125 fresh commit ledger and apply/guard evidence against spoofed or stale results
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $base='validation/spotify-exit-immediate-maintenance-HOLD/'
          $source=$base+'owner-approved-r112-spicetify-v2467-onepass-R125-HOLD.ps1'
          $all=[IO.File]::ReadAllText($source,[Text.Encoding]::UTF8)
          $errs=$null;$tok=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput($all,[ref]$tok,[ref]$errs)
          if(@($errs).Count -ne 0){throw 'R125_PROOF_SOURCE_PARSE_HOLD'}
          $names=@('R125Field','Test-R125CommittedUpgrade')
          $fns=@($ast.FindAll({
            param($x)
            $x -is [Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -cin $names
          },$true))
          if($fns.Count -ne 2){throw 'R125_PROOF_HELPERS_NOT_EXACT'}
          $OldCliSHA='3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'
          $CandidateSHA='beb850064670c078a679585ace25f8071daa88c0b264185c03ef3364329b431b'
          $OfficialZipSHA='c5a723d31eae529ba13f6922a7a027124238c7f3da7edd182a73eab03c447e9e'
          . ([ScriptBlock]::Create((@($fns | ForEach-Object{$_.Extent.Text}) -join [Environment]::NewLine)))
          $expectedExe=('b'*64)
          $begin=[DateTimeOffset]::UtcNow.AddMinutes(-2)
          $txn=[pscustomobject]@{
            id='owner-new-transaction';schema=3;status='committed';root_transaction=$true
            before_version='2.46.4';after_version='2.46.7';release_tag='v2.46.7'
            before_sha256=$OldCliSHA;after_sha256=$expectedExe
            asset_digest=('sha256:'+$OfficialZipSHA)
            apply_attempted=$true;apply_succeeded=$true;post_apply_guard_succeeded=$true
            extras_preserved=$true;extras_before_tree_sha256=('a'*64);extras_after_tree_sha256=('a'*64)
            committed_at=([DateTimeOffset]::UtcNow.ToString('o'))
          }
          $state=[pscustomobject]@{
            spicetify_last_transaction_id='owner-new-transaction'
            spicetify_last_transaction_status='committed'
            spicetify_installed_version='2.46.7'
            pending_spicetify_upgrade=$false
          }
          function AssertProof([string]$label,$t,$st,[string]$prior,[DateTimeOffset]$start,
                               [string]$actual,[string]$main,[string]$expected){
            $r=Test-R125CommittedUpgrade $t $st $prior $start $expectedExe $actual $main
            if($r -cne $expected){throw ('R125_PROOF_'+$label+'_EXPECTED_'+$expected+'_GOT_'+$r)}
            Write-Host ('R125_PROOF_'+$label+'=PASS')
          }
          AssertProof 'FRESH_COMMIT' $txn $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'FRESH_COMMITTED_ROOT_APPLY_AND_EXTRAS_VERIFIED'
          AssertProof 'SAME_OLD_TRANSACTION' $txn $state 'owner-new-transaction' $begin $expectedExe $CandidateSHA 'NO_NEW_TRANSACTION_ID'
          AssertProof 'OLD_COMMIT_TIMESTAMP' $txn $state 'previous-transaction' ([DateTimeOffset]::UtcNow.AddMinutes(1)) $expectedExe $CandidateSHA 'COMMIT_NOT_NEWER_THAN_ATTEMPT'
          AssertProof 'WRONG_INSTALLED_EXE' $txn $state 'previous-transaction' $begin ('0'*64) $CandidateSHA 'EXACT_BINARY_OR_MAIN_MISMATCH'
          AssertProof 'WRONG_MAIN' $txn $state 'previous-transaction' $begin $expectedExe ('0'*64) 'EXACT_BINARY_OR_MAIN_MISMATCH'
          $t2=($txn | ConvertTo-Json -Depth 6 | ConvertFrom-Json); $t2.apply_succeeded=$false
          AssertProof 'APPLY_NOT_PROVEN' $t2 $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'APPLY_GUARD_OR_EXTRAS_UNPROVEN'
          $t3=($txn | ConvertTo-Json -Depth 6 | ConvertFrom-Json); $t3.post_apply_guard_succeeded=$false
          AssertProof 'POST_APPLY_GUARD_NOT_PROVEN' $t3 $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'APPLY_GUARD_OR_EXTRAS_UNPROVEN'
          $t4=($txn | ConvertTo-Json -Depth 6 | ConvertFrom-Json); $t4.extras_after_tree_sha256=('b'*64)
          AssertProof 'EXTRAS_NOT_PRESERVED' $t4 $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'USER_EXTRAS_PRESERVATION_UNPROVEN'
          $t5=($txn | ConvertTo-Json -Depth 6 | ConvertFrom-Json); $t5.asset_digest='sha256:' + ('0'*64)
          AssertProof 'ASSET_NOT_PINNED' $t5 $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'RELEASE_ASSET_DIGEST_UNPROVEN'
          $t6=($txn | ConvertTo-Json -Depth 6 | ConvertFrom-Json); $t6.status='prepared'
          AssertProof 'UNCOMMITTED' $t6 $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'NO_COMMITTED_TXN'
          $s2=($state | ConvertTo-Json -Depth 4 | ConvertFrom-Json);$s2.spicetify_last_transaction_id='previous-transaction'
          AssertProof 'STATE_LEDGER_ID_MISMATCH' $txn $s2 'previous-transaction' $begin $expectedExe $CandidateSHA 'STATE_AND_LEDGER_NOT_CORRELATED'
          AssertProof 'MISSING_LEDGER' $null $state 'previous-transaction' $begin $expectedExe $CandidateSHA 'UNVERIFIED_LEDGER'
          $data=$all
          if($data.Contains('Stop-Process -Id $proc.Id') -or
             -not $data.Contains("Fail 'R125_AGENT_TIMEOUT_LEFT_RUNNING_FOR_OWNER_REVIEW'")){
            throw 'R125_MID_TRANSACTION_FORCED_KILL_NOT_DISABLED'
          }
          Write-Host 'R125_NO_FORCED_KILL_DURING_UNCERTAIN_FULL_ROOT_UPDATE=PASS'
          $main=[IO.File]::ReadAllText(($base+'out/private-stable-ahead-R112/spotify-control.ps1'),[Text.Encoding]::UTF8)
          if(-not $main.Contains('$SpicetifyTransactionPath = Join-Path $Root "spicetify-last-transaction.json"')){
            throw 'R125_JOURNAL_PATH_NOT_PROVEN_AGAINST_PRODUCT'
          }
          Write-Host 'R125_LEDGER_PATH_EXACT_PRODUCT_CONTRACT=PASS'
          Write-Host 'R125_OWNER_INSTALLATIONS_AND_SECRET_CONTENTS_UNTOUCHED=PASS'
      - name: Diagnose R126 split-brain rollback ledger from exact product code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='validation/spotify-exit-immediate-maintenance-HOLD/out/private-stable-ahead-R112/spotify-control.ps1'
          $txt=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8)
          $errors=$null;$tokens=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput($txt,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'R126_SOURCE_PARSE_FAILURE'}
          $names=@('Rollback-SpicetifyCliTransaction','Rollback-LegacySpicetifyCliTransaction',
            'Get-SpicetifyRootManifest','Save-SpicetifyTransaction',
            'Invoke-SpicetifyTransactionalMaintenance')
          $fns=@($ast.FindAll({
            param($x) $x -is [Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -cin $names
          },$true))
          if($fns.Count -ne $names.Count){throw 'R126_EXPECTED_REAL_FUNCTIONS_NOT_PRESENT'}
          foreach($fn in $fns){
            Write-Host ('R126_EXACT_FN='+$fn.Name)
            $lines=@($fn.Extent.Text -split '\r?\n')
            $max=if($fn.Name -eq 'Invoke-SpicetifyTransactionalMaintenance'){145}else{200}
            for($i=0;$i -lt [Math]::Min($max,$lines.Count);$i++){
              $line=$lines[$i]
              if($line.Length -gt 230){$line=$line.Substring(0,230)}
              Write-Host ('R126_SRC_'+$fn.Name+'_'+($i+1)+'='+$line)
            }
          }
          Write-Host 'R126_REAL_SOURCE_REVIEW_ONLY_NO_PRODUCT_EXECUTION=PASS'
      - name: Inspect exact product SHA helper for R127 offline snapshot matching
