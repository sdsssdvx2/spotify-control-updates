name: Validate Custom App Production Dual-ID New Permit Readiness v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-new-permit-readiness-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-new-permit-readiness-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-new-permit-readiness-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage PS5.1 read-only authority and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='2a9bab36e14d0aa0d1b5c55738a6ffe44bb65ab4';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact #199 housekeeping-resume head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0';$core="$d/custom-app-production-dual-id-new-permit-readiness.ps1";$test="$d/test_custom_app_production_dual_id_new_permit_readiness.ps1";$prep="$d/prepare_custom_app_production_dual_id_new_permit_readiness.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-new-permit-readiness-v010.yml'
          $allowed=@($core,$test,$prep,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p -notin $changed){throw "missing changed surface $p"}}
          $pins=@(@($core,'a6734b92b3c529fe81ab9c0f947956b425833998'),@($test,'a266712e330a09944f7a8dbdca531390520545a4'),@($prep,'4049feb9009eb32cefbb51fddbac4da4e70038fb'),@('validation/custom-app-production-dual-id-housekeeping-resume-executor-v0.1.0/custom-app-production-dual-id-housekeeping-resume-executor.ps1','6cf870e37b2ad4afc6b4d7eec0538afda595ddb1'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$test,$prep)){$tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"};$badCommands=@($ast.FindAll({param($node)if($node-isnot[Management.Automation.Language.CommandAst]){return $false};$name=$node.GetCommandName();return(-not[string]::IsNullOrWhiteSpace($name)-and$name-match'^(?i:return|throw).+')},$true));if($badCommands.Count){$badCommands|ForEach-Object{Write-Error ("ambiguous keyword command in $p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)>")};throw "PS5.1 keyword lexical boundary failed $p"}}
          $raw=Get-Content $core -Raw;foreach($m in @('committed-clean','permit_transaction_id','journal_transaction_id','Get-CustomAppProductionDualIdHousekeepingResumeDurableIdentityV010','Read-CustomAppProductionRecoveryEvidenceV010','Resolve-CustomAppProductionPromotionEligibilityV010','eligible_to_request_new_update_permit=$true','permit_issued=$false','requires_new_update_permit=$true','production_mutation_authorized=$false','transaction_artifacts_absent=$true')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          foreach($badToken in @('[IO.Directory]::Delete','[IO.Directory]::Move','[IO.File]::Copy','[IO.File]::Write','Copy-Item','Move-Item','Remove-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','Diagnostics.ProcessStartInfo','Append-CustomAppProductionCrashJournalPhaseV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','CreateShortcut','TargetPath','WorkingDirectory =')){if($raw.IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "readiness core gained forbidden side effect/surface $badToken"}}
          if($raw-match'readiness_is_authority\s*=\s*\$true|promotion_token_issued\s*=\s*\$true|permit_issued\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped in readiness core'}
          $testRaw=Get-Content $test -Raw;foreach($m in @('cases=$count','new remote commit','user removed','stale remote','wrong permit id','wrong journal id','conflated IDs','housekeeping authority tamper','transaction artifact reappeared','missing recovery evidence','live drift','persistence drift','expired readiness receipt','permit_issued=false','zero_authority=true')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "test marker missing $m"}}
          foreach($p in @($core,$test,$prep)){foreach($badToken in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "managed/domainvpn boundary escaped in $p via $badToken"}}}
          'DUAL_ID_NEW_PERMIT_READINESS_SCOPE_AST_AUTHORITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 90
        run: |
          $prep='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/prepare_custom_app_production_dual_id_new_permit_readiness.ps1';& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP;if($LASTEXITCODE){throw 'dependency preparation failed'}
          $pins=@(@('validation/custom-app-production-promotion-gate-v0.1.0/custom-app-production-promotion-gate.ps1','1164c197405eac2295f789256e2886068611dd94'),@('validation/custom-app-production-promotion-gate-v0.1.0/test_custom_app_production_promotion_gate.ps1','80b27015fa05951fe2c0f706eb60d212dac17d24'),@('validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/custom-app-production-durable-dual-transaction-id-bridge-integration.ps1','c9a58a181d3c5f5a230fa895785c3a42a928c8cd'),@('validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'))
          foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "materialized dependency drift $($p[0]) $actual != $($p[1])"}}
          'DUAL_ID_NEW_PERMIT_READINESS_DEPENDENCY_CHAIN_PASS'

      - name: Run inherited committed-clean chain plus new-permit readiness matrix twice
        shell: powershell
        timeout-minutes: 360
        run: |
          $outer=$env:RUNNER_TEMP;$test='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/test_custom_app_production_dual_id_new_permit_readiness.ps1'
          1..2|ForEach-Object{$pass=[int]$_;$runtime=Join-Path $outer ('dinp-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0;try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DINP_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outer;$env:TMP=$outer};if($exit){throw "dual-ID new permit readiness matrix failed pass $pass"}}
          'DUAL_ID_NEW_PERMIT_READINESS_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'};if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dinp-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_NEW_PERMIT_READINESS_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='2a9bab36e14d0aa0d1b5c55738a6ffe44bb65ab4';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dinp-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-new-permit-readiness-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='a6734b92b3c529fe81ab9c0f947956b425833998';test_blob='a266712e330a09944f7a8dbdca531390520545a4';preparer_blob='4049feb9009eb32cefbb51fddbac4da4e70038fb';housekeeping_head='2a9bab36e14d0aa0d1b5c55738a6ffe44bb65ab4';housekeeping_core_blob='6cf870e37b2ad4afc6b4d7eec0538afda595ddb1';promotion_head='6bc69d2c8b12d074fa68f3d2ed7688e0846cd23c';promotion_core_blob='1164c197405eac2295f789256e2886068611dd94';transaction_namespaces_distinct=$true;committed_clean_required=$true;recovery_evidence_retained=$true;transaction_artifacts_absent=$true;current_promotion_fresh=$true;permit_issued=$false;zero_authority=$true;managed_entrypoint_unchanged=$true;domainvpn_wrapper_boundary_unchanged=$true}|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $out 'validation-evidence.json') -Encoding UTF8
          Copy-Item 'validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/custom-app-production-dual-id-new-permit-readiness.ps1' $out
          Copy-Item 'validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/test_custom_app_production_dual_id_new_permit_readiness.ps1' $out
          'DUAL_ID_NEW_PERMIT_READINESS_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-new-permit-readiness-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dinp-v010-evidence
          if-no-files-found: error
