name: HOLD R104 native read-only Spotify exit evidence
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-owner-functional-exit-R104-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/owner-functional-exit-receipt-R104-HOLD.ps1
permissions: {contents: read}
jobs:
  native-ps51-owner-observer:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: PS5.1 native syntax and no action contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='validation/spotify-exit-immediate-maintenance-HOLD/owner-functional-exit-receipt-R104-HOLD.ps1'
          $tokens=$null;$issues=$null
          $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$issues)
          if(@($issues).Count -ne 0){throw 'R104_NATIVE_POWERSHELL_SYNTAX_INVALID'}
          $source=Get-Content -LiteralPath $path -Raw
          foreach($marker in @(
            'PERSISTED_EXIT_AND_HOST_DISPATCH_PRESENT_NOT_CAUSAL_OR_MAINTENANCE_PROOF',
            'R104_SPICETIFY_APPLY_OR_RECOVERY_SUCCESS=NOT_PROVEN',
            'R104_OWNER_OPERATING_FILES_AND_ORIGINAL_DATA=UNCHANGED',
            'R104_GITHUB_HOSTED_FIXTURE_ONLY',
            'Get-FileHash',
            'R104_EXIT_EVIDENCE_CANNOT_PROVE_CURRENT_SESSION_OR_CAUSAL_ORDER=YES'
          )){
            if(-not $source.Contains($marker)){throw 'R104_READONLY_CONTRACT_MISSING'}
          }
          Write-Host 'R104_WINDOWS_PS51_PARSE=PASS'
          Write-Host 'R104_NO_CAUSAL_OR_MAINTENANCE_CLAIM=PASS'
      - name: Actual Windows file snapshot with synthetic SpotifyExit and stale event
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='validation/spotify-exit-immediate-maintenance-HOLD/owner-functional-exit-receipt-R104-HOLD.ps1'
          $root=Join-Path $env:RUNNER_TEMP ('R104OwnerOnly-'+[guid]::NewGuid().ToString('N'))
          New-Item -Path $root -ItemType Directory -ErrorAction Stop | Out-Null
          try {
            $logdir=Join-Path $root 'logs'
            [void][IO.Directory]::CreateDirectory($logdir)
            $state=Join-Path $root 'state.json'
            $log=Join-Path $logdir 'resident-agent-host.log'
            $journal=Join-Path $root 'self-update-last-transaction.json'
            [IO.File]::WriteAllText($journal,'{"status":"committed"}',[Text.Encoding]::UTF8)
            [IO.File]::WriteAllText($log,("SPOTIFY EXIT confirmed"+[Environment]::NewLine+"TICK LAUNCHED event=SpotifyExit"+[Environment]::NewLine),[Text.Encoding]::UTF8)
            [IO.File]::WriteAllText($state,'{"schema":20,"last_agent_event":"SpotifyExit","last_agent_decision":"held-no-mutation","maintenance_check_healthy":false}',[Text.Encoding]::UTF8)
            $lines=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -HostedFixtureRoot $root)
            if($LASTEXITCODE -ne 0 -or
               $lines -cnotcontains 'R104_LAST_AGENT_EVENT=SPOTIFYEXIT' -or
               $lines -cnotcontains 'R104_HOST_EXIT_TICK_IN_BOUNDED_TAIL=SEEN' -or
               $lines -cnotcontains 'RESULT=PERSISTED_EXIT_AND_HOST_DISPATCH_PRESENT_NOT_CAUSAL_OR_MAINTENANCE_PROOF' -or
               $lines -cnotcontains 'R104_SPICETIFY_APPLY_OR_RECOVERY_SUCCESS=NOT_PROVEN'){
              $lines|ForEach-Object {Write-Host ([string]$_)}
              throw 'R104_NATIVE_POSITIVE_READONLY_OBSERVER_FAILED'
            }
            [IO.File]::WriteAllText($state,'{"schema":20,"last_agent_event":"Startup","last_agent_decision":null}',[Text.Encoding]::UTF8)
            $stale=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -HostedFixtureRoot $root)
            if($LASTEXITCODE -ne 0 -or
               $stale -cnotcontains 'RESULT=LAST_PERSISTED_EVENT_NOT_SPOTIFYEXIT' -or
               $stale -cnotcontains 'R104_LAST_AGENT_EVENT=STARTUP'){
              $stale|ForEach-Object {Write-Host ([string]$_)}
              throw 'R104_NATIVE_STALE_STATE_NOT_DISTINGUISHED'
            }
            if(@($lines+$stale|Where-Object{
              [string]$_ -match 'held-no-mutation|R104OwnerOnly-'
            }).Count -gt 0){throw 'R104_PRIVATE_STATE_OR_PATH_EXPOSED'}
            Write-Host 'R104_NATIVE_EXIT_DISPATCH_PERSISTENCE_OBSERVATION=PASS'
            Write-Host 'R104_NATIVE_STALE_EXIT_NOT_CLAIMED=PASS'
            Write-Host 'R104_USER_OPERATING_APP_TASKS=UNCHANGED'
          } finally {
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop}
          }
          if(Test-Path -LiteralPath $root){throw 'R104_HOSTED_SCRATCH_REMAINS'}
          Write-Host 'R104_HOSTED_TEMP_CLEANUP=PASS'
