name: Validate Custom App Production Evidence-Bound Crash Restore Integration v0.1.0

on:
  push:
    branches: [validate/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0]
    paths:
      - 'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-evidence-bound-crash-restore-integration-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-evidence-bound-journal-atomic-v0.1.0]
    paths:
      - 'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-evidence-bound-crash-restore-integration-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage pins and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $base='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';if((git merge-base $base HEAD).Trim() -cne $base){throw 'not descended from exact #190 evidence-bound head'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-evidence-bound-crash-restore-integration-v010.yml','validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/prepare_crash_states.ps1','validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/recover_crash_states.ps1')
          $changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($x in $allowed){if($x -notin $changed){throw "missing $x"}}
          $pins=@(
            @($h,'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/prepare_crash_states.ps1','adeab2836eec903cebb48e72fd83861d5bc411ac'),
            @($h,'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/recover_crash_states.ps1','9a3c483006b736f24c14d96e9902d7e8a916f243'),
            @('c21a8c72dd8920df8e1faa59eb6aedee76a15e06','validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/custom-app-production-evidence-bound-journal-atomic.ps1','55ca1e3c8d56b2e86a98d8b47e8ac1cc4ccbb6d0'),
            @('c21a8c72dd8920df8e1faa59eb6aedee76a15e06','validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/test_custom_app_production_evidence_bound_journal_atomic.ps1','dad1028758e3f03aebd86a84adc5c1d26a37bee3'),
            @('d9a1face71511bdaeeef4e8c761415ef9ec95fc0','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63'),
            @('c3e1f960447ba84d2410af9c37a22a384f2a5436','validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','5fec613c460619da5dbfe88fca5c7334e9e93f76')
          );foreach($p in $pins){$b=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($b -cne $p[2]){throw "pin drift $($p[1]) $b != $($p[2])"}}
          'EVIDENCE_BOUND_CRASH_RESTORE_SCOPE_PINS_PASS'

      - name: Parse and audit split-process integration harness
        shell: powershell
        run: |
          $d='validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0';$files=@("$d/prepare_crash_states.ps1","$d/recover_crash_states.ps1")
          foreach($f in $files){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|ForEach-Object{Write-Error ("$f line=$($_.Extent.StartLineNumber) $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $p=Get-Content $files[0] -Raw;$r=Get-Content $files[1] -Raw
          foreach($m in @('after-live-move-before-journal','first-rename-complete-unjournaled','live-moved-to-old','candidate-live','expected_evidence_fingerprint')){if($p.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "prepare marker missing $m"}}
          foreach($m in @('Invoke-CustomAppProductionRecoveryRestoreExecutorV010','rollback-complete','expected_old_app_tree_sha256','expected_persistence_fingerprint','apply count','evidence continuity')){if($r.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "recover marker missing $m"}}
          foreach($x in @('Invoke-WebRequest','Invoke-RestMethod')){if($p.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0 -or $r.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "network primitive escaped $x"}}
          'EVIDENCE_BOUND_CRASH_RESTORE_PARSE_AUDIT_PASS'

      - name: Fetch exact recovery lineage and materialize sibling dependencies
        shell: powershell
        run: |
          $refs=@(
            @('validate/custom-app-production-recovery-restore-executor-v0.1.0','c3e1f960447ba84d2410af9c37a22a384f2a5436'),
            @('validate/custom-app-production-recovery-evidence-envelope-v0.1.0','993af44afee9adb0c28e5fb702cb6ccfbd7cd99c'),
            @('validate/marketplace-lifecycle-settings-core-v0.1.0','57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b'),
            @('validate/custom-app-update-transaction-protocol-v0.1.0','1a2461a6929e9cabd50d27f95e0744f83443b9e8'),
            @('validate/custom-app-production-crash-recovery-journal-v0.1.0','7e26187e2360089024e9d72d0701be6f1577a1ef')
          )
          foreach($x in $refs){git fetch --no-tags origin $x[0] | Out-Null;if((git rev-parse FETCH_HEAD).Trim() -cne $x[1]){throw "branch head drift $($x[0])"}}
          $deps=@(
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae')
          )
          function Materialize([string]$Root){foreach($q in $deps){$out=Join-Path $Root $q[1];New-Item -ItemType Directory -Force -Path (Split-Path $out -Parent)|Out-Null;$env:S="$($q[0])`:$($q[1])";$env:O=$out;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['O']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['S']]))";if($LASTEXITCODE){throw "materialize failed $($q[1])"};if((git hash-object $out).Trim() -cne $q[2]){throw "materialized blob drift $($q[1])"}}}
          Materialize (Get-Location).Path
          $wr=Join-Path $env:RUNNER_TEMP 'recovery-executor-157';git worktree add --detach $wr c3e1f960447ba84d2410af9c37a22a384f2a5436;if($LASTEXITCODE){throw 'recovery worktree add failed'};Materialize $wr
          "RECOVERY_ROOT=$wr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'EVIDENCE_BOUND_CRASH_RESTORE_DEPENDENCIES_PASS'

      - name: Prepare real durable crash states in process one
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP;$state=Join-Path $env:RUNNER_TEMP 'evidence-bound-crash-states.json'
          & 'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/prepare_crash_states.ps1' -StatePath $state
          if(-not (Test-Path -LiteralPath $state -PathType Leaf)){throw 'state handoff file missing'}
          "CRASH_STATE_PATH=$state" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Recover from durable state in fresh process two
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP;$result=Join-Path $env:RUNNER_TEMP 'evidence-bound-crash-restore-result.json'
          & 'validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/recover_crash_states.ps1' -RecoveryRoot $env:RECOVERY_ROOT -StatePath $env:CRASH_STATE_PATH -ResultPath $result
          if(-not (Test-Path -LiteralPath $result -PathType Leaf)){throw 'recovery result file missing'}
          "CRASH_RESULT_PATH=$result" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify cross-process outcome and retained safety contract
        shell: powershell
        run: |
          $x=@(Get-Content -LiteralPath $env:CRASH_RESULT_PATH -Raw|ConvertFrom-Json);if($x.Count-ne2){throw 'result count mismatch'}
          if([string]$x[0].started_phase -cne 'live-moved-to-old'){throw 'normalized live-moved case start mismatch'};if([string]$x[1].started_phase -cne 'candidate-live'){throw 'candidate-live case start mismatch'}
          foreach($r in $x){if([string]$r.final_phase -cne 'rollback-complete'){throw "final phase mismatch $($r.label)"};if([int]$r.apply_count-ne1){throw "apply count mismatch $($r.label)"};if([bool]$r.production_mutation_authorized){throw "authority escaped $($r.label)"}}
          'EVIDENCE_BOUND_CRASH_RESTORE_CROSS_PROCESS_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'}
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'}
          if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'crash-restore-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'EVIDENCE_BOUND_CRASH_RESTORE_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $base='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';$expected=@('.github/workflows/validate-custom-app-production-evidence-bound-crash-restore-integration-v010.yml','validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/prepare_crash_states.ps1','validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/recover_crash_states.ps1');$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "unexpected changed surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/custom-app-production-evidence-bound-journal-atomic.ps1','validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/test_custom_app_production_evidence_bound_journal_atomic.ps1')){git diff --quiet $base HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();base=$base;evidence_bound_head='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';restore_resume_head='d9a1face71511bdaeeef4e8c761415ef9ec95fc0';restore_executor_head='c3e1f960447ba84d2410af9c37a22a384f2a5436';process_boundary=$true;live_moved_rename_crash_normalized=$true;candidate_live_restart=$true;durable_evidence_consumed_after_restart=$true;exact_old_app_restore=$true;exact_persistence_restore=$true;exact_one_recovery_apply=$true;rollback_complete_persisted=$true;hard_disabled_candidate_unchanged=$true;managed_launcher_surface_changed=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          git worktree remove --force $env:RECOVERY_ROOT 2>$null
          'EVIDENCE_BOUND_CRASH_RESTORE_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-evidence-bound-crash-restore-integration-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/prepare_crash_states.ps1
            validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/recover_crash_states.ps1
            validation/custom-app-production-evidence-bound-crash-restore-integration-v0.1.0/ci-evidence.json
          if-no-files-found: error