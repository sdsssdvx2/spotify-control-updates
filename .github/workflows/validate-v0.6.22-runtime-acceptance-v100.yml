name: Validate v0.6.22 r11 Runtime Acceptance v1.0.0

on:
  push:
    branches:
      - validate/v0.6.22-runtime-acceptance-v1.0.0
    paths:
      - 'validation/v0.6.22-runtime-acceptance-v1.0.0/**'
      - '.github/workflows/validate-v0.6.22-runtime-acceptance-v100.yml'
  pull_request:
    branches:
      - release/v0.6.22-addon-source-registry-r11
    paths:
      - 'validation/v0.6.22-runtime-acceptance-v1.0.0/**'
      - '.github/workflows/validate-v0.6.22-runtime-acceptance-v100.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact release-derived validation scope
        shell: powershell
        run: |
          $base='9c1cabcaaed6c7a1465f5baea12d046a5d51c8dc'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Runtime acceptance v1.0.0 is not based on exact v0.6.22 release head.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@(
            'validation/v0.6.22-runtime-acceptance-v1.0.0/build_acceptance.py',
            '.github/workflows/validate-v0.6.22-runtime-acceptance-v100.yml'
          )
          $bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 2){throw "Expected exactly 2 validation-only files; got $($changed.Count): $($changed -join ' , ')"}
          Write-Host "V0622_RUNTIME_ACCEPTANCE_V100_SCOPE_PASS head=$actual"

      - name: Compile and build acceptance package
        shell: powershell
        run: |
          $dir='validation/v0.6.22-runtime-acceptance-v1.0.0'
          python -m py_compile "$dir/build_acceptance.py"
          if($LASTEXITCODE -ne 0){throw 'Acceptance v1.0.0 builder Python compile failed.'}
          python "$dir/build_acceptance.py"
          if($LASTEXITCODE -ne 0){throw 'Initial acceptance v1.0.0 package build failed.'}
          $zip=Join-Path $dir 'out/SpotifyControl-v0.6.22-r11-Runtime-Acceptance-v1.0.0.zip'
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $zip).Length
          if($size -ne 56228 -or $hash -cne '04b555a3e68a7baf72b9fabdf2f15419cf7c1bf70fb5915d936165cd74e3bd14'){throw "Windows deterministic package identity mismatch: size=$size sha=$hash"}
          "$hash|$size" | Set-Content $env:RUNNER_TEMP\acceptance-v100-first.txt -Encoding ASCII
          Write-Host "V0622_RUNTIME_ACCEPTANCE_V100_BUILD_IDENTITY_PASS $hash $size"

      - name: Reconstruct exact v0.6.22 r11 candidate and re-run safety suite
        shell: powershell
        run: |
          python validation/v0.6.22/build_v0622.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.6.22 candidate rebuild failed.'}
          $main='validation/v0.6.22/out/bin/spotify-control.ps1'
          $addon='validation/v0.6.22/out/bin/addon-manager.ps1'
          if((Get-Item $main).Length -ne 281586 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b5ba4dc98b10ea922ce30401b5cddf5a1ab01171366e09b3546ce3cc6fcd80fe'){throw 'v0.6.22 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 268670 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0ee8d30bf7c2fda9d0d8d112b7191b0d0439a1071d284d0cc04a87fe8937c7bc'){throw 'r11 addon identity mismatch.'}
          python validation/v0.6.22/audit_r11.py
          if($LASTEXITCODE -ne 0){throw 'r11 structural audit failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.22/test_r11_source_adapter.ps1
          if($LASTEXITCODE -ne 0){throw 'r11 source-adapter fixtures failed.'}
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'r11 Addon Manager SelfTest failed.'}
          Write-Host 'V0622_RUNTIME_ACCEPTANCE_V100_R11_SAFETY_PASS'

      - name: Parse generated sources with Windows PowerShell 5.1 and run helper SelfTests
        shell: powershell
        run: |
          $gen='validation/v0.6.22-runtime-acceptance-v1.0.0/generated'
          foreach($name in @('RUN_RUNTIME_ACCEPTANCE.ps1','PRECHECK_RUNTIME_ACCEPTANCE.ps1','BOOTSTRAP_RUNNER.ps1')){
            $p=Join-Path $gen $name;$tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}:{1}: {2}" -f $name,$_.Extent.StartLineNumber,$_.Message)};throw "PowerShell 5.1 parse failed: $name"}
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $gen 'BOOTSTRAP_RUNNER.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Bootstrap manifest-shim runner SelfTest failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $gen 'RUN_RUNTIME_ACCEPTANCE.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Runtime acceptance helper SelfTest failed.'}
          Write-Host 'V0622_RUNTIME_ACCEPTANCE_V100_PS51_AND_HELPERS_PASS'

      - name: Fetch exact immutable release-head manifest over GitHub HTTPS
        shell: powershell
        run: |
          $release='9c1cabcaaed6c7a1465f5baea12d046a5d51c8dc'
          $gen='validation/v0.6.22-runtime-acceptance-v1.0.0/generated'
          $runner=(Resolve-Path (Join-Path $gen 'BOOTSTRAP_RUNNER.ps1')).Path
          $url="https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/$release/manifest.json"
          $out=Join-Path $env:RUNNER_TEMP 'v100-release-head-manifest.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -FetchUrl $url -OutputPath $out -TimeoutSec 20
          if($LASTEXITCODE -ne 0){throw 'Exact release-head manifest HTTPS fetch failed.'}
          $py=@'
          import hashlib,pathlib,subprocess,sys
          remote=pathlib.Path(sys.argv[1]).read_bytes()
          committed=subprocess.check_output(['git','show',sys.argv[2]+':manifest.json'])
          rh=hashlib.sha256(remote).hexdigest(); ch=hashlib.sha256(committed).hexdigest()
          print('REMOTE_MANIFEST_SHA='+rh)
          print('COMMITTED_MANIFEST_SHA='+ch)
          if remote != committed:
              raise SystemExit('raw release manifest bytes differ from immutable Git blob bytes')
          '@
          python -c $py $out $release
          if($LASTEXITCODE -ne 0){throw 'Fetched release-head manifest does not match immutable Git blob bytes.'}
          $remote=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if($remote -cne '9eea792cf0f81c09d3527f879b98c44dbbcbce1209c7dbc651d4298453f28e32'){throw "Immutable release manifest SHA drift: $remote"}
          $m=Get-Content $out -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.22' -or $m.source_commit -ne 'db4dd0e4357cbf03ea95dd8773c0be173b2c91fc' -or $m.payload_set_sha256 -ne 'cb396442ac874504a04d4acb0034d3cb9fa11acce290da18e639c2dbe8e5a091'){throw 'Fetched release-head manifest identity mismatch.'}
          "$remote|$((Get-Item $out).Length)" | Set-Content $env:RUNNER_TEMP\v100-manifest-identity.txt -Encoding ASCII
          Write-Host "V0622_RUNTIME_ACCEPTANCE_V100_HTTPS_MANIFEST_PASS sha=$remote size=$((Get-Item $out).Length)"

      - name: Download exact previously validated Bootstrap 1.0.6 carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > validated-v0614-repair-artifact.zip
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib,zipfile
          outer=Path('validated-v0614-repair-artifact.zip').read_bytes()
          with zipfile.ZipFile(BytesIO(outer)) as z:
              assert z.testzip() is None
              inner=z.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          assert len(inner)==30856 and hashlib.sha256(inner).hexdigest()=='6b6d5d9e8ac44fc77bb95918164a3c862f14494c329fdfd267bd95f6c6ddcf06'
          with zipfile.ZipFile(BytesIO(inner)) as z: boot=z.read('bootstrap/spotify-control-self-updater.ps1')
          assert len(boot)==42963 and hashlib.sha256(boot).hexdigest()=='d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'
          print('V100_VALIDATED_BOOTSTRAP_V106_CARRIER_PASS')
          PY

      - name: Exact Bootstrap 1.0.6 cycle through pinned-manifest shim and real patch HTTPS
        shell: powershell
        run: |
          python validation/v0.6.22/bootstrap_prepare_fixture.py
          if($LASTEXITCODE -ne 0){throw 'Exact v0.6.21 fixture preparation failed.'}
          $fixture=(Resolve-Path 'ci-bootstrap-fixture-v0621-to-v0622').Path
          $root=Join-Path $fixture 'LocalAppData\SpotifyControl';$bin=Join-Path $root 'bin';$reports=Join-Path $root 'reports'
          $bootExact=Join-Path $root 'bootstrap\spotify-control-self-updater.ps1'
          $manifest=Join-Path $env:RUNNER_TEMP 'v100-release-head-manifest.json'
          $runner=(Resolve-Path 'validation/v0.6.22-runtime-acceptance-v1.0.0/generated/BOOTSTRAP_RUNNER.ps1').Path
          $mainUrl='https://raw.githubusercontent.com/sdsssdvx2/spotify-control-updates/main/manifest.json'
          $env:LOCALAPPDATA=Join-Path $fixture 'LocalAppData';$env:APPDATA=Join-Path $fixture 'Roaming';New-Item -ItemType Directory -Force -Path $env:APPDATA|Out-Null
          function AssertId($path,$size,$sha,$label){if((Get-Item $path).Length -ne $size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){throw "$label identity mismatch"}}
          AssertId $bootExact 42963 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' 'exact Bootstrap'
          $manifestSha=(Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          function RunBoot([string]$a){
            $rp=Join-Path $reports 'self-update-latest.json';$shim=Join-Path $env:RUNNER_TEMP ("v100-shim-$a.json")
            Remove-Item -LiteralPath $rp,$shim -Force -ErrorAction SilentlyContinue
            $out=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -BootstrapPath $bootExact -Action $a -ManifestPath $manifest -ExpectedManifestUrl $mainUrl -ShimEvidencePath $shim 2>&1;$ec=$LASTEXITCODE;$out|ForEach-Object{Write-Host $_}
            if($ec -ne 0){throw "Bootstrap $a via manifest shim failed exit=$ec"}
            if(-not(Test-Path $rp) -or -not(Test-Path $shim)){throw "Bootstrap $a report/shim evidence missing"}
            $rep=Get-Content $rp -Raw|ConvertFrom-Json;$se=Get-Content $shim -Raw|ConvertFrom-Json
            if(-not$rep.success -or $rep.action -ne $a -or $rep.bootstrap_version -ne '1.0.6' -or $rep.manifest_url -ne $mainUrl){throw "Bootstrap $a report invalid"}
            if([int]$se.hits -ne 1 -or $se.action -ne $a -or $se.uri -ne $mainUrl -or $se.manifest_sha256 -ne $manifestSha -or $se.bootstrap_sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){throw "Bootstrap $a shim evidence invalid"}
            return $rep
          }
          $c=RunBoot 'Check';if($c.installed_version -ne '0.6.21' -or [int]$c.result.edge_count -ne 1 -or $c.result.already_current){throw 'Exact manifest-shim Check evidence invalid.'}
          $rb=RunBoot 'RollbackTest';if($rb.transaction_status -ne 'rolled-back'){throw 'Exact manifest-shim RollbackTest evidence invalid.'}
          AssertId (Join-Path $bin 'spotify-control.ps1') 281579 'f97c78c905b83e90e58a24035febcaccc27cb12113ae9cbc64acdc79f5853828' 'rollback main'
          AssertId (Join-Path $bin 'addon-manager.ps1') 250616 '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2' 'rollback addon'
          $u=RunBoot 'Update';if($u.transaction_status -ne 'committed'){throw 'Exact manifest-shim Update evidence invalid.'}
          AssertId (Join-Path $bin 'spotify-control.ps1') 281586 'b5ba4dc98b10ea922ce30401b5cddf5a1ab01171366e09b3546ce3cc6fcd80fe' 'updated main'
          AssertId (Join-Path $bin 'addon-manager.ps1') 268670 '0ee8d30bf7c2fda9d0d8d112b7191b0d0439a1071d284d0cc04a87fe8937c7bc' 'updated addon'
          $pc=RunBoot 'Check';if($pc.installed_version -ne '0.6.22' -or $pc.result.already_current -ne $true -or [int]$pc.result.edge_count -ne 0){throw 'Exact manifest-shim post-Check evidence invalid.'}
          AssertId $bootExact 42963 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' 'final exact Bootstrap'
          Write-Host 'V0622_RUNTIME_ACCEPTANCE_V100_EXACT_BOOTSTRAP_CYCLE_PASS'

      - name: Prove repeated Windows package determinism and internal checksums
        shell: powershell
        run: |
          $dir='validation/v0.6.22-runtime-acceptance-v1.0.0'
          $first=(Get-Content $env:RUNNER_TEMP\acceptance-v100-first.txt -Raw).Trim().Split('|');$firstHash=$first[0];$firstSize=[int64]$first[1]
          Remove-Item -LiteralPath (Join-Path $dir 'generated'),(Join-Path $dir 'out') -Recurse -Force -ErrorAction SilentlyContinue
          python "$dir/build_acceptance.py"
          if($LASTEXITCODE -ne 0){throw 'Second acceptance build failed.'}
          $zip=Join-Path $dir 'out/SpotifyControl-v0.6.22-r11-Runtime-Acceptance-v1.0.0.zip'
          $secondHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$secondSize=(Get-Item $zip).Length
          if($secondHash -cne $firstHash -or $secondSize -ne $firstSize){throw "Package is not deterministic: first=$firstHash/$firstSize second=$secondHash/$secondSize"}
          if($secondSize -ne 56228 -or $secondHash -cne '04b555a3e68a7baf72b9fabdf2f15419cf7c1bf70fb5915d936165cd74e3bd14'){throw "Final package identity drift: size=$secondSize sha=$secondHash"}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip));try{
            $bad=$null
            foreach($entry in $z.Entries){if($entry.FullName -match '(^|/)\.\.(/|$)' -or $entry.FullName.StartsWith('/')){$bad=$entry.FullName;break}}
            if($bad){throw "Unsafe ZIP path: $bad"}
          }finally{$z.Dispose()}
          Write-Host "V0622_RUNTIME_ACCEPTANCE_V100_DETERMINISM_PASS sha=$secondHash size=$secondSize"

      - name: Upload exact runtime acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-v0.6.22-r11-Runtime-Acceptance-v1.0.0
          path: validation/v0.6.22-runtime-acceptance-v1.0.0/out/SpotifyControl-v0.6.22-r11-Runtime-Acceptance-v1.0.0.zip
          if-no-files-found: error
          compression-level: 0
