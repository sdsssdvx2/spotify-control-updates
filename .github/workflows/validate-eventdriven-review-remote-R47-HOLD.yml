    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-eventdriven-review-remote-R47-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/verify-eventdriven-review-remote-R47-HOLD.py
permissions: {contents: read}
jobs:
