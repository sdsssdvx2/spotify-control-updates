          set -euo pipefail
          python3 validation/spotify-exit-immediate-maintenance-HOLD/verify-eventdriven-review-remote-R47-HOLD.py
          echo 'R47_REAL_REMOTE_FAST_EVENT_CANDIDATE_NO_PUBLIC_RELEASE_PASS'
