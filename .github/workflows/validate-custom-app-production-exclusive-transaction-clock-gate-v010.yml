name: Validate same-app cross-process exclusive transaction and true UTC clock gate
on:
  push:
    branches:
      - validate/custom-app-production-exclusive-transaction-clock-gate-v0.1.0
    paths:
      - 'validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-exclusive-transaction-clock-gate-v010.yml'
  pull_request:
    branches:
      - validate/custom-app-production-triple-id-authorized-journal-bridge-v0.1.0
    paths:
      - 'validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-exclusive-transaction-clock-gate-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  exclusive-gate-isolated-windows:
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Exact lineage, frozen main, source-only scope and protection audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parent='d9a8e9ac77c3161bf3ad6e4eabf674212d495e0e'
          $production='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          if((git rev-parse HEAD).Trim() -cne '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'){throw 'wrong tested SHA'}
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'not descended from qualified PR220'}
          if((git rev-parse origin/main).Trim() -cne $production){throw 'main moved'}
          $d='validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0'
          $module="$d/custom-app-production-exclusive-transaction-clock-gate.ps1"
          $test="$d/test_exclusive_transaction_clock_gate.ps1"
          $generator='validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/derive_exclusive_e2e.py'
          $workflow='.github/workflows/validate-custom-app-production-exclusive-transaction-clock-gate-v010.yml'
          $allowed=@($module,$test,$generator,$workflow)
          $changed=@(git diff --name-only "$parent...HEAD")
          $unexpected=@($changed|Where-Object{$_-notin$allowed})
          if($unexpected.Count){throw ('unapproved scope '+($unexpected -join ','))}
          foreach($p in $allowed){if($p-notin$changed){throw ('expected new file missing '+$p)}}
          if((git hash-object $module).Trim()-cne'7f41179bf67428aa736b438ec1185a4f0bc1e831'){throw 'module code under test changed'}
          if((git hash-object $test).Trim()-cne'b4810d20b2718a3584446d45ee20a24b1f54473f'){throw 'test code under review changed'}
          if((git hash-object $generator).Trim()-cne'9909e07ea21046df1804ac2bff45d66c66291a9d'){throw 'SHA-pinned original fixture transformation changed'}
          foreach($p in @('bin/spotify-control.ps1','bin/addon-manager.ps1','manifest.json','stable-version.json','addon-policy-registry.json')){
            git diff --quiet $parent HEAD -- $p
            if($LASTEXITCODE){throw ('production protected path modified '+$p)}
          }
          Write-Host 'EXCLUSIVE_APP_CLOCK_GATE_FROZEN_MAIN_AND_SCOPED_SOURCE_PASS'
      - name: Windows PowerShell 5.1 parse check for both new safety gate sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0'
          foreach($p in @("$d/custom-app-production-exclusive-transaction-clock-gate.ps1","$d/test_exclusive_transaction_clock_gate.ps1")){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Select-Object -First 10|ForEach-Object{Write-Host ($p+':'+$_.Extent.StartLineNumber+' '+$_.Message)};throw 'PS5.1 parse failed'}
          }
          Write-Host 'EXCLUSIVE_APP_CLOCK_GATE_PS51_PARSE_PASS'
      - name: Run real Windows OS cross-process locking, forced process crash, durable marker and honest UTC tests
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0'
          $log="$d/windows-ci.log"
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$d/test_exclusive_transaction_clock_gate.ps1" *>&1 | Tee-Object -FilePath $log
          $exitCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($exitCode -ne 0){throw ('exclusive gate Windows test failed '+$exitCode)}
          $logText=Get-Content -LiteralPath $log -Raw
          if($logText -notmatch 'EXCLUSIVE_APP_CLOCK_AND_CRASH_GATE_MATRIX_PASS cases=20 current_utc=true stale_and_future_denied=true same_app_cross_process_lock=true same_live_alias_denied=true other_app_allowed=true crash_retains_blocking_marker=true corrupt_marker_fail_closed=true no_journal_no_retirement=true retired_consumption_replay_denied=true installed_spotify_untouched=true'){throw 'independent process and clock evidence missing'}
          [ordered]@{
            schema=1;status='PASS';source='exclusive-app-transaction-clock-gate-validation'
            test_count=20;windows_process_cross_lock=$true;crash_retains_active_record=$true
            stale_and_future_utc_denied=$true;corrupt_record_denied=$true;missing_terminal_journal_denied=$true
            production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
            full_chain_enabled=$false;tested_sha=(git rev-parse HEAD).Trim()
          }|ConvertTo-Json -Depth 4|Set-Content -LiteralPath "$d/evidence.json" -Encoding UTF8
          Write-Host 'EXCLUSIVE_APP_CLOCK_GATE_ALL_WINDOWS_EVIDENCE_PASS'
      - name: Restore qualified historical Windows fixture dependencies and overlays
        shell: powershell
        timeout-minutes: 50
        run: |
          $ErrorActionPreference='Stop'
          $prep='validation/custom-app-production-dual-id-new-permit-readiness-v0.1.0/prepare_custom_app_production_dual_id_new_permit_readiness.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Qualified historical fixture dependency restoration failed'}
          $d='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $pins=@(
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1",'3350cd974bb9f9ae7345e490449c4875d571bf95'),
            @("$d/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1",'224b9df9d020b74bd4d99c85ca6d06e28999101b')
          )
          foreach($pin in $pins){if((git hash-object $pin[0]).Trim() -cne [string]$pin[1]){throw ('Qualified overlay SHA drift: '+$pin[0])}}
          # Pinned historical-only dependencies: materialize into ephemeral checkout.
          $historical=@(
            @('e2b80822835bf5d59dc179e345e098b5bd79759e','validation/custom-app-production-atomic-live-swap-mutation-v0.1.0/test_custom_app_production_atomic_live_swap_mutation.ps1','d15e0768162b0659c57602eaf0242b035b48b0c7'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-mutation.ps1','79580da78443a18bd281d4fce61c4a57d958a196'),
            @('2c6fc111bc6cb9d7fb4b2cb54f0f660d756177cf','validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-repair-v011.ps1','210c4dda2311eb5defcbcd74977e4f4148ea7c38'),
            @('b266bad660d4b7bc87e7093c5b12f0cff1dc466f','validation/custom-app-production-recovery-plan-contract-v0.1.0/custom-app-production-recovery-plan.ps1','ae49409973164052d5830b981d804707f9d62b6c'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-preflight-v0.1.0/custom-app-production-recovery-preflight.ps1','b1816a24849a559b4da2537aa1b2436124fbee50'),
            @('ffb5aad4a605691ee7b80392498b0cb6fa4e4052','validation/custom-app-production-recovery-execution-admission-v0.1.0/custom-app-production-recovery-execution-admission.ps1','e8804a7c53ad0d3e5420e037d468d9c397e52529'),
            @('5232e5adeb13e6942acb210b3cd13058e1eaaf05','validation/custom-app-production-recovery-evidence-admission-integration-v0.1.0/custom-app-production-recovery-evidence-admission-integration.ps1','c92c727b5a2217f5b84a1072608bfc4662e68926'),
            @('d3969a746ed1736fe93586bd025116c2526fbff5','validation/custom-app-production-recovery-cleanup-resume-admission-v0.1.0/custom-app-production-recovery-cleanup-resume-admission.ps1','387d97b10d493b3794b24fba2bac67cf39491444'),
            @('d9a1face71511bdaeeef4e8c761415ef9ec95fc0','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63')
          )
          foreach($dep in $historical){
            $commit=[string]$dep[0];$p=[string]$dep[1];$blob=[string]$dep[2]
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){
              git cat-file -e ($commit+'^{commit}') 2>$null
              if($LASTEXITCODE){git fetch --no-tags origin $commit | Out-Null;if($LASTEXITCODE){throw ('historical fetch failed '+$commit)}}
              New-Item -ItemType Directory -Force -Path (Split-Path $p -Parent)|Out-Null
              $env:TJR_SPEC=($commit+':'+$p);$env:TJR_OUT=$p
              python -c "import os,subprocess,pathlib;pathlib.Path(os.environ['TJR_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['TJR_SPEC']]))"
              if($LASTEXITCODE){throw ('historical materialize failed '+$p)}
            }
            if((git hash-object $p).Trim() -cne $blob){throw ('historical recovery blob drift '+$p)}
          }
          # The parent preparer intentionally applies its separately qualified
          # monotonic restore-executor patch. Do not overwrite it with its old blob.
          if(-not(Test-Path -LiteralPath 'validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1' -PathType Leaf)){throw 'qualified monotonic restore executor absent'}
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_HISTORICAL_RECOVERY_MODULES_PINNED_PASS'
          Write-Host 'TRIPLE_ID_AUTHORIZED_JOURNAL_BRIDGE_PINNED_FIXTURES_PASS'
      - name: Derive real ZIP third-ID guarded bridge and enforce true UTC, crash persistence and terminal-only retirement
        shell: powershell
        timeout-minutes: 105
        run: |
          $ErrorActionPreference='Stop'
          $d='validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0'
          $reservation='validation/custom-app-production-dual-id-new-permit-reservation-persistence-v0.1.0'
          $core="$reservation/custom-app-production-dual-id-new-permit-reservation-persistence.ps1"
          $pieces=@($core,"$reservation/custom-app-production-dual-id-new-permit-reservation-persistence-deny-binding-fix-v011.ps1","$reservation/custom-app-production-dual-id-new-permit-reservation-persistence-invoke-deny-binding-fix-v012.ps1")
          $source=($pieces|ForEach-Object{[IO.File]::ReadAllText((Resolve-Path $_).Path)}) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Resolve-Path $core).Path,$source,[Text.UTF8Encoding]::new($false))
          $tokens=$null;$parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $core).Path,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count){throw 'historical reservation overlays PS5.1 parse failed'}
          python "$d/derive_exclusive_e2e.py"
          if($LASTEXITCODE -ne 0){throw 'qualified real ZIP guard fixture derivation failed'}
          $runner='validation/custom-app-production-triple-id-journaled-restart-e2e-v0.1.0/ci_derived_exclusive_gate_restart.ps1'
          $tokens=$null;$parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $runner).Path,[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count){$parseErrors|Select-Object -First 10|ForEach-Object{Write-Host $_.Message};throw 'real ZIP guard runner PS5.1 invalid'}
          $oldRunner=$env:RUNNER_TEMP;$oldTemp=$env:TEMP;$oldTmp=$env:TMP
          $sandbox=Join-Path $oldRunner ('exclusive-real-zip-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $sandbox|Out-Null
          $exitCode=1
          try{
            $env:RUNNER_TEMP=$sandbox;$env:TEMP=$sandbox;$env:TMP=$sandbox
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner *>&1 | Tee-Object -FilePath "$d/real-zip.log"
            $exitCode=$LASTEXITCODE
          }finally{
            $env:RUNNER_TEMP=$oldRunner;$env:TEMP=$oldTemp;$env:TMP=$oldTmp
            $ErrorActionPreference='Stop'
          }
          if($exitCode -ne 0){throw ('actual ZIP guarded third-permit recovery failed '+$exitCode)}
          $text=Get-Content -LiteralPath "$d/real-zip.log" -Raw
          foreach($marker in @(
            'TRIPLE_ID_EXCLUSIVE_REAL_THIRD_PERMIT_ISSUED_AT_HOST_UTC previous_signed_history_untouched=true new_third_permit=true',
            'TRIPLE_ID_EXCLUSIVE_REAL_WALLCLOCK_VERIFIED_PASS synthetic_old_now_denied=true fixture_now_current=true',
            'TRIPLE_ID_EXCLUSIVE_REAL_JOURNALED_SWAP_PASS active_claim_persisted=true fresh_hmac_and_current_utc=true recovery_possible=true',
            'TRIPLE_ID_EXCLUSIVE_REAL_TERMINAL_RETIREMENT_PASS wrong_consumption_denied=true wrong_transaction_denied=true durable_rollback_complete_required=true active_claim_retired=true archived_consumption_replay_denied=true interrupted_archive_crash_reconciled=true',
            'TRIPLE_ID_EXCLUSIVE_REAL_ZIP_END_TO_END_PASS third_hmac_real_zip=true current_utc=true active_claim_before_swap=true independent_process_old_code_restore=true terminal_lock_retirement=true replay_denied=true production_disabled=true'
          )){
            if(-not $text.Contains($marker)){throw ('real ZIP guard missing verified proof '+$marker)}
          }
          [ordered]@{
            schema=1;status='PASS';case_matrix=20
            real_zip_third_hmac=true;true_utc_freshness=true;single_active_transaction_per_app=true
            durable_claim_survived_process_crash=true;terminal_rollback_required_for_claim_retirement=true
            independent_exact_old_app_settings_restored=true;wrong_id_rejected=true;replay_denied=true
            production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
            production_pipeline_enabled=$false;tested_sha=(git rev-parse HEAD).Trim()
          }|ConvertTo-Json -Depth 5|Set-Content -LiteralPath "$d/real-zip-evidence.json" -Encoding UTF8
          Write-Host 'EXCLUSIVE_APP_REAL_ZIP_SIGNED_CLOCK_CRASH_TERMINAL_ALL_EVIDENCE_PASS'
      - name: Upload read-only CI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-app-clock-gate-${{ github.run_id }}
          path: |
            validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/windows-ci.log
            validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/evidence.json
            validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/real-zip.log
            validation/custom-app-production-exclusive-transaction-clock-gate-v0.1.0/real-zip-evidence.json
          if-no-files-found: warn
          retention-days: 14
