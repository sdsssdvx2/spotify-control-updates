name: Validate Custom App Remote Binding Observer v0.4.0

on:
  push:
    branches: [validate/custom-app-remote-binding-observer-v0.4.0]
    paths:
      - 'validation/custom-app-remote-binding-observer-v0.4.0/**'
      - '.github/workflows/validate-custom-app-remote-binding-observer-v040.yml'
  pull_request:
    branches: [validate/custom-app-local-runtime-baseline-v0.1.0]
    paths:
      - 'validation/custom-app-remote-binding-observer-v0.4.0/**'
      - '.github/workflows/validate-custom-app-remote-binding-observer-v040.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact v0.4 validation-only scope and lineage
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='7402ea5c77e58cd072f0166411d40e7726093f3c'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'v0.4 is not descended from exact validated local-baseline head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-remote-binding-observer-v040.yml',
            'validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/build_candidate.py'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "v0.4 validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected v0.4 file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during v0.4 validation.'}
          Write-Host "CUSTOM_APP_REMOTE_BINDING_V040_SCOPE_PASS head=$actual"

      - name: Prove exact dependency and v0.4 blob pins
        shell: powershell
        run: |
          $pins=@(
            @('27aa2f2089e99d6354d5e724577cdd7687d36525','validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py','ef94a51510de3f922659e633c86dbd44f3083a3d'),
            @('b53bcf39f715f1c35c7d1f99e157cdecb0a2a572','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('dba3bb40d720192813a1df9f6cbff3b00c60844f','validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1','3a49ceebd13fa993b086eb2643130fb02c746bd1'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.1/release-id-fix-v011.ps1','e0ae3c494959c6b738bfd1be56183931119542cf'),
            @('7402ea5c77e58cd072f0166411d40e7726093f3c','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'),
            @('HEAD','validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1','7d1a14227cb357bbe34d8846d5ddb295b17990c1'),
            @('HEAD','validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1','30cee886506b75a7d4ba4425f5dce01999faa4a4'),
            @('HEAD','validation/custom-app-remote-binding-observer-v0.4.0/build_candidate.py','7b13595a185bead3f1c3cee80caee10dd19ea996')
          )
          foreach($pin in $pins){$blob=(git rev-parse "$($pin[0])`:$($pin[1])").Trim();if($blob -cne $pin[2]){throw "Pinned blob drift: $($pin[1]) $blob != $($pin[2])"}}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_BLOB_PIN_PASS'

      - name: Parse v0.4 state core and matrix with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file :: $($_.Message)"};throw "PS5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_PS51_PARSE_PASS'

      - name: Run offline remote-binding state acceptance matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1'
          if($LASTEXITCODE -ne 0){throw 'v0.4 remote-binding state matrix failed.'}

      - name: Build deterministic v0.4 candidate twice
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.0/build_candidate.py' --build
          if($LASTEXITCODE -ne 0){throw 'First v0.4 build failed.'}
          $dir='validation/custom-app-remote-binding-observer-v0.4.0/out/bin';$first=@{}
          Get-ChildItem $dir -File|ForEach-Object{$first[$_.Name]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          $report1=(Get-FileHash 'validation/custom-app-remote-binding-observer-v0.4.0/candidate-validation.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          python 'validation/custom-app-remote-binding-observer-v0.4.0/build_candidate.py' --build
          if($LASTEXITCODE -ne 0){throw 'Second v0.4 build failed.'}
          Get-ChildItem $dir -File|ForEach-Object{$h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant();if($first[$_.Name] -cne $h){throw "Nondeterministic v0.4 output: $($_.Name)"}}
          $report2=(Get-FileHash 'validation/custom-app-remote-binding-observer-v0.4.0/candidate-validation.json' -Algorithm SHA256).Hash.ToLowerInvariant();if($report1 -cne $report2){throw 'Nondeterministic v0.4 report.'}
          $r=Get-Content 'validation/custom-app-remote-binding-observer-v0.4.0/candidate-validation.json' -Raw|ConvertFrom-Json
          if($r.generic_remote_mutation_authority_expanded -or $r.production_surface_changed){throw 'v0.4 report indicates authority/production drift.'}
          if([int]$r.remote_observation_minimum_interval_hours -ne 24 -or [int]$r.remote_observation_network_cap_per_inventory -ne 2){throw 'v0.4 network bounding contract drift.'}
          Write-Host "CUSTOM_APP_REMOTE_BINDING_V040_BUILD_PASS addon=$($r.candidate_addon.size)/$($r.candidate_addon.sha256)"

      - name: Parse integrated candidate with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/out/bin/Collect-Marketplace-Records.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file :: $($_.Message)"};throw "Integrated PS5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_INTEGRATED_PARSE_PASS'

      - name: Run full integrated Addon Manager SelfTest including state Save-Load
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'remote-binding-v040-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'v0.4 integrated Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_ADDON_SELFTEST_PASS'

      - name: Audit v0.4 authority, network bounds, and protected persistence policies
        shell: powershell
        run: |
          $addon=Get-Content 'validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1' -Raw
          foreach($required in @(
            'custom_app_remote_sources','custom-app-remote-binding-observer-v1','custom-app-remote-source-v1',
            'MinimumIntervalHours 24','MaxNetworkObservationsPerCycle 2','multiple-safe-remote-binding-candidates',
            'remote-observation-failed','network-or-remote-observer-failure','user-removed-or-absent','provenance-reenrollment-required',
            'New-RequiredSpotifyPersistenceBackup','Restore-SpotifyPersistenceBackup','preserve-ratings-tags-notes-and-browser-storage',
            'playlist-backed-ratings-preserve','never-disable-or-optimize',"source='alexk218/tagify'"
          )){if($addon.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Missing v0.4 safety marker: $required"}}
          $report=Get-Content 'validation/custom-app-remote-binding-observer-v0.4.0/candidate-validation.json' -Raw|ConvertFrom-Json
          $expected=@('better-local-files','eternal-jukebox','ivLyrics','playlist-maker','tagify')|Sort-Object
          $actual=@($report.auto_authority)|Sort-Object
          if(($expected -join '|').ToLowerInvariant() -cne ($actual -join '|').ToLowerInvariant()){throw "Auto authority drift: $($actual -join ',')"}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_POLICY_AUDIT_PASS'

      - name: Replay all validated component matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1';if($LASTEXITCODE -ne 0){throw 'Remote-source v0.1.0 matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1';if($LASTEXITCODE -ne 0){throw 'Remote-source v0.1.1 matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1';if($LASTEXITCODE -ne 0){throw 'Remote-observer offline matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-local-runtime-baseline-v0.1.0/test_custom_app_local_runtime_baseline.ps1';if($LASTEXITCODE -ne 0){throw 'Local-baseline matrix regressed.'}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_COMPONENT_REPLAY_PASS'

      - name: Re-prove live pinned Tagify release observer and contract continuity
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-observation-collector-v0.1.1/test_release_id_fix_v011.ps1'
          if($LASTEXITCODE -ne 0){throw 'Live Tagify remote observer/contract continuity regressed.'}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_LIVE_REMOTE_PASS'

      - name: Prove production and all validated parents remain immutable
        shell: powershell
        run: |
          $parent='7402ea5c77e58cd072f0166411d40e7726093f3c';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@(
            '.github/workflows/validate-custom-app-remote-binding-observer-v040.yml',
            'validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1',
            'validation/custom-app-remote-binding-observer-v0.4.0/build_candidate.py'
          )
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected v0.4 changed surface: $($bad -join ', ')"}
          foreach($path in @(
            'manifest.json','stable-version.json',
            'validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py',
            'validation/custom-app-remote-observation-collector-v0.1.1/release-id-fix-v011.ps1',
            'validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1'
          )){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          $main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1';$mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if($mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control candidate drift: $mh"}
          Write-Host 'CUSTOM_APP_REMOTE_BINDING_V040_IMMUTABILITY_PASS'

      - name: Upload v0.4 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-remote-binding-observer-v040-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-remote-binding-observer-v0.4.0/out/bin/
            validation/custom-app-remote-binding-observer-v0.4.0/candidate-validation.json
            validation/custom-app-remote-binding-observer-v0.4.0/custom-app-remote-binding-state.ps1
            validation/custom-app-remote-binding-observer-v0.4.0/test_custom_app_remote_binding_state.ps1
