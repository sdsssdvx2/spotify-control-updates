name: Validate Custom App Production Recovery-Aware Permit Stage Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0]
    paths: ['validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-aware-permit-stage-executor-v010.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0]
    paths: ['validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-aware-permit-stage-executor-v010.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage pins and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $p='0ac174959051c649acf39af47b65f5328a71feb4';if((git merge-base $p HEAD).Trim() -cne $p){throw 'not descended from exact validated recovery-aware stage-admission head'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-aware-permit-stage-executor-v010.yml','validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/custom-app-production-recovery-aware-permit-stage-executor.ps1','validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_executor.ps1')
          $changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($x in $allowed){if($x -notin $changed){throw "missing $x"}}
          $pins=@(
            @($h,'validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/custom-app-production-recovery-aware-permit-stage-executor.ps1','93a7c88270ebfd9de90fe638fde9f2408bf4cf28'),
            @($h,'validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_executor.ps1','95e4903315e7a0b4dc1da55bf7ba72ec5be13671'),
            @($p,'validation/custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0/custom-app-production-recovery-aware-permit-stage-acquisition-admission.ps1','51c00469a8d0d37242deb0b2af510d14bd2da732'),
            @($p,'validation/custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_acquisition_admission.ps1','e0311e3350da138654dc2f588bb7a76a92adccb3'),
            @('6ba560e7980c3492fb032ebc720f029caa97b15c','validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1','349d4028997a9cc7a94540286c8b9ba6d6a5b050'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5')
          )
          foreach($q in $pins){$b=(git rev-parse "$($q[0])`:$($q[1])").Trim();if($b -cne $q[2]){throw "pin drift $($q[1]) $b != $($q[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_SCOPE_PINS_PASS'

      - name: Parse and audit recovery-aware isolated staging confinement
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0'
          foreach($f in @("$d/custom-app-production-recovery-aware-permit-stage-executor.ps1","$d/test_custom_app_production_recovery_aware_permit_stage_executor.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|ForEach-Object{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-aware-permit-stage-executor.ps1" -Raw
          foreach($m in @('Resolve-CustomAppProductionRecoveryAwarePermitStageAcquisitionAdmissionV010','Test-CustomAppProductionRecoveryAwarePermitStageAdmissionReceiptV010','Invoke-CustomAppStageAcquisitionV010','Test-CustomAppProductionStageExecutorStageResultV010','Test-CustomAppProductionStageExecutorLiveBaselineV010','Invoke-CustomAppProductionStageExecutorCleanupV010','historical_consumption_envelope_sha256','isolated_stage_only=$true','post_stage_recovery_revalidated=$true','session_key_persisted=$false','session_key_exposed=$false','stage_workspace_retained_for_pre_apply=$true','requires_cleanup_if_not_promoted=$true','requires_fresh_revalidation_before_apply=$true','apply_authorized=$false','live_destination_authorized=$false','production_execution_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "recovery-aware stage executor marker missing $m"}}
          $invokeCount=([regex]::Matches($core,'Invoke-CustomAppStageAcquisitionV010')).Count;if($invokeCount -ne 1){throw "exact stage acquisition call count drifted: $invokeCount"}
          foreach($x in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Copy-Item','Move-Item','Set-Content','Add-Content','Out-File','spicetify apply','spicetify config','Invoke-CustomAppProductionAtomicSwap','Save-CustomAppProductionConsumptionStateV010','Save-CustomAppProductionRecoveryAwarePermitConsumptionPersistenceV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "recovery-aware stage executor gained forbidden direct primitive $x"}}
          if($core -match 'session_key_persisted\s*=\s*\$true|session_key_exposed\s*=\s*\$true|result_is_authority\s*=\s*\$true|apply_authorized\s*=\s*\$true|live_destination_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'recovery-aware stage executor authority/session-key contract escaped'}
          $test=Get-Content "$d/test_custom_app_production_recovery_aware_permit_stage_executor.ps1" -Raw
          if($test.IndexOf('custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_acquisition_admission.ps1',[StringComparison]::OrdinalIgnoreCase) -lt 0){throw 'parent recovery-aware stage-admission matrix is not embedded'}
          foreach($m in @('historical rev1 stage executor denied after rev2 append','wrong key','expired permit','user removal before stage','baseline drift before stage','stage acquisition throw','stage result tree drift','stage result authority','stage directory missing','live drift during stage','binding drift during stage','consumption store tamper during stage','permit expired after stage','post-stage time backwards','rehashed apply-authorized stage result accepted','stage result fingerprint tamper accepted','future app')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "recovery-aware stage executor coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_PARSE_AUDIT_PASS'

      - name: Materialize exact hardened sibling dependencies
        shell: powershell
        run: |
          $deps=@(
            @('6ba560e7980c3492fb032ebc720f029caa97b15c','validation/custom-app-production-stage-executor-v0.1.0/custom-app-production-stage-executor.ps1','349d4028997a9cc7a94540286c8b9ba6d6a5b050'),
            @('29fe26f505d2f0fb8d9f47e76b5b819ebe1c129d','validation/custom-app-production-executor-start-gate-v0.1.0/custom-app-production-executor-start-gate.ps1','1fa3ca9e77b4c8a48ef56afd656fd102e1636676'),
            @('29fe26f505d2f0fb8d9f47e76b5b819ebe1c129d','validation/custom-app-production-executor-start-gate-v0.1.0/test_custom_app_production_executor_start_gate.ps1','f63b309beacd2a8f822f6f8c2801c7bb68409c35'),
            @('1401103431e5a647002aef48394dc599c2db421f','validation/custom-app-production-recovery-aware-new-permit-readiness-v0.1.0/custom-app-production-recovery-aware-new-permit-readiness.ps1','0c73b5352c7b9bd29472d3a145a4fc4333d0574b'),
            @('1401103431e5a647002aef48394dc599c2db421f','validation/custom-app-production-recovery-aware-new-permit-readiness-v0.1.0/test_custom_app_production_recovery_aware_new_permit_readiness.ps1','ac323f3b465475bf97b655344d989abe62731d48'),
            @('6bc69d2c8b12d074fa68f3d2ed7688e0846cd23c','validation/custom-app-production-promotion-gate-v0.1.0/custom-app-production-promotion-gate.ps1','1164c197405eac2295f789256e2886068611dd94'),
            @('6bc69d2c8b12d074fa68f3d2ed7688e0846cd23c','validation/custom-app-production-promotion-gate-v0.1.0/test_custom_app_production_promotion_gate.ps1','80b27015fa05951fe2c0f706eb60d212dac17d24'),
            @('b53bcf39f715f1c35c7d1f99e157cdecb0a2a572','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5'),
            @('6d0e964307aaf0c0a8aeece98d5597e81721538e','validation/custom-app-production-recovery-completion-evidence-v0.1.0/custom-app-production-recovery-completion-evidence.ps1','3795f900cbf8ded834f721f7db7b126aa264b0e8'),
            @('6d0e964307aaf0c0a8aeece98d5597e81721538e','validation/custom-app-production-recovery-completion-evidence-v0.1.0/test_custom_app_production_recovery_completion_evidence.ps1','1451ce0aeb046fe36a1660b12647534b514cd738'),
            @('6d0e964307aaf0c0a8aeece98d5597e81721538e','validation/custom-app-production-recovery-completion-evidence-v0.1.0/probe_custom_app_production_recovery_completion_evidence.ps1','8abbcb7eded67420d2e2b6e8bed3f9636ae9833d'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae')
          )
          foreach($q in $deps){$path=$q[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:S="$($q[0])`:$path";$env:O=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['O']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['S']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual -cne $q[2]){throw "materialized blob drift $path $actual != $($q[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_MATERIALIZATION_PASS'

      - name: Run embedded parent plus recovery-aware isolated stage-executor matrix
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_executor.ps1';if($LASTEXITCODE){throw 'recovery-aware isolated stage-executor matrix failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_MATRIX_STEP_PASS'

      - name: Rebuild exact recovery-readiness hard-disabled candidate and run SelfTest
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'recovery-readiness hard-disabled candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length -ne 1382213 -or $ah -cne 'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager parent drift'};if($rh -cne 'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'};if((Get-Item $m).Length -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control parent drift'}
          $s=Join-Path $env:RUNNER_TEMP 'recovery-aware-stage-executor-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $p='0ac174959051c649acf39af47b65f5328a71feb4';$expected=@('.github/workflows/validate-custom-app-production-recovery-aware-permit-stage-executor-v010.yml','validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/custom-app-production-recovery-aware-permit-stage-executor.ps1','validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_executor.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "unexpected surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0/custom-app-production-recovery-aware-permit-stage-acquisition-admission.ps1','validation/custom-app-production-recovery-aware-permit-stage-acquisition-admission-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_acquisition_admission.ps1')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_recovery_aware_stage_admission_parent=$p;validated_generic_stage_executor='6ba560e7980c3492fb032ebc720f029caa97b15c';historical_persisted_consumption_preserved=$true;pre_stage_recovery_aware_admission=$true;isolated_stage_acquisition_once=$true;fresh_live_post_stage=$true;post_stage_recovery_aware_admission=$true;failure_cleanup=$true;success_workspace_retained_only_for_pre_apply=$true;session_key_persisted=$false;session_key_exposed=$false;apply_authority=$false;live_destination_authority=$false;production_execution_authority=$false;production_mutation_authority=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_AWARE_PERMIT_STAGE_EXECUTOR_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-aware-permit-stage-executor-v010-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/custom-app-production-recovery-aware-permit-stage-executor.ps1
            validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/test_custom_app_production_recovery_aware_permit_stage_executor.ps1
            validation/custom-app-production-recovery-aware-permit-stage-executor-v0.1.0/ci-evidence.json
          if-no-files-found: error
