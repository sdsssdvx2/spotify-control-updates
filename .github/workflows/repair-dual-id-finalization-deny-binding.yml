name: Repair dual-ID finalization deny binding

on:
  push:
    branches:
      - validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact repair scope and failure premise
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='65a71b59103a4e0fc233c597b93789bdf7253d42'
          $repair='.github/workflows/repair-dual-id-finalization-deny-binding.yml'
          $core='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/custom-app-production-dual-id-bridge-aware-finalization.ps1'
          if((git merge-base $base HEAD).Trim() -cne $base){throw 'repair head not descended from exact failed-matrix head'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $delta=@(git diff --name-only "$base...HEAD");foreach($p in $delta){if($p -cne $repair){throw "repair scope escaped before patch: $p"}}
          $raw=[IO.File]::ReadAllText((Resolve-Path $core))
          foreach($m in @('$deny={param([string]$Reason,[bool]$CleanupAttempted=$false,[bool]$WorkspaceDeleted=$false,[bool]$RequiresRecovery=$false)','dual-id-finalization-post-cleanup-hook-fault:','$true$true$true')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "deny binding failure premise missing: $m"}}
          'DUAL_ID_FINALIZATION_DENY_BINDING_PREMISE_PASS'

      - name: Normalize all deny calls to named arguments
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/custom-app-production-dual-id-bridge-aware-finalization.ps1'
          $raw=[IO.File]::ReadAllText((Resolve-Path $path));$fixed=$raw

          # First normalize the post-cleanup calls that carry three Boolean state arguments.
          $rxTrueTrueTrue='return\s*&\$deny(?<reason>\([^;\r\n{}]+\)|''[^''\r\n]*'')\$true\$true\$true'
          $rxTrueFalseFalse='return\s*&\$deny(?<reason>\([^;\r\n{}]+\)|''[^''\r\n]*'')\$true\$false\$false'
          $countTTT=([regex]::Matches($fixed,$rxTrueTrueTrue)).Count
          $countTFF=([regex]::Matches($fixed,$rxTrueFalseFalse)).Count
          if($countTTT -lt 1){throw 'expected post-cleanup true/true/true deny calls not found'}
          if($countTFF -ne 1){throw "expected exactly one cleanup-failed true/false/false deny call, got $countTFF"}
          $fixed=[regex]::Replace($fixed,$rxTrueTrueTrue,{'return & $deny -Reason '+$args[0].Groups['reason'].Value+' -CleanupAttempted $true -WorkspaceDeleted $true -RequiresRecovery $true'})
          $fixed=[regex]::Replace($fixed,$rxTrueFalseFalse,{'return & $deny -Reason '+$args[0].Groups['reason'].Value+' -CleanupAttempted $true -WorkspaceDeleted $false -RequiresRecovery $false'})

          # Then make all remaining pre-cleanup one-argument deny calls explicit as well.
          $fixed=[regex]::Replace($fixed,'return\s*&\$deny(?<reason>\([^;\r\n{}]+\)|''[^''\r\n]*'')',{'return & $deny -Reason '+$args[0].Groups['reason'].Value})

          if($fixed.IndexOf('&$deny',[StringComparison]::Ordinal) -ge 0){throw 'compact positional deny invocation remains'}
          if($fixed -match '&\s*\$deny\s+(\(|'')'){throw 'unnamed deny reason invocation remains'}
          if($fixed.IndexOf('$true$true$true',[StringComparison]::Ordinal) -ge 0 -or $fixed.IndexOf('$true$false$false',[StringComparison]::Ordinal) -ge 0){throw 'adjacent positional Boolean deny arguments remain'}
          foreach($m in @('-Reason (''dual-id-finalization-post-cleanup-hook-fault:''+[string]$_.Exception.Message) -CleanupAttempted $true -WorkspaceDeleted $true -RequiresRecovery $true','-CleanupAttempted $true -WorkspaceDeleted $false -RequiresRecovery $false')){if($fixed.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "named deny binding marker missing: $m"}}

          [IO.File]::WriteAllText((Resolve-Path $path),$fixed,(New-Object Text.UTF8Encoding($false)))
          $tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw 'PS5.1 parse failed after deny binding repair'}
          $diff=@(git diff --name-only);if($diff.Count-ne1-or$diff[0]-cne$path){throw "deny binding repair escaped exact core: $($diff -join ', ')"}
          'DUAL_ID_FINALIZATION_DENY_BINDING_REPAIR_READY'

      - name: Commit validation-only repair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='validation/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0/custom-app-production-dual-id-bridge-aware-finalization.ps1'
          git config user.name 'spotify-control-validation-bot';git config user.email '98333820+sdsssdvx2@users.noreply.github.com'
          git add -- $path;git commit -m 'validation: name finalization deny state arguments';if($LASTEXITCODE){throw 'deny binding repair commit failed'}
          git push origin HEAD:validate/custom-app-production-dual-id-bridge-aware-finalization-v0.1.0;if($LASTEXITCODE){throw 'deny binding repair push failed'}
          'DUAL_ID_FINALIZATION_DENY_BINDING_REPAIR_PUSHED'
