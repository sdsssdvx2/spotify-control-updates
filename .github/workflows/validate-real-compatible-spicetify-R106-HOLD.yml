name: HOLD R106 compatible Spotify and real Spicetify backup-apply-restore
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-real-compatible-spicetify-R106-HOLD.yml
permissions: {contents: read}
jobs:
  real-vendor-scratch:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Immutable publisher-signed compatible Spotify 1.3.6 from archival cache
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             (Test-Path (Join-Path $env:APPDATA 'Spotify')) -or
             @(Get-Process Spotify -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'R106_NOT_CLEAN_EPHEMERAL_WINDOWS_HOST'
          }
          $installer=Join-Path $env:RUNNER_TEMP 'R106-Spotify136-signed.exe'
          $url='https://loadspot.amd64fox1.workers.dev/download/spotify_installer-1.3.6.1921.g7086c071a617-x64.exe'
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 240 --output $installer $url
          if($LASTEXITCODE -ne 0){throw 'R106_COMPATIBLE_ARCHIVE_UNAVAILABLE'}
          if((Get-Item $installer).Length -lt 20000000 -or (Get-Item $installer).Length -gt 250000000){
            throw 'R106_ARCHIVE_SIZE_UNEXPECTED'
          }
          # Pin originally published Spotify x64 version via its WinGet SHA.
          $expected='e5ca46ad79de202c8deaf888c26f2a608b9e042142279e0690d589d80640591d'
          if((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){
            throw 'R106_ORIGINAL_SPOTIFY_136_PUBLISHED_SHA_MISMATCH'
          }
          $sig=Get-AuthenticodeSignature -LiteralPath $installer
          if($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or
             $sig.SignerCertificate.Subject -cnotmatch '(?i)(^|,)\s*O=Spotify AB(,|$)'){
            throw 'R106_SIGNED_PUBLISHER_CERTIFICATE_NOT_VERIFIED'
          }
          Write-Host 'R106_VERIFIED_OFFICIAL_SPOTIFY_136_INSTALLER_BYTES_AND_SIGNATURE=PASS'
          $p=Start-Process -FilePath $installer -ArgumentList @('/silent','/skip-app-launch') -PassThru
          if(-not $p.WaitForExit(140000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'R106_SPOTIFY_INSTALL_TIMEOUT'}
          if($p.ExitCode -ne 0){throw 'R106_SPOTIFY_INSTALL_FAILED'}
          $exe=Join-Path $env:APPDATA 'Spotify\Spotify.exe'
          if(-not(Test-Path $exe -PathType Leaf)){throw 'R106_NO_SIGNED_INSTALLATION'}
          $sig=Get-AuthenticodeSignature -LiteralPath $exe
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or
             $sig.SignerCertificate.Subject -cnotmatch '(?i)(^|,)\s*O=Spotify AB(,|$)' -or
             [string]$v -cnotmatch '^1\.3\.6\.1921(\.|$)'){
            throw 'R106_SIGNED_INSTALLED_136_VERSION_CHANGED'
          }
          if(@(Get-Process Spotify -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'R106_UNEXPECTED_SPOTIFY_AUTO_LAUNCH'
          }
          $spa=Join-Path $env:APPDATA 'Spotify\Apps\xpui.spa'
          if(-not(Test-Path $spa -PathType Leaf)){throw 'R106_VANILLA_XPUI_MISSING'}
          Write-Host 'R106_REAL_VENDOR_SIGNED_SPOTIFY_136_VANILLA_XPUI=PASS'
          Remove-Item -LiteralPath $installer -Force
      - name: Official exact Spicetify 2.46.4 binary plus real backup-apply-restore
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'r106-cli.zip'
          & curl.exe --fail --location --silent --show-error --connect-timeout 20 --max-time 100 --output $zip 'https://github.com/spicetify/cli/releases/download/v2.46.4/spicetify-2.46.4-windows-x64.zip'
          if($LASTEXITCODE -ne 0){throw 'R106_OFFICIAL_CLI_DOWNLOAD_FAILED'}
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             '0490380bf59e00c94cf6cb12bfac5152791b91bb8009aceef53c49815b45a56f'){
            throw 'R106_OFFICIAL_CLI_ARCHIVE_SHA_CHANGED'
          }
          $unpack=Join-Path $env:RUNNER_TEMP 'r106-cli-unpack'
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack
          $matches=@(Get-ChildItem -LiteralPath $unpack -Recurse -Filter 'spicetify.exe' -File)
          if($matches.Count -ne 1){throw 'R106_CLI_EXE_COUNT_INVALID'}
          $cli=$matches[0].FullName
          if((Get-FileHash $cli -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
            throw 'R106_OFFICIAL_CLI_EXE_SHA_CHANGED'
          }
          if(([string]((& $cli -v 2>&1) -join ' ')) -notmatch '\b2\.46\.4\b'){
            throw 'R106_CLI_VERSION_MISMATCH'
          }
          Write-Host 'R106_OFFICIAL_PINNED_SPICETIFY_2464=PASS'
          $root=Join-Path $env:APPDATA 'Spotify'
          $prefs=Join-Path $root 'prefs'
          $spa=Join-Path $root 'Apps\xpui.spa'
          $vanilla=(Get-FileHash $spa -Algorithm SHA256).Hash
          # Only an ephemeral synthetic prefs; never any owner Spotify login.
          if(-not (Test-Path $prefs -PathType Leaf)){
            [IO.File]::WriteAllText($prefs,('[Settings]'+[Environment]::NewLine),[Text.Encoding]::UTF8)
          }
          # GitHub-hosted Windows runner may be elevated. --bypass-admin is ONLY
          # for this disposable runner, NEVER a user deployment recommendation.
          $flags=@('--bypass-admin','--no-restart')
          & $cli @flags config spotify_path $root prefs_path $prefs
          if($LASTEXITCODE -ne 0){throw 'R106_SCRATCH_CLI_CONFIG_FAILED'}
          try {
            & $cli @flags backup apply
            if($LASTEXITCODE -ne 0){throw 'R106_REAL_BACKUP_APPLY_FAILED'}
            $changed= -not(Test-Path $spa -PathType Leaf)
            if(-not $changed){
              $changed=((Get-FileHash $spa -Algorithm SHA256).Hash -cne $vanilla)
            }
            if(-not $changed){throw 'R106_APPLY_DID_NOT_CHANGE_REAL_XPUI'}
            Write-Host 'R106_COMPATIBLE_REAL_CLI_BACKUP_APPLY_CHANGED_VENDOR_APP=PASS'
          } finally {
            & $cli @flags restore
            if($LASTEXITCODE -ne 0){throw 'R106_REAL_RESTORE_FAILED'}
            if(-not(Test-Path $spa -PathType Leaf) -or
               (Get-FileHash $spa -Algorithm SHA256).Hash -cne $vanilla){
              throw 'R106_VANILLA_XPUI_NOT_RESTORED_IDENTICALLY'
            }
            Write-Host 'R106_COMPATIBLE_REAL_CLI_RESTORE_VANILLA_EXACT_BYTES=PASS'
          }
          Write-Host 'R106_USER_SPOTIFY_ACCOUNT_AND_MUSIC=NOT_TESTED'
          Write-Host 'R106_PRODUCT_AUTO_MAINTENANCE_ORCHESTRATION=NOT_TESTED'
          Write-Host 'R106_OWNER_PC_AND_PUBLIC_MAIN_RELEASE=UNCHANGED'

      - name: Positive compatibility check in exact unchanged full v0.6.30 main with real vendor binaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='validation/spotify-exit-immediate-maintenance-HOLD/'
          $sources=@(
            'build-combined-exit-and-shortcut-R37-HOLD.py',
            'build-eventdriven-vbs-R45-HOLD.py',
            'build-single-discovery-maintenance-R49-HOLD.py',
            'build-shared-maintenance-lock-R54-HOLD.py',
            'build-rapid-restart-vbs-R58-HOLD.py',
            'build-wmi-selfheal-R63-HOLD.py',
            'build-wmi-rebind-R66-HOLD.py',
            'build-wmi-logon-recovery-R69-HOLD.py',
            'build-boot-wmi-release-R70-HOLD.py',
            'accept-real-signed-spotify-exit-R72-HOLD.py'
          )
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'R107_STABLE_ORIGINAL_BASE_DRIFT'
          }
          foreach($script in $sources){
            & python ($dir+$script)
            if($LASTEXITCODE -ne 0){throw ('R107_EXACT_EXISTING_BUILD_FAILED_'+$script)}
          }
          $actual=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'r106-cli-unpack') -Filter 'spicetify.exe' -File -Recurse)
          if($actual.Count -ne 1){throw 'R107_VERIFIED_OFFICIAL_CLI_NOT_AVAILABLE'}
          $target=Join-Path $env:RUNNER_TEMP 'r75-official-spicetify'
          [void][IO.Directory]::CreateDirectory($target)
          $cli=Join-Path $target 'spicetify.exe'
          [IO.File]::Copy($actual[0].FullName,$cli,$false)
          if((Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
            throw 'R107_CLI_BINARY_CHANGED'
          }
          # R75's verified original full-main harness is reused unchanged.
          # Only its TEST-side expectation is replaced for a signed 1.3.6 client.
          python ($dir+'accept-real-cli-compatibility-R75-HOLD.py')
          if($LASTEXITCODE -ne 0){throw 'R107_PINNED_R75_HARNESS_NOT_RECONSTRUCTED'}
          @'
          from pathlib import Path
          import os
          path=Path(os.environ["RUNNER_TEMP"])/"spotify-r75-real-spicetify-compatibility.ps1"
          t=path.read_text("utf-8")
          pairs=(
            ("'^1\\.3\\.8(\\.|$)'", "'^1\\.3\\.6(\\.|$)'"),
            ("R75_THIS_ACCEPTANCE_EXPECTS_THE_GENUINE_SPOTIFY_1_3_8",
             "R107_THIS_ACCEPTANCE_EXPECTS_THE_GENUINE_SPOTIFY_1_3_6"),
            ("$live.current_spotify_supported -ne $false",
             "$live.current_spotify_supported -ne $true"),
            ("R75_SPOTIFY_138_ABOVE_OFFICIAL_SPICETIFY_2464_MAX_137=TRUE",
             "R107_SPOTIFY_136_WITHIN_OFFICIAL_SPICETIFY_2464_MAX_137=TRUE"),
            ("R75_MAIN_COMPATIBILITY_CURRENT_SUPPORTED_FALSE=PASS",
             "R107_MAIN_COMPATIBILITY_CURRENT_SUPPORTED_TRUE=PASS"),
          )
          for old,new in pairs:
            assert t.count(old)==1, "R107_TEST_ASSERTION_ANCHOR_DRIFT_"+old
            t=t.replace(old,new,1)
          assert "R75_MAIN_COMPATIBILITY_CURRENT_SUPPORTED_FALSE=PASS" not in t
          path.write_text(t,encoding="utf-8",newline="\n")
          print("R107_ONLY_TEST_ASSERTIONS_REBOUND_TO_COMPATIBLE_136=PASS")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R107_EXPECTED_COMPATIBLE_REBIND_INVALID'}
          $test=Join-Path $env:RUNNER_TEMP 'spotify-r75-real-spicetify-compatibility.ps1'
          $tokens=$null;$errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile($test,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'R107_NATIVE_PS51_POSITIVE_HARNESS_SYNTAX_INVALID'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test
          if($LASTEXITCODE -ne 0){throw 'R107_REAL_SIGNED_COMPATIBLE_VENDOR_FULL_MAIN_GUARD_FAILED'}
          Write-Host 'R107_FULL_UNMODIFIED_MAIN_REAL_SPOTIFY_136_AND_OFFICIAL_SPICETIFY_2464=PASS'
          Write-Host 'R107_REAL_COMPATIBLE_GUARD_AND_DISCOVERY=PASS'
          Write-Host 'R107_PRODUCT_MAIN_MUTATION=OFF;ACCOUNT_LOGIN_AND_PLAYBACK=NOT_TESTED'
          Write-Host 'R107_OWNER_PC_AND_PUBLIC_RELEASE=UNCHANGED'
      - name: Exact unchanged v0.6.30 AgentTick attempts real owner-armed repair in disposable signed Spotify profile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){
            throw 'R108_HOSTED_WINDOWS_ONLY'
          }
          if(@(Get-Process Spotify -ErrorAction SilentlyContinue).Count -ne 0){
            throw 'R108_FOREIGN_SPOTIFY_PROCESS'
          }
          $source='validation/spotify-exit-immediate-maintenance-HOLD/out/release-staging-boot-wmi-R70/bin'
          $sc=Join-Path $env:LOCALAPPDATA 'SpotifyControl'
          $bin=Join-Path $sc 'bin'
          if(Test-Path -LiteralPath $sc){throw 'R108_EXISTING_PRODUCT_ROOT_DENY'}
          [void][IO.Directory]::CreateDirectory($bin)
          $pins=@{
            'spotify-control.ps1'='b2b2fbf1afb60b58d501312160f7e2437c2452e90cb61ca8c2be0d877f92232d'
            'spotify-control-agent.vbs'='e56609ed8927512595f55c01ea50dbb9c8c59e4a2c86dcb3d16195a565c604d5'
            'addon-manager.ps1'='5ab556c1d90b9f8e6d5784e238ffd1798c5363a0f7cd7b8313d1f106b5b6a285'
          }
          foreach($key in $pins.Keys){
            $src=Join-Path $source $key
            if((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pins[$key]){
              throw 'R108_PRODUCT_SOURCE_PIN_CHANGED'
            }
            [IO.File]::Copy((Resolve-Path $src).Path,(Join-Path $bin $key),$false)
          }
          $spiceBin=Join-Path $env:LOCALAPPDATA 'spicetify'
          if(Test-Path (Join-Path $spiceBin 'spicetify.exe')){
            throw 'R108_CLI_DESTINATION_PREEXISTED'
          }
          [void][IO.Directory]::CreateDirectory($spiceBin)
          $found=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'r106-cli-unpack') -Filter 'spicetify.exe' -File -Recurse)
          if($found.Count -ne 1){throw 'R108_CLI_SOURCE_UNVERIFIED'}
          $cli=Join-Path $spiceBin 'spicetify.exe'
          [IO.File]::Copy($found[0].FullName,$cli,$false)
          if((Get-FileHash $cli -Algorithm SHA256).Hash.ToLowerInvariant() -cne
            '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){
            throw 'R108_CLI_HASH_UNVERIFIED'
          }
          $env:PATH=$spiceBin+';'+$env:PATH
          $spotify=Join-Path $env:APPDATA 'Spotify'
          $prefs=Join-Path $spotify 'prefs'
          $xpui=Join-Path $spotify 'Apps\xpui.spa'
          if(-not (Test-Path $prefs -PathType Leaf) -or
             -not (Test-Path $xpui -PathType Leaf)){
            throw 'R108_SIGNED_SPOTIFY_FIXTURE_UNAVAILABLE'
          }
          $vanilla=(Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant()
          & $cli --bypass-admin --no-restart config spotify_path $spotify prefs_path $prefs
          if($LASTEXITCODE -ne 0){throw 'R108_CLI_CONFIG_FAILED'}
          $now=[DateTimeOffset]::UtcNow.ToString('o')
          $state=[ordered]@{
            schema=20;agent_mutation_enabled=$true;pending_maintenance=$true;
            maintenance_check_healthy=$true;pending_addon_auto_ambiguous=0;
            pending_self_update=$false;pending_spotify_update=$false;
            pending_spicetify_upgrade=$false;pending_spicetify_repair=$true;
            pending_marketplace_update=$false;last_check_only_utc=$now;
            last_agent_event=$null;last_agent_decision=$null;
            last_agent_tick_utc=$null;pending_reasons=@('test-owned-spicetify-repair')
          }
          $statePath=Join-Path $sc 'state.json'
          [IO.File]::WriteAllText($statePath,($state|ConvertTo-Json -Depth 8 -Compress),[Text.Encoding]::UTF8)
          $main=Join-Path $bin 'spotify-control.ps1'
          $out=Join-Path $env:RUNNER_TEMP 'R108-AgentTick-stdout.txt'
          $err=Join-Path $env:RUNNER_TEMP 'R108-AgentTick-stderr.txt'
          try {
            $arguments='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$main+'" -Action AgentTick -AgentEvent SpotifyExit'
            $proc=Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            if(-not $proc.WaitForExit(180000)){
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw 'R108_AGENTTICK_TIMEOUT_NO_RETRY'
            }
            if($proc.ExitCode -ne 0){throw 'R108_REAL_AGENTTICK_NONZERO_NO_RETRY'}
            $after=Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            $rp=Join-Path $sc 'resident-agent-latest.json'
            if(-not(Test-Path $rp -PathType Leaf)){
              $rp=Join-Path $sc 'logs\resident-agent-latest.json'
            }
            $report=$null
            if(Test-Path $rp -PathType Leaf){$report=Get-Content -LiteralPath $rp -Raw | ConvertFrom-Json}
            $changed= -not(Test-Path $xpui -PathType Leaf)
            if(-not $changed){$changed=((Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant() -cne $vanilla)}
            Write-Host ('R108_REAL_STATE_EVENT='+$(if([string]$after.last_agent_event -ceq 'SpotifyExit'){'SPOTIFYEXIT'}else{'NOT_PROVEN'}))
            Write-Host ('R108_REAL_DECISION='+$(if([string]$after.last_agent_decision -ceq 'maintenance-phase-entered'){'MUTATION_PHASE_ENTERED'}else{'OTHER_OR_HOLD'}))
            Write-Host ('R108_REAL_MUTATION_FLAG='+$(if($null -ne $report -and $report.mutation_ran -eq $true){'TRUE'}else{'NOT_PROVEN'}))
            Write-Host ('R108_REAL_VENDOR_XPUI_CHANGED='+$(if($changed){'YES'}else{'NOT_PROVEN'}))
            if([string]$after.last_agent_event -cne 'SpotifyExit' -or
               [string]$after.last_agent_decision -cne 'maintenance-phase-entered' -or
               $null -eq $report -or $report.mutation_ran -ne $true -or -not $changed){
              throw 'R108_EXACT_PRODUCT_AUTOMATIC_MUTATION_NOT_PROVEN_HOLD'
            }
            Write-Host 'R108_REAL_EXACT_PRODUCT_AGENTTICK_SPICETIFY_MUTATION=PASS'
          } finally {
            # Only hosted test-owned application: restore exact original xPUI.
            if((Test-Path $cli -PathType Leaf) -and (Test-Path $xpui -PathType Leaf)){
              & $cli --bypass-admin --no-restart restore
              if($LASTEXITCODE -ne 0 -or
                 (Get-FileHash $xpui -Algorithm SHA256).Hash.ToLowerInvariant() -cne $vanilla){
                throw 'R108_EPHEMERAL_VANILLA_RESTORE_UNVERIFIED'
              }
              Write-Host 'R108_EXACT_POSTTEST_VANILLA_XPUI_RESTORED=PASS'
            }
          }
          Write-Host 'R108_PUBLIC_STABLE_AND_OWNER_PC=UNCHANGED'
