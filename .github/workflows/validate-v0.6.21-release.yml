name: Validate Spotify Control v0.6.21 Release

on:
  push:
    branches:
      - release/v0.6.21-addon-registry-r10
    paths:
      - 'manifest.json'
      - 'packages/v0.6.21/**'
      - 'validation/v0.6.21/**'
      - 'validation/v0.6.21-bootstrap-e2e/**'
      - '.github/workflows/prepare-v0.6.21-release.yml'
      - '.github/workflows/validate-v0.6.21-release.yml'
      - '.github/workflows/validate-v0.6.21-bootstrap-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'packages/v0.6.21/**'
      - 'validation/v0.6.21/**'
      - 'validation/v0.6.21-bootstrap-e2e/**'
      - '.github/workflows/prepare-v0.6.21-release.yml'
      - '.github/workflows/validate-v0.6.21-release.yml'
      - '.github/workflows/validate-v0.6.21-bootstrap-e2e.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact release scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Wrong v0.6.20 production merge base.'}
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{
            $_ -ne 'manifest.json' -and
            $_ -notlike 'packages/v0.6.21/*' -and
            $_ -notlike 'validation/v0.6.21/*' -and
            $_ -notlike 'validation/v0.6.21-bootstrap-e2e/*' -and
            $_ -ne '.github/workflows/prepare-v0.6.21-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.21-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.21-bootstrap-e2e.yml'
          })
          if($bad.Count){throw "Unexpected v0.6.21 release files: $($bad -join ', ')"}
          $raw=@(git ls-files 'validation/v0.6.21/out/**')
          if($raw.Count){throw "Raw generated candidates must not be committed: $($raw -join ', ')"}
          Write-Host "V0621_RELEASE_SCOPE_PASS head=$actual changed=$($changed.Count)"

      - name: Validate published manifest and committed transports
        shell: powershell
        run: |
          python validation/v0.6.21/build_v0621.py --validate-published
          if($LASTEXITCODE -ne 0){throw 'Published v0.6.21 validation failed.'}
          Write-Host 'V0621_PUBLISHED_TRANSPORT_PASS'

      - name: Rebuild exact candidates deterministically
        shell: powershell
        run: |
          python validation/v0.6.21/build_v0621.py --build
          if($LASTEXITCODE -ne 0){throw 'Deterministic v0.6.21 build failed.'}
          git diff --exit-code -- packages/v0.6.21 validation/v0.6.21/candidate-metadata.json
          if($LASTEXITCODE -ne 0){throw 'Committed v0.6.21 transports differ from deterministic rebuild.'}
          Write-Host 'V0621_DETERMINISTIC_COMMITTED_TRANSPORT_PASS'

      - name: Verify exact manifest identities and edge
        shell: powershell
        run: |
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version -ne '0.6.21'){throw "Unexpected latest_version: $($m.latest_version)"}
          if($m.min_bootstrap_version -ne '1.0.6'){throw 'min_bootstrap_version changed.'}
          if($m.source_commit -ne '9a90d5f13eb63023d8f965a004be14d309d99429'){throw "Unexpected source_commit: $($m.source_commit)"}
          git cat-file -e "$($m.source_commit)^{commit}"
          if($LASTEXITCODE -ne 0){throw 'Manifest source_commit is not an available commit.'}
          if((git merge-base $m.source_commit HEAD).Trim() -ne $m.source_commit){throw 'Manifest source_commit is not an ancestor of release head.'}
          if($m.payload_set_sha256 -ne '7bd1bd7559eee615f4e0aa049b3ec1574f6b215dbdf7417a0a57ea99b20b6c55'){throw 'Unexpected v0.6.21 payload set.'}
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963){throw 'Bootstrap 1.0.6 contract changed.'}
          $main=@($m.latest_files|Where-Object path -eq 'bin/spotify-control.ps1');$addon=@($m.latest_files|Where-Object path -eq 'bin/addon-manager.ps1');$agent=@($m.latest_files|Where-Object path -eq 'bin/spotify-control-agent.vbs')
          if($main.Count -ne 1 -or [int64]$main[0].size -ne 281579 -or $main[0].sha256 -ne 'f97c78c905b83e90e58a24035febcaccc27cb12113ae9cbc64acdc79f5853828'){throw 'v0.6.21 main identity mismatch.'}
          if($addon.Count -ne 1 -or [int64]$addon[0].size -ne 250616 -or $addon[0].sha256 -ne '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2'){throw 'Addon Manager r10 identity mismatch.'}
          if($agent.Count -ne 1 -or [int64]$agent[0].size -ne 4855 -or $agent[0].sha256 -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278'){throw 'Resident agent changed.'}
          $edge=@($m.updates|Where-Object{$_.from_version -eq '0.6.20' -and $_.to_version -eq '0.6.21'})
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2){throw 'Exact v0.6.20 -> v0.6.21 edge missing or ambiguous.'}
          $wrong=@($m.updates|Where-Object{$_.from_version -eq '0.6.20' -and $_.to_version -ne '0.6.21'})
          if($wrong.Count){throw 'Unexpected competing update edge from v0.6.20.'}
          Write-Host 'V0621_MANIFEST_IDENTITY_PASS'

      - name: Verify validation provenance and source identities
        shell: powershell
        run: |
          $meta=Get-Content validation/v0.6.21/candidate-metadata.json -Raw|ConvertFrom-Json
          if($meta.validation_provenance.head -ne '248dcd5315cd98cb798b0b711d21f50355c65d1d' -or $meta.validation_provenance.push_run -ne '40283288327' -or $meta.validation_provenance.pr_run -ne '40283546439'){throw 'r10 validation provenance changed.'}
          if([int64]$meta.validation_provenance.validated_addon_size -ne 250616 -or $meta.validation_provenance.validated_addon_sha256 -ne '7991b8eaa5a943957aebb9d3dd84d455ed6266430da442a672c05c145fe497a2'){throw 'Validated r10 identity provenance changed.'}
          if([int64]$meta.policy_registry.size -ne 12842 -or $meta.policy_registry.sha256 -ne '1e982cad2c043d8715871c6cc8ecf0244b7e4592e4764257f240d20205224e06'){throw 'Policy registry source identity changed.'}
          if([int64]$meta.transaction_guard.size -ne 10408 -or $meta.transaction_guard.sha256 -ne '8c598f96c4b4a4c6409c531657cc4949c92ae9d362785e6186f5334043505407'){throw 'Transaction guard source identity changed.'}
          Write-Host 'V0621_VALIDATION_PROVENANCE_PASS'

      - name: PowerShell 5.1 parse and r10 policy contract
        shell: powershell
        run: |
          foreach($file in @('validation/v0.6.21/out/bin/spotify-control.ps1','validation/v0.6.21/out/bin/addon-manager.ps1','validation/v0.6.21-bootstrap-e2e/run_bootstrap_cycle.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}:{1}: {2}" -f $file,$_.Extent.StartLineNumber,$_.Message)};throw "PowerShell 5.1 parser failed: $file"}
          }
          $main=Get-Content validation/v0.6.21/out/bin/spotify-control.ps1
          if($main[0] -ne '# Spotify Control v0.6.21 Addon Registry r10' -or @($main|Where-Object{$_ -eq '$ScriptVersion = "0.6.21"'}).Count -ne 1){throw 'v0.6.21 main marker mismatch.'}
          $addon=Get-Content validation/v0.6.21/out/bin/addon-manager.ps1 -Raw
          if($addon.IndexOf('$Version = "0.6.5-r10"',[StringComparison]::Ordinal) -lt 0){throw 'Addon Manager r10 marker missing.'}
          foreach($required in @("data_policy='protect-ratings-tags-notes'","data_policy='never-disable-or-optimize'",'Assert-AddonTransactionRegistryAuthorization -Tx $tx','legacy-schema2-no-registry','registry-v1-authorized','Invoke-AddonRegistryCommitCycleSelfTest')){if($addon.IndexOf($required,[StringComparison]::Ordinal) -lt 0){throw "r10 policy contract missing: $required"}}
          if(([regex]::Matches($addon,"mutation_mode='auto'")).Count -ne 4){throw 'r10 automatic mutation authority count changed.'}
          $u0=$addon.IndexOf('function Update-AutoApps {',[StringComparison]::Ordinal);$u1=$addon.IndexOf("`nfunction ",$u0+1,[StringComparison]::Ordinal);$u=$addon.Substring($u0,$u1-$u0)
          foreach($bad in @('$item.source -eq "Pithaya/spicetify-apps-dist"','$item.source -eq "ivLis-Studio/ivLyrics"')){if($u.IndexOf($bad,[StringComparison]::Ordinal) -ge 0){throw "Hard-coded source mutation branch remains: $bad"}}
          $r0=$addon.IndexOf('function Rollback-LastTransaction {',[StringComparison]::Ordinal);$r1=$addon.IndexOf("`nfunction ",$r0+1,[StringComparison]::Ordinal);$rb=$addon.Substring($r0,$r1-$r0)
          foreach($bad in @('Assert-AddonTransactionRegistryAuthorization','Get-AddonPolicyRegistryFingerprint','registry_sha256')){if($rb.IndexOf($bad,[StringComparison]::Ordinal) -ge 0){throw "Rollback became registry-dependent: $bad"}}
          Write-Host 'V0621_POWERSHELL51_AND_POLICY_PASS'

      - name: Candidate Addon Manager comprehensive SelfTest
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.21/out/bin/addon-manager.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Addon Manager r10 SelfTest failed.'}
          Write-Host 'V0621_ADDON_SELFTEST_PASS'

      - name: Prove existing performance overlays unchanged
        shell: powershell
        run: |
          $apply='performance/overlay/apply-overlay.ps1';$loader='performance/overlay/lazy-custom-app-loader.js';$targets='performance/overlay/targets.json'
          if((Get-Item $apply).Length -ne 16748 -or (Get-FileHash $apply -Algorithm SHA256).Hash.ToLowerInvariant() -ne '053a597e834aab959a588350160ce81046ceda66e2a2ac233eeff8af78fea544'){throw 'Overlay apply source changed.'}
          if((Get-Item $loader).Length -ne 10600 -or (Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c38af0f6266747f50d2a0c05e9a49d5ffb34135738715fab6321ff4ae79623d9'){throw 'Overlay loader source changed.'}
          if((Get-Item $targets).Length -ne 1756 -or (Get-FileHash $targets -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c255e53066abbd730467e0c1d92e81dd907e1ea2f245daf6f0d080d2239fea35'){throw 'Overlay target source changed.'}
          node --check $loader
          node performance/overlay/tests/test-loader.js
          if($LASTEXITCODE -ne 0){throw 'Overlay loader regression failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1
          if($LASTEXITCODE -ne 0){throw 'Overlay PowerShell regression failed.'}
          Write-Host 'V0621_OVERLAY_IDENTITY_AND_REGRESSION_PASS'

      - name: Prove Star Ratings production optimization unchanged
        shell: powershell
        run: |
          $engine='performance/star-ratings/apply-star-ratings-patch.ps1';$target='performance/star-ratings/target.json'
          if((Get-Item $engine).Length -ne 12199 -or (Get-FileHash $engine -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5c6945e0ec78845dad80062dd88521e841ebbaab57844f5c8abe1eca8c71932c'){throw 'Star Ratings engine identity changed.'}
          $t=Get-Content $target -Raw|ConvertFrom-Json
          if($t.target.expected_size -ne 43396 -or $t.target.expected_sha256 -ne '198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1' -or $t.target.transformed_sha256 -ne '6e0d1c84408294a619d91191eec83a6d10794ef31093d31ccf1f1bd39ea8c8a3' -or $t.target.source_revision -ne '33aa3d293f9fbb58d7a749a8cea10c318351e6c6'){throw 'Star Ratings target contract changed.'}
          $fixture=Join-Path $env:RUNNER_TEMP 'star-ratings-33aa3d293f9fbb58d7a749a8cea10c318351e6c6.js'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/brimell/spicetify-star-ratings/33aa3d293f9fbb58d7a749a8cea10c318351e6c6/dist/star-ratings.js' -OutFile $fixture
          if((Get-Item $fixture).Length -ne 43396 -or (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne '198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1'){throw 'Immutable Star Ratings fixture mismatch.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/tests/test-star-ratings-patch.ps1 -FixturePath $fixture
          if($LASTEXITCODE -ne 0){throw 'Star Ratings transactional regression failed.'}
          Write-Host 'V0621_STAR_IDENTITY_AND_REGRESSION_PASS'
