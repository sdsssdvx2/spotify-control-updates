name: Validate settings-preserving marketplace lifecycle v0.1.0

on:
  pull_request:
    paths:
      - 'validation/settings-preserving-marketplace-lifecycle-v0.1.0/**'
      - '.github/workflows/validate-settings-preserving-marketplace-lifecycle-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = if ('${{ github.event_name }}' -eq 'pull_request') { '${{ github.event.pull_request.base.sha }}' } else { 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2' }
          $allowed = @(
            '.github/workflows/validate-settings-preserving-marketplace-lifecycle-v010.yml',
            'validation/settings-preserving-marketplace-lifecycle-v0.1.0/audit.py'
          )
          $changed = @(git diff --name-only "$base...HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'git diff failed' }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }
          if ($changed.Count -ne 2) { throw "Expected exactly two validation-only files, got $($changed.Count): $($changed -join ', ')" }
          Write-Host 'VALIDATION_SCOPE_PASS'
          $changed | ForEach-Object { Write-Host "  $_" }

      - name: Reconstruct exact r17 and audit lifecycle boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python validation/settings-preserving-marketplace-lifecycle-v0.1.0/audit.py
          if ($LASTEXITCODE -ne 0) { throw 'audit.py failed' }

      - name: Parse reconstructed PowerShell exactly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('validation/v0.6.28/out/bin/spotify-control.ps1','validation/v0.6.28/out/bin/addon-manager.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
            Write-Host "POWERSHELL_PARSE_PASS $path"
          }

      - name: Prove stable payload remains untouched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python validation/stable/validate_stable.py
          if ($LASTEXITCODE -ne 0) { throw 'stable validator failed' }
          Write-Host 'STABLE_PRODUCTION_UNCHANGED_PASS'

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: settings-preserving-marketplace-lifecycle-v010
          path: validation/settings-preserving-marketplace-lifecycle-v0.1.0/report.json
          if-no-files-found: error
