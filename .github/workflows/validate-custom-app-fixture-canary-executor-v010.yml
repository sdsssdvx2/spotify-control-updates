name: Validate Custom App Fixture Canary Executor v0.1.0

on:
  push:
    branches: [validate/custom-app-fixture-canary-executor-v0.1.0]
    paths:
      - 'validation/custom-app-fixture-canary-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-fixture-canary-executor-v010.yml'
  pull_request:
    branches: [validate/custom-app-fixture-canary-permit-v0.1.0]
    paths:
      - 'validation/custom-app-fixture-canary-executor-v0.1.0/**'
      - '.github/workflows/validate-custom-app-fixture-canary-executor-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact executor-only scope, permit lineage, and frozen production
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='79c7ef064a216ee3ff34328be282d742f0f7abc0'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Fixture canary executor is not descended from exact validated permit head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-fixture-canary-executor-v010.yml',
            'validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1',
            'validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Fixture canary executor validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected fixture canary executor file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during fixture canary executor validation.'}
          Write-Host "CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_SCOPE_PASS head=$actual"

      - name: Prove immutable permit, eligibility, shadow, stage, and transaction dependencies
        shell: powershell
        run: |
          $pins=@(
            @('79c7ef064a216ee3ff34328be282d742f0f7abc0','validation/custom-app-fixture-canary-permit-v0.1.0/custom-app-fixture-canary-permit.ps1','fefd8ccbde5231a70f55f41576c172fba4fede14'),
            @('979e9d6362ead31016b9532f98629d6bcc2bbb56','validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1','94c1b0ba8f2454078252a723f89ccc0327cbc181'),
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1','e0c39d0ffced966626ca5060346b8e6ed936589a'),
            @('22eb3561843fbe4016023d527186aa629512b67d','validation/custom-app-shadow-executor-v0.1.0/shadow-executor-safety-overlay.ps1','250b7f17f6461b073b42f26319c2b229441f9421'),
            @('c420a1df6f306c7ba74772b91241cb14abd04738','validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','e2f2fc656235883d2a82b106289973f6ded409a5'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('b339f2b79a267c13cf3c5974aea2fff3786d3093','validation/custom-app-provenance-enrollment-v0.1.0/custom-app-provenance.ps1','4f0831fa2e5dc23c9a4ec98b6c7a9afbb3c9af55'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1','3a49ceebd13fa993b086eb2643130fb02c746bd1'),
            @('7d22b55c58c6e85a8a3ec9396800e65d81b0e7d2','validation/custom-app-remote-observation-collector-v0.1.1/release-id-fix-v011.ps1','e0ae3c494959c6b738bfd1be56183931119542cf'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('7402ea5c77e58cd072f0166411d40e7726093f3c','validation/custom-app-local-runtime-baseline-v0.1.0/custom-app-local-runtime-baseline.ps1','83156d9c14e40061a0728d28b582c1e65684a4a2'),
            @('d92daa3006093a7d966083193302965ee01905f6','validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py','92eb87048eac882483bee1ed97bde598cff57e7b')
          )
          foreach($p in $pins){$blob=(git rev-parse "$($p[0])`:$($p[1])").Trim();if($blob -cne $p[2]){throw "Pinned executor dependency drift: $($p[1]) $blob != $($p[2])"}}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_DEPENDENCY_PINS_PASS'

      - name: Parse executor core and live acceptance test with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1',
            'validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0} :: line={1} col={2} text=<{3}> :: {4}" -f $file,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_PS51_PARSE_PASS'

      - name: Audit executor ordering, confinement, and authority separation
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1' -Raw
          foreach($m in @(
            '79c7ef064a216ee3ff34328be282d742f0f7abc0','Get-CustomAppFixtureCanaryRootV010','.consumed-permits','FileMode]::CreateNew',
            'pre-stage','post-stage','pre-apply','eligibility-fingerprint-changed','durable-permit-replay-detected','consumption-marker-content-mismatch',
            "Function:\Get-CustomAppStageWorkspaceRootV010","Function:\Invoke-CustomAppUpdateFixtureTransactionV010",
            'Invoke-CustomAppStageAcquisitionV010','Invoke-CustomAppShadowWithAcquiredStageV010','Test-CustomAppFixtureCanaryPermitV010',
            "fixture_canary_execution_authorized=`$true","canary_execution_authorized=`$false","production_mutation_authorized=`$false","mutation_mode='deny'"
          )){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Executor safety marker missing: $m"}}
          foreach($forbidden in @('$env:LOCALAPPDATA','$env:APPDATA','spicetify apply','spicetify config','Uninstall','Remove-AppxPackage','production_mutation_authorized=$true','canary_execution_authorized=$true')){if($core.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Executor contains forbidden production/user-path authority marker: $forbidden"}}
          $consume=$core.IndexOf('Use-CustomAppFixtureCanaryPermitDurablyV011',[StringComparison]::Ordinal)
          $stage=$core.IndexOf('Invoke-CustomAppStageAcquisitionV010',[StringComparison]::Ordinal)
          if($consume -lt 0 -or $stage -lt 0 -or $consume -ge $stage){throw 'Durable permit consumption is not ordered before stage acquisition.'}
          $preApply=$core.IndexOf("-Phase 'pre-apply'",[StringComparison]::Ordinal)
          $marker=$core.IndexOf('Test-CustomAppFixtureCanaryConsumptionMarkerV011',[StringComparison]::Ordinal,$preApply)
          $delegate=$core.IndexOf('& $script:CustomAppFixtureCanaryExecutorOriginalTxV011',[StringComparison]::Ordinal,$preApply)
          if($preApply -lt 0 -or $marker -lt 0 -or $delegate -lt 0 -or $preApply -ge $marker -or $marker -ge $delegate){throw 'Pre-apply HMAC/eligibility/marker barrier is not ordered before original transaction delegation.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_ORDER_SCOPE_AUDIT_PASS'

      - name: Run live permit-consumed fixture canary executor acceptance
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Fixture canary executor live acceptance failed.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_LIVE_ACCEPTANCE_PASS'

      - name: Replay exact permit and promotion parent matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-fixture-canary-permit-v0.1.0/test_custom_app_fixture_canary_permit.ps1'
          if($LASTEXITCODE -ne 0){throw 'Fixture canary permit parent matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-promotion-eligibility-gate-v0.1.0/test_custom_app_promotion_eligibility.ps1'
          if($LASTEXITCODE -ne 0){throw 'Promotion eligibility parent matrix regressed.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_AUTHORITY_PARENT_REPLAY_PASS'

      - name: Replay shadow, stage, and transaction offline matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-shadow-executor-v0.1.0/test_custom_app_shadow_executor.ps1'
          if($LASTEXITCODE -ne 0){throw 'Shadow executor parent matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-stage-acquisition-contract-v0.1.0/test_custom_app_stage_acquisition.ps1'
          if($LASTEXITCODE -ne 0){throw 'Stage acquisition parent matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-update-transaction-protocol-v0.1.0/test_custom_app_update_transaction.ps1'
          if($LASTEXITCODE -ne 0){throw 'Transaction protocol parent matrix regressed.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_PROTOCOL_PARENT_REPLAY_PASS'

      - name: Rebuild exact v0.4.1 candidate and run full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-remote-binding-observer-v0.4.1/build_candidate_v041.py' --build
          if($LASTEXITCODE -ne 0){throw 'Exact v0.4.1 candidate rebuild failed.'}
          $addon='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/addon-manager.ps1';$main='validation/custom-app-remote-binding-observer-v0.4.0/out/bin/spotify-control.ps1'
          $ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $addon).Length -ne 523216 -or $ah -cne 'b2cec989ef399aed4a8763105121b21181ffb493ed9e3e884baa1d62a634f94b'){throw "Parent Addon Manager drift: $((Get-Item $addon).Length)/$ah"}
          $mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant();if($mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control parent drift: $mh"}
          $sandbox=Join-Path $env:RUNNER_TEMP 'fixture-canary-executor-parent-selftest';$env:LOCALAPPDATA=Join-Path $sandbox 'LocalAppData';$env:APPDATA=Join-Path $sandbox 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Exact parent Addon Manager SelfTest failed.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_PARENT_SELFTEST_PASS'

      - name: Prove production and validated permit parent remain immutable
        shell: powershell
        run: |
          $parent='79c7ef064a216ee3ff34328be282d742f0f7abc0';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@(
            '.github/workflows/validate-custom-app-fixture-canary-executor-v010.yml',
            'validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1',
            'validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1'
          )
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected executor changed surface: $($bad -join ', ')"}
          foreach($path in @(
            'manifest.json','stable-version.json','validation/custom-app-fixture-canary-permit-v0.1.0/custom-app-fixture-canary-permit.ps1',
            'validation/custom-app-promotion-eligibility-gate-v0.1.0/custom-app-promotion-eligibility.ps1','validation/custom-app-shadow-executor-v0.1.0/custom-app-shadow-executor.ps1',
            'validation/custom-app-stage-acquisition-contract-v0.1.0/custom-app-stage-acquisition.ps1','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1'
          )){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved.'}
          Write-Host 'CUSTOM_APP_FIXTURE_CANARY_EXECUTOR_IMMUTABILITY_PASS'

      - name: Write fixture canary executor validation evidence
        shell: powershell
        run: |
          $e=[ordered]@{
            schema=1;head=(git rev-parse HEAD).Trim();validated_permit_parent='79c7ef064a216ee3ff34328be282d742f0f7abc0';production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
            executor='custom-app-fixture-canary-executor-v1';scope='fixture-canary-only';durable_consumption_before_stage=$true;pre_stage_revalidation=$true;post_stage_revalidation=$true;pre_apply_revalidation=$true
            generic_canary_execution_authority=$false;production_mutation_authority=$false;auto_update_authority=$false;auto_install_authority=$false
            live_tagify_331_to_332='pass';durable_replay='pass';expiry_after_stage='pass';missing_marker_preapply_barrier='pass';persistence_preservation='pass';parent_selftest='pass'
          }
          $e|ConvertTo-Json -Depth 5|Set-Content 'validation/custom-app-fixture-canary-executor-v0.1.0/ci-evidence.json' -Encoding UTF8

      - name: Upload fixture canary executor validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-fixture-canary-executor-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-fixture-canary-executor-v0.1.0/custom-app-fixture-canary-executor-v011.ps1
            validation/custom-app-fixture-canary-executor-v0.1.0/test_custom_app_fixture_canary_executor.ps1
            validation/custom-app-fixture-canary-executor-v0.1.0/ci-evidence.json
