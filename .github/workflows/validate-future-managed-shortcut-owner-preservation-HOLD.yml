name: HOLD future managed link ownership and neutral CWD (Windows native)
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths:
      - .github/workflows/validate-future-managed-shortcut-owner-preservation-HOLD.yml
      - validation/spotify-exit-immediate-maintenance-HOLD/build-managed-shortcut-future-safe-candidate.py
      - validation/spotify-exit-immediate-maintenance-HOLD/validate-future-offline-transport.py
      - validation/spotify-exit-immediate-maintenance-HOLD/rehearse-localhost-bootstrap-future.py
permissions: {contents: read, actions: read}
jobs:
  native-shortcut:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Rebuild canonical stable and create scoped future candidate (not published)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $main=(git rev-parse origin/main).Trim()
          if($main -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){
            throw 'UNEXPECTED_MAIN_BRANCH_PROVENANCE'
          }
          python validation/spotify-exit-immediate-maintenance-HOLD/build-managed-shortcut-future-safe-candidate.py
          if($LASTEXITCODE -ne 0){throw 'CANDIDATE_BUILDER_FAILED'}
          $report='validation/spotify-exit-immediate-maintenance-HOLD/out/future-safe/candidate-report.json'
          $r=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json
          if($r.parent_sha256 -cne 'af1582ec335807f8f5daa9b3a65b13d567264f326d3c608c082ae02ff0a4cfc0'){
            throw 'CANONICAL_STABLE_SHA_DRIFT'
          }
          $status=@(git status --short manifest.json README.md)
          if($status.Count -gt 0){throw 'RELEASE_MANIFEST_OR_README_MUTATED'}
          Write-Host 'FUTURE_SAFE_CANONICAL_V0628_SOURCE_PIN_AND_NO_RELEASE_MUTATION_PASS'
      - name: Retrieve exact immutable released Bootstrap artifact for static audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > "$RUNNER_TEMP/spotify-pinned-bootstrap-inspect.zip"
      - name: Audit official Bootstrap patch allowed paths and full-file transport
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import zipfile,hashlib,io,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'spotify-pinned-bootstrap-inspect.zip'
          with zipfile.ZipFile(p) as z:
              nested=z.read('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip')
          assert 0 < len(nested) <= 1000000
          print("HOSTED_PINNED_BOOTSTRAP_CARRIER_INNER_SIZE="+str(len(nested)))
          print("HOSTED_PINNED_BOOTSTRAP_CARRIER_INNER_SHA256="+hashlib.sha256(nested).hexdigest())
          with zipfile.ZipFile(io.BytesIO(nested)) as z:
              raw=z.read('bootstrap/spotify-control-self-updater.ps1')
          assert (len(raw),hashlib.sha256(raw).hexdigest())==(42963,'d9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6')
          src=raw.decode('utf-8-sig')
          for i,line in enumerate(src.splitlines(),1):
              if ('gzip-base64-full-file' in line or 'latest_files' in line or
                  'patch' in line.lower() and
                  ('path' in line.lower() or 'encoding' in line.lower())):
                  print(f'PINNED_BOOTSTRAP_CONTRACT_LINE_{i}={line.strip()[:280]}')
          (Path(os.environ['RUNNER_TEMP'])/'spotify-verified-bootstrap-v106.ps1').write_bytes(raw)
          print('PINNED_BOOTSTRAP_V106_SOURCE_SHA256_AND_SIZE_PASS')
          lines=src.splitlines()
          for n,line in enumerate(lines,1):
              if (n<=35 or 'raw.githubusercontent' in line or
                  'ManifestUrl' in line or 'BaseUri' in line or
                  'function Apply-FullFilePatch' in line):
                  print(f'PINNED_BOOTSTRAP_ENTRY_{n}={line.strip()[:240]}')
          for n,line in enumerate(lines,1):
              if (130<=n<=240 or 265<=n<=305 or 470<=n<=560):
                  print(f'PINNED_BOOTSTRAP_FLOW_{n}={line.strip()[:240]}')
          for i,line in enumerate(lines):
              if line.lstrip().startswith('function Apply-FullFilePatch'):
                  for j in range(i,min(i+19,len(lines))):
                      print(f'PINNED_BOOTSTRAP_REAL_PATCH_{j+1}={lines[j].strip()[:240]}')
                  break
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'PINNED_BOOTSTRAP_CONTRACT_AUDIT_FAILED'}
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'spotify-pinned-bootstrap-inspect.zip') -Force -ErrorAction SilentlyContinue
      - name: Offline full-file forward and rollback transport admission for MAIN+resident
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python validation/spotify-exit-immediate-maintenance-HOLD/validate-future-offline-transport.py
          if($LASTEXITCODE -ne 0){throw 'FUTURE_OFFLINE_TWO_FILE_TRANSPORT_FAILED'}
          Write-Host 'FUTURE_STABLE_TRANSPORT_ADMISSION_ONLY_NO_MANIFEST_PUBLISH_PASS'
      - name: Real Bootstrap v1.0.6 Check Update Check Rollback in disposable localhost mirror
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='validation/spotify-exit-immediate-maintenance-HOLD/rehearse-localhost-bootstrap-future.py'
          $scriptAbs=(Resolve-Path $script).Path
          $fixture=Join-Path $env:RUNNER_TEMP 'spotify-future-bootstrap-rehearsal'
          if(Test-Path -LiteralPath $fixture){throw 'BOOTSTRAP_REHEARSAL_ALREADY_EXISTS'}
          $server=$null
          $localBefore=$env:LOCALAPPDATA
          $roamingBefore=$env:APPDATA
          try {
            $python=(Get-Command python).Source
            $server=Start-Process -FilePath $python -ArgumentList ('"'+$scriptAbs+'" serve') -PassThru -WindowStyle Hidden
            $ready=Join-Path $fixture 'server-port'
            for($i=0;$i -lt 100 -and -not(Test-Path -LiteralPath $ready);$i++){
              Start-Sleep -Milliseconds 100
              if($server.HasExited){throw 'HOSTED_LOOPBACK_SERVER_EXITED'}
            }
            if(-not(Test-Path -LiteralPath $ready)){throw 'HOSTED_LOOPBACK_SERVER_NOT_READY'}
            $port=[int][IO.File]::ReadAllText($ready)
            if($port -lt 1 -or $port -gt 65535){throw 'HOSTED_LOOPBACK_PORT_OUT_OF_RANGE'}
            python $script prepare
            if($LASTEXITCODE -ne 0){throw 'HOSTED_BOOTSTRAP_REHEARSAL_PREPARE_FAILED'}
            $app=Join-Path $fixture 'LocalAppData/SpotifyControl'
            $bin=Join-Path $app 'bin'
            $bootstrap=Join-Path $app 'bootstrap/spotify-control-self-updater.ps1'
            $output=Join-Path $fixture 'rehearsal-report.json'
            $expect=Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
            $sourceHash=(Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sourceHash -cne $expect.bootstrap_locator_only_copy_sha256){throw 'HOSTED_BOOTSTRAP_TRUST_PIN_DRIFT'}
            $main=Join-Path $bin 'spotify-control.ps1'
            $agent=Join-Path $bin 'spotify-control-agent.vbs'
            $addon=Join-Path $bin 'addon-manager.ps1'
            $state=Join-Path $app 'state.json'
            $sentinel=Join-Path $app 'unrelated-user-preserve.txt'
            $beforeState=(Get-FileHash -LiteralPath $state -Algorithm SHA256).Hash
            $beforeSentinel=(Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash
            $addonBefore=(Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash
            # This is NOT the operating Windows user's Start Menu. Guard
            # a synthetic owner-custom OTHER_VBS launcher through both actions.
            $menu=Join-Path $fixture 'SyntheticStartMenu'
            [void][IO.Directory]::CreateDirectory($menu)
            $otherDir=Join-Path $fixture 'CustomLauncher'
            [void][IO.Directory]::CreateDirectory($otherDir)
            $otherVbs=Join-Path $otherDir 'owner-custom.vbs'
            [IO.File]::WriteAllText($otherVbs,"' owner simulated wrapper, never execute",[Text.Encoding]::ASCII)
            $shell=New-Object -ComObject WScript.Shell
            $link=Join-Path $menu 'Spotify (Managed).lnk'
            $item=$shell.CreateShortcut($link)
            $item.TargetPath=Join-Path $env:WINDIR 'System32/wscript.exe'
            $item.Arguments='"'+$otherVbs+'"'
            $item.WorkingDirectory=$otherDir
            $item.Save()
            $linkHash=(Get-FileHash -LiteralPath $link -Algorithm SHA256).Hash
            $vbsHash=(Get-FileHash -LiteralPath $otherVbs -Algorithm SHA256).Hash
            $env:LOCALAPPDATA=Join-Path $fixture 'LocalAppData'
            $env:APPDATA=Join-Path $fixture 'Roaming'
            function Invoke-HostedBootstrap {
              param([string]$Action)
              $output=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $bootstrap -Action $Action -Json 2>&1)
              $code=$LASTEXITCODE
              if($code -ne 0){
                Write-Host ('HOSTED_BOOTSTRAP_'+$Action+'_RESULT=FAILED_EXIT_'+$code)
                throw ('HOSTED_BOOTSTRAP_ACTION_FAILED_'+$Action)
              }
              if($output.Count -lt 1){throw ('HOSTED_BOOTSTRAP_EMPTY_RESULT_'+$Action)}
              try{$obj=$output[-1]|ConvertFrom-Json -ErrorAction Stop}
              catch{throw ('HOSTED_BOOTSTRAP_INVALID_RESULT_'+$Action)}
              if($obj.success -ne $true -or [string]$obj.action -cne $Action){
                throw ('HOSTED_BOOTSTRAP_NOT_SUCCESS_'+$Action)
              }
              return $obj
            }
            [void](Invoke-HostedBootstrap -Action 'Check')
            Write-Host 'FUTURE_OFFICIAL_BOOTSTRAP_LOCALHOST_INITIAL_CHECK_PASS'
            [void](Invoke-HostedBootstrap -Action 'Update')
            $txnPath=Join-Path $app 'self-update-last-transaction.json'
            $transaction=Get-Content -LiteralPath $txnPath -Raw|ConvertFrom-Json
            if([string]$transaction.status -cne 'committed'){throw 'HOSTED_BOOTSTRAP_UPDATE_NOT_COMMITTED'}
            if((Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expect.future_main_sha256 -or
               (Get-FileHash $agent -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expect.future_agent_sha256 -or
               (Get-FileHash $addon -Algorithm SHA256).Hash -cne $addonBefore){
              throw 'HOSTED_BOOTSTRAP_REAL_UPDATE_PAYLOAD_MISMATCH'
            }
            Write-Host 'FUTURE_OFFICIAL_BOOTSTRAP_LOCALHOST_MAIN_AND_AGENT_COMMITTED_PASS'
            [void](Invoke-HostedBootstrap -Action 'Check')
            Write-Host 'FUTURE_OFFICIAL_BOOTSTRAP_LOCALHOST_POSTCHECK_PASS'
            [void](Invoke-HostedBootstrap -Action 'Rollback')
            $rolled=Get-Content -LiteralPath $txnPath -Raw|ConvertFrom-Json
            if([string]$rolled.status -cne 'rolled-back'){
              throw 'HOSTED_BOOTSTRAP_ROLLBACK_NOT_COMMITTED'
            }
            if((Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expect.original_main_sha256 -or
               (Get-FileHash $agent -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expect.original_agent_sha256 -or
               (Get-FileHash $addon -Algorithm SHA256).Hash -cne $addonBefore){
              throw 'HOSTED_BOOTSTRAP_ROLLBACK_NOT_EXACT'
            }
            if((Get-FileHash $state -Algorithm SHA256).Hash -cne $beforeState -or
               (Get-FileHash $sentinel -Algorithm SHA256).Hash -cne $beforeSentinel -or
               (Get-FileHash $link -Algorithm SHA256).Hash -cne $linkHash -or
               (Get-FileHash $otherVbs -Algorithm SHA256).Hash -cne $vbsHash){
              throw 'HOSTED_BOOTSTRAP_USER_DATA_OR_CUSTOM_SHORTCUT_MODIFIED'
            }
            Write-Host 'FUTURE_OFFICIAL_BOOTSTRAP_LOCALHOST_EXACT_ROLLBACK_AND_USER_DATA_PRESERVATION_PASS'
          } finally {
            $env:LOCALAPPDATA=$localBefore
            $env:APPDATA=$roamingBefore
            if($null -ne $server -and -not $server.HasExited){
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              [void]$server.WaitForExit(5000)
            }
            Remove-Item -LiteralPath $fixture -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'spotify-verified-bootstrap-v106.ps1') -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'FUTURE_OFFICIAL_BOOTSTRAP_HOSTED_SCRATCH_ONLY_CLEANUP_PASS'
      - name: Actual resident candidate launched from BIN releases process CWD lock
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $reported=(Get-Content -LiteralPath 'validation/spotify-exit-immediate-maintenance-HOLD/out/future-safe/candidate-report.json' -Raw | ConvertFrom-Json)
          $candidate='validation/spotify-exit-immediate-maintenance-HOLD/out/future-safe/spotify-control-agent.vbs'
          $vbs=[IO.File]::ReadAllBytes((Resolve-Path $candidate))
          $h=[Security.Cryptography.SHA256]::Create()
          try{$sha=[BitConverter]::ToString($h.ComputeHash($vbs)).Replace('-','').ToLowerInvariant()}
          finally{$h.Dispose()}
          if($reported.original_resident_sha256 -cne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278' -or
             $sha -cne $reported.future_resident_sha256 -or
             $vbs.Length -ne $reported.future_resident_size){
            throw 'FUTURE_RESIDENT_PIN_OR_REPORT_DRIFT'
          }
          $fixture=Join-Path $env:RUNNER_TEMP 'spotify-future-resident-cwd'
          if(Test-Path -LiteralPath $fixture){throw 'FUTURE_RESIDENT_FIXTURE_PREEXISTS'}
          $bin=Join-Path $fixture 'bin'
          [void][IO.Directory]::CreateDirectory($bin)
          $vbsFile=Join-Path $bin 'spotify-control-agent.vbs'
          [IO.File]::WriteAllBytes($vbsFile,$vbs)
          [IO.File]::WriteAllText((Join-Path $bin 'spotify-control.ps1'),"# unused scratch control script; never execute",[Text.Encoding]::ASCII)
          $wscript=Join-Path $env:WINDIR 'System32/wscript.exe'
          $p=$null
          try{
            $p=Start-Process -FilePath $wscript -WorkingDirectory $bin -ArgumentList ('//B //NoLogo "'+$vbsFile+'"') -PassThru
            Start-Sleep -Milliseconds 2300
            if($p.HasExited){throw 'FUTURE_RESIDENT_EXITED_BEFORE_CWD_PROOF'}
            # The legacy resident blocks this exact operation when the
            # invoking shortcut sets cwd=bin. The candidate must not.
            [IO.Directory]::Move($bin,(Join-Path $fixture 'bin-shifted'))
            if($p.HasExited){throw 'FUTURE_RESIDENT_EXITED_DURING_CWD_RENAME'}
            [IO.Directory]::Move((Join-Path $fixture 'bin-shifted'),$bin)
            if($p.HasExited){throw 'FUTURE_RESIDENT_EXITED_AFTER_CWD_RENAME'}
            Write-Host 'FUTURE_RESIDENT_LIVE_WSCRIPT_BIN_CWD_AUTO_RELEASE_AND_RENAME_PASS'
          }finally{
            if($null -ne $p -and -not $p.HasExited){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              [void]$p.WaitForExit(5000)
            }
            Remove-Item -LiteralPath $fixture -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'FUTURE_RESIDENT_HOSTED_ONLY_PROCESS_AND_FILES_CLEANUP_PASS'
      - name: Exercise actual Windows COM shortcut ownership, neutral CWD and idempotence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate='validation/spotify-exit-immediate-maintenance-HOLD/out/future-safe/spotify-control.ps1'
          $src=[IO.File]::ReadAllText((Resolve-Path $candidate),[Text.Encoding]::UTF8)
          $tok=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseInput($src,[ref]$tok,[ref]$errors)
          if(@($errors).Count -ne 0){throw ('FUTURE_SAFE_PS51_PARSE_ERROR '+$errors[0].Message)}
          $normalized=$src.Replace(([string][char]13+[string][char]10),[string][char]10)
          $begin=$normalized.IndexOf('# Future managed-shortcut safety:',[StringComparison]::Ordinal)
          $end=$normalized.IndexOf(([string][char]10+'    if (-not [string]::IsNullOrWhiteSpace($startMenu))'),$begin,[StringComparison]::Ordinal)
          if($begin -lt 0 -or $end -le $begin){throw 'FUTURE_SAFE_LOOP_EXTRACTION_FAILED'}
          $block=[ScriptBlock]::Create($normalized.Substring($begin,$end-$begin))
          $sandbox=Join-Path $env:RUNNER_TEMP 'spotify-shortcut-safe-fixture'
          if(Test-Path -LiteralPath $sandbox){throw 'FUTURE_SHORTCUT_TEST_ALREADY_EXISTS'}
          $Root=Join-Path $sandbox 'LocalAppData/SpotifyControl'
          $installedBin=Join-Path $Root 'bin'
          $installedVbs=Join-Path $installedBin 'spotify-control-agent.vbs'
          $startMenu=Join-Path $sandbox 'StartMenu'
          $desktop=Join-Path $sandbox 'Desktop'
          $other=Join-Path $sandbox 'CustomWorkdir'
          $foreignVbs=Join-Path $other 'user-custom-spotify-wrapper.vbs'
          foreach($folder in @($installedBin,$startMenu,$desktop,$other)){
            [void][IO.Directory]::CreateDirectory($folder)
          }
          [IO.File]::WriteAllText($installedVbs,"' pinned VBS placeholder",[Text.Encoding]::ASCII)
          [IO.File]::WriteAllText($foreignVbs,"' owner custom content must not change",[Text.Encoding]::ASCII)
          $wscript=Join-Path $env:WINDIR 'System32/wscript.exe'
          $spotifyExe=$null
          $shell=New-Object -ComObject WScript.Shell
          function Test-UsablePath { param([string]$Path,[string]$PathType) return $false }
          function Write-Log { param([string]$Message,[string]$Level='INFO') throw ('UNEXPECTED_SHORTCUT_WRITE_WARNING_'+$Level) }
          $menuLink=Join-Path $startMenu 'Spotify (Managed).lnk'
          $deskLink=Join-Path $desktop 'Spotify (Managed).lnk'
          $owned=$shell.CreateShortcut($menuLink)
          $owned.TargetPath=$wscript
          $owned.Arguments='"'+$foreignVbs+'"'
          $owned.WorkingDirectory=$other
          $owned.Description='CUSTOM_OWNER_SETTING_MUST_SURVIVE'
          $owned.Save()
          $originalMenu=(Get-FileHash $menuLink -Algorithm SHA256).Hash
          $originalUserScript=(Get-FileHash $foreignVbs -Algorithm SHA256).Hash
          $managedTargets=@($deskLink,$menuLink)
          try{
            & $block
            if((Get-FileHash $menuLink -Algorithm SHA256).Hash -cne $originalMenu){throw 'FUTURE_SHORTCUT_CUSTOM_OTHER_VBS_MODIFIED'}
            if((Get-FileHash $foreignVbs -Algorithm SHA256).Hash -cne $originalUserScript){throw 'FUTURE_SHORTCUT_CUSTOM_SCRIPT_MODIFIED'}
            if(Test-Path -LiteralPath $deskLink){
              throw 'FUTURE_SHORTCUT_RECREATED_DELETED_DESKTOP_LINK'
            }
            Write-Host 'FUTURE_SAFE_CUSTOM_VBS_AND_ABSENT_DESKTOP_BYTE_PRESERVED_PASS'
            # Provide an existing exact canonical old shortcut to validate
            # same-volume one-time migration without creating a missing user link.
            $d=$shell.CreateShortcut($deskLink)
            $d.TargetPath=$wscript
            $d.Arguments='"'+$installedVbs+'"'
            $d.WorkingDirectory=$installedBin
            $d.Description='OWNER_CUSTOM_DESCRIPTION_MUST_SURVIVE_CWD_FIX'
            $d.IconLocation=(Join-Path $env:WINDIR 'System32/shell32.dll')+',42'
            $d.Save()
            $originalOfficialMetadata=$shell.CreateShortcut($deskLink)
            $oldDescription=[string]$originalOfficialMetadata.Description
            $oldIcon=[string]$originalOfficialMetadata.IconLocation
            $previousOfficial=(Get-FileHash $deskLink -Algorithm SHA256).Hash
            & $block
            $migrated=$shell.CreateShortcut($deskLink)
            if([string]$migrated.Description -cne $oldDescription -or
               [string]$migrated.IconLocation -cne $oldIcon){
              throw 'FUTURE_SHORTCUT_OWNER_METADATA_NOT_PRESERVED'
            }
            if(-not [string]::Equals([string]$migrated.WorkingDirectory,$Root,[StringComparison]::OrdinalIgnoreCase)){
              throw 'FUTURE_SHORTCUT_OLD_OFFICIAL_BIN_CWD_NOT_NORMALIZED'
            }
            $saves=@(Get-ChildItem -LiteralPath $desktop -Force -File -Filter '.spotify-control-managed-before-neutral-*.lnk')
            if($saves.Count -ne 1 -or
               (Get-FileHash $saves[0].FullName -Algorithm SHA256).Hash -cne $previousOfficial){
              throw 'FUTURE_SHORTCUT_BACKUP_NOT_ATOMIC_OR_EXACT'
            }
            $shaAfter=(Get-FileHash $deskLink -Algorithm SHA256).Hash
            & $block
            if((Get-FileHash $deskLink -Algorithm SHA256).Hash -cne $shaAfter -or
               @(Get-ChildItem -LiteralPath $desktop -Force -File -Filter '.spotify-control-managed-before-neutral-*.lnk').Count -ne 1 -or
               (Get-FileHash $menuLink -Algorithm SHA256).Hash -cne $originalMenu){
              throw 'FUTURE_SHORTCUT_IDEMPOTENCE_OR_CUSTOM_PRESERVATION_FAILED'
            }
            Write-Host 'FUTURE_SAFE_OLD_OFFICIAL_MIGRATION_ORIGINAL_BACKUP_AND_IDEMPOTENCE_PASS'
            Write-Host 'FUTURE_SAFE_OFFICIAL_OWNER_ICON_AND_DESCRIPTION_PRESERVED_PASS'
            $customOfficial=$shell.CreateShortcut($deskLink)
            $customOfficial.WorkingDirectory=$other
            $customOfficial.Save()
            $customSha=(Get-FileHash $deskLink -Algorithm SHA256).Hash
            & $block
            if((Get-FileHash $deskLink -Algorithm SHA256).Hash -cne $customSha){
              throw 'FUTURE_SHORTCUT_CUSTOM_OFFICIAL_WORKDIR_NOT_PRESERVED'
            }
            Write-Host 'FUTURE_SAFE_OWNER_CUSTOM_WORKDIR_PRESERVED_PASS'
            # Fresh initial setup with neither link must still create both.
            $freshDesk=Join-Path $sandbox 'FreshDesktop'
            $freshMenu=Join-Path $sandbox 'FreshStartMenu'
            foreach($dir in @($freshDesk,$freshMenu)){[void][IO.Directory]::CreateDirectory($dir)}
            $managedTargets=@(
              (Join-Path $freshDesk 'Spotify (Managed).lnk'),
              (Join-Path $freshMenu 'Spotify (Managed).lnk')
            )
            & $block
            foreach($newLink in $managedTargets){
              if(-not(Test-Path -LiteralPath $newLink)){throw 'FUTURE_SHORTCUT_FRESH_INSTALL_MISSING_LINK'}
              $check=$shell.CreateShortcut($newLink)
              if(-not [string]::Equals([string]$check.WorkingDirectory,$Root,[StringComparison]::OrdinalIgnoreCase) -or
                 [string]$check.Arguments -cne ('"'+$installedVbs+'"')){
                throw 'FUTURE_SHORTCUT_FRESH_INSTALL_NOT_NEUTRAL'
              }
            }
            Write-Host 'FUTURE_SAFE_BOTH_ABSENT_FRESH_INSTALL_NEUTRAL_DEFAULT_LINKS_PASS'
          }finally{
            Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'FUTURE_SHORTCUT_NATIVE_WINDOWS_FIXTURE_CLEANUP_PASS'
