name: Build and validate Spotify Control v0.6.19

on:
  push:
    branches:
      - release/v0.6.19-performance-overlay
    paths:
      - 'validation/v0.6.19/build_v0619.py'
      - 'validation/v0.6.19/performance_overlay_wrapper.ps1.inc'
      - 'validation/v0.6.19/test_production_overlay_wrapper.ps1'
      - 'performance/overlay/**'
      - '.github/workflows/build-v0.6.19.yml'

permissions:
  contents: write

jobs:
  build-validate-publish-branch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen production base
        shell: powershell
        run: |
          git fetch origin main --no-tags
          $main=(git rev-parse origin/main).Trim()
          if ($main -ne '635358a620a9d28d99a52571085558906af967b6') { throw "Frozen production main moved unexpectedly: $main" }
          Write-Host "FROZEN_PRODUCTION_PASS $main"

      - name: Build exact v0.6.19 and r8 candidates
        shell: powershell
        run: python validation/v0.6.19/build_v0619.py --build

      - name: PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $files=@(
            'validation/v0.6.19/out/bin/spotify-control.ps1',
            'validation/v0.6.19/out/bin/addon-manager.ps1',
            'performance/overlay/apply-overlay.ps1',
            'performance/overlay/collect-active-provenance.ps1',
            'validation/v0.6.19/test_production_overlay_wrapper.ps1'
          )
          foreach($file in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "PowerShell parser failed: $file" }
          }
          Write-Host 'V0619_POWERSHELL51_PARSE_PASS'

      - name: Static production overlay mutation-scope audit
        shell: powershell
        run: |
          $addon=Get-Content 'validation/v0.6.19/out/bin/addon-manager.ps1' -Raw
          $begin='# BEGIN SPOTIFY CONTROL PERFORMANCE OVERLAY v0.1.0 / r8'
          $end='# END SPOTIFY CONTROL PERFORMANCE OVERLAY v0.1.0 / r8'
          $s=$addon.IndexOf($begin,[StringComparison]::Ordinal); $e=$addon.IndexOf($end,[StringComparison]::Ordinal)
          if($s -lt 0 -or $e -le $s) { throw 'Expanded overlay wrapper markers missing.' }
          $wrapper=$addon.Substring($s,($e+$end.Length)-$s)
          foreach($needle in @('spicetify apply','spicetify backup','spicetify restore','config-xpui.ini','\Browser\','\Default\','ivLyrics','tagify','splitify')) {
            if($wrapper.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Forbidden production wrapper mutation surface: $needle" }
          }
          if(([regex]::Matches($addon,'Invoke-PerformanceOverlayBestEffort -Reason')).Count -ne 4) { throw 'Expected wrapper definition plus exactly three production hook calls.' }
          $checkStart=$addon.IndexOf('"Check" {',[StringComparison]::Ordinal)
          $updateStart=$addon.IndexOf('"Update" {',[StringComparison]::Ordinal)
          if($checkStart -lt 0 -or $updateStart -le $checkStart) { throw 'Addon action switch not found.' }
          if($addon.Substring($checkStart,$updateStart-$checkStart).Contains('Invoke-PerformanceOverlayBestEffort')) { throw 'Check action must remain mutation-free.' }
          Write-Host 'V0619_WRAPPER_STATIC_SCOPE_PASS'

      - name: Candidate Addon Manager read-only SelfTest
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/v0.6.19/out/bin/addon-manager.ps1' -Action SelfTest
          if($LASTEXITCODE -ne 0) { throw "Candidate Addon Manager SelfTest failed: $LASTEXITCODE" }

      - name: Standalone overlay regression tests
        shell: powershell
        run: |
          node --check performance/overlay/lazy-custom-app-loader.js
          node performance/overlay/tests/test-loader.js
          if($LASTEXITCODE -ne 0) { throw 'Overlay loader tests failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1
          if($LASTEXITCODE -ne 0) { throw 'Overlay PowerShell regression tests failed.' }

      - name: Download and pin immutable active-extension fixtures
        shell: powershell
        run: |
          $blf=Join-Path $env:RUNNER_TEMP 'better-local-files-extension.js'
          $pm=Join-Path $env:RUNNER_TEMP 'playlist-maker-extension.js'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/Pithaya/spicetify-apps-dist/bf467fab93e6c1f8b8d4189dc1054bd1cafb3f3a/extension.js' -OutFile $blf
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/Pithaya/spicetify-apps-dist/9fd89fb40a53e4cfbf0953d34f806f4a8a36fc64/extension.js' -OutFile $pm
          if((Get-Item $blf).Length -ne 23643 -or (Get-FileHash $blf -Algorithm SHA256).Hash.ToLowerInvariant() -ne '56512ad3d2e01281f388f9a0ae53909340e1221f6ec0f96941eeb992c4a5fbbe') { throw 'Better Local Files immutable fixture mismatch.' }
          if((Get-Item $pm).Length -ne 97410 -or (Get-FileHash $pm -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ed57ddc470e65b5b01084cad221354f288053afe710773fa105327c747d1c0e8') { throw 'Playlist Maker immutable fixture mismatch.' }
          "BLF_FIXTURE=$blf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PM_FIXTURE=$pm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'V0619_IMMUTABLE_EXTENSION_FIXTURES_PASS'

      - name: Production wrapper synthetic integration test
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.19/test_production_overlay_wrapper.ps1 -CandidateAddon validation/v0.6.19/out/bin/addon-manager.ps1 -BetterLocalFilesExtension $env:BLF_FIXTURE -PlaylistMakerExtension $env:PM_FIXTURE
          if($LASTEXITCODE -ne 0) { throw "Production wrapper integration test failed: $LASTEXITCODE" }

      - name: Commit validated transport payload
        id: payload
        shell: powershell
        run: |
          git config user.name 'spotify-control-ci'
          git config user.email '98333820+sdsssdvx2@users.noreply.github.com'
          git add packages/v0.6.19 validation/v0.6.19/candidate-metadata.json
          if((git diff --cached --name-only).Count -eq 0) { throw 'Builder produced no payload changes.' }
          git commit -m 'Build Spotify Control v0.6.19 performance overlay payload'
          $sha=(git rev-parse HEAD).Trim()
          "payload_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "V0619_PAYLOAD_COMMIT $sha"

      - name: Write manifest against exact payload commit
        shell: powershell
        run: |
          python validation/v0.6.19/build_v0619.py --write-manifest --source-commit '${{ steps.payload.outputs.payload_sha }}'
          git add manifest.json
          git commit -m 'Publish Spotify Control v0.6.19 performance overlay manifest'
          python validation/v0.6.19/build_v0619.py --validate-published

      - name: Final branch diff and protected payload audit
        shell: powershell
        run: |
          $unexpected=@(git diff --name-only origin/main...HEAD | Where-Object {
            $_ -notlike 'performance/overlay/*' -and
            $_ -notlike 'validation/v0.6.19/*' -and
            $_ -notlike 'packages/v0.6.19/*' -and
            $_ -ne 'manifest.json' -and
            $_ -ne '.github/workflows/build-v0.6.19.yml' -and
            $_ -ne '.github/workflows/inspect-v0.6.19-addon.yml'
          })
          if($unexpected.Count -gt 0) { throw "Unexpected v0.6.19 branch files: $($unexpected -join ', ')" }
          $m=Get-Content manifest.json -Raw | ConvertFrom-Json
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963) { throw 'Bootstrap contract changed.' }
          $agent=@($m.latest_files | Where-Object path -eq 'bin/spotify-control-agent.vbs')
          if($agent.Count -ne 1 -or $agent[0].sha256 -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278' -or [int64]$agent[0].size -ne 4855) { throw 'Resident agent changed.' }
          Write-Host 'V0619_FINAL_BRANCH_AUDIT_PASS'

      - name: Push validated release branch
        shell: powershell
        run: git push origin HEAD:release/v0.6.19-performance-overlay

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: spotify-control-v0.6.19-candidate-evidence
          path: |
            validation/v0.6.19/out/bin/spotify-control.ps1
            validation/v0.6.19/out/bin/addon-manager.ps1
            validation/v0.6.19/candidate-metadata.json
            manifest.json
          if-no-files-found: error
