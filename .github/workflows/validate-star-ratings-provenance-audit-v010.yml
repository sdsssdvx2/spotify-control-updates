name: Audit Star Ratings Release Provenance v0.1.0

on:
  push:
    branches:
      - validate/star-ratings-provenance-audit-v0.1.0
    paths:
      - '.github/workflows/validate-star-ratings-provenance-audit-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact validation-only scope
        shell: powershell
        run: |
          $base='5cf131e7bc168f686c7b6fc933a713f4d96b9dd3'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne '${{ github.sha }}'){throw "Checkout is not exact event head: $actual"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Star Ratings audit is not based on exact stable v0.6.26 main.'}
          $changed=@(git diff --name-only "$base...HEAD")
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/validate-star-ratings-provenance-audit-v010.yml'){
            throw "Unexpected audit scope: $($changed -join ', ')"
          }
          Write-Host "STAR_RATINGS_PROVENANCE_AUDIT_SCOPE_PASS head=$actual"

      - name: Catalog stable release-tag dist identities
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, re, urllib.request
          from pathlib import Path

          API='https://api.github.com/repos/brimell/spicetify-star-ratings'
          RAW='https://raw.githubusercontent.com/brimell/spicetify-star-ratings'
          UA='SpotifyControl-StarRatings-Provenance-Audit/0.1.0'
          out=Path('star-ratings-provenance-audit-evidence'); out.mkdir(exist_ok=True)
          token=os.environ.get('GH_TOKEN','')

          def request(url, accept='application/vnd.github+json'):
              headers={'User-Agent':UA,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28'}
              if token and url.startswith('https://api.github.com/'):
                  headers['Authorization']='Bearer '+token
              return urllib.request.Request(url,headers=headers)

          def get_json(url):
              with urllib.request.urlopen(request(url),timeout=30) as r:
                  return json.load(r)

          def get_bytes(url):
              with urllib.request.urlopen(request(url,'application/octet-stream'),timeout=30) as r:
                  return r.read()

          def resolve_tag_commit(tag):
              ref=get_json(f'{API}/git/ref/tags/{tag}')
              obj=ref['object']
              seen=set()
              while obj['type']=='tag':
                  if obj['sha'] in seen: raise RuntimeError('annotated-tag-cycle:'+tag)
                  seen.add(obj['sha'])
                  obj=get_json(obj['url'])['object']
              if obj['type']!='commit': raise RuntimeError(f'tag-not-commit:{tag}:{obj["type"]}')
              return obj['sha']

          releases=get_json(f'{API}/releases?per_page=100')
          stable=[r for r in releases if not r.get('draft') and not r.get('prerelease') and re.fullmatch(r'\d+\.\d+\.\d+',str(r.get('tag_name') or ''))]
          stable.sort(key=lambda r:tuple(map(int,r['tag_name'].split('.'))))
          if not stable: raise SystemExit('No stable Star Ratings releases found.')
          if stable[-1]['tag_name']!='2.1.3': raise SystemExit(f'Latest stable Star Ratings release drifted from audited baseline: {stable[-1]["tag_name"]}')

          catalog=[]
          for rel in stable:
              tag=rel['tag_name']; commit=resolve_tag_commit(tag)
              manifest_raw=get_bytes(f'{RAW}/{commit}/manifest.json')
              try: manifest=json.loads(manifest_raw.decode('utf-8-sig'))
              except Exception as exc: raise RuntimeError(f'invalid-manifest:{tag}:{exc}')
              if manifest.get('main')!='dist/star-ratings.js': raise RuntimeError(f'unexpected-main:{tag}:{manifest.get("main")}')
              if 'star ratings' not in str(manifest.get('name') or '').lower(): raise RuntimeError(f'unexpected-name:{tag}:{manifest.get("name")}')
              js=get_bytes(f'{RAW}/{commit}/dist/star-ratings.js')
              if not js: raise RuntimeError('empty-dist:'+tag)
              js_sha=hashlib.sha256(js).hexdigest()
              row={
                  'version':tag,
                  'tag':tag,
                  'tag_commit':commit,
                  'published_at':rel.get('published_at'),
                  'release_immutable':bool(rel.get('immutable')),
                  'release_asset_count':len(rel.get('assets') or []),
                  'manifest_name':manifest.get('name'),
                  'manifest_main':manifest.get('main'),
                  'manifest_sha256':hashlib.sha256(manifest_raw).hexdigest(),
                  'dist_path':'dist/star-ratings.js',
                  'dist_size':len(js),
                  'dist_sha256':js_sha,
              }
              catalog.append(row)
              print('STAR_RATINGS_RELEASE',tag,'commit',commit,'size',len(js),'sha256',js_sha,'immutable',row['release_immutable'],'assets',row['release_asset_count'])

          by_dist={}
          for row in catalog:
              by_dist.setdefault((row['dist_size'],row['dist_sha256']),[]).append(row['version'])
          duplicate_dist=[{'dist_size':k[0],'dist_sha256':k[1],'versions':v} for k,v in by_dist.items() if len(v)>1]

          perf_commit='33aa3d293f9fbb58d7a749a8cea10c318351e6c6'
          perf_js=get_bytes(f'{RAW}/{perf_commit}/dist/star-ratings.js')
          perf_sha=hashlib.sha256(perf_js).hexdigest()
          if len(perf_js)!=43396 or perf_sha!='198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1':
              raise SystemExit(f'Historical production Star Ratings trust anchor drifted: {len(perf_js)} {perf_sha}')
          matching=[x['version'] for x in catalog if x['dist_size']==len(perf_js) and x['dist_sha256']==perf_sha]

          latest=catalog[-1]
          result={
              'schema':1,
              'repository':'brimell/spicetify-star-ratings',
              'stable_release_count':len(catalog),
              'latest_stable':latest['version'],
              'catalog':catalog,
              'duplicate_dist_identities':duplicate_dist,
              'historical_production_anchor':{
                  'commit':perf_commit,
                  'dist_size':len(perf_js),
                  'dist_sha256':perf_sha,
                  'matching_release_versions':matching,
              },
              'ratings_storage_contract':'spotify-playlists-not-extension-file',
              'provenance_candidate_surface':'source-extension-file-only',
          }
          encoded=(json.dumps(result,indent=2,sort_keys=True)+'\n').encode('utf-8')
          (out/'catalog.json').write_bytes(encoded)
          print('STAR_RATINGS_AUDIT_SUMMARY stable',len(catalog),'latest',latest['version'],'duplicates',json.dumps(duplicate_dist,sort_keys=True),'production_anchor_matches',matching)
          print('STAR_RATINGS_CATALOG_SHA256',hashlib.sha256(encoded).hexdigest())
          print('STAR_RATINGS_PROVENANCE_AUDIT_PASS')

      - name: Classify provenance suitability
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path('star-ratings-provenance-audit-evidence/catalog.json').read_text(encoding='utf-8'))
          unique=sum(1 for x in r['catalog'] if not any(x['version'] in d['versions'] for d in r['duplicate_dist_identities']))
          ambiguous=sum(len(d['versions']) for d in r['duplicate_dist_identities'])
          print('STAR_RATINGS_PROVENANCE_CLASSIFICATION stable=',r['stable_release_count'],'unique_versions=',unique,'ambiguous_versions=',ambiguous)
          print('STAR_RATINGS_PRODUCTION_ANCHOR_RELEASE_MATCHES',r['historical_production_anchor']['matching_release_versions'])
          print('STAR_RATINGS_PROVENANCE_READ_ONLY_AUDIT_COMPLETE')

      - name: Prove audit changed no production surface
        shell: powershell
        run: |
          $base='5cf131e7bc168f686c7b6fc933a713f4d96b9dd3'
          $changed=@(git diff --name-only "$base...HEAD")
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/validate-star-ratings-provenance-audit-v010.yml'){
            throw 'Audit branch gained non-validation changes.'
          }
          git diff --exit-code -- manifest.json manifest.schema.json packages validation performance README.md
          if($LASTEXITCODE -ne 0){throw 'Audit changed a production/tracked validation surface.'}
          Write-Host 'STAR_RATINGS_AUDIT_NO_PRODUCTION_CHANGE_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: star-ratings-provenance-audit-v010
          path: star-ratings-provenance-audit-evidence/catalog.json
          if-no-files-found: error
