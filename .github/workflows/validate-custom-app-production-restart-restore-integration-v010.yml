name: Validate Custom App Production Restart Restore Integration v0.1.0

on:
  push:
    branches: [validate/custom-app-production-restart-restore-integration-v0.1.0]
    paths:
      - 'validation/custom-app-production-restart-restore-integration-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-restart-restore-integration-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-evidence-bound-journal-atomic-v0.1.0]
    paths:
      - 'validation/custom-app-production-restart-restore-integration-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-restart-restore-integration-v010.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage immutable pins and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h -cne $e){throw "head mismatch $h != $e"}
          $base='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';if((git merge-base $base HEAD).Trim() -cne $base){throw 'not descended from exact evidence-bound journal atomic head'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $allowed=@('.github/workflows/validate-custom-app-production-restart-restore-integration-v010.yml','validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1')
          $changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($x in $allowed){if($x -notin $changed){throw "missing $x"}}
          $pins=@(
            @('validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1','9964409eb74666c76a3ba57f8ce17e6f0b6e01e7'),
            @('validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/custom-app-production-evidence-bound-journal-atomic.ps1','55ca1e3c8d56b2e86a98d8b47e8ac1cc4ccbb6d0'),
            @('validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/test_custom_app_production_evidence_bound_journal_atomic.ps1','dad1028758e3f03aebd86a84adc5c1d26a37bee3'),
            @('validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63'),
            @('validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/test_custom_app_production_recovery_restore_resume_admission.ps1','aa05cb19d796cbad3b21b11950af2f638a2b8b52'),
            @('validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','5fec613c460619da5dbfe88fca5c7334e9e93f76'),
            @('validation/custom-app-production-recovery-restore-executor-v0.1.0/test_custom_app_production_recovery_restore_executor.ps1','5f925d804a3561167f7d8b388a79239eee61fa3d'),
            @('validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-mutation.ps1','79580da78443a18bd281d4fce61c4a57d958a196'),
            @('validation/custom-app-production-journal-aware-atomic-mutation-v0.1.0/custom-app-production-journal-aware-atomic-repair-v011.ps1','210c4dda2311eb5defcbcd74977e4f4148ea7c38'),
            @('validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('validation/custom-app-production-spicetify-apply-executor-v0.1.0/custom-app-production-spicetify-apply-executor.ps1','f7372b069fbfe6a0f8d8a0aad45312ffd33d9f0a')
          )
          foreach($p in $pins){$b=(git rev-parse "HEAD`:$($p[0])").Trim();if($b -cne $p[1]){throw "pin drift $($p[0]) $b != $($p[1])"}}
          'RESTART_RESTORE_SCOPE_LINEAGE_PINS_PASS'

      - name: Parse and audit process-boundary recovery contract
        shell: powershell
        run: |
          $f='validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1'
          $t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|ForEach-Object{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw 'PS5.1 parse failed'}
          $x=Get-Content $f -Raw
          foreach($m in @("ValidateSet('all','prepare','resume')",'-Mode prepare','-Mode resume','after-live-move-before-journal','first-rename-complete-unjournaled','Invoke-CustomAppProductionJournalAwareAtomicStartingRepairV010','Resolve-CustomAppProductionRecoveryRestoreResumeAdmissionV010','Invoke-CustomAppProductionRecoveryRestoreExecutorV010','rollback-complete','replay launched a second recovery apply','CUSTOM_APP_PRODUCTION_RESTART_RESTORE_PROCESS_BOUNDARY_PASS')){if($x.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "integration marker missing $m"}}
          foreach($forbidden in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','manifest.json','stable-version.json','addon-policy-registry.json')){if($x.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "integration test references protected production/wrapper surface $forbidden"}}
          'RESTART_RESTORE_PARSE_AUDIT_PASS'

      - name: Run exact process-boundary crash to restore integration twice
        shell: powershell
        timeout-minutes: 210
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $f='validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1'
          1..2|ForEach-Object{
            $state=Join-Path $env:RUNNER_TEMP ("restart-restore-pass-$_.json")
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $f -Mode all -StatePath $state
            if($LASTEXITCODE){throw "restart restore integration failed pass $_"}
          }
          'RESTART_RESTORE_PROCESS_BOUNDARY_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length -ne 1382213 -or $ah -cne 'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager hard-disabled candidate drift'}
          if((Get-Item $m).Length -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'}
          if($rh -cne 'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'restart-restore-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'RESTART_RESTORE_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces immutable and write evidence
        shell: powershell
        run: |
          $base='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';$expected=@('.github/workflows/validate-custom-app-production-restart-restore-integration-v010.yml','validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1');$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "unexpected changed surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/custom-app-production-evidence-bound-journal-atomic.ps1','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1')){git diff --quiet $base HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $e=[ordered]@{schema=1;kind='custom-app-production-restart-restore-integration';head=(git rev-parse HEAD).Trim();base=$base;production_main=(git rev-parse origin/main).Trim();integration_test_blob=(git hash-object 'validation/custom-app-production-restart-restore-integration-v0.1.0/test_custom_app_production_restart_restore_integration.ps1').Trim();evidence_bound_atomic_head='c21a8c72dd8920df8e1faa59eb6aedee76a15e06';restore_resume_admission_head='d9a1face71511bdaeeef4e8c761415ef9ec95fc0';restore_executor_head='c3e1f960447ba84d2410af9c37a22a384f2a5436';process_boundary_restart=$true;production_mutation=$false;managed_entrypoint_changed=$false;domainvpn_wrapper_changed=$false}
          $e|ConvertTo-Json -Depth 10|Set-Content -LiteralPath 'restart-restore-validation-evidence.json' -Encoding UTF8
          'RESTART_RESTORE_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-restart-restore-integration-evidence
          path: restart-restore-validation-evidence.json
          if-no-files-found: error
