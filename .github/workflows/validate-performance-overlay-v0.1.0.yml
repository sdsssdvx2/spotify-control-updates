name: Validate Performance Overlay v0.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - perf-overlay-v0.1.0
    paths:
      - 'performance/overlay/**'
      - '.github/workflows/validate-performance-overlay-v0.1.0.yml'
  pull_request:
    paths:
      - 'performance/overlay/**'
      - '.github/workflows/validate-performance-overlay-v0.1.0.yml'

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen production payload is untouched
        shell: powershell
        run: |
          git fetch origin main --no-tags
          $protected = @(
            'README.md',
            'manifest.json',
            'manifest.schema.json',
            'packages',
            'validation/v0.6.18'
          )
          $changed = @(git diff --name-only origin/main...HEAD -- $protected)
          if ($changed.Count -gt 0) {
            throw "Performance overlay branch changed frozen production paths: $($changed -join ', ')"
          }
          Write-Host "PASS: frozen production paths unchanged."

      - name: PowerShell 5.1 parser and static safety audit
        shell: powershell
        run: |
          $files = @(
            'performance/overlay/apply-overlay.ps1',
            'performance/overlay/tests/test-overlay.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser failed for $file"
            }
          }
          $apply = Get-Content 'performance/overlay/apply-overlay.ps1' -Raw
          $forbidden = @(
            'spicetify apply',
            'spicetify backup',
            'spicetify restore',
            'config-xpui.ini',
            '\\Browser\\',
            '\\Default\\',
            'CustomApps\\ivLyrics',
            'CustomApps\\tagify',
            'CustomApps\\splitify'
          )
          foreach ($needle in $forbidden) {
            if ($apply.IndexOf($needle, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Forbidden production/persistence mutation surface found: $needle"
            }
          }
          Write-Host "PASS: PowerShell parser and static mutation-scope audit."

      - name: Validate provenance policy metadata
        shell: powershell
        run: |
          $policy = Get-Content 'performance/overlay/policy.json' -Raw | ConvertFrom-Json
          if (-not $policy.principles.upstream_update_precedence) { throw 'upstream_update_precedence must stay true' }
          if (-not $policy.principles.never_block_upstream_update_for_optimization) { throw 'upstream updates must never be blocked by optimization' }
          if ($policy.principles.unknown_upstream_revision -ne 'skip-optimization') { throw 'unknown revision must skip optimization' }
          $targets = Get-Content 'performance/overlay/targets/pithaya-optional-custom-apps.json' -Raw | ConvertFrom-Json
          if ($targets.source_commit -ne '9a7da4e7c34dd3000e103a4f842e782feb5c29c9') { throw 'Unexpected Pithaya source commit' }
          $blf = @($targets.targets | Where-Object { $_.id -eq 'better-local-files' })
          $pm = @($targets.targets | Where-Object { $_.id -eq 'playlist-maker' })
          if ($blf.Count -ne 1 -or $blf[0].dist_revision -ne 'bf467fab93e6c1f8b8d4189dc1054bd1cafb3f3a') { throw 'Better Local Files provenance mismatch' }
          if ($pm.Count -ne 1 -or $pm[0].dist_revision -ne '9fd89fb40a53e4cfbf0953d34f806f4a8a36fc64') { throw 'Playlist Maker provenance mismatch' }
          if (@($targets.targets | Where-Object { $_.id -eq 'sc-cover-ambience' }).Count -ne 0) { throw 'SC Cover Ambience must not be an optimization target' }
          Write-Host "PASS: exact target provenance and exclusion policy."

      - name: JavaScript syntax check
        shell: powershell
        run: |
          node --check performance/overlay/lazy-custom-app-loader.js
          node --check performance/overlay/tests/test-loader.js

      - name: Run lazy-loader state-machine tests
        shell: powershell
        run: node performance/overlay/tests/test-loader.js

      - name: Run reversible overlay transform tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1

      - name: Verify overlay scope stays isolated
        shell: powershell
        run: |
          $changed = @(git diff --name-only origin/main...HEAD)
          $unexpected = @($changed | Where-Object {
            $_ -ne '.github/workflows/validate-performance-overlay-v0.1.0.yml' -and
            -not $_.StartsWith('performance/overlay/')
          })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected files in validation branch: $($unexpected -join ', ')"
          }
          Write-Host "PASS: validation branch changes are overlay-only."
