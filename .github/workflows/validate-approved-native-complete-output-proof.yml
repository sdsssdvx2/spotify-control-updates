name: Official four-file XPUI output DPAPI readback (HOLD)
on:
  push:
    branches: [validate/approved-native-complete-output-proof]
    paths:
      - 'validation/approved-native-complete-output-proof/**'
      - '.github/workflows/validate-approved-native-complete-output-proof.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  one-genuine-native-full-output-seal:
    runs-on: windows-2025
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Frozen parent, four additions only, PowerShell 5.1 parse
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $parent='91fa18d38ef844bee641aa299075d3edc67d3695'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             (git merge-base $parent HEAD).Trim() -cne $parent){throw 'V037_PARENT_CHANGED'}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'V037_MAIN_CHANGED'}
          $allowed=@(
           'validation/approved-native-complete-output-proof/full-native-output-proof-v037.ps1',
           'validation/approved-native-complete-output-proof/read-entire-output-fresh-process.ps1',
           'validation/approved-native-complete-output-proof/test-complete-native-output-v037.ps1',
           '.github/workflows/validate-approved-native-complete-output-proof.yml')
          $diff=@(git diff --name-only "$parent...HEAD")
          if($diff.Count -ne 4 -or @($diff|Where-Object{$_ -notin $allowed}).Count){throw 'V037_UNRELATED_CHANGE'}
          foreach($f in @($allowed|Where-Object{$_ -like '*.ps1'})){
            $t=$null;$e=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$t,[ref]$e)
            if($e.Count){throw ('V037_PS51_PARSE_ERROR '+$e[0].Message)}
          }
          Write-Host 'V037_SOURCE_PARENT_AND_WINDOWS_PS51_SYNTAX_PASS'
      - name: Build and pin original Addon Manager without reinstall
        shell: powershell
        timeout-minutes: 18
        run: |
          $ErrorActionPreference='Stop'
          python validation/custom-app-normal-entrypoint-transaction-integration/build_candidate.py
          if($LASTEXITCODE -ne 0){throw 'V037_BUILD_FAILED'}
          $p='validation/custom-app-normal-entrypoint-transaction-integration/out/bin/addon-manager.ps1'
          if((Get-Item $p).Length -ne 1453028 -or (Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0cb2362dd14772f19ba2970e5f4c2bc07bf0512c0de31494af7b01cb2a98fdd6'){throw 'V037_APP_PIN_CHANGED'}
          "V037_ADDON=$((Resolve-Path $p).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
      - name: Official free Spicetify 2.46.4 exact SHA-pinned binary
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'v037-vendor'
          [IO.Directory]::CreateDirectory($dir)|Out-Null
          $archive=Join-Path $dir 'release.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/spicetify/cli/releases/download/v2.46.4/spicetify-2.46.4-windows-x64.zip' -OutFile $archive
          if((Get-Item $archive).Length -ne 7795758 -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '0490380bf59e00c94cf6cb12bfac5152791b91bb8009aceef53c49815b45a56f'){throw 'V037_ARCHIVE_PIN_CHANGED'}
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $dir 'expanded')
          $bin=@(Get-ChildItem (Join-Path $dir 'expanded') -Recurse -File -Filter spicetify.exe)
          if($bin.Count -ne 1 -or (Get-FileHash $bin[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '3563f26acd7527adc97e6c19272fa1b48ce976a913625d9804ac57d3c54fb4db'){throw 'V037_BINARY_PIN_CHANGED'}
          "V037_OFFICIAL=$($bin[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding UTF8
      - name: One real CLI, four file output, fresh process negative evidence
        shell: powershell
        timeout-minutes: 19
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'v037-targeted.log'
          $ErrorActionPreference='Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/approved-native-complete-output-proof/test-complete-native-output-v037.ps1' -OriginalAddonPath $env:V037_ADDON -OfficialExecutable $env:V037_OFFICIAL *>&1 | Tee-Object -FilePath $log | Out-Null
          $rc=$LASTEXITCODE;$ErrorActionPreference='Stop'
          if($rc -ne 0){Get-Content $log -Tail 75|ForEach-Object{Write-Host $_};throw ('V037_TEST_FAILED '+$rc)}
          $text=Get-Content $log -Raw
          foreach($m in @(
            'V037_REAL_OFFICIAL_CLI_ALL_FOUR_OWNED_OUTPUTS_BOUND_AND_SEALED_PASS',
            'V037_KEYLESS_INDEPENDENT_CSS_EXTENSION_FOREIGN_TAMPER_REJECTED_PASS',
            'V037_SEALED_DPAPI_TAMPER_REFUSED_V010_HEAD_UNCHANGED_PASS',
            'V037_NO_REAL_SPOTIFY_NO_CLEANUP_NO_TERMINAL_COMMIT_AUTHORITY_PASS')){
            if(-not$text.Contains($m)){throw ('V037_MISSING_PROOF '+$m)}
          }
          Write-Host 'V037_FULL_OFFICIAL_OUTPUT_READBACK_TARGETED_PASS'
      - name: No operating main, real Spotify, version or cleanup mutation
        shell: powershell
        run: |
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'V037_MAIN_DRIFT'}
          Write-Host 'V037_NO_REAL_SPOTIFY_OR_RELEASE_MUTATION_PASS'
