name: HOLD R21 inspect real exact resident VBS CWD and installed launcher path
on:
  push:
    branches: [validate/spotify-exit-immediate-maintenance-HOLD]
    paths: [.github/workflows/inspect-exact-vbs-resident-cwd-R21-HOLD.yml]
permissions: {contents: read}
jobs:
  analyze:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect source-pinned VBS and exact v0.6.20 startup contract without executing it
        shell: pwsh
        run: |
          @'
          import hashlib,runpy,re
          from pathlib import Path
          root=Path.cwd()
          a=runpy.run_path(str(root/'validation/normal-engine-shared-turnstile/audit-pinned-stable-entrypoints-v059.py'))
          vb=a['extract_verified_agent']()
          assert len(vb)==4855 and hashlib.sha256(vb).hexdigest()=='2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278'
          print('R21_VBS_EXACT_BYTES_SHA_PASS')
          for line_no,line in enumerate(vb.decode('utf-8-sig').splitlines(),1):
              if True:
                  safe=line.replace('\t',' ').strip()
                  print(f'R21_VBS_{line_no}={safe[:450]}')
          # The exact old v0.6.20 source is reproducible from pinned existing chunks.
          # Build in runner only, check exact hash, and print ONLY source lines around
          # resident creation, scheduled task, startup, or working directory.
          builder=runpy.run_path(str(root/'validation/v0.6.20/build_v0620.py'))
          builder['build']()
          p=root/'validation/v0.6.20/out/bin/spotify-control.ps1'
          raw=p.read_bytes()
          assert len(raw)==281585 and hashlib.sha256(raw).hexdigest()=='e9f0181756cfb84c505c30f54b6067e321f6d178d3a1936489714b8f4441ba18'
          print('R21_MAIN_EXACT_BYTES_SHA_PASS')
          lines=raw.decode('utf-8-sig').splitlines()
          interesting=[i for i,x in enumerate(lines) if re.search(
            r'(?i)(agent\.vbs|scheduledtaskaction|Register-ScheduledTask|Start-ScheduledTask|Stop-ScheduledTask|WorkingDirectory|CurrentDirectory|wscript\.exe|cscript\.exe|Launch-Agent)',x)]
          print('R21_MAIN_RELEVANT_LINE_COUNT='+str(len(interesting)))
          for idx in range(3560,3612):
              print(f'R21_MAIN_SHORTCUT_CONTEXT_{idx+1}={lines[idx].strip()[:450]}')
          for i in sorted(set(j for v in interesting for j in range(max(0,v-2),min(len(lines),v+3)))):
              text=lines[i].strip()
              if len(text)>500:text=text[:500]+'<TRUNCATED>'
              print(f'R21_MAIN_{i+1}={text}')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'R21_PINNED_SOURCE_AUDIT_FAILED'}

      - name: Reproduce true Windows directory rename failure caused by original pinned resident VBS CWD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scratch=Join-Path $env:RUNNER_TEMP 'spotify-r21-real-vbs-cwd'
          if(Test-Path -LiteralPath $scratch){throw 'R21_SCRATCH_PREEXISTING'}
          $bin=Join-Path $scratch 'bin'
          [void][IO.Directory]::CreateDirectory($bin)
          @'
          import hashlib,runpy,sys
          from pathlib import Path
          root=Path.cwd()
          dest=Path(sys.argv[1])
          agent=runpy.run_path(str(root/'validation/normal-engine-shared-turnstile/audit-pinned-stable-entrypoints-v059.py'))['extract_verified_agent']()
          assert (len(agent),hashlib.sha256(agent).hexdigest())==(4855,'2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278')
          (dest/'bin'/'spotify-control-agent.vbs').write_bytes(agent)
          (dest/'bin'/'spotify-control.ps1').write_bytes(b'# hosted fake: never execute')
          '@ | python - $scratch
          if($LASTEXITCODE -ne 0){throw 'R21_REAL_AGENT_EXTRACTION_FAILED'}
          $zip=Join-Path $scratch 'microsoft-Handle.zip'
          (New-Object Net.WebClient).DownloadFile('https://download.sysinternals.com/files/Handle.zip',$zip)
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '279aaf8eccb6f79147f4dcc6ba091fb895c4cb8b199a0dd186a4c76bc519d2cd'){
            throw 'R21_MICROSOFT_HANDLE_ZIP_MISMATCH'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $tools=Join-Path $scratch 'tools'
          [IO.Compression.ZipFile]::ExtractToDirectory($zip,$tools)
          $exe=Join-Path $tools 'handle64.exe'
          if((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             '24bafcc570cc9bbb6b6e6652a57a519e0464e3996891aaba6f55299cce20b04f' -or
             [string](Get-AuthenticodeSignature $exe).Status -cne 'Valid'){
            throw 'R21_MICROSOFT_HANDLE_EXE_UNTRUSTED'
          }
          $wscript=Join-Path $env:WINDIR 'System32/wscript.exe'
          $agent=Join-Path $bin 'spotify-control-agent.vbs'
          $old=$null;$neutral=$null
          try{
            $old=Start-Process -FilePath $wscript -WorkingDirectory $bin -ArgumentList ('//B //NoLogo "'+$agent+'"') -PassThru
            Start-Sleep -Seconds 2
            if($old.HasExited){throw 'R21_PINNED_AGENT_OLD_CWD_EXITED'}
            $lines=@(& $exe -nobanner -accepteula -v $bin 2>&1)
            $matching=@($lines | Where-Object { [string]$_ -match ('(?i)^wscript\.exe,'+$old.Id+',File,[^,]+,') -and [string]$_ -like ('*'+$bin+'*') })
            if($matching.Count -ne 1){throw ('R21_VBS_BIN_LOCK_NOT_REPRODUCED count='+$matching.Count)}
            Write-Host 'R21_EXACT_RESIDENT_VBS_WORKING_DIRECTORY_BIN_HOLD_REPRODUCED_PASS'
            $moved=$false
            try { [IO.Directory]::Move($bin,(Join-Path $scratch 'bin-moved'));$moved=$true }
            catch [IO.IOException]{}
            catch [System.UnauthorizedAccessException]{}
            if($moved){[IO.Directory]::Move((Join-Path $scratch 'bin-moved'),$bin);throw 'R21_EXPECTED_OLD_AGENT_CWD_SWAP_BLOCK_NOT_REPRODUCED'}
            Write-Host 'R21_ORIGINAL_BOOTSTRAP_DIRECTORY_RENAME_BLOCKED_BY_RESIDENT_PASS'
            Stop-Process -Id $old.Id -Force -ErrorAction Stop
            $old.WaitForExit(5000)|Out-Null
            $neutral=Start-Process -FilePath $wscript -WorkingDirectory $scratch -ArgumentList ('//B //NoLogo "'+$agent+'"') -PassThru
            Start-Sleep -Seconds 2
            if($neutral.HasExited){throw 'R21_PINNED_AGENT_NEUTRAL_CWD_EXITED'}
            $newLines=@(& $exe -nobanner -accepteula -v $bin 2>&1)
            $neutralExact=@($newLines | Where-Object { [string]$_ -match ('(?i)^wscript\.exe,'+$neutral.Id+',File,[^,]+,') -and [string]$_ -like ('*'+$bin+'*')})
            if($neutralExact.Count -ne 0){throw 'R21_NEUTRAL_AGENT_STILL_HOLDS_BIN'}
            [IO.Directory]::Move($bin,(Join-Path $scratch 'bin-moved'))
            [IO.Directory]::Move((Join-Path $scratch 'bin-moved'),$bin)
            if($neutral.HasExited){throw 'R21_NEUTRAL_AGENT_EXITED_AFTER_RENAME'}
            Write-Host 'R21_EXACT_PINNED_VBS_NEUTRAL_CWD_RELEASES_BIN_AND_RENAME_PASS'
          }finally{
            if($null -ne $neutral -and -not $neutral.HasExited){Stop-Process -Id $neutral.Id -Force -ErrorAction SilentlyContinue}
            if($null -ne $old -and -not $old.HasExited){Stop-Process -Id $old.Id -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'R21_ONLY_HOSTED_DISPOSABLE_PROCESS_AND_FILES_USED_PASS'
          # Handle returns 1 for the expected negative (no handle owner) probe.
          # Do not let that informational exit code fail an otherwise proven job.
          $global:LASTEXITCODE=0
