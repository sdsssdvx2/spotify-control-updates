name: Validate Spotify Control v0.6.19 Release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/v0.6.19/**'
      - 'validation/v0.6.19/**'
      - '.github/workflows/validate-v0.6.19-release.yml'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/v0.6.19/**'
      - 'validation/v0.6.19/**'
      - '.github/workflows/validate-v0.6.19-release.yml'
      - '.github/workflows/validate-v0.6.15-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove release base and allowed scope
        shell: powershell
        run: |
          $frozen='635358a620a9d28d99a52571085558906af967b6'
          $released='95c1205944ef24836f03be1db87117ccbc0f4593'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base='${{ github.event.pull_request.base.sha }}'
            if($base -ne $frozen -and $base -ne $released) { throw "v0.6.19 validation PR base is not an accepted release base: $base" }
          }
          git cat-file -e "$frozen^{commit}"
          git cat-file -e "$released^{commit}"
          $changed=@(git diff --name-only "$frozen...HEAD")
          $unexpected=@($changed | Where-Object {
            $_ -notlike 'performance/overlay/*' -and
            $_ -notlike 'validation/v0.6.19/*' -and
            $_ -notlike 'packages/v0.6.19/*' -and
            $_ -ne 'manifest.json' -and
            $_ -ne '.github/workflows/validate-v0.6.19-release.yml' -and
            $_ -ne '.github/workflows/validate-v0.6.15-r5.yml'
          })
          if($unexpected.Count -gt 0) { throw "Unexpected v0.6.19 release files: $($unexpected -join ', ')" }
          $trackedRaw=@(git ls-files 'validation/v0.6.19/out/**')
          if($trackedRaw.Count -gt 0) { throw "Raw generated candidates must not be committed: $($trackedRaw -join ', ')" }
          Write-Host 'V0619_RELEASE_SCOPE_PASS'

      - name: Validate published manifest and immutable transports
        shell: powershell
        run: python validation/v0.6.19/build_v0619.py --validate-published

      - name: Rebuild exact candidates deterministically
        shell: powershell
        run: |
          python validation/v0.6.19/build_v0619.py --build
          if($LASTEXITCODE -ne 0) { throw 'Deterministic v0.6.19 build failed.' }
          git diff --exit-code -- packages/v0.6.19 validation/v0.6.19/candidate-metadata.json
          if($LASTEXITCODE -ne 0) { throw 'Committed v0.6.19 transport differs from deterministic rebuild.' }

      - name: Verify manifest identities and frozen contracts
        shell: powershell
        run: |
          $m=Get-Content manifest.json -Raw | ConvertFrom-Json
          if($m.latest_version -ne '0.6.19') { throw "Unexpected latest_version: $($m.latest_version)" }
          if($m.min_bootstrap_version -ne '1.0.6') { throw 'min_bootstrap_version changed.' }
          if($m.bootstrap.version -ne '1.0.6' -or $m.bootstrap.sha256 -ne 'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6' -or [int64]$m.bootstrap.size -ne 42963) { throw 'Bootstrap 1.0.6 contract changed.' }
          if($m.payload_set_sha256 -ne '6872b835ecab3fc17268781d19d6934aa9471a25b5a1fed780e2cd7467347353') { throw 'Unexpected v0.6.19 payload set.' }
          if(([string]$m.source_commit) -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source_commit.' }
          git cat-file -e "$($m.source_commit)^{commit}"
          $main=@($m.latest_files | Where-Object path -eq 'bin/spotify-control.ps1')
          $addon=@($m.latest_files | Where-Object path -eq 'bin/addon-manager.ps1')
          $agent=@($m.latest_files | Where-Object path -eq 'bin/spotify-control-agent.vbs')
          if($main.Count -ne 1 -or [int64]$main[0].size -ne 281580 -or $main[0].sha256 -ne '45795b9622953a10c6eca2ee2f5a19fc4467c5143d5bdf7a9f2ad64841b9416f') { throw 'Main candidate identity mismatch.' }
          if($addon.Count -ne 1 -or [int64]$addon[0].size -ne 202849 -or $addon[0].sha256 -ne 'df17018bdb5f62f55624070d047933387f62c049dae73cf5cefcc541bc412afa') { throw 'Addon Manager r8 identity mismatch.' }
          if($agent.Count -ne 1 -or [int64]$agent[0].size -ne 4855 -or $agent[0].sha256 -ne '2a4f6f02103ef9d4594e9fe4ac23fd4d94d4553902d6ddaf5fc3e10bebd56278') { throw 'Resident agent changed.' }
          $edge=@($m.updates | Where-Object { $_.from_version -eq '0.6.18' -and $_.to_version -eq '0.6.19' })
          if($edge.Count -ne 1 -or @($edge[0].patches).Count -ne 2) { throw 'Exact v0.6.18 -> v0.6.19 update edge missing or ambiguous.' }
          Write-Host "V0619_MANIFEST_IDENTITY_PASS source_commit=$($m.source_commit)"

      - name: PowerShell 5.1 parser and candidate identity checks
        shell: powershell
        run: |
          $files=@(
            'validation/v0.6.19/out/bin/spotify-control.ps1',
            'validation/v0.6.19/out/bin/addon-manager.ps1',
            'performance/overlay/apply-overlay.ps1',
            'performance/overlay/collect-active-provenance.ps1',
            'validation/v0.6.19/test_production_overlay_wrapper.ps1'
          )
          foreach($file in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "PowerShell parser failed: $file" }
          }
          $main=Get-Content 'validation/v0.6.19/out/bin/spotify-control.ps1'
          if($main[0] -ne '# Spotify Control v0.6.19 Performance Overlay') { throw 'v0.6.19 title line mismatch.' }
          if(@($main | Where-Object { $_ -eq '$ScriptVersion = "0.6.19"' }).Count -ne 1) { throw 'v0.6.19 ScriptVersion mismatch.' }
          $addon=Get-Content 'validation/v0.6.19/out/bin/addon-manager.ps1' -Raw
          if($addon.IndexOf('$Version = "0.6.5-r8"',[StringComparison]::Ordinal) -lt 0) { throw 'Addon Manager r8 version marker missing.' }
          if(([regex]::Matches($addon,'Invoke-PerformanceOverlayBestEffort -Reason')).Count -ne 3) { throw 'Expected exactly three production overlay hook calls.' }
          $checkStart=$addon.IndexOf('"Check" {',[StringComparison]::Ordinal)
          $updateStart=$addon.IndexOf('"Update" {',[StringComparison]::Ordinal)
          if($checkStart -lt 0 -or $updateStart -le $checkStart -or $addon.Substring($checkStart,$updateStart-$checkStart).Contains('Invoke-PerformanceOverlayBestEffort')) { throw 'Check action must remain mutation-free.' }
          Write-Host 'V0619_POWERSHELL51_AND_IDENTITY_PASS'

      - name: Candidate Addon Manager read-only SelfTest
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify') | Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/v0.6.19/out/bin/addon-manager.ps1' -Action SelfTest
          if($LASTEXITCODE -ne 0) { throw "Candidate Addon Manager SelfTest failed: $LASTEXITCODE" }

      - name: Standalone overlay regression tests
        shell: powershell
        run: |
          node --check performance/overlay/lazy-custom-app-loader.js
          node performance/overlay/tests/test-loader.js
          if($LASTEXITCODE -ne 0) { throw 'Overlay loader tests failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/overlay/tests/test-overlay.ps1
          if($LASTEXITCODE -ne 0) { throw 'Overlay PowerShell regression tests failed.' }

      - name: Download and pin immutable active-extension fixtures
        shell: powershell
        run: |
          $blf=Join-Path $env:RUNNER_TEMP 'better-local-files-extension.js'
          $pm=Join-Path $env:RUNNER_TEMP 'playlist-maker-extension.js'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/Pithaya/spicetify-apps-dist/bf467fab93e6c1f8b8d4189dc1054bd1cafb3f3a/extension.js' -OutFile $blf
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/Pithaya/spicetify-apps-dist/9fd89fb40a53e4cfbf0953d34f806f4a8a36fc64/extension.js' -OutFile $pm
          if((Get-Item $blf).Length -ne 23643 -or (Get-FileHash $blf -Algorithm SHA256).Hash.ToLowerInvariant() -ne '56512ad3d2e01281f388f9a0ae53909340e1221f6ec0f96941eeb992c4a5fbbe') { throw 'Better Local Files immutable fixture mismatch.' }
          if((Get-Item $pm).Length -ne 97410 -or (Get-FileHash $pm -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ed57ddc470e65b5b01084cad221354f288053afe710773fa105327c747d1c0e8') { throw 'Playlist Maker immutable fixture mismatch.' }
          "BLF_FIXTURE=$blf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PM_FIXTURE=$pm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'V0619_IMMUTABLE_EXTENSION_FIXTURES_PASS'

      - name: Production wrapper synthetic integration test
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File validation/v0.6.19/test_production_overlay_wrapper.ps1 -CandidateAddon validation/v0.6.19/out/bin/addon-manager.ps1 -BetterLocalFilesExtension $env:BLF_FIXTURE -PlaylistMakerExtension $env:PM_FIXTURE
          if($LASTEXITCODE -ne 0) { throw "Production wrapper integration test failed: $LASTEXITCODE" }

      - name: Final safety invariants
        shell: powershell
        run: |
          $wrapper=Get-Content validation/v0.6.19/performance_overlay_wrapper.ps1.inc -Raw
          foreach($needle in @('spicetify apply','spicetify backup','spicetify restore','config-xpui.ini','\Browser\','\Default\','ivLyrics','tagify','splitify')) {
            if($wrapper.IndexOf($needle,[StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Forbidden wrapper mutation surface: $needle" }
          }
          $policy=Get-Content performance/overlay/policy.json -Raw | ConvertFrom-Json
          if(-not $policy.principles.upstream_update_precedence -or -not $policy.principles.never_block_upstream_update_for_optimization -or $policy.principles.unknown_upstream_revision -ne 'skip-optimization') { throw 'Fail-open upstream policy changed.' }
          $targets=Get-Content performance/overlay/targets/pithaya-optional-custom-apps.json -Raw | ConvertFrom-Json
          if(@($targets.targets | Where-Object id -eq 'sc-cover-ambience').Count -ne 0) { throw 'SC Cover Ambience must remain outside optimization targets.' }
          Write-Host 'V0619_FINAL_SAFETY_INVARIANTS_PASS'
