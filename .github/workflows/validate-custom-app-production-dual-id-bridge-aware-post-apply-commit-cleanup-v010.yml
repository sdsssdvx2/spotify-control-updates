name: Validate Custom App Production Dual-ID Bridge-Aware Post-Apply Commit Cleanup v0.1.0

on:
  push:
    branches: [validate/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v010.yml'
  pull_request:
    branches: [validate/custom-app-production-dual-id-bridge-aware-spicetify-apply-executor-v0.1.0]
    paths:
      - 'validation/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0/**'
      - '.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v010.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage PS5.1 AST barriers zero-authority and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='18195b8f6745c2d2342773dcbdfd8d041d4931e5';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact dual-ID apply executor head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $d='validation/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0'
          $core="$d/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup.ps1";$nowCompat="$d/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-now-compat-v0.1.1.ps1";$test="$d/test_custom_app_production_dual_id_bridge_aware_post_apply_commit_cleanup.ps1";$prep="$d/prepare_custom_app_production_dual_id_bridge_aware_post_apply_commit_cleanup.ps1";$wf='.github/workflows/validate-custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v010.yml'
          $allowed=@($core,$nowCompat,$test,$prep,$wf);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p -notin $changed){throw "missing changed surface $p"}}
          $pins=@(@($core,'14650affeb55fe0c3010dbc2454e4683eb846fa8'),@($nowCompat,'338766293b80d0cb5ccbb597b279fc2a6e6aa444'),@($test,'a9d1bf85b461c06b644fa34c5dd84fec9c3fa1a6'),@($prep,'cdbd6ae4335140f3b3d970b12fe4b460d4684669'));foreach($p in $pins){$actual=(git hash-object $p[0]).Trim();if($actual-cne$p[1]){throw "validation blob drift $($p[0]) $actual != $($p[1])"}}
          foreach($p in @($core,$nowCompat,$test,$prep)){$tokens=$null;$errors=$null;$ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error ("$p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $p"};$badCommands=@($ast.FindAll({param($node)if($node-isnot[Management.Automation.Language.CommandAst]){return $false};$name=$node.GetCommandName();return(-not[string]::IsNullOrWhiteSpace($name)-and$name-match'^(?i:return|throw).+')},$true));if($badCommands.Count){$badCommands|ForEach-Object{Write-Error ("ambiguous keyword command in $p line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)>")};throw "PS5.1 keyword lexical boundary failed $p"}}
          $raw=Get-Content $core -Raw;foreach($m in @('permit_transaction_id','journal_transaction_id','apply-verified','cleanup-starting','committed-clean','CleanupResultFingerprint','Test-CustomAppProductionPostApplyStageCleanupArtifactV010','Test-CustomAppProductionPostApplyAppBackupCleanupArtifactV010','Test-CustomAppProductionPostApplyPersistenceCleanupArtifactV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010','already-absent','requires_idempotent_cleanup_resume','recovery_evidence_retained','requires_new_permit_for_future_update','result_is_authority=$false','production_mutation_authorized=$false')){if($raw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "core marker missing $m"}}
          $nowRaw=Get-Content $nowCompat -Raw;foreach($m in @('CustomAppProductionDualIdBridgeAwarePostApplyCommitCleanupOriginalCurrentStateV010','[DateTimeOffset]$Now=[DateTimeOffset]::UtcNow','if([string]$key-cne''Now'')','@forward')){if($nowRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "explicit Now compatibility marker missing $m"}}
          foreach($badToken in @('Invoke-WebRequest','Invoke-RestMethod','Start-Process','New-Object Diagnostics.Process','Diagnostics.ProcessStartInfo','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){foreach($p in @($core,$nowCompat)){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "forbidden cleanup layer surface $badToken in $p"}}}
          foreach($p in @($core,$nowCompat)){if((Get-Content $p -Raw)-match'result_is_authority\s*=\s*\$true|apply_execution_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|additional_mutation_authorized\s*=\s*\$true|production_execution_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw "authority escaped in $p"}}
          $testRaw=Get-Content $test -Raw;foreach($m in @('after-cleanup-starting-barrier','after-stage-cleanup','after-app-backup-cleanup','after-persistence-backup-cleanup','permit-id-drift','journal-id-drift','apply-evidence-drift','already-absent','explicit_now_contract=true','-Now $Now','cases=$count')){if($testRaw.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "cleanup test marker missing $m"}}
          foreach($badToken in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','CreateShortcut','TargetPath','WorkingDirectory =')){foreach($p in @($core,$nowCompat,$test,$prep)){if(([IO.File]::ReadAllText((Resolve-Path $p))).IndexOf($badToken,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "managed/domainvpn boundary escaped in $p via $badToken"}}}
          $prepRaw=Get-Content $prep -Raw;foreach($m in @('prepare_custom_app_production_dual_id_bridge_aware_spicetify_apply_executor.ps1','67458cbb96b5d1ed92e26c2b81debd6894044749','3b14280d727287252f71611e4424d78e5705c2f1')){if($prepRaw.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "preparer exact dependency marker missing $m"}}
          'DUAL_ID_BRIDGE_AWARE_POST_APPLY_COMMIT_CLEANUP_SCOPE_AST_AUTHORITY_PASS'

      - name: Materialize exact qualified dependency chain
        shell: powershell
        timeout-minutes: 60
        run: |
          $prep='validation/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0/prepare_custom_app_production_dual_id_bridge_aware_post_apply_commit_cleanup.ps1';& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $prep -RepoRoot $PWD.Path -RunnerTemp $env:RUNNER_TEMP;if($LASTEXITCODE){throw 'dependency preparation failed'}
          $generic='validation/custom-app-production-post-apply-commit-cleanup-v0.1.0/custom-app-production-post-apply-commit-cleanup.ps1';if((git hash-object $generic).Trim()-cne'3b14280d727287252f71611e4424d78e5705c2f1'){throw 'generic cleanup materialization drift'}
          'DUAL_ID_BRIDGE_AWARE_POST_APPLY_COMMIT_CLEANUP_DEPENDENCY_CHAIN_PASS'

      - name: Run byte-real apply plus cleanup crash-resume matrix twice with explicit Now
        shell: powershell
        timeout-minutes: 320
        run: |
          $outer=$env:RUNNER_TEMP;$test='validation/custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v0.1.0/test_custom_app_production_dual_id_bridge_aware_post_apply_commit_cleanup.ps1'
          1..2|ForEach-Object{$pass=[int]$_;$runtime=Join-Path $outer ('dbac-v010-pass-'+$pass+'-'+[Guid]::NewGuid().ToString('N'));New-Item -ItemType Directory -Force -Path $runtime|Out-Null;$exit=0;try{$env:RUNNER_TEMP=$runtime;$env:TEMP=$runtime;$env:TMP=$runtime;Write-Host "DBAC_V010_ISOLATED_ROOT pass=$pass root=$runtime";& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test;$exit=$LASTEXITCODE}finally{$env:RUNNER_TEMP=$outer;$env:TEMP=$outer;$env:TMP=$outer};if($exit){throw "dual-ID cleanup matrix failed pass $pass"}}
          'DUAL_ID_BRIDGE_AWARE_POST_APPLY_COMMIT_CLEANUP_MATRIX_REPEAT_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager candidate drift'};if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'};if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'dbac-v010-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DUAL_ID_BRIDGE_AWARE_POST_APPLY_COMMIT_CLEANUP_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected surfaces main freeze and write evidence
        shell: powershell
        run: |
          $base='18195b8f6745c2d2342773dcbdfd8d041d4931e5';if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          foreach($p in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs')){git diff --quiet $base HEAD -- $p;if($LASTEXITCODE){throw "protected managed payload changed $p"}}
          $changed=@(git diff --name-only "$base...HEAD");foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher/domainvpn boundary escaped: $p"}}
          $out=Join-Path $env:RUNNER_TEMP 'dbac-v010-evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          [pscustomobject]@{schema=1;managed_by='custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-validation-v1';head=(git rev-parse HEAD).Trim();base=$base;production_main='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2';core_blob='14650affeb55fe0c3010dbc2454e4683eb846fa8';now_compat_blob='338766293b80d0cb5ccbb597b279fc2a6e6aa444';test_blob='a9d1bf85b461c06b644fa34c5dd84fec9c3fa1a6';preparer_blob='cdbd6ae4335140f3b3d970b12fe4b460d4684669';apply_head='18195b8f6745c2d2342773dcbdfd8d041d4931e5';generic_cleanup_head='67458cbb96b5d1ed92e26c2b81debd6894044749';journal_head='7e26187e2360089024e9d72d0701be6f1577a1ef';cleanup_starting_before_delete=$true;partial_cleanup_idempotent_resume=$true;committed_clean_after_postcheck=$true;explicit_now_contract=$true;permit_id_forward_only=$true;journal_id_recovery_only=$true;recovery_evidence_retained=$true;spicetify_apply_in_cleanup=$false;cleanup_matrix_cases=8;matrix_repetitions=2;hard_disabled_candidate_unchanged=$true;managed_payload_changed=$false;launcher_or_shortcut_changed=$false;domainvpn_wrapper_changed=$false;production_main_changed=$false;production_mutation_authority=$false;validated_at=[DateTimeOffset]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out 'dual-id-bridge-aware-post-apply-commit-cleanup-validation.json') -Encoding UTF8
          'DUAL_ID_BRIDGE_AWARE_POST_APPLY_COMMIT_CLEANUP_PROTECTED_SURFACES_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-dual-id-bridge-aware-post-apply-commit-cleanup-v010-${{ github.run_id }}
          path: ${{ runner.temp }}/dbac-v010-evidence/dual-id-bridge-aware-post-apply-commit-cleanup-validation.json
          if-no-files-found: error
          retention-days: 14
