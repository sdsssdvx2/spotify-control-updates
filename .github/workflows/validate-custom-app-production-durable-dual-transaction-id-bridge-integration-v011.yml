name: Validate Custom App Production Durable Dual Transaction ID Bridge Integration v0.1.1

on:
  push:
    branches: [validate/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1]
    paths:
      - 'validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/**'
      - '.github/workflows/validate-custom-app-production-durable-dual-transaction-id-bridge-integration-v011.yml'
  pull_request:
    branches: [validate/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0]
    paths:
      - 'validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/**'
      - '.github/workflows/validate-custom-app-production-durable-dual-transaction-id-bridge-integration-v011.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact parent scope pins frozen production and launcher boundary
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($head-cne$expected){throw "head mismatch $head != $expected"}
          $base='408e24ce7f66d1f5f23025a196b19cd8a42fcda7';if((git merge-base $base HEAD).Trim()-cne$base){throw 'not descended from exact v0.1.0 integration head'}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $runner='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/run_helper_only_integration.ps1'
          $workflow='.github/workflows/validate-custom-app-production-durable-dual-transaction-id-bridge-integration-v011.yml'
          $allowed=@($runner,$workflow);$changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad -join ', ')"};foreach($p in $allowed){if($p-notin$changed){throw "missing changed surface $p"}}
          $pins=@(
            @($runner,'064255cdb04304d5e6eb2d2947eaba3580b5cfc3'),
            @('validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/custom-app-production-durable-dual-transaction-id-bridge-integration.ps1','c9a58a181d3c5f5a230fa895785c3a42a928c8cd'),
            @('validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/test_custom_app_production_durable_dual_transaction_id_bridge_integration.ps1','445c73bdd27f376a1d280b56070998bfdb203516'),
            @('validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/test_custom_app_production_dual_transaction_id_bridge_regression_v011.ps1','722cafc907fa4bca5568646c0995b9dc78f31279'),
            @('validation/custom-app-production-dual-transaction-id-bridge-v0.1.0/custom-app-production-dual-transaction-id-bridge.ps1','ce018db8c13d569036ca378bbe3b4a2a84ab3bcd'),
            @('validation/custom-app-production-recovery-aware-permit-pre-apply-preparation-v0.1.0/custom-app-production-recovery-aware-permit-pre-apply-preparation.ps1','eaad8a5f161f831bbbada1c1c0957a3dfc80edaa'),
            @('validation/custom-app-production-recovery-aware-permit-pre-apply-preparation-v0.1.0/test_custom_app_production_recovery_aware_permit_pre_apply_preparation.ps1','62fee2fc47c900ccf2eaec96bdb920727f3c5690'),
            @('validation/custom-app-production-evidence-bound-journal-atomic-v0.1.0/custom-app-production-evidence-bound-journal-atomic.ps1','55ca1e3c8d56b2e86a98d8b47e8ac1cc4ccbb6d0'),
            @('validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63'),
            @('validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','5fec613c460619da5dbfe88fca5c7334e9e93f76')
          );foreach($q in $pins){$actual=(git hash-object $q[0]).Trim();if($LASTEXITCODE-or$actual-cne$q[1]){throw "pin drift $($q[0]) $actual != $($q[1])"}}
          $tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $runner),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|ForEach-Object{Write-Error $_};throw 'runner PS5.1 parse failed'}
          $r=Get-Content $runner -Raw;foreach($m in @('SC_VALIDATION_HELPER_ONLY','FunctionDefinitionAst','Convert-DDIBRunnerRecoveryHelperToIsolatedModuleV011','recovery_aware_helper_resolution=','CUSTOM_APP_PRODUCTION_DUAL_TRANSACTION_ID_BRIDGE_REGRESSION_V011_PASS','CUSTOM_APP_PRODUCTION_DURABLE_DUAL_TRANSACTION_ID_BRIDGE_INTEGRATION_PASS','parent_matrix_reexecution=$false','launcher_or_shortcut_changed=$false')){if($r.IndexOf($m,[StringComparison]::Ordinal)-lt0){throw "runner marker missing $m"}}
          foreach($forbidden in @('launch-managed.vbs','Spotify-Managed-DomainVPN.vbs','WScript.Shell','CreateShortcut','TargetPath','Arguments =','WorkingDirectory =')){if($r.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "runner touches launcher/shortcut surface: $forbidden"}}
          if($r-match'production_mutation_authorized\s*=\s*\$true|execution_authorized\s*=\s*\$true|finalization_authorized\s*=\s*\$true|spicetify_apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true'){throw 'runner authority escape marker'}
          'DURABLE_DUAL_TRANSACTION_ID_BRIDGE_V011_SCOPE_PINS_LAUNCHER_BOUNDARY_PASS'

      - name: Run helper-only durable dual-id crash-restart integration
        shell: powershell
        timeout-minutes: 90
        run: |
          $head=(git rev-parse HEAD).Trim();$runner='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/run_helper_only_integration.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -ExpectedHead $head
          if($LASTEXITCODE){throw 'helper-only durable dual-id integration failed'}
          $ev='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/ci-runtime-evidence.json';if(-not(Test-Path -LiteralPath $ev)){throw 'runtime evidence missing'}
          $j=Get-Content $ev -Raw|ConvertFrom-Json;if([int]$j.canonical_bridge_regression_cases-ne16-or[int]$j.byte_real_integration_cases-ne8-or[bool]$j.parent_matrix_reexecution-or-not[bool]$j.separate_process_recovery-or[bool]$j.production_code_changed-or[bool]$j.launcher_or_shortcut_changed-or[string]$j.parent_harness_isolation-cne'recovery-helper-module-scope'-or[string]$j.recovery_aware_helper_resolution-cne'original-global-order-preserved'){throw 'runtime evidence invalid'}
          'DURABLE_DUAL_TRANSACTION_ID_BRIDGE_V011_RUNTIME_PASS'

      - name: Rebuild exact hard-disabled candidate and run Addon Manager SelfTest
        shell: powershell
        timeout-minutes: 45
        run: |
          $d='validation/custom-app-production-recovery-readiness-hard-disabled-integration-v0.1.0';python "$d/build_candidate.py";if($LASTEXITCODE){throw 'candidate rebuild failed'}
          $a="$d/out/bin/addon-manager.ps1";$m="$d/out/bin/spotify-control.ps1";$r="$d/candidate-validation.json";$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();$rh=(Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $a).Length-ne1382213-or$ah-cne'c2e5ffd4fe9b14b5c31dd53e7d093bd9b5db2a4ad49fa19449d299e3c14fac2f'){throw 'Addon Manager hard-disabled candidate drift'}
          if((Get-Item $m).Length-ne284327-or$mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'Spotify Control candidate drift'}
          if($rh-cne'e51d342014aa68d381045ce5404bc049405d71f00b1a45c70b6dc54287153255'){throw 'candidate report drift'}
          $s=Join-Path $env:RUNNER_TEMP 'ddib-v011-selftest';$env:LOCALAPPDATA=Join-Path $s Local;$env:APPDATA=Join-Path $s Roaming;New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA Spotify)|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'Addon Manager SelfTest failed'}
          'DURABLE_DUAL_TRANSACTION_ID_BRIDGE_V011_HARD_DISABLED_SELFTEST_PASS'

      - name: Prove protected managed and launcher surfaces immutable and write evidence
        shell: powershell
        run: |
          $base='408e24ce7f66d1f5f23025a196b19cd8a42fcda7';$runner='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/run_helper_only_integration.ps1';$workflow='.github/workflows/validate-custom-app-production-durable-dual-transaction-id-bridge-integration-v011.yml';$expected=@($runner,$workflow)
          $changed=@(git diff --name-only "$base...HEAD");$bad=@($changed|Where-Object{$_-notin$expected});if($bad.Count){throw "unexpected changed surface $($bad -join ', ')"}
          foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','bin/spotify-control.ps1','bin/addon-manager.ps1','bin/spotify-control-agent.vbs','validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/custom-app-production-durable-dual-transaction-id-bridge-integration.ps1','validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/test_custom_app_production_durable_dual_transaction_id_bridge_integration.ps1')){git diff --quiet $base HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          foreach($p in $changed){if($p-match'(?i)(\.lnk$|launch-managed\.vbs|domainvpn|launchers[/\\])'){throw "launcher boundary escaped: $p"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $runtime='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/ci-runtime-evidence.json';if(-not(Test-Path -LiteralPath $runtime)){throw 'runtime evidence missing before final evidence'};$re=Get-Content $runtime -Raw|ConvertFrom-Json
          $d='validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1';[ordered]@{schema=3;head=(git rev-parse HEAD).Trim();base=$base;source_v010_head=$base;runner_blob='064255cdb04304d5e6eb2d2947eaba3580b5cfc3';canonical_bridge_regression_cases=[int]$re.canonical_bridge_regression_cases;byte_real_integration_cases=[int]$re.byte_real_integration_cases;helper_only_parent_harnesses=[int]$re.helper_only_parent_harnesses;parent_harness_isolation=[string]$re.parent_harness_isolation;recovery_aware_helper_resolution=[string]$re.recovery_aware_helper_resolution;parent_matrix_reexecution=[bool]$re.parent_matrix_reexecution;separate_process_recovery=[bool]$re.separate_process_recovery;inherited_core_changed=$false;managed_payload_changed=$false;launcher_or_shortcut_changed=$false;domainvpn_wrapper_changed=$false;hard_disabled_candidate_unchanged=$true;production_main_changed=$false;production_mutation_authority=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'DURABLE_DUAL_TRANSACTION_ID_BRIDGE_V011_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-durable-dual-transaction-id-bridge-integration-v011-${{ github.run_id }}
          path: |
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/run_helper_only_integration.ps1
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/ci-runtime-evidence.json
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.1/ci-evidence.json
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/custom-app-production-durable-dual-transaction-id-bridge-integration.ps1
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/test_custom_app_production_durable_dual_transaction_id_bridge_integration.ps1
            validation/custom-app-production-durable-dual-transaction-id-bridge-integration-v0.1.0/test_custom_app_production_dual_transaction_id_bridge_regression_v011.ps1
