name: Validate Custom App Production Recovery Artifact Retirement Admission v0.1.1

on:
  push:
    branches: [validate/custom-app-production-recovery-artifact-retirement-admission-v0.1.0]
    paths: ['validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-artifact-retirement-admission-v011.yml']
  pull_request:
    branches: [validate/custom-app-production-recovery-restore-executor-v0.1.0]
    paths: ['validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/**','.github/workflows/validate-custom-app-production-recovery-artifact-retirement-admission-v011.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Prove exact scope lineage pins and frozen production
        shell: powershell
        run: |
          $h=(git rev-parse HEAD).Trim();$e='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}';if($h-cne$e){throw "head mismatch $h != $e"}
          $p='c3e1f960447ba84d2410af9c37a22a384f2a5436';if((git merge-base $p HEAD).Trim()-cne$p){throw 'not descended from exact validated recovery restore executor head'}
          $allowed=@('.github/workflows/validate-custom-app-production-recovery-artifact-retirement-admission-v011.yml','validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/custom-app-production-recovery-artifact-retirement-admission.ps1','validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission.ps1');$changed=@(git diff --name-only "$p...HEAD");$bad=@($changed|?{$_-notin$allowed});if($bad.Count){throw "scope escaped: $($bad-join', ')"};foreach($x in $allowed){if($x-notin$changed){throw "missing $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'production main moved'}
          $pins=@(
            @($h,'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/custom-app-production-recovery-artifact-retirement-admission.ps1','ec8aec5393f30923226f48df9850fded26ca11c6'),
            @($h,'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission.ps1','f390ea610e368025701f865084b2aec9d58f8b64'),
            @($p,'validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','5fec613c460619da5dbfe88fca5c7334e9e93f76'),
            @($p,'validation/custom-app-production-recovery-restore-executor-v0.1.0/test_custom_app_production_recovery_restore_executor.ps1','5f925d804a3561167f7d8b388a79239eee61fa3d'),
            @('d9a1face71511bdaeeef4e8c761415ef9ec95fc0','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','0273d7e28a56759b1d0ec9cbf037483b04d98d63'),
            @('d3969a746ed1736fe93586bd025116c2526fbff5','validation/custom-app-production-recovery-cleanup-resume-admission-v0.1.0/custom-app-production-recovery-cleanup-resume-admission.ps1','387d97b10d493b3794b24fba2bac67cf39491444'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'))
          foreach($q in $pins){$b=(git rev-parse "$($q[0])`:$($q[1])").Trim();if($b-cne$q[2]){throw "pin drift $($q[1]) $b != $($q[2])"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_ADMISSION_SCOPE_PINS_PASS'

      - name: Parse and audit strict read-only zero-authority contract
        shell: powershell
        run: |
          $d='validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0';foreach($f in @("$d/custom-app-production-recovery-artifact-retirement-admission.ps1","$d/test_custom_app_production_recovery_artifact_retirement_admission.ps1")){$t=$null;$er=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$er)|Out-Null;if($er.Count){$er|%{Write-Error ("$f line=$($_.Extent.StartLineNumber) text=<$($_.Extent.Text)> $($_.Message)")};throw "PS5.1 parse failed $f"}}
          $core=Get-Content "$d/custom-app-production-recovery-artifact-retirement-admission.ps1" -Raw
          foreach($m in @('Test-CustomAppProductionRecoveryRestoreExecutorResultV010','Read-CustomAppProductionCrashJournalV010','rollback-complete','Read-CustomAppProductionRecoveryEvidenceV010','Get-CustomAppProductionRecoveryRestoreResumeLiveStateV010','Get-CustomAppProductionRecoveryRestoreResumeTransactionStateV010','Test-CustomAppProductionRecoveryCleanupResumeStageArtifactV010','Test-CustomAppProductionRecoveryCleanupResumeAppBackupArtifactV010','Test-CustomAppProductionRecoveryCleanupResumePersistenceArtifactV010','Get-SpotifyPersistenceSnapshot','recovery-artifact-retirement-admission-semantic-status-drift','requires_future_executor_fresh_revalidation=$true','admission_is_authority=$false','execution_authorized=$false','restore_authorized=$false','apply_authorized=$false','cleanup_authorized=$false','production_mutation_authorized=$false')){if($core.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "missing core marker $m"}}
          foreach($x in @('[IO.Directory]::Delete','[IO.Directory]::Move','[IO.Directory]::CreateDirectory','[IO.File]::Copy','[IO.File]::Write','Copy-Item','Move-Item','Remove-Item','Set-Content','Add-Content','Out-File','Invoke-WebRequest','Invoke-RestMethod','Start-Process','ProcessStartInfo','Restore-SpotifyPersistenceBackup','Restore-CustomAppProductionAtomicLiveSwapV010','Invoke-CustomAppProductionExactSpicetifyApplyProcessV010','Remove-CustomAppProductionPostApplyBoundedArtifactV010')){if($core.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "forbidden side effect $x"}}
          if($core-match'admission_is_authority\s*=\s*\$true|execution_authorized\s*=\s*\$true|restore_authorized\s*=\s*\$true|apply_authorized\s*=\s*\$true|cleanup_authorized\s*=\s*\$true|production_mutation_authorized\s*=\s*\$true'){throw 'authority escaped'}
          $test=Get-Content "$d/test_custom_app_production_recovery_artifact_retirement_admission.ps1" -Raw;foreach($m in @('txn-present','txn-absent','partial-retired','already-complete','future-app','live-drift','persistence-drift','stage-drift','app-backup-drift','persistence-backup-drift','transaction-extra','old-live-drift','candidate-drift','result-authority','result-fingerprint','result-evidence','result-journal','wrong-transaction','expiry','receipt-tamper','semantic retirement status tamper+rehash accepted')){if($test.IndexOf($m,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "coverage missing $m"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_ADMISSION_PARSE_AUDIT_PASS'

      - name: Materialize exact sibling dependencies
        shell: powershell
        run: |
          $deps=@(
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','910b1c500d33d6d6e0ad403c701f4c08f473f1a3'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/test_custom_app_production_recovery_evidence.ps1','de37d029e175dbec899445dbe983e506a14a1b0a'),
            @('993af44afee9adb0c28e5fb702cb6ccfbd7cd99c','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/probe_custom_app_production_recovery_evidence.ps1','84f73605526373652a4499b7f472537c8e2b5c03'),
            @('57be1dcd10e339e9da2b8f15b9910a2ae1b79c1b','validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1','86c715370021cc1f09c46424172e2163ad56f236'),
            @('1a2461a6929e9cabd50d27f95e0744f83443b9e8','validation/custom-app-update-transaction-protocol-v0.1.0/custom-app-update-transaction.ps1','47b4d4bb08fe7b14ad43de4300556430eb638869'),
            @('7e26187e2360089024e9d72d0701be6f1577a1ef','validation/custom-app-production-crash-recovery-journal-v0.1.0/custom-app-production-crash-recovery-journal.ps1','a3df7e5d89c594083c10e240e13029ca5640b8ae'))
          foreach($q in $deps){$path=$q[1];New-Item -ItemType Directory -Force -Path (Split-Path $path -Parent)|Out-Null;$env:AR_SPEC="$($q[0])`:$path";$env:AR_OUT=$path;python -c "import os,subprocess,pathlib; pathlib.Path(os.environ['AR_OUT']).write_bytes(subprocess.check_output(['git','cat-file','blob',os.environ['AR_SPEC']]))";if($LASTEXITCODE){throw "materialize failed $path"};$actual=(git hash-object $path).Trim();if($actual-cne$q[2]){throw "materialized blob drift $path"}}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_ADMISSION_MATERIALIZATION_PASS'

      - name: Run admission matrix twice and exact parent regression
        shell: powershell
        run: |
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          1..2|%{& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission.ps1';if($LASTEXITCODE){throw "retirement admission matrix failed pass $_"}}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-production-recovery-restore-executor-v0.1.0/test_custom_app_production_recovery_restore_executor.ps1';if($LASTEXITCODE){throw 'restore executor parent regression failed'}
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_ADMISSION_MATRIX_PARENT_PASS'

      - name: Rebuild candidate SelfTest prove immutability and write evidence
        shell: powershell
        run: |
          python 'validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py';if($LASTEXITCODE){throw 'journal candidate build failed'}
          $a='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/addon-manager.ps1';$m='validation/custom-app-production-full-chain-journal-integration-v0.1.0/out/bin/spotify-control.ps1';$ah=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant();$mh=(Get-FileHash $m -Algorithm SHA256).Hash.ToLowerInvariant();if((Get-Item $a).Length-ne973527-or$ah-cne'3eac8cf4bfdcbbc38e7d4c01186a583fd13f96a27a98d8f6903147a4341da823'){throw 'addon candidate drift'};if($mh-cne'69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw 'main candidate drift'}
          $s=Join-Path $env:RUNNER_TEMP 'retirement-admission-selftest';$env:LOCALAPPDATA=Join-Path $s 'Local';$env:APPDATA=Join-Path $s 'Roaming';New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null;& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $a -Action SelfTest;if($LASTEXITCODE){throw 'SelfTest failed'}
          $p='c3e1f960447ba84d2410af9c37a22a384f2a5436';foreach($x in @('manifest.json','stable-version.json','addon-policy-registry.json','validation/custom-app-production-recovery-restore-executor-v0.1.0/custom-app-production-recovery-restore-executor.ps1','validation/custom-app-production-recovery-restore-resume-admission-v0.1.0/custom-app-production-recovery-restore-resume-admission.ps1','validation/custom-app-production-recovery-evidence-envelope-v0.1.0/custom-app-production-recovery-evidence.ps1','validation/custom-app-production-full-chain-journal-integration-v0.1.0/build_candidate.py')){git diff --quiet $p HEAD -- $x;if($LASTEXITCODE){throw "protected changed $x"}}
          if((git rev-parse origin/main).Trim()-cne'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'main moved'}
          $d='validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0';[ordered]@{schema=1;head=(git rev-parse HEAD).Trim();validated_restore_executor_parent=$p;read_only=$true;rollback_complete_required=$true;restore_result_revalidated_not_authority=$true;durable_evidence_reloaded=$true;exact_old_live_required=$true;protected_persistence_exact=$true;bounded_transaction_state=$true;artifact_states_verified_or_absent=$true;receipt_semantics_recomputed_from_artifact_status=$true;partial_retirement_restart_safe=$true;short_eligibility_window_seconds=15;future_executor_fresh_revalidation_required=$true;admission_authority=$false;execution_authority=$false;restore_authority=$false;apply_authority=$false;cleanup_authority=$false;production_mutation_authority=$false;production_main_changed=$false}|ConvertTo-Json|Set-Content "$d/ci-evidence.json" -Encoding UTF8
          'CUSTOM_APP_PRODUCTION_RECOVERY_ARTIFACT_RETIREMENT_ADMISSION_SELFTEST_IMMUTABILITY_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: custom-app-production-recovery-artifact-retirement-admission-v011-${{ github.run_id }}
          path: |
            validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/custom-app-production-recovery-artifact-retirement-admission.ps1
            validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/test_custom_app_production_recovery_artifact_retirement_admission.ps1
            validation/custom-app-production-recovery-artifact-retirement-admission-v0.1.0/ci-evidence.json
          if-no-files-found: error
