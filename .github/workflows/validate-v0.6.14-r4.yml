name: Validate exact Spotify Control v0.6.14 repair package

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'packages/v0.6.14/repair-validation/**'
      - '.github/workflows/validate-v0.6.14-r4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-repair-package-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact repair ZIP and verify package integrity
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import base64, hashlib, zipfile

          src = Path('packages/v0.6.14/repair-validation')
          chunks = sorted(src.glob('chunk-*.txt'))
          assert [p.name for p in chunks] == [f'chunk-{i:03d}.txt' for i in range(7)]
          encoded = b''.join(p.read_bytes() for p in chunks)
          assert len(encoded) == 41144, len(encoded)
          encoded_sha = hashlib.sha256(encoded).hexdigest()
          print(f'Actual repair base64 transport SHA256: {encoded_sha}')
          assert encoded_sha == 'e16c803b86ec461afd2e1ae3f2a4fd8ee26bd90cd5b0c94816a4a68db507535a'

          blob = base64.b64decode(encoded, validate=True)
          assert len(blob) == 30856, len(blob)
          blob_sha = hashlib.sha256(blob).hexdigest()
          print(f'Actual repair ZIP SHA256: {blob_sha}')
          assert blob_sha == '6b6d5d9e8ac44fc77bb95918164a3c862f14494c329fdfd267bd95f6c6ddcf06'
          Path('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip').write_bytes(blob)

          expected = {
              'APPLY_REPAIR.cmd',
              'APPLY_REPAIR.ps1',
              'PRECHECK_REPAIR.ps1',
              'README.txt',
              'ROLLBACK_REPAIR.cmd',
              'ROLLBACK_REPAIR.ps1',
              'SHA256SUMS.txt',
              'bootstrap/spotify-control-self-updater.ps1',
              'evidence/EXPECTED_STABLE_MANIFEST.json',
              'evidence/SELF_VALIDATION_REPORT.txt',
              'evidence/VALIDATION.txt',
              'evidence/validate_repair.py',
          }
          out = Path('repair-extracted')
          with zipfile.ZipFile('SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip') as z:
              assert z.testzip() is None
              names = z.namelist()
              assert set(names) == expected and len(names) == len(expected)
              for name in names:
                  p = PurePosixPath(name)
                  assert not p.is_absolute()
                  assert '..' not in p.parts
                  assert '\\' not in name
              z.extractall(out)

          sums = (out / 'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines()
          seen = set()
          for line in sums:
              if not line.strip():
                  continue
              sha, rel = line.split('  ', 1)
              target = out / PurePosixPath(rel)
              assert rel in expected and rel != 'SHA256SUMS.txt'
              assert target.is_file()
              assert hashlib.sha256(target.read_bytes()).hexdigest() == sha.lower(), rel
              seen.add(rel)
          assert seen == expected - {'SHA256SUMS.txt'}
          print(f'Exact repair ZIP SHA256: {blob_sha}')
          print('ZIP CRC, entry set, path safety, and SHA256SUMS verification passed.')

      - name: Run embedded structural validator
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable, 'repair-extracted/evidence/validate_repair.py'], text=True)
          if p.returncode != 0:
              raise SystemExit(p.returncode)

      - name: Windows PowerShell 5.1 parser precheck from exact package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'repair-extracted\PRECHECK_REPAIR.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Package PRECHECK failed with exit code $LASTEXITCODE" }

          $targets = @(
            'repair-extracted\PRECHECK_REPAIR.ps1',
            'repair-extracted\APPLY_REPAIR.ps1',
            'repair-extracted\ROLLBACK_REPAIR.ps1',
            'repair-extracted\bootstrap\spotify-control-self-updater.ps1'
          )
          foreach ($path in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 parser rejected $path"
            }
          }
          Write-Host 'Exact repair package Windows PowerShell 5.1 parser validation passed.'

      - name: Upload exact validated repair ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14
          path: SpotifyControl-Installed-ivLyrics-Transaction-Repair-v0.6.14.zip
          if-no-files-found: error
          compression-level: 0
