name: Validate Spotify Control Stage14 v1.1.0

on:
  pull_request:
    branches:
      - main
    paths:
      - 'validation/stage14-v1.1.0/**'
      - '.github/workflows/validate-stage14-v1.1.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell51-stage14:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact Stage14 ZIP
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import base64, hashlib, subprocess, sys, zipfile

          pieces = [
              ('validation/stage14-v1.1.0/chunks/chunk-000.txt', 6000, 'b7b1a7550bc920f13e3c69ce7f11ef1c36fd899fffb45bbfbbd897e7e02e36f1'),
              ('validation/stage14-v1.1.0/segments/seg-01.txt', 3000, '295e031e122b2965c50ebbe19c5ee74a1da640c34f81abd11760134034e09a15'),
              ('validation/stage14-v1.1.0/segments/seg-02.txt', 3000, '320a646d520fb5f0cf9818401a74e6e796e965725ccd77419860de6c22cdc9e2'),
              ('validation/stage14-v1.1.0/segments/seg-03.txt', 3000, '8b398e6c0dfd1898dc24b2bace530f331b7b7b957fc8a68e28b7c18d94fbbdf9'),
              ('validation/stage14-v1.1.0/segments/seg-04.txt', 3000, '900c2b6d455fe48899d9174beb78401864246439fa3b8ddb5ea96f9676488fc9'),
              ('validation/stage14-v1.1.0/segments/seg-05.txt', 3000, '926f1376060de66dbbc27bf07cf9e50000b6bd424957058efb6beccb571be77e'),
              ('validation/stage14-v1.1.0/segments/seg-06.txt', 3000, 'af5696082d2c82bcf9a9fc522afcd7bc7cde5597c87d4276a3e68f2211b9693d'),
              ('validation/stage14-v1.1.0/segments/seg-07.txt', 3000, '7eefcefb883581a465a1fe88ab51a9735ec372884513f178b3940a3944e529b9'),
              ('validation/stage14-v1.1.0/segments/seg-08.txt', 3000, '51d850a5f6b73f9e1055816b53df049a7471bc1ca47807c249cc53e0da369e9e'),
              ('validation/stage14-v1.1.0/segments/seg-09.txt', 3000, '919f6530daed051dcdedc3420f6e6597bfdff83b9d0ea2ea686f756f3ef5ac1f'),
              ('validation/stage14-v1.1.0/segments/seg-10.txt', 3000, 'f82a5be5d9fda5c8d9bb20bd144fb19fe66b6469c761a011dc2d5d403165e4c0'),
              ('validation/stage14-v1.1.0/segments/seg-11.txt', 3000, '90432a03589a5e03d421c75b38928c39d398736ef48abf99670977aceac15094'),
              ('validation/stage14-v1.1.0/segments/seg-12.txt', 1008, '938f3d11fce05e9f25e273db64ff4a00c75c5c9139a01406af9851229668774e'),
          ]
          parts = []
          for rel, size, sha in pieces:
              data = Path(rel).read_bytes()
              print('PIECE', rel, len(data), hashlib.sha256(data).hexdigest())
              assert len(data) == size, (rel, len(data), size)
              assert hashlib.sha256(data).hexdigest() == sha, rel
              parts.append(data)
          encoded = b''.join(parts)
          print('ENCODED', len(encoded), hashlib.sha256(encoded).hexdigest())
          assert len(encoded) == 40008
          assert hashlib.sha256(encoded).hexdigest() == 'ba2b10d9197cfdba0d683b29612402977aa1da30e75d37ebf15bac1ce37362ba'
          raw = base64.b64decode(encoded, validate=True)
          print('ZIP', len(raw), hashlib.sha256(raw).hexdigest())
          assert len(raw) == 30004
          assert hashlib.sha256(raw).hexdigest() == 'a823775a2c05faa599263ecf3ec3da90aff7ae4012f45380658fde422b6a9dcc'
          zpath = Path('SpotifyControl-Windows-Runtime-Acceptance-v1.1.0.zip')
          zpath.write_bytes(raw)

          out = Path('stage14-unpacked')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert len(names) == len(set(names))
              for name in names:
                  p = PurePosixPath(name)
                  assert not p.is_absolute()
                  assert '..' not in p.parts
                  assert '\\' not in name
                  assert not (len(name) >= 2 and name[1] == ':')
              z.extractall(out)

          sums = {}
          for line in (out/'SHA256SUMS.txt').read_text(encoding='ascii').splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split('  ', 1)
              sums[rel] = digest.lower()
          for rel, digest in sums.items():
              p = out/rel
              assert p.is_file(), rel
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, rel

          check = subprocess.run([sys.executable, 'evidence/validate_stage14.py'], cwd=out, capture_output=True, text=True)
          print(check.stdout)
          print(check.stderr)
          assert check.returncode == 0
          assert 'STAGE14 SELF VALIDATION: 130/130 PASS' in check.stdout

          run = (out/'RUN_RUNTIME_ACCEPTANCE.ps1').read_text(encoding='utf-8-sig')
          required = [
              '$AcceptanceVersion = "1.1.0"',
              '5306acbe610b06f2c638ebbdc305db9741bbe145392933a38f648906acd302d1',
              'd6a11c73c561662579c9b28b59e9f2845563e8050eceeb8e5cec0f5f3618759a',
              'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6',
              'b1e6c22e2caa9c94d46d7f897172c69f160e6dc3',
              '7a57bc6970ca4f328fd8a417380421f6094c911008b46c2ef407c9cc2ee28879',
              'ivLis-Studio/ivLyrics',
              'release-proof-required',
              "^sha256:[0-9a-f]{64}$",
              '$ArmedByThisRun = (-not $OriginalMutationEnabled)',
              'agent_mutation_enabled = $OriginalMutationEnabled',
          ]
          for needle in required:
              assert needle in run, needle
          assert 'ivLyrics is installed, but Stage14 baseline expects it absent' not in run

      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath 'SpotifyControl-Windows-Runtime-Acceptance-v1.1.0.zip' -DestinationPath 'stage14-ps' -Force
          foreach($rel in @('PRECHECK_RUNTIME_ACCEPTANCE.ps1','RUN_RUNTIME_ACCEPTANCE.ps1')) {
            $path = (Resolve-Path (Join-Path 'stage14-ps' $rel)).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 parser rejected $rel"
            }
          }
          Write-Host 'Stage14 v1.1.0 Windows PowerShell 5.1 parser PASS.'

      - name: Upload exact validated Stage14 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Windows-Runtime-Acceptance-v1.1.0
          path: SpotifyControl-Windows-Runtime-Acceptance-v1.1.0.zip
          if-no-files-found: error
          compression-level: 6
