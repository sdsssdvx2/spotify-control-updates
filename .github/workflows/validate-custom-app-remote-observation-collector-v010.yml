name: Validate Custom App Remote Observation Collector v0.1.0

on:
  push:
    branches: [validate/custom-app-remote-observation-collector-v0.1.0]
    paths:
      - 'validation/custom-app-remote-observation-collector-v0.1.0/**'
      - '.github/workflows/validate-custom-app-remote-observation-collector-v010.yml'
  pull_request:
    branches: [validate/custom-app-remote-source-contract-v0.1.1]
    paths:
      - 'validation/custom-app-remote-observation-collector-v0.1.0/**'
      - '.github/workflows/validate-custom-app-remote-observation-collector-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact collector-only scope and v0.1.1 lineage
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim();$expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $parent='19109205bd2e61e862c3b9acd61946568397ecb5'
          if((git merge-base $parent HEAD).Trim() -cne $parent){throw 'Collector is not descended from exact validated v0.1.1 head.'}
          $allowed=@(
            '.github/workflows/validate-custom-app-remote-observation-collector-v010.yml',
            'validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1'
          )
          $changed=@(git diff --name-only "$parent...HEAD");$bad=@($changed|Where-Object{$_ -notin $allowed})
          if($bad.Count){throw "Collector validation scope escaped: $($bad -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected collector file: $required"}}
          if((git rev-parse origin/main).Trim() -cne 'd38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'){throw 'Production main moved during collector validation.'}
          Write-Host "CUSTOM_APP_REMOTE_OBSERVER_SCOPE_PASS head=$actual"

      - name: Prove exact contract and collector blob pins
        shell: powershell
        run: |
          $pins=@(
            @('b53bcf39f715f1c35c7d1f99e157cdecb0a2a572','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','f8c91f5a566b24c82257742942bdc6fecfe68eb2'),
            @('19109205bd2e61e862c3b9acd61946568397ecb5','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1','dbec4f817f4f4eab92d89d1f8dc623b1da435ac3'),
            @('HEAD','validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1','3a49ceebd13fa993b086eb2643130fb02c746bd1'),
            @('HEAD','validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1','1d0518cefbd3532cacc5ba82e01546afbc8ad1f8'),
            @('HEAD','validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1','b61a7183694e925c199968d353850391c49bd0bb')
          )
          foreach($pin in $pins){$blob=(git rev-parse "$($pin[0])`:$($pin[1])").Trim();if($blob -cne $pin[2]){throw "Pinned blob drift: $($pin[1]) $blob != $($pin[2])"}}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_BLOB_PIN_PASS'

      - name: Parse all collector validation scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach($file in @(
            'validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1'
          )){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error "$file :: $($_.Message)"};throw "PS5.1 parse failed: $file"}
          }
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_PS51_PARSE_PASS'

      - name: Run offline ZIP and temp-safety acceptance matrix
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1'
          if($LASTEXITCODE -ne 0){throw 'Remote observer offline acceptance matrix failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_OFFLINE_MATRIX_PASS'

      - name: Audit collector as bounded temp-only observer
        shell: powershell
        run: |
          $core=Get-Content 'validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1' -Raw
          foreach($literal in @('Expand-Archive','ExtractToDirectory','Start-Process','spicetify apply','spicetify config','CustomApps','LOCALAPPDATA','APPDATA','HKCU:','HKLM:')){if($core.IndexOf($literal,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Collector gained forbidden install/user-state primitive: $literal"}}
          foreach($cmd in @('Copy-Item','Move-Item','Set-Content','Out-File','Add-Content')){if([regex]::IsMatch($core,"(?im)^\s*$([regex]::Escape($cmd))\b")){throw "Collector gained forbidden command token: $cmd"}}
          $cleanup=[regex]::Match($core,'(?ms)^function Remove-CustomAppObserverTempDirectory \{.*?(?=^function |\z)').Value
          if([string]::IsNullOrWhiteSpace($cleanup)){throw 'Dedicated temp cleanup function is missing.'}
          $removeAll=[regex]::Matches($core,'(?i)\bRemove-Item\b').Count;$removeCleanup=[regex]::Matches($cleanup,'(?i)\bRemove-Item\b').Count
          if($removeAll -ne 1 -or $removeCleanup -ne 1){throw "Remove-Item escaped dedicated temp cleanup: all=$removeAll cleanup=$removeCleanup"}
          foreach($required in @('spotify-control-remote-observer','ResponseHeadersRead','compressed download exceeded the safety limit while streaming','Test-CustomAppObserverDownloadHost','ZipFile]::OpenRead','path-backslash-denied','case-colliding logical path','contains a symlink','expanded-byte total exceeds the safety limit','release_zip_asset_count','wrapper_stripped','has_submodule','mutation_authorized=$false','auto_update_authorized=$false','auto_install_authorized=$false')){if($core.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){throw "Collector safety marker missing: $required"}}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_STATIC_AUDIT_PASS'

      - name: Re-run validated remote-source contract matrices
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.0/test_custom_app_remote_source_contract.ps1'
          if($LASTEXITCODE -ne 0){throw 'Validated v0.1.0 matrix regressed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-source-contract-v0.1.1/test_release_continuity_v011.ps1'
          if($LASTEXITCODE -ne 0){throw 'Validated v0.1.1 matrix regressed.'}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_CONTRACT_REPLAY_PASS'

      - name: Live pinned Tagify v3.3.1 to v3.3.2 collector-contract acceptance
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1'
          if($LASTEXITCODE -ne 0){throw 'Live Tagify collector-contract acceptance failed.'}

      - name: Prove repo-commit observer is conservative on pinned Tagify commit
        shell: powershell
        run: |
          . (Resolve-Path 'validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1')
          $o=Get-CustomAppObserverRepoCommitObservation -Source 'alexk218/tagify' -CommitSha 'bacd80f76c621a3acc06965bb3160ce1056fad7b'
          if([int64]$o.github_repo_id -ne 1021838879 -or [string]$o.commit_sha -cne 'bacd80f76c621a3acc06965bb3160ce1056fad7b' -or -not [bool]$o.wrapper_stripped){throw 'Pinned Tagify repo observation identity/wrapper drift.'}
          if([bool]$o.mutation_authorized -or [bool]$o.auto_update_authorized -or [bool]$o.auto_install_authorized){throw 'Repo observation gained mutation authority.'}
          Write-Host "CUSTOM_APP_REMOTE_OBSERVER_REPO_COMMIT_PASS build_required=$($o.build_required) roots=$($o.app_root_count) layout=$($o.layout_root) tree=$($o.tree_sha256)"

      - name: Rebuild exact observer parent and run full Addon Manager SelfTest
        shell: powershell
        run: |
          python 'validation/custom-app-provenance-integrated-observer-v0.3.0/build_candidate.py' --build
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent rebuild failed.'}
          $addon='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/addon-manager.ps1';$main='validation/custom-app-provenance-integrated-observer-v0.3.0/out/bin/spotify-control.ps1'
          $as=(Get-Item $addon).Length;$ah=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant();$ms=(Get-Item $main).Length;$mh=(Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant()
          if($as -ne 428643 -or $ah -cne '8de197a78e40faad6e934c0eef4bb123f6652fc6e35cf440733c813c6df86e52'){throw "Observer Addon Manager drift: $as/$ah"}
          if($ms -ne 284327 -or $mh -cne '69ef7fb3ca57b4d5faac6873ac06dffc38f6e5b0d1ad8fc31fcbe2bb236f5c99'){throw "Spotify Control drift: $ms/$mh"}
          $root=Join-Path $env:RUNNER_TEMP 'remote-observer-parent-selftest';$env:LOCALAPPDATA=Join-Path $root 'LocalAppData';$env:APPDATA=Join-Path $root 'Roaming'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA,(Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Validated observer parent SelfTest failed.'}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_PARENT_SELFTEST_PASS'

      - name: Prove production and v0.1.1 parent remain immutable
        shell: powershell
        run: |
          $parent='19109205bd2e61e862c3b9acd61946568397ecb5';$changed=@(git diff --name-only "$parent...HEAD")
          $expected=@(
            '.github/workflows/validate-custom-app-remote-observation-collector-v010.yml',
            'validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1',
            'validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1'
          )
          $bad=@($changed|Where-Object{$_ -notin $expected});if($bad.Count){throw "Unexpected collector changed surface: $($bad -join ', ')"}
          foreach($path in @('bin/spotify-control.ps1','bin/addon-manager.ps1','manifest.json','stable-version.json','validation/custom-app-remote-source-contract-v0.1.0/custom-app-remote-source-contract.ps1','validation/custom-app-remote-source-contract-v0.1.1/release-continuity-v011.ps1')){git diff --quiet $parent HEAD -- $path;if($LASTEXITCODE -ne 0){throw "Protected parent/production surface changed: $path"}}
          Write-Host 'CUSTOM_APP_REMOTE_OBSERVER_IMMUTABILITY_PASS'

      - name: Upload remote observer validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-app-remote-observation-collector-v010-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            validation/custom-app-remote-observation-collector-v0.1.0/custom-app-remote-observer.ps1
            validation/custom-app-remote-observation-collector-v0.1.0/test_custom_app_remote_observer.ps1
            validation/custom-app-remote-observation-collector-v0.1.0/test_live_tagify_remote_observer.ps1
