name: Validate Star Ratings Exact Release Provenance v0.1.2

on:
  push:
    branches:
      - validate/star-ratings-release-provenance-v0.1.2
    paths:
      - 'validation/star-ratings-release-provenance-v0.1.2/**'
      - '.github/workflows/validate-star-ratings-release-provenance-v012.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'validation/star-ratings-release-provenance-v0.1.2/**'
      - '.github/workflows/validate-star-ratings-release-provenance-v012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact validation-only scope and source chain
        shell: powershell
        run: |
          $base='5cf131e7bc168f686c7b6fc933a713f4d96b9dd3'
          $actual=(git rev-parse HEAD).Trim()
          $eventHead='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -ne $eventHead){throw "Not exact event head: $actual != $eventHead"}
          if((git merge-base $base HEAD).Trim() -ne $base){throw 'Star Ratings v0.1.2 is not based on exact stable v0.6.26 main.'}
          $changed=@(git diff --name-only "$base...HEAD"|Sort-Object)
          $expected=@('.github/workflows/validate-star-ratings-release-provenance-v012.yml','validation/star-ratings-release-provenance-v0.1.2/build_candidate.py'|Sort-Object)
          if(($changed -join '|') -cne ($expected -join '|')){throw "Unexpected validation scope: $($changed -join ', ')"}
          $v011=(git rev-parse 'd4d7e2d23c740f2c24920b45ee2e1a10427eda57:validation/star-ratings-release-provenance-v0.1.1/build_candidate.py').Trim()
          $v010=(git rev-parse '8c1daad685db41b0de5ef73422b6e49c5ddc823e:validation/star-ratings-release-provenance-v0.1.0/build_candidate.py').Trim()
          if($v011 -cne '0c5b40b470d628fb3c7ea76942ee050d1a36eef9'){throw "Pinned v0.1.1 builder drifted: $v011"}
          if($v010 -cne '34ad67d7a3b5def12b7e514178052e48c260a678'){throw "Pinned v0.1.0 builder drifted: $v010"}
          Write-Host "STAR_RATINGS_V012_SCOPE_SOURCE_PASS head=$actual v011=$v011 v010=$v010"

      - name: Build exact candidate twice and parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          python -m py_compile validation/star-ratings-release-provenance-v0.1.2/build_candidate.py
          if($LASTEXITCODE -ne 0){throw 'v0.1.2 wrapper failed Python compile.'}
          python validation/star-ratings-release-provenance-v0.1.2/build_candidate.py --build
          if($LASTEXITCODE -ne 0){throw 'v0.1.2 candidate build failed.'}
          $main='validation/star-ratings-release-provenance-v0.1.2/out/bin/spotify-control.ps1'
          $addon='validation/star-ratings-release-provenance-v0.1.2/out/bin/addon-manager.ps1'
          foreach($file in @($main,$addon)){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error ("{0}: {1}" -f $file,$_.Message)};throw "PowerShell 5.1 parse failed: $file"}
          }
          Copy-Item $main "$main.first";Copy-Item $addon "$addon.first"
          python validation/star-ratings-release-provenance-v0.1.2/build_candidate.py --build
          if($LASTEXITCODE -ne 0){throw 'Second deterministic build failed.'}
          if((Get-FileHash $main -Algorithm SHA256).Hash -cne (Get-FileHash "$main.first" -Algorithm SHA256).Hash){throw 'Main candidate is not deterministic.'}
          if((Get-FileHash $addon -Algorithm SHA256).Hash -cne (Get-FileHash "$addon.first" -Algorithm SHA256).Hash){throw 'Addon candidate is not deterministic.'}
          Remove-Item "$main.first","$addon.first" -Force
          if((Get-Item $main).Length -ne 284317 -or (Get-FileHash $main -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9eb51ff9e001ebd84fd43532a2b3869f6d61f9b230a8008742119e8892202787'){throw 'Pinned v0.6.27 main identity mismatch.'}
          if((Get-Item $addon).Length -ne 303745 -or (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c8d52542faaf033c0ede8216f71fe2e40d73636bd343d3faf88eb926e5017152'){throw 'Pinned r16 addon identity mismatch.'}
          Write-Host 'STAR_RATINGS_V012_BUILD_PARSE_DETERMINISM_PASS'

      - name: Re-authenticate all 13 releases and exercise provenance plus immutable performance regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $addon=(Resolve-Path 'validation/star-ratings-release-provenance-v0.1.2/out/bin/addon-manager.ps1').Path
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($addon,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'Candidate AST parse failed before helper extraction.'}
          $wanted=@('Test-PathSafe','Get-StarRatingsReleaseCatalog','Get-StarRatingsReleaseFileProvenance','Resolve-StarRatingsInstalledReleaseProvenance')
          $defs=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $wanted -contains $n.Name},$true))
          if($defs.Count -ne $wanted.Count){throw "Helper extraction mismatch: $($defs.Name -join ',')"}
          $harness=Join-Path $env:RUNNER_TEMP 'star-ratings-v012-harness.ps1'
          ($defs|Sort-Object{$wanted.IndexOf($_.Name)}|ForEach-Object{$_.Extent.Text}) -join "`r`n`r`n" | Set-Content -LiteralPath $harness -Encoding UTF8
          . $harness

          $catalog=@(Get-StarRatingsReleaseCatalog)
          if($catalog.Count -ne 13){throw "Expected 13 Star Ratings releases, got $($catalog.Count)"}
          if(($catalog.Version -join '|') -cne '2.0.0|2.0.1|2.0.2|2.0.3|2.0.4|2.0.5|2.0.6|2.0.7|2.0.8|2.1.0|2.1.1|2.1.2|2.1.3'){throw 'Star Ratings release catalog version order drifted.'}
          $fixtureRoot=Join-Path $env:RUNNER_TEMP 'star-ratings-v012-fixtures'
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixtureRoot -Force|Out-Null
          $downloaded=@{}
          foreach($row in $catalog){
            $path=Join-Path $fixtureRoot ("star-ratings-{0}.js" -f $row.Version)
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/brimell/spicetify-star-ratings/$($row.TagCommit)/dist/star-ratings.js" -OutFile $path
            if((Get-Item $path).Length -ne [int64]$row.Size){throw "Release size drift: $($row.Version)"}
            if((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$row.Sha256){throw "Release SHA drift: $($row.Version)"}
            $proof=Get-StarRatingsReleaseFileProvenance -Path $path
            if(-not[bool]$proof.Proven -or [bool]$proof.Ambiguous -or [string]$proof.Version -cne [string]$row.Version){throw "Exact release proof failed: $($row.Version)"}
            $downloaded[[string]$row.Version]=$path
          }
          Write-Host 'STAR_RATINGS_ALL_13_RELEASES_REAUTHENTICATED_PASS'

          $app=Join-Path $fixtureRoot 'app-original';$local=Join-Path $fixtureRoot 'local-original'
          $active=Join-Path $app 'Spotify\Apps\xpui\extensions\sc-star-ratings.js'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $active)|Out-Null
          Copy-Item $downloaded['2.1.3'] $active
          $p=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app -LocalAppDataRoot $local
          if(-not[bool]$p.Proven -or [string]$p.Version -cne '2.1.3' -or [string]$p.ProofKind -cne 'active-exact-upstream-dist-v1'){throw 'Active-original provenance failed.'}
          Write-Host 'STAR_RATINGS_ACTIVE_ORIGINAL_PROVEN_PASS'

          $app2=Join-Path $fixtureRoot 'app-transformed';$local2=Join-Path $fixtureRoot 'local-transformed'
          $xpui=Join-Path $app2 'Spotify\Apps\xpui';$active2=Join-Path $xpui 'extensions\sc-star-ratings.js'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $active2)|Out-Null
          Copy-Item $downloaded['2.1.3'] $active2
          $stateRoot=Join-Path $local2 'SpotifyControl\star-ratings-performance\runtime-v1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/apply-star-ratings-patch.ps1 -Mode Apply -XpuiRoot $xpui -StateRoot $stateRoot -TargetMetadataPath performance/star-ratings/target.json | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Failed to create transformed performance fixture.'}
          $p2=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app2 -LocalAppDataRoot $local2
          if(-not[bool]$p2.Proven -or [string]$p2.Version -cne '2.1.3' -or [string]$p2.ProofKind -cne 'performance-original-backup-v1'){throw 'Performance-backup provenance failed.'}
          Write-Host 'STAR_RATINGS_TRANSFORMED_BACKUP_PROVEN_PASS'

          Remove-Item (Join-Path $stateRoot 'active-state.json') -Force
          $noState=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app2 -LocalAppDataRoot $local2
          if([bool]$noState.Proven -or [string]$noState.Reason -cne 'performance-state-missing'){throw 'Transformed bytes without state did not fail closed.'}

          Copy-Item $downloaded['2.1.3'] $active2 -Force
          Remove-Item $stateRoot -Recurse -Force -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/apply-star-ratings-patch.ps1 -Mode Apply -XpuiRoot $xpui -StateRoot $stateRoot -TargetMetadataPath performance/star-ratings/target.json | Out-Null
          $statePath=Join-Path $stateRoot 'active-state.json';$state=Get-Content $statePath -Raw|ConvertFrom-Json
          $state.backup_path=Join-Path $fixtureRoot 'forged.bin';$state|ConvertTo-Json -Depth 8|Set-Content $statePath -Encoding UTF8
          $forged=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app2 -LocalAppDataRoot $local2
          if([bool]$forged.Proven -or [string]$forged.Reason -cne 'performance-state-contract-mismatch'){throw 'Forged state path was trusted.'}

          Copy-Item $downloaded['2.1.3'] $active2 -Force
          Remove-Item $stateRoot -Recurse -Force -ErrorAction SilentlyContinue
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/apply-star-ratings-patch.ps1 -Mode Apply -XpuiRoot $xpui -StateRoot $stateRoot -TargetMetadataPath performance/star-ratings/target.json | Out-Null
          $backup=Join-Path $stateRoot 'star-ratings-observer-debounce-v1\original.bin';[IO.File]::AppendAllText($backup,'tamper')
          $tampered=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app2 -LocalAppDataRoot $local2
          if([bool]$tampered.Proven -or [string]$tampered.Reason -cne 'performance-original-backup-unproven'){throw 'Tampered original backup was trusted.'}
          Write-Host 'STAR_RATINGS_STATE_AND_BACKUP_TAMPER_FAIL_CLOSED_PASS'

          $app3=Join-Path $fixtureRoot 'app-rescue-only';$local3=Join-Path $fixtureRoot 'local-rescue-only'
          $rescue=Join-Path $app3 'spicetify\Extensions\sc-star-ratings.js';New-Item -ItemType Directory -Force -Path (Split-Path -Parent $rescue)|Out-Null
          Copy-Item $downloaded['2.1.3'] $rescue
          $rescueProof=Resolve-StarRatingsInstalledReleaseProvenance -AppDataRoot $app3 -LocalAppDataRoot $local3
          if([bool]$rescueProof.Proven -or [string]$rescueProof.Reason -cne 'active-file-missing'){throw 'Rescue copy was incorrectly accepted.'}
          Write-Host 'STAR_RATINGS_RESCUE_COPY_EXCLUDED_PASS'

          $unknown=Join-Path $fixtureRoot 'unknown.js';Set-Content $unknown 'unknown-star-ratings-bytes' -Encoding ASCII
          if([bool](Get-StarRatingsReleaseFileProvenance -Path $unknown).Proven){throw 'Unknown bytes were proven.'}
          $dup=@(Get-StarRatingsReleaseCatalog)+[pscustomobject]@{Version='9.9.9';Tag='9.9.9';TagCommit='0000000000000000000000000000000000000000';Size=[int64]43396;Sha256='198fd7c3307de8f2efc36f40df4e79846188cf35a1d5b550ed3d8ab85e8139b1'}
          $amb=Get-StarRatingsReleaseFileProvenance -Path $downloaded['2.1.3'] -Catalog $dup
          if([bool]$amb.Proven -or -not[bool]$amb.Ambiguous -or [int]$amb.MatchCount -ne 2){throw 'Ambiguous catalog did not fail closed.'}
          Write-Host 'STAR_RATINGS_UNKNOWN_AMBIGUOUS_FAIL_CLOSED_PASS'

          $fixture=$downloaded['2.1.3']
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/star-ratings/tests/test-star-ratings-patch.ps1 -FixturePath $fixture
          if($LASTEXITCODE -ne 0){throw 'Immutable Star Ratings performance regression failed.'}
          Write-Host 'STAR_RATINGS_PERFORMANCE_REGRESSION_UNCHANGED_PASS'

      - name: Run full candidate Addon Manager read-only SelfTest and policy audit
        shell: powershell
        run: |
          $addon='validation/star-ratings-release-provenance-v0.1.2/out/bin/addon-manager.ps1'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $addon -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Candidate Addon Manager SelfTest failed.'}
          $report=Get-Content validation/star-ratings-release-provenance-v0.1.2/candidate-report.json -Raw|ConvertFrom-Json
          if($report.authority_expanded -ne $false -or $report.new_auto_install_authority -ne $false){throw 'Authority expanded.'}
          if(($report.auto_authority -join '|') -ne 'better-local-files|eternal-jukebox|ivLyrics|playlist-maker'){throw 'Automatic authority drifted.'}
          if($report.star_ratings_policy.inventory_policy -ne 'source-watch-only' -or $report.star_ratings_policy.mutation_mode -ne 'deny' -or $report.star_ratings_policy.data_policy -ne 'playlist-backed-ratings-preserve'){throw 'Star Ratings protected policy drifted.'}
          $text=Get-Content $addon -Raw
          foreach($required in @('protect-ratings-tags-notes','never-disable-or-optimize','2592f43a26c3c49b9d58b8244654d27448d801995465c7c8e4ba8d3159b9aa27','75d66f6e06ec76c8f96fbc7941617e7330844979a87d3297e8e4ff824c3b6a1a','60311e81ae11727528fd5e34879533e1cfacdaaf7b2b21dd1808fb20e3b32454')){if($text.IndexOf($required,[StringComparison]::OrdinalIgnoreCase)-lt 0){throw "Protected marker missing: $required"}}
          Write-Host 'STAR_RATINGS_V012_SELFTEST_POLICY_PASS'

      - name: Prove no production surface changed
        shell: powershell
        run: |
          $base='5cf131e7bc168f686c7b6fc933a713f4d96b9dd3'
          git diff --exit-code -- "$base...HEAD" -- manifest.json manifest.schema.json packages performance README.md validation/v0.6.26
          if($LASTEXITCODE -ne 0){throw 'Validation branch changed a production/stable surface.'}
          Write-Host 'STAR_RATINGS_V012_NO_PRODUCTION_CHANGE_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: star-ratings-release-provenance-v012
          path: |
            validation/star-ratings-release-provenance-v0.1.2/out/bin/spotify-control.ps1
            validation/star-ratings-release-provenance-v0.1.2/out/bin/addon-manager.ps1
            validation/star-ratings-release-provenance-v0.1.2/candidate-report.json
          if-no-files-found: error
