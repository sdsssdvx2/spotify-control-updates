name: Validate Performance Phase 2 v0.5.1 Final

on:
  push:
    branches: [validate/performance-phase2-v0.5.1]
    paths:
      - 'validation/performance-phase2-v0.5.1/**'
      - '.github/workflows/validate-performance-phase2-v051-alignment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'validation/performance-phase2-v0.5.1/**'
      - '.github/workflows/validate-performance-phase2-v051-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate isolation helper release chain and scripts
        shell: powershell
        run: |
          $base='0e367abdc61e8fdf7125032b51bba0ce9550f6ea'
          git cat-file -e "$base^{commit}"
          foreach($path in @(git diff --name-only "$base...HEAD")){
            if($path -eq 'manifest.json' -or $path.StartsWith('packages/') -or $path.StartsWith('bin/') -or $path.StartsWith('performance/overlay/') -or $path.StartsWith('validation/v0.6.19/')){throw "Production surface changed: $path"}
          }
          foreach($path in @('validation/performance-phase2-v0.5.1/runtime_alignment.ps1.inc','validation/performance-phase2-v0.5.1/test_v0617_two_edge.ps1')){
            $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PS5.1 parse failed: $path"}
          }
          $s=Get-Content 'validation/performance-phase2-v0.5.1/runtime_alignment.ps1.inc' -Raw
          foreach($x in @('current-v0619-r8','previous-v0618-r7','previous-v0617-r7','unknown-or-partial','Align-ReleasedProductionBaseline','Production alignment requires the resident to be suspended first.','No production files were changed')){if($s.IndexOf($x,[StringComparison]::OrdinalIgnoreCase)-lt0){throw "Missing helper contract: $x"}}
          $m=Get-Content manifest.json -Raw|ConvertFrom-Json
          if($m.latest_version-ne'0.6.19' -or $m.bootstrap.version-ne'1.0.6' -or $m.bootstrap.sha256-ne'd9b28007eb95874f02c48ed50d8ada71134e15e6492fef0e2d45dd2522053fe6'){throw 'Released v0.6.19/Bootstrap identity changed.'}
          $e17=@($m.updates|Where-Object{$_.from_version-eq'0.6.17'-and$_.to_version-eq'0.6.18'});if($e17.Count-ne1-or@($e17[0].patches).Count-ne1){throw 'v0.6.17 -> v0.6.18 edge missing.'}
          $p17=@($e17[0].patches|Where-Object path -eq 'bin/spotify-control.ps1')[0];if($p17.from_sha256-ne'5ff7990564287bc409626d8835e27679fb8de434868443313be42fdc0d9cce3b'-or$p17.to_sha256-ne'27783abc40c446aadf6f2a9373b4525ada89759075f37e934958c8e449f2d98f'){throw 'v0.6.17 edge identity changed.'}
          $e18=@($m.updates|Where-Object{$_.from_version-eq'0.6.18'-and$_.to_version-eq'0.6.19'});if($e18.Count-ne1-or@($e18[0].patches).Count-ne2){throw 'v0.6.18 -> v0.6.19 edge missing.'}
          Write-Host 'V051_FINAL_STATIC_RELEASE_CHAIN_PASS'

      - name: Revalidate published transport and exact integrated package
        shell: powershell
        run: |
          python validation/v0.6.19/build_v0619.py --validate-published
          if($LASTEXITCODE-ne0){throw 'Published v0.6.19 validation failed.'}
          python validation/performance-phase2-v0.5.1/build_v051.py
          if($LASTEXITCODE-ne0){throw 'v0.5.1 assembly failed.'}
          $zip='SpotifyControl-Track-Transition-Direct-Patch-Acceptance-v0.5.1.zip'
          if((Get-Item $zip).Length-ne98457-or(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne'db2d8836a7d865376c38688dfc3467b999e18437215ef4d5c44b7b9829cd0e11'){throw 'Final v0.5.1 ZIP identity mismatch.'}
          Expand-Archive $zip phase2-v051 -Force
          foreach($line in Get-Content phase2-v051/SHA256SUMS.txt){if($line-notmatch'^([0-9a-f]{64})  (.+)$'){throw "Bad checksum row: $line"};$a=(Get-FileHash (Join-Path phase2-v051 $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant();if($a-ne$Matches[1]){throw "Checksum mismatch: $($Matches[2])"}}
          $p='phase2-v051/track-transition-direct-patch-acceptance.ps1'
          if((Get-Item $p).Length-ne78659-or(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()-ne'3ce2bb45f4b9fd64423f7c62e1c15247fbc70e701a0145da851bf0475b7b447f'){throw 'Integrated profiler identity mismatch.'}
          $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){throw 'Integrated profiler failed PS5.1 parse.'}
          $s=Get-Content $p -Raw;$lab=$s.IndexOf('function Invoke-Lab {',[StringComparison]::Ordinal);$suspend=$s.IndexOf('Suspend-Resident',$lab,[StringComparison]::Ordinal);$align=$s.IndexOf('$script:ProductionAlignment=Align-ReleasedProductionBaseline -Accepted $accepted',$lab,[StringComparison]::Ordinal);$snap=$s.IndexOf('$script:OriginalConfigHash=Get-Sha256Lower $ConfigPath',$lab,[StringComparison]::Ordinal);if($lab-lt0-or$suspend-lt0-or$align-le$suspend-or$snap-le$align){throw 'Required suspend -> align -> snapshot ordering missing.'}
          $env:SPOTIFYCONTROL_TEST_RESIDUAL_CLEANUP='1';& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Action SelfTest;if($LASTEXITCODE-ne0){throw 'Integrated v0.5.1 SelfTest failed.'}
          Write-Host 'V051_FINAL_INTEGRATED_PACKAGE_PASS'

      - name: Download validated Bootstrap 1.0.6 carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' 'repos/sdsssdvx2/spotify-control-updates/actions/artifacts/12555778387/zip' > validated-v0614-repair-artifact.zip

      - name: Prepare exact v0.6.17 r7 fixture and run two-edge Bootstrap E2E
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.1/prepare_v0617_bootstrap_fixture.py
          if($LASTEXITCODE-ne0){throw 'Exact v0.6.17/r7 fixture preparation failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'validation/performance-phase2-v0.5.1/test_v0617_two_edge.ps1'
          if($LASTEXITCODE-ne0){throw 'Exact v0.6.17 -> v0.6.19 two-edge E2E failed.'}

      - name: Deterministic rebuild identity
        shell: powershell
        run: |
          $before=(Get-FileHash 'SpotifyControl-Track-Transition-Direct-Patch-Acceptance-v0.5.1.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          python validation/performance-phase2-v0.5.1/build_v051.py
          $after=(Get-FileHash 'SpotifyControl-Track-Transition-Direct-Patch-Acceptance-v0.5.1.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($before-ne$after-or$after-ne'db2d8836a7d865376c38688dfc3467b999e18437215ef4d5c44b7b9829cd0e11'){throw 'Deterministic rebuild mismatch.'}
          Write-Host 'V051_FINAL_DETERMINISTIC_REBUILD_PASS'

      - name: Upload exact final v0.5.1 package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Track-Transition-Direct-Patch-Acceptance-v0.5.1
          path: SpotifyControl-Track-Transition-Direct-Patch-Acceptance-v0.5.1.zip
          if-no-files-found: error
          retention-days: 14
