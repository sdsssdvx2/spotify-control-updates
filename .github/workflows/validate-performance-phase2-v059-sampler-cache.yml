name: Validate Performance Phase 2 v0.5.9 Sampler Cache
on:
  push:
    branches:
      - validate/performance-phase2-v0.5.9-sampler-cache
    paths:
      - 'validation/performance-phase2-v0.5.9/**'
      - '.github/workflows/validate-performance-phase2-v059-sampler-cache.yml'
  pull_request:
    paths:
      - 'validation/performance-phase2-v0.5.9/**'
      - '.github/workflows/validate-performance-phase2-v059-sampler-cache.yml'
permissions:
  contents: read
jobs:
  validate-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove validation-only scope
        shell: powershell
        run: |
          $base='29d6c52c6a79559e513b367ec57edcccebae5fd0'
          git cat-file -e "$base^{commit}"
          $changed=@(git diff --name-only "$base...HEAD")
          $bad=@($changed|Where-Object{$_ -ne 'validation/performance-phase2-v0.5.9/build_v059.py' -and $_ -ne '.github/workflows/validate-performance-phase2-v059-sampler-cache.yml'})
          if($bad.Count){throw "Validation branch touched production/out-of-scope files: $($bad -join ', ')"}
          if($changed.Count -ne 2){throw "Expected exactly 2 validation-only files, found $($changed.Count): $($changed -join ', ')"}
          Write-Host 'PHASE2_V059_SCOPE_PASS'
      - name: Build exact deterministic package
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.9/build_v059.py
          if($LASTEXITCODE -ne 0){throw "v0.5.9 build failed: $LASTEXITCODE"}
          $zip='SpotifyControl-Production-Lazy-Overlay-Media-Command-Free-Idle-Revalidation-v0.5.9.zip'
          $unpack='phase2-v059-unpacked'
          if(Test-Path $unpack){Remove-Item $unpack -Recurse -Force}
          Expand-Archive -LiteralPath $zip -DestinationPath $unpack
          $ps1=Join-Path $unpack 'idle-overlay-media-command-free-revalidation.ps1'
          $zs=(Get-Item $zip).Length;$zh=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $ps=(Get-Item $ps1).Length;$ph=(Get-FileHash $ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zs -ne 163324 -or $zh -ne '2930fc1607e9306054494b82be850552bb2df46ea707acfef7b9c4225511ff60'){throw "Package identity drifted: $zs/$zh"}
          if($ps -ne 129843 -or $ph -ne 'a032e0bc6ef03889464e46281951562eeb56ac60a5bade7c6667b3bfbf98c74d'){throw "PS1 identity drifted: $ps/$ph"}
          Write-Host "PHASE2_V059_IMMUTABLE_IDENTITY_PASS zip=$zs/$zh ps1=$ps/$ph"
      - name: PowerShell 5.1 parse and cached-sampler contract
        shell: powershell
        run: |
          $p='phase2-v059-unpacked\idle-overlay-media-command-free-revalidation.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message)};throw 'Generated v0.5.9 failed PowerShell 5.1 parse.'}
          $s=Get-Content $p -Raw
          foreach($x in @('media-command-free-idle','sample_coverage_ratio','sample_interval_p95_ms','role_cim_lookups_during_measurement','sampler_revision=''v0.5.9-cached-logical-cpu-incremental-role-cache''','logical_cpu_count=$logical','WS_EX_NOACTIVATE','SuspendAll()','spotify_play_command_used=$false','spotify_next_command_used=$false','spotify_pause_command_used=$false','verified_media_commands_expected=0','production_overlay_state_unchanged_exact','extension_payloads_mutated=$false','global_media_keys_used=$false')){if($s.IndexOf($x,[StringComparison]::Ordinal) -lt 0){throw "Missing v0.5.9 contract: $x"}}
          foreach($x in @('TryPlayAsync','TryPauseAsync','TrySkipNextAsync','Invoke-SpotifyMediaCommand','-Command Play','-Command Pause','-Command Next','keybd_event','SpotifyControlMediaKeys','Send-MediaKey','[byte]0xB0','[byte]0xB3')){if($s.IndexOf($x,[StringComparison]::OrdinalIgnoreCase) -ge 0){throw "Forbidden media-control surface survived: $x"}}
          if(([regex]::Matches($s,'Get-CimInstance Win32_Processor')).Count -ne 1){throw 'Win32_Processor CIM must exist exactly once in generated PS1.'}
          function Get-FunctionText([string]$name){$start=$s.IndexOf("function $name {");if($start -lt 0){throw "Function missing: $name"};$end=$s.IndexOf("`r`nfunction ",$start+20);if($end -lt 0){$end=$s.IndexOf("`nfunction ",$start+20)};if($end -lt 0){$end=$s.Length};return $s.Substring($start,$end-$start)}
          $logic=Get-FunctionText 'Get-LogicalCpuCount'
          $cache=$logic.IndexOf('if($null -ne $script:LogicalCpuCount',[StringComparison]::Ordinal);$cim=$logic.IndexOf('Get-CimInstance Win32_Processor',[StringComparison]::Ordinal)
          if($cache -lt 0 -or $cim -lt 0 -or $cache -ge $cim){throw 'Logical CPU cache does not short-circuit before Win32_Processor CIM.'}
          $measure=Get-FunctionText 'Measure-IdleCondition'
          if($measure.IndexOf('Get-CimInstance',[StringComparison]::OrdinalIgnoreCase) -ge 0){throw 'Timed measurement function contains direct CIM.'}
          $prime=$measure.IndexOf('$logical=[int](Get-LogicalCpuCount)',[StringComparison]::Ordinal);$roles=$measure.IndexOf('Update-RoleCache -Pids',[StringComparison]::Ordinal);$clock=$measure.IndexOf('$clock=[Diagnostics.Stopwatch]::StartNew()',[StringComparison]::Ordinal)
          if($prime -lt 0 -or $roles -lt 0 -or $clock -lt 0 -or $prime -ge $clock -or $roles -ge $clock){throw 'CPU/role invariants are not primed before timed measurement.'}
          if($measure.IndexOf('*0.75',[StringComparison]::Ordinal) -lt 0){throw 'Original 75% sample-coverage acceptance threshold was weakened.'}
          $role=Get-FunctionText 'Update-RoleCache'
          foreach($x in @('ContainsKey($pidInt)){continue}','Get-CimInstance Win32_Process','$script:RoleCimLookups')){if($role.IndexOf($x,[StringComparison]::Ordinal) -lt 0){throw "Incremental role-cache contract missing: $x"}}
          if($role.IndexOf('RoleCacheSignature',[StringComparison]::Ordinal) -ge 0){throw 'Whole-map role-cache invalidation survived v0.5.9.'}
          $prep=Get-FunctionText 'Prepare-Variant';$arm=$prep.IndexOf('Arm-SpotifySilentGuard',[StringComparison]::Ordinal);$launch=$prep.IndexOf('Start-SpotifyHiddenForVariant',[StringComparison]::Ordinal);if($arm -lt 0 -or $launch -lt 0 -or $arm -ge $launch){throw 'Audio guard is not armed before Spotify launch.'}
          Write-Host 'PHASE2_V059_PS51_CACHED_SAMPLER_STATIC_PASS'
      - name: Verify exact packaged production overlay sources
        shell: powershell
        run: |
          $expected=@{
            'phase2-v059-unpacked\overlay\apply-overlay.ps1'='053a597e834aab959a588350160ce81046ceda66e2a2ac233eeff8af78fea544'
            'phase2-v059-unpacked\overlay\lazy-custom-app-loader.js'='c38af0f6266747f50d2a0c05e9a49d5ffb34135738715fab6321ff4ae79623d9'
            'phase2-v059-unpacked\overlay\targets.json'='c255e53066abbd730467e0c1d92e81dd907e1ea2f245daf6f0d080d2239fea35'
          }
          foreach($p in $expected.Keys){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $expected[$p]){throw "Overlay source identity mismatch: $p $h"}}
          Write-Host 'PHASE2_V059_OVERLAY_SOURCE_PASS'
      - name: Run generated Windows real-engine and guard SelfTest
        shell: powershell
        env:
          SPOTIFYCONTROL_TEST_RESIDUAL_CLEANUP: '0'
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File phase2-v059-unpacked\idle-overlay-media-command-free-revalidation.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "v0.5.9 SelfTest failed: $LASTEXITCODE"}
      - name: Verify internal checksums and deterministic rebuild
        shell: powershell
        run: |
          foreach($line in Get-Content phase2-v059-unpacked\SHA256SUMS.txt){if($line -notmatch '^([0-9a-f]{64})  (.+)$'){throw "Bad checksum row: $line"};$p=Join-Path phase2-v059-unpacked ($Matches[2]-replace '/','\');$h=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $Matches[1]){throw "Checksum mismatch: $($Matches[2])"}}
          $zip='SpotifyControl-Production-Lazy-Overlay-Media-Command-Free-Idle-Revalidation-v0.5.9.zip';$s1=(Get-Item $zip).Length;$h1=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          python validation/performance-phase2-v0.5.9/build_v059.py
          if($LASTEXITCODE -ne 0){throw 'Second deterministic build failed.'}
          $s2=(Get-Item $zip).Length;$h2=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($s1 -ne $s2 -or $h1 -ne $h2 -or $s2 -ne 163324 -or $h2 -ne '2930fc1607e9306054494b82be850552bb2df46ea707acfef7b9c4225511ff60'){throw "Non-deterministic v0.5.9 package: $s1/$h1 vs $s2/$h2"}
          Write-Host "PHASE2_V059_DETERMINISTIC_IDENTITY_PASS size=$s2 sha=$h2"
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Production-Lazy-Overlay-Media-Command-Free-Idle-Revalidation-v0.5.9
          path: SpotifyControl-Production-Lazy-Overlay-Media-Command-Free-Idle-Revalidation-v0.5.9.zip
          if-no-files-found: error
          retention-days: 14
