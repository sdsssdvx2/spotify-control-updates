name: Validate Performance Phase 2 v0.5.2 Silent Targeted

on:
  push:
    branches:
      - validate/performance-phase2-v0.5.2
    paths:
      - 'validation/performance-phase2-v0.5.2/**'
      - '.github/workflows/validate-performance-phase2-v052.yml'
  pull_request:
    branches: [main]
    paths:
      - 'validation/performance-phase2-v0.5.2/**'
      - '.github/workflows/validate-performance-phase2-v052.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove production surface untouched
        shell: powershell
        run: |
          $base='6e2dd5cec54ca795457935d6bee83f63d39722bf'
          git cat-file -e "$base^{commit}"
          $changed=@(git diff --name-only "$base...HEAD")
          foreach($path in $changed){if($path -eq 'manifest.json' -or $path.StartsWith('packages/') -or $path.StartsWith('bin/') -or $path.StartsWith('performance/overlay/')){throw "Production surface changed: $path"}}
          Write-Host 'V052_PRODUCTION_ISOLATION_PASS'
      - name: Build v0.5.2 package from exact v0.5.1 provenance
        shell: powershell
        run: |
          python validation/performance-phase2-v0.5.2/build_v052_final.py
          if($LASTEXITCODE-ne0){throw 'v0.5.2 builder failed.'}
          $zip='SpotifyControl-Track-Transition-Silent-Targeted-Acceptance-v0.5.2.zip'
          Expand-Archive -LiteralPath $zip -DestinationPath phase2-v052 -Force
          foreach($line in Get-Content phase2-v052/SHA256SUMS.txt){if($line-notmatch '^([0-9a-f]{64})  (.+)$'){throw "Bad checksum row: $line"};$actual=(Get-FileHash -LiteralPath (Join-Path phase2-v052 $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant();if($actual-ne$Matches[1]){throw "Checksum mismatch: $($Matches[2])"}}
          Write-Host ('V052_PACKAGE_SIZE '+(Get-Item $zip).Length)
          Write-Host ('V052_PACKAGE_SHA '+(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())
      - name: Integrated PowerShell 5.1 parser and media isolation audit
        shell: powershell
        run: |
          $p='phase2-v052/track-transition-direct-patch-acceptance.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw 'Integrated v0.5.2 failed PowerShell 5.1 parse.'}
          $s=Get-Content $p -Raw
          foreach($bad in @('keybd_event','SpotifyControlMediaKeys','Send-MediaKey','[byte]0xB0','[byte]0xB3')){if($s.IndexOf($bad,[StringComparison]::OrdinalIgnoreCase)-ge0){throw "Legacy global media-key surface survived: $bad"}}
          foreach($good in @('TrySkipNextAsync','TryPlayAsync','TryPauseAsync','SPOTIFY_NEXT_CONFIRMED','SpotifyControlAudioSession','CaptureAndMute','Restore-SpotifyAudioForTest','global_media_keys_used=$false','$NextOffsets = @(5,13,21)','$TransitionSeconds = 27','$PlaybackWarmupSeconds = 8')){if($s.IndexOf($good,[StringComparison]::Ordinal)-lt0){throw "Missing v0.5.2 integrated contract: $good"}}
          Write-Host 'V052_INTEGRATED_MEDIA_ISOLATION_PASS'
      - name: Profiler self-test
        shell: powershell
        run: |
          $env:SPOTIFYCONTROL_TEST_RESIDUAL_CLEANUP='1'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File phase2-v052/track-transition-direct-patch-acceptance.ps1 -Action SelfTest
          if($LASTEXITCODE-ne0){throw "v0.5.2 SelfTest failed: $LASTEXITCODE"}
          Write-Host 'V052_SELFTEST_PASS'
      - name: Revalidate immutable patch engine behavior
        shell: powershell
        run: |
          $repoEngine=(Get-FileHash performance/direct-extension-patches/apply-direct-extension-patches.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $pkgEngine=(Get-FileHash phase2-v052/apply-direct-extension-patches.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($repoEngine-ne$pkgEngine -or $pkgEngine-ne'486254bc032bbcb2380f69ba01470bb2bda2e23718cc7bbaef1063fdb18c1803'){throw 'Patch engine identity changed.'}
          $repoTargets=(Get-FileHash performance/direct-extension-patches/targets.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $pkgTargets=(Get-FileHash phase2-v052/targets.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if($repoTargets-ne$pkgTargets -or $pkgTargets-ne'9b49d43bb8ff568f9e1a4f7009e2958edce0f77b857d948e563b81bb514aefa3'){throw 'Patch targets identity changed.'}
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File performance/direct-extension-patches/tests/test-direct-extension-patches.ps1
          if($LASTEXITCODE-ne0){throw 'Direct patch regression failed.'}
          Write-Host 'V052_PATCH_REGRESSION_PASS'
      - name: Deterministic rebuild
        shell: powershell
        run: |
          $zip='SpotifyControl-Track-Transition-Silent-Targeted-Acceptance-v0.5.2.zip'
          $a=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$len=(Get-Item $zip).Length
          python validation/performance-phase2-v0.5.2/build_v052_final.py
          if($LASTEXITCODE-ne0){throw 'Second v0.5.2 build failed.'}
          $b=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();if($a-ne$b -or $len-ne(Get-Item $zip).Length){throw "Non-deterministic v0.5.2 build: $a / $b"}
          Write-Host "V052_DETERMINISTIC_PASS size=$len sha=$b"
      - name: Upload exact v0.5.2 package
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-Track-Transition-Silent-Targeted-Acceptance-v0.5.2
          path: SpotifyControl-Track-Transition-Silent-Targeted-Acceptance-v0.5.2.zip
          if-no-files-found: error
          retention-days: 14
