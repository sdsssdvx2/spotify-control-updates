name: Validate Marketplace Lifecycle Settings Core v0.1.0

on:
  push:
    branches:
      - validate/marketplace-lifecycle-settings-core-v0.1.0
    paths:
      - 'validation/marketplace-lifecycle-settings-core-v0.1.0/**'
      - '.github/workflows/validate-marketplace-lifecycle-settings-core-v010.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'validation/marketplace-lifecycle-settings-core-v0.1.0/**'
      - '.github/workflows/validate-marketplace-lifecycle-settings-core-v010.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact validation scope
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim()
          $expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if($actual -cne $expected){throw "Not exact event head: $actual != $expected"}
          $base='d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2'
          if((git merge-base $base HEAD).Trim() -cne $base){throw 'Validation branch is not based on exact stable v0.6.28/r17 main.'}
          $allowed=@(
            '.github/workflows/validate-marketplace-lifecycle-settings-core-v010.yml',
            'validation/marketplace-lifecycle-settings-core-v0.1.0/build_candidate.py',
            'validation/marketplace-lifecycle-settings-core-v0.1.0/lifecycle-settings-core.ps1'
          )
          $changed=@(git diff --name-only "$base...HEAD")
          $unexpected=@($changed | Where-Object { $_ -notin $allowed })
          if($unexpected.Count){throw "Validation scope escaped: $($unexpected -join ', ')"}
          foreach($required in $allowed){if($required -notin $changed){throw "Missing expected validation file: $required"}}
          Write-Host "VALIDATION_SCOPE_PASS head=$actual"

      - name: Build exact stable base plus validation candidate
        shell: powershell
        run: |
          python -m py_compile validation/marketplace-lifecycle-settings-core-v0.1.0/build_candidate.py
          if($LASTEXITCODE -ne 0){throw 'Candidate builder failed Python compile.'}
          python validation/marketplace-lifecycle-settings-core-v0.1.0/build_candidate.py --build
          if($LASTEXITCODE -ne 0){throw 'Candidate build failed.'}

      - name: PowerShell 5.1 parse and integrated Addon SelfTest
        shell: powershell
        run: |
          $dir='validation/marketplace-lifecycle-settings-core-v0.1.0/out/bin'
          foreach($name in @('spotify-control.ps1','addon-manager.ps1')){
            $file=Join-Path $dir $name
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};throw "PowerShell 5.1 parse failed: $name"}
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Spotify')|Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $dir 'addon-manager.ps1') -Action SelfTest
          if($LASTEXITCODE -ne 0){throw 'Integrated Addon Manager SelfTest failed.'}
          Write-Host 'LIFECYCLE_SETTINGS_CORE_SELFTEST_PASS'

      - name: Assert authority and settings-preservation contracts
        shell: powershell
        run: |
          $report=Get-Content validation/marketplace-lifecycle-settings-core-v0.1.0/candidate-report.json -Raw|ConvertFrom-Json
          if($report.authority_expanded -ne $false){throw 'Validation candidate expanded mutation authority.'}
          $expected=@('better-local-files','eternal-jukebox','ivLyrics','playlist-maker')
          $actual=@($report.auto_authority|Sort-Object);$want=@($expected|Sort-Object)
          if(($actual -join '|') -cne ($want -join '|')){throw 'Auto mutation allowlist drifted.'}
          $addon=Get-Content validation/marketplace-lifecycle-settings-core-v0.1.0/out/bin/addon-manager.ps1 -Raw
          foreach($needle in @('user_removed','mutation_mode=''deny''','New-RequiredSpotifyPersistenceBackup','Restore-SpotifyPersistenceBackup','persistence_before_fingerprint','dynamic_lifecycle')){if($addon.IndexOf($needle,[StringComparison]::Ordinal) -lt 0){throw "Missing candidate contract: $needle"}}
          Write-Host 'LIFECYCLE_SETTINGS_AUTHORITY_CONTRACT_PASS'

      - name: Deterministic candidate rebuild
        shell: powershell
        run: |
          $addon='validation/marketplace-lifecycle-settings-core-v0.1.0/out/bin/addon-manager.ps1'
          $first=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          python validation/marketplace-lifecycle-settings-core-v0.1.0/build_candidate.py --build
          if($LASTEXITCODE -ne 0){throw 'Second candidate build failed.'}
          $second=(Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if($first -cne $second){throw "Candidate build is nondeterministic: $first != $second"}
          Write-Host "DETERMINISTIC_CANDIDATE_PASS sha256=$second"

      - name: Prove production transport remains untouched
        shell: powershell
        run: |
          git diff --exit-code d38e88d9ae99f6a4983e2ad64f74f6fce7e6cde2...HEAD -- manifest.json manifest.schema.json packages README.md validation/v0.6.28 .github/workflows/validate-stable-main.yml
          if($LASTEXITCODE -ne 0){throw 'Validation branch changed production/stable surfaces.'}
          Write-Host 'PRODUCTION_SURFACE_UNCHANGED_PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-lifecycle-settings-core-v010
          path: |
            validation/marketplace-lifecycle-settings-core-v0.1.0/candidate-report.json
            validation/marketplace-lifecycle-settings-core-v0.1.0/out/bin/spotify-control.ps1
            validation/marketplace-lifecycle-settings-core-v0.1.0/out/bin/addon-manager.ps1
          if-no-files-found: error
